<script>
(function(w){
 'use strict';const ZH=w.ZH,assets=w.ZH_ACADEMY_ASSETS;if(!ZH||!assets||ZH.academy)return;
 const boot=ZH.boot||{},errors=[],banks=new Map(),states=new Map(),firsts=new Map(),saves=new Map();let tools,appPromise,sequence=0;
 const traceKey='issue-actions:'+(ZH.user?.email||'guest'),actions=ZH.session.get(traceKey,[]).slice(-6);
 const privateText=s=>String(s||'').replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi,'[帳號已隱藏]').slice(0,800);
 const isTest=()=>!!ZH.teacherPreview?.active();
 function error(e,operation){const record={at:new Date().toISOString(),operation:privateText(operation),message:privateText(e?.message||e||'操作未完成')};errors.push(record);if(errors.length>12)errors.shift();document.dispatchEvent(new CustomEvent('zh:issue',{detail:record}));}
 function saveStatus(){if(isTest())return'教師測試：進度只留在測試局';if(navigator.onLine===false)return'目前離線；請連線後確認雲端存檔';const list=[...saves.values()];if(list.some(s=>s.status==='pending'))return'正在同步，請稍候……';const fail=list.find(s=>s.status==='error');if(fail)return'尚未儲存：'+fail.message;const last=list.filter(s=>s.status==='saved').sort((a,b)=>b.at-a.at)[0];return last?(last.label||'遊戲進度')+'：'+(last.guest?'已保存在本分頁':'已儲存至學校帳號')+' · '+new Date(last.at).toLocaleTimeString('zh-TW',{hour12:false}):ZH.isGuest()?'訪客進度只保存在本分頁':'存檔狀態：等待本次儲存確認';}
 function paint(){if(!tools)return;const el=tools.querySelector('[data-ac-status]');el.textContent=saveStatus();el.classList.toggle('ac-offline',navigator.onLine===false||[...saves.values()].some(s=>s.status==='error'));}
 document.addEventListener('click',e=>{if(boot.page==='teacher')return;const b=e.target.closest?.('button,a,summary');if(!b||b.closest('.ac-layer,.ac-tools'))return;const choice=b.matches('[data-choice],[data-key],.zh-choice,.zz-option')||b.closest('.zz-options,.za__choices,.zh-choices'),label=choice?'選擇閱讀題選項':privateText(b.textContent||b.getAttribute('aria-label')||'操作按鈕').trim().slice(0,90);if(!label)return;actions.push({at:new Date().toLocaleTimeString('zh-TW',{hour12:false}),label});if(actions.length>6)actions.shift();ZH.session.set(traceKey,actions);},true);
 const rawCall=ZH.call;ZH.call=async function(name,...args){const key=String(args[0])+':'+String(args[1]),seq=++sequence,write=name==='api_saveGame';if(write){saves.set(key,{status:'pending',seq});paint();}try{const r=await rawCall.call(ZH,name,...args);if(r?.ok===false||(write&&r?.ok!==true)){error(r?.msg||'操作未收到確認',name);if(write&&saves.get(key)?.seq===seq)saves.set(key,{status:'error',seq,message:privateText(r?.msg||'未收到儲存確認')});}else{if(['api_getStoryAnchors','api_getAnchors','api_getLearningReview'].includes(name)&&Array.isArray(r?.anchors))banks.set(args[0],r.anchors);if(name==='api_loadGame'&&r?.ok&&args[1]!=='history:academy')states.set(args[0],r.state);if(write&&saves.get(key)?.seq===seq)saves.set(key,{status:r?.preview?'test':'saved',seq,at:Date.now(),guest:!!r?.guest,label:args[1]==='history:academy'?'研讀紀錄':'遊戲進度'});}if(Array.isArray(r?.saves))r.saves=r.saves.filter(s=>s.mode!=='history:academy');paint();return r;}catch(e){error(e,name);if(write&&saves.get(key)?.seq===seq)saves.set(key,{status:'error',seq,message:privateText(e.message)});paint();throw e;}};
 const rawSave=ZH.save;ZH.save=async function(id,mode,state){const key=id+':'+mode,seq=++sequence;if(mode!=='history:academy')states.set(id,state);saves.set(key,{status:'pending',seq});paint();try{const r=await rawSave.call(ZH,id,mode,state);if(saves.get(key)?.seq===seq)saves.set(key,r?.ok?{status:r.preview?'test':'saved',seq,at:Date.now(),guest:!!r.guest,label:mode==='history:academy'?'研讀紀錄':'遊戲進度'}:{status:'error',seq,message:privateText(r?.msg||'未收到儲存確認')});paint();return r;}catch(e){if(saves.get(key)?.seq===seq)saves.set(key,{status:'error',seq,message:privateText(e.message)});paint();throw e;}};
 const rawLoad=ZH.load;ZH.load=async function(id,mode){const r=await rawLoad.call(ZH,id,mode);if(r?.ok&&mode!=='history:academy')states.set(id,r.state);return r;};
 if(ZH.records?.summary){const original=ZH.records.summary.bind(ZH.records);ZH.records.summary=async(...a)=>{const r=await original(...a);if(Array.isArray(r?.saves))r.saves=r.saves.filter(s=>s.mode!=='history:academy');return r;};}
 const rawTrack=ZH.track;ZH.track=function(kind,data){const r=rawTrack.call(ZH,kind,data);if(kind==='anchor'&&data?.scenarioId&&!data.cancelled&&data.firstTry!==false&&!(data.attempt>1)){const key=(isTest()?'test:':'')+data.scenarioId,items=firsts.get(key)||{};if(!items[data.anchorId])items[data.anchorId]={...data};firsts.set(key,items);document.dispatchEvent(new CustomEvent('zh:academy-answer',{detail:{...data,test:isTest()}}));}if(kind==='minigame')document.dispatchEvent(new CustomEvent('zh:academy-game',{detail:{...data,test:isTest()}}));return r;};
 function ensure(){if(!appPromise)appPromise=import(ZH_STATIC_URL(assets.app)).then(m=>m.install({ZH,assets,banks,states,firsts,errors,actions,saveStatus,error})).catch(e=>{appPromise=null;throw e;});return appPromise;}
 async function open(tab='challenge',id){try{document.dispatchEvent(new CustomEvent('zh:academy-open'));const app=await ensure();await app.open(tab,id);}catch(e){error(e,'learning-workshop');ZH.toast('學習工坊暫時無法開啟，請重試。'+privateText(e.message),'bad');}}
 ZH.academy={version:'4.8.0',open,error,saveStatus,isTest,banks,states,firsts,errors};
 ZH.ready(()=>{const link=document.createElement('link');link.rel='stylesheet';link.href=ZH_STATIC_URL(assets.css);document.head.appendChild(link);tools=document.createElement('aside');tools.className='ac-tools';tools.setAttribute('aria-label','學習工坊與存檔狀態');tools.innerHTML='<span data-ac-status role="status" aria-live="polite"></span><button type="button" data-ac="challenge">進階挑戰</button><button type="button" data-ac="diagnosis">學習診斷</button><button type="button" data-ac="evidence">原文證據與辯論</button><button type="button" data-ac="report">回報問題</button>';const main=document.querySelector('main');if(main)main.before(tools);else document.body.prepend(tools);tools.addEventListener('click',e=>{const b=e.target.closest('[data-ac]');if(b)open(b.dataset.ac);});paint();if(ZH.session.get('academy-original:'+boot.page,null)?.active)ensure().catch(e=>error(e,'academy-challenge-load'));});
 for(const event of ['online','offline'])w.addEventListener(event,paint);
 w.addEventListener('error',e=>{if(e.message)error(e.message,'page');});w.addEventListener('unhandledrejection',e=>error(e.reason,'promise'));
})(window);
</script>
