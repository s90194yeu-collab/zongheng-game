     攻守（攻城、圍困、整軍）、盟秦（犒秦師、會秦伯、合圍）、

     再作答「不仁、不知、不武」（wz_22～wz_24）、吾其還也（wz_25），
     最後是課文之後的公子蘭（wz_27）。
     答得越到位，結局越好：退而全霸、全師而還、怏怏而還。
   失敗結局：得鄭失秦（鄭城被攻破，歧路）、師老無功（軍力歸零）、諸侯離心（霸業歸零）。
   錨點（9 題，依序）：wz_21、wz_26、wz_13、wz_14、wz_22、wz_23、wz_24、wz_25、wz_27
   存檔：ZH.save(劇本, 'history:jin', { faction: 'jin', engine })

    return null;
  }

  const answersOf = s => s.flags.rebut || {};
  const okCount = s => REBUTS.filter(r => answersOf(s)[r.id] === 'ok').length;

      .then(() => qinGone(ctx))

  function decide(ctx) {
    if (ctx.flag('c_decide')) return Promise.resolve();
    return stage(ctx, TENT).then(() => { rebutUI(ctx); return ctx.say([{ who: 'zifan', text: '秦國背盟而去，請國君下令，追擊秦軍！', expr: 'angry' }]); })

  function rebut(ctx, r) {
    const done = ctx.flag('rebutDone') || {};
    if (done[r.id]) return Promise.resolve();
    return stage(ctx, TENT).then(() => { rebutUI(ctx); return ctx.say([r.push]); })
      .then(() => choose(ctx, r))
      .then(() => ctx.say([r.line]))
      .then(() => ctx.anchor(r.anchor))
      .then(() => {
        const d = Object.assign({}, ctx.flag('rebutDone') || {});
        d[r.id] = 1;
        ctx.flag('rebutDone', d);
        rebutUI(ctx);
        return ctx.save();
      });
  }

  /** 從霸業帳挑一條回答子犯；帳裡沒有的話，只能說「再議」 */
  function choose(ctx, r) {
    const held = INTEL.filter(i => i.kind === BOOK && ctx.hasIntel(i.id));
    for (let i = held.length - 1; i > 0; i--) {
      const j = Math.floor(ctx.rng() * (i + 1));
      const t = held[i]; held[i] = held[j]; held[j] = t;
    }
    const options = held.map(i => ({ label: i.title, desc: i.text, value: i.id }))
      .concat([{ label: '帳裡沒有合適的理由', desc: '只好說：「這件事，再議。」', value: 'none' }]);
    return ctx.choose({
      title: '答子犯',
      text: '子犯說：「' + r.push.text + '」你要拿哪一條理由回答他？',
      options: options
    }).then(pick => {
      const has = ctx.hasIntel(r.book);
      const res = pick === r.book ? 'ok' : pick === 'none' ? (has ? 'missed' : 'unknown') : 'wrong';
      const a = Object.assign({}, answersOf(ctx.state));
      a[r.id] = res;
      ctx.flag('rebut', a);
      rebutUI(ctx);
      const title = (INTEL.find(i => i.id === r.book) || {}).title;
      if (res === 'ok') {
        ZH.sfx('seal');
        ctx.fx.float('hanling', '說服：' + r.title, '#f0d27a');
        ctx.log('回答子犯：' + r.title + '（' + title + '），子犯無話可說。', 'good');
        return ctx.say([{ who: 'jinwengong', text: r.ok }]);
      }
      ZH.sfx('ng');
      ctx.log('回答子犯：' + r.title + (res === 'unknown' ? '，帳裡沒有合適的理由。' : '，理由沒有說到點上。'), res === 'unknown' ? '' : 'bad');
      const line = res === 'unknown' ? '這件事，再議。'
        : res === 'missed' ? '……（其實帳裡有一條正好可以回答他：「' + title + '」。寡人一時沒想起來。）'
          : '……';
      return ctx.say([
        { who: 'jinwengong', text: line },
        { who: 'zifan', text: res === 'wrong' ? '國君說的是另一回事，臣聽不明白。' : '國君說不出道理，臣不服。' }
      ]);
    });
  }

  /** 回答子犯的三個理由（舞台開著時放在舞台上） */
  function rebutUI(ctx) {
    const map = layer(ctx, '.wz-pers');
    if (!map) return;
    let box = map.querySelector('.wz-pers');
    if (!box) {
      box = ZH.html('<div class="wz-pers" aria-live="polite"><div class="wz-pers__head"><b>答子犯</b><span class="wz-pers__num"></span><span class="wz-pers__stage"></span></div>' +
        '<div class="wz-pers__bar" role="progressbar" aria-label="說服子犯" aria-valuemin="0" aria-valuemax="3"><i></i></div><div class="wz-pers__args"></div></div>');
      map.appendChild(box);
    }
    const a = answersOf(ctx.state);
    const n = okCount(ctx.state);
    box.querySelector('.wz-pers__num').textContent = '說到點上 ' + n + ' / ' + REBUTS.length;
    box.querySelector('.wz-pers__stage').textContent = n >= 3 ? '子犯心服' : n === 2 ? '子犯沉默' : '子犯不服';
    box.querySelector('.wz-pers__bar').setAttribute('aria-valuenow', String(n));
    box.querySelector('.wz-pers__bar i').style.width = (100 * n / REBUTS.length) + '%';
    box.querySelector('.wz-pers__args').innerHTML = REBUTS.map(r => {
      const v = a[r.id];
      const mark = v === 'ok' ? '✓' : v === 'unknown' ? '？' : v ? '✗' : '・';
      return '<span class="' + (v === 'ok' ? 'is-ok' : v === 'missed' || v === 'wrong' ? 'is-miss' : '') + '">' + mark + ' ' + esc(r.title) + '</span>';
    }).join('');
  }

    ZH.sfx('seal');
    return ctx.banner(e.title, '晉國篇・終')
      .then(() => stage(ctx, { base: 'road', who: 'jin', tod: 'dusk', place: '歸晉的路上', time: '黃昏', cast: ['jinwengong'] }))
      .then(() => ctx.say([
        { who: '史官', text: t === 'great' ? '晉國沒有攻下鄭國，卻讓鄭國自己來求和；也沒有和秦國翻臉。霸主的分寸，就在進退之間。'
          : t === 'good' ? '晉侯忍住了一口氣，保住了盟友，也保住了晉軍。'
            : '晉侯還是退兵了，可是他說不清楚為什麼。帳下的將領，有人心裡不服。' },
        { who: '史官', text: '兩年後，晉文公去世。秦國派兵東襲鄭國，晉國在殽山攔截秦軍……秦、晉之好，終究走到了盡頭。' }
      ]))
      .then(() => { W.markDone('晉'); return ZH.deleteSave(SID, SLOT).catch(() => null); })
      .then(() => ZH.finishScenario(payload(s, e)));
  }


  // ═════════════════════════ 計分與列傳 ═════════════════════════

  function scores(s) {
    const c = s.cmdCount || {};
    const a = answersOf(s);
    const ok = okCount(s);
    const unknown = REBUTS.filter(r => a[r.id] === 'unknown').length;
    const strategy = Math.round(25 + ok * 13 + unknown * 3 + s.res.hege * 0.15 + (s.intel.indexOf('lan') > -1 ? 4 : 0) + (s.intel.indexOf('chu') > -1 ? 3 : 0) -
      (c.storm || 0) * 6 - (s.flags.pressQin ? 5 : 0) - (s.flags.promise ? 4 : 0));
    // 德望：善待盟友、不濫用兵力；強攻、逼秦、窺探盟友被抓到都扣分
    const virtue = Math.round(40 + s.res.ally * 0.25 + (c.feast || 0) * 3 + (c.drill || 0) * 2 -
      (c.storm || 0) * 8 - (s.flags.pressQin ? 8 : 0) - (s.flags.spyCaught ? 6 : 0));
    return { strategy: Math.max(0, Math.min(100, strategy)), virtue: Math.max(0, Math.min(100, virtue)) };
  }

  function deeds(s) {
    const f = s.flags;
    const c = s.cmdCount || {};
    const has = id => s.intel.indexOf(id) > -1;
    const list = ['晉侯以鄭無禮於晉，且貳於楚，與秦伯合兵圍鄭，晉軍函陵，秦軍氾南。'];
    if (f.lanAsked) list.push('鄭公子蘭從，請無與圍鄭。公許之，使待命于東。');
    const att = (c.attack || 0) + (c.storm || 0);
    list.push(att >= 4 ? '日夜攻鄭，鄭人困甚。' : att >= 1 ? '數攻鄭城。' : (c.besiege ? '圍而不攻。' : '頓兵城下。'));
    if (c.storm) list.push('嘗悉眾急攻，士卒多傷。');
    if (c.feast) list.push('犒秦師，' + (has('grace') ? '念秦伯納己之恩。' : '以結秦歡。'));
    if (f.meetQin) list.push('與秦伯會於軍中，秦伯問鄭地所屬。');
    if (c.joint) list.push('與秦合圍，旗鼓相應。');
    if (f.spyQin || f.spyCaught) list.push(f.spyCaught ? '使人窺秦營，為秦人所覺。' : '使人窺秦營，知秦師有歸心。');
    if (f.spyChu) list.push('偵楚，知楚不能救。');
    if (f.pressQin) list.push('嘗督秦師攻城，秦人不悅。');
    if (f.promise) list.push('許秦以鄭地，' + (f.qinLeft ? '秦伯猶去。' : '諸將不服。'));
    if (f.qinLeft) {
      list.push('秦伯與鄭人盟而還。子犯請擊之。');
      const n = okCount(s);
      list.push(n >= 3 ? '公以仁、知、武三言曉之，子犯服。' : n === 2 ? '公以仁、知、武論之，子犯猶有不平。' : '公不能盡言其故，子犯怏怏。');
    }
    return list;
  }

  function payload(s, ending) {
    const sc = scores(s);
    const ok = ending.good !== false;
    return {
      scenarioId: SID, mode: MODE, faction: '晉',
      role: '晉文公', roleKind: 'shijia', country: '晉',
      bioTitle: '晉世家', bioOpening: '晉文公重耳，晉獻公之子也。',
      ending: ending,
      scoreStrategy: sc.strategy, scoreVirtue: sc.virtue,
      turns: Math.min(s.turn, 12),
      durationSec: Math.min(5400, Math.round((Date.now() - (s.vars.startedAt || Date.now())) / 1000)), // 分次遊玩時最多記 90 分鐘
      deeds: deeds(s),
      anchors: s.anchors,
      games: [],
      codex: s.codex,
      opener: '余讀《左氏春秋》，至晉文公不擊秦師，未嘗不歎霸主之度也。',
      prompts: ok ? [
        '子犯主張追擊，晉文公不答應。如果你是子犯，你服氣嗎？為什麼？',
        '晉文公的「不仁、不知、不武」三個理由，哪一個你覺得最有說服力？',
        '晉國沒有攻下鄭國，最後卻讓鄭國來求和。大國的「贏」，一定要靠打仗嗎？'
      ] : [
        '這一局晉國沒能全身而退。你覺得問題出在哪裡？',
        '大國和盟友一起作戰時，怎麼樣才不會「失其所與」？',
        '史書上的晉文公，最後做了什麼選擇？你同意他的選擇嗎？'
      ],
      orders: s.orderSeq,
      intel: s.intel,
      rebut: answersOf(s)
    };
  }


  // ═════════════════════════ 存檔與流程 ═════════════════════════

  function saveState(state) {
    return ZH.save(SID, SLOT, { faction: 'jin', engine: state }).catch(() => null);
  }

  function onEnd(result, ctx) {
    if (result.type === 'council') {
      council(ctx);
      return;
    }
    const s = ctx.state;
    const e = result.ending;
    ZH.sfx('ng');
    const lines = e.id === 'conquer' ? [
      { text: e.text },
      { who: 'qinmugong', text: '（秦軍出了力，地卻全歸晉國。這個盟友……）' },
      { who: '史官', text: '史書上，鄭國沒有在這一年被攻破：秦軍先走了。晉侯最後面對的，是另一個抉擇。再試一次吧。' }
    ] : e.id === 'exhaust' ? [
      { text: e.text },
      { who: '史官', text: '霸主的兵力也是有限的。攻城之外，也要懂得整軍。' }
    ] : [
      { text: e.text },
      { who: '史官', text: '圍城不是比誰耐得住而已。諸侯都在看：晉國有沒有決心，又有沒有分寸。' }
    ];
    ctx.banner(e.title, '晉國篇・終')
      .then(() => ctx.say(lines))
      .then(() => ZH.deleteSave(SID, SLOT).catch(() => null))
      .then(() => ZH.finishScenario(payload(s, e)));
  }

  function start(saved) {
    const root = W.ROOT;
    root.innerHTML = '';
    const game = ZH.slg.create(root, {
      id: SID, mode: MODE, title: '秦晉圍鄭', subtitle: '晉國篇・第一幕　函陵',
      turns: LEAVE_NIGHT, orders: 3, player: 'jin',
      seed: Number(W.params.seed) || 0,
      turnName: n => '第 ' + n + ' 夜',
      endTurnLabel: '結束此夜',
      factions: W.FACTIONS, others: W.OTHERS, map: MAP, resources: RESOURCES, meters: METERS,
      characters: CHARACTERS, speakers: SPEAKERS, intel: INTEL,
      intelGoal: { kind: BOOK, total: 5, label: '晉國的霸業帳', note: '到了要做大決定的時候，帳裡的東西就是你的理由。' },
      commands: COMMANDS, events: EVENTS, ai: ai, upkeep: upkeep, check: check, onEnd: onEnd,
      tutorial: TUTORIAL, help: HELP, anchorTotal: ANCHOR_ORDER.length, anchorOrder: ANCHOR_ORDER,
      initState: () => ({ vars: { zhengWall: 80, qinHome: 30, startedAt: Date.now() } }),
      save: saveState
    });
    game.start(saved && saved.engine ? saved.engine : null);
  }

  W.sides.jin = {
    title: '晉國篇',
    slot: SLOT,
    start: start,
    continueLabel: saved => {
      const st = saved && saved.engine;
      if (!st) return '繼續';
      if (st.ended && st.ended.type === 'council') return '繼續（子犯請擊）';
      return '繼續（第 ' + st.turn + ' 夜）';
    }
  };
})(window.ZH);
</script>
