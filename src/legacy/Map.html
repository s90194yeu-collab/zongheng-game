<script>
(function () {
  'use strict';
  ZH.ready(function () {
    var root = document.getElementById('wd-root');
    var requested = String((ZH.boot.params && ZH.boot.params.w) || 'ch');
    var key = ['cq','zg','ch'].indexOf(requested) >= 0 ? requested : 'ch';
    var world = ZH.WORLDS && ZH.WORLDS[key];
    if (!world || !ZH.world) {
      root.innerHTML = '<div class="wd-boot" style="flex-direction:column;gap:12px;text-align:center;padding:16px">這一卷的天下大地圖還沒開放。<button type="button" class="zh-btn zh-btn--primary" id="wd-home">回首頁</button></div>';
      document.getElementById('wd-home').addEventListener('click', function () { ZH.go('hub'); });
      return;
    }
    root.innerHTML = '';
    ZH.world.start(root, world);
  });
})();
</script>
