const replies=[

['「天子之怒，伏屍百萬，流血千里。」','大王嘗聞布衣之怒乎？把話題轉到士的決心。','只有兵力多者才配說話。','替秦王增加傷亡數字。','立即承認安陵不能存在。','反問改變對方只以廣大兵力威懾的框架；是言辭應對。'],

['要用什麼支撐「士之怒」的陳述？','舉專諸、聶政、要離三人的例證。','把神異徵兆當成今日已觀測的紀錄。','只重複五百里地更大。','把三人改成秦王的來使。','三個例證與休祲服務說服；不把徵兆當作科學因果。'],
['「與臣而將四矣」將論證推向哪裡？','將自己與三士相接，表明決心而非旁觀。','要求四國立刻投降。','否認自己是安陵使者。','只用四這個數字威脅。','唐雎從例證轉到自身，使言辭成為面前的立場。'],
['秦王恃「流血千里」，唐雎如何反轉距離？','以「伏屍二人，流血五步」陳述近身威懾。','說安陵已可征服整個秦國。','保證不會產生任何代價。','將五步說成五百里。','千里與五步構成遠近、強弱反差；本關親選陳述，沒有攻擊操作。'],
['陳述的目標是什麼？','守住受託立場，使秦王正視對方的決心。','親手攻擊秦王獲得額外分數。','把一切外交都變成威脅。','以憤怒取代安陵的存續。','原文寫挺劍而起、秦王色撓。這是本篇的敘事結果；威懾有風險，不能當成一切外交的保證。']
].map((r,i)=>({id:i,pressure:r[0],options:r.slice(1,5),read:r[5]}));
function shinu(saved,rng){const init=orders=>({kind:'shinu',phase:'plan',cursor:0,rounds:0,stepTime:0,elapsed:0,force:10,pressure:20,anger:60,correct:0,wrong:0,combo:0,maxCombo:0,orders,actions:[],guideSteps:0,note:'親選八段陳述；每段4活動秒。'}),s=saved?copy(saved):{...init(replies.map(()=>shuffle([0,1,2,3],rng))),assisted:false};
 const record=a=>{if(s.actions.length<90)s.actions.push({...a,cursor:s.cursor});s.guideSteps+=Number(s.assisted);};
 const first=(passed,early=false)=>({score:early?0:clamp(Math.floor(s.correct/Math.max(1,s.correct+s.wrong)*6)+Number(s.maxCombo>=5)*2+Number(passed&&s.rounds<=8)*2,0,10),max:10,passed,elapsed:s.elapsed,force:s.force,pressure:s.pressure,anger:s.anger,rounds:s.rounds,combo:s.maxCombo,actions:copy(s.actions)});
 return{s,snapshot:()=>copy(s),current:()=>replies[s.cursor],race:()=>({me:s.force/100,rival:s.pressure/100}),begin(){if(s.phase!=='plan')return false;s.phase='reply';return true;},reply(index){if(s.phase!=='reply'||![0,1,2,3].includes(Number(index)))return false;const good=Number(index)===0;if(s.assisted&&!good){s.note='請親選提示的陳述：'+this.current().options[0];return false;}record({action:'reply',index:Number(index),correct:good});s.rounds++;if(good){s.correct++;s.combo++;s.maxCombo=Math.max(s.maxCombo,s.combo);s.force=clamp(s.force+12,0,100);s.pressure=clamp(s.pressure+5,0,100);s.anger=Math.max(0,s.anger-7);s.note=this.current().read;s.cursor++;}else{s.wrong++;s.combo=0;s.force=Math.max(0,s.force-8);s.pressure=clamp(s.pressure+20,0,100);s.anger=clamp(s.anger+10,0,100);s.note='陳述沒有守住使者的立場；親讀後再組織這一段。';}s.phase='event';s.stepTime=0;return true;},next(){if(s.phase!=='event')return false;record({action:'read'});if(s.cursor===8){s.first=s.first||first(s.force>=90&&s.pressure<100);s.phase=s.assisted||s.first.passed?'done':'failed';}else if(!s.assisted&&(s.pressure>=100||s.rounds>=12)){s.first=s.first||first(false);s.phase='failed';s.note='本次心理戰失利；保留原分，親自補做八段陳述。';}else s.phase='reply';return true;},advance(dt){if(s.assisted||s.phase!=='reply')return false;s.elapsed+=dt;s.stepTime+=dt;if(s.stepTime>=4){record({action:'timeout',correct:false});s.rounds++;s.wrong++;s.combo=0;s.pressure=clamp(s.pressure+20,0,100);s.force=Math.max(0,s.force-8);s.stepTime=0;s.phase='event';s.note='本段4秒已到。秦王威勢上升，親讀後再回應。';return true;}return false;},assist(){if(s.assisted||s.phase==='done')return false;s.first=s.first||first(false,true);Object.assign(s,init(copy(s.orders)),{assisted:true,note:'原分保留；依提示親選八段陳述。'});return true;},result(){return copy({...s.first,completed:s.phase==='done',assisted:s.assisted,guideSteps:s.guideSteps,assistance:s.assisted?{actions:s.actions,correct:s.correct}:null});}};
}
const DIRS=['left','down','up','right'],ARROWS={left:'←',down:'↓',up:'↑',right:'→'};
const movements=[{label:'變徵之聲',text:'高漸離擊筑，荊軻和而歌，為變徵之聲，士皆垂淚涕泣。',read:'先是悲涼低沉，送行者垂淚。曲調為遊戲節奏示意，不能當作古代旋律復原。'}, {label:'羽聲忼慨',text:'復為羽聲忼慨，士皆瞋目，髮盡上指冠。',read:'後轉激昂，送行者瞋目、髮上指冠；情緒轉折仍接向一去不返，不改成勝利凱歌；節奏表現與讀懂悲涼轉慷慨分開。'}];

function zhu(saved,rng){const init=notes=>({kind:'zhu',phase:'plan',time:0,elapsed:0,cursor:0,practice:0,practiceHit:false,hits:0,perfect:0,good:0,miss:0,stray:0,combo:0,maxCombo:0,cold:15,notes,judgements:[],actions:[],guideSteps:0,bridgeRead:false,note:'先親按四個方向練習，再進入六十秒送別。'}),s=saved?copy(saved):{...init(schedule(rng)),assisted:false};

function payload(s,ending){const scores=['shinu','zhu','liuguo'].map(k=>s.vars[k].firstScore);return{scenarioId:SID,chapterVersion:VERSION,runId:s.vars.runId,mode:MODE,faction:'燕',country:'燕',role:'荊軻',roleKind:'liezhuan',bioTitle:'刺客列傳',bioOpening:'荊軻者，衛人也。',ending,scoreStrategy:Math.round(scores.reduce((a,b)=>a+b,0)/30*100),scoreVirtue:Math.round(s.anchors.filter(a=>a.correct).length/12*100),turns:s.steps,durationSec:Math.min(5400,Math.round((Date.now()-s.startedAt)/1000)),deeds:['扮唐雎親選八段陳述，守住安陵受託立場；首次'+scores[0]+'分。','辨太子催促與等待同行之客，回讀荊軻的決心。','親練四方向、體驗二十四拍筑聲、讀兩段送別情緒；首次'+scores[1]+'分。','對讀秦舞陽失態、圖窮匕見、事敗自述與不欺其志。','親配六國與六段記載，核前230至前221年的先後；首次'+scores[2]+'分。'],anchors:copy(s.anchors),games:copy(s.games),codex:s.codex.slice(),opener:'遊戲史官評語（自擬）：余讀刺客之事，至易水之歌，慨然思其志。強秦迫近，使者守地，燕士赴命；成敗雖殊，立意可辨。然志有可思，方法亦有代價，不可以一時決絕盡代天下之計。願以原文辨其言，以親做知其難，兼看家國與生命，不欺所思之志。',prompts:['唐雎的士之怒與荊軻刺秦，哪一種更能保護家國？以原文與親選回應比較各自結果、條件及風險。','司馬遷為什麼替失敗的荊軻立傳？對讀或成或不成、不欺其志，結合等待同行者或易水兩段情緒。','用暴力解決危局，會讓誰付出代價？回看取約的寄望、田光與樊於期、荊軻及燕國，並提出另一種可能方法。'],experience:{firstAnchors:copy(s.vars.firstAnchors),shinu:copy(s.vars.shinu),zhu:copy(s.vars.zhu),liuguo:copy(s.vars.liuguo),decisions:copy(s.vars.choices)}};}
async function onEnd(r,ctx){const s=ctx.state;if(ORDER.some(id=>!s.anchors.some(a=>a.anchorId===id))||['ty_shinu','ty_zhu','wen_ty_liuguo'].some(id=>!s.games.some(g=>g.gameId===id&&!g.skipped))||['shinu','zhu','liuguo'].some(k=>!s.vars[k]?.completed)||CODEX_KEYS.some(id=>!s.codex.includes(id)))throw Error('必要體驗或對讀尚未完成，請接續本話。');const ending=ENDINGS[r.key]||ENDINGS.good,p=s.vars.finishPayload||payload(s,ending);await ctx.banner(ending.title,'刺客列傳・本局評語');await ctx.say([{text:ending.text},{who:'shi',expr:'serious',text:'到結算寫反思，把原文、首次判斷和親自操作放在一起。'}]);if(s.vars.submitted){ZH.session.set('result:'+SID,p);ZH.go('result',{s:SID});return;}s.vars.finishPayload=p;await checkpoint();await journal.flush();ZH.finishScenario(p);s.vars.submitted=true;await checkpoint();}
