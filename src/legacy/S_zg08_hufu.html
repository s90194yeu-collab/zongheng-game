 const key=e=>{if(!alive||pause()||e.altKey||e.ctrlKey||e.metaKey||e.repeat||e.target.matches('input,textarea,select'))return;let ok=false;if(kind==='qishe'&&s.phase==='ride'){if(e.code==='Space'){e.preventDefault();ok=act(s.assisted?'guide':'shoot');}else if(s.assisted&&e.key==='a')ok=act('aim');}if(kind==='lianjun'&&['orders','policy'].includes(s.phase)&&/^[1-5]$/.test(e.key))ok=act('army',M.armies[Number(e.key)-1].id);if(kind==='huoniu'&&s.phase==='run'){if(/^[1-3]$/.test(e.key))ok=act('lane',Number(e.key)-1);else if(['ArrowLeft','ArrowRight'].includes(e.key))ok=act('lane',Math.max(0,Math.min(2,s.lane+(e.key==='ArrowLeft'?-1:1))));else if(s.assisted&&e.code==='Space'){e.preventDefault();ok=act('guide');}}if(ok)e.preventDefault();};
