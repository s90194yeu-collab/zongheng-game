function yuliBoard(m){const s=m.s;if(s.phase==='event')return armyBoard(s)+paper('軍令回顧',s.note)+'<button class="zh-btn zh-btn--primary" data-next>已讀，接續軍令</button>';if(s.phase==='order'){const r=M.ORDERS[s.cursor];return armyBoard(s)+paper(r.label,'觀察敵軍，親選本次命令。')+'<div class="zz-cards">'+s.orders[s.cursor].map(i=>'<button class="zh-btn '+(s.assisted&&i===0?'zz-hint':'')+'" data-order="'+i+'">'+E(r.options[i])+'</button>').join('')+'</div>'+(s.assisted?'<p class="zz-follow">提示：'+E(r.options[0])+'</p>':'');}return armyBoard(s)+paper('魚麗之陳・先排五個單位','戰車在前，步卒在後方補隙。先選單位，再點槽位；所有槽位都須自己放。')+'<div class="zz-unit-picks">'+['car','foot'].map(type=>'<button class="zh-btn '+(s.selected===type?'zh-btn--primary':'')+'" data-select="'+type+'" aria-pressed="'+(s.selected===type)+'" '+(s.phase==='plan'?'disabled':'')+'>'+unitSvg(type)+(type==='car'?'戰車':'步卒')+'</button>').join('')+'</div><div class="zz-formation"><div class="zz-front">'+M.SLOTS.filter(a=>a.unit==='car').map(a=>slot(a,s)).join('')+'</div><div class="zz-back">'+M.SLOTS.filter(a=>a.unit==='foot').map(a=>slot(a,s)).join('')+'</div></div>'+(s.phase==='plan'?'<button class="zh-btn zh-btn--primary" data-begin>開始親排列陣</button>':'<button class="zh-btn zh-btn--primary" data-confirm '+(Object.keys(s.slots).length<5?'disabled':'')+'>核定陣形，開始軍議</button>');}

function play(kind){return(body,g)=>new Promise(resolve=>{
 const model=M[kind](g.getProgress().model,g.rng),s=model.s;let alive=true,last=performance.now(),lastFrame=0,lastUi=0,raf=0,bucket=-1,ui={};
 const race=g.race?g.race({me:{wait:'必要判斷',tunnel:'施工條件',yuli:'列陣軍令'}[kind],rival:'本段期限',goal:{wait:'三段時機',tunnel:'泉・大隧・入口',yuli:'五單位・三軍令'}[kind]}):{me(){},rival(){}};
 const persist=()=>g.setProgress({model:model.snapshot()}),active=()=>!pause()&&!s.paused;
 function clock(){if(ui.index)ui.index.textContent=kind==='wait'?'軍議 '+Math.min(3,s.cursor+1)+'／3':kind==='tunnel'?'施工 '+s.opened.length+'格':'軍令 '+s.cursor+'／3';if(ui.clock)ui.clock.textContent=s.paused?'已暫停':s.assisted?'原分保留・不限時':s.phase==='plan'||s.phase==='event'?'準備／閱讀・暫停':['done','failed'].includes(s.phase)?'本次結束':'剩 '+Math.ceil(s.left)+'秒';if(ui.note)ui.note.textContent=s.note;const r=model.race();race.me(r.me);race.rival(r.rival);}
 function paint(){if(!alive)return;const done=s.phase==='done',failed=s.phase==='failed',hadFocus=body.contains(document.activeElement);body.innerHTML='<div class="zz-game" data-kind="'+kind+'"><h2>'+({wait:'待時・先查證，再下令',tunnel:'闕地及泉・指揮工匠',yuli:'魚麗之陳・三軍相應'}[kind])+'</h2><div class="zz-live"><b data-index></b><span data-clock></span></div>'+(!done&&!failed?({wait:waitBoard,tunnel:tunnelBoard,yuli:yuliBoard}[kind])(model):'')+'<p class="zz-feedback" role="status" data-note></p>'+(done?'<p class="zz-follow">本次原分 '+s.first.score+'／10'+(s.assisted?'，必要操作已親做補足；原分保留。':'。')+'</p><button class="zh-btn zh-btn--primary" data-finish>交回挑戰成績</button>':'<div class="zz-help-row">'+(!failed?'<button class="zh-btn zh-btn--quiet" data-pause>'+(s.paused?'繼續操作':'暫停操作')+'</button>':'')+'<button class="zh-btn '+(failed?'zh-btn--primary':'zh-btn--quiet')+'" data-assist '+(s.assisted?'hidden':'')+'>協助補做・不限時</button></div>')+'</div>';ui={index:body.querySelector('[data-index]'),clock:body.querySelector('[data-clock]'),note:body.querySelector('[data-note]')};clock();if(hadFocus)(body.querySelector('[data-next],[data-finish],[data-confirm]:not(:disabled)')||body.querySelector('button:not(:disabled):not([hidden])'))?.focus({preventScroll:true});persist();g.setStatus(done?'必要體驗完成':failed?'請親做補足':s.assisted?'原分保留・親做補足':'正在挑戰');}
 const click=async e=>{if(!alive||pause())return;const b=e.target.closest('button');if(!b||b.disabled)return;if(b.hasAttribute('data-pause')){s.paused=!s.paused;last=performance.now();paint();return;}if(s.paused)return;
 if(b.hasAttribute('data-assist')){const ok=await ZH.modal({title:'不限時親自補做',body:'<p>提前協助原分0；失敗後原分保留。提示只指出操作，三段軍議、接通並拓寬大隧、五單位與三道軍令仍須親自完成。</p>',actions:[{label:'繼續挑戰',value:false,kind:'quiet'},{label:'親自補做',value:true,kind:'primary'}]});last=performance.now();if(ok&&alive){model.assist();paint();}return;}
 if(b.hasAttribute('data-finish')){if(s.phase!=='done')return;persist();alive=false;resolve({...model.result(),sec:s.elapsed});return;}
 for(const n of ['intel','order','mode','cell','select','slot','confirm','next','begin'])if(b.hasAttribute('data-'+n)){const changed=model[n](b.getAttribute('data-'+n));if(changed)g.sfx('click');paint();return;}};
 const blur=()=>persist();body.addEventListener('click',click);document.addEventListener('visibilitychange',blur);window.addEventListener('blur',blur);
 function frame(now){if(!alive)return;raf=requestAnimationFrame(frame);if(now-lastFrame<32)return;lastFrame=now;const dt=Math.max(0,Math.min(.25,(now-last)/1000));last=now;if(!active())return;const phase=s.phase;model.advance(dt);if(s.phase!==phase)paint();else if(now-lastUi>=200){lastUi=now;clock();}const next=Math.floor(s.elapsed/5);if(next!==bucket){bucket=next;persist();}}
 g.onCleanup(()=>{alive=false;cancelAnimationFrame(raf);body.removeEventListener('click',click);document.removeEventListener('visibilitychange',blur);window.removeEventListener('blur',blur);});paint();raf=requestAnimationFrame(frame);
 });}
async function challenge(ctx,id,kind,title,goal){const r=await ctx.minigame({id,title,goal,help:HELP,hideClock:true,skip:false,attempts:3},play(kind)),first=r.firstResult||r;if(!r.completed)throw Error('必要操作尚未完成，請接續親做補足。');ctx.state.vars[kind]=copy({...r,firstScore:first.score,firstMax:first.max});return r;}

function payload(s,ending){const a=s.vars.wait.firstScore,b=s.vars.tunnel.firstScore,c=s.vars.yuli.firstScore,virtue=Number(firstGood(game.ctx,'zz_02'))+Number(firstGood(game.ctx,'zz_08'))+Number(firstGood(game.ctx,'zz_12'))+Number(s.vars.choices.responsibility==='admit')+Number(s.vars.choices.reconcile==='speak');return{scenarioId:SID,chapterVersion:VERSION,runId:s.vars.runId,mode:MODE,faction:'鄭',country:'鄭',role:'鄭莊公',roleKind:'shijia',bioTitle:'鄭世家・莊公',bioOpening:'鄭莊公寤生，鄭武公之子也。',ending,scoreStrategy:Math.round(a*3+b*3+c*4),scoreVirtue:virtue*20,turns:s.steps,durationSec:Math.min(5400,Math.round((Date.now()-s.startedAt)/1000)),deeds:['拒制而允京，親判城制、兩屬與襲鄭之期；待時首次'+a+'分。','命子封伐京，段出奔共；回讀稱鄭伯、譏失教。','暫扮潁考叔留肉獻食；指揮工匠闕泉、拓隧，首次'+b+'分。','母子相見如初，辨愛其母、施及莊公。','回看周鄭交質與取麥禾；親排魚麗、下三道令，首次'+c+'分。','繻葛戰後止追，夜使祭足勞王，辨自救與禮。'],anchors:copy(s.anchors),games:copy(s.games),codex:s.codex.slice(),opener:'遊戲史官評語（自擬）：莊公以國君而處兄弟之爭，忍待其變，既克段，猶受失教之譏。誓而後悔，考叔以孝感之，闕泉成隧，母子復相見。周鄭失信，繻葛交兵，既勝而止追，遣使勞王。其謀可察，其責不可略；讀者當並觀言行，不以勝負盡定其人。',prompts:['「子姑待之」是謀略還是養惡？對讀祭仲、公子呂的建議及「譏失教」，結合一次待時軍報判斷。','「隧而相見」解開誓言，是否也解開親情？對讀潁考叔留肉與「施及莊公」，用一次施工操作說明形式與修復的差別。','莊公如何兼顧自保與禮？對讀魚麗軍議、止追與夜勞王，說明何時應集中力量、何時應收手。'],experience:{firstAnchors:copy(s.vars.firstAnchors),wait:copy(s.vars.wait),tunnel:copy(s.vars.tunnel),yuli:copy(s.vars.yuli),decisions:copy(s.vars.choices)}};}
