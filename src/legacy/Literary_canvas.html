<script>
(function(ZH){
 'use strict';const L=ZH.literary;
 function draw(ctx,w,t,images){
  const cfg=t.mission,P=L.U.cells(),pick=i=>i===w.selected,light='#edcf84',ink='#f3e6bc',green='#a8d4bd',red='#e7a28b',blue='#9bcddd';
  function rect(x,y,a,b,fill='#173444dd',stroke='#dcc17c88',r=10){ctx.beginPath();ctx.roundRect(x,y,a,b,r);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke();}}
  function text(s,x,y,size=22,color=ink,align='center'){ctx.textAlign=align;ctx.font='600 '+size+'px "PingFang TC",sans-serif';ctx.lineWidth=4;ctx.strokeStyle='#0d2632';ctx.strokeText(String(s),x,y);ctx.fillStyle=color;ctx.fillText(String(s),x,y);}
  function circle(x,y,r,fill,stroke){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=3;ctx.stroke();}}
  function line(a,b,color=light,width=4){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
  function arrow(a,b,color=light,width=4){line(a,b,color,width);const q=Math.atan2(b.y-a.y,b.x-a.x);line(b,{x:b.x-16*Math.cos(q-.45),y:b.y-16*Math.sin(q-.45)},color,width);line(b,{x:b.x-16*Math.cos(q+.45),y:b.y-16*Math.sin(q+.45)},color,width);}
  function actor(p,label='你',img=images.player,s=.9){ctx.save();ctx.translate(p.x,p.y);ctx.scale(s,s);ctx.fillStyle='#06151d77';ctx.beginPath();ctx.ellipse(0,12,25,9,0,0,Math.PI*2);ctx.fill();if(img?.complete&&img.naturalWidth)ctx.drawImage(img,-29,-65,58,80);else{circle(0,-28,15,'#f1cba2');rect(-18,-14,36,38,'#679c99',light);}if(label)text(label,0,43,18);ctx.restore();}
  function sel(p,r=55){circle(p.x,p.y,r,'#f0d17c13','#f5d58d');}
  function card(p,top,bottom,selected=false,color='#24464ae9'){rect(p.x-87,p.y-46,174,92,color,selected?'#ffe4a0':'#b7d1bd88');text(top,p.x,p.y-6,23);if(bottom!==undefined)text(bottom,p.x,p.y+27,19,green);}
  function edges(nodes,es,color='#c7c49a88'){es.forEach(([a,b])=>line(nodes[a],nodes[b],color,5));}
  function scenery(){ctx.clearRect(0,0,1000,560);if(images.scene?.complete&&images.scene.naturalWidth)ctx.drawImage(images.scene,0,0,1000,560);else{ctx.fillStyle='#294d53';ctx.fillRect(0,0,1000,560);}ctx.fillStyle='#0d293785';ctx.fillRect(0,0,1000,560);rect(25,15,950,61,'#0a2530da','#d6bf7866');text(cfg.title,500,41,24);text(cfg.genre+' · '+cfg.place,500,64,17,green);}
  function board(nodes=L.options(w),drawCell){for(let i=0;i<nodes.length;i++){const p=nodes[i];if(drawCell)drawCell(p,i);else card(p,i+1,'',pick(i));}}
  function path(points,color,width){for(let i=1;i<points.length;i++)line(points[i-1],points[i],color,width);}
  scenery();
  switch(w.mode){
   case 'archive':{
    for(let i=0;i<6;i++){const x=130+i*145,y=260;rect(x-48,120,96,330,'#b8a36bdc',pick(i)?'#fff0b3':'#5b553c',13);line({x:x-35,y:155},{x:x+35,y:155},'#5c5943',3);line({x:x-35,y:415},{x:x+35,y:415},'#5c5943',3);if(w.covers[i]){rect(x-45,220,90,90,'#a35d61');text('飾',x,272,32);}else{text(w.flip[i]?w.order[i]+1:w.order[i],x,205,38,'#fff2c9');text('↓',x,282,36);text(w.flip[i]?w.order[i]:w.order[i]+1,x,360,38,'#fff2c9');}text(i+1,x,490,21,pick(i)?light:green);}text('斷口由 0 接到 6；翻轉與交換都會留下次序',500,530,20);break;}
   case 'waterworks':{
    board(L.options(w),(p,i)=>{rect(p.x-91,p.y-55,182,110,w.index===1?(w.clay[i]?'#aa8d60':'#96cfddaa'):'#173d49',pick(i)?light:'#9dbbbe88');if(w.index===1){text(w.clay[i]?'泥壁':'空腔',p.x,p.y+7,27);}else{const m=w.pipes[i],c=w.flow.includes(i)?'#8fdbed':'#c7c5a1';circle(p.x,p.y,12,c);for(let d=0;d<4;d++)if(m&(1<<d))line(p,{x:p.x+[0,90,0,-90][d],y:p.y+[-53,0,53,0][d]},c,14);}text(i+1,p.x-70,p.y-34,16,green);});text('水源 →',60,94,20,blue,'left');text('→ 低田出口',840,530,20,blue);break;}
   case 'slices':{
    const holes=[[0,2],[0,1],[0,3]];for(let i=0;i<3;i++){const x=190+i*310;circle(x,310,115,'#9f856fbb',pick(i)?light:'#c7af83');holes[i].forEach(a=>{const angle=(a+w.rot[i])*Math.PI/2-Math.PI/2;circle(x+Math.cos(angle)*67,310+Math.sin(angle)*67,34,'#142f3e',green);});text('剖面 '+(i+1),x,135,25);text('旋轉 '+w.rot[i]+' 格',x,482,21,green);}text('找相同方向的天然空隙，再檢視是否相通',500,530,22);break;}

   case 'chess':{
    rect(75,95,850,430,'#b99e6eda',light);for(let i=0;i<12;i++){const p=P[i];rect(p.x-90,p.y-55,180,110,'#dcc38b33',pick(i)?light:'#5c6a5188');if(w.blocked.includes(i)){line({x:p.x-22,y:p.y-22},{x:p.x+22,y:p.y+22},'#795b53',5);}if(w.enemy.includes(i)){circle(p.x,p.y,33,'#a3675d',red);text('勢',p.x,p.y+8,27);}if(i===11)text('他方海路',p.x,p.y+7,23,green);}circle(P[w.piece].x,P[w.piece].y,34,'#4c8c91',light);text('我',P[w.piece].x,P[w.piece].y+8,27);break;}
   case 'academy':{
    const nodes=L.options(w);['晨講','問對','著錄'].forEach((s,i)=>text(s,65,170+i*130,21,green));board(nodes,(p,i)=>{card(p,['禮義','名實','論辯'][w.target[i]],w.slots[i]<0?'待排':w.names[w.slots[i]],pick(i),i<w.session*3?'#3a685e':'#24464ae9');});break;}
   case 'ritual':{
    rect(310,180,380,160,'#a7895bdc',light);text('共用工位',500,245,29);text(w.busy<0?'空置待安排':'學徒'+(w.busy+1)+'正在作工',500,290,23);w.workers.forEach((p,i)=>{const x=170+i*330;actor({x,y:440},'學徒'+(i+1),null);if(pick(i))sel({x,y:410},56);text('餘力 '+p.energy.toFixed(1)+'／已作 '+p.done,x,510,20);});text(w.rule?'輪用規程：'+w.queue.map(i=>i+1).join(' → '):'工具不可同時爭用',500,125,23);break;}
   case 'reciprocity':{
    const ns=L.options(w);edges(ns,w.links,'#d6d0a6');ns.forEach((p,i)=>{ctx.fillStyle=i%2?'#9a8370':'#728f78';ctx.beginPath();ctx.moveTo(p.x-60,p.y-25);ctx.lineTo(p.x,p.y-75);ctx.lineTo(p.x+60,p.y-25);ctx.fill();card(p,'第'+(i+1)+'戶','存糧 '+w.stock[i],pick(i));if(i===w.from)sel(p,75);});break;}
   case 'itinerary':{
    const ns=L.options(w);edges(ns,w.edges,'#c8be8c');board(ns,(p,i)=>{card(p,w.names[i],w.record.includes(i)?'已有記錄':'',pick(i));});actor({x:ns[w.node].x,y:ns[w.node].y+24},'行訪者',images.player,.8);break;}
   case 'commons':{
    text('共有糧 '+w.pot,500,150,35);for(let i=0;i<3;i++){const p={x:200+i*300,y:340};ctx.fillStyle='#a68c63';ctx.beginPath();ctx.ellipse(p.x,p.y+55,90,24,0,0,Math.PI*2);ctx.fill();for(let n=0;n<w.grants[i];n++)circle(p.x-55+n%5*26,p.y+40-Math.floor(n/5)*22,11,'#e1c576','#fff0ae');if(pick(i))sel(p,100);text(['官府','農戶','軍旅'][i],p.x,235,27);text('所需 '+w.needs[i]+'／已分 '+w.grants[i],p.x,455,23);}text('另保種糧 '+w.seedGrain,500,515,23,green);break;}
   case 'care':{
    const ns=w.nodes;edges(ns,w.edges,'#dbcea07a');board(L.options(w),(p,i)=>{card(p,w.names[i],w.done.includes(i)?'已接應':'',pick(i));});w.helpers.forEach((a,i)=>{const p=ns[a.node];actor({x:p.x-45+i*90,y:p.y+30},a.to>=0?'往'+w.names[a.to]:'接力'+(i+1),images.player,.65);});break;}
   case 'regency':{
    rect(65,100,870,420,'#bca779b8',light);for(let i=0;i<12;i++){const p=P[i];rect(p.x-95,p.y-55,190,110,'#29444b66',pick(i)?light:'#abbba166');text(i+1,p.x-70,p.y-31,18);}w.tasks.forEach((ns,j)=>ns.forEach(n=>{circle(P[n].x,P[n].y,18,['#e8c57d','#9dcdcb','#d5998a'][j]);text(['諫','稽','軍'][j],P[n].x,P[n].y+7,18,'#153642');}));w.units.forEach((n,i)=>{card({x:P[n].x,y:P[n].y+20},['諫議官','稽核官','軍務官'][i],w.cover[i]?'已承接':'尚待承接',w.role===i,'#243e50ee');});break;}
   case 'engineer':{
    ['拒梯鉤','防衝樑','聽穴甕'].forEach((s,i)=>text(s,470+i*190,112,20,i===w.tool?light:green));for(let i=0;i<3;i++){const y=170+i*135;rect(90,y-45,120,90,'#ad9c78',pick(i)?light:'#d1c7a6');text('壁 '+w.wall[i],150,y+8,24);text(w.tools[i]<0?'空置':w.names[w.tools[i]],310,y+7,23,green);line({x:370,y},{x:940,y},'#bfcfbd66',3);}for(const e of w.enemies){const x=935-e.progress*710,y=170+e.lane*135;rect(x-40,y-30,80,60,['#bd8d68','#9b8b73','#776d80'][e.type],red);text(['雲梯','衝車','地道'][e.type],x,y+7,22);if(e.type===0){line({x:x-20,y:y-52},{x:x-20,y:y+48},light,4);line({x:x+20,y:y-52},{x:x+20,y:y+48},light,4);}}break;}
   case 'harbor':{
    rect(55,125,890,280,'#3f8095aa',blue);for(let n=0;n<8;n++){const y=180+n*26;line({x:60,y},{x:940,y:y+Math.sin(w.time+n)*7},'#a6d1d166',2);}w.ships.forEach((s,i)=>{const x=160+i*220,y=300+(i%2)*65;ctx.fillStyle=s.status==='done'?'#79b095':'#a7835c';ctx.beginPath();ctx.moveTo(x-75,y);ctx.lineTo(x+75,y);ctx.lineTo(x+45,y+45);ctx.lineTo(x-45,y+45);ctx.fill();for(let n=0;n<s.load;n++)rect(x-45+n*23,y-25,20,22,'#c4b081',light,2);if(pick(i))sel({x,y},90);text('吃水 '+s.draft.toFixed(1),x,y+85,23);});ctx.beginPath();ctx.strokeStyle=blue;ctx.lineWidth=4;for(let x=0;x<800;x++){const y=480-Math.sin((w.time+x/15)*.13)*32;const xx=x+100;x?ctx.lineTo(xx,y):ctx.moveTo(xx,y);}ctx.stroke();text('潮高曲線（隨時間變化）',500,540,21);break;}

   case 'seasons':{

   case 'tavern':{
    rect(60,180,880,280,'#957651d9',light);w.orders.forEach((o,i)=>{const p=P[i];card({x:p.x,y:150},o.name,o.absent?'未至':'實付'+o.paid+'文',pick(i));rect(p.x-35,250,70,110,'#b4c5bbaa',light);const h=Math.min(100,o.volume/2*100);rect(p.x-30,355-h,60,h,'#d0ae68cc',null,3);line({x:p.x-45,y:355-o.target/2*100},{x:p.x+45,y:355-o.target/2*100},light,3);text(o.served?'已留記錄':o.volume.toFixed(2)+'杯',p.x,400,21,o.served?green:ink);text('記 '+o.coins+' 文',p.x,440,22);});text('斟酒須停手，實收有據；空位不以傳聞填滿',500,520,23);break;}
