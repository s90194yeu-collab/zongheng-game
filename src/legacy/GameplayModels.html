function create(c,saved,seed=7219){

 function rng(){s.seed=(Math.imul(s.seed,1664525)+1013904223)>>>0;return s.seed/4294967296;}
 function event(type,data={}){s.events.push({type,time:Math.round(s.time*100)/100,...data});if(s.events.length>400)s.events.shift();}
 function score(){if(s.kind==='fighter')return clamp(Math.round(10*(s.defeated||0)/Math.max(1,c.waves||3)-(s.damage||0)/50),0,10);if(s.kind==='adventure')return clamp(Math.round(8*(s.found||[]).length/Math.max(1,s.items?.length||1)+2*Number(s.arrived)-(s.caught||0)),0,10);if(s.kind==='command')return clamp(Math.round(7*(s.flags||[]).filter(Boolean).length/Math.max(1,c.sectors||3)+3*s.units.filter(u=>u.side==='ally'&&u.hp>0).length/Math.max(1,s.allyCount)),0,10);if(s.kind==='simulation')return clamp(Math.round((c.mode==='farm'?Math.min(5,householdCount())+Math.min(3,wetFarms().length/5)+Math.min(2,s.checked.length):Math.min(4,s.period/5)+Math.min(2,s.food/15)+Math.min(2,s.wood/10)+Math.min(2,s.soldiers/3))),0,10);if(s.kind==='race')return clamp(Math.round(6*(s.races||[]).filter(r=>r.won).length/Math.max(1,c.matches||1)+4*(s.integrity||100)/100),0,10);if(s.kind==='archery')return Math.round(10*s.hits/Math.max(1,c.targets||20));if(s.kind==='cards')return clamp(Math.round(s.support/2+s.res.supply/15-s.pressure/15),0,10);if(s.kind==='rhythm')return Math.round(10*s.notes.filter(n=>n.hit).length/s.notes.length);return 0;}
 function freeze(completed=false){if(!s.first)s.first={score:score(),max:10,passed:completed&&score()>=7,sec:s.time,completed};}
 function finish(){event('objectiveComplete');s.phase='complete';if(!s.first)s.first={score:score(),max:10,passed:score()>=7,sec:s.time,completed:true};}

 function initialize(){
  if(s.kind==='adventure'){
   s.player={x:85,y:745,dir:1,stamina:100};s.checkpoint={x:85,y:745};s.path=[];s.caught=0;s.alarm=0;s.found=[];s.read=[];s.arrived=false;s.steps=0;s.echoHits=0;s.echoIndex=0;s.foxCalls=0;s.foxCharge=0;s.callRelease=false;
   const names=c.readings||((c.questNames||['營門消息','路口線索','會合信號']).map((name,i)=>({name,text:'教學情境：'+name+'。確認環境、同伴與接應後再前進。',id:'q'+i})));
   const spots=[[230,610],[440,115],[680,600],[880,160],[1180,610],[170,220],[1080,350],[800,735],[1280,110]];
   s.items=names.map((v,i)=>({...v,id:v.id||'q'+i,x:spots[i][0],y:spots[i][1]}));s.exit={x:1320,y:760};
   s.walls=[{x:310,y:300,w:220,h:100},{x:740,y:320,w:230,h:100},{x:1040,y:520,w:50,h:150}];s.bushes=[{x:145,y:520,w:125,h:75},{x:580,y:175,w:130,h:85},{x:910,y:620,w:100,h:70}];
   s.guards=c.peaceful?[]:[{x:540,y:210,a:0,t:0,range:210},{x:950,y:520,a:Math.PI,t:2,range:195},{x:1150,y:170,a:1.5,t:4,range:185}];s.interacting=null;
  }
  if(s.kind==='fighter'){s.player={x:100,y:420,vy:0,dir:1,hp:100,stamina:100,attack:0,block:false,dodge:0};s.wave=0;s.defeated=0;s.damage=0;s.enemies=[];s.camera=0;s.hitFx=[];s.bolts=[];s.platforms=[{x:410,y:335,w:160},{x:990,y:325,w:160},{x:1590,y:340,w:180}];spawnFighter();}
  if(s.kind==='command'){
   const navy=c.mode==='naval';s.navy=navy;s.units=[];s.allyCount=navy?3:(c.allies||4);s.retreat=0;s.selected=0;s.command='move';s.flags=Array(c.sectors||3).fill(false);s.capture=Array(c.sectors||3).fill(0);s.supply=20;s.arrivals=[];s.lastReinforcement=0;
   for(let i=0;i<s.allyCount;i++)s.units.push({id:i,side:'ally',name:navy?['旗船','左翼船','接應船'][i]:(c.unitNames||['前隊','左翼','右翼','輜重','後備'])[i],x:navy?680:c.retreat?530:110,y:100+i*90,hp:100,max:100,range:i===3?145:70,cool:0,guard:false,target:null});
   for(let i=0;i<(navy?3:5);i++)s.units.push({id:10+i,side:'enemy',name:navy?'追船':'對方小隊',x:navy?820:650+(i%2)*75,y:80+i*75,hp:navy?70:65,max:navy?70:65,range:62,cool:1,target:null,guard:false});
   s.points=Array.from({length:c.sectors||3},(_,i)=>({x:navy?65:650+Math.floor(i/3)*80,y:80+(i%3)*145,name:navy?'接應水域':'接應 '+(i+1)}));

 }
 function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}
 function solid(x,y){return s.walls.some(r=>x>r.x-14&&x<r.x+r.w+14&&y>r.y-14&&y<r.y+r.h+14);}
 function lineBlocked(a,b){for(let i=1;i<16;i++)if(solid(a.x+(b.x-a.x)*i/16,a.y+(b.y-a.y)*i/16))return true;return false;}
 function adventureMove(x,y,dt){const p=s.player,nx=clamp(p.x+x*dt,25,1375),ny=clamp(p.y+y*dt,35,805);if(!solid(nx,p.y))p.x=nx;if(!solid(p.x,ny))p.y=ny;if(x)p.dir=Math.sign(x);if(x||y)s.steps+=dt;}
 function route(x,y){if(s.kind!=='adventure'||s.phase!=='play')return false;const tile=50,start=[Math.floor(s.player.x/tile),Math.floor(s.player.y/tile)],end=[clamp(Math.floor(x/tile),0,27),clamp(Math.floor(y/tile),0,16)],key=p=>p.join(','),q=[start],prev=new Map([[key(start),null]]);let found=false;for(let j=0;j<q.length;j++){const p=q[j];if(key(p)===key(end)){found=true;break;}for(const [dx,dy]of [[0,1],[1,0],[0,-1],[-1,0]]){const b=[p[0]+dx,p[1]+dy],k=key(b);if(b[0]<0||b[0]>27||b[1]<0||b[1]>16||prev.has(k)||solid(b[0]*tile+25,b[1]*tile+25))continue;prev.set(k,p);q.push(b);}}if(!found)return false;const a=[];for(let p=end;prev.get(key(p));p=prev.get(key(p)))a.unshift({x:p[0]*tile+25,y:p[1]*tile+25});s.path=a;event('route',{x,y});return true;}
 function interact(){if(s.phase!=='play'||s.kind!=='adventure')return false;const item=s.items.find((it,i)=>!s.found.includes(it.id)&&dist(s.player,it)<75&&(!c.questNames||s.found.length===i));if(item){s.interacting=item.id;if(c.id==='ch02_fox'&&s.items.indexOf(item)===2&&!s.foxDone){s.phase='fox';s.message='已抵叢祠，按住發聲三次；每次完成後先放開，再發下一聲。';return true;}if(c.id==='mc_hangu'&&s.items.indexOf(item)===3&&!s.echoDone){s.phase='echo';s.echoTime=0;s.echoIndex=0;s.echoHits=0;s.message='雞鳴教學：看節拍到中央，按互動鍵回應，共十二拍。';return true;}s.phase='reading';s.message=item.text;event('inspect',{id:item.id});return true;}if(dist(s.player,s.exit)<80&&s.found.length===s.items.length){s.arrived=true;finish();return true;}s.message='先走近未讀的標記，再按互動；全部完成後到接應出口。';return false;}
 function ack(){if(s.kind==='adventure'&&s.phase==='reading'){const it=s.items.find(x=>x.id===s.interacting);s.found.push(it.id);s.read.push({id:it.id,text:it.text,time:s.time});s.checkpoint={x:s.player.x,y:s.player.y};s.phase='play';s.interacting=null;s.message='已親讀，消息留在隨行紀錄。';event('read',{id:it.id});return true;}if(s.kind==='rhythm'&&s.phase==='review'){s.acks.push(s.readIndex);event('read',{index:s.readIndex});s.readIndex++;if(s.readIndex>=(c.readings||[]).length)finish();return true;}return false;}
 function spawnFighter(){const x=260+s.wave*340;s.enemies=[0,1].map(j=>({id:s.wave*2+j,x:x+j*125,y:420,vy:0,hp:j?70:95,max:j?70:95,dir:-1,mode:'approach',timer:.5+j*.3,kind:(s.wave+j)%3,flash:0}));s.message=['保持距離，看到起手再格擋。','對手擅長防守，重擊可破防。','對手會突進，跳躍或後撤再回擊。'][s.wave%3];}
 function strike(heavy=false){if(s.kind!=='fighter'||s.phase!=='play')return false;const p=s.player,cost=heavy?24:9;if(p.attack>0||p.stamina<cost)return false;p.stamina-=cost;p.attack=heavy?.62:.3;p.anim=heavy?'heavy':'attack';event(heavy?'heavy':'strike');for(const e of s.enemies){if(e.hp<=0||Math.abs(e.x-p.x)> (heavy?108:80)||Math.abs(e.y-p.y)>75||Math.sign(e.x-p.x)!==p.dir)continue;if(e.mode==='guard'&&!heavy){s.message='木兵被格開；試著變換距離或用重擊破防。';continue;}e.hp-=heavy?30:20;e.x+=p.dir*(heavy?35:15);e.mode='stun';e.timer=heavy?.85:.3;e.flash=.2;s.hitFx.push({x:e.x,y:e.y-65,t:.3});s.message=heavy?'破防，對手隊勢下降。':'命中，留意自己的體力。';event('hit',{heavy,enemy:e.id});}return true;}
 function jump(){if(s.kind!=='fighter'||s.phase!=='play'||!s.player.grounded)return false;s.player.vy=-520;s.player.grounded=false;event('jump');return true;}
 function hit(lane){if(s.kind==='adventure'&&s.phase==='echo'){const d=Math.abs((s.echoTime%1)-.5),ok=s.assisted||d<.21;if(ok){s.echoHits++;s.echoIndex++;s.echoTime=Math.floor(s.echoTime)+1;s.message='已應和 '+s.echoIndex+'／12';event('echo',{index:s.echoIndex});if(s.echoIndex===12){s.echoDone=true;s.phase='reading';s.message=s.items.find(x=>x.id===s.interacting).text;}}return ok;}if(s.kind!=='rhythm')return false;if(s.phase==='musicRepair'){const missed=s.notes.filter(n=>!n.hit),n=missed[s.repair];if(!n||n.lane!==lane)return false;s.repair++;event('repairNote',{lane});if(s.repair>=missed.length)musicReview();return true;}if(s.phase!=='play')return false;s.held[lane]=true;const n=s.notes.find(n=>!n.resolved&&!n.started&&n.lane===lane&&Math.abs(s.musicTime-n.due)<(s.assisted?.35:.19));if(!n){s.message='看音符到拍點線再敲；長音需要按住。';return false;}n.started=true;if(!n.len){n.hit=true;n.resolved=true;event('note',{lane});}return true;}
 function release(lane){if(s.kind==='rhythm')s.held[lane]=false;}
 function musicReview(){s.phase=(c.readings||[]).length?'review':'complete';if(s.phase==='complete')finish();s.readIndex=0;}
 function command(unit,x,y,order){if(s.kind!=='command'||s.phase!=='play')return false;const u=s.units.find(u=>u.id===unit&&u.side==='ally'&&u.hp>0);if(!u)return false;s.selected=unit;u.guard=order==='guard';u.target=order==='guard'?null:{x:clamp(x,30,870),y:clamp(y,45,450)};event('command',{unit,x,y,order:order||'move'});return true;}
 function select(unit){if(s.kind!=='command'||!s.units.some(u=>u.id===unit&&u.side==='ally'&&u.hp>0))return false;s.selected=unit;return true;}
 function reinforce(){if(s.kind!=='command'||s.phase!=='play'||s.supply<6||s.time-s.lastReinforcement<12)return false;s.supply-=6;s.lastReinforcement=s.time;const id=100+s.units.length;s.units.push({id,side:'ally',name:'援隊',x:40,y:280,hp:75,max:75,range:90,cool:0,guard:false,target:{x:360,y:270}});s.allyCount++;event('reinforce');return true;}
 function water(){const seen=new Set([30]),q=[30];for(let i=0;i<q.length;i++){const at=q[i];for(const n of [at-10,at+10,at-1,at+1])if(n>=0&&n<70&&Math.abs(n%10-at%10)+Math.abs(Math.floor(n/10)-Math.floor(at/10))===1&&!seen.has(n)&&s.tiles[n]?.kind==='canal'){seen.add(n);q.push(n);}}return [...seen];}
 function wetFarms(){if(s.kind!=='simulation')return[];const wet=water();return Object.keys(s.tiles).map(Number).filter(n=>s.tiles[n].kind==='farm'&&wet.some(a=>Math.abs(a%10-n%10)+Math.abs(Math.floor(a/10)-Math.floor(n/10))===1));}
 function householdCount(){const wet=wetFarms();return[0,1,2,3,4].filter(owner=>wet.filter(n=>s.tiles[n].owner===owner&&!s.disputes.includes(n)).length>=3).length;}
 const costs={canal:2,farm:3,workshop:7,house:8,barracks:10,dock:12};
 function build(at,tool=s.tool){if(s.kind!=='simulation'||s.phase!=='play'||!Number.isInteger(at)||at<0||at>69)return false;s.selectedCell=at;if(tool==='inspect'){if(s.disputes.includes(at)){s.disputes=s.disputes.filter(n=>n!==at);s.checked.push(at);event('restoreBoundary',{at});return true;}return false;}if(s.tiles[at])return true;if(!costs[tool]||s.wood<costs[tool])return false;s.wood-=costs[tool];s.tiles[at]={kind:tool,owner:s.owner,workers:0};if(c.mode==='farm'&&tool==='farm')s.tiles[at].workers=1;event('build',{at,kind:tool,owner:s.owner});return true;}
 function assign(at,delta){if(s.kind!=='simulation'||s.phase!=='play'||!s.tiles[at]||s.tiles[at].kind==='canal'||![1,-1].includes(delta))return false;const b=s.tiles[at];if(delta>0&&(s.idle<1||b.workers>=3)||delta<0&&!b.workers)return false;b.workers+=delta;s.idle-=delta;event('assign',{at,delta});return true;}
 function chooseHorse(index){if(s.kind!=='race'||s.phase!=='choose'||!Number.isInteger(index)||index<0||index>2||s.used.includes(index))return false;s.horse=index;s.used.push(index);s.phase='play';s.distance=0;s.rival=0;s.speed=0;s.stamina=100;s.lateral=0;s.trackTime=0;s.obstacles.forEach(o=>o.hit=false);s.grain.forEach(o=>o.taken=false);event('horse',{index});return true;}
 function nextRace(){if(s.kind!=='race'||s.phase!=='pit')return false;s.match++;if(s.match>=(c.matches||1)){finish();}else s.phase='choose';return true;}
 function aim(x,y){if(s.kind!=='archery'||s.phase!=='play')return false;s.aim={x:clamp(x,20,880),y:clamp(y,40,390)};return true;}
 function shoot(){if(s.kind!=='archery'||s.phase!=='play'||s.ammo<=0||s.charge<.12)return false;const charge=clamp(s.charge,.12,1),error=(1-charge)*30;s.shots++;s.ammo--;s.projectiles.push({x:450+s.rider,y:440,tx:s.aim.x+s.wind*(1-charge)+(rng()-.5)*error,ty:s.aim.y+(rng()-.5)*error,t:0,duration:.24+(1-charge)*.2});s.charge=0;s.holding=false;event('arrow',{aim:copy(s.aim),charge});return true;}
 const cardPool={evidence:{name:'證據',cost:1,effect:'支持＋3；偵察後多＋2',icon:'簡'},guard:{name:'守約',cost:1,effect:'減輕本輪壓力 8',icon:'盾'},pact:{name:'盟約',cost:2,effect:'支持＋5；需補給 3',icon:'盟'},scout:{name:'查訪',cost:1,effect:'抽一張，下一張證據加成',icon:'察'},logistics:{name:'整備',cost:1,effect:'補給＋4，減壓 2',icon:'糧'},rebuttal:{name:'回應反例',cost:1,effect:'對查核意圖多減壓',icon:'辯'}};
 function drawCards(n){for(let j=0;j<n;j++){if(!s.draw.length&&s.discard.length){s.draw=s.discard.splice(0);shuffle(s.draw);}if(s.draw.length)s.hand.push(s.draw.pop());}}
 function startCardRound(){s.phase='play';s.ap=3;s.lastCard=null;s.roundCards=[];drawCards(5);s.intent=(s.round+Math.floor(rng()*3))%3;}
 function card(index){if(s.kind!=='cards'||s.phase!=='play'||!Number.isInteger(index))return false;const id=s.hand[index],v=cardPool[id];if(!v||s.ap<v.cost||id==='pact'&&s.res.supply<3)return false;s.ap-=v.cost;s.hand.splice(index,1);s.discard.push(id);s.roundCards.push(id);let detail='';if(id==='evidence'){const gain=3+(s.lastCard==='scout'?2:0);s.support+=gain;detail='支持＋'+gain;}if(id==='guard')s.pressure=Math.max(0,s.pressure-8);if(id==='pact'){s.res.supply-=3;s.support+=5;}if(id==='scout')drawCards(1);if(id==='logistics'){s.res.supply+=4;s.pressure=Math.max(0,s.pressure-2);}if(id==='rebuttal'){s.pressure=Math.max(0,s.pressure-(s.intent===2?12:4));s.support++;}s.message=v.name+'已生效。'+detail;s.lastCard=id;event('card',{id,round:s.round});return true;}
 function endCard(){if(s.kind!=='cards'||s.phase!=='play'||!s.roundCards.length)return false;const attack=[9,6,11][s.intent];s.pressure+=attack;if(s.intent===1)s.res.supply=Math.max(0,s.res.supply-2);if(s.intent===2&&!s.roundCards.includes('evidence'))s.support=Math.max(0,s.support-2);s.rounds.push({cards:s.roundCards.slice(),intent:s.intent,support:s.support,pressure:s.pressure,supply:s.res.supply});s.discard.push(...s.hand);s.hand=[];s.phase='cardReport';event('endRound',{round:s.round});return true;}
