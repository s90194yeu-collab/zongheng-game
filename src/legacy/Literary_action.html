 step(w,k,d){w.hidden=!!k.guard&&w.reeds.some(p=>D(w,p)<70);U.move(w,k,d,k.guard?90:190);w.mud=clamp(w.mud+(w.hidden?12:-1)*d,0,100);if(w.time-w.lastTrail>.5&&!w.hidden){w.lastTrail=w.time;w.trail.push({x:w.x,y:w.y,at:w.time});if(w.trail.length>22)w.trail.shift();}for(const h of w.hunters){const target=w.hidden?w.trail[Math.max(0,w.trail.length-5)]:w.trail[w.trail.length-1];if(target){const dd=D(h,target)||1;h.x+=(target.x-h.x)/dd*d*(w.assist?62:90);h.y+=(target.y-h.y)/dd*d*(w.assist?62:90);}if(D(w,h)<35&&!w.hidden)U.hurt(w,'追跡者已逼近，先找蘆葦收身斷跡。');}if(w.hidden){w.coverTime+=d;const ri=w.reeds.findIndex(p=>D(w,p)<70);if(w.coverTime>.7&&!w.covers.includes(ri)){w.covers.push(ri);fx(w,'這片蘆葦斷開了一次追跡。');}}else w.coverTime=0;if(w.hidden&&w.trail.length)w.trail=w.trail.filter(t=>w.time-t.at<1);if(w.mud<=0)w.hp=0;if(near(w,w.exit,45)&&w.time>4&&w.covers.length>=2)U.win(w,'泥途仍有轉身之處，沒有被帶上禮臺。');},

 function physics(w,k,d){const aerial=w.mode==='redsilk'&&!w.grounded;const speed=aerial?650:w.mode==='redsilk'&&k.guard&&w.grounded?95:220;w.vx+=(Number(!!k.right)-Number(!!k.left))*900*d;w.vx*=Math.exp(-d*(aerial?.25:k.right||k.left?2:7));w.vx=clamp(w.vx,-speed,speed);if(w.mode==='lifepath'&&w.x>1100&&w.x<1500)w.vx+=Math.sin(w.time)*80*d*(w.lessons>=4&&k.guard?.2:1);w.vy+=900*d;const py=w.y;w.x=clamp(w.x+w.vx*d,35,w.length-30);w.y+=w.vy*d;w.grounded=false;if(w.vy>=0)for(const p of platforms(w))if(w.x>=p.x&&w.x<=p.x+p.w&&py<=p.y+4&&w.y>=p.y){w.y=p.y;w.vy=0;w.grounded=true;break;}if(w.y>620){U.hurt(w,'落腳處不在這裡，回到上一處穩固平臺。');w.x=w.checkpoint||80;w.y=410;w.vy=0;w.vx=0;}}
