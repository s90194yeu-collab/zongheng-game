function title(saved){const compatible=saved?.vars?.schema===SCHEMA,st=compatible?saved:null;ROOT.innerHTML='<main class="mc-title"><div class="mc-title-bar"><span class="zh-mark"><span class="zh-mark__re">Re:</span><span class="zh-mark__name">縱橫鼎業</span></span><button class="zh-btn zh-btn--quiet" data-home>回首頁</button></div><header><p class="mc-kicker">戰國篇・第九話・齊</p><h1>孟嘗君</h1><p class="mc-subtitle">食客三千，最後救我的是會學雞叫的那位</p><div class="ep-chips"><span class="zh-chip zh-chip--patina">養士 × 市義 × 夜奔函谷關</span><span class="zh-chip">自動存檔</span></div></header><section class="mc-title-scene" aria-label="孟嘗君與馮諼">'+panorama('estate',['meng','feng'])+'</section><section class="mc-start"><span class="mc-seal" aria-hidden="true">客</span><div><h2>孟嘗君 → 馮諼 → 門客分工</h2><p class="mc-note">安排舍館、親合債券、看巡燈取裘與雞鳴節奏；最後讀王安石的評論。</p></div><div class="mc-start-actions">'+(st?'<button class="zh-btn zh-btn--primary" data-continue>'+(st.ended?'查看結局':'繼續遊戲')+'</button>':'')+'<button class="zh-btn '+(st?'zh-btn--quiet':'zh-btn--primary')+'" data-new>'+(st?'重新開始':'開始遊戲')+'</button></div></section><section class="mc-points"><div><b>三千食客</b><p class="mc-note">五回合親安排門客待遇；才能、需求、忠誠與錢糧一起考量。</p></div><div><b>焚券市義</b><p class="mc-note">先合券，再依償還能力取捨；看帳面與民心如何改變。</p></div><div><b>夜奔函谷關</b><p class="mc-note">先看巡燈取裘，再照節奏雞鳴，最後親驗傳出關。</p></div></section>'+(saved&&!compatible?'<p class="mc-follow">偵測到不同版本進度。新版另開一局，先前已登錄的成績與史冊保留。</p>':'')+'<p class="mc-note">預留約20～30分鐘。十一個原文對讀、三項必要體驗；卡關可不限時親自補做。v1.1.0</p></main>';const characterEntry=document.createElement('div');characterEntry.setAttribute('data-character-entry','');ROOT.querySelector('.mc-start').after(characterEntry);ZH.character?.mountEntry(characterEntry,SID,st);ROOT.querySelector('[data-home]').onclick=()=>ZH.go('hub');const cont=ROOT.querySelector('[data-continue]');if(cont)cont.onclick=()=>start(st);ROOT.querySelector('[data-new]').onclick=async()=>{if(loading)return;if(saved){const ok=await ZH.modal({title:'另開一局？',body:'<p>此話未完成的進度會清除；已登錄的成績與史冊保留。</p>',actions:[{label:'取消',value:false,kind:'quiet'},{label:'重新開始',value:true,kind:'primary'}]});if(!ok)return;}await journal.clear();start(null);};}
