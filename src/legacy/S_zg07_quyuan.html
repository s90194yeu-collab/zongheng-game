function payload(s,ending){const scores=['chanyan','xiangcao','jiangpan'].map(k=>s.vars[k].firstScore);return{scenarioId:SID,chapterVersion:VERSION,runId:s.vars.runId,mode:MODE,faction:'楚',country:'楚',role:'屈原',roleKind:'liezhuan',bioTitle:'屈原賈生列傳',bioOpening:'屈原者，名平，楚之同姓也。',ending,scoreStrategy:Math.round(scores.reduce((a,b)=>a+b,0)/30*100),scoreVirtue:Math.round(s.anchors.filter(a=>a.correct).length/12*80+Number(s.vars.choices.proof==='verify')*20),turns:s.steps,durationSec:Math.min(5400,Math.round((Date.now()-s.startedAt)/1000)),deeds:['左徒議國事、草擬憲令；對讀爭寵、草稿與王怒而疏。','親辨四門紙條，首次'+scores[0]+'分；分清讒言與附查核材料的異議。','親按十四株的詩句整理佩囊，首次'+scores[1]+'分；香草之義須依語境。','讀商於六百里與六里、武關受扣，辨秦惠王與秦昭王兩段敘事。','親沿岸查看五物、到渡口，首次'+scores[2]+'分；對讀屈原與漁父，再讀後世哀弔。'],anchors:copy(s.anchors),games:copy(s.games),codex:s.codex.slice(),opener:'遊戲史官評語（自擬）：余讀屈平之事，見信而疑、忠而謗，悲其才志之不遇。觀其紉芳為佩，知辭中所守；聽漁父滄浪之歌，又思原則與調適。明辨讒言，不可盡塞異議；自稱獨醒，仍當求證與求助。讀其志、惜其人，願以公議扶持方正，不以死亡證清白。',prompts:['「信而見疑，忠而被謗」如何發生？引用一段原文與一次首次紙條查核，分清讒言和可查核異議。','〈離騷〉的香草如何寫人格與政治？用兩段不同語境和一次佩囊分類，說明象徵可以變化。','屈原與漁父如何看待原則和時勢？引用一句話、江畔一件記憶，提出今日可行的調整或支持方法。'],experience:{firstAnchors:copy(s.vars.firstAnchors),chanyan:copy(s.vars.chanyan),xiangcao:copy(s.vars.xiangcao),jiangpan:copy(s.vars.jiangpan),decisions:copy(s.vars.choices)}};}
async function onEnd(r,ctx){const s=ctx.state;if(ORDER.some(id=>!s.anchors.some(a=>a.anchorId===id))||['qy_chanyan','wen_qy_xiangcao','qy_jiangpan'].some(id=>!s.games.some(g=>g.gameId===id&&!g.skipped))||['chanyan','xiangcao','jiangpan'].some(k=>!s.vars[k]?.completed)||CODEX_KEYS.some(id=>!s.codex.includes(id)))throw Error('必要體驗或對讀尚未完成，請接續本話。');const ending=ENDINGS[r.key]||ENDINGS.good,p=s.vars.finishPayload||payload(s,ending);await ctx.banner(ending.title,'屈原・本局列傳');await ctx.say([{text:ending.text},{who:'shiguan',expr:'serious',text:'到結算頁留下反思：把原文、首次紀錄與親自補做放在同一份證據中。'}]);if(s.vars.submitted){ZH.session.set('result:'+SID,p);ZH.go('result',{s:SID});return;}s.vars.finishPayload=p;await checkpoint();await journal.flush();ZH.finishScenario(p);s.vars.submitted=true;await checkpoint();}
async function start(saved){if(loading)return;loading=true;ROOT.innerHTML='';game=ZH.story.create(ROOT,{id:SID,mode:MODE,title:'屈原與楚',subtitle:'這個世界配不上我的香草',seed:Number(params.seed)||0,start:'n_01',characters:CHARACTERS,scenes:SCENES,nodes:NODES,meters:[{id:'trust',label:'王的信任',icon:'heart',max:100,start:70},{id:'slander',label:'讒言',icon:'flame',max:100,start:20,invert:true,danger:70},{id:'nation',label:'楚國國勢',icon:'crown',max:100,start:70}],help:HELP,anchorOrder:ORDER,anchorTotal:12,anchorRunner,snapshot,save,onProgress:save,onEnd,initState:()=>({vars:{schema:SCHEMA,runId:'qy_'+Date.now().toString(36)+'_'+crypto.getRandomValues(new Uint32Array(1))[0].toString(36),firstAnchors:{},choices:{}}})});window.__ep=game;loading=false;game.start(saved||null);}
function title(saved){const compatible=saved?.vars?.schema===SCHEMA,st=compatible?saved:null;ROOT.innerHTML='<main class="qy-title"><div class="qy-title-bar"><span class="zh-mark"><span class="zh-mark__re">Re:</span><span class="zh-mark__name">縱橫鼎業</span></span><button class="zh-btn zh-btn--quiet" data-home>回首頁</button></div><header><p class="qy-kicker">戰國篇・第七話・楚</p><h1>屈原與楚</h1><p class="qy-subtitle">這個世界配不上我的香草</p><div class="ep-chips"><span class="zh-chip zh-chip--patina">四門查核 × 文意分類 × 江畔行吟</span><span class="zh-chip">自動存檔</span></div></header><section class="qy-title-scene" aria-label="屈原與漁父的江畔對話">'+panorama('river',['qu','yufu'])+'</section><section class="qy-start"><span class="qy-seal" aria-hidden="true">芳</span><div><h2>你是屈原</h2><p class="qy-note">從楚廷爭稿到江畔行吟，親辨紙條、整理芳草、尋五件記憶。</p></div><div class="qy-start-actions">'+(st?'<button class="zh-btn zh-btn--primary" data-continue>'+(st.ended?'查看結局':'繼續遊戲')+'</button>':'')+'<button class="zh-btn '+(st?'zh-btn--quiet':'zh-btn--primary')+'" data-new>'+(st?'重新開始':'開始遊戲')+'</button></div></section><section class="qy-points"><div><b>讒言攔截</b><p class="qy-note">北東南西四門，攔下未查核的指控，讓真正奏章通行。</p></div><div><b>香草與惡草</b><p class="qy-note">按眼前詩句分類十四株，可按鍵、拖曳或點選佩囊。</p></div><div><b>江畔行吟</b><p class="qy-note">2D沿岸探索五件舊物，走近親讀，再到渡口會見漁父。</p></div></section>'+(saved&&!compatible?'<p class="qy-follow">偵測到不同版本進度。新版另開一局，先前已登錄的成績與史冊保留。</p>':'')+'<p class="qy-note">預留約20～30分鐘。十二個原文對讀、三項必要體驗；卡關可不限時親自補做。v1.1.0</p></main>';ROOT.querySelector('[data-home]').onclick=()=>ZH.go('hub');const cont=ROOT.querySelector('[data-continue]');if(cont)cont.onclick=()=>start(st);ROOT.querySelector('[data-new]').onclick=async()=>{if(loading)return;if(saved){const ok=await ZH.modal({title:'另開一局？',body:'<p>此話未完成的進度會清除；已登錄的成績與史冊保留。</p>',actions:[{label:'取消',value:false,kind:'quiet'},{label:'重新開始',value:true,kind:'primary'}]});if(!ok)return;loading=true;await journal.clear();try{await ZH.deleteSave(SID,MODE);}catch(e){}loading=false;}start(null);};}
ZH.ready(async()=>{if(!ZH.story?.createJournal||!ZH.arena||!window.ART){ROOT.innerHTML='<main class="qy-title"><h1>共用核心尚未齊備</h1><p>請使用目前的 Eng_Story、Art_kit 與 Arena_js，再載入第七話。</p><button class="zh-btn" data-home>回首頁</button></main>';ROOT.querySelector('[data-home]').onclick=()=>ZH.go('hub');return;}journal=ZH.story.createJournal({id:SID,mode:MODE,scope:ZH.user?.email||window.ZH_BOOT.user?.email||'guest',remote:s=>ZH.save(SID,MODE,{engine:s,chapterVersion:VERSION})});ZH.loading(true,'展開屈原與楚的竹簡');try{const [saved]=await Promise.all([load(),ZH.anchor.load(SID),ZH.codex.init()]);if(ORDER.some(id=>!ZH.anchor.get(SID,id)))throw Error('第七話題庫尚未加入，請一併放入 S_zg07_quyuan_data，並清除題庫快取後部署。');ZH.loading(false);if(String(params.mode||'')===MODE&&saved?.vars?.schema===SCHEMA)start(saved);else title(saved);}catch(e){ZH.loading(false);ROOT.innerHTML='<main class="qy-title"><h1>載入尚未完成</h1><p>'+E(e.message||String(e))+'</p><button class="zh-btn zh-btn--primary" data-reload>重新載入</button></main>';ROOT.querySelector('[data-reload]').onclick=()=>ZH.reloadPage();}});
})();
