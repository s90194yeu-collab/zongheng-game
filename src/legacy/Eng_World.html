    const gold=big?200:120,food=big?500:300;
    const d=openDlg('<div class="wd-dlg__body"><h2>由'+esc(CITY[cap].name)+'遷都</h2><p>金'+gold+'、糧'+food+'；各城民心−3，新都民心+5。主君搬入新都、下月到任；其他人物保留原駐地。新都仍可能遭敵軍圍攻。</p><div class="wd-form"><label>新國都<select data-new-cap>'+candidates.map(c=>'<option value="'+c+'">'+esc(CITY[c].name)+' · 城防'+Math.round(S.C[c].df)+' · 民心'+Math.round(S.C[c].mx)+'</option>').join('')+'</select></label></div><p data-note aria-live="polite"></p><div class="wd-dlg__acts"><button class="zh-btn" data-cancel>取消</button><button class="zh-btn zh-btn--primary" data-confirm>遷入新都</button></div></div>');
    $('[data-cancel]',d.el).addEventListener('click',()=>d.close());$('[data-confirm]',d.el).addEventListener('click',()=>{const cid=$('[data-new-cap]',d.el).value,f=S.F[S.player];if(!idle(ruler)||!candidates.includes(cid)||W.besieged(cid)||f.g<gold||f.f<food){$('[data-note]',d.el).textContent='金糧不足或城邑、人選條件已改變。';return;}f.g-=gold;f.f-=food;f.cap=cid;S.P[ruler].loc=cid;S.P[ruler].busy=S.t+1;S.P[ruler].used=S.t;S.migrationAt[S.player]=S.t;citiesOf(S.player).forEach(c=>S.C[c].mx=clamp(S.C[c].mx-3,0,100));S.C[cid].mx=clamp(S.C[cid].mx+5,0,100);chron('由'+CITY[cap].name+'遷都'+CITY[cid].name+'。');log('新都定於'+CITY[cid].name+'，主君下月到任。','good');d.close();refresh(false);focusCity(cid,homeW(),0);saveGame(false);});
  }
  function openReform() {
    const current=S.reforms[S.player],done=S.reformDone[S.player]||[];if(current&&!current.finished){ZH.toast('先完成目前的變法；每月需金40、糧100，缺糧時進度會暫停。','bad');return;}
    const big=nationRank()==='major',policies=RULE.reforms.filter(p=>(big||!p.major)&&!done.includes(p.id)),cost=big?200:120;
    if(policies.length<2){ZH.toast('此國可行的新政已不足兩項；已成政策會持續生效。');return;}
    const d=openDlg('<div class="wd-dlg__body"><span class="wd-kicker">'+(big?'大國軍政':'小國保民')+'</span><h2>變法・親選兩策</h2><p>起辦金'+cost+'；各城民心先−6。施行六個月，每月金40、糧100。資源不足就暫停；完成後兩策生效，同一政策不重複疊加。</p><div class="wd-list">'+policies.map(p=>'<label class="wd-opt"><input type="checkbox" data-policy value="'+p.id+'"> <b>'+esc(p.name)+'</b><span>'+esc(p.text)+'</span></label>').join('')+'</div><p data-note aria-live="polite"></p><div class="wd-dlg__acts"><button class="zh-btn" data-cancel>取消</button><button class="zh-btn zh-btn--primary" data-confirm>頒布新政</button></div></div>',{wide:true});
    $('[data-cancel]',d.el).addEventListener('click',()=>d.close());$('[data-confirm]',d.el).addEventListener('click',()=>{const picks=$$('[data-policy]:checked',d.el).map(p=>p.value),f=S.F[S.player];if(picks.length!==2||picks.some(p=>!policies.some(x=>x.id===p))||f.g<cost){$('[data-note]',d.el).textContent='請選兩項尚未施行的政策，並備足起辦金。';return;}f.g-=cost;citiesOf(S.player).forEach(c=>S.C[c].mx=clamp(S.C[c].mx-6,0,100));S.reforms[S.player]={at:S.t,choices:picks,progress:0,paused:false,finished:false};chron('開始變法：'+picks.map(id=>policies.find(p=>p.id===id).name).join('、')+'。');log('新政開始，需持續投入六個月。','ev');d.close();refresh(false);saveGame(false);});
  }
  function rulesMonth() {
    S.hostages.filter(h=>!h.returned).forEach(h=>{if(!alive(h.from)||!alive(h.to)||!S.P[h.person]||S.P[h.person].st!=='h')returnHostage(h,'國勢改變，擔保終止');else if(S.t>=h.until){returnHostage(h,'期滿歸國');addRel(h.from,h.to,5);}else if(hostile(h.from,h.to)){returnHostage(h,'雙方交戰，擔保終止');addRel(h.from,h.to,-15);}});
    Object.keys(S.reforms).forEach(fid=>{const r=S.reforms[fid];if(r.finished||!alive(fid))return;const f=S.F[fid];if(f.g<40||f.f<100){if(!r.paused)log('新政因金糧不足暫停，補足後繼續。','ev');r.paused=true;return;}f.g-=40;f.f-=100;r.paused=false;r.progress++;
      if(r.progress<RULE.nation.reformMonths)return;r.finished=true;r.finishedAt=S.t;const mods=S.reformMods[fid]=S.reformMods[fid]||{},done=S.reformDone[fid]=S.reformDone[fid]||[];
      r.choices.forEach(id=>{const p=RULE.reforms.find(x=>x.id===id);if(!p||done.includes(id))return;done.push(id);Object.keys(p.fx).forEach(k=>mods[k]=(mods[k]||0)+p.fx[k]);if(p.once.fame)W.addFame(fid,p.once.fame);citiesOf(fid).forEach(c=>{['mx','co'].forEach(k=>{if(p.once[k])S.C[c][k]=clamp(S.C[c][k]+p.once[k],0,100);});});});log('六個月的新政完成，兩策已生效。','good');chron('變法施行完畢。');
    });
    Object.keys(S.passages).forEach(k=>{if(S.passages[k]<=S.t){delete S.passages[k];log('借道約定到期；行軍須重新核對道路。','ev');}});
    Object.keys(S.speechSupport).forEach(f=>{if(S.speechSupport[f].until<=S.t)delete S.speechSupport[f];});
  }

  function hostageTalentBlock() {
    const h=S.hostages.filter(h=>!h.returned&&h.from===S.player);
    return h.length?'<h4>在外人質（不能下令）</h4><div class="wd-list">'+h.map(h=>'<button class="wd-row" data-hostage-recall="'+h.person+'">'+face(h.person)+'<span><b>'+esc(cname(h.person))+'</b><small>在'+esc(fdef(h.to).name)+' · 餘'+Math.max(0,h.until-S.t)+'月</small></span></button>').join('')+'</div>':'';
  }

  // 個人策士：各局固定裝備，使用紀錄與效果一起存檔。
  function panePlayer(){
    const p=S._player;if(!ZH.player)return '<p>個人技能模組尚未載入。</p>';
    return '<div class="pl-profile-head"><span class="pl-avatar">'+ZH.player.avatar(ZH.player.profile&&ZH.player.profile.avatarId,ZH.player.profile&&ZH.player.profile.appearance)+'</span><div><h3>'+esc(ZH.player.name())+'</h3><p>本局 '+(S.hist?'史實參考':'演義')+' · 裝備在開局固定</p></div></div>'+(S._playerError?'<p role="alert">'+esc(S._playerError)+'</p>':'')+
      (S.hist?'<p>史實參考模式保留原有規則；個人加成技能在演義模式使用。</p>':'')+
      (p?p.loadout.map(id=>ZH.player.skillCard(p,id,S.t)+(ZH.player.SKILLS.find(s=>s.id===id).scope==='world'?'<button type="button" class="zh-btn zh-btn--primary" data-player-skill="'+id+'"'+(S.hist||S._playerError||(!ZH.player.available(p,id,S.t)&&!(p.pending&&p.pending.id===id))||BUSY||S.ended?' disabled':'')+'>使用'+esc(ZH.player.SKILLS.find(s=>s.id===id).name)+'</button>':'<p>這項技能在劇本中使用。</p>')).join(''):'<p>個人技能未啟用；可以繼續原有大地圖操作。</p>')+
      '<details><summary>本局技能紀錄</summary>'+((p&&p.uses)||[]).map(u=>'<p>'+esc((ZH.player.SKILLS.find(s=>s.id===u.id)||{}).name||u.id)+' · '+esc(dateText(u.month))+' · '+esc(u.id==='anmin'?(CITY[u.target]&&CITY[u.target].name||'我方城池'):u.id==='tongpin'?fdef(u.target).name:'路線比較')+'</p>').join('')+'</details>';
  }
  async function usePlayerWorld(id){
    if(!S||S.ended||BUSY||S.hist||S._playerError||!ZH.player||!S._player)return;setPlay(false);
    const def=ZH.player.SKILLS.find(s=>s.id===id);if(!def)return;
    let target='',body='';const pending=S._player.pending;
    if(pending){if(pending.id!==id){ZH.toast('請先重試'+((ZH.player.SKILLS.find(s=>s.id===pending.id)||{}).name||'上一項技能')+'。','bad');return;}target=pending.target;}
    else if(id==='anmin')body='<label>我方城池<select class="zh-input" data-pf-city>'+citiesOf(S.player).map(c=>'<option value="'+c+'">'+esc(CITY[c].name)+' · 民心'+Math.round(S.C[c].mx)+'</option>').join('')+'</select></label><p>民心加5，最高100；冷卻六個月。</p>';
    else if(id==='tongpin')body='<label>交涉對象<select class="zh-input" data-pf-country>'+facIds().filter(f=>f!==S.player&&alive(f)).map(f=>'<option value="'+f+'">'+esc(fdef(f).name)+'</option>').join('')+'</select></label><p>六個月內，對這一國交涉的利害係數加0.08，仍須派使者交涉。</p>';
    else if(id==='yunchou'){const opts=CITY_IDS.map(c=>'<option value="'+c+'">'+esc(CITY[c].name)+'</option>').join('');body='<label>出發城池<select class="zh-input" data-pf-from>'+citiesOf(S.player).map(c=>'<option value="'+c+'">'+esc(CITY[c].name)+'</option>').join('')+'</select></label><label>目標甲<select class="zh-input" data-pf-one>'+opts+'</select></label><label>目標乙<select class="zh-input" data-pf-two>'+opts+'</select></label><p>比較路程與五千兵的估計維持糧；不含交戰損耗與途中徵補。</p>';}
    else return;
    if(!pending){const choice=ZH.modal({title:def.name,body,actions:[{label:'取消',value:false,kind:'quiet'},{label:'使用技能',value:true,kind:'primary'}]});const modal=document.querySelector('.zh-modal');const read=()=>{if(id==='anmin')target=modal.querySelector('[data-pf-city]').value;else if(id==='tongpin')target=modal.querySelector('[data-pf-country]').value;else target=[modal.querySelector('[data-pf-from]').value,modal.querySelector('[data-pf-one]').value,modal.querySelector('[data-pf-two]').value].join(':');};modal.addEventListener('click',read,true);if(!await choice)return;}
    let comparison=[];
    if(id==='yunchou'){const [from,a,b]=target.split(':');if(!S.C[from]||S.C[from].o!==S.player||!CITY[a]||!CITY[b]||a===b||from===a||from===b){ZH.toast('請選我方出發城與兩個不同目標。','bad');return;}comparison=[a,b].map(to=>({to,path:findPath(from,to,S.player,{})}));if(comparison.every(x=>!x.path)){ZH.toast('兩條路線都無法通行，尚未使用技能。','bad');return;}}
    else if(id==='anmin'&&(!S.C[target]||S.C[target].o!==S.player||S.C[target].mx>=100)){ZH.toast('請選民心尚未滿的我方城池。','bad');return;}
    else if(id==='tongpin'&&(!alive(target)||target===S.player)){ZH.toast('請選存續中的其他國家。','bad');return;}
    BUSY=true;try{
      const receipt=await ZH.player.consume(S,id,target,S.t,()=>saveGame(false));
      await ZH.player.applyReceipt(S,receipt,()=>{if(id==='anmin')S.C[target].mx=clamp(S.C[target].mx+5,0,100);if(id==='tongpin')S._playerBuff={fid:target,until:S.t+6,value:.08};log('策士'+ZH.player.name()+'使用「'+def.name+'」。','good');},()=>saveGame(false));
      if(id==='yunchou')await ZH.modal({title:'運籌・路線比較',body:comparison.map(x=>'<p><b>'+esc(CITY[x.to].name)+'</b><br>'+(x.path?esc(x.path.path.map(c=>CITY[c].name).join(' → '))+'<br>路程約 '+x.path.months.toFixed(1)+' 個月；維持糧約 '+Math.ceil(x.path.months*upkeepOf(S.player,5000)):'現有外交與道路條件下無法通行')+'</p>').join(''),actions:[{label:'回到地圖',value:true,kind:'primary'}]});else ZH.toast(def.name+'已套用。','ok');
    }catch(e){ZH.toast(e.message,'bad',5000);}finally{BUSY=false;refresh(false);}
  }

  // ───── 對外 ─────
  ZH.world = {
    start(root, world) {
      ROOT = root; MASTER = world;
      indexWorld(world); 
      SAVE_MODE = 'romance:' + world.id;
      document.title = world.title + '・天下大地圖｜Re:縱橫鼎業';
      ZH.loading(true, '展開天下');
      loadProgress();
      const ret = ZH.session.get('world:return', null);
      (ZH.requireStudentProfile?ZH.requireStudentProfile():Promise.resolve(true)).then(ok=>ok?loadSaved():null).then(saved => {
        if(!ZH.isGuest()&&!ZH.user.isTeacher&&!ZH.session.get('student-profile:'+ZH.user.email,null)?.studentId){ZH.loading(false);return;}
        ZH.loading(false);
        if (saved && ret && ret.w === D.id) { resumeGame(saved, ret); return; }
        if (ret && ret.w === D.id) ZH.session.remove('world:return');
        showTitle(saved);
      });
    },
    /** 測試用：取得目前狀態 */
    get state() { return S; },
    get busy() { return BUSY || DLG > 0; },
    debug: {
      event: id => EVT[id] && showEvent(EVT[id],{mode:'replay'}), council:()=>openCouncil(), goals:()=>D.id==='zg' ? zgGoals() : D.chronicle ? cqGoals() : null, pact:kind=>openZGPact(kind), renew:()=>renewZGPact(), endKey:()=>endKeyNow(),
      tick: () => endMonth(), fit: () => fitAll(), focus: (c, w) => focusCity(c, w, 0), cityPower: cid => cityPower(cid), findPath: (a, b) => findPath(a, b, S.player, {}),
      march: (from, to, tr) => march(S.player, from, to, tr, charsAt(from, S.player).filter(idle).slice(0, 2)),
      take: (cid, fid) => { takeCity(cid, fid || S.player, 5000); refresh(false); },
      xp: (pid, n) => gainXP(pid, n), mode: m => { MAPMODE = m; renderModes(); renderTerritory(); }, captive: (pid) => { const p = S.P[pid]; p.f0 = p.f; p.st = 'c'; p.cf = S.player; p.loc = capitalOf(S.player); CAPTIVE_WAIT.push(pid); },
      rules:()=>({cards:D.cards,cells:D.cells,borders:D.borders,rank:nationRank(),validate:cardRuleError}), speech:(k,f,p,third,offer)=>speechParts(k,f,p,third,offer), diplomacy:fid=>openDiplomacy(fid), card:id=>useGenericCard(id), nation:key=>({meeting:openMeeting,hostage:openHostage,migrate:openMigration,reform:openReform}[key])(),
      pane: t => { TAB = t; refresh(false); }, upgrade: () => upgradeState(false)
    }
  };
})(window.ZH);
</script>
