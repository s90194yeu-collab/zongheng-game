<!--
============================================================
 Re:縱橫鼎業
------------------------------------------------------------
 檔名：Eng_World.html
 版本：v0.6.3（2026-10-14）
 依賴：Core_css.html、Core_js.html、Data_catalog.html、World_geo.html、
       戰役資料（例如 Data_world_ch.html）、Data_world_rules.html；Art_kit.html（選用：人物與場景）
       伺服器 Save.gs（存檔）、WorldApi.gs（各話成績）
 說明：天下大地圖引擎（三卷共用），由 Map.html 載入。
   ・地圖：拖曳、縮放；勢力上色、道路、關隘、渡口；軍隊行軍與圍城動畫。
     v0.2.0：拿掉山形符號與紙紋濾鏡（省效能）；道路一律實線、斷路不畫；換主人時領地閃一下；
     地圖模式（勢力、外交、民心）；勢力配色加大差異。
   v0.4.0（戰國）：六分期開局、七雄、三種目標、合縱糧援與連橫通商；春秋、楚漢沿用原流程。
   v0.5.0：相接的領土分區；通用資料計策庫、說客公式、演義路線、會盟／質子／遷都／變法；道具圖案與史冊簡介。
   ・方針（軍國、科研、經濟、外交）與國策樹（四列各五項，參考《鋼鐵雄心》）。
   ・人物經驗與技能點（十二項技能）、寶物（烏騅、太公兵法、虎符……可授予、繳獲、攻城取得）。
   ・俘虜可以登用、釋放、斬首。存檔版本 v2（自動升級 v1 舊檔）。
   v0.2.1（效能）：
     ・回合制靜止時不跑每一格的迴圈；軍隊位置沒變就不寫（採用 v0.1.1 的改法）。
     ・拖曳、縮放、鏡頭移動時只挪動已畫好的地圖圖層，放開才重畫一次。
     ・地圖上不再有無限循環的動畫（行軍虛線、圍城閃爍、選取閃爍）；暗角改由 CSS 畫。
     ・名單裡的小頭像不眨眼；即時模式的時間條改用 transform。
   ・每個月：收入與糧食、行軍、攻城、知遇與人才流動、電腦勢力（內政、出兵、外交）。
   ・指令：內政五項、出陣與調兵、人才（賞賜、調動、登用、俘虜）、外交五項、計策卡。
   ・史實事件：到了年月就發生；可以進入劇本、沿用成績或史官代筆，表現換成計策卡。
     「史實引力」模式下，電腦勢力大致照正史行動；「完全架空」模式下自由發展。
   ・時間：回合制，或即時＋暫停（一倍速一個月 8 秒）。
   ・存檔：劇本代碼 campaign、模式 romance:卷代碼；同時在分頁裡備份一份。
   ・進入劇本前會記下「回程票」（分頁暫存 world:return），結算頁看到它就顯示「回到天下」。
============================================================
-->
<style>
  /* ═══════════════ 天下大地圖 ═══════════════ */
  .wd {
    position: fixed; inset: 0; z-index: 5; display: grid;
    grid-template-columns: minmax(0, 1fr) 372px; grid-template-rows: auto minmax(0, 1fr);
    background: var(--night); color: var(--text); font-family: var(--f-body);
    -webkit-tap-highlight-color: transparent;
  }
  .wd button { font-family: inherit; }

  /* ───── 頂列 ───── */
  .wd-top {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap;
    padding: calc(6px + var(--safe-t)) 12px 6px; background: rgba(14, 18, 34, .97);
    border-bottom: 1px solid var(--line); position: relative; z-index: 6;
  }
  .wd-ico {
    display: grid; place-items: center; width: 38px; height: 38px; flex: none; cursor: pointer;
    border: 1px solid var(--line-soft); border-radius: 10px; background: none; color: var(--text); font-size: 18px; line-height: 1;
  }
  .wd-ico:hover { border-color: var(--gilt); color: var(--gilt); }
  .wd-me { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .wd-flag {
    display: grid; place-items: center; width: 34px; height: 40px; flex: none;
    clip-path: polygon(0 0, 100% 0, 100% 82%, 50% 100%, 0 82%);
    font-family: var(--f-display); font-weight: 700; font-size: 19px; color: #fff; text-shadow: 0 1px 0 rgba(0, 0, 0, .4);
  }
  .wd-me b { display: block; font-family: var(--f-display); font-size: 18px; letter-spacing: .08em; line-height: 1.15; white-space: nowrap; }
  .wd-me small { display: block; font-size: 12px; color: var(--text-dim); white-space: nowrap; }
  .wd-date { display: flex; flex-direction: column; line-height: 1.15; padding: 0 4px; }
  .wd-date b { font-family: var(--f-display); font-size: 19px; color: var(--gilt); white-space: nowrap; }
  .wd-date small { font-size: 12px; color: var(--text-dim); white-space: nowrap; }
  .wd-res { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 14px; }
  .wd-res span { display: inline-flex; align-items: baseline; gap: 5px; white-space: nowrap; }
  .wd-res i { font-style: normal; font-size: 12px; color: var(--text-dim); }
  .wd-res b { font-variant-numeric: tabular-nums; font-size: 16px; }
  .wd-res .is-low b { color: #ff9c90; }
  .wd-grow { flex: 1; }
  .wd-timebox { display: flex; align-items: center; gap: 6px; }
  .wd-speed { display: inline-flex; border: 1px solid var(--line-soft); border-radius: 10px; overflow: hidden; }
  .wd-speed button { min-width: 38px; height: 36px; padding: 0 8px; border: 0; background: none; color: var(--text-dim); cursor: pointer; font-size: 13px; }
  .wd-speed button.is-on { background: var(--gilt); color: #2b2418; font-weight: 700; }
  .wd-next { min-height: 40px; padding: 6px 16px; }
  .wd-next small { display: block; font-size: 11px; opacity: .75; }
  .wd-clockbar { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--gilt); transform: scaleX(0); transform-origin: 0 50%; will-change: transform; }

  /* ───── 地圖 ───── */
  .wd-stage { position: relative; overflow: hidden; background: #6f8790; touch-action: none; user-select: none; -webkit-user-select: none; }
  /* 0.2.1：四周暗角從 SVG 移到這裡（地圖重畫時不用重算）；地圖自成一層，拖曳、縮放時只挪動圖層 */
  .wd-stage::after { content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(ellipse 72% 72% at 50% 50%, rgba(0, 0, 0, 0) 62%, rgba(43, 36, 24, .35) 100%); }
  .wd-cam { position: absolute; left: -15%; top: -15%; width: 130%; height: 130%; transform-origin: 11.5385% 11.5385%; will-change: transform; }   /* 比畫面大 15%：原點對齊畫面左上角 */
  .wd-map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  .wd-map.is-drag { cursor: grabbing; }
  .wd-map text { font-family: var(--f-display); pointer-events: none; }
  .wd-map .t-river { fill: #2f5277; font-size: 15px; letter-spacing: .3em; opacity: .85; }
  .wd-map .t-range { fill: #5d4c30; font-size: 19px; letter-spacing: .5em; opacity: .7; }
  .wd-map .t-sea { fill: #e7eef0; font-size: 34px; letter-spacing: .6em; opacity: .75; }
  .wd-map .t-lake { fill: #2f5277; font-size: 12px; }
  .wd-map[data-z="1"] .t-river, .wd-map[data-z="1"] .t-lake { display: none; }
  .wd-map .terr { fill-opacity: .46; }
  .wd-map .terr.is-mine { fill-opacity: .58; }
  .wd-map .terr.is-flip { animation: wd-flip 1.8s ease-out; }
  @keyframes wd-flip { 0%, 25% { fill-opacity: .92; } 100% { } }
  .wd-map .bord { fill: none; stroke: #2b2418; stroke-width: 1.8; opacity: .55; stroke-linejoin: round; }
  .wd-map .bord.is-mine { stroke: #7a1c10; stroke-width: 2.6; opacity: .8; }
  /* 道路：都是實線，可以通行。大道最粗；山道細；棧道褐色；渡河藍色。斷掉的路平常不畫 */
  .wd-map .road { fill: none; stroke: #6e5838; stroke-width: 2.4; opacity: .62; stroke-linecap: round; }
  .wd-map .road.k-p { stroke-width: 1.5; }
  .wd-map .road.k-k { stroke: #9a5a22; stroke-width: 1.8; opacity: .75; }
  .wd-map .road.k-f { stroke: #2f6a9a; stroke-width: 2; opacity: .75; }
  .wd-map .road.is-blocked { stroke: #a83a2c; stroke-dasharray: 3 4; opacity: .7; }
  .wd-map .road.is-route { stroke: var(--gilt); stroke-width: 3.2; opacity: .95; stroke-dasharray: none; }
  .wd-map .city { cursor: pointer; }
  .wd-map .city .hit { fill: transparent; }
  .wd-map .c-name { font-size: 15px; fill: #241c10; font-weight: 700; paint-order: stroke; stroke: #f4ead0; stroke-width: 4px; stroke-linejoin: round; }
  .wd-map .c-name.is-cap { font-size: 17px; }
  .wd-map .c-troop { font-family: var(--f-body); font-size: 11px; font-weight: 700; fill: #3a2c18; paint-order: stroke; stroke: #f4ead0; stroke-width: 3px; }
  .wd-map[data-z="1"] .c-troop, .wd-map[data-z="1"] .c-minor .c-name { display: none; }
  .wd-map[data-z="1"] .c-name { font-size: 18px; }
  .wd-map .c-sel { fill: none; stroke: var(--gilt); stroke-width: 3; opacity: 0; }
  .wd-map .city.is-sel .c-sel { opacity: 1; stroke-width: 4; animation: wd-sel .7s ease-in-out 2; }   /* 0.2.1：只閃兩下（無限循環會讓整張地圖每一格重畫） */
  .wd-map .city.is-target .c-sel { opacity: 1; stroke: #ffd76a; stroke-dasharray: 4 3; }
  .wd-map .city.is-dim { opacity: .35; }
  .wd-map .c-siege { fill: none; stroke: #e0483b; stroke-width: 2.5; opacity: 0; }
  .wd-map .city.is-siege .c-siege { opacity: 1; stroke-dasharray: 5 3; }
  .wd-map .eta { font-family: var(--f-body); font-size: 11px; font-weight: 700; fill: #fff; }
  .wd-map .army { cursor: pointer; transition: opacity .3s; }
  .wd-map .a-troop { font-family: var(--f-body); font-size: 10.5px; font-weight: 700; fill: #fff; }
  .wd-map .a-glyph { font-size: 13px; font-weight: 700; fill: #fff; }
  .wd-map .a-route { fill: none; stroke-width: 2.4; stroke-dasharray: 6 5; opacity: .85; }
  .wd-map .army.is-sel .a-body { stroke: var(--gilt); stroke-width: 2.5; }
  .wd-map .fx-boom { pointer-events: none; }
  @keyframes wd-sel { 50% { stroke-width: 6; } }

  .wd-zoom { position: absolute; right: 12px; bottom: calc(14px + var(--safe-b)); display: flex; flex-direction: column; gap: 6px; z-index: 3; }
  .wd-zoom button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid rgba(43, 36, 24, .35); background: rgba(244, 234, 208, .92); color: #2b2418; font-size: 20px; cursor: pointer; }
  .wd-hint {
    position: absolute; left: 50%; top: 12px; transform: translateX(-50%); z-index: 4; max-width: calc(100% - 24px);
    display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 14px; border-radius: 999px;
    background: rgba(20, 26, 46, .94); border: 1px solid var(--gilt); font-size: 14px; box-shadow: var(--shadow);
  }
  .wd-hint[hidden] { display: none; }
  .wd-ticker { position: absolute; left: 10px; bottom: calc(10px + var(--safe-b)); z-index: 3; display: flex; flex-direction: column-reverse; gap: 4px; max-width: min(420px, calc(100% - 80px)); pointer-events: none; }
  .wd-ticker p { margin: 0; padding: 5px 10px; border-radius: 8px; background: rgba(14, 18, 34, .82); color: var(--text); font-size: 13px; line-height: 1.5; animation: wd-in .3s ease both; }
  .wd-ticker p.k-war { border-left: 3px solid var(--cinnabar); }
  .wd-ticker p.k-good { border-left: 3px solid var(--patina); }
  .wd-ticker p.k-ev { border-left: 3px solid var(--gilt); }
  .wd-ticker p.is-old { opacity: .55; }
  @keyframes wd-in { from { opacity: 0; transform: translateY(6px); } }

  /* ───── 側欄 ───── */
  .wd-side { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; background: rgba(18, 23, 42, .98); border-left: 1px solid var(--line); position: relative; z-index: 5; }
  .wd-grip { display: none; }
  .wd-tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); padding: 0 6px; }
  .wd-tab { flex: none; padding: 11px 8px 9px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--text-dim); cursor: pointer; font-family: var(--f-display); font-size: 15.5px; position: relative; }
  .wd-tab[aria-selected="true"] { color: var(--gilt); border-bottom-color: var(--gilt); }
  .wd-tab em { position: absolute; top: 4px; right: 0; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: var(--cinnabar); color: #fff; font-size: 10.5px; font-style: normal; line-height: 16px; text-align: center; font-family: var(--f-body); }
  .wd-pane { overflow-y: auto; overscroll-behavior: contain; padding: 14px 14px calc(24px + var(--safe-b)); }
  .wd-pane h3 { font-family: var(--f-display); font-size: 21px; letter-spacing: .06em; }
  .wd-pane h4 { margin: 16px 0 8px; font-family: var(--f-display); font-size: 16px; color: var(--gilt); letter-spacing: .1em; }
  .wd-dim { color: var(--text-dim); }
  .wd-sm { font-size: 13px; }
  .wd-head { display: flex; align-items: center; gap: 12px; }
  .wd-head .wd-flag { width: 30px; height: 36px; font-size: 16px; }
  .wd-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .wd-chips .zh-chip { font-size: 12.5px; padding: 2px 8px; }
  .wd-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 12px; }
  .wd-stat { padding: 7px 8px; border-radius: 8px; background: rgba(236, 230, 214, .05); border: 1px solid var(--line-soft); }
  .wd-stat i { display: block; font-style: normal; font-size: 11.5px; color: var(--text-dim); }
  .wd-stat b { font-size: 16px; font-variant-numeric: tabular-nums; }
  .wd .zh-bar { display: block; }
  .wd-stat .zh-bar { margin-top: 4px; height: 5px; }
  .wd-acts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .wd-act { display: grid; gap: 1px; align-content: center; min-height: 52px; padding: 6px 10px; text-align: left; cursor: pointer; border-radius: 10px; border: 1px solid var(--line); background: rgba(20, 26, 46, .7); color: var(--text); }
  .wd-act b { font-family: var(--f-display); font-size: 16px; }
  .wd-act small { font-size: 11.5px; color: var(--text-dim); line-height: 1.35; }
  .wd-act:hover:not(:disabled) { border-color: var(--gilt); }
  .wd-act:disabled { opacity: .45; cursor: default; }
  .wd-act.is-main { grid-column: 1 / -1; border-color: var(--gilt); background: linear-gradient(180deg, rgba(224, 180, 76, .2), rgba(224, 180, 76, .06)); }
  .wd-act.is-war { border-color: rgba(217, 72, 59, .6); }
  .wd-list { display: flex; flex-direction: column; gap: 6px; }
  .wd-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px; border-radius: 10px; border: 1px solid var(--line-soft); background: rgba(236, 230, 214, .03); cursor: pointer; text-align: left; color: var(--text); width: 100%; }
  .wd-row:hover { border-color: var(--line); }
  .wd-row.is-busy { opacity: .62; }
  .wd-row b { font-family: var(--f-display); font-size: 16px; }
  .wd-row small { display: block; font-size: 12px; color: var(--text-dim); }
  .wd-face { width: 46px; height: 46px; border-radius: 10px; overflow: hidden; background: #e8dcc0; flex: none; display: grid; place-items: center; font-family: var(--f-display); font-size: 20px; color: #2b2418; }
  .wd-face svg { width: 100%; height: 100%; display: block; }
  .wd-face .ck-eye, .wd-face .ck-breathe, .wd-face .ck-dangle { animation: none; }   /* 名單裡的小頭像不眨眼：十幾張一起眨會一直重畫側欄 */
  .wd-face.is-big { width: 72px; height: 72px; }
  .wd-five { display: grid; grid-template-columns: repeat(5, 2.3em); gap: 2px; font-size: 12px; text-align: center; font-variant-numeric: tabular-nums; }
  .wd-five span { color: var(--text-dim); }
  .wd-five b { font-size: 13px; }
  .wd-five .is-hi { color: var(--gilt); }
  .wd-loyal { height: 4px; border-radius: 99px; background: rgba(236, 230, 214, .1); margin-top: 4px; overflow: hidden; }
  .wd-loyal i { display: block; height: 100%; background: var(--patina); }
  .wd-loyal.is-low i { background: var(--cinnabar); }
  .wd-empty { padding: 18px; text-align: center; color: var(--text-dim); font-size: 14px; }
  .wd-card { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 12px; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: linear-gradient(160deg, rgba(239, 226, 191, .1), rgba(239, 226, 191, .02)); }
  .wd-card__g { display: grid; place-items: center; width: 54px; height: 72px; border-radius: 8px; background: var(--slip); color: var(--slip-ink); font-family: var(--f-display); font-size: 28px; font-weight: 700; border: 2px solid var(--cord); }
  .wd-card b { font-family: var(--f-display); font-size: 17px; }
  .wd-card p { font-size: 13px; line-height: 1.6; color: var(--text-dim); margin: 2px 0 6px; }
  .wd-card.is-locked { opacity: .55; }
  .wd-ev { display: grid; grid-template-columns: 4.6em minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 9px 8px; border-bottom: 1px solid var(--line-soft); cursor: pointer; text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; color: var(--text); width: 100%; }
  .wd-ev:hover { background: rgba(224, 180, 76, .06); }
  .wd-ev time { font-size: 12px; color: var(--text-dim); line-height: 1.3; }
  .wd-ev b { font-family: var(--f-display); font-size: 16px; }
  .wd-ev small { display: block; font-size: 12px; color: var(--text-dim); }
  .wd-tier { font-family: var(--f-display); font-size: 13px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
  .wd-tier.t-great { color: #2b2418; background: var(--gilt); border-color: var(--gilt); }
  .wd-tier.t-good { color: var(--gilt); border-color: var(--gilt); }
  .wd-tier.t-bad { color: #ff9c90; border-color: var(--cinnabar); }
  .wd-tier.t-new { color: #fff; background: var(--cinnabar); border-color: var(--cinnabar); }
  .wd-chron p { font-size: 13.5px; line-height: 1.65; padding: 5px 0; border-bottom: 1px dashed var(--line-soft); }
  .wd-chron time { color: var(--gilt); font-size: 12px; margin-right: 6px; }
  .wd-rel { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .wd-rel .zh-bar { width: 70px; height: 5px; }
  .wd-rel .zh-bar span { background: var(--patina); }
  .wd-rel.is-neg .zh-bar span { background: var(--cinnabar); }
  .wd-mini { font-size: 12px; color: var(--text-dim); }

  /* ───── 對話框（事件卡、戰報、出陣） ───── */
  .wd-ov { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 16px; background: rgba(6, 8, 18, .72); animation: wd-in .2s ease both; overflow-y: auto; }
  .wd-dlg { position: relative; width: min(620px, 100%); max-height: calc(100dvh - 32px); overflow-y: auto; border-radius: 16px; border: 1px solid var(--gilt); background: linear-gradient(180deg, #232c48, #161c33); box-shadow: 0 24px 60px rgba(0, 0, 0, .6); }
  .wd-dlg.is-wide { width: min(860px, 100%); }
  .wd-dlg__body { padding: 18px 20px 20px; }
  .wd-dlg h2 { font-family: var(--f-display); font-size: 26px; letter-spacing: .1em; }
  .wd-dlg .wd-kicker { font-size: 13px; color: var(--gilt); letter-spacing: .14em; }
  .wd-dlg p { line-height: 1.75; }
  .wd-dlg__acts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .wd-dlg__x { position: absolute; top: 10px; right: 10px; z-index: 2; }
  .wd-scene { position: relative; height: 190px; overflow: hidden; border-radius: 16px 16px 0 0; background: #2b2418; }
  .wd-scene > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .wd-scene__cast { position: absolute; left: 0; right: 0; bottom: -6px; display: flex; justify-content: center; gap: 4px; }
  .wd-scene__cast > div { width: 104px; height: 128px; }
  .wd-scene__cast svg { width: 100%; height: 100%; }
  .wd-scene__seal { position: absolute; left: 16px; top: 14px; padding: 4px 10px; border-radius: 6px; background: var(--cinnabar); color: #fff; font-family: var(--f-display); font-size: 15px; letter-spacing: .2em; box-shadow: 0 2px 0 rgba(0, 0, 0, .3); }
  .wd-quote { margin: 12px 0; padding: 12px 16px; border-left: 4px solid var(--cord); border-radius: 0 10px 10px 0; background: var(--slip); color: var(--slip-ink); font-family: var(--f-display); font-size: 17px; line-height: 1.75; }
  .wd-quote cite { display: block; margin-top: 4px; font-style: normal; font-size: 13px; color: #6b5a3a; }
  .wd-paths { display: grid; gap: 8px; margin-top: 14px; }
  .wd-path { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: rgba(20, 26, 46, .6); color: var(--text); text-align: left; cursor: pointer; width: 100%; }
  .wd-path:hover:not(:disabled) { border-color: var(--gilt); background: rgba(224, 180, 76, .08); }
  .wd-path:disabled { opacity: .45; cursor: default; }
  .wd-path__i { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 10px; background: rgba(224, 180, 76, .14); color: var(--gilt); font-family: var(--f-display); font-size: 22px; }
  .wd-path b { font-family: var(--f-display); font-size: 17px; }
  .wd-path small { display: block; font-size: 12.5px; color: var(--text-dim); line-height: 1.5; }
  .wd-path.is-main { border-color: var(--gilt); }
  .wd-reward { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding: 8px 10px; border-radius: 10px; background: rgba(224, 180, 76, .08); border: 1px dashed var(--line); font-size: 13.5px; }
  .wd-reward .wd-card__g { width: 36px; height: 48px; font-size: 20px; }

  .wd-battle { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 12px; align-items: center; margin-top: 12px; }
  .wd-side-b { text-align: center; }
  .wd-side-b .wd-face { margin: 0 auto 6px; }
  .wd-side-b b { font-family: var(--f-display); font-size: 18px; }
  .wd-vs { font-family: var(--f-display); font-size: 30px; color: var(--cinnabar); }
  .wd-bars { display: grid; gap: 6px; margin-top: 12px; }
  .wd-bar2 { display: grid; grid-template-columns: 4em minmax(0, 1fr) 8.5em; gap: 8px; align-items: center; font-size: 13px; }
  .wd-bar2 .zh-bar { height: 10px; }
  .wd-bar2 .zh-bar span { transition: width 1s ease; }
  .wd-verdict { margin-top: 14px; text-align: center; font-family: var(--f-display); font-size: 24px; letter-spacing: .2em; }
  .wd-verdict.is-win { color: var(--gilt); }
  .wd-verdict.is-lose { color: #ff9c90; }

  .wd-form { display: grid; gap: 12px; margin-top: 12px; }
  .wd-form label { font-size: 13px; color: var(--text-dim); }
  .wd-form select, .wd-form input[type="range"] { width: 100%; }
  .wd-form select { min-height: 40px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: #1b2238; color: var(--text); font-size: 15px; }
  .wd-odds { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: rgba(236, 230, 214, .05); font-size: 14px; }
  .wd-odds b { font-family: var(--f-display); font-size: 20px; }
  .wd-odds .is-good { color: #8fd3c2; }
  .wd-odds .is-mid { color: var(--gilt); }
  .wd-odds .is-bad { color: #ff9c90; }
  .wd-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
  .wd-pick label { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 10px; border: 1px solid var(--line-soft); cursor: pointer; color: var(--text); font-size: 14px; }
  .wd-pick input { accent-color: var(--gilt); }
  .wd-pick label:has(input:checked) { border-color: var(--gilt); background: rgba(224, 180, 76, .1); }
  .wd-pick .wd-face { width: 34px; height: 34px; }

  /* ───── 開局 ───── */
  .wd-title { position: fixed; inset: 0; z-index: 30; overflow-y: auto; background: radial-gradient(120% 80% at 50% 0%, #27314f, #0a0c1a 70%); }
  .wd-title__in { width: min(1080px, 100%); margin: 0 auto; padding: calc(24px + var(--safe-t)) var(--gutter) calc(40px + var(--safe-b)); }
  .wd-title__hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 28px; align-items: center; }
  .wd-title__map { border-radius: 16px; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow); background: #8fa8ad; aspect-ratio: 1 / 1; }
  .wd-title__map svg { width: 100%; height: 100%; display: block; }
  .wd-title h1 { font-family: var(--f-display); font-size: clamp(40px, 7vw, 72px); letter-spacing: .16em; line-height: 1.1; }
  .wd-title .wd-kicker { font-size: 14px; color: var(--gilt); letter-spacing: .2em; }
  .wd-title__lead { margin-top: 12px; font-family: var(--f-display); font-size: 19px; line-height: 1.7; }
  .wd-title__acts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
  .wd-step { margin-top: 28px; }
  .wd-step h2 { font-family: var(--f-display); font-size: 22px; letter-spacing: .1em; margin-bottom: 12px; }
  .wd-step h2 small { margin-left: 10px; font-family: var(--f-body); font-size: 13px; color: var(--text-dim); letter-spacing: 0; }
  .wd-facs { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .wd-fac { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 12px; padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: rgba(20, 26, 46, .7); text-align: left; cursor: pointer; color: var(--text); }
  .wd-fac:hover { border-color: var(--gilt); }
  .wd-fac[aria-pressed="true"] { border-color: var(--gilt); box-shadow: 0 0 0 2px var(--gilt) inset; background: rgba(224, 180, 76, .1); }
  .wd-fac b { font-family: var(--f-display); font-size: 19px; }
  .wd-fac small { display: block; font-size: 12.5px; color: var(--text-dim); line-height: 1.55; margin-top: 2px; }
  .wd-fac .wd-face { width: 72px; height: 72px; }
  .wd-stars { color: var(--gilt); font-size: 12px; letter-spacing: .1em; }
  .wd-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
  .wd-opt { padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); background: rgba(20, 26, 46, .7); text-align: left; cursor: pointer; color: var(--text); }
  .wd-opt[aria-pressed="true"] { border-color: var(--gilt); box-shadow: 0 0 0 2px var(--gilt) inset; background: rgba(224, 180, 76, .1); }
  .wd-opt b { display: block; font-family: var(--f-display); font-size: 19px; }
  .wd-opt span { display: block; margin-top: 4px; font-size: 13.5px; line-height: 1.6; color: var(--text-dim); }
  .wd-more { margin-top: 10px; }
  .wd-more summary { cursor: pointer; color: var(--gilt); font-size: 14px; }
  .wd-prequel { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }

  .wd-end__maps { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .wd-end__maps figure { margin: 0; text-align: center; font-size: 13px; color: var(--text-dim); }
  .wd-end__maps svg { width: 100%; height: auto; border-radius: 10px; background: #8fa8ad; display: block; }
  .wd-score { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
  .wd-score div { padding: 10px; border-radius: 10px; background: rgba(236, 230, 214, .05); text-align: center; }
  .wd-score i { display: block; font-style: normal; font-size: 12px; color: var(--text-dim); }
  .wd-score b { font-size: 22px; font-variant-numeric: tabular-nums; }

  .wd-quiz__q { font-family: var(--f-display); font-size: 19px; line-height: 1.7; margin: 8px 0 12px; }
  .wd-quiz__o { display: grid; gap: 8px; }
  .wd-quiz__o button { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: rgba(20, 26, 46, .7); color: var(--text); text-align: left; cursor: pointer; font-size: 15.5px; line-height: 1.6; }
  .wd-quiz__o button.is-ok { border-color: var(--patina); background: rgba(74, 156, 138, .2); }
  .wd-quiz__o button.is-bad { border-color: var(--cinnabar); background: rgba(217, 72, 59, .15); }
  .wd-quiz__why { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--slip); color: var(--slip-ink); font-size: 14.5px; line-height: 1.7; }


  /* ───── 地圖模式 ───── */
  .wd-modes { position: absolute; left: 10px; top: 10px; z-index: 3; display: grid; gap: 6px; justify-items: start; }
  .wd-stage:has(.wd-hint:not([hidden])) .wd-modes { display: none; }
  .wd-modes__seg { display: inline-flex; border: 1px solid rgba(43, 36, 24, .35); border-radius: 10px; overflow: hidden; background: rgba(244, 234, 208, .92); }
  .wd-modes__seg button { min-width: 46px; height: 34px; padding: 0 10px; border: 0; background: none; color: #2b2418; font-family: var(--f-display); font-size: 14px; cursor: pointer; }
  .wd-modes__seg button[aria-pressed="true"] { background: #2b2418; color: #f4ead0; }
  .wd-legend { display: grid; gap: 3px; padding: 6px 9px; border-radius: 10px; background: rgba(244, 234, 208, .92); color: #2b2418; font-size: 12px; }
  .wd-legend span { display: flex; align-items: center; gap: 6px; }
  .wd-legend i { width: 14px; height: 10px; border-radius: 3px; border: 1px solid rgba(43, 36, 24, .4); }

  /* ───── 方針與國策 ───── */
  .wd-doc { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 10px; align-items: center; margin-top: 10px; padding: 10px; border-radius: 12px; border: 1px solid var(--c); background: rgba(236, 230, 214, .05); background: color-mix(in srgb, var(--c) 14%, transparent); }
  .wd-doc b { font-family: var(--f-display); font-size: 17px; }
  .wd-doc small { display: block; font-size: 12.5px; color: var(--text-dim); line-height: 1.55; }
  .wd-doc__g { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 12px; background: var(--c); color: #fff; font-family: var(--f-display); font-size: 26px; font-weight: 700; text-shadow: 0 1px 0 rgba(0, 0, 0, .35); }
  .wd-docs { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
  .wd-docc { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 12px; padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: rgba(20, 26, 46, .7); text-align: left; cursor: pointer; color: var(--text); }
  .wd-docc:hover { border-color: var(--c); }
  .wd-docc[aria-pressed="true"] { border-color: var(--c); box-shadow: 0 0 0 2px var(--c) inset; background: rgba(236, 230, 214, .08); background: color-mix(in srgb, var(--c) 16%, transparent); }
  .wd-docc b { font-family: var(--f-display); font-size: 19px; }
  .wd-docc small { display: block; font-size: 12.5px; color: var(--text-dim); line-height: 1.55; margin-top: 2px; }
  .wd-docc .wd-docc__s { color: var(--text); }
  .wd-docc .wd-docc__l { font-size: 11.5px; letter-spacing: .02em; }
  .wd-nfcur { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: center; margin-top: 10px; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: rgba(236, 230, 214, .04); }
  .wd-nfcur b { font-family: var(--f-display); font-size: 16px; }
  .wd-nfcur small { display: block; font-size: 12px; color: var(--text-dim); }
  .wd-nfcur .zh-bar { margin: 5px 0 2px; height: 6px; }
  .wd-nfidle { margin-top: 10px; padding: 8px 10px; border-radius: 10px; background: rgba(217, 72, 59, .14); border: 1px dashed var(--cinnabar); font-size: 13.5px; }
  .wd-nf__g { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; background: var(--c, #555); color: #fff; font-family: var(--f-display); font-size: 21px; font-weight: 700; text-shadow: 0 1px 0 rgba(0, 0, 0, .35); flex: none; }
  .wd-nf__g.is-big { width: 60px; height: 60px; font-size: 32px; border-radius: 14px; }
  .wd-nftree { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 12px; }
  .wd-nfcol { display: grid; gap: 10px; align-content: start; padding: 6px 4px 8px; border-radius: 12px; border: 1px solid transparent; position: relative; }
  .wd-nfcol.is-doc { border-color: var(--c); background: rgba(236, 230, 214, .04); background: color-mix(in srgb, var(--c) 10%, transparent); }
  .wd-nfcol__h { text-align: center; font-family: var(--f-display); font-size: 15px; color: var(--c); letter-spacing: .1em; }
  .wd-nf { position: relative; display: grid; justify-items: center; gap: 3px; padding: 6px 2px 5px; border-radius: 10px; border: 1px solid var(--line-soft); background: rgba(20, 26, 46, .8); color: var(--text); cursor: pointer; overflow: hidden; }
  .wd-nf + .wd-nf::before { content: ''; position: absolute; left: 50%; top: -11px; width: 2px; height: 10px; margin-left: -1px; background: var(--line); }
  .wd-nf .wd-nf__g { width: 34px; height: 34px; font-size: 18px; filter: grayscale(.85); opacity: .55; }
  .wd-nf__n { font-family: var(--f-display); font-size: 12.5px; line-height: 1.25; text-align: center; color: var(--text-dim); }
  .wd-nf.is-done { border-color: var(--c); }
  .wd-nf.is-done .wd-nf__g { filter: none; opacity: 1; }
  .wd-nf.is-done .wd-nf__n { color: var(--text); }
  .wd-nf.is-done::after { content: '✓'; position: absolute; right: 4px; top: 2px; font-size: 12px; color: var(--c); font-weight: 700; }
  .wd-nf.is-av { border-color: var(--gilt); box-shadow: 0 0 0 1px var(--gilt) inset; }
  .wd-nf.is-av .wd-nf__g { filter: none; opacity: .9; }
  .wd-nf.is-av .wd-nf__n { color: var(--text); }
  .wd-nf.is-cur { border-color: var(--gilt); background: rgba(224, 180, 76, .16); box-shadow: 0 0 0 2px var(--gilt) inset; }
  .wd-nf.is-cur .wd-nf__g { filter: none; opacity: 1; }
  .wd-nf.is-cur .wd-nf__n { color: var(--gilt); }
  .wd-nf__p { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--gilt); }
  @keyframes wd-nfcur { 50% { box-shadow: 0 0 0 2px var(--gilt) inset; } }

  /* ───── 技能、寶物 ───── */
  .wd-five .is-up { color: #8fd3a8; }
  .wd-five .is-hi.is-up { color: #b6f0c8; }
  .wd-lv { display: inline-block; padding: 0 5px; border-radius: 6px; border: 1px solid var(--line); font-family: var(--f-body); font-size: 11px; font-weight: 700; color: var(--text-dim); vertical-align: 2px; }
  .wd-lv.is-sp { border-color: #8fd3a8; color: #10251a; background: #8fd3a8; }
  .wd-it { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: #b88a2a; color: #fff; font-family: var(--f-display); font-size: 12px; font-weight: 700; vertical-align: 1px; box-shadow: 0 0 0 1px #f4d78a inset; }
  .wd-it.is-big { width: 46px; height: 46px; font-size: 24px; flex: none; }
  .wd-growth { margin-top: 10px; padding: 10px; border-radius: 12px; background: rgba(236, 230, 214, .04); border: 1px solid var(--line-soft); }
  .wd-growth__lv b { font-family: var(--f-display); font-size: 16px; margin-right: 8px; }
  .wd-growth__lv small { font-size: 12px; color: var(--text-dim); }
  .wd-growth__lv .zh-bar { height: 5px; margin-top: 4px; }
  .wd-itrow { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 10px; align-items: center; margin-top: 10px; }
  .wd-itrow b { font-family: var(--f-display); font-size: 16px; }
  .wd-itrow small { display: block; font-size: 12px; color: var(--text-dim); }
  .wd-skills { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px; margin-top: 12px; }
  .wd-sk { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 8px; align-items: center; padding: 8px; border-radius: 10px; border: 1px solid var(--line); background: rgba(20, 26, 46, .7); color: var(--text); text-align: left; cursor: pointer; }
  .wd-sk:hover:not(:disabled) { border-color: #8fd3a8; }
  .wd-sk:disabled { cursor: default; opacity: .5; }
  .wd-sk.is-got { opacity: 1; border-color: #8fd3a8; background: rgba(143, 211, 168, .1); }
  .wd-sk b { font-family: var(--f-display); font-size: 15px; }
  .wd-sk small { display: block; font-size: 12px; color: var(--text-dim); line-height: 1.45; }
  .wd-sk__g { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: #2f6a52; color: #fff; font-family: var(--f-display); font-size: 18px; }
  .wd-capbtns { display: flex; flex-direction: column; gap: 4px; }
  .wd .wd-btn-red, .wd-ov .wd-btn-red { border-color: var(--cinnabar); color: #ff9c90; }
  .wd-ul { margin: 8px 0 0 1.2em; line-height: 1.8; font-size: 14.5px; }

  /* ───── 手機 ───── */
  @media (max-width: 860px) {
    .wd { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
    .wd-top { gap: 6px 10px; padding: calc(4px + var(--safe-t)) 8px 4px; }
    .wd-me small, .wd-date small { display: none; }
    .wd-me b { font-size: 16px; }
    .wd-flag { width: 28px; height: 33px; font-size: 16px; }
    .wd-date b { font-size: 16px; }
    .wd-res { order: 9; width: 100%; gap: 4px 12px; font-size: 13px; }
    .wd-res b { font-size: 14px; }
    .wd-ico { width: 34px; height: 34px; }
    .wd-speed button { min-width: 32px; height: 32px; padding: 0 6px; }
    .wd-next { min-height: 34px; padding: 4px 12px; font-size: 14px; }
    .wd-next small { display: none; }
    .wd-side {
      position: fixed; left: 0; right: 0; bottom: 0; height: 46dvh; border-left: 0; border-top: 1px solid var(--gilt);
      border-radius: 16px 16px 0 0; box-shadow: 0 -12px 30px rgba(0, 0, 0, .5); transition: transform .25s ease; grid-template-rows: auto auto minmax(0, 1fr);
    }
    .wd-side.is-min { transform: translateY(calc(100% - 52px - var(--safe-b))); }
    .wd-grip { display: block; width: 100%; height: 14px; border: 0; background: none; cursor: pointer; position: relative; }
    .wd-grip::after { content: ''; position: absolute; left: 50%; top: 5px; width: 44px; height: 4px; margin-left: -22px; border-radius: 99px; background: var(--line); }
    .wd-tab { font-size: 15px; padding: 6px 9px 8px; }
    .wd-zoom { bottom: auto; top: 10px; right: 8px; }
    .wd-modes { left: 8px; top: 10px; }
    .wd-modes__seg button { min-width: 40px; height: 32px; padding: 0 8px; font-size: 13px; }
    .wd-nftree { gap: 4px; }
    .wd-nf__n { font-size: 11.5px; }
    .wd-nf .wd-nf__g { width: 30px; height: 30px; font-size: 16px; }
    .wd-zoom button { width: 36px; height: 36px; }
    .wd-ticker { bottom: calc(60px + var(--safe-b)); left: 8px; max-width: calc(100% - 60px); }
    .wd-ticker p { font-size: 12px; }
    .wd-stage.has-sheet .wd-ticker { bottom: calc(46dvh + 8px); }
    .wd-title__hero { grid-template-columns: 1fr; }
    .wd-title__map { max-height: 42vh; aspect-ratio: auto; height: 42vh; }
    .wd-ov { padding: 0; place-items: end center; }
    .wd-dlg { width: 100%; max-height: 92dvh; border-radius: 16px 16px 0 0; border-bottom: 0; }
    .wd-scene { height: 150px; }
    .wd-scene__cast > div { width: 84px; height: 104px; }
    .wd-dlg h2 { font-size: 22px; }
    .wd-score { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .wd-end__maps { grid-template-columns: 1fr 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    .wd-map .city.is-sel .c-sel { animation: none; }
  }
  .wd-it .zh-item-art { display:block; width:100%;height:100%; }
  .wd-it { padding:1px; vertical-align:middle; }
  .wd-it.is-big { width:64px; height:64px; }
  .wd-speech { margin:12px 0; padding:12px 14px; border:1px solid var(--line); border-left:3px solid var(--gilt); border-radius:10px; background:#1c2440; display:grid; grid-template-columns:1fr auto; gap:5px 12px; }
  .wd-speech span { font-size:14px; }
  .wd-speech b { grid-column:2;grid-row:1 / span 2;color:var(--gilt);align-self:center;font-size:20px; }
  .wd-speech small { grid-column:1 / -1;color:var(--text-dim);line-height:1.6; }
  .wd-opt input[type="checkbox"] { accent-color:var(--gilt); }
  .wd-dlg [data-note] { color:var(--gilt); min-height:1.6em; margin-top:10px; }
  @media(max-width:560px) { .wd-speech { grid-template-columns:1fr; } .wd-speech b { grid-column:1;grid-row:auto; } }
.wd-world-nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 22px}.wd-world-nav button{min-height:44px;padding:10px 18px}.wd-world-nav button[aria-current="page"]{border-color:var(--gilt);color:var(--gilt)}
</style>
<script>
(function (ZH) {
  'use strict';

  // ═══════════════════════════ 1. 基礎：資料索引、狀態、曆法、路徑 ═══════════════════════════

  const NS = 'http://www.w3.org/2000/svg';
  const esc = v => ZH.esc(v);
  const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
  const MONTHS = ['十月', '十一月', '十二月', '正月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月'];
  const STAT = ['統', '勇', '謀', '政', '德'];
  const SPEED = 150;                               // 大道上每月行軍的地圖單位（約一百六十公里）
  const KIND_SPEED = { r: 1, p: 0.6, k: 0.45, f: 0.7 };
  const KIND_NAME = { r: '大道', p: '山道', k: '棧道', f: '渡河' };
  const TIER_NAME = { great: '上', good: '中', bad: '下' };
  const TIER_LABEL = { great: '史筆上', good: '史筆中', bad: '史筆下' };

  let MASTER = null;    // 分期資料母本，讀檔時先恢復同一分期
  let D = null;          // 戰役資料
  let G = null;          // 底圖
  let S = null;          // 存檔狀態
  const CITY = {}, ADJ = {}, CHAR = {}, EVT = {};
  let CITY_IDS = [], FAC_BASE = {};

  function indexWorld(world) {
    D = world;
    G = ZH.WORLD_GEO;
    [CITY, ADJ, CHAR, EVT, FACE, NFI].forEach(o => Object.keys(o).forEach(k => delete o[k]));
    FAC_BASE = {};
    NF = (D.id === 'zg' ? ZG_NF : D.chronicle ? CQ_NF : BASE_NF).map(x => Object.assign({}, x));
    NF.forEach(x => { NFI[x.id] = x; });
    IT = D.id === 'zg' ? ZG_IT : D.chronicle ? CQ_IT : BASE_IT;

    D.cities.forEach(c => {
      let [x, y] = ZH.worldProj(c[2], c[3]);
      const off = (D.offsets || {})[c[0]]; if (off) { x += off[0]; y += off[1]; }
      CITY[c[0]] = { id: c[0], name: c[1], lon: c[2], lat: c[3], x: x, y: y, size: c[4], kind: c[5], note: c[6], lab: (D.labels || {})[c[0]] || 'r' };
      ADJ[c[0]] = [];
    });
    CITY_IDS = D.cities.map(c => c[0]);
    D.roads.forEach(r => {
      const a = CITY[r[0]], b = CITY[r[1]];
      const len = Math.hypot(a.x - b.x, a.y - b.y);
      ADJ[r[0]].push({ to: r[1], kind: r[2], len: len, name: r[3] || '' });
      ADJ[r[1]].push({ to: r[0], kind: r[2], len: len, name: r[3] || '' });
    });
    D.factions.forEach(f => { FAC_BASE[f.id] = f; });
    D.chars.forEach(c => {
      CHAR[c[0]] = { id: c[0], name: c[1], f0: c[2], loc0: c[3], st: [c[4], c[5], c[6], c[7], c[8]], loyal0: c[9], trait: c[10] || '', art: c[11] && c[11].art, title: c[11] && c[11].title, speech: c[11] && Number.isFinite(c[11].speech) ? c[11].speech : undefined };
    });
    D.events.forEach(e => { EVT[e.id] = e; });
    indexRules();
  }

  // ───── 亂數（存在狀態裡，讀檔後能接著用） ─────
  function rng() {
    let t = (S.seed = (S.seed + 0x6D2B79F5) | 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const rr = (a, b) => a + (b - a) * rng();

  // ───── 曆法 ─────
  function dateOf(t) {
    if (D.chronicle) return { era: '已推演 ' + t + ' 個月', month: '', bc: D.calendar.bc0, m: ((t % 12) + 12) % 12, y: 0 };
    const y = Math.floor(t / 12), m = ((t % 12) + 12) % 12;
    const era = (D.calendar.names[y] || ('漢' + (y + 1) + '年'));
    return { era: era, month: MONTHS[m], bc: D.calendar.bc0 - y, m: m, y: y };
  }
  function dateText(t, short) {
    const d = dateOf(t);
    if (D.chronicle) return short ? d.era : '開局前 ' + d.bc + ' 年・' + d.era;
    return short ? d.era + d.month : '前 ' + d.bc + ' 年・' + d.era + d.month;
  }
  const isAutumn = t => { const m = ((t % 12) + 12) % 12; return m >= 9; };      // 七、八、九月
  const isWinter = t => { const m = ((t % 12) + 12) % 12; return m <= 3 && m >= 1; }; // 十一月～正月

  // ───── 勢力 ─────
  function fdef(fid) {
    const base = FAC_BASE[fid] || (S.FX && S.FX[fid]) || { id: fid, name: fid, glyph: '?', color: '#888' };
    const st = S && S.F[fid];
    if (!st) return base;
    return Object.assign({}, base, { name: st.name || base.name, glyph: st.glyph || base.glyph, color: st.color || base.color });
  }
  const facIds = () => Object.keys(S.F);
  const alive = fid => !!(fid && S.F[fid] && !S.F[fid].dead);
  const isPlayer = fid => fid === S.player;
  const citiesOf = fid => CITY_IDS.filter(c => S.C[c].o === fid);
  const armiesOf = fid => S.A.filter(a => a.f === fid);
  function troopsOf(fid) {
    let n = 0;
    CITY_IDS.forEach(c => { if (S.C[c].o === fid) n += S.C[c].tr; });
    S.A.forEach(a => { if (a.f === fid) n += a.tr; });
    return n;
  }
  const rkey = (a, b) => (a < b ? a + '|' + b : b + '|' + a);
  const rel = (a, b) => (a === b ? 100 : (S.R[rkey(a, b)] || 0));
  function setRel(a, b, v) { if (a !== b) S.R[rkey(a, b)] = clamp(Math.round(v), -100, 100); }
  const addRel = (a, b, d) => setRel(a, b, rel(a, b) + d);
  const allied = (a, b) => a === b || S.AL.indexOf(rkey(a, b)) > -1;
  const truced = (a, b) => (S.TR[rkey(a, b)] || 0) > S.t;
  /** 可以攻打：不是自己、不是同盟、沒有停戰 */
  const hostile = (a, b) => !!a && !!b && a !== b && !allied(a, b) && !truced(a, b);
  function ally(a, b) { const k = rkey(a, b); if (S.AL.indexOf(k) === -1) S.AL.push(k); delete S.TR[k]; }
  function unally(a, b) { const k = rkey(a, b); const i = S.AL.indexOf(k); if (i > -1) S.AL.splice(i, 1); }
  function capitalOf(fid) {
    const st = S.F[fid];
    if (st && st.cap && S.C[st.cap] && S.C[st.cap].o === fid) return st.cap;
    const own = citiesOf(fid).sort((a, b) => CITY[b].size - CITY[a].size || S.C[b].tr - S.C[a].tr);
    if (st) st.cap = own[0] || null;
    return own[0] || null;
  }
  const fame = fid => (S.F[fid] ? S.F[fid].fame : 0);

  // ───── 人物 ─────
  const P = pid => S.P[pid];
  const cname = pid => (CHAR[pid] ? CHAR[pid].name : pid);
  const statBase = (pid, k) => (CHAR[pid] ? CHAR[pid].st[k] : 0);
  /** 能力＝本身＋技能＋寶物（最高 100） */
  const stat = (pid, k) => (CHAR[pid] ? Math.min(100, CHAR[pid].st[k] + statBonus(pid, k)) : 0);
  const trait = pid => (CHAR[pid] ? CHAR[pid].trait : '');
  const rulerOf = fid => (S.F[fid] ? S.F[fid].ruler : null);
  const charsOf = fid => Object.keys(S.P).filter(id => S.P[id].f === fid && S.P[id].st === 's');
  const charsAt = (cid, fid) => Object.keys(S.P).filter(id => { const p = S.P[id]; return p.st === 's' && p.loc === cid && (!fid || p.f === fid); });
  const freeAt = cid => Object.keys(S.P).filter(id => S.P[id].st === 'v' && S.P[id].loc === cid);
  const captivesAt = cid => Object.keys(S.P).filter(id => S.P[id].st === 'c' && S.P[id].loc === cid);
  const idle = pid => { const p = S.P[pid]; return p && p.st === 's' && (p.busy || 0) <= S.t && !/^A/.test(String(p.loc)); };
  const hasTrait = (fid, tr) => charsOf(fid).some(id => trait(id) === tr);
  function bestBy(list, k) { return list.slice().sort((a, b) => stat(b, k) - stat(a, k))[0] || null; }

  // ───── 道路與路徑 ─────
  const roadKey = (a, b) => (a < b ? a + '>' + b : b + '>' + a);
  const blocked = (a, b) => !!S.B[roadKey(a, b)];
  function edgeMonths(e, from, opts) {
    if (blocked(from, e.to) && !(opts && opts.stealth)) return Infinity;
    let sp = SPEED * KIND_SPEED[e.kind];
    if (opts && opts.stealth) sp *= 1.5;
    if (opts && opts.fast) sp *= opts.fast === true ? 1.3 : opts.fast;
    return e.len / sp;
  }
  /**
   * 最短路徑（月）。中途只能經過自己或盟友的城；終點可以是任何城。
   * opts.free：不限制中途（電腦撤退、事件用）
   */
  function findPath(from, to, fid, opts) {
    if (from === to) return { path: [from], months: 0 };
    const dist = {}, prev = {}, done = {};
    CITY_IDS.forEach(c => { dist[c] = Infinity; });
    dist[from] = 0;
    for (;;) {
      let u = null, best = Infinity;
      CITY_IDS.forEach(c => { if (!done[c] && dist[c] < best) { best = dist[c]; u = c; } });
      if (!u || u === to) break;
      done[u] = true;
      if (u !== from && !(opts && opts.free)) {
        const o = S.C[u].o;
        if (o !== fid && !allied(o, fid) && !transit(o, fid)) continue;   // 敵城擋路：不能穿過
      }
      ADJ[u].forEach(e => {
        const m = edgeMonths(e, u, opts);
        if (dist[u] + m < dist[e.to]) { dist[e.to] = dist[u] + m; prev[e.to] = u; }
      });
    }
    if (!isFinite(dist[to])) return null;
    const path = [to];
    while (path[0] !== from) path.unshift(prev[path[0]]);
    return { path: path, months: dist[to] };
  }
  /** 離某城最近的己方城（含自己） */
  function nearestOwn(fid, cid, opts) {
    let best = null, bm = Infinity;
    citiesOf(fid).forEach(c => {
      const r = findPath(cid, c, fid, Object.assign({ free: true }, opts || {}));
      if (r && r.months < bm) { bm = r.months; best = c; }
    });
    return best;
  }
  const neighbors = cid => ADJ[cid].map(e => e.to);

  // ───── 紀錄 ─────
  function log(text, kind, where) {
    S.log.unshift([S.t, text, kind || '']);
    if (S.log.length > 60) S.log.length = 60;
    if (typeof uiTicker === 'function') uiTicker(text, kind);
  }
  function chron(text) {
    S.chron.push([S.t, text]);
    if (S.chron.length > 80) S.chron.shift();
  }

  // ═══════════════════════════ 2. 新戰役 ═══════════════════════════
  function newState(opts) {
    const st = {
      v: 2, w: D.id, player: opts.player, hist: !!opts.hist, real: !!opts.real, speed: 1,
      t: D.startTick, seed: opts.seed || (Date.now() & 0x7fffffff) || 7, F: {}, C: {}, P: {}, A: [], R: {}, AL: [], TR: {}, B: {}, FX: {},
      ev: {}, cards: [], log: [], chron: [], pend: null, ag: [], stats: { won: 0, lost: 0, taken: 0, lostC: 0, anch: 0, anchOk: 0, played: 0 },
      epoch: D.epoch || null, council: null, goal: D.id==='zg' ? (opts.goal || 'strength') : null, zgPact: null, zgPactHonours: {},
      startedAt: Date.now(), playMs: 0, nextId: 1, ended: null, help: {}
    };
    S = st;
    D.factions.forEach(f => {
      S.F[f.id] = { g: f.gold, f: f.food, fame: D.chronicle ? (f.fame || 45) : f.id === 'chu' ? 70 : f.id === 'han' ? 55 : 40, dead: 0, ruler: f.ruler, cap: f.cap };
    });
    CITY_IDS.forEach(c => {
      const ci = CITY[c];
      const pass = ci.kind === 'pass';
      S.C[c] = { o: null, tr: 0, df: 18 + ci.size * 10 + (pass ? 30 : 0), mx: (D.minxin || {})[c] || 60, fa: ci.size * 8 + 4, co: ci.size * 6 + 4, sg: 0 };
    });
    Object.keys(D.start).forEach(f => Object.keys(D.start[f]).forEach(c => { S.C[c].o = f; S.C[c].tr = D.start[f][c]; }));
    D.chars.forEach(c => { S.P[c[0]] = { f: c[2] || '', loc: c[3], loyal: c[9], st: c[2] ? 's' : 'v', busy: 0 }; });
    (D.relations || []).forEach(([a, b, v]) => setRel(a, b, v));
    (D.allies || []).forEach(([a, b]) => ally(a, b));
    (D.blocked || []).forEach(([a, b]) => { S.B[roadKey(a, b)] = 1; });
    // 玩家的國家：名望起點
    if (S.F[S.player]) S.F[S.player].fame = Math.max(S.F[S.player].fame, 45);
    // 方針（玩家自選；電腦依資料或個性）、寶物
    if (opts.doc) setDoctrine(S.player, opts.doc, true);
    upgradeState(true);
    return S;
  }

  // ═══════════════════════════ 3. 事件用的工具（W） ═══════════════════════════
  const W = {
    get t() { return S.t; },
    get hist() { return S.hist; },
    get player() { return S.player; },
    isPlayer: isPlayer,
    alive: alive,
    dead: fid => !alive(fid),
    owner: cid => (S.C[cid] ? S.C[cid].o : null),
    citiesOf: citiesOf,
    capital: fid => capitalOf(fid),
    power: troopsOf,
    allied: allied,
    charAlive: pid => !!S.P[pid] && S.P[pid].st !== 'd',
    charIn: (pid, fid) => !!S.P[pid] && S.P[pid].st === 's' && S.P[pid].f === fid,
    loyal: pid => (S.P[pid] ? S.P[pid].loyal : 0),
    setLoyal(pid, v, why) { const p = S.P[pid]; if (!p || p.st !== 's') return; p.loyal = clamp(v, 0, 100); if (why && p.f === S.player) log(cname(pid) + '：' + why + '（知遇 ' + Math.round(p.loyal) + '）', 'good'); },
    besieged: cid => S.A.some(a => a.st === 'siege' && a.at === cid),
    all(fn) { facIds().forEach(f => { if (alive(f)) fn(f); }); },
    setRel: setRel, addRel: addRel, ally: ally, unally: unally,
    truce(a, b, months) { S.TR[rkey(a, b)] = S.t + months; S.A.forEach(x => { if ((x.f === a && S.C[x.goal] && S.C[x.goal].o === b) || (x.f === b && S.C[x.goal] && S.C[x.goal].o === a)) retreat(x, '停戰'); }); },
    endTruce(a, b) { delete S.TR[rkey(a, b)]; },
    addFame(fid, d) { if (S.F[fid]) S.F[fid].fame = clamp(S.F[fid].fame + d, 0, 100); },
    addRes(fid, r) { const f = S.F[fid]; if (!f) return; if (r.g) f.g = Math.max(0, f.g + r.g); if (r.f) f.f = Math.max(0, f.f + r.f); if (r.fame) W.addFame(fid, r.fame); },
    rename(fid, o) { const f = S.F[fid]; if (!f) return; if (o.name) f.name = o.name; if (o.glyph) f.glyph = o.glyph; if (o.color) f.color = o.color; if (o.ruler && S.P[o.ruler] && S.P[o.ruler].st !== 'd') { setRuler(fid, o.ruler); } },
    setRuler: (fid, pid) => setRuler(fid, pid),
    moveChar(pid, fid, cid, loyal) {
      const p = S.P[pid]; if (!p || p.st === 'd' || !alive(fid)) return;
      leaveArmy(pid);
      const was = p.f;
      if (was && S.F[was] && S.F[was].ruler === pid) return;   // 主君不會被事件搬走
      p.f = fid; p.st = 's'; p.loc = cid || capitalOf(fid); p.busy = S.t + 1;
      if (loyal !== undefined) p.loyal = loyal;
      if (fid === S.player) log(cname(pid) + ' 投效我方。', 'good');
      else if (was === S.player) log(cname(pid) + ' 離開了我們，投奔' + fdef(fid).name + '。', 'war');
    },
    killChar(pid, why) { killChar(pid, why); },
    freeChar(pid, cid) { const p = S.P[pid]; if (!p || p.st === 'd') return; leaveArmy(pid); p.f = ''; p.st = 'v'; if (cid) p.loc = cid; },
    setOwner(cid, fid, troops) { takeCity(cid, fid, troops === undefined ? S.C[cid].tr : troops, true); },
    merge(from, to, o) { mergeFaction(from, to, o || {}); },
    addTroops(cid, n) { S.C[cid].tr = Math.max(0, S.C[cid].tr + n); },
    addTroopsFaction(fid, ratio, why) {
      citiesOf(fid).forEach(c => { S.C[c].tr = Math.round(S.C[c].tr * (1 + ratio)); });
      S.A.forEach(a => { if (a.f === fid) a.tr = Math.round(a.tr * (1 + ratio)); });
      if (why) log(fdef(fid).name + '：' + why, ratio < 0 ? 'war' : 'good');
    },
    boost(fid, cid, troops, why) {
      if (!alive(fid) || !cid || S.C[cid].o !== fid) cid = capitalOf(fid);
      if (!cid) return;
      S.C[cid].tr += troops;
      log(fdef(fid).name + '：' + why + '（＋' + wan(troops) + '）', fid === S.player ? 'good' : '');
    },
    agendaNow(fid, targets, months, gen) { S.ag.push({ f: fid, from: S.t, to: S.t + months, targets: targets, push: 2, gen: gen || null }); },
    block(a, b, on) { if (on) S.B[roadKey(a, b)] = 1; else delete S.B[roadKey(a, b)]; },
    nearest: (fid, cid) => nearestOwn(fid, cid) || capitalOf(fid),
    spawnArmy(o) { spawnArmy(o); },
    buffRuler(fid, buff, why) {
      const r = rulerOf(fid);
      const army = S.A.find(a => a.f === fid && a.gens.indexOf(r) > -1);
      if (army) { army.buff = Object.assign({}, buff, { until: S.t + (buff.months || 2), name: why }); log(why + '：' + cname(r) + '的軍隊攻擊力大增！', 'good'); }
      else { S.F[fid].buff = Object.assign({}, buff, { until: S.t + (buff.months || 2), name: why }); log(why + '：下一次' + cname(r) + '出陣，攻擊力大增！', 'good'); }
    },
    rebel(pid, o) { rebel(pid, o); },
    log: (t, k) => log(t, k),
    rand: () => rng()
  };

  function setRuler(fid, pid) {
    const f = S.F[fid]; if (!f) return;
    const p = S.P[pid]; if (!p || p.st === 'd') return;
    leaveArmy(pid);
    p.f = fid; p.st = 's'; p.loyal = 100;
    if (!p.loc || !S.C[p.loc] || S.C[p.loc].o !== fid) p.loc = capitalOf(fid);
    f.ruler = pid;
  }
  const wan = n => (n >= 9950 ? (n / 10000).toFixed(n >= 100000 ? 0 : 1).replace(/\.0$/, '') + ' 萬' : Math.round(n / 100) * 100 + ' 人');
  const wanShort = n => (n >= 9950 ? (n / 10000).toFixed(1).replace(/\.0$/, '') + '萬' : (n >= 1000 ? (n / 1000).toFixed(0) + '千' : Math.round(n)));

  // ═══════════════════════════ 4. 模擬：經濟、軍隊、戰鬥、人心、電腦 ═══════════════════════════

  const REPORTS = [];       // 這個月玩家要看的戰報
  const CAPTIVES = [];      // 這個月玩家俘虜的人（要決定登用或釋放）
  const PROPOSALS = [];     // 電腦向玩家提出的外交

  // ───── 戰力 ─────
  function genMult(gens, fid) {
    if (!gens.length) return 0.5;
    const cmd = gens.slice().sort((a, b) => cmdScore(b) - cmdScore(a))[0];
    const brave = Math.max.apply(null, gens.map(g => stat(g, 1)));
    let m = 0.55 + cmdScore(cmd) / 200 + brave / 450 + stat(cmd, 2) / 900;
    if (gens.some(g => trait(g) === 'bawang')) m *= 1.3;
    if (gens.some(g => trait(g) === 'xiaojiang')) m *= 1.12;
    return m;
  }
  const cmdScore = pid => stat(pid, 0) * (trait(pid) === 'bingxian' ? 1.25 : 1);
  function armyPower(a, vsTroops) {
    let p = a.tr * genMult(a.gens, a.f) * clamp(a.mor, 0.2, 1.3) * (1 + mod(a.f, 'atk'));
    const b = a.buff;
    if (b && b.until > S.t && b.atk) {
      if (!b.outnumbered || a.tr < vsTroops) p *= b.atk;
    }
    return p;
  }
  function cityPower(cid) {
    const c = S.C[cid];
    const gens = charsAt(cid, c.o);
    let p = c.tr * genMult(gens, c.o) * (1 + c.df / 90) * (0.7 + c.mx / 330);
    if (CITY[cid].kind === 'pass') p *= 1.25;
    return p * cityDefMult(cid);
  }
  function odds(att, def) {
    const r = att / Math.max(1, def);

  // ───── 經濟 ─────
  function economy() {
    facIds().forEach(fid => {
      const f = S.F[fid];
      if (f.dead) return;
      let gold = 0, food = 0, troops = 0;
      const admin = f.admin && f.admin > S.t;
      citiesOf(fid).forEach(cid => {
        const c = S.C[cid], ci = CITY[cid];
        const eff = 0.5 + c.mx / 200;
        gold += c.co * 0.75 * eff;
        let fm = c.fa * 0.85 * eff;
        if (isAutumn(S.t)) fm *= 2; else if (isWinter(S.t)) fm *= 0.5;
        food += fm;
        troops += c.tr;

        citiesOf(fid).forEach(c => { S.C[c].tr = Math.round(S.C[c].tr * 0.97); });

  const ownMod = (cid, k) => (S && S.C[cid] && S.C[cid].o ? mod(S.C[cid].o, k) : 0);

  // ───── 內政指令（玩家與電腦共用） ─────
  const DEV = {

    mx: { name: '巡撫', glyph: '民', cost: 40, stat: 4, desc: '民心上升' },
    df: { name: '修城', glyph: '城', cost: 70, stat: 0, desc: '城防增加' }
  };
  function devGain(kind, cid, pid) {
    const ci = CITY[cid];
    const admin = S.F[S.C[cid].o] && S.F[S.C[cid].o].admin > S.t ? 1.3 : 1;
    const v = stat(pid, DEV[kind].stat);
    const fid = S.C[cid].o;
    if (kind === 'fa' || kind === 'co') return Math.round((4 + v / 10) * admin * (1 + (kind === 'fa' ? mod(fid, 'fa') : 0)) * (hasSk(pid, 'tuntian') ? 1.4 : 1));
    if (kind === 'draft') return Math.round((1200 + stat(pid, 3) * 25 + stat(pid, 4) * 12) * (0.7 + ci.size * 0.15) * admin * (1 + mod(fid, 'draft')) / 100) * 100;

  function doDevelop(kind, cid, pid) {

  // ───── 軍隊 ─────
  function newArmy(f, from, to, troops, gens, path) {

  function spawnArmy(o) {
    if (!alive(o.f)) return;

    if (!from) return;

  }
  function leaveArmy(pid) {

  }
  function armyPos(a) {

    const A = CITY[a.path[a.i]], B = CITY[a.path[a.i + 1]];

  }
  function monthsLeft(a) {
    if (a.st === 'siege') return 0;

    for (let k = a.i; k < a.path.length - 1; k++) {
      const e = ADJ[a.path[k]].find(x => x.to === a.path[k + 1]);
      const em = edgeMonths(e, a.path[k], { stealth: stealthOn(a), fast: armySpeed(a) });

  }
  const stealthOn = a => !!(a.buff && a.buff.stealth && a.buff.until > S.t);

  function moveArmies() {
    S.A.slice().forEach(a => {

      let budget = 1;
      while (budget > 1e-6 && S.A.indexOf(a) > -1 && a.st !== 'siege') {

  // ───── 攻城 ─────
  function sieges() {
    const byCity = {};

    Object.keys(byCity).forEach(cid => {
      byCity[cid].sort((x, y) => y.tr - x.tr).forEach(a => {

  }
  function assault(a, cid) {
    const c = S.C[cid], owner = c.o;

  /** 城換主人：守將被俘或逃走，軍隊進城 */

    if (citiesOf(fid).length) { capitalOf(fid); return; }
    if (armiesOf(fid).length) {
      // 沒有城了：軍隊找地方落腳，找不到就潰散
      armiesOf(fid).forEach(a => { if (a.st !== 'siege') { a.goal = a.path[a.path.length - 1]; } });
      if (armiesOf(fid).some(a => a.st === 'siege')) return;
    }
    f.dead = 1;
    S.A.filter(a => a.f === fid).forEach(a => { a.gens.forEach(g => { if (S.P[g]) S.P[g].loc = armyNode(a); }); removeArmy(a); });
    Object.keys(S.P).forEach(id => {
      const p = S.P[id];
      if (p.f === fid && p.st === 's') { p.st = 'v'; p.f = ''; if (!CITY[p.loc]) p.loc = CITY_IDS[0]; }
    });
    const text = fdef(fid).name + '滅亡了。';
    log(text, fid === S.player ? 'war' : 'ev');
    chron(text);
    S.AL = S.AL.filter(k => k.split('|').indexOf(fid) === -1);
  }
  function killChar(pid, why) {
    const p = S.P[pid]; if (!p || p.st === 'd') return;
    leaveArmy(pid);
    const was = p.f, heirF = p.st === 'c' ? p.cf : was;
    p.st = 'd'; p.why = why || '';
    dropItem(pid, heirF);   // 先標成已故，寶物才不會又被分回給他
    if (was && S.F[was] && S.F[was].ruler === pid) {
      const heir = charsOf(was).sort((a, b) => stat(b, 4) + stat(b, 0) - stat(a, 4) - stat(a, 0))[0];
      if (heir) { S.F[was].ruler = heir; S.P[heir].loyal = 100; log(fdef(was).name + '：' + cname(pid) + '死後，由' + cname(heir) + '繼承。', 'ev'); }
    }
    if (why) { const t = cname(pid) + why + '。'; log(t, was === S.player ? 'war' : ''); chron(t); }
  }
  function mergeFaction(from, to, o) {
    if (!alive(from) || from === to) return;
    const keep = o.troopsKeep === undefined ? 0.8 : o.troopsKeep;
    citiesOf(from).forEach(cid => {
      if (to && alive(to)) { S.C[cid].o = to; S.C[cid].tr = Math.round(S.C[cid].tr * keep); claimTreasure(cid, to); }
    });
    S.A.filter(a => a.f === from).forEach(a => { if (to && alive(to)) { a.f = to; } else removeArmy(a); });
    Object.keys(S.P).forEach(id => {
      const p = S.P[id];
      if (p.f !== from || p.st !== 's') return;
      if (to && alive(to) && (!o.chars || o.chars === 'join')) { p.f = to; p.loyal = 50; }
      else { p.f = ''; p.st = 'v'; }
    });
    S.F[from].dead = 1;
    if (to && alive(to) && S.F[from].inv && S.F[from].inv.length) { S.F[from].inv.splice(0).forEach(id => giveItem(to, id)); }
    S.AL = S.AL.filter(k => k.split('|').indexOf(from) === -1);
    if (to && alive(to)) { const t = fdef(from).name + '併入' + fdef(to).name + '。'; log(t, to === S.player ? 'good' : 'ev'); chron(t); }
  }
  /** 人物自立（韓信三分天下） */
  function rebel(pid, o) {
    const p = S.P[pid]; if (!p || p.st !== 's') return;
    const lord = p.f;
    const id = 'r_' + pid;
    S.FX[id] = { id: id, name: o.name, glyph: o.glyph, color: o.color || '#7f5598', ruler: pid, title: o.name + '王', desc: '', aggr: 0.6 };
    S.F[id] = { g: 400, f: 800, fame: 60, dead: 0, ruler: pid, cap: null, name: o.name, glyph: o.glyph, color: o.color, inv: [] };
    setDoctrine(id, aiDoctrine(id), false);
    const here = /^A/.test(String(p.loc)) ? null : p.loc;
    const army = S.A.find(a => a.gens.indexOf(pid) > -1);
    let base = here || (army && (army.at || army.path[army.i]));
    const own = citiesOf(lord).sort((a, b) => dist(a, base) - dist(b, base)).slice(0, o.take || 2);
    own.forEach(c => { S.C[c].o = id; });
    if (army) army.f = id;
    p.f = id; p.loyal = 100;
    S.F[id].cap = own[0] || null;
    setRel(id, lord, -60);
    log(o.text, 'war');
    chron(o.text);
    checkFaction(lord);
  }
  const dist = (a, b) => (!a || !b ? 1e9 : Math.hypot(CITY[a].x - CITY[b].x, CITY[a].y - CITY[b].y));

  // ───── 人心（知遇） ─────
  function loyalty() {
    Object.keys(S.P).forEach(id => {
      const p = S.P[id];
      if (p.st === 'c') {   // 俘虜：電腦關了幾個月就放人
        if (p.cf !== S.player && S.t - (p.cap || 0) >= 3) { if (alive(p.cf) && rng() < 0.3) { p.st = 's'; p.f = p.cf; p.loyal = 45; p.loc = capitalOf(p.cf); } else { p.st = 'v'; p.f = ''; } }
        return;
      }
      if (p.st !== 's' || !alive(p.f) || S.F[p.f].ruler === id) return;
      const ruler = rulerOf(p.f);
      let d = (stat(ruler, 4) - 60) / 30 + (fame(p.f) - 50) / 120;
      const used = (p.used || -9) >= S.t - 1 || /^A/.test(String(p.loc));
      const talent = Math.max(stat(id, 0), stat(id, 2), stat(id, 3));
      if (used) d += 1.2; else d -= talent >= 85 ? 1.6 : 0.3;
      if (p.f === S.player && ruler && trait(ruler) === 'renshi') d += 0.4;
      p.loyal = clamp(p.loyal + d, 0, 100);
      if (trait(id) === 'zhong') p.loyal = Math.max(60, p.loyal);
      if (p.f === S.player && p.loyal < 35 && !p.warned) { p.warned = 1; log(cname(id) + ' 的知遇只剩 ' + Math.round(p.loyal) + '：大才閒置會離開，給他差事或賞賜吧。', 'war'); }
      if (p.loyal >= 45) p.warned = 0;
      if (p.loyal < 22 && rng() < (22 - p.loyal) / 50 && !/^A/.test(String(p.loc))) defect(id);
    });
    // 在野人物：電腦登用
    Object.keys(S.P).forEach(id => {
      const p = S.P[id];
      if (p.st !== 'v' || !S.C[p.loc]) return;
      const o = S.C[p.loc].o;
      if (o && o !== S.player && alive(o) && rng() < 0.12) { p.st = 's'; p.f = o; p.loyal = 55; }
    });
  }
  function defect(pid) {
    const p = S.P[pid], from = p.f;
    let best = null, bs = -1e9;
    facIds().forEach(f => {
      if (!alive(f) || f === from || f === 'yidi') return;
      const s = stat(rulerOf(f), 4) + fame(f) / 2 + troopsOf(f) / 20000 - (allied(f, from) ? 20 : 0);
      if (s > bs) { bs = s; best = f; }
    });
    if (best && rng() < 0.7) {
      const cap = capitalOf(best);
      p.f = best; p.loc = cap; p.loyal = 55; p.busy = S.t + 1; p.warned = 0;
      const t = cname(pid) + '離開' + fdef(from).name + '，投奔' + fdef(best).name + '。';
      log(t, from === S.player ? 'war' : best === S.player ? 'good' : '');
      chron(t);
    } else {
      p.f = ''; p.st = 'v';
      log(cname(pid) + '離開' + fdef(from).name + '，下落不明。', from === S.player ? 'war' : '');
    }
  }

  // ───── 電腦 ─────
  function agendasOf(fid) {
    if (!S.hist) return [];
    return (D.agendas || []).concat(S.ag || []).filter(g => g.f === fid && g.from <= S.t && g.to >= S.t);
  }
  function aiTurn(fid) {
    const f = S.F[fid], def = fdef(fid);
    const own = citiesOf(fid);
    if (!own.length) return;
    const aggr = def.aggr === undefined ? 0.3 : def.aggr;
    const officers = charsOf(fid);
    // 1. 內政
    let acts = f.g > 600 ? 3 : f.g > 150 ? 2 : 1;
    // 威脅：關係很差的鄰國守軍（打個對折）＋正朝這裡來的敵軍
    const threat = cid => neighbors(cid).reduce((s, n) => { const o = S.C[n].o; return s + (o && hostile(fid, o) && rel(fid, o) < -20 ? S.C[n].tr * 0.5 : 0); }, 0) +
      S.A.filter(a => a.goal === cid && a.f !== fid && hostile(fid, a.f)).reduce((s, a) => s + a.tr, 0);
    for (let k = 0; k < acts; k++) {
      const cid = own[Math.floor(rng() * own.length)];
      const c = S.C[cid];
      const gov = officers.filter(id => idle(id) && S.P[id].loc === cid)[0] || officers.filter(idle)[0];
      if (!gov) break;
      const th = threat(cid);
      let kind = 'fa';
      if (th > c.tr * 0.8 && c.tr < troopMax(cid) * 0.8) kind = rng() < 0.6 ? 'draft' : 'df';
      else if (c.mx < 45) kind = 'mx';
      else kind = ['fa', 'co', 'draft', 'df', 'fa'][Math.floor(rng() * 5)];
      const was = S.P[gov].loc;
      S.P[gov].loc = cid;
      if (!doDevelop(kind, cid, gov)) { S.P[gov].loc = was; break; }
      S.P[gov].loc = was;
    }
    // 2. 出兵
    const ags = agendasOf(fid);
    const agTargets = {};
    ags.forEach(g => g.targets.forEach(t => { agTargets[t] = Math.max(agTargets[t] || 0, g.push); }));
    aiTransfer(fid, own);
    const maxArmies = 1 + Math.floor(own.length / 4) + (ags.length ? 1 : 0);
    if (armiesOf(fid).filter(a => S.C[a.goal].o !== fid).length >= maxArmies) return;
    const cands = [];
    const seen = {};
    // 邊境：和我方城池相鄰的他國城
    const frontier = {};
    own.forEach(c => neighbors(c).forEach(n => { if (S.C[n].o !== fid) frontier[n] = 1; }));
    own.forEach(src => {
      const c = S.C[src];
      const keep = Math.min(c.tr * (0.7 - aggr * 0.3), Math.max(2500, threat(src) * 0.9, CITY[src].size * 2200));
      const avail = c.tr - keep;
      if (avail < 4000) return;
      const consider = t => {
        if (seen[src + t]) return;
        seen[src + t] = 1;
        const o = S.C[t].o;
        if (!hostile(fid, o)) return;
        const ag = agTargets[t] || 0;
        const r = rel(fid, o);
        if (!ag && o === 'yidi') return;
        if (S.A.some(a => a.f === fid && a.goal === t)) return;
        const path = findPath(src, t, fid, {});
        if (!path || path.months > (ag ? 4 : 2.2)) return;
        const gens = officers.filter(id => idle(id) && S.P[id].loc === src).sort((a, b) => cmdScore(b) - cmdScore(a)).slice(0, 2);
        // 關係不夠差的：只有在兵力遠勝時才會趁機出兵（架空模式）
        const opp = !ag && r > (S.hist ? -30 : -10);
        if (opp && S.hist) return;
        cands.push({ src: src, t: t, avail: avail, path: path, ag: ag, gens: gens, opp: opp });
      };
      neighbors(src).forEach(consider);
      Object.keys(frontier).forEach(consider);
      Object.keys(agTargets).forEach(consider);
    });
    cands.forEach(x => {
      const send = x.avail;
      const fake = { tr: send, gens: x.gens.length ? x.gens : [rulerOf(fid)], f: fid, mor: 1, buff: null };
      const ratio = armyPower(fake, S.C[x.t].tr) / Math.max(1, cityPower(x.t));
      x.ratio = ratio;
      x.score = ratio * (1 + aggr) * (x.ag ? x.ag : 1) - x.path.months * 0.3 + (S.C[x.t].o === S.player ? 0.15 : 0);
    });
    const needOf = x => (x.ag ? 1.05 : x.opp ? 2.0 - aggr * 0.4 : 1.5 - aggr * 0.4);
    const ok = cands.filter(x => x.ratio >= needOf(x)).sort((a, b) => b.score - a.score);
    const pick = ok[0];
    if (!pick) return;
    if (!pick.ag && rng() > (pick.opp ? aggr * 0.45 : 0.35 + aggr * 0.5)) return;
    let gens = pick.gens;
    // 史實方向指定的將領：直接調來領兵
    const ag = ags.find(g => g.targets.indexOf(pick.t) > -1 && g.gen);
    if (ag && S.P[ag.gen] && S.P[ag.gen].st === 's' && S.P[ag.gen].f === fid && idle(ag.gen)) { S.P[ag.gen].loc = pick.src; gens = [ag.gen].concat(gens.filter(g => g !== ag.gen)).slice(0, 2); }
    if (!gens.length) {
      const any = officers.filter(idle).sort((a, b) => cmdScore(b) - cmdScore(a))[0];
      if (!any) return;
      S.P[any].loc = pick.src; gens = [any];
    }
    const def0 = cityPower(pick.t);
    const fake = { tr: 1, gens: gens, f: fid, mor: 1, buff: null };
    const unit = armyPower(fake, 0);
    const want = Math.min(pick.avail, Math.max(5000, Math.round(def0 * 1.9 / Math.max(0.3, unit) / 1000) * 1000));
    march(fid, pick.src, pick.t, want, gens, {});
  }
  /** 電腦調兵：後方城池多出來的兵，往最近的前線城送（每個月最多一支） */
  function aiTransfer(fid, own) {
    const front = own.filter(c => neighbors(c).some(n => S.C[n].o && S.C[n].o !== fid && hostile(fid, S.C[n].o)));
    if (!front.length) return;
    if (S.A.some(a => a.f === fid && a.st === 'march' && S.C[a.goal].o === fid && a.born === S.t)) return;
    const srcs = own.filter(c => front.indexOf(c) === -1).sort((a, b) => S.C[b].tr - S.C[a].tr);
    for (const src of srcs) {
      const extra = S.C[src].tr - (CITY[src].size * 2500 + 2500);
      if (extra < 6000) continue;
      let best = null, bm = 9;
      front.forEach(t => { const r = findPath(src, t, fid, {}); if (r && r.months < bm) { bm = r.months; best = t; } });
      if (!best || bm > 3) continue;
      const r = findPath(src, best, fid, {});
      const n = Math.round(extra * 0.8 / 1000) * 1000;
      S.C[src].tr -= n;
      const esc0 = charsOf(fid).filter(id => idle(id) && S.P[id].loc === src && S.F[fid].ruler !== id).sort((a, b) => cmdScore(a) - cmdScore(b)).slice(0, 1);
      newArmy(fid, src, best, n, esc0, r.path);
      return;
    }
  }
  function aiDiplomacy() {
    if (S.t % 3 !== 0) return;
    facIds().forEach(fid => {
      if (!alive(fid) || fid === S.player || fid === 'yidi') return;
      const pr = rel(fid, S.player);
      const myP = troopsOf(fid), plP = troopsOf(S.player);
      // 向玩家求和
      if (pr < -20 && hostile(fid, S.player) && myP < plP * 0.6 && rng() < 0.18 && !PROPOSALS.some(x => x.f === fid)) {
        PROPOSALS.push({ f: fid, kind: 'truce', text: fdef(fid).name + '派使者來求和：願意停戰一年。' });
      } else if (pr > 20 && !allied(fid, S.player) && rng() < 0.08) {
        // 有共同的敵人：提議同盟
        const common = facIds().find(x => alive(x) && x !== fid && x !== S.player && rel(fid, x) < -30 && rel(S.player, x) < -30);
        if (common && !PROPOSALS.some(x => x.f === fid)) PROPOSALS.push({ f: fid, kind: 'ally', text: fdef(fid).name + '派使者來：願與我方結盟，共同對付' + fdef(common).name + '。' });
      }
    });
  }

  /** 架空模式：相鄰的國家日久生隙；分封諸侯與西楚的盟約會慢慢鬆動 */
  function friction() {
    if (S.hist) return;
    const pairs = {};
    CITY_IDS.forEach(c => {
      const a = S.C[c].o;
      if (!a || !alive(a)) return;
      neighbors(c).forEach(n => {
        const b = S.C[n].o;
        if (!b || b === a || !alive(b)) return;
        pairs[rkey(a, b)] = [a, b];
      });
    });
    Object.keys(pairs).forEach(k => {
      const [a, b] = pairs[k];
      if (a === S.player || b === S.player) return;
      if (a === 'yidi' || b === 'yidi') return;
      const al = allied(a, b);
      addRel(a, b, -(al ? 0.6 : 1.4) * rr(0.5, 1.5));
      if (al && rel(a, b) < -25 && rng() < 0.25) {
        unally(a, b);
        const t = fdef(a).name + '與' + fdef(b).name + '決裂。';
        log(t, ''); chron(t);
      }
    });
  }

  // ───── 一個月 ─────
  function tick() {
    S.t += 1;
    rulesMonth();
    friction();
    economy();
    moveArmies();
    sieges();
    loyalty();
    nfTick();
    perksTick();
    facIds().forEach(fid => { if (alive(fid) && fid !== S.player) aiTurn(fid); });
    aiDiplomacy();
    // 計策效果到期
    S.A.forEach(a => { if (a.buff && a.buff.until <= S.t) a.buff = null; });
    // 玩家的軍隊糧草
    facIds().forEach(fid => { if (alive(fid)) checkFaction(fid); });
  }

  // ═══════════════════════════ 5. 方針與國策、技能、寶物、處置俘虜 ═══════════════════════════
  // 參考《鋼鐵雄心》的國策樹：開局選一個「方針」當作國家的特化；之後每次推行一項國策，幾個月後生效。

    { id: 'yunti', b: 'tech', n: 3, name: '雲梯衝車', glyph: '梯', fx: { wall: 0.5 }, desc: '攻城時，削減敵城城防 +50%', q: '「公輸盤為楚造雲梯之械，成，將以攻宋。」（《墨子・公輸》）' },
