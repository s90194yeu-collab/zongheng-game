    return b;
  }
  /** 軍隊行軍速度倍數 */
  function armySpeed(a) {
    let m = 1;
    if (a.gens.some(g => trait(g) === 'youji')) m *= 1.3;
    if (a.gens.some(g => hasSk(g, 'jixing') || itemOf(g) === 'wuzhui')) m *= 1.2;
    return m * (1 + mod(a.f, 'speed'));
  }
  /** 守城戰力倍數：國策、鐵壁、蹶張弩 */
  function cityDefMult(cid) {
    const c = S.C[cid];
    if (!c.o) return 1;
    const gens = charsAt(cid, c.o);
    let m = 1 + mod(c.o, 'cityDef');
    if (gens.some(g => hasSk(g, 'tiebi'))) m *= 1.2;
    if (gens.some(g => itemOf(g) === 'juezhang')) m *= 1.15;
    return m;
  }
  /** 每個月：撫民、玉璽 */
  function perksTick() {
    Object.keys(S.P).forEach(id => {
      const p = S.P[id];
      if (p.st !== 's') return;
      if (hasSk(id, 'fumin') && S.C[p.loc] && S.C[p.loc].o === p.f) S.C[p.loc].mx = Math.min(100, S.C[p.loc].mx + 1.5);
      if (p.it === 'yuxi' && S.F[p.f]) S.F[p.f].fame = Math.min(100, S.F[p.f].fame + 0.5);
    });
    facIds().forEach(fid => { if (alive(fid)) aiEquip(fid); });
  }

  // ───── 處置俘虜：斬首 ─────
  /** 斬首的代價：名望 −3、和他原本的國家關係 −30、我方品德高的人知遇 −5 */
  function behead(pid) {
    const p = S.P[pid];
    if (!p || p.st !== 'c' || p.cf !== S.player) return false;
    const from = p.f0 || p.f;
    dropItem(pid, S.player);
    killChar(pid, '被' + fdef(S.player).name + '斬首');
    W.addFame(S.player, -3);
    if (from && alive(from) && from !== S.player) addRel(S.player, from, -30);
    charsOf(S.player).forEach(x => { if (statBase(x, 4) >= 80 && S.F[S.player].ruler !== x) S.P[x].loyal = Math.max(0, S.P[x].loyal - 5); });
    const i = CAPTIVE_WAIT.indexOf(pid);
    if (i > -1) CAPTIVE_WAIT.splice(i, 1);
    return true;
  }

  // ───── 存檔版本：v1（大地圖第一版）→ v2 ─────
  const STATE_V = 2;
  /** v0.2.0 刪掉的六城：舊存檔裡的兵、人物移到哪裡 */
  const REMAP_V1 = { huaiyin: 'xiapi', guangling: 'wu', longxi: 'chencang', beidi: 'xianyang', shangjun: 'gaonu', yuzhang: 'zhu' };
  /** 開局或讀檔後補上新欄位；舊存檔刪掉已經移除的城 */
  function upgradeState(opening) {
    if (!D.chronicle && (!S.v || S.v < 2)) {
      const gone = Object.keys(S.C).filter(c => !CITY[c]);
      const near = c => (CITY[REMAP_V1[c]] ? REMAP_V1[c] : null);
      // 刪掉的城裡的守軍：併到原本對應的鄰城（同一國）或國都
      const keep = {};
      gone.forEach(c => { keep[c] = { o: S.C[c].o, tr: S.C[c].tr || 0 }; delete S.C[c]; });
      gone.forEach(c => {
        const { o, tr } = keep[c];
        if (!o || !tr) return;
        const to = near(c) && S.C[near(c)].o === o ? near(c) : capitalOf(o);
        if (to) S.C[to].tr += tr;
      });
      if (gone.length) {
        // 經過已刪除城池的軍隊：回到國都
        S.A = S.A.filter(a => {
          if (a.path.every(c => CITY[c]) && (!a.at || CITY[a.at])) return true;
          const home = capitalOf(a.f);
          const spot = home || a.path.map(c => near(c) || c).find(c => CITY[c]) || CITY_IDS[0];
          if (home) S.C[home].tr += a.tr;
          a.gens.forEach(g => { if (S.P[g]) S.P[g].loc = spot; });
          return false;
        });
        Object.keys(S.P).forEach(id => {
          const p = S.P[id];
          if (p.st === 'd' || CITY[p.loc] || (/^A/.test(String(p.loc)) && S.A.some(a => a.id === p.loc))) return;
          p.loc = (p.st === 's' && capitalOf(p.f)) || (p.st === 'c' && capitalOf(p.cf)) || near(p.loc) || CITY_IDS[0];
        });
        Object.keys(S.B).forEach(k => { if (k.split('>').some(c => !CITY[c])) delete S.B[k]; });
        (S.ag || []).forEach(g => { g.targets = g.targets.filter(c => CITY[c]); });
        Object.keys(S.F).forEach(f => { if (S.F[f].cap && !CITY[S.F[f].cap]) S.F[f].cap = null; });
      }
    }
    // 新欄位：寶物、國策；能力有一項 90 以上的名將，開局就有一個技能點
    if (!S.TZ) {
      Object.keys(S.P).forEach(id => {
        const p = S.P[id];
        if (p.st === 'd' || !CHAR[id] || p.xp) return;
        if (Math.max.apply(null, CHAR[id].st) >= 90) p.xp = XP_STEP;
        if (p.xp && p.st === 's' && p.f !== S.player) aiLearn(id);
      });
      S.TZ = {};
      Object.keys(IT).forEach(id => {
        const it = IT[id];
        if (it.city && CITY[it.city]) (S.TZ[it.city] = S.TZ[it.city] || []).push(id);
        else if (it.holder && S.P[it.holder] && S.P[it.holder].st === 's') S.P[it.holder].it = id;
        else if (it.inv && S.F[it.inv] && alive(it.inv)) (S.F[it.inv].inv = S.F[it.inv].inv || []).push(id);
      });
    }
    facIds().forEach(fid => {
      const f = S.F[fid];
      f.inv = f.inv || [];
      if (!f.nf && fid !== S.player && alive(fid)) setDoctrine(fid, aiDoctrine(fid), !!opening);
    });
    upgradeRules();
    S.v = STATE_V;
  }

  // ═══════════════════════════ 5. 史實事件（規則部分） ═══════════════════════════

  const EV_LIVE = { hist: 1, story: 1, decision: 1, finale: 1 };
  /** 這個月該發生的事件（照月份順序） */
  function dueEvents() {
    return D.events.filter(e => EV_LIVE[e.kind] && e.tick <= S.t && !S.ev[e.id]).sort((a, b) => a.tick - b.tick);
  }
  const evNeed = e => { try { return !e.need || !!e.need(W); } catch (err) { console.warn('事件條件錯誤', e.id, err); return false; } };
  function evHist(e) {
    if (!S.hist || !e.hist) return;
    try { e.hist(W); } catch (err) { console.warn('事件執行錯誤', e.id, err); }
  }
  function evOffer(e) {
    if (!e.offer) return;
    try { e.offer(W); } catch (err) { console.warn('事件執行錯誤', e.id, err); }
  }
  /** 玩家是不是這個事件的當事人（決定要不要讓玩家做選擇） */
  function evMine(e) {
    if (e.kind !== 'decision') return false;
    if (e.id === 'jiawang') return S.player === 'han';
    if (e.id === 'honggou') return S.player === 'han' || S.player === 'chu';
    return false;
  }
  /** 卡片獎勵：上（兩次）、中（一次）、下（一次、效果打七折） */
  function giveCard(cardId, tier) {
    if (!cardId || !D.cards[cardId] || !tier || tier === 'none') return null;
    const n = tier === 'great' ? 2 : 1, pow = tier === 'bad' ? 0.7 : 1;
    const have = S.cards.find(c => c.id === cardId);
    if (have) { have.n = Math.max(have.n, n); have.pow = Math.max(have.pow, pow); have.tier = better(have.tier, tier); }
    else S.cards.push({ id: cardId, n: n, pow: pow, tier: tier });
    return { id: cardId, n: n, pow: pow };
  }
  const TIER_RANK = { bad: 1, good: 2, great: 3 };
  const better = (a, b) => ((TIER_RANK[a] || 0) >= (TIER_RANK[b] || 0) ? a : b);
  /** 事件的成績：上中下；同時給名望、金 */
  function evReward(e, tier, how) {
    const prev = S.ev[e.id];
    const firstTime = !prev || prev === 'skip' || prev === 'review' || prev === 'later' || prev === 'auto';
    const best = TIER_RANK[prev] ? better(prev, tier) : tier;
    S.ev[e.id] = best || 'auto';
    if (!tier) return null;
    const improved = firstTime || TIER_RANK[tier] > (TIER_RANK[prev] || 0);
    const card = improved ? giveCard(e.card, tier) : null;
    if(improved) Object.keys(D.cards).forEach(id=>{const c=D.cards[id];if(id!==e.card && (c.sources||[]).includes(e.sid))giveCard(id,tier);});
    if (firstTime || TIER_RANK[tier] > (TIER_RANK[prev] || 0)) {
      const fameUp = tier === 'great' ? 10 : tier === 'good' ? 6 : 3;
      W.addFame(S.player, fameUp);
      S.F[S.player].g += tier === 'great' ? 200 : tier === 'good' ? 120 : 60;
    }
    if (how === 'play') S.stats.played += 1;
    return card;
  }
  /** 正史裡從 tier 推算：劇本結局 id 或謀略分數 */
  function tierFrom(r) {
    if (!r) return null;
    const id = r.ending && (r.ending.id || r.ending.key);
    if (id === 'great' || id === 'good' || id === 'bad') return id;
    if (r.ending && r.ending.good === false) return 'bad';
    const s = Number(r.scoreStrategy || r.bestStrategy || 0);
    return s >= 75 ? 'great' : s >= 45 ? 'good' : 'bad';
  }

  // ───── 終局 ─────
  function histFinale() {
    // 垓下：楚亡（演義：楚強於漢時，霸王逆轉）
    const chuP = troopsOf('chu') + citiesOf('chu').length * 8000, hanP = troopsOf('han') + citiesOf('han').length * 8000;
    if (alive('chu') && alive('han')) {
      if (S.player === 'chu' && chuP > hanP * 1.15) {
        const lb = S.P.liubang; if (lb && lb.st === 's') killChar('liubang', '在垓下兵敗，下落不明');
        mergeFaction('han', 'chu', { troopsKeep: 0.5, chars: 'free' });
        return 'chuWin';
      }
      const xy = S.P.xiangyu; if (xy && xy.st !== 'd') killChar('xiangyu', '在烏江自刎而死');
      mergeFaction('chu', 'han', { troopsKeep: 0.5, chars: 'free' });
      return 'hanWin';
    }
    return alive('han') ? 'hanWin' : alive('chu') ? 'chuWin' : 'survive';
  }
  function scoreGame(endKey) {
    const total = CITY_IDS.length;
    const mine = citiesOf(S.player).length;
    const terr = Math.round(100 * mine / total);
    const evs = D.events.filter(e => e.sid || e.quiz).length;
    const done = D.events.filter(e => TIER_RANK[S.ev[e.id]]).length;
    const hist = S.stats.anch ? Math.round(100 * S.stats.anchOk / S.stats.anch) : 0;
    return { terr: terr, fame: Math.round(fame(S.player)), hist: hist, evs: done + ' / ' + evs, mine: mine, total: total, key: endKey };
  }
  function endKeyNow() {
    if (!alive(S.player)) return 'fall';
    if (D.id === 'zg') return zgEndKey();
    if (D.chronicle) return cqEndKey();
    const share = citiesOf(S.player).length / CITY_IDS.length;
    if (share >= 0.85) return 'unify';
    if (S.player === 'han' && !alive('chu')) return 'hanWin';
    if (S.player === 'chu' && !alive('han')) return 'chuWin';
    return 'survive';
  }

  // ═══════════════════════════ 6. 地圖繪製 ═══════════════════════════

  let MINI_ID=0;
  let SVG = null, CAM = null, LAYER = {}, CAMBOX = null;
  const R = { city: {}, army: {}, cell: {}, bord: [], road: [] };   // 畫面元素快取
  const svgEl = (tag, attrs, parent) => {
    const el = document.createElementNS(NS, tag);
    if (attrs) Object.keys(attrs).forEach(k => el.setAttribute(k, attrs[k]));
    if (parent) parent.appendChild(el);
    return el;
  };

  /** 底圖（城池以外的部分）。mini＝標題頁與結局的小地圖 */
  function baseMarkup(mini) {
    // 0.2.0：不再畫山形符號與紙紋濾鏡（手機上很吃效能）；山脈只留淡色區塊與名稱
    let h = '<defs>' +
      '<pattern id="wd-wave" width="46" height="18" patternUnits="userSpaceOnUse"><path d="M0 12 Q11.5 4 23 12 T46 12" fill="none" stroke="#dfeaec" stroke-width="1.1" opacity=".35"/></pattern>' +
      '<clipPath id="wd-land"><path d="'+G.land+'"/></clipPath>' +
      '<radialGradient id="wd-vig" cx="50%" cy="50%" r="72%"><stop offset=".62" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#2b2418" stop-opacity=".35"/></radialGradient>' +
      '</defs>';
    h += '<rect x="-400" y="-400" width="' + (G.w + 800) + '" height="' + (G.h + 800) + '" fill="#86a1a8"/>';
    h += '<rect x="-400" y="-400" width="' + (G.w + 800) + '" height="' + (G.h + 800) + '" fill="url(#wd-wave)"/>';
    h += '<path d="' + G.land + '" fill="#ebdfc0" stroke="#7d6a4a" stroke-width="2.2" stroke-linejoin="round"/>';
    h += '<path d="' + G.land + '" fill="none" stroke="#ebdfc0" stroke-width="9" opacity=".35" transform="translate(0 0)"/>';
    G.tints.forEach(t => { h += '<path d="' + t.d + '" fill="' + (t.k === 'loess' ? '#d8bf86' : '#c9d6a0') + '" opacity="' + (t.k === 'loess' ? '.42' : '.45') + '"/>'; });
    G.ranges.forEach(r => { h += '<path d="' + r.d + '" fill="#a8946a" opacity=".3"/>'; });
    if (!mini) h += '<g class="terr-slot" clip-path="url(#wd-land)"></g>';
    G.lakes.forEach(l => { h += '<path d="' + l.d + '" fill="' + (l.marsh ? '#a9bdb0' : '#86a1a8') + '" stroke="#5f7f99" stroke-width="1" opacity="' + (l.marsh ? '.7' : '1') + '"/>'; });
    G.rivers.forEach(r => { h += '<path d="' + r.d + '" fill="none" stroke="#4f7397" stroke-width="' + r.w + '" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>'; });
    if (D.showWall !== false) h += '<path d="' + G.wall + '" fill="none" stroke="#8a5a3a" stroke-width="2.6" stroke-dasharray="7 4" opacity=".7"/>';
    if (!mini) {
      G.ranges.forEach(r => { h += '<text class="t-range" x="' + r.x + '" y="' + r.y + '" text-anchor="middle">' + r.n + '</text>'; });
      G.riverLabels.forEach(([n, x, y, rot]) => { h += '<text class="t-river" x="' + x + '" y="' + y + '" text-anchor="middle" transform="rotate(' + rot + ' ' + x + ' ' + y + ')">' + n + '</text>'; });
      G.lakes.forEach(l => { if (!l.n) return; const m = l.d.match(/M(\d+) (\d+)/); if (m) h += '<text class="t-lake" x="' + m[1] + '" y="' + (Number(m[2]) + 4) + '">' + l.n + '</text>'; });
      G.seas.forEach(s => { h += '<text class="t-sea" x="' + s.x + '" y="' + s.y + '" text-anchor="middle">' + s.n + '</text>'; });
    }
    return h;
  }
  /** 小地圖：owners＝{城: 勢力}，colorOf(勢力)→顏色 */
  function miniMap(owners, colorOf, opts) {
    let h = '<svg viewBox="' + (opts && opts.vb ? opts.vb : (D.mapViewBox || ('0 0 ' + G.w + ' ' + G.h))) + '" xmlns="' + NS + '" aria-hidden="true">' + baseMarkup(true);
    h += '<g clip-path="url(#wd-land)">';
    Object.keys(D.cells).forEach(cid => { const o=owners[cid]; if(o)h+='<path d="'+D.cells[cid]+'" fill="'+colorOf(o)+'" fill-opacity=".55"/>'; });
    D.borders.forEach(([a,b,path])=>{if(owners[a]!==owners[b])h+='<path d="'+path+'" fill="none" stroke="#574c32" stroke-width="1.6" opacity=".6"/>';});
    h += '</g>';
    G.rivers.forEach(r=>{h+='<path d="'+r.d+'" fill="none" stroke="#4f7397" stroke-width="'+r.w+'" opacity=".9"/>';});
    CITY_IDS.forEach(cid => { const c = CITY[cid]; if (c.kind === 'city' && c.size >= 3) h += '<circle cx="' + c.x + '" cy="' + c.y + '" r="' + (3 + c.size) + '" fill="#2b2418"/>'; });
    const uid='wd-mini-'+(++MINI_ID);
    return (h+'</svg>').replace(/wd-land/g,uid+'-land').replace(/wd-wave/g,uid+'-wave').replace(/wd-vig/g,uid+'-vig');
  }

  function buildMap(stage) {
    SVG = svgEl('svg', { class: 'wd-map', 'data-z': '2', role: 'img', 'aria-label': '天下大地圖' });
    SVG.innerHTML = baseMarkup(false);
    // 地圖放在一個 HTML 外框裡：拖曳時移動外框（移動 SVG 本身會讓瀏覽器重排所有地圖文字）
    CAMBOX = document.createElement('div');
    CAMBOX.className = 'wd-cam';
    CAMBOX.appendChild(SVG);
    stage.appendChild(CAMBOX);
    const slot = SVG.querySelector('.terr-slot');
    LAYER.terr = svgEl('g', { class: 'l-terr' }); slot.appendChild(LAYER.terr);
    LAYER.bord = svgEl('g', { class: 'l-bord' }); slot.appendChild(LAYER.bord);
    LAYER.roads = svgEl('g', { class: 'l-roads' }, SVG);
    LAYER.routes = svgEl('g', { class: 'l-routes' }, SVG);
    LAYER.cities = svgEl('g', { class: 'l-cities' }, SVG);
    LAYER.armies = svgEl('g', { class: 'l-armies' }, SVG);
    LAYER.fx = svgEl('g', { class: 'l-fx' }, SVG);
    // 0.2.1：四周暗角改由 .wd-stage::after（CSS）畫，地圖重畫時不用跟著重算
    // 領地
    CITY_IDS.forEach(cid => { R.cell[cid] = svgEl('path', { class: 'terr', 'data-c': cid, d: D.cells[cid] || '', fill: 'none' }, LAYER.terr); });
    R.bord = D.borders.map(b => ({ a: b[0], b: b[1], el: svgEl('path', { class: 'bord', d: b[2] }, LAYER.bord) }));
    // 道路
    const drawn = {};
    CITY_IDS.forEach(a => ADJ[a].forEach(e => {
      const k = roadKey(a, e.to);
      if (drawn[k]) return;
      drawn[k] = 1;
      const A = CITY[a], B = CITY[e.to];
      const el = svgEl('path', { class: 'road k-' + e.kind, d: 'M' + A.x.toFixed(1) + ' ' + A.y.toFixed(1) + 'L' + B.x.toFixed(1) + ' ' + B.y.toFixed(1) }, LAYER.roads);
      R.road.push({ k: k, a: a, b: e.to, el: el });
    }));
    // 城池
    CITY_IDS.forEach(cid => {
      const c = CITY[cid];
      const g = svgEl('g', { class: 'city' + (c.size <= 1 ? ' c-minor' : ''), 'data-c': cid, transform: 'translate(' + c.x.toFixed(1) + ' ' + c.y.toFixed(1) + ')' }, LAYER.cities);
      svgEl('circle', { class: 'hit', r: 18 }, g);
      svgEl('circle', { class: 'c-siege', r: 17 }, g);
      svgEl('circle', { class: 'c-sel', r: 14 }, g);
      const icon = svgEl('g', { class: 'c-icon' }, g);
      icon.innerHTML = cityIcon(c);
      const flag = svgEl('g', { class: 'c-flag', transform: 'translate(' + (c.kind === 'city' ? 0 : 2) + ' ' + (c.size >= 4 ? -9 : -6) + ')' }, g);
      svgEl('path', { d: 'M0 0V-17', stroke: '#2b2418', 'stroke-width': 1.6 }, flag);
      const cloth = svgEl('path', { d: 'M0 -17H15L12.5 -12.5L15 -8H0Z', stroke: '#2b2418', 'stroke-width': .8 }, flag);
      const glyph = svgEl('text', { x: 6.8, y: -9.6, 'font-size': 8.5, fill: '#fff', 'text-anchor': 'middle', 'font-weight': 700 }, flag);
      const lp = labelPos(c);
      const name = svgEl('text', { class: 'c-name', x: lp.x, y: lp.y, 'text-anchor': lp.a }, g);
      name.textContent = c.name;
      const tro = svgEl('text', { class: 'c-troop', x: lp.x, y: lp.y + 13, 'text-anchor': lp.a }, g);
      R.city[cid] = { g: g, cloth: cloth, glyph: glyph, name: name, tro: tro, flag: flag };
    });
    setupCamera(stage);
  }
  function cityIcon(c) {
    if (c.kind === 'pass') return '<path d="M-9 6V-3H-6V-6H6V-3H9V6H4V1.5A4 4 0 0 0 -4 1.5V6Z" fill="#4a3a26" stroke="#f4ead0" stroke-width="1"/>';
    if (c.kind === 'ford') return '<path d="M-9 1Q-6 -2 -3 1T3 1T9 1M-9 5Q-6 2 -3 5T3 5T9 5" fill="none" stroke="#2f5277" stroke-width="2"/><circle r="3.2" cy="-3" fill="#4a3a26" stroke="#f4ead0" stroke-width="1"/>';
    const s = 4 + c.size * 1.6;
    let h = '<rect x="' + (-s) + '" y="' + (-s * 0.8) + '" width="' + (2 * s) + '" height="' + (1.6 * s) + '" rx="1.5" fill="#4a3a26" stroke="#f4ead0" stroke-width="1.2"/>';
    const n = c.size >= 4 ? 4 : 3;
    for (let i = 0; i < n; i++) { const x = -s + (2 * s) * (i + 0.5) / n - 1.6; h += '<rect x="' + x.toFixed(1) + '" y="' + (-s * 0.8 - 3) + '" width="3.2" height="3.2" fill="#4a3a26"/>'; }
    h += '<path d="M-2.4 ' + (s * 0.8) + 'V' + (s * 0.15) + 'A2.4 2.4 0 0 1 2.4 ' + (s * 0.15) + 'V' + (s * 0.8) + '" fill="#f4ead0" opacity=".8"/>';
    return h;
  }
  function labelPos(c) {

      '<button type="button" class="wd-ico" data-world-menu aria-label="切換三篇大地圖">卷</button>' +
      '<div class="wd-me"></div>' +
      '<div class="wd-date"><b></b><small></small></div>' +
      '<div class="wd-res"></div>' +
      '<div class="wd-grow"></div>' +
      '<div class="wd-timebox"></div>' +
      '<button type="button" class="wd-ico" data-ui="codex" aria-label="史冊圖鑑">冊</button>' +
      '<button type="button" class="wd-ico" data-ui="help" aria-label="說明">?</button>' +
      '<i class="wd-clockbar"></i>' +
      '</header>' +
      '<div class="wd-stage">' +
      '<div class="wd-modes" role="group" aria-label="地圖模式"></div>' +
      '<div class="wd-hint" hidden><span></span><button type="button" class="zh-btn zh-btn--quiet zh-btn--sm" data-ui="cancel">取消</button></div>' +
      '<div class="wd-ticker" aria-live="polite"></div>' +
      '<div class="wd-zoom"><button type="button" data-z="in" aria-label="放大">＋</button><button type="button" data-z="out" aria-label="縮小">－</button><button type="button" data-z="home" aria-label="回到我的國都">⌂</button></div>' +
      '</div>' +
      '<aside class="wd-side is-min"><button type="button" class="wd-grip" aria-label="展開或收起"></button><nav class="wd-tabs" role="tablist"></nav><div class="wd-pane"></div></aside>' +
      '</div>';
    UI.root = root;
    UI.top = $('.wd-top', root); UI.me = $('.wd-me', root); UI.date = $('.wd-date', root); UI.res = $('.wd-res', root);
    UI.time = $('.wd-timebox', root); UI.clock = $('.wd-clockbar', root);
    UI.stage = $('.wd-stage', root); UI.hint = $('.wd-hint', root); UI.ticker = $('.wd-ticker', root);
    UI.side = $('.wd-side', root); UI.tabs = $('.wd-tabs', root); UI.pane = $('.wd-pane', root);
    if (window.innerWidth > 860) UI.side.classList.remove('is-min');
    buildMap(UI.stage);
    UI.modes = $('.wd-modes', root);
    renderModes();
    $('[data-ui="menu"]', root).addEventListener('click', openMenu);
    $('[data-ui="codex"]',root).addEventListener('click',()=>ZH.codexBook.open());
    $('[data-ui="help"]', root).addEventListener('click', openHelp);
    $('[data-ui="cancel"]', root).addEventListener('click', () => cancelTarget());
    $('.wd-grip', root).addEventListener('click', () => { UI.side.classList.toggle('is-min'); sheetState(); });
    $$('.wd-zoom button', root).forEach(b => b.addEventListener('click', () => {
      const vb = viewBox(), mid = [vb.x + vb.w / 2, vb.y + vb.h / 2];
      if (b.dataset.z === 'in') zoomAt(mid, 0.7); else if (b.dataset.z === 'out') zoomAt(mid, 1.4);
      else focusCity(capitalOf(S.player) || CITY_IDS[0], homeW());
      ZH.sfx('click');
    }));
    TABS.forEach(t => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'wd-tab'; b.setAttribute('role', 'tab'); b.dataset.t = t; b.innerHTML = t;
      b.addEventListener('click', () => { TAB = t; ZH.sfx('click'); UI.side.classList.remove('is-min'); sheetState(); renderTabs(); renderPane(); });
      UI.tabs.appendChild(b);
    });
    document.addEventListener('keydown', onKey);
  }
  function sheetState() { UI.stage.classList.toggle('has-sheet', !UI.side.classList.contains('is-min')); }
  function onKey(e) {
    if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
    if (DLG || BOOK_OPEN || document.querySelector('.zc-detail,.za')) return;
    if (e.key === 'Escape' && TARGET) { cancelTarget(); return; }
    if (e.key === ' ') { e.preventDefault(); if (S.real) togglePlay(); else endMonth(); }
  }

  // ───── 頂列 ─────
  function renderTop() {
    const f = fdef(S.player), st = S.F[S.player];
    UI.me.innerHTML = flag(S.player) + '<div><b>' + esc(f.name) + '</b><small>' + esc(cname(st.ruler)) + '・' + (S.hist ? (D.id==='zg'?'史實開局':D.chronicle?'史實參考':'史實引力') : '演義・完全架空') + '</small></div>';
    const d = dateOf(S.t);
    const left = (S.hist ? D.histEnd : D.freeEnd) - S.t;
    const goal = S.ended ? '戰役結束' : D.chronicle ? ('本期還有 ' + Math.max(0,left) + ' 個月') : S.hist ? (left > 0 ? '距垓下 ' + left + ' 個月' : '垓下之戰') : (left > 0 ? '時限還有 ' + left + ' 個月' : '時限已到');
    UI.date.innerHTML = '<b>' + (D.chronicle ? '開局前 ' : '前 ') + d.bc + ' 年</b><small>' + d.era + d.month + '・' + goal + '</small>';
    const tro = troopsOf(S.player);
    const upkeep = Math.round(upkeepOf(S.player, tro));
    UI.res.innerHTML =
      '<span title="金：內政、外交、賞賜"><i>金</i><b>' + Math.round(st.g) + '</b></span>' +
      '<span class="' + (st.f < upkeep * 3 ? 'is-low' : '') + '" title="糧：每月消耗約 ' + upkeep + '"><i>糧</i><b>' + Math.round(st.f) + '</b></span>' +
      '<span><i>兵</i><b>' + wanShort(tro) + '</b></span>' +
      '<span><i>城</i><b>' + citiesOf(S.player).length + '</b></span>' +
      '<span title="名望：影響外交與人才"><i>名望</i><b>' + Math.round(st.fame) + '</b></span>';
    renderTime();
  }
  function renderTime() {
    if (S.ended) {
      UI.time.innerHTML = '<button type="button" class="zh-btn zh-btn--primary wd-next" data-ui="end">戰役結束<small>看結局</small></button>';
      $('[data-ui="end"]', UI.time).addEventListener('click', () => showEnding());
      return;
    }
    if (S.real) {
      UI.time.innerHTML = '<span class="wd-speed" role="group" aria-label="速度">' +
        '<button type="button" data-sp="0" class="' + (PLAY ? '' : 'is-on') + '" aria-label="暫停">❚❚</button>' +
        [1, 2, 4].map(n => '<button type="button" data-sp="' + n + '" class="' + (PLAY && S.speed === n ? 'is-on' : '') + '">' + (n === 1 ? '▶' : n === 2 ? '▶▶' : '▶▶▶') + '</button>').join('') + '</span>';
      $$('[data-sp]', UI.time).forEach(b => b.addEventListener('click', () => {
        const n = Number(b.dataset.sp);
        if (!n) setPlay(false); else { S.speed = n; setPlay(true); }
        ZH.sfx('click');
      }));
    } else {
      UI.time.innerHTML = '<button type="button" class="zh-btn zh-btn--primary wd-next" data-ui="next">下個月 ▶<small>結束本月（空白鍵）</small></button>';
      $('[data-ui="next"]', UI.time).addEventListener('click', () => endMonth());
    }
  }

  // ───── 分頁 ─────
  function renderTabs() {
    const evN = histPending().length;
    const warn = charsOf(S.player).filter(id => (S.P[id].loyal < 35 && S.F[S.player].ruler !== id) || spOf(id) > 0).length + CAPTIVE_WAIT.length;
    const nf = nfOf(S.player);
    const nfWarn = !nf || !nf.doc || (!nf.cur && NF.some(x => nfAvail(S.player, x))) ? '!' : 0;
    const threat = S.A.filter(a => a.f !== S.player && S.C[a.goal] && S.C[a.goal].o === S.player).length;
    $$('.wd-tab', UI.tabs).forEach(b => {
      const t = b.dataset.t;
      const n = t === '史冊' ? evN : t === '人才' ? warn : t === '軍隊' ? threat : t === '國策' ? nfWarn : t === '計策' ? S.cards.filter(c => c.n > 0).length : 0;
      b.innerHTML = t + (n ? '<em>' + n + '</em>' : '');
      b.setAttribute('aria-selected', String(t === TAB));
    });
  }
  function renderPane() {
    const p = UI.pane;
    const scroll = p.scrollTop;
    if (TAB === '城池') p.innerHTML = paneCity();
    else if (TAB === '軍隊') p.innerHTML = paneArmies();
    else if (TAB === '人才') p.innerHTML = paneChars();
    else if (TAB === '勢力') p.innerHTML = paneFactions();
    else if (TAB === '國策') p.innerHTML = paneFocus();
    else if (TAB === '計策') p.innerHTML = paneCards();
    else if(TAB==='策士')p.innerHTML=panePlayer();
    else p.innerHTML = paneHistory();
    bindPane();
    p.scrollTop = scroll;
  }
  function refresh(animate) {
    renderTop();
    renderTabs();
    renderPane();
    renderAll(animate);
  }

  // ───── 城池 ─────
  function paneCity() {
    if (!SEL || SEL.type !== 'city') {
      const cap = capitalOf(S.player);
      return '<h3>' + esc(fdef(S.player).name) + '</h3><p class="wd-dim wd-sm" style="margin-top:6px">點地圖上的城池，看城裡的兵力、人才，下達內政或出陣的命令。</p>' +
        (cap ? '<div class="wd-acts" style="margin-top:12px"><button type="button" class="wd-act is-main" data-go-city="' + cap + '"><b>國都：' + esc(CITY[cap].name) + '</b><small>從國都開始</small></button></div>' : '') +
        '<h4>我的城池</h4><div class="wd-list">' + citiesOf(S.player).sort((a, b) => S.C[b].tr - S.C[a].tr).map(cityRow).join('') + '</div>';
    }
    const cid = SEL.id, c = S.C[cid], ci = CITY[cid], o = c.o;
    const mine = o === S.player;
    const f = o ? fdef(o) : null;
    const gens = o ? charsAt(cid, o) : [];
    let h = '<div class="wd-head">' + (o ? flag(o) : '') + '<div><h3>' + esc(ci.name) + '</h3><span class="wd-dim wd-sm">' + (f ? esc(f.name) : '無主') + '・' + ({ city: '城', pass: '關隘', ford: '渡口' }[ci.kind]) + '・' + esc(ci.note || '') + '</span></div></div>';
    const besieger = S.A.filter(a => a.st === 'siege' && a.at === cid);
    h += '<div class="wd-chips">' + (S.F[o] && S.F[o].cap === cid ? '<span class="zh-chip zh-chip--gilt">國都</span>' : '') +
      (besieger.length ? '<span class="zh-chip zh-chip--cinnabar">被' + esc(besieger.map(a => fdef(a.f).name).join('、')) + '軍包圍</span>' : '') +
      (o && o !== S.player ? relChip(o) : '') + (S.TZ && S.TZ[cid] ? '<span class="zh-chip zh-chip--gilt" title="攻下這座城，或在這裡巡撫，可能找到">傳說藏有寶物</span>' : '') + '</div>';
    h += '<div class="wd-stats">' +
      '<div class="wd-stat"><i>兵力</i><b>' + wan(c.tr) + '</b></div>' +
      '<div class="wd-stat"><i>城防</i><b>' + Math.round(c.df) + '</b>' + bar(100 * c.df / dfMax(cid)) + '</div>' +
      '<div class="wd-stat"><i>民心</i><b>' + Math.round(c.mx) + '</b>' + bar(c.mx) + '</div>' +
      '<div class="wd-stat"><i>農業</i><b>' + Math.round(c.fa) + '</b>' + bar(100 * c.fa / faMax(cid)) + '</div>' +
      '<div class="wd-stat"><i>商業</i><b>' + Math.round(c.co) + '</b>' + bar(100 * c.co / faMax(cid)) + '</div>' +
      '<div class="wd-stat"><i>規模</i><b>' + '★'.repeat(ci.size) + '</b></div></div>';
    if (mine) {
      const idleHere = gens.filter(idle);
      h += '<h4>內政</h4>';
      if (!idleHere.length) h += '<p class="wd-dim wd-sm">城裡沒有空閒的人才（下個月才能再派）。可以從「人才」分頁調人過來。</p>';
      h += '<div class="wd-acts">' + Object.keys(DEV).map(k => {
        const d = DEV[k];
        const who = bestBy(idleHere, d.stat);
        const gain = who ? devGain(k, cid, who) : 0;
        const cost = devCost(k, S.player);
        const can = who && S.F[S.player].g >= cost;
        const preview = !who ? '沒有空閒的人' : k === 'draft' ? '＋' + wan(gain) + '（' + cname(who) + '）' : '＋' + gain + '（' + cname(who) + '）';
        return '<button type="button" class="wd-act" data-dev="' + k + '"' + (can ? '' : ' disabled') + '><b>' + d.name + '</b><small>金 ' + cost + '・' + preview + '</small></button>';
      }).join('') +
        '<button type="button" class="wd-act is-main" data-act="march"' + (idleHere.length && c.tr > 1500 ? '' : ' disabled') + '><b>出陣</b><small>' + (idleHere.length ? '選目標城池：我方城＝調兵，他國城＝進攻' : '城裡沒有空閒的將領') + '</small></button></div>';
    } else if (o) {
      const src = bestSource(cid);
      h += '<h4>軍事</h4><div class="wd-acts">' +
        '<button type="button" class="wd-act is-main is-war" data-act="attack"' + (src && hostile(S.player, o) ? '' : ' disabled') + '><b>出兵攻打' + esc(ci.name) + '</b><small>' +
        (!hostile(S.player, o) ? (allied(S.player, o) ? '同盟國不能攻打（要先在「勢力」解除同盟）' : '停戰中') : src ? '從' + esc(CITY[src].name) + '出兵（' + wan(S.C[src].tr) + '）' : '附近沒有可以出兵的我方城池') + '</small></button>' +
        '<button type="button" class="wd-act" data-act="fac" data-f="' + o + '"><b>外交</b><small>與' + esc(f.name) + '交涉</small></button>' +
        '<button type="button" class="wd-act" data-act="cards"><b>計策</b><small>' + (S.cards.filter(x => x.n > 0).length ? '用計策卡' : '還沒有計策卡') + '</small></button></div>';
    }
    h += '<h4>城中人物</h4>';
    const list = gens.map(id => charRow(id)).join('') + freeAt(cid).map(id => charRow(id, '在野')).join('') + captivesAt(cid).map(id => charRow(id, '俘虜')).join('');
    h += list ? '<div class="wd-list">' + list + '</div>' : '<p class="wd-empty">沒有人物</p>';
    if (mine && (freeAt(cid).length || captivesAt(cid).some(id => S.P[id].cf === S.player))) h += '<p class="wd-dim wd-sm" style="margin-top:8px">點在野人物或俘虜，可以嘗試登用。</p>';
    const near = neighbors(cid).map(n => '<button type="button" class="zh-chip" data-go-city="' + n + '" style="cursor:pointer;background:none">' + esc(CITY[n].name) + (S.C[n].o ? '・' + esc(fdef(S.C[n].o).glyph) : '') + '</button>').join('');
    if (D.chronicle) { const related = D.events.filter(e => e.at === cid); if (related.length) h += '<h4>訪古・篇章</h4><div class="wd-list">' + related.map(e => '<button type="button" class="wd-row" data-ev="' + e.id + '"><span><b>' + esc(e.title) + '</b><small>' + esc(e.year) + '・歷史回顧</small></span></button>').join('') + '</div>'; }
    h += '<h4>相鄰</h4><div class="wd-chips">' + near + '</div>';
    return h;
  }
  function cityRow(cid) {
    const c = S.C[cid];
    return '<button type="button" class="wd-row" data-go-city="' + cid + '">' + flag(c.o) + '<span><b>' + esc(CITY[cid].name) + '</b><small>兵 ' + wan(c.tr) + '・民心 ' + Math.round(c.mx) + '・人才 ' + charsAt(cid, c.o).length + '</small></span><span class="wd-mini">' + (S.A.some(a => a.st === 'siege' && a.at === cid) ? '<span class="zh-chip zh-chip--cinnabar">被圍</span>' : '') + '</span></button>';
  }
  function relChip(fid) {
    if (allied(S.player, fid)) return '<span class="zh-chip zh-chip--patina">同盟</span>';
    if (truced(S.player, fid)) return '<span class="zh-chip">停戰至' + esc(dateText(S.TR[rkey(S.player, fid)], true)) + '</span>';
    const r = rel(S.player, fid);
    return '<span class="zh-chip' + (r < -30 ? ' zh-chip--cinnabar' : '') + '">關係 ' + r + '</span>';
  }
  function charRow(id, tag) {
    const p = S.P[id];
    const busy = p.st === 's' && !idle(id);
    const where = /^A/.test(String(p.loc)) ? '出征中' : busy ? '執行任務' : tag || '待命';
    const low = p.loyal < 35;
    const lv = p.st === 's' ? lvOf(id) : 0, sp = p.st === 's' && p.f === S.player ? spOf(id) : 0;
    return '<button type="button" class="wd-row' + (busy ? ' is-busy' : '') + '" data-char="' + id + '">' + face(id) +
      '<span><b>' + esc(cname(id)) + (S.F[p.f] && S.F[p.f].ruler === id ? ' <span class="zh-chip zh-chip--gilt" style="font-size:11px;padding:0 6px">主君</span>' : '') +
      (lv ? ' <span class="wd-lv' + (sp ? ' is-sp' : '') + '" title="' + (sp ? '有 ' + sp + ' 點技能點可以用' : '等級') + '">' + (sp ? '＋' + sp : 'Lv' + lv) + '</span>' : '') +
      (p.it && IT[p.it] ? ' <span class="wd-it" title="' + esc(IT[p.it].name) + '">' + itemArt(IT[p.it]) + '</span>' : '') + '</b>' + fiveStats(id) +
      (p.st === 's' ? '<span class="wd-loyal' + (low ? ' is-low' : '') + '" title="知遇 ' + Math.round(p.loyal) + '"><i style="width:' + Math.round(p.loyal) + '%"></i></span>' : '') +
      '</span><span class="wd-mini">' + esc(where) + '</span></button>';
  }
  function bestSource(target) {
    let best = null, bs = -1;
    citiesOf(S.player).forEach(src => {
      if (!charsAt(src, S.player).some(idle) || S.C[src].tr < 1500) return;
      const r = findPath(src, target, S.player, {});
      if (!r || r.months > 3) return;
      const s = S.C[src].tr / (1 + r.months);
      if (s > bs) { bs = s; best = src; }
    });
    return best;
  }

  // ───── 軍隊 ─────
  function paneArmies() {
    const mine = armiesOf(S.player);
    const threats = S.A.filter(a => a.f !== S.player && S.C[a.goal] && S.C[a.goal].o === S.player);
    let h = '<h3>軍隊</h3>';
    if (threats.length) h += '<h4 style="color:#ff9c90">敵軍來襲</h4><div class="wd-list">' + threats.map(a => armyRow(a)).join('') + '</div>';
    h += '<h4>我軍</h4>' + (mine.length ? '<div class="wd-list">' + mine.map(a => armyRow(a)).join('') + '</div>' : '<p class="wd-empty">沒有出征中的軍隊。選一座我方城池，按「出陣」。</p>');
    const others = S.A.filter(a => a.f !== S.player && threats.indexOf(a) === -1);
    if (others.length) h += '<h4>各國動向</h4><div class="wd-list">' + others.slice(0, 12).map(a => armyRow(a)).join('') + '</div>';
    return h;
  }
  function armyRow(a) {
    const goal = CITY[a.goal];
    const state = a.st === 'siege' ? '圍攻' + goal.name + '（第 ' + a.sm + ' 月）' : (a.st === 'retreat' ? '撤退往' : '往') + goal.name + '・約 ' + Math.max(1, Math.ceil(monthsLeft(a))) + ' 月';
    return '<button type="button" class="wd-row" data-army="' + a.id + '">' + flag(a.f) + '<span><b>' + esc(a.gens.length ? cname(a.gens[0]) : fdef(a.f).name) + '軍・' + wan(a.tr) + '</b><small>' + esc(state) + (a.buff && a.buff.until > S.t ? '・' + esc(a.buff.name || '計策') : '') + '</small></span><span class="wd-mini">士氣 ' + Math.round(a.mor * 100) + '</span></button>';
  }

  // ───── 人才 ─────
  function paneChars() {
    const mine = charsOf(S.player).sort((a, b) => (S.F[S.player].ruler === a ? -1 : S.F[S.player].ruler === b ? 1 : 0) || (Math.max.apply(null, CHAR[b].st) - Math.max.apply(null, CHAR[a].st)));
    let h = '<h3>人才</h3><p class="wd-dim wd-sm" style="margin-top:4px">統帥・勇武・智謀・政治・品德。綠條是知遇：大才長期閒置、主君德望不足，知遇就會下降，太低的人會離開。</p>';
    if (CAPTIVE_WAIT.length) h += '<div class="wd-acts" style="margin-top:10px"><button type="button" class="wd-act is-main" data-act="captives"><b>處置俘虜（' + CAPTIVE_WAIT.length + '）</b><small>登用、釋放或斬首</small></button></div>';
    h += treasuryBlock();
    h += '<h4>我方（' + mine.length + '）</h4><div class="wd-list">' + mine.map(id => charRow(id)).join('') + '</div>';
    const frees = Object.keys(S.P).filter(id => S.P[id].st === 'v' && S.C[S.P[id].loc] && S.C[S.P[id].loc].o === S.player);
    if (frees.length) h += '<h4>我方城中的在野人物</h4><div class="wd-list">' + frees.map(id => charRow(id, '在野・' + CITY[S.P[id].loc].name)).join('') + '</div>';
    const caps = Object.keys(S.P).filter(id => S.P[id].st === 'c' && S.P[id].cf === S.player);
    if (caps.length) h += '<h4>俘虜</h4><div class="wd-list">' + caps.map(id => charRow(id, '俘虜')).join('') + '</div>';
    return h + hostageTalentBlock();
  }

  // ───── 勢力 ─────
  function paneFactions() {

  // ───── 對話框 ─────
  function openDlg(html, opts) {
    opts = opts || {};

    ov.className = 'wd-ov';
    ov.innerHTML = '<div class="wd-dlg' + (opts.wide ? ' is-wide' : '') + '" role="dialog" aria-modal="true">' + (opts.noClose ? '' : '<button type="button" class="wd-ico wd-dlg__x" aria-label="關閉">✕</button>') + html + '</div>';
    document.body.appendChild(ov);

    let done;

    const x = $('.wd-dlg__x', ov);
    if (x) x.addEventListener('click', () => close(null));

  // ───── 出陣 ─────
  function startMarch(src) {
    if (!charsAt(src, S.player).some(idle)) { ZH.toast('城裡沒有空閒的將領。', 'bad'); return; }
    const reach = {};
    CITY_IDS.forEach(c => { if (c === src) return; const r = findPath(src, c, S.player, { stealth: hasCard('andu') }); if (r && r.months <= 8) reach[c] = r; });
    setTarget({
      hint: '選目標：' + CITY[src].name + '出兵到哪裡？（我方城＝調兵，他國城＝進攻）',
      ok: c => !!reach[c] && (S.C[c].o === S.player || hostile(S.player, S.C[c].o)),
      pick: c => planMarch(src, c)
    });
  }
  const hasCard = id => S.cards.some(c => c.id === id && c.n > 0);
  function planMarch(src, to) {
    const c = S.C[src], tc = S.C[to];
    const gens = charsAt(src, S.player).filter(idle).sort((a, b) => cmdScore(b) - cmdScore(a));
    if (!gens.length) { ZH.toast(CITY[src].name + '沒有空閒的將領。', 'bad'); return; }
    const attack = tc.o !== S.player;
    const maxT = Math.max(0, Math.floor((c.tr - 500) / 1000) * 1000);
    if (maxT < 1000) { ZH.toast(CITY[src].name + '的兵力不夠出陣。', 'bad'); return; }
    const opts = [''].concat(Object.keys(D.cards).filter(k => ['armyBuff','stealth'].includes(D.cards[k].kind) && hasCard(k)));
    const html = '<div class="wd-dlg__body"><span class="wd-kicker">' + (attack ? '出兵攻打' : '調兵') + '</span><h2>' + esc(CITY[src].name) + ' → ' + esc(CITY[to].name) + '</h2>' +
      (attack ? '<p class="wd-dim" style="margin-top:4px">守軍 ' + wan(tc.tr) + '・城防 ' + Math.round(tc.df) + '・民心 ' + Math.round(tc.mx) + '・' + esc(fdef(tc.o).name) + '・守將：' + (charsAt(to, tc.o).map(cname).join('、') || '無') + '</p>' : '') +
      '<div class="wd-form">' +
      '<div><label>兵力：<b data-v="tr">' + wan(Math.min(maxT, 20000)) + '</b>（城中 ' + wan(c.tr) + '）</label><input type="range" min="1000" max="' + maxT + '" step="1000" value="' + Math.min(maxT, Math.max(1000, Math.round(maxT * 0.7 / 1000) * 1000)) + '" data-f="tr"></div>' +
      '<div><label>將領（最多三人，第一位是主將）</label><div class="wd-pick">' + gens.map((g, i) => '<label><input type="checkbox" value="' + g + '"' + (i === 0 ? ' checked' : '') + '>' + face(g) + '<span>' + esc(cname(g)) + '<br><small class="wd-dim">統' + stat(g, 0) + ' 勇' + stat(g, 1) + '</small></span></label>').join('') + '</div></div>' +
      (opts.length > 1 ? '<div><label>出陣時使用計策</label><select data-f="card">' + opts.map(k => '<option value="' + k + '">' + (k ? D.cards[k].name + '（剩 ' + S.cards.find(x => x.id === k).n + ' 次）' : '不用') + '</option>').join('') + '</select></div>' : '') +
      '<div class="wd-odds" data-v="odds"></div>' +
      '</div><div class="wd-dlg__acts"><button type="button" class="zh-btn zh-btn--quiet" data-x="0">取消</button><button type="button" class="zh-btn zh-btn--primary" data-x="1">' + (attack ? '出陣' : '調兵') + '</button></div></div>';
    const d = openDlg(html);
    const el = d.el;
    const range = $('[data-f="tr"]', el), cardSel = $('[data-f="card"]', el);
    const picked = () => $$('.wd-pick input:checked', el).map(x => x.value).slice(0, 3);
    const update = () => {
      const tr = Number(range.value);
      $('[data-v="tr"]', el).textContent = wan(tr);
      const card = cardSel ? cardSel.value : '';
      const r = findPath(src, to, S.player, { stealth: !!(card && cardBuff(D.cards[card],null) && cardBuff(D.cards[card],null).stealth) });
      const g = picked();
      const box = $('[data-v="odds"]', el);
      if (!r) { box.innerHTML = '<span class="is-bad">道路不通</span>'; return; }
      let txt = '路線：' + r.path.map(x => CITY[x].name).join('→') + '・約 ' + Math.max(1, Math.ceil(r.months)) + ' 個月';
      if (attack && g.length) {
        const fake = { tr: tr, gens: g, f: S.player, mor: 1, buff: card ? cardBuff(D.cards[card],S.cards.find(c=>c.id===card)) : null };
        let def = cityPower(to);
        if (!!(card && cardBuff(D.cards[card],null) && cardBuff(D.cards[card],null).stealth)) def *= 0.6;
        const o = odds(armyPower(fake, tc.tr), def);
        txt = '<b class="is-' + o.k + '">' + o.t + '</b><span>' + txt + '</span>';
      }
      box.innerHTML = txt;
    };
    range.addEventListener('input', update);
    if (cardSel) cardSel.addEventListener('change', update);
    $$('.wd-pick input', el).forEach(x => x.addEventListener('change', () => {
      if (picked().length > 3) { x.checked = false; ZH.toast('最多三位將領。'); }
      update();
    }));
    update();
    $('[data-x="0"]', el).addEventListener('click', () => d.close(null));
    $('[data-x="1"]', el).addEventListener('click', () => {
      const g = picked();
      if (!g.length) { ZH.toast('至少要一位將領。', 'bad'); return; }
      const card = cardSel ? cardSel.value : '';
      const cd = card ? D.cards[card] : null;
      const have = card ? S.cards.find(x => x.id === card) : null;
      const buff = cd && have ? cardBuff(cd,have) : null;
      const a = march(S.player, src, to, Number(range.value), g, { stealth: !!(card && cardBuff(D.cards[card],null) && cardBuff(D.cards[card],null).stealth), buff: buff });
      if (!a) { ZH.toast('無法出陣：道路不通或兵力不足。', 'bad'); return; }
      if (have) { have.n -= 1; log('計策「' + cd.name + '」：' + cname(g[0]) + '的軍隊出陣。', 'good'); }
      ZH.sfx(attack ? 'drum' : 'click');
      log((attack ? '出陣：' : '調兵：') + cname(g[0]) + '率 ' + wan(a.tr) + ' 往' + CITY[to].name + '。', attack ? 'war' : '');
      d.close(true);
      refresh(false);
    });
  }

  function recruitP(id) {
    const p = S.P[id];
    const ruler = rulerOf(S.player);
    let v = 35 + stat(ruler, 4) * 0.3 + fame(S.player) * 0.15 + mod(S.player, 'recruit') + (facHasSk(S.player, 'shiren') ? 10 : 0);
    if (p.st === 'c') v -= 25 + (p.loyal || 50) * 0.2;
    if (p.st === 'v') v += 10;
    return Math.round(clamp(v, 5, 95));
  }

    if (rng() * 100 < recruitP(id)) {
      const loc = p.loc && S.C[p.loc] && S.C[p.loc].o === S.player ? p.loc : capitalOf(S.player);
      p.st = 's'; p.f = S.player; p.loc = loc; p.loyal = 50; p.busy = S.t + 1; p.warned = 0;
      ZH.sfx('seal'); log(cname(id) + ' 願意為我效力！', 'good'); chron(cname(id) + '投效' + fdef(S.player).name + '。');

  // ───── 技能 ─────
  function charGrowth(id) {

  // ───── 斬首 ─────
  function askBehead(pid) {
    const p = S.P[pid];
    if (!p || p.st !== 'c') return Promise.resolve(false);
    const from = p.f0 || p.f;
    const sad = charsOf(S.player).filter(x => statBase(x, 4) >= 80 && S.F[S.player].ruler !== x).map(cname);
    const body = '<div class="wd-head">' + face(pid, true) + '<div><p>斬首' + esc(cname(pid)) + '，可以除去後患，但是：</p></div></div><ul class="wd-ul">' +
      '<li>名望 −3</li>' + (from && alive(from) ? '<li>和' + esc(fdef(from).name) + '的關係 −30</li>' : '') +
      (sad.length ? '<li>品德高的部下寒心，知遇 −5：' + esc(sad.slice(0, 6).join('、')) + (sad.length > 6 ? '等' : '') + '</li>' : '') + '</ul>' +
      '<p class="wd-quote">' + (D.id==='zg' ? '殺降會加深敵國仇怨，也可能使部下離心。處置俘虜時，請一併衡量後續外交與人才流動。' : '「項王詐阬秦降卒二十餘萬，唯獨邯、欣、翳得脫，秦父兄怨此三人，痛入骨髓。」（《史記・淮陰侯列傳》）殺降結下的仇，很久都化不開。') + '</p>';
    return ask('斬首？', body, [{ label: '取消', value: false }, { label: '斬首', value: true, primary: true }]).then(ok => {
      if (!ok || !behead(pid)) return false;
      ZH.sfx('ng');
      refresh(false);
      return true;
    });

  // ═══════════════════════════ 8. 流程：開局、每個月、史實事件、劇本往返、存檔、結局 ═══════════════════════════

  const SAVE_ID = 'campaign';         // 存檔的「劇本代碼」欄（伺服器保留給演義總進度）
  let SAVE_MODE = 'romance:ch';       // 存檔的「模式」欄：romance:卷代碼
  let ROOT = null;
  let PLAY = false;                   // 即時模式：時間是否在走
  let BUSY = false;                   // 正在結算一個月（避免重複觸發）
  let CLOCK = 0, LAST = 0, FRAME = 0;
  const BASE_MONTH_MS = 8000;         // 即時模式一倍速：一個月 8 秒
  const monthMs = () => BASE_MONTH_MS / ((S && S.speed) || 1);

  // ───── 即時模式 ─────
  function setPlay(on) {
    const was = PLAY;
    PLAY = !!on && !!S && !S.ended;
    if (PLAY && !was) LAST = 0;
    scheduleFrame();
    if (UI.clock && !PLAY) UI.clock.style.transform = 'scaleX(0)';
    if (UI.time) renderTime();
  }
  function togglePlay() { setPlay(!PLAY); ZH.sfx('click'); }
  // 0.2.1（採用 v0.1.1 的改法）：回合制靜止時不維持每一格的迴圈；軍隊移動、即時模式在走時才排下一格
  function scheduleFrame() {
    if (!FRAME && S && SVG && !document.hidden && (ANIM.active || (S.real && PLAY && !S.ended))) FRAME = requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { LAST = 0; scheduleFrame(); } });
  function frame(now) {
    FRAME = 0;
    const dt = LAST ? Math.min(250, now - LAST) : 0;
    LAST = now;
    if (!S || !SVG || document.hidden) return;
    stepArmies();
    if (S.real && PLAY && !BOOK_OPEN && !DLG && !BUSY && !TARGET && !S.ended && !document.hidden && !document.querySelector('.zh-modal,.zc-detail')) {
      CLOCK += dt;
      UI.clock.style.transform = 'scaleX(' + Math.min(1, CLOCK / monthMs()).toFixed(3) + ')';   // 用 transform：不觸發版面重排
      if (CLOCK >= monthMs()) { CLOCK = 0; endMonth(); }
    }
    scheduleFrame();
  }

  // ───── 一個月 ─────
  async function endMonth() {
    if (BUSY || !S || S.ended || BOOK_OPEN || document.querySelector('.zc-detail')) return;
    if (TARGET) cancelTarget();
    BUSY = true;
    try {
      tick();
      if (D.id==='zg') zgPactMonth();
      REPORTS.forEach(r => { if (r.result) boom(r.city); });
      refresh(true);
      await monthReports();
      const r = await processEvents();
      if (r === 'leave') return;
      await checkEnd();
      autosave();
    } catch (err) {
      console.error(err);
      ZH.toast('發生錯誤：' + err.message, 'bad', 5000);
    } finally {
      BUSY = false;
    }
    refresh(false);
  }

  async function monthReports() {
    // 戰報：有結果的戰役（攻下、守住、撤退、覆沒）才跳出來，最多兩場；其他看跑馬燈
    const reps = REPORTS.splice(0).filter(r => r.result);
    for (const r of reps.slice(0, 2)) {
      await focusCity(r.city, Math.min(CAM.w, homeW() * 0.95), 450);
      await showReport(r);
    }
    // 俘虜
    const caps = CAPTIVES.splice(0);
    caps.forEach(id => { if (CAPTIVE_WAIT.indexOf(id) === -1) CAPTIVE_WAIT.push(id); });
    if (caps.length) await handleCaptives();
    // 國策完成
    const nfd = NF_DONE.length;
    if (nfd) await showFocusDone();
    // 各國的外交提議
    const props = PROPOSALS.splice(0);
    for (const p of props) {
      if (!alive(p.f)) continue;
      const ok = await ask(p.kind === 'truce' ? '求和' : '結盟', '<div class="wd-head">' + face(rulerOf(p.f), true) + '<p>' + esc(p.text) + '</p></div>',
        [{ label: '拒絕', value: false }, { label: p.kind === 'truce' ? '答應停戰' : '答應結盟', value: true, primary: true }]);
      if (ok) {
        if (p.kind === 'truce') { W.truce(p.f, S.player, 12); log('與' + fdef(p.f).name + '停戰一年。', 'good'); }
        else { ally(p.f, S.player); addRel(p.f, S.player, 10); log('與' + fdef(p.f).name + '結為同盟！', 'good'); chron(fdef(S.player).name + '與' + fdef(p.f).name + '結盟。'); }
      } else addRel(p.f, S.player, -5);
    }
    if (reps.length || caps.length || props.length || nfd) refresh(false);
  }

  // ───── 史實事件 ─────
  /** 要不要跳出事件卡：有劇本、有史官題、抉擇、大事，或發生在我方 */
  function evShow(e) {
    if (e.silentIfPlayer && e.silentIfPlayer === S.player) return false;
    if (e.sid || e.quiz || e.kind === 'decision' || e.kind === 'story' || e.kind === 'finale') return true;
    return !!(S.C[e.at] && S.C[e.at].o === S.player);
  }
  async function processEvents() {
    for (let guard = 0; guard < 40; guard++) {
      const e = dueEvents()[0];
      if (!e) break;
      if (!evNeed(e)) {
        // 你的天下已經和正史不同：有劇本的事件改成「史官回顧」，其餘記一筆
        S.ev[e.id] = 'skip';
        if (e.sid && S.hist) {
          const r = await showEvent(e, { mode: 'review' });
          if (r === 'leave') return 'leave';
        } else if (e.sid || e.quiz) log('史官記事：正史上此時有「' + e.title + '」，你的天下沒有發生。可以在「史冊」補讀。', 'ev');
        continue;
      }
      const mine = evMine(e);
      if (!mine) evHist(e);
      evOffer(e);
      S.ev[e.id] = 'auto';
      if (!mine) chron('【' + e.title + '】');
      renderAll(false); renderTop(); renderTabs();
      if (evShow(e)) {
        if (S.C[e.at]) await focusCity(e.at, Math.min(CAM.w, homeW() * 0.95), 600);
        const r = await showEvent(e, { mode: mine ? 'decide' : 'live' });
        if (r === 'leave') return 'leave';
      } else log('史官記事：' + e.title + '。', 'ev');
      refresh(false);
    }
    return 'done';
  }

  /** 進入劇本是否可行 */
  function evCan(e) {
    if (!e.sid) return { ok: false, why: '' };
    const sc = ZH.findScenario ? ZH.findScenario(e.sid) : null;
    if (!sc) return { ok: false, why: '找不到這一話' };
    if (sc.status !== 'ready') return { ok: false, why: '這一話還在製作中' };
    if (!ZH.canPlay(e.sid)) return { ok: false, why: '登入學校帳號才能玩這一話' };
    return { ok: true, why: '' };
  }
  /** 以前玩過的最好成績（這個分頁的結算資料，或伺服器上的紀錄） */
  function prevTier(e) {
    if (!e.sid) return null;
    let t = null;
    const r = ZH.session.get('result:' + e.sid, null);
    if (r) t = tierFrom(r);
    const p = PROG[e.sid];
    if (p && p.plays) {
      const pt = p.best >= 75 ? 'great' : p.best >= 45 ? 'good' : 'bad';
      t = t ? better(t, pt) : pt;
    }
    return t;
  }

  function sceneArt(e) {
    const sc = e.scene || EV_SCENE[e.id] || ['palace', 'day'];
    let art = '';
    if (window.ART && ART.scene) { try { art = ART.scene(sc[0], { tod: sc[1], glyph: sc[2], banner: sc[3] }); } catch (err) { art = ''; } }
    if (!art) art = '<svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><rect width="1600" height="1000" fill="#3a3024"/><path d="M0 760 Q400 640 800 720 T1600 700 V1000 H0Z" fill="#2b2418"/></svg>';
    const cast = (e.cast || EV_CAST[e.id] || []).slice(0, 3).map(n => {
      let p = '';
      if (window.ART && ART.portrait) { try { p = ART.portrait({ id: n, name: n }, {}); } catch (err) { p = ''; } }
      return '<div>' + (p || '<span class="wd-face is-big">' + esc(n.slice(0, 1)) + '</span>') + '</div>';
    }).join('');
    const seal = D.chronicle ? '訪古' : e.kind === 'prequel' ? '前情' : e.kind === 'prologue' ? '序幕' : e.kind === 'epilogue' ? '尾聲' : e.kind === 'finale' ? '終局' : '史實';
    return '<div class="wd-scene">' + art + '<div class="wd-scene__cast">' + cast + '</div><span class="wd-scene__seal">' + seal + '</span></div>';
  }
  function rewardLine(e, tier) {
    const ids=Object.keys(D.cards).filter(id=>id===e.card||(D.cards[id].sources||[]).includes(e.sid));
    return ids.map(id=>{const cd=D.cards[id];return '<div class="wd-reward"><span class="wd-card__g">'+esc(cd.glyph)+'</span><span><b>計策「'+esc(cd.name)+'」</b>'+

      '<p style="margin-top:8px">' + esc(e.summary) + '</p>' + (D.chronicle ? '<p class="wd-dim wd-sm">篇章依史實年代展開；地圖正在推演的是「' + esc(D.name) + '」。訪古不把其他時代人物搬入這期地圖。</p>' : '') +

          (can.ok ? '扮演' + esc(e.role) + '，約 ' + e.minutes + ' 分鐘。玩完在結算頁按「回到天下」，成績會帶回大地圖。' : esc(can.why)) + '</small></span>' + (got ? '<span class="wd-tier t-' + got + '">' + TIER_LABEL[got] + '</span>' : '') + '</button>');
        if (prev) paths.push('<button type="button" class="wd-path" data-p="prev"><span class="wd-path__i">績</span><span><b>沿用成績</b><small>你玩過這一話（最佳：' + TIER_LABEL[prev] + '），直接用這個成績。</small></span><span class="wd-tier t-' + prev + '">' + TIER_LABEL[prev] + '</span></button>');
      }
      if (e.quiz) paths.push('<button type="button" class="wd-path' + (e.sid ? '' : ' is-main') + '" data-p="quiz"><span class="wd-path__i">史</span><span><b>史官代筆</b><small>回答 ' + Math.min(3, e.quiz.length) + ' 題，答對越多越好。' + (e.sid ? '答題最高到「史筆中」；要「史筆上」，請進入劇本。' : '') + '</small></span></button>');
      if (mode === 'replay' || mode === 'epilogue') paths.push('<button type="button" class="wd-path" data-p="close"><span class="wd-path__i">返</span><span><b>關閉</b><small>之後還可以在「史冊」補玩</small></span></button>');
      else paths.push('<button type="button" class="wd-path" data-p="later"><span class="wd-path__i">後</span><span><b>稍後再說</b><small>記在「史冊」，隨時可以補玩</small></span></button>');
    } else {
      paths.push('<button type="button" class="wd-path is-main" data-p="ok"><span class="wd-path__i">續</span><span><b>繼續</b></span></button>');
    }
    h += '<div class="wd-paths">' + paths.join('') + '</div>' + (mode !== 'decide' ? rewardLine(e, got) : '') + '</div>';
    const d = openDlg(h, { noClose: true, wide: false });
    const body = $('[data-body]', d.el);
    const finish = v => { d.close(v); refresh(false); };
    $$('[data-ch]', d.el).forEach(b => b.addEventListener('click', () => {
      const c = e.choices[Number(b.dataset.ch)];
      try { c.run(W); } catch (err) { console.warn(err); }
      S.stats.anch += 1;
      if (c.hist) S.stats.anchOk += 1;
      chron('【' + e.title + '】' + c.label.replace('（史實）', ''));
      ZH.sfx('seal');
      const histC = e.choices.find(x => x.hist);
      body.innerHTML = '<span class="wd-kicker">' + esc(e.title) + '</span><h2>' + esc(c.label.replace('（史實）', '')) + '</h2>' +
        '<p style="margin-top:8px">' + (c.hist ? '你的決定和正史一樣。' : '正史上的選擇是：「' + esc(histC ? histC.label.replace('（史實）', '') : '') + '」。你的天下將走向不同的路。') + '</p>' +
        '<div class="wd-dlg__acts"><button type="button" class="zh-btn zh-btn--primary" data-x="ok">回到地圖</button></div>';
      $('[data-x="ok"]', body).addEventListener('click', () => finish('done'));
    }));
    const on = (k, fn) => { const b = $('[data-p="' + k + '"]', d.el); if (b) b.addEventListener('click', fn); };
    on('ok', () => finish('done'));
    on('close', () => finish('done'));
    on('later', () => { if (!TIER_RANK[S.ev[e.id]] && S.ev[e.id] !== 'skip') S.ev[e.id] = 'later'; finish('later'); });
    on('play', () => { enterScenario(e); });
    on('prev', () => { const tier = prevTier(e); const card = evReward(e, tier, 'prev'); showRewardIn(body, e, tier, card, '沿用成績', () => finish('done')); });
    on('quiz', () => {
      runQuiz(e, body).then(tier => {
        if (e.sid && tier === 'great') tier = 'good';
        const card = evReward(e, tier, 'quiz');
        showRewardIn(body, e, tier, card, '史官代筆', () => finish('done'));

  }
  function showRewardIn(host, e, tier, card, how, done) {
    ZH.sfx(tier === 'bad' ? 'ng' : 'seal');
    host.innerHTML = '<span class="wd-kicker">' + esc(how) + '・' + esc(e.title) + '</span><h2>' + TIER_LABEL[tier] + '</h2>' +
      '<p style="margin-top:8px">' + (tier === 'great' ? '史官提筆：「此事記得分明。」' : tier === 'good' ? '史官點點頭：「大致不差。」' : '史官搖搖頭：「還要再讀一讀。」') + (D.chronicle && !card ? '這次沿用已記錄的成績，不重複發放同級獎勵。' : '名望、金錢也增加了。') + '</p>' +
      (card ? rewardLine(e, tier) : '') +
      '<div class="wd-dlg__acts"><button type="button" class="zh-btn zh-btn--primary" data-x="ok">回到地圖</button></div>';

    renderTop();
  }
  /** 史官代筆：逐題作答 */
  function runQuiz(e, host) {
    return new Promise(res => {
      const qs = e.quiz.slice(0, 3);
      let i = 0, ok = 0;
      const draw = () => {
        const q = qs[i];
        const order = q.o.map((t,k) => k);
        for (let j=order.length-1;j>0;j--) { const k=Math.floor(rng()*(j+1)); [order[j],order[k]]=[order[k],order[j]]; }
        host.innerHTML = '<span class="wd-kicker">史官代筆・' + esc(e.title) + '・第 ' + (i + 1) + ' / ' + qs.length + ' 題</span><p class="wd-quiz__q">' + esc(q.q) + '</p>' +
          '<div class="wd-quiz__o">' + order.map(k => '<button type="button" data-k="' + k + '">' + esc(q.o[k]) + '</button>').join('') + '</div><div data-why></div>';
        let lock = false;
        $$('[data-k]', host).forEach(b => b.addEventListener('click', () => {
          if (lock) return;
          lock = true;
          const k = Number(b.dataset.k), right = k === q.a;
          S.stats.anch += 1;
          if (right) { S.stats.anchOk += 1; ok += 1; }
          b.classList.add(right ? 'is-ok' : 'is-bad');
          if (!right) $('[data-k="' + q.a + '"]', host).classList.add('is-ok');
          $$('[data-k]', host).forEach(x => { x.disabled = true; });
          ZH.sfx(right ? 'ok' : 'ng');
          $('[data-why]', host).innerHTML = '<div class="wd-quiz__why"><b>' + (right ? '答對了。' : '正解：' + esc(q.o[q.a]) + '。') + '</b>' + esc(q.why) + '</div>' +
            '<div class="wd-dlg__acts"><button type="button" class="zh-btn zh-btn--primary" data-next>' + (i + 1 < qs.length ? '下一題' : '看結果') + '</button></div>';
          $('[data-next]', host).addEventListener('click', () => {
            i += 1;
            if (i < qs.length) { draw(); return; }
            const r = ok / qs.length;
            res(r > 0.99 ? 'great' : r >= 0.5 ? 'good' : 'bad');
          });
        }));
      };
      draw();
    });
  }

  // ───── 劇本往返 ─────
  /** 進入劇本：先把天下存起來（這個分頁＋伺服器），再換頁 */
  async function enterScenario(e) {
    if (S.pend) return;
    const at = Date.now();
    S.pend = { ev:e.id, sid:e.sid, at:at };
    ZH.session.set('world:return',{w:D.id,epoch:D.epoch || null,ev:e.id,sid:e.sid,at:at});
    setPlay(false);
    await saveGame(false);
    ZH.sfx('bell'); ZH.go(e.sid);
  }
  /** 從劇本回來：讀這個分頁裡的結算資料，換成計策卡 */
  async function handleReturn(ret) {
    ZH.session.remove('world:return');
    const pending = S.pend;
    const e = EVT[ret.ev];
    S.pend = null;
    if (!e || e.sid !== ret.sid || (D.chronicle && (!pending || pending.ev !== ret.ev || pending.sid !== ret.sid || pending.at !== ret.at))) { saveLocal(); return; }
    if (!e) return;
    const r = ZH.session.get('result:' + ret.sid, null);
    const fin = r && (r.scenarioId || r.sid) === ret.sid && r.finishedAt && Date.parse(r.finishedAt) >= (ret.at || 0) - 60000;
    if (fin) {
      const tier = tierFrom(r) || 'good';
      const card = evReward(e, tier, 'play');
      await showReturn(e, tier, card, r);
      saveGame(false);
    } else {
      await showEvent(e, { mode: 'again' });
    }
  }
  function showReturn(e, tier, card, r) {
    const end = r && r.ending ? r.ending : {};

      (end.title ? '<p style="margin-top:6px">劇本結局：<b>' + esc(end.title) + '</b>' + (end.text ? '——' + esc(end.text) : '') + '</p>' : '') +
      '<p>' + (D.chronicle && !card ? '這次表現已記入史冊；先前取得同級或更高評等，不重複發放獎勵。' : '你在劇本裡的表現帶回了天下：名望與金錢增加。') + '</p>' + (card ? rewardLine(e, tier) : '') +
      '<div class="wd-dlg__acts"><button type="button" class="zh-btn zh-btn--primary" data-x="ok">回到地圖</button></div></div>';

    ZH.sfx('seal');
    $('[data-x="ok"]', d.el).addEventListener('click', () => { d.close(true); refresh(false); });

  // ───── 終局 ─────
  async function checkEnd() {
    if (S.ended) return;
    if (D.id==='zg') { if (!alive(S.player)) await endGame('fall'); else if (zgGoals().unify) await endGame('unify'); else if (S.t >= (S.hist ? D.histEnd : D.freeEnd)) await endGame(zgEndKey()); return; }
    if (D.chronicle) { if (!alive(S.player)) await endGame('fall'); else if(!S.hist && citiesOf(S.player).length/CITY_IDS.length>=.85)await endGame('unify'); else if (S.t >= (S.hist ? D.histEnd : D.freeEnd)) await endGame(cqEndKey()); return; }
    const share = citiesOf(S.player).length / CITY_IDS.length;
    if (!alive(S.player)) { await endGame('fall'); return; }
    if (share >= 0.85) { await endGame('unify'); return; }
    if (S.hist && S.player === 'han' && !alive('chu')) { await endGame('hanWin'); return; }
    if (S.hist && S.player === 'chu' && !alive('han')) { await endGame('chuWin'); return; }
    if (S.hist) {
      if (S.t >= D.histEnd) {
        const world = histFinale();
        refresh(false);
        let key;
        if (!alive(S.player)) key = 'fall';
        else if (citiesOf(S.player).length / CITY_IDS.length >= 0.85) key = 'unify';
        else if (S.player === 'han') key = world === 'hanWin' ? 'hanWin' : 'survive';
        else if (S.player === 'chu') key = world === 'chuWin' ? 'chuWin' : 'survive';
        else key = 'survive';
        await endGame(key, world);
      }
    } else if(citiesOf(S.player).length/CITY_IDS.length>=.85)await endGame('unify');
    else if (S.t >= D.freeEnd) await endGame(endKeyNow());
  }
  async function endGame(key, world) {

    chron('戰役結束：' + (D.endings[key] || {}).title);
    saveGame(false);
    refresh(false);
    await showEnding();
  }

  // ───── 存檔 ─────
  /** 存檔用的狀態：小數四捨五入、紀錄只留最近的 */
  function pack() {
    const o = Object.assign({}, S, { log: S.log.slice(0, 16) });
    return JSON.parse(JSON.stringify(o, (k, v) => (typeof v === 'number' && !Number.isInteger(v) ? Math.round(v * 100) / 100 : v)));
  }
  let LEAVING=false;
  function saveLocal() {
    if (LEAVING || !S) return null;
    S.savedAt = Date.now();
    const st = pack();
    ZH.session.set('world:' + D.id, { world: st });
    return st;
  }
  function saveGame(manual) {
    const st = saveLocal();
    if (!st) return Promise.resolve(null);
    return ZH.save(SAVE_ID, SAVE_MODE, { world: st }).then(r => {
      if (manual) {
        if (r && r.ok === false && !r.guest) ZH.toast('存檔失敗：' + (r.msg || ''), 'bad', 4000);
        else ZH.toast(r && r.guest ? '已存檔（訪客：只保存在這個分頁）。' : '已存檔。', 'ok');
      }
      return r;
    }).catch(err => { if (manual) ZH.toast('存檔失敗：' + err.message, 'bad', 4000); return null; });
  }
  function autosave() {
    if (!S) return;
    if (S.real && S.t % 3 !== 0) { saveLocal(); return; }
    saveGame(false);
  }
  /** 讀檔：伺服器與這個分頁的備份，取比較新的 */
  function loadSaved() {
    const okState = st => st && (st.v === 1 || st.v === 2) && st.w === D.id && st.F && st.C ? st : null;
    const local = okState((ZH.session.get('world:' + D.id, null) || {}).world);
    const remote = ZH.load(SAVE_ID, SAVE_MODE).then(r => okState(r && r.state && r.state.world)).catch(() => null);
    return remote.then(rs => {
      if (rs && local) return (local.savedAt || 0) >= (rs.savedAt || 0) ? local : rs;
      return rs || local;
    });

  /** 伺服器上各話的最佳成績（沿用成績用） */

      .then(r => { PROG = (r && r.ok && r.prog) || {}; return PROG; })

  // ───── 開局畫面 ─────

    }
    await afterStart();

  async function afterStart() {

    const cap = capitalOf(S.player);
    if (cap) { select('city', cap); await focusCity(cap, homeW(), 900); }
    if (!S.help.intro) { S.help.intro = 1; await openHelp(); }

  async function resumeGame(st, ret) {
    if (MASTER && MASTER.chronicle) selectEpoch(st.epoch || MASTER.defaultEpoch);
    S = st;
    if(ZH.player)await ZH.player.initRun(S,'world',D.id);
    upgradeState(false);   // 舊存檔：刪掉移除的城、補上國策與寶物
    S.help = S.help || {};
    S.stats = S.stats || { won: 0, lost: 0, taken: 0, lostC: 0, anch: 0, anchOk: 0, played: 0 };
    buildShell(ROOT);
    refresh(false);
    const cap = capitalOf(S.player);
    if (cap) focusCity(cap, homeW(), 0); else fitAll();
    scheduleFrame();
    (async () => {
      if (ret) await handleReturn(ret);
      else if (S.pend && EVT[S.pend.ev]) { const e = EVT[S.pend.ev]; S.pend = null; await showEvent(e, { mode: 'again' }); }
      if (!S.ended && !nfOf(S.player)) await chooseDoctrine();

      } else await showEnding();
      refresh(false);
      saveLocal();
    })();
  }

  function cqGoals() {

    const foodNeed=Math.max(100,Math.round(upkeepOf(S.player,troopsOf(S.player))*3));
    const safe=own.length>0 && !S.A.some(a=>a.f!==S.player && a.st==='siege' && own.includes(a.at));
    return {allies,mx,foodNeed,safe,ready:safe && allies.length>=3 && mx>=65 && fame(S.player)>=70 && S.F[S.player].f>=foodNeed && S.F[S.player].g>=200 && S.t>=6};

  function zgMajors() { return D.majorFactions.filter(f => S.F[f]); }
  function zgPactStatus(finalMonth) {
    const p=S.zgPact;
    if (!p) return {active:false,why:'尚未立約'};
    if (p.ended) return {active:false,why:p.ended};
    if (finalMonth ? S.t>p.until : S.t>=p.until) return {active:false,why:'盟約到期'};
    if (!alive(S.player)) return {active:false,why:'國勢失守'};
    if (p.partners.some(f=>!alive(f)||!allied(S.player,f))) return {active:false,why:'盟國亡國或退出同盟'};
    if (p.kind==='vertical' && (!alive(p.target)||allied(S.player,p.target))) return {active:false,why:'共同對手失去據點或已與你結盟'};
    return {active:true,why:'盟約履行中'};
  }
  function zgGoals() {
    const own=citiesOf(S.player),majors=zgMajors(),allies=majors.filter(f=>f!==S.player&&alive(f)&&allied(S.player,f));
    const mx=own.length ? own.reduce((a,c)=>a+S.C[c].mx,0)/own.length : 0;
    const foodNeed=Math.max(100,Math.round((upkeepOf(S.player,troopsOf(S.player))+(zgPactStatus().active?(S.zgPact.kind==='vertical'?450:150):0))*3));
    const safe=own.length>0&&!S.A.some(a=>a.f!==S.player&&a.st==='siege'&&own.includes(a.at));
    const share=own.length/CITY_IDS.length,remaining=majors.filter(f=>f!==S.player&&alive(f));
    const pact=zgPactStatus(),p=S.zgPact,threatShare=p&&p.target?citiesOf(p.target).length/CITY_IDS.length:1;
    const focus=Object.keys((nfOf(S.player)||{}).done||{}).length;
    return {allies,mx,foodNeed,safe,share,remaining,focus,pact,threatShare,
      unify:remaining.length===0&&share>=.70,
      coalition:pact.active&&p.kind==='vertical'&&p.partners.length===3&&(p.held||0)>=6&&threatShare<=.40&&mx>=65&&safe,
      strength:focus>=2&&mx>=70&&fame(S.player)>=75&&S.F[S.player].f>=foodNeed&&safe};
  }

  function zgPactMonth() {
    const p=S.zgPact;if(!p||p.ended)return;
    const check=zgPactStatus(true);if(!check.active){zgStopPact(check.why);return;}
    const me=S.F[S.player],gold=p.kind==='vertical'?50:40,food=p.kind==='vertical'?450:150;
    if(me.g<gold||me.f<food){zgStopPact('金糧不足，無法履約');return;}
    me.g-=gold;me.f-=food;
    p.partners.forEach(f=>{S.F[f].f+=150;if(p.kind==='horizontal')S.F[f].g+=40;addRel(S.player,f,1);});
    citiesOf(S.player).forEach(c=>{
      S.C[c].mx=Math.min(100,S.C[c].mx+.5);
      if(p.kind==='vertical')S.C[c].df=Math.min(100,S.C[c].df+1);
      else S.C[c].co=Math.min(100+mod(S.player,'faMax'),S.C[c].co+1);
    });
    p.held=(p.held||0)+1;
    if(S.t===p.until){zgStopPact('盟約到期');return;}
    if(p.until-S.t===3)log('盟約三個月後到期；可在「勢力」親自續約。','ev');
  }

  function territoryGeometry() {
    const key=D.id+'|'+(D.epoch||'')+'|'+CITY_IDS.map(id=>id+':'+CITY[id].x+','+CITY[id].y).join(';');
    if(GEO_CACHE.has(key))return GEO_CACHE.get(key);
    const cross=(a,b,c)=>(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);
    const points=CITY_IDS.flatMap(id=>{const c=CITY[id];return [[c.x-110,c.y-110],[c.x-110,c.y+110],[c.x+110,c.y-110],[c.x+110,c.y+110]];}).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
    const lower=[],upper=[];
    points.forEach(p=>{while(lower.length>1&&cross(lower[lower.length-2],lower[lower.length-1],p)<=0)lower.pop();lower.push(p);});
    points.slice().reverse().forEach(p=>{while(upper.length>1&&cross(upper[upper.length-2],upper[upper.length-1],p)<=0)upper.pop();upper.push(p);});
    const hull=lower.slice(0,-1).concat(upper.slice(0,-1)),polys={},cells={},edges=new Map();
    const clip=(poly,nx,ny,limit)=>{
      const result=[];
      for(let i=0;i<poly.length;i++){
        const a=poly[i],b=poly[(i+1)%poly.length],da=a[0]*nx+a[1]*ny-limit,db=b[0]*nx+b[1]*ny-limit;
        if(da<=1e-7)result.push(a);
        if((da<0&&db>0)||(da>0&&db<0)){const t=da/(da-db);result.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]);}
      }return result;
    };
    const xy=p=>p.map(v=>v.toFixed(2)).join(' '),pk=p=>p.map(v=>v.toFixed(2)).join(',');
    CITY_IDS.forEach(id=>{const a=CITY[id];let poly=hull.map(p=>p.slice());CITY_IDS.forEach(other=>{if(other===id)return;const b=CITY[other];poly=clip(poly,b.x-a.x,b.y-a.y,(b.x*b.x+b.y*b.y-a.x*a.x-a.y*a.y)/2);});polys[id]=poly;
      poly.forEach((a,i)=>{const b=poly[(i+1)%poly.length];if(Math.hypot(a[0]-b[0],a[1]-b[1])<.02)return;const ka=pk(a),kb=pk(b),k=ka<kb?ka+'|'+kb:kb+'|'+ka;
        if(!edges.has(k))edges.set(k,{a,b,ids:[]});edges.get(k).ids.push(id);

    });
    // 同一條邊共用控制點，兩側精確接合；僅微調曲線，無每城半徑色圈。
    edges.forEach(e=>{const dx=e.b[0]-e.a[0],dy=e.b[1]-e.a[1],l=Math.hypot(dx,dy),bend=Math.min(8,l*.06)*Math.sin((e.a[0]+e.b[0])*.019+(e.a[1]+e.b[1])*.013);e.mid=[(e.a[0]+e.b[0])/2-dy/l*bend,(e.a[1]+e.b[1])/2+dx/l*bend];});
    CITY_IDS.forEach(id=>{const poly=polys[id];if(!poly.length){cells[id]='';return;}let path='M'+xy(poly[0]);poly.forEach((a,i)=>{const b=poly[(i+1)%poly.length],ka=pk(a),kb=pk(b),e=edges.get(ka<kb?ka+'|'+kb:kb+'|'+ka);path+=e?'Q'+xy(e.mid)+' '+xy(b):'L'+xy(b);});cells[id]=path+'Z';});
    const borders=[];edges.forEach(e=>{if(e.ids.length===2)borders.push([e.ids[0],e.ids[1],'M'+xy(e.a)+'Q'+xy(e.mid)+' '+xy(e.b)]);});
    const result={cells,borders};GEO_CACHE.set(key,result);return result;
  }

    return value;
  }

  function cardRuleError(c) {
    const allowed={relation:['country','distantCountry'],speechSupport:['country','distantCountry'],passage:['passageCountry'],admin:['self'],armyBuff:['army'],forceLoss:['enemyForce'],uprising:['enemyCity'],discord:['enemyPerson'],escape:['passive']};
    if(!Array.isArray(c.effects)||!c.effects.length)return '缺少效果資料';
    for(const e of c.effects){
      if(!allowed[e.op]||!allowed[e.op].includes(c.target))return '效果與目標種類不相容';
      if(Object.values(e).some(v=>typeof v==='number'&&!Number.isFinite(v)))return '數值必須是有限數';
      if(e.months!==undefined&&(!(e.months>0)||!Number.isInteger(e.months)))return '持續月份須為正整數';
      const fields={relation:['value'],speechSupport:['value','months'],passage:['months'],admin:['mx','months'],armyBuff:[],forceLoss:['troops'],uprising:['troopLoss','mxLoss','relation'],discord:['loyalty','threshold','chance','joinChance'],escape:['retain']}[e.op];
      if(fields.some(k=>typeof e[k]!=='number'))return '缺少效果所需數值';
      if(e.op==='speechSupport'&&(!Array.isArray(e.kinds)||!e.kinds.length))return '交涉加成須指定適用交涉種類';
      if(e.op==='forceLoss'&&(typeof e.defence!=='number'||typeof e.morale!=='number'))return '城防與士氣效果須有數值';
      if(['troops','defence','morale','troopLoss','retain','chance','joinChance'].some(k=>e[k]!==undefined&&(e[k]<0||e[k]>1)))return '比例須介於0與1';
