<script>
(function(ZH){'use strict';const ASSETS=null; // MYTH_ASSETS
 if(!ASSETS||ZH.myth)return;
 ZH.ready(()=>{let view=null,epoch=0,style=null;const dialog=document.createElement('dialog');dialog.className='myth-modal';dialog.setAttribute('aria-label','山海異境與收藏博物館');const host=document.createElement('div');host.className='myth-host';dialog.append(host);document.body.append(dialog);
 function close(){++epoch;view?.dispose();view=null;dialog.close();}
 function css(){return style||(style=new Promise((resolve,reject)=>{const link=document.createElement('link');link.rel='stylesheet';link.href=ZH_STATIC_URL(ASSETS.css);link.onload=resolve;link.onerror=()=>{style=null;link.remove();reject(Error('遊戲樣式暫時無法載入。'));};document.head.append(link);}));}
 async function open(mode='adventure'){const token=++epoch;view?.dispose();view=null;if(!dialog.open)dialog.showModal();host.innerHTML='<div style="padding:30px;color:#f2dbb0"><p role="status">正在開啟山海異境……</p><button data-back>返回首頁</button></div>';host.querySelector('[data-back]').onclick=close;try{const [module]=await Promise.all([import(ZH_STATIC_URL(ASSETS.app)),css(),ZH.player.load()]);if(token!==epoch)return;view=module.mountMyth(host,{entry:ZH_STATIC_URL(ASSETS.entry),view:mode,guest:ZH.isGuest(),teacher:ZH_BOOT.user?.isTeacher===true,api:(name,arg)=>arg===undefined?ZH.call(name):ZH.call(name,arg),appearance:ZH.player.profile?.appearance||{},onClose:close,onSaveAppearance:look=>ZH.player.saveAppearance(look),onLegacy:()=>{close();if(ZH_BOOT.page==='gallery')return;ZH.go('gallery');}});}catch(error){if(token!==epoch)return;host.replaceChildren();const box=document.createElement('div');box.style.padding='30px';const p=document.createElement('p');p.textContent=error.message||'暫時無法開啟。';const retry=document.createElement('button');retry.textContent='重新載入';retry.onclick=()=>open(mode);const back=document.createElement('button');back.textContent='返回首頁';back.onclick=close;box.append(p,retry,back);host.append(box);}}
 document.querySelectorAll('[data-myth-open]').forEach(b=>b.onclick=()=>open());document.querySelectorAll('[data-myth-museum]').forEach(b=>b.onclick=()=>open('museum'));dialog.addEventListener('cancel',event=>{if(event.target!==dialog)return;event.preventDefault();close();});window.addEventListener('pagehide',()=>{++epoch;view?.dispose();view=null;});ZH.myth={open,openMuseum:()=>open('museum'),close,inspect:()=>view?.inspect()||{opened:dialog.open}};
 });})(window.ZH);
</script>
