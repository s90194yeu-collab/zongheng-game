const FLAGS={advance:{name:'進軍旗',text:'讓各隊跟上同一節拍'},support:{name:'接續旗',text:'維持車、旗、鼓的交接'},rally:{name:'整隊旗',text:'軍情報齊，停止自行追逐'}};
const BEATS=[
{flag:'advance',title:'郤克未絕鼓音',text:'主帥受傷，旗鼓仍是全軍共同訊號。先親送進軍旗，再在合拍區擊鼓。',report:'郤克傷於矢，未絕鼓音。遊戲的節拍不是史實鼓譜，用以體驗全軍依旗鼓進退。'},
{flag:'support',title:'御者穩住車行',text:'解張與鄭丘緩也在支撐此車；親送接續旗，再擊鼓。',report:'解張說自己也被箭貫手及肘，鄭丘緩曾下推車。文本保留三人協同，不是主帥一人獨力推進。'},
{flag:'advance',title:'全軍的耳目',text:'師之耳目，在吾旗鼓。親送進軍旗，讓隊伍接同一道訊號。',report:'師之耳目，在吾旗鼓，進退從之。旗與鼓使軍队接到共同命令，快手分另看，還須讓旗令、鼓聲與各隊進退相應。'},
{flag:'support',title:'援枹接鼓',text:'解張左並轡、右援枹而鼓。親送接續旗，保持接鼓節拍。',report:'左並轡，右援枹而鼓。解張兼顧御車與擊鼓；枹是鼓槌。節拍之後還須你親選交接者。'},
{flag:'advance',title:'師從之',text:'各隊跟上旗鼓，親送進軍旗，再完成一次共同節拍。',report:'師從之，齊師敗績。固定史實是晉與魯衛曹聯軍勝齊，節拍分數不改成齊勝。'},
{flag:'rally',title:'勝報與整隊',text:'勝後先整隊交接，不以每隊自行追逐充當完整軍報。親送整隊旗，再擊鼓。',report:'整隊旗是教學推演。原文接續追齊、逢丑父代君與戰後議和；遊戲未把一個旗令冒充原文明記。'}
];
function drum(saved,rng){const s=saved?copy(saved):{kind:'drum',phase:'plan',cursor:0,left:75,elapsed:0,pulse:0,flag:null,bands:BEATS.map(()=>({lo:.25+rng()*.25,width:.2,period:1.8+rng()*.5})),flagOrder:BEATS.map(()=>shuffle(Object.keys(FLAGS),rng)),firstAnswers:{},firstSignals:{},hits:0,signalHits:0,streak:0,maxStreak:0,signals:[],replies:[],readReports:0,handoff:null,sealed:false,actions:[],guideSteps:0,assisted:false,paused:false,note:'暫扮郤克；六次親送旗、擊鼓、讀報，再親交接與整隊。'};

n_02:async ctx=>{await scene(ctx,'battle','鞍・兩軍相遇','前589年六月',['qihou','xike']);await ctx.say([{who:'qihou',expr:'smirk',text:'余姑翦滅此而朝食。'},{text:'不介馬而馳之。齊頃公把滅敵說得像早餐前便能做完，連馬甲也未準備。'},{who:'shiguan',expr:'serious',text:'朝食是早飯，介馬是給馬披甲。不能只看一句豪語，還要看它連著什麼行動。'}]);await ctx.anchor('jb_01');ctx.unlock('person:cq_qiqinggong');ctx.unlock('idiom:miecichaoshi');return 'n_03';},
n_03:async ctx=>{await scene(ctx,'battle','鞍・郤克之車','箭傷與鼓音',['xike','jiezhang','qiuhuan']);await ctx.say([{text:'郤克傷於矢，流血及屨，未絕鼓音。'},{who:'xike',expr:'worried',text:'余病矣。'},{who:'jiezhang',expr:'serious',text:'吾子忍之。'},{text:'解張也曾受箭傷仍御車，鄭丘緩遇險下推。遊戲不呈現傷口，只讀一句帶過；接著由你維持旗鼓與交接。'}]);await ctx.anchor('jb_02');ctx.unlock('person:cq_jiezhang');return 'n_04';},
n_04:async ctx=>{await scene(ctx,'battle','鞍・全軍耳目','旗鼓與同車協力',['xike','jiezhang','qiuhuan']);await ctx.say([{who:'jiezhang',expr:'serious',text:'師之耳目，在吾旗鼓，進退從之。'},{text:'左並轡，右援枹而鼓。解張把御車與接鼓相連，軍隊從旗鼓的共同訊號進退。'}]);await ctx.anchor('jb_03');const v=await choice(ctx,'cooperate',{title:'全軍的耳目在這輛車上，指揮應如何接續？',text:'此題評你對協力的理解，節拍得分另計。',options:[{label:'守住共同訊號與交接，承認御者、車右和聯軍各有責任。',value:'share'},{label:'只記主帥忍痛，其他人和聯軍都不必出現在軍報裡。',value:'alone'}]});ctx.add('heart',v==='share'?20:0);await ctx.say([{text:'接下來六輪都要親送旗、親擊鼓、親讀軍報，再親選解張交接並下整隊令。具體節拍與旗色為教學推演，不是史實鼓譜。'}]);ctx.unlock('treasure:cq11_qigu');return 'n_05';},
n_05:async ctx=>{const r=await challenge(ctx,'jb_drum','drum','鞍戰旗鼓・全軍的耳目','親做六次送旗、合拍擊鼓、軍報閱讀，親選解張交接並整隊。');ctx.add('crown',firstScore(r)*3);await ctx.say([{text:'六次旗鼓與交接已親做。師從之，齊師敗績。高分評協同操作，沒有把史實改成齊勝或只剩一位主帥的功勞。'}]);return 'n_06';},
n_06:async ctx=>{await scene(ctx,'battle','華泉・代君任患','齊君得免',['choufu','hanjue','xike']);await ctx.say([{text:'追齊時，逢丑父與齊頃公易位，使君下取飲水，齊君得免。韓厥獻丑父於晉，郤克原欲戮他。'},{who:'choufu',expr:'serious',text:'自今無有代其君任患者。有一於此，將為戮乎？'},{who:'xike',expr:'serious',text:'人不難以死免其君，我戮之不祥。赦之以勸事君者。'}]);await ctx.anchor('jb_04');ctx.unlock('person:cq_pangchoufu');return 'n_07';},
n_07:async ctx=>{await scene(ctx,'qicity','齊・戰後求和','國佐，亦稱賓媚人',['guozuo','xike']);await ctx.say([{text:'國佐以紀甗、玉磬與地求和。晉另求以齊君母為質，並使齊封內盡東其畝。'},{who:'guozuo',expr:'serious',text:'唯吾子戎車是利，無顧土宜，其無乃非先王之命也乎！'},{text:'他反對以君母為質，也指出田畝不能只為晉戎車便利而忽略土宜。魯衛亦勸晉限制要求，晉許和，後盟於袁婁。'}]);await ctx.anchor('jb_05');const v=await choice(ctx,'limits',{title:'勝方如何面對土地、民利與求和？',text:'原文晉許和、齊不亡；選擇評你對勝後限度的理解。',options:[{label:'將戎車方便與土宜民利分開衡量，不以勝戰合理化所有苛求。',value:'bound'},{label:'只要獲勝，質君母、改田畝等一切要求都不需再問理由。',value:'unlimited'}]});ctx.add('heart',v==='bound'?20:0);ctx.unlock('treasure:cq11_jiyan');return 'n_08';},
n_08:async ctx=>{await scene(ctx,'room','晉・外交文書案','前578年四月・你是呂相',['lvxiang','jinli','shiguan']);await ctx.chapter('第二幕　你是呂相','十一年後，奉晉厲公命絕秦');await ctx.say([{text:'晉景公已卒，晉厲公在位。晉侯使呂相絕秦，收話的秦君是秦桓公。你現在是晉大夫呂相，不是剛才的郤克。'},{who:'lvxiang',expr:'serious',text:'一篇絕秦辭，要把數代恩怨連成一條線。但連成什麼線，決定哪些責任顯出、哪些前情退到後面。'},{who:'shiguan',expr:'serious',text:'接下來對讀文字的證據位置。有立場不等於全是假；有一項事件相合，也不等於每句轉述已被逐字核實。'}]);ctx.unlock('person:cq_lvxiang');return 'n_09';},
n_09:async ctx=>{await scene(ctx,'room','晉・先述舊好','文書回顧獻穆之交',['lvxiang','shiguan']);await ctx.say([{who:'lvxiang',expr:'serious',text:'昔逮我獻公及穆公相好，戮力同心，申之以盟誓，重之以昏姻。'},{text:'先承認秦晉有盟誓婚姻，說秦援惠公、助文公，而晉文公也報舊德。這是由恩轉怨的開頭，不是從頭就說秦從無恩。'},{who:'shiguan',expr:'serious',text:'此處回顧前代，秦穆公與晉獻公都不是前578年正在收發文書的人。'}]);await ctx.anchor('jb_06');return 'n_10';},
n_10:async ctx=>{await scene(ctx,'academy','晉・圍鄭兩段對读','回顧前630年',['lvxiang','shiguan']);await ctx.say([{who:'lvxiang',expr:'serious',text:'秦師克還無害，則是我有大造於西也。'},{text:'絕秦辭先責秦不詢晉而擅與鄭盟，再把秦安返集中說成晉安諸侯之功。圍鄭敘事還記秦伯與鄭盟、子犯請擊、晉文公不許。'},{who:'shiguan',expr:'serious',text:'秦鄭盟、晉不擊是可對讀的事。大造於西又帶晉方自我評價；補讀不是立刻把整段判為虛構。'}]);await ctx.anchor('jb_07');return 'n_11';},
n_11:async ctx=>{await scene(ctx,'academy','晉・殽師的因果','回顧前627年',['lvxiang','shiguan']);await ctx.say([{who:'lvxiang',expr:'serious',text:'我襄公未忘君之舊勳，而懼社稷之隕，是以有殽之師。'},{text:'同一殽之戰，敘事從秦謀襲鄭、商人犒師、鄭有備、秦滅滑而還，再接晉國軍議。文書突出晉保社稷的理由。'},{who:'shiguan',expr:'serious',text:'判斷它選了什麼、略了什麼，不等於否認殽戰曾發生。責秦與自衛如何連接，要把略去的前情放回來。'}]);await ctx.anchor('jb_08');return 'n_12';},
n_12:async ctx=>{await scene(ctx,'academy','晉・立君與令狐之役','回顧前620年',['lvxiang','shiguan']);await ctx.say([{who:'lvxiang',expr:'serious',text:'穆襄即世，康靈即位。康公，我之自出。'},{text:'秦康公母出晉，兩國有親族。文書卻責秦率我蝥賊來擾。另一段敘事記晉先請秦迎公子雍，後改立靈公，再迎擊秦師於令狐。'},{who:'shiguan',expr:'serious',text:'蝥賊是有害、作亂者的貶稱。把晉改變立君安排的前情補入，才能看歸責的取捨。前620年的令狐之役，也不能混成前579年的令狐會盟。'}]);await ctx.anchor('jb_09');return 'n_13';},
n_13:async ctx=>{await scene(ctx,'room','晉・農功與邊陲','回顧輔氏之聚',['lvxiang','shiguan']);await ctx.say([{who:'lvxiang',expr:'serious',text:'芟夷我農功，虔劉我邊陲，我是以有輔氏之聚。'},{text:'這些控訴把傷害由國君推到農作與邊民，辭令的重量隨之增加。畫面不做破壞農田、殺害邊民的操作。'},{who:'shiguan',expr:'serious',text:'讀出字義，也要看誰在組織這些傷害的敘事。措辭強烈，和事件能核到哪一層，是兩件都要辨的事。'}]);await ctx.anchor('jb_10');return 'n_14';},
n_14:async ctx=>{await scene(ctx,'room','晉・狄楚告知','當前秦君與盟誓',['lvxiang','qinhuan','shiguan']);await ctx.say([{text:'文書指秦與晉議伐白狄，卻又告狄晉將伐女；又引楚來告晉，責秦二三其德。畫面秦桓公表示收話者，沒有把文中轉述直接演成已查得的秦方原件。'},{who:'lvxiang',expr:'serious',text:'楚人惡君之二三其德也，亦來告我。'},{who:'shiguan',expr:'serious',text:'二三其德是反覆不一。它既評秦，也把第三方告知納入責秦的說服線索。'}]);await ctx.anchor('jb_11');ctx.unlock('idiom:ersanqide');return 'n_15';},
n_15:async ctx=>{await scene(ctx,'room','晉・誰告訴誰','保留告知鏈',['lvxiang','shiguan']);await ctx.say([{text:'楚告晉的話裡，又引用其所稱秦方誓辭：「余雖與晉出入，余唯利是視。」'},{who:'shiguan',expr:'serious',text:'不是呂相在此自白唯利是視，也不是遊戲已拿到一份完整秦方誓書。成公十三年另有秦召狄楚圖晉的敘事，可對讀核心行動；逐字原誓仍不能自動核實。'}]);await ctx.anchor('jb_12');await ctx.say([{text:'接下來親讀六份對照，再逐輪選證據和判定。讀報必須由你親按讀畢；不能用一個全真或全假的標籤略過。'}]);return 'n_16';},
n_16:async ctx=>{const r=await challenge(ctx,'jb_audit','audit','絕秦對讀・話語與證據','親讀六證、送六輪證據與判定會勘，親選證據界限並下令。');ctx.add('crown',firstScore(r)*4);return 'n_17';},
n_17:async ctx=>{await scene(ctx,'academy','晉・對讀後的記錄','你・呂相',['lvxiang','shiguan']);const v=await choice(ctx,'evidence',{title:'完成會勘後，你怎樣保留這篇文書的證據界限？',text:'此選擇評判讀責任，最佳分不抹去首次錯判。',options:[{label:'逐句分清事件、歸責、轉述與條件；未核原件保留，不將未知直接判假。',value:'qualified'},{label:'有一處省略就全篇作廢，或有一件相合就全篇逐字當真。',value:'binary'}]});ctx.add('heart',v==='qualified'?20:0);await ctx.say([{who:'lvxiang',expr:'serious',text:'奉君命說話，還要知道話如何取得力量。不能只用一句「有偏見」，代替六份對讀的工作。'},{text:'文書稱諸侯痛心疾首、暱就寡人，是把共同憤怒接到親晉的說法。稱心情的字句，也不等於每位諸侯的心理已逐一查證。'}]);ctx.unlock('idiom:tongxinjishou');return 'n_18';},
n_18:async ctx=>{await scene(ctx,'hall','晉・求好與不能退','文書結尾',['lvxiang','jinli']);await ctx.say([{who:'lvxiang',expr:'serious',text:'寡人帥以聽命，唯好是求。'},{who:'lvxiang',expr:'serious',text:'君若不施大惠，寡人不佞，其不能以諸侯退矣。'},{text:'前半求好，後半把退兵接到秦施大惠的條件。寡人是晉厲公的君命口吻，由呂相奉命傳達。不是使者自稱王，也不是無條件撤軍。'}]);await ctx.anchor('jb_13');return 'n_19';},
n_19:async ctx=>{await scene(ctx,'room','晉・六段竹簡','前578年四月・送出之前',['lvxiang','jinli']);await ctx.chapter('第三幕　奉君命的文書','六段次序、六次稱謂、兩項核定');await ctx.say([{who:'shiguan',expr:'serious',text:'舊好、圍鄭、殽、康靈、當前秦君、結尾條件。親組六段，校讀每段所指國君，再核誰的君命與何種退兵條件。'},{who:'lvxiang',expr:'serious',text:'我文公不是秦文公，我襄公不是宋襄公。收話的君和奉命的寡人，也不是同一人。'},{text:'竹簡編排是教學操作，不聲稱現存實物即用此形制。此時還未發生五月麻隧勝報，不能把後來結果倒填進去。'}]);return 'n_20';},
n_20:async ctx=>{const r=await challenge(ctx,'wen_jb_draft','draft','絕秦編簡・奉君命而行','親選六段原文、校讀六次稱謂、綁簡讀報，核條件與君命後親送文書。');setMeter(ctx,'shield',firstScore(r)*10);ctx.unlock('text:lvxiangjueqin');return 'n_21';},
n_21:async ctx=>{await scene(ctx,'qin','秦・奉命傳達','前578年四月',['lvxiang','qinhuan']);await ctx.say([{text:'晉侯使呂相絕秦。你已親組與親送文書；這次外交行動是奉晉侯命，而非呂相私人結怨。'},{who:'lvxiang',expr:'serious',text:'敢盡布之執事，俾執事實圖利之！'},{who:'shiguan',expr:'serious',text:'禮貌稱執事，末請實圖利；前面仍有盟好、退兵與不能退的條件。言語的力量，要和後續的軍事行動一同讀。'}]);return 'n_22';},
n_22:async ctx=>{await scene(ctx,'battle','麻隧・秦晉會戰','前578年五月',['lvxiang','jinli','fanwenzi']);await ctx.say([{text:'晉率諸侯師與秦戰於麻隧，秦師敗績。師遂濟涇，及侯麗而還。四月文書之後，才有五月會戰的結果。'},{who:'shiguan',expr:'serious',text:'文書如何論說、軍隊是否獲勝、國家能否長久安穩，是三層不同的問題。勝報不能回頭證明辭令每個誓詞逐字都已查實。'},{text:'此幕只讀固定史實，不另以編簡高分改成秦勝或宣告天下已無戰。'}]);return 'n_23';},
n_23:async ctx=>{await scene(ctx,'camp','晉・鄢陵前軍議','前575年・戰果之後仍有內憂',['fanwenzi','jinli','shiguan']);await ctx.chapter('第四幕　外寧與內憂','晉霸中興，為什麼仍要戒？');await ctx.say([{text:'三年後，鄭從楚，晉將伐鄭，晉楚將遇鄢陵。范文子士燮不欲戰，擔心只看外部戰果而忘內政之患。'},{who:'fanwenzi',expr:'serious',text:'唯聖人能外內無患。自非聖人，外寧必有內憂。盍釋楚以為外懼乎。'},{who:'shiguan',expr:'serious',text:'這是不同的戰事，不是鞍，也不是麻隧。范文子的慎戰之議，要在外部勢力與內部君臣關係裡理解。'}]);await ctx.anchor('jb_14');if(firstGood(ctx,'jb_14'))ctx.add('heart',20);ctx.unlock('person:cq_fanwenzi');return 'n_24';},
n_24:async ctx=>{await scene(ctx,'battle','鄢陵・勝後之戒','前575年・晉勝楚',['fanwenzi','jinli','shiguan']);await ctx.say([{text:'鄢陵晉勝楚，楚軍夜退。范文子在晉國勝後仍告晉侯。'},{who:'fanwenzi',expr:'serious',text:'君其戒之。'},{text:'文中君幼、諸臣不佞的提醒，把勝報再接到君臣之德。勝利不是一張內政永安的保證書。'}]);const v=await choice(ctx,'warning',{title:'接到勝報，怎樣讀范文子的戒語？',text:'此題評勝後反省，不以節拍快慢判德。',options:[{label:'保留戰果，也檢視君臣驕侈、內爭與政務責任；外勝不等於內安。',value:'review'},{label:'把反省一概當膽怯，既然贏了就不必再受諫或檢討。',value:'boast'}]});ctx.add('heart',v==='review'?20:0);return 'n_25';},
n_25:async ctx=>{await scene(ctx,'academy','晉・回看三種力量','你・呂相',['lvxiang','xike','shiguan']);await ctx.say([{who:'shiguan',expr:'serious',text:'旗鼓把各隊接成共同進退；辭令把多代恩怨接成說服的線；對讀則把被略去的前情與告知層次補回來。三項操作各有作用，不能互相代替。'},{text:'此處是回看板面中的人物意象，不是郤克與呂相在前575年共同主持軍議的史實。'},{who:'lvxiang',expr:'serious',text:'話可以使人親近，也可以使人離去。寫得強而有力，仍要問自己究竟說到哪一層。'}]);return 'n_26';},
n_26:async ctx=>{await scene(ctx,'academy','晉・你的史官筆記','原文與首次操作',['lvxiang','shiguan']);const v=await choice(ctx,'reflection',{title:'你準備從哪條線索寫反思？',text:'此選擇不計分。結算請結合一句原文與一次首次操作。',options:[{label:'師之耳目在旗鼓，怎樣把個人受傷與全軍交接連起來？',value:'drum'},{label:'對讀圍鄭、殽或令狐，〈絕秦〉選了什麼、略了什麼？',value:'audit'},{label:'唯好是求與不能退兵如何共存？外勝又為何不能保證內安？',value:'draft'}]});await ctx.say([{who:'shiguan',expr:'serious',text:v==='drum'?'引用解張一句話，對照一次送旗、擊鼓或交接，說明協同責任不只在主帥。':v==='audit'?'引用一段絕秦原句，再對照另一段敘事，保留事件、歸責、轉述的界限。':'引用一段退兵條件或范文子之戒，對照稱謂校讀與一次勝後選擇，說明力量與責任的差別。'}]);return 'n_27';},

function payload(s,ending){const a=s.vars.drum.firstScore,b=s.vars.audit.firstScore,c=s.vars.draft.firstScore,v=(Number(s.vars.choices.cooperate==='share')+Number(s.vars.choices.limits==='bound')+Number(s.vars.choices.evidence==='qualified')+Number(s.vars.choices.warning==='review')+Number(firstGood(game.ctx,'jb_14')))*20;return{scenarioId:SID,chapterVersion:VERSION,runId:s.vars.runId,mode:MODE,faction:'晉',country:'晉',role:'呂相',roleKind:'liezhuan',bioTitle:'呂相列傳',bioOpening:'呂相者，晉之大夫也，奉君命而絕秦。',ending,scoreStrategy:Math.round(a*3+b*4+c*3),scoreVirtue:v,turns:s.steps,durationSec:Math.min(5400,Math.round((Date.now()-s.startedAt)/1000)),deeds:['前589年暫扮郤克，看齊頃公輕敵與同車協力；親做六次送旗、擊鼓、軍報及交接整隊，首次'+a+'分。','鞍戰聯軍勝齊，逢丑父代君得免刑；國佐論土宜、魯衛勸限，最後袁婁議和。','前578年四月改扮呂相，奉晉厲公命向秦桓公絕秦，先承秦晉舊好、再述數代恩怨。','親讀六份對照、送六輪證據與判定會勘、親核證據界限及下令，首次'+b+'分。','對讀圍鄭、殽、令狐立君前情；把核心事件、歸責與楚告晉的誓詞轉述分開。','親組六段竹簡、校讀六次國君稱謂、核結尾與君命後親送文書，首次'+c+'分。','前578年五月麻隧秦敗；不以後來勝報倒填四月文書或逐字保證一切轉述。','前575年鄢陵晉勝，仍讀范文子外寧內憂、君其戒之，反思霸業與內政責任。'],anchors:copy(s.anchors),games:copy(s.games),codex:s.codex.slice(),opener:'遊戲史官評語（自擬）：郤克受傷而鼓不絕，解張並轡援枹，鄭丘緩推車，師從旗鼓而進退。軍之協同，不獨一人之勇。齊敗，逢丑父代君任患而得赦；國佐以君母、土宜反苛求，魯衛又勸限，遂有袁婁之和。晉之強，仍須問其用強之界。十一年後，呂相奉厲公命絕秦，始言獻穆舊好，繼陳圍鄭、殽、康靈與桓公之事，借狄楚告知，又以退兵條件結之。辭令有事可對，亦有取捨與歸責；轉述不宜壓為已核原件，未知亦不可徑判虛構。麻隧既勝，鄢陵又捷，而范文子仍以外寧內憂戒之。此局記親送旗鼓、親作會勘、親編君命，以首次操作辨其因果。言能聚眾，兵能取勝；欲守霸業，尚須受諫、顧民、察其證據而不誇其所知。',prompts:['引用解張或鞍戰原文，結合一次首次送旗、擊鼓、交接，說明旗鼓為什麼是全軍耳目；保留御者、車右和聯軍的責任，不只寫主帥勇敢。','選〈絕秦〉中圍鄭、殽或令狐一句，與另一段敘事對讀，再結合一次首次會勘，說明核心事件、選取歸責、轉述的差別；有立場為何不等於全假？','引用〈絕秦〉結尾或范文子之戒，對照一次首次稱謂校讀與勝後選擇，說明禮貌求好與軍事實力、外部勝報與內政責任如何並存。'],experience:{firstAnchors:copy(s.vars.firstAnchors),drum:copy(s.vars.drum),audit:copy(s.vars.audit),draft:copy(s.vars.draft),decisions:copy(s.vars.choices)}};}
