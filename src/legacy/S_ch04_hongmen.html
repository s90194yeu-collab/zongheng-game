<script>
(function () {
  'use strict';
  // Chapter helpers use the platform APIs. They do not replace the router,
  // catalogue, identity, saves, logging, codex or result services.
  const SID = 'S_ch04_hongmen', E = ZH.esc;
  const KEY = 'hongmen-platform-v1:' + (ZH.user.email || 'guest') + ':';
  let run = '', first = {}, progress = {}, latest = null;
  const clone = v => JSON.parse(JSON.stringify(v));
  const read = (k, d) => ZH.local.get(KEY + k, d);
  const write = (k, v) => ZH.local.set(KEY + k, v);
  const freshId = () => 'hm_' + Date.now().toString(36) + '_' + crypto.getRandomValues(new Uint32Array(1))[0].toString(36);
  const status = text => document.querySelectorAll('[data-hm-save]').forEach(el => { el.textContent = text; });
  const current = () => window.__ep && window.__ep.state;
  function meta(state) {
    state.vars = state.vars || {};
    state.vars.hmRunId = run;
    state.vars.hmFirst = clone(first);
    state.vars.hmProgress = clone(progress);
  }
  window.HM = {
    read, write, runId: () => run,
    newRun() { run = freshId(); first = {}; progress = {}; latest = null; write('save', null); },
    useState(state) {
      const v = state && state.vars || {};
      run = v.hmRunId || freshId(); first = clone(v.hmFirst || {}); progress = clone(v.hmProgress || {});
      if (state) {
        // Bring earlier chapter saves into the shared progress layout without
        // erasing the student's initial answers or completed operations.
        state.progress = state.progress || {};
        const ids = {ch04_seats:'seats',ch04_watch:'watch',ch04_wait:'waiting'};
        for (const [gid,variable] of Object.entries(ids)) {
          const p = progress[gid];
          if (p && !state.progress[gid + ':1']) state.progress[gid + ':1'] = clone(p);
          const result = v[variable];
          if (result && result.max === 100) {
            result.score = Math.round(result.score / 10); result.max = 10;
          }
          const recorded = (state.games || []).find(x => x.gameId === gid);
          if (recorded && recorded.maxScore === 100) {
            recorded.score = Math.round(recorded.score / 10); recorded.maxScore = 10;
          }
          if (recorded && !state.progress['arena:' + gid]) {
            const r = Object.assign({completed:true,recognized:gid==='ch04_watch'?3:undefined,arrivalConfirmed:gid==='ch04_wait'?true:undefined},result || {}, {score:recorded.score,max:recorded.maxScore,passed:recorded.passed,sec:recorded.sec||0});
            const attempt = {r:clone(r),mine:{score:r.score,sec:r.sec},stars:r.score>=8?3:r.score>=6?2:r.score>=3?1:0,first:clone(r)};
            state.progress['arena:' + gid] = {tries:1,active:false,best:attempt,last:attempt,first:clone(r)};
          } else if (p && !state.progress['arena:' + gid]) {
            state.progress['arena:' + gid] = {tries:1,active:true,best:null,last:null,first:null};
          }
        }

        meta(state);
      }
    },
    snapshot(snap) { meta(snap); },
    progress(k) { return progress[k] || {}; },
    saveProgress(k, value) { progress[k] = clone(value); },
    cacheProgress(state) { meta(state); latest = {engine:clone(state), updatedAt:Date.now(), chapterVersion:'v1.1.0'}; if(ZH.isGuest()) ZH.save(SID,'history',latest); else write('save',latest); },
    async saveState(state) {
      meta(state);
      const value = { engine: clone(state), updatedAt: Date.now(), chapterVersion: 'v1.1.0' };
      latest = value; write('save', value);
      status(ZH.isGuest() ? '訪客進度已暫存於此分頁' : '正在保存進度');
      try {
        const r = await ZH.save(SID, 'history', value);
        status(r && r.ok ? (ZH.isGuest() ? '訪客進度已暫存於此分頁' : '進度已保存') : '已存此裝置・雲端尚未保存，請匯出備份');
        return r;
      } catch (e) { status('已存此裝置・雲端暫時未連線，請匯出備份'); return { ok: false }; }
    },
    async loadState() {
      const local = read('save', null);
      try {
        const r = await ZH.load(SID, 'history');
        const cloud = r && r.ok && r.state && r.state.engine ? r.state : null;
        // Guest progress follows Core_js's per-tab lifetime. School backups
        // cover failed RPCs and are scoped to the authenticated account.
        const value = ZH.isGuest() ? cloud : local && (!cloud || Number(local.updatedAt) > Number(cloud.updatedAt || 0)) ? local : cloud;
        latest = value;
        if (value) write('save', value);
        return value;
      } catch (e) { latest = ZH.isGuest() ? null : local; return latest; }
    },
    checkpoint() {
      const state = current();
      if (state) meta(state);
      // Commit the first answer before any modal continuation or page reload.
      if (window.__ep && window.__ep.save) return window.__ep.save();
      return Promise.resolve();
    },
    download(value, name) {
      const url = URL.createObjectURL(new Blob([JSON.stringify(value, null, 2)], { type: 'application/json;charset=utf-8' }));
      const a = document.createElement('a'); a.href = url; a.download = name;
      document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
    },
    async exportSave() {
      await HM.checkpoint();
      HM.download({ format: 'hongmen-full', version: 1, save: latest, run, progress, first }, '鴻門宴_進度.json');
    },
    async importSave(data) {
      if (JSON.stringify(data.save).length > 45000) throw Error('進度檔過大，請使用本話匯出的檔案。');
      const state = clone(data.save.engine);
      state.vars = state.vars || {};
      state.vars.hmRunId = data.run || state.vars.hmRunId || freshId();
      state.vars.hmFirst = data.first || state.vars.hmFirst || {};
      state.vars.hmProgress = data.progress || state.vars.hmProgress || {};
      HM.useState(state); await HM.saveState(state);
    },
    teacher() { ZH.go('teacher'); },
    async finish(payload) {
      const state = current(), v = state && state.vars || {};
      const required = ['ch04_seats', 'ch04_watch', 'ch04_wait'];
      if (payload.anchors.length !== 14 || payload.codex.length !== 12 || required.some(id => !payload.games.some(g => g.gameId === id)) || !v.seats?.completed || v.watch?.recognized !== 3 || !v.waiting?.arrivalConfirmed) {
        throw Error('本話必要體驗尚未完成，請接續存檔。');
      }
      payload.runId = run; payload.chapterVersion = 'v1.1.0';
      payload.experience = { seats: v.seats, watch: v.watch, waiting: v.waiting, walks: clone(progress) };
      await HM.checkpoint();
      // Core_js logs the scenario and transfers the complete payload to Result.
      return ZH.finishScenario(payload);
    }
  };

  // Read questions through Anchor_js.load/get so edits made by the teacher in
  // AnchorBank remain authoritative. This chapter's overlay adds durable
  // first-answer records while reporting every attempt through Core_js.track.
  HM.runAnchor = a => new Promise(resolve => {
    let rec = first[a.id];
    if (rec && rec.completed) return resolve(clone(rec));
    let reading = false, finished = false, shownAt = performance.now();
    const previous = document.activeElement;
    const order = a.options.slice();

      '<p class="ep-note">本話共 ' + ANCHOR_ORDER.length + ' 個原文對讀。中途離開可接續目前短段落。</p><div class="hm-actions"><button type="button" class="zh-btn" data-import>匯入進度</button><button type="button" class="zh-btn" data-teacher>教師紀錄</button></div><input class="hm-import" type="file" accept="application/json,.json"><p class="hm-savebar" data-hm-save>' + (ZH.isGuest() ? '訪客進度暫存於此分頁' : '使用平台存檔與學習紀錄') + '</p>' +
      '</main></div>';
    ROOT.querySelector('.hm-title-scene').innerHTML = ART.scene('banquet', {tod:'day'}) + '<div class="hm-title-cast">' + ['liubang','zhangliang','xiangyu','fanzeng'].map(id => '<span>' + portrait(id) + '</span>').join('') + '</div>';ROOT.querySelector('[data-teacher]').onclick=HM.teacher;ROOT.querySelector('[data-teacher]').hidden=!ZH.user.isTeacher;ROOT.querySelector('[data-import]').onclick=()=>ROOT.querySelector('.hm-import').click();ROOT.querySelector('.hm-import').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(d.format!=='hongmen-full'||d.version!==1||!d.save?.engine?.node||!/^n_\d{2}$/.test(d.save.engine.node)||!NODES[d.save.engine.node])throw Error('這份檔案不是鴻門宴的有效進度');await HM.importSave(d);startGame(d.save.engine);}catch(err){ZH.toast(err.message,'bad');}};
    ROOT.querySelectorAll('[data-a="home"]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); ZH.go('hub'); }));
    const cont = ROOT.querySelector('[data-a="continue"]');
    if (cont) cont.addEventListener('click', () => { ZH.sfx('click'); startGame(st); });
    ROOT.querySelector('[data-a="new"]').addEventListener('click', () => {
      ZH.sfx('click');
      if (!st) { startGame(null); return; }
      ZH.modal({
        title: '重新開始？', body: '<p>目前的進度會清除，從頭開始。</p>',
        actions: [{ label: '取消', value: false, kind: 'quiet' }, { label: '重新開始', value: true, kind: 'primary' }]
      }).then(ok => { if (ok) ZH.deleteSave(SID, MODE).catch(() => null).then(() => startGame(null)); });
    });
  }

  const loadSave = () => HM.loadState();

  ZH.ready(() => {
    ZH.loading(true, '展開竹簡');
    Promise.all([loadSave(), anchorsReady, ZH.codex.init()]).then(([saved]) => {
      ZH.loading(false);
      // 從首頁「繼續遊戲」帶著模式進來：直接接續
      if (String(params.mode || '') === MODE && saved) { startGame(saved.engine); return; }
      renderTitle(saved);
    }).catch(err => { ZH.loading(false); ROOT.innerHTML = '<main class="ep-title__main"><h1 class="ep-h1">竹簡尚未展開</h1><p>' + esc(err.message || String(err)) + '</p><button type="button" class="zh-btn zh-btn--primary" data-retry>重新載入</button><button type="button" class="zh-btn" data-home>回首頁</button></main>'; ROOT.querySelector('[data-retry]').onclick=()=>location.reload(); ROOT.querySelector('[data-home]').onclick=()=>ZH.go('hub'); });
  });
})();
</script>
<script>ZH.ready(function(){ZH.textplay?.install("S_ch04_hongmen",null);});</script>
</body></html>
