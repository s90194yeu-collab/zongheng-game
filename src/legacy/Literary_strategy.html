<script>
(function(L){
 'use strict';const U=L.U,B=U.button,P=U.cells,opts=(a,b)=> (b||a).map((label,i)=>({...P()[i],label}));
 function wrong(w,s){U.hurt(w,s);}
 L.register('academy',{
 init(w){w.slots=Array(9).fill(-1);w.target=Array.from({length:9},(_,i)=>(Math.floor(i/3)+i%3+w.index)%3);w.session=0;w.teacher=0;w.names=['禮義講席','名實講席','論辯講席'];},
 step(w,k,d){U.select(w,k,d,9,3);},command(w,c){if(c==='primary')w.slots[w.selected]=w.teacher;else if(c==='secondary')w.teacher=(w.teacher+1)%3;else if(c==='skill'){const i=w.session*3,row=w.slots.slice(i,i+3);if(new Set(row).size===3&&row.every((n,j)=>n===w.target[i+j])){w.session++;w.hits++;U.say(w,'這一時段的專長與交流次序都已接好。');if(w.session===3)U.win(w,'三個時段完成，學者都有自己的來與往。');}else wrong(w,'同一人不能同時在兩席，也須回應講席的專長需要。');}},
 options(w){return Array.from({length:9},(_,i)=>({x:200+i%3*300,y:170+Math.floor(i/3)*130,label:'第'+(Math.floor(i/3)+1)+'時段第'+(i%3+1)+'席・需'+w.names[w.target[i]]}));},controls(w){return[B('primary','排入'+w.names[w.teacher]),B('secondary','換一位學者'),B('skill','開講下一時段')];},view(w){return{goal:'照專長排三席，每時段各人只能出席一次',resource:'完成講學 '+w.session+'／3',threat:'正在安排 '+w.names[w.teacher],detail:'講席旁標出需回應的專長，排好一行再開講。祭酒在此是主持職分。',me:w.session/3};}
 });
 L.register('ritual',{
 init(w){w.workers=Array.from({length:3},()=>({energy:5,progress:0,done:0,working:false}));w.rule=false;w.busy=-1;w.total=0;w.queue=[];w.disputes=0;w.limit=90;},
 step(w,k,d){U.select(w,k,d,3,3);w.workers.forEach((p,i)=>{if(w.busy===i){p.energy-=d*.48;p.progress+=d;if(p.progress>=2){p.progress=0;p.done++;w.total++;w.busy=-1;w.hits++;}}else p.energy=Math.min(5,p.energy+d*.6);if(p.energy<=0){w.busy=-1;p.energy=0;wrong(w,'連續爭用會耗盡學徒，先留出休息。');}});if(w.rule&&w.busy<0&&w.queue.length){const i=w.queue.shift();if(w.workers[i].energy>=1)w.busy=i;}if(w.total>=9&&w.workers.every(p=>p.done>=2))U.win(w,'練習與規程接續起來，每個人都完成了工件。');},
 command(w,c){if(c==='secondary'){w.rule=!w.rule;U.say(w,w.rule?'共用規程已立：依次工作，其他人可休息。':'暫停共用規程。');return;}if(c==='primary'){const i=w.selected;if(w.rule){if(!w.queue.includes(i)&&w.busy!==i)w.queue.push(i);}else if(w.busy<0)w.busy=i;else if(w.busy!==i){w.disputes++;wrong(w,'工具正被另一人使用，爭取不會讓工作更快。');}}},
 options(w){return opts(w,w.workers.map((p,i)=>'學徒'+(i+1)+'・餘力'+p.energy.toFixed(1)+'・完成'+p.done));},controls(w){return[B('primary',w.rule?'排進下一輪練習':'現在爭用工具'),B('secondary',w.rule?'暫停輪用規程':'建立輪用與休息規程')];},view(w){return{goal:'完成九件，三人各至少兩件；同時留住下一輪餘力',resource:'工件 '+w.total+'／9',threat:'爭用損耗 '+w.disputes,detail:'工具只有一份；可排多位學徒輪流，完成後仍須親自安排下一輪。',me:w.total/9};}
 });
 function trade(w){for(let n=0;n<4;n++)for(const [a,b]of w.links){const delta=w.stock[a]-w.stock[b];if(delta>1){w.stock[a]--;w.stock[b]++;}else if(delta< -1){w.stock[b]--;w.stock[a]++;}}}
 L.register('reciprocity',{
 init(w){w.stock=[8,0,7,0,6,0];w.links=[];w.from=-1;w.round=0;w.material=7;w.need=[1,1,1,1,1,1];w.total=0;},step(w,k,d){U.select(w,k,d,6,3);},
 command(w,c){if(c==='primary'){if(w.from<0){w.from=w.selected;U.say(w,'再選另一戶，接通雙向互助。');}else{const a=Math.min(w.from,w.selected),b=Math.max(w.from,w.selected);if(a!==b&&!w.links.some(e=>e[0]===a&&e[1]===b)&&w.material>0){w.links.push([a,b]);w.material--;}w.from=-1;}}else if(c==='secondary'){trade(w);w.stock=w.stock.map((n,i)=>n+(i%2===0?1:0));trade(w);if(w.stock.some((n,i)=>n<w.need[i])){wrong(w,'還有住戶收不到必要供給，先改接通路。');return;}w.stock=w.stock.map((n,i)=>n-w.need[i]);w.round++;w.hits++;if(w.round>=3&&Array.from({length:6},(_,i)=>w.links.some(e=>e.includes(i))).every(Boolean))U.win(w,'三輪皆有往來，遠近住戶都得到接應。');}else if(c==='skill'){const last=w.links.pop();if(last)w.material++;}},
 options(w){return Array.from({length:6},(_,i)=>({x:190+i%3*310,y:200+Math.floor(i/3)*230,label:'第'+(i+1)+'戶・存糧'+w.stock[i]}));},controls(){return[B('primary','選起戶／接通另一戶'),B('secondary','運行下一輪互助'),B('skill','拆回最後一段通路')];},view(w){return{goal:'用守恆的糧食接應六戶，維持三輪互助',resource:'築路餘料 '+w.material,threat:'完成 '+w.round+'／3 輪',detail:'一次選兩戶接雙向通路；遠近皆採相同供需原則，不能靠改稱號生出資源。',me:w.round/3};}
 });
 const travelEdges=[[0,1],[1,2],[1,3],[2,4],[3,4],[4,5],[5,0]];
 L.register('itinerary',{
 init(w){w.node=0;w.selected=1;w.fare=14;w.visited=[];w.record=[];w.names=['鄒地出發','子思門人講席','齊國會見','梁國會見','萬章等門人','退而著述'];w.edges=travelEdges;w.limit=150;},step(w,k,d){U.select(w,k,d,6,3);},
 command(w,c){if(c==='primary'){const n=w.selected;if(w.edges.some(([a,b])=>a===w.node&&b===n||a===n&&b===w.node)){if(w.fare<1)return wrong(w,'行資已不足，先保留返程。');w.fare--;w.node=n;if(!w.visited.includes(n))w.visited.push(n);U.say(w,n===2||n===3?'主張未充分採納。可留下回應，不能強令接受。':'抵達'+w.names[n]);}else U.say(w,'兩處之間沒有直接通路。');}else if(c==='secondary'){if(!w.record.includes(w.node))w.record.push(w.node);if(w.node===5&&[1,2,3,4].every(n=>w.record.includes(n)))U.win(w,'學習、遊說與門人記錄已帶回著述。');else U.say(w,'已記下此行所見，著述仍須師承、齊梁回應與門人紀錄。');}else if(c==='skill'){w.fare=Math.max(0,w.fare-2);U.say(w,'反覆強說不能改寫史家的記述，還須留出返程。');}},
 options(w){return Array.from({length:6},(_,i)=>({x:180+i%3*315,y:190+Math.floor(i/3)*230,label:w.names[i]}));},controls(){return[B('primary','沿路行訪所選地點'),B('secondary','留下記錄／整理著述'),B('skill','堅持要求採納（耗行資）')];},view(w){return{goal:'行訪師承、齊梁與門人，返著述處整理',resource:'行資 '+w.fare,threat:'已留 '+w.record.length+' 處記錄',detail:'所在：'+w.names[w.node]+'；線段才是可走道路。不能用接受與否評定人物的價值。',me:[1,2,3,4].filter(n=>w.record.includes(n)).length/5};}
 });
 L.register('commons',{
 init(w){w.pot=24;w.grants=[0,0,0];w.needs=[3,4,3];w.round=0;w.seedGrain=2;},step(w,k,d){U.select(w,k,d,3,3);},
 command(w,c){const i=w.selected;if(c==='primary'&&w.pot>0){w.grants[i]++;w.pot--;}else if(c==='secondary'&&w.grants[i]>0){w.grants[i]--;w.pot++;}else if(c==='skill'){if(w.grants.every((n,i)=>n>=w.needs[i])&&w.pot>=w.seedGrain){w.round++;w.pot+=8;w.grants=[0,0,0];goodRound(w);if(w.round===2)U.win(w,'各方有所得，下一輪也留有共同底線。');}else wrong(w,'有人尚未得到基本所需，或種糧已被分盡。');}},
 options(w){return Array.from({length:3},(_,i)=>({x:200+i*300,y:290,label:['國君與官府','農戶與家人','軍旅與役作'][i]+'・需'+w.needs[i]+'／已分'+w.grants[i]}));},controls(){return[B('primary','分一份糧給此方'),B('secondary','從此方退回一份'),B('skill','進入下一輪')];},view(w){return{goal:'三方皆有基本所需，另保兩份種糧，連續兩輪',resource:'共有餘糧 '+w.pot,threat:'已維持 '+w.round+'／2 輪',detail:'可改分配再進入下一輪；本局是有限資源推演，不以取用量評人品德。',me:w.round/2};}
 });function goodRound(w){w.hits++;U.say(w,'本輪條件成立，下一輪仍須親自分配。');}
 L.register('care',{
 init(w){w.names=['家門','近巷長者','遠巷幼者','橋邊長者','山口幼者','接力講席'];w.nodes=Array.from({length:6},(_,i)=>({x:180+i%3*310,y:190+Math.floor(i/3)*230}));w.helpers=[{node:0,to:-1,left:0},{node:5,to:-1,left:0}];w.edges=[[0,1],[1,2],[0,3],[3,4],[4,5],[2,5],[1,4]];w.done=[];w.agent=0;w.deadline=[99,35,48,42,55,99];w.limit=65;},
 step(w,k,d){U.select(w,k,d,6,3);w.helpers.forEach(a=>{if(a.to>=0){a.left-=d;if(a.left<=0){a.node=a.to;a.to=-1;if(!w.done.includes(a.node)&&[1,2,3,4].includes(a.node)){w.done.push(a.node);w.hits++;}}}});if([1,2,3,4].some(n=>!w.done.includes(n)&&w.time>w.deadline[n]*(w.assist?1.5:1)))w.hp=0;if(w.done.length===4)U.win(w,'從近處到遠巷的照護都有實際接力。');},
 command(w,c){if(c==='secondary'){w.agent=1-w.agent;return;}if(c==='primary'){const a=w.helpers[w.agent],n=w.selected;if(a.to>=0)return U.say(w,'接力者尚在途中，先安排另一位。');if(w.edges.some(e=>e.includes(a.node)&&e.includes(n))&&n!==a.node){a.to=n;a.left=4+Math.abs(a.node-n)*.6;}else U.say(w,'請依相連的巷路安排下一程。');}},
 options(w){return w.nodes.map((p,i)=>({...p,label:w.names[i]+(w.done.includes(i)?'・已接應':'')}));},controls(w){return[B('primary','派接力者'+(w.agent+1)+'到此鄰點'),B('secondary','切換接力者')];},view(w){return{goal:'兩位接力者沿路接應四戶，別遺下遠巷',resource:'已接應 '+w.done.length+'／4',threat:'目前安排接力者'+(w.agent+1),detail:'每人一次走一段路，途中可安排另一位；右下是另一個接力起點。',me:w.done.length/4};}
 });
 const md=(a,b)=>Math.abs(a%4-b%4)+Math.abs(Math.floor(a/4)-Math.floor(b/4));
 L.register('regency',{
 init(w){w.units=[0,1,2];w.role=0;w.names=['諫議接納','宮府稽核','軍務承接'];w.tasks=w.index===1?[[3,11],[4,5],[0,8]]:w.index===2?[[1,9],[6,7],[0,8]]:[[0,8],[5,6],[3,11]];w.ready=0;w.cover=[false,false,false];},
 step(w,k,d){U.select(w,k,d,12);w.cover=w.tasks.map((ns,i)=>i===1?ns.every(n=>md(n,w.units[i])<=1):ns.every(n=>n%4===w.units[i]%4));const yes=w.cover.every(Boolean)&&new Set(w.units).size===3;w.ready=yes?w.ready+d:0;if(w.ready>2)U.win(w,'諫路、同法稽核與軍務職分皆有承接。');},
 command(w,c){if(c==='secondary')w.role=(w.role+1)%3;else if(c==='primary'){if(w.units.some((p,i)=>i!==w.role&&p===w.selected))return U.say(w,'同一位置無法同時承擔兩個職分。');w.units[w.role]=w.selected;}},
 options(w){return opts(Array.from({length:12},(_,i)=>'官署第'+(i+1)+'處'));},controls(w){return[B('primary','布署'+w.names[w.role]+'於此'),B('secondary','切換要調度的職分')];},view(w){return{goal:'依位置接起諫路、內外同法與軍務三項託付',resource:w.cover.map((x,i)=>w.names[i]+(x?'✓':'待接')).join('／'),threat:'正在調度：'+w.names[w.role],detail:'諫議與軍務縱向承接各自兩點；稽核官須鄰接兩處案件。三職不得重疊。',me:w.cover.filter(Boolean).length/3};}
 });
 L.register('harbor',{
 init(w){w.silt=.6+w.index*.3;w.cash=7;w.ships=Array.from({length:4},(_,i)=>({load:2+i%3,draft:2.1+i*.15,status:'dock',eta:0,ground:false}));w.done=0;w.tide=0;w.route=0;w.limit=180;},
 step(w,k,d){U.select(w,k,d,4);w.tide=3.8+Math.sin(w.time*.13)*1.3-w.silt;w.ships.forEach(s=>{if(s.status==='sailing'){s.eta-=d;if(w.tide<s.draft-.3&&!s.ground){s.ground=true;wrong(w,'吃水超過當時水深，船已擱淺。');s.status='dock';}else if(s.eta<=0){s.status='done';w.done++;w.hits++;w.cash+=Math.max(0,s.load-1-w.index);}}});if(w.done===4)U.win(w,'四艘船的航次與成本已記入潮汐簿。');},
 command(w,c){const s=w.ships[w.selected];if(c==='skill'&&w.cash>=2){w.cash-=2;w.silt=Math.max(0,w.silt-.4);U.say(w,'水道局部疏開，制度與運輸轉向的成本仍在。');}else if(c==='primary'&&s.status==='dock'){s.load=s.load===4?1:s.load+1;s.draft=1.7+s.load*.25+w.selected*.1;}else if(c==='secondary'&&s.status==='dock'){if(w.tide>=s.draft+.25){s.status='sailing';s.eta=5;s.ground=false;}else U.say(w,'潮高尚不足，請候潮或減載，不要硬出。');}},
 options(w){return opts(w.ships.map((s,i)=>'第'+(i+1)+'船・載'+s.load+'／吃水'+s.draft.toFixed(1)+'・'+({dock:'待潮',sailing:'航行',done:'已記航次'})[s.status]));},controls(){return[B('primary','重排此船載貨量'),B('secondary','依潮高放行此船'),B('skill','用兩份資源局部疏水')];},view(w){return{goal:'依潮汐與吃水安排四船，不讓貨船擱淺',resource:'水深 '+w.tide.toFixed(1)+'／調度資源 '+w.cash,threat:'安全航次 '+w.done+'／4',detail:'曲線是潮高；吃水低於水深才可通。後幕淤積與制度成本加重，不能靠一招還原昔盛。',me:w.done/4};}
 });
 L.register('granary',{
 init(w){w.food=18;w.budget=8;w.villages=[{need:4,food:0,labor:1,school:false},{need:6,food:0,labor:1,school:false},{need:5,food:0,labor:1,school:false}];},step(w,k,d){U.select(w,k,d,3,3);if(w.villages.every(v=>v.food>=v.need&&v.labor===0)&&w.villages.filter(v=>v.school).length>=2)U.win(w,'倉糧、輕役與學舍都留下實際安排。');},
 command(w,c){const v=w.villages[w.selected];if(c==='primary'&&w.food>0){w.food--;v.food++;}else if(c==='secondary'&&v.labor&&w.budget>=2){w.budget-=2;v.labor=0;}else if(c==='skill'&&w.budget>=1&&v.food>=v.need&&!v.school){w.budget--;v.school=true;}else U.say(w,'先看糧與役的條件，不能把責任推回年成。');},
 options(w){return Array.from({length:3},(_,i)=>({x:200+i*300,y:300,label:'第'+(i+1)+'鄉・糧需'+w.villages[i].need+'／已給'+w.villages[i].food}));},controls(){return[B('primary','給此鄉一份倉糧'),B('secondary','花兩份資源減去重役'),B('skill','糧足後設學舍（一份）')];},view(w){return{goal:'三鄉糧足、長者免重役，另有兩處學舍',resource:'餘糧 '+w.food+'／調度資源 '+w.budget,threat:'尚負重役 '+w.villages.filter(v=>v.labor).length+' 鄉',detail:'每份資源只用一次；不能用「年成不好」代替眼前的治理。',me:(w.villages.filter(v=>v.food>=v.need&&!v.labor).length+w.villages.filter(v=>v.school).length)/5};}
 });
 L.register('seasons',{
 init(w){w.season=0;w.cycle=0;w.res=[4,5,5];w.harvest=[0,0,0];w.selected=0;w.names=['農田','魚池','山林'];w.actions=0;w.limit=150;},step(w,k,d){U.select(w,k,d,3,3);},
 command(w,c){const i=w.selected;if(c==='primary'){const allowed=(i===0?w.season===2:i===1?w.season===1:w.season===3);if(!allowed)return wrong(w,'時令未到，這次採取傷到下一季的生長。');if(w.res[i]<=2)return wrong(w,'幼魚、種糧或幼木不可全部取盡。');w.res[i]--;w.harvest[i]++;}else if(c==='secondary'){w.season=(w.season+1)%4;if(w.season===0){w.cycle++;w.res=w.res.map(n=>n+2);}U.say(w,['春耕：先養生長','夏：可取成魚，仍留幼魚','秋：農田可收，仍保種糧','冬：山林可伐，仍留幼木'][w.season]);}else if(c==='skill')wrong(w,'細網盡取會斷掉後續供給。');if(w.harvest.every(n=>n>=2)&&w.res.every(n=>n>=2))U.win(w,'本季有所得，下一季也仍可生長。');},
 options(w){return opts(w,w.names.map((s,i)=>s+'・留養'+w.res[i]+'／已收'+w.harvest[i]));},controls(){return[B('primary','按時收取一份成資源'),B('secondary','留養並候下一季'),B('skill','試用細網盡取（會傷生長）')];},view(w){return{goal:'田、魚、木各收兩份，仍保留下季生長',resource:['春','夏','秋','冬'][w.season]+'季',threat:'已收 '+w.harvest.join('／'),detail:'農時、網目與伐木時令皆有差別；看到成熟再採，不能以一時總量替代可持續。',me:w.harvest.filter(n=>n>=2).length/3};}
 });
 L.register('fourGates',{
 init(w){w.open=[true,true,true,true];w.packets=Array.from({length:16},(_,i)=>({lane:i%4,good:i%4!==Math.floor(i/4)%4,x:940,at:2+i*1.4,done:false}));w.accepted=0;w.wrong=0;w.missed=0;w.limit=40;},
 step(w,k,d){U.select(w,k,d,4,1);w.packets.forEach(p=>{if(p.done||w.time<p.at)return;p.x-=d*(w.assist?145:195);if(p.x<=185){p.done=true;if(w.open[p.lane]){if(p.good){w.accepted++;w.hits++;}else{w.wrong++;U.say(w,'無根據的干擾已進門，仍可調整自己的回應。');}}else if(p.good)w.missed++;}});if(w.wrong>(w.assist?3:1)||w.missed>3)w.hp=0;if(w.packets.every(p=>p.done)){if(w.accepted>=9&&w.wrong<=(w.assist?3:1))U.win(w,'必要的對話能進出，干擾也由自己辨明。');else w.hp=0;}},
 command(w,c){if(c==='primary')w.open[w.selected]=!w.open[w.selected];else if(c==='secondary')U.say(w,'藍色是有根據的邀請；赭色是未經核實的干擾。開關的是自己的門。');},
 options(w){return ['視','聽','言','動'].map((s,i)=>({x:180,y:160+i*100,label:s+'門・'+(w.open[i]?'開':'閉')}));},controls(w){return[B('primary',(w.open[w.selected]?'暫閉':'打開')+['視','聽','言','動'][w.selected]+'門'),B('secondary','查看這一門的判準')];},view(w){return{goal:'接到至少九則有根據訊息，同時辨明干擾',resource:'有效訊息 '+w.accepted+'／9',threat:'干擾 '+w.wrong+'；漏接 '+w.missed,detail:'各門都會交替出現必要訊息與干擾；全部封閉同樣無法完成對話。',me:w.accepted/9,other:w.wrong/2};}
 });
 L.register('backstage',{
 init(w){w.cues=Array.from({length:12},(_,i)=>({station:(i*3+w.index)%4,at:3+i*1.8+(i>5&&w.index===2?1:0),done:false}));w.hits=0;w.missed=0;w.assistants=2;w.grace=0;w.swap=0;w.selected=0;w.limit=32;w.audience=100-w.index*29;},
 step(w,k,d){const old=w.selected;U.select(w,k,d,4,4);if(old!==w.selected)w.swap=.2;w.swap=Math.max(0,w.swap-d);w.grace=Math.max(0,w.grace-d);w.cues.forEach(c=>{if(!c.done&&w.time>c.at+(w.assist?.9:.55)+(w.grace>0?.4:0)){c.done=true;w.missed++;}});if(w.missed>3)w.hp=0;if(w.cues.every(c=>c.done)){if(w.hits>=9)U.win(w,'演出提示已接好，戲外的限制仍如實留在記錄。');else w.hp=0;}},
 command(w,c){if(c==='secondary'&&w.assistants>0){w.assistants--;w.grace=3;U.say(w,'暫借一位人手接應，寬限只維持這一小段。');}else if(c==='primary'){const cue=w.cues.find(c=>!c.done&&c.station===w.selected&&Math.abs(w.time-c.at)<(w.assist?.9:.55)+(w.grace>0?.4:0));if(cue&&w.swap<=0){cue.done=true;w.hits++;U.say(w,'燈、幕或道具準時到位。');}else{w.mistakes++;U.say(w,'提示還未到或位置未對，先看下一項。');}}},
 options(w){return ['燈光','開合幕','道具','人員接應'].map((s,i)=>({x:170+i*220,y:300,label:s}));},controls(){return[B('primary','發出此處舞臺提示'),B('secondary','借一位人手短暫接應')];},view(w){const c=w.cues.find(c=>!c.done);return{goal:'接好十二項提示中的至少九項，不以票房判定努力',resource:'準時 '+w.hits+'／12；接應人手 '+w.assistants,threat:'漏接 '+w.missed+'／4',detail:c?'下一項：'+['燈光','開合幕','道具','人員接應'][c.station]+'，第'+c.at.toFixed(1)+'秒；本幕時代觀眾條件 '+w.audience:'演出將落幕',me:w.hits/12,other:w.missed/4};}
 });
 L.register('tavern',{
 init(w){w.orders=Array.from({length:4},(_,i)=>({name:i===0?'長衫站客':i===3&&w.index===2?'空著的站位':'櫃前客'+i,target:1+i%2*.5,paid:i===0?9:4,served:false,volume:0,coins:0,absent:i===3&&w.index===2}));w.spilled=0;w.limit=95;},
 step(w,k,d){U.select(w,k,d,4);const o=w.orders[w.selected];if(k.action&&!o.served&&!o.absent){o.volume+=d*(w.assist?.6:.85);if(o.volume>o.target+.35){o.volume=0;w.spilled++;wrong(w,'酒已溢出，先停手再重新斟。');}}if(w.orders.every(o=>o.served))U.win(w,'酒與帳都有依據，空位也沒有被未證消息填滿。');},
 command(w,c){const o=w.orders[w.selected];if(o.served)return;if(c==='primary')U.say(w,'按住斟酒，放開即停；用銅錢記錄實收。');else if(c==='skill'&&!o.absent)o.coins=(o.coins+1)%11;else if(c==='secondary'){if(o.absent){o.served=true;U.say(w,'只記「未見」，不把傳聞當目擊。');}else if(Math.abs(o.volume-o.target)<(w.assist?.25:.17)&&o.coins===o.paid){o.served=true;w.hits++;U.say(w,'已送達並準確記下實收。');}else U.say(w,'先核對杯量與實收，不以客人身分改帳。');}},
 options(w){return opts(w,w.orders.map(o=>o.name+'・需'+o.target+'杯／實付'+(o.absent?'未至':o.paid)+'文'));},controls(){return[B('primary','按住斟酒'),B('skill','帳簿實收加一文（超過十文歸零）'),B('secondary','送酒記帳／記下未見')];},view(w){const o=w.orders[w.selected];return{goal:'接好四處站位的酒與帳；不靠嘲弄角色取勝',resource:'杯量 '+o.volume.toFixed(2)+'／'+o.target+'；記帳 '+o.coins+'文',threat:'完成 '+w.orders.filter(o=>o.served).length+'／4',detail:'長衫站客仍須準確接待；結尾空位只保存可以確知的事實。',me:w.orders.filter(o=>o.served).length/4};}
 });
})(window.ZH.literary);
