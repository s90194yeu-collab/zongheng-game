<!-- 三篇場景任務 v1.2.0：共用舞台、互動與存檔；不寫入正式題目或競技成績。 -->
<script>
(function(w){
 'use strict';const ZH=w.ZH=w.ZH||{},defs={entries:{...(w.ZH_SPRING?.entries||{}),...(w.ZH_WARRING?.entries||{}),...(w.ZH_CHUHAN?.entries||{})}};if(!w.SpringWorldModels||ZH.spring)return;
 const bindings=new Map(),names={route:'探路護送',formation:'隊伍部署',network:'水路建設',evidence:'線索查證',diplomacy:'資源交涉',music:'五聲合奏',hydraulic:'水閘調度',policy:'施政分配',convoy:'護送補給',crossing:'渡河裝載',council:'宴席交涉'},noteNames=['宮','商','角','徵','羽'];
 const volume=c=>c.volume||(c.id.startsWith('S_ch')?'楚漢篇':c.id.startsWith('S_zg')?'戰國篇':'春秋篇');
 const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let active=null,observer=null,launcher=null,latest=null,audio=null;
 function config(id,variant){const d=defs.entries[id];if(!d)return null;const v=d.variants?.[variant];if(!v)return d;const rounds=v.kind==='formation'?['察看營外來路','安置接應隊伍','維持撤行後援']:['查驗營外來信','核對獨立帳冊','複核交接日期'];return{...d,...v,rounds:rounds.map(title=>({title,text:v.kind==='formation'?'先察看，再安排前隊、支援與輜重。':'調查資料的來源與日期，選出兩份獨立佐證。'}))};}
 function figure(c,name,expr='normal'){const p={id:'spring_'+(name||c.actor),name:name||c.actor,art:{state:c.state,role:/前隊|支援/.test(name||'')?'soldier':'scholar'}};return'<div class="sw__figure">'+(w.ART?.portrait?w.ART.portrait(p,{expr}):'<div class="sw__seal" aria-hidden="true">'+esc((name||c.actor).slice(0,1))+'</div>')+'<div class="sw__figure-name">'+esc(name||c.actor)+'</div></div>';}
 function image(c,fn){if(!ZH.assets?.get)return;Promise.resolve(ZH.assets.get(c.asset)).then(v=>{const url=typeof v==='string'?v:v?.url;if(url)fn(url);}).catch(()=>{});}
 function tone(n,delay=0){if(ZH.settings?.sound===false||Number(ZH.settings?.volume)===0)return;try{const AC=w.AudioContext||w.webkitAudioContext;if(!AC)return;audio=audio||new AC();audio.resume().catch(()=>{});const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+delay;o.type='sine';o.frequency.value=[261.63,293.66,329.63,392,440][n];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.11*(ZH.settings?.volume??.7),t+.015);g.gain.exponentialRampToValueAtTime(.001,t+.7);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.75);}catch(e){}}
 function bind(id,state,save,root,meta={}){
  if(state?._textplayV===3){bindings.delete(id);if(latest?.id===id)latest=null;if(launcher)launcher.hidden=true;return;}
  const c=config(id,meta.player||meta.faction);if(!c||!state)return;const key=meta.player||meta.faction||'main',b={id,key,c,state,save,root,pending:null};bindings.set(id,b);latest=b;
  const seenVersion=Object.prototype.hasOwnProperty.call(state,'_springWorld');state._springWorld=state._springWorld||{};
  const previous=Array.isArray(state.anchors)&&state.anchors.length||Array.isArray(state.games)&&state.games.length||Object.keys(state.progress||{}).some(k=>k.startsWith('arena:')&&state.progress[k]?.active);
  if(!seenVersion&&previous&&!state._springWorld[key])state._springWorld[key]={legacy:true};
  document.body.classList.add('spring-page');installObserver();ensureLauncher();decorate();
 }
 function gridLines(indices,width){const rows=width===4?3:3,edges=[];indices.forEach(a=>indices.forEach(b=>{if(a<b&&w.SpringWorldModels.adjacent(a,b,width))edges.push([a,b]);}));const pt=n=>[(n%width+.5)*100/width,(Math.floor(n/width)+.5)*100/rows];return '<svg class="sw__map-lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">'+edges.map(([a,b])=>{const x=pt(a),y=pt(b);return '<line x1="'+x[0]+'" y1="'+x[1]+'" x2="'+y[0]+'" y2="'+y[1]+'"/>';}).join('')+'</svg>'; }
 function store(b,m,extra={}){b.state._springWorld=b.state._springWorld||{};b.state._springWorld[b.key]={...m.snapshot(),...extra};try{return Promise.resolve(b.save?.()).catch(()=>({ok:false}));}catch(e){console.warn('情境存檔等待下一個章節存檔點',e);return Promise.resolve({ok:false});}}
 async function before(id){const b=bindings.get(id);if(b?.state?._textplayV===3)return null;if(!b)return null;const old=b.state._springWorld?.[b.key];if(old?.legacy||old?.deferred||old?.phase==='done')return null;if(b.pending)return b.pending;b.pending=openBinding(b).finally(()=>b.pending=null);return b.pending;}
 function ensureLauncher(){if(launcher)return;launcher=document.createElement('button');launcher.type='button';launcher.className='sw__launcher';launcher.textContent='情境推演';launcher.onclick=()=>{if(latest&&!active&&!document.querySelector('.sty-game,.stl-arena,.zh-modal,.slg-anchor,.za:not([hidden]),.sty-choice:not([hidden]),.slg-choice:not([hidden]),.zh-cutin,.stl'))openBinding(latest);};document.body.append(launcher);}
 function decorate(){if(!latest)return;const b=latest;document.querySelectorAll('.sty-game,.stl-arena').forEach(box=>{if(box.dataset.springArt)return;box.dataset.springArt='1';const banner=document.createElement('div');banner.className='sw__legacy-banner';banner.innerHTML='<b>'+volume(b.c)+' · '+(b.c.ep===0?'序章':'第 '+b.c.ep+' 話')+'</b><span>課文與正式挑戰</span>';const header=box.querySelector('.sty-game__head,.stl-arena__head');if(header)header.after(banner);else box.prepend(banner);image(b.c,url=>{if(box.isConnected)box.style.setProperty('--spring-art','url('+JSON.stringify(url)+')');});});if(launcher)launcher.hidden=!!active||!!document.querySelector('.sty-game,.stl-arena,.zh-modal,.slg-anchor,.za:not([hidden]),.sty-choice:not([hidden]),.slg-choice:not([hidden]),.zh-cutin,.stl')||!latest;}
 function installObserver(){if(observer)return;let queued=false;observer=new MutationObserver(()=>{if(queued)return;queued=true;queueMicrotask(()=>{queued=false;decorate();});});observer.observe(document.body,{childList:true,subtree:true});}
 function openBinding(b){if(active)return active.promise;const prior=b.state._springWorld?.[b.key],saved=prior?.v===1?prior:null;let m;try{m=w.SpringWorldModels.create(b.c,saved,b.state.rng||b.state.seed||Date.now());}catch(e){ZH.toast?.('情境存檔無法讀取；原章節仍可繼續。');return Promise.resolve(null);}return present(b.c,m,(extra)=>store(b,m,extra));}
 function present(c,m,persist){
  let resolve;const promise=new Promise(r=>resolve=r),root=document.createElement('section');root.className='sw';root.setAttribute('role','dialog');root.setAttribute('aria-modal','true');root.setAttribute('aria-label',c.title);root.tabIndex=-1;
  root.innerHTML='<div class="sw__backdrop" aria-hidden="true"></div><header class="sw__header"><div><span class="sw__eyebrow">'+volume(c)+' · '+(c.ep===0?'序章':'第 '+c.ep+' 話')+' / '+esc(names[c.kind])+'</span><h1>'+esc(c.title)+'</h1></div><button class="sw__exit" data-a="defer">儲存，稍後再玩</button></header><div class="sw__layout"><div class="sw__scene"><div class="sw__chapter">情境推演</div><h2 class="sw__scene-title"></h2><div class="sw__board-area"></div><p class="sw__caption"></p></div><aside class="sw__aside"><div class="sw__resources"></div><div class="sw__paper"></div><p class="sw__status" role="status" aria-live="polite"></p></aside></div>';
  const focusBefore=document.activeElement,hidden=[];for(const el of [...document.body.children]){if(el===root||['SCRIPT','STYLE','LINK'].includes(el.tagName))continue;hidden.push([el,el.inert]);el.inert=true;}document.body.append(root);const bodyOverflow=document.body.style.overflow;document.body.style.overflow='hidden';active={c,m,root,promise};if(launcher)launcher.hidden=true;
  image(c,url=>{if(root.isConnected)root.querySelector('.sw__backdrop').style.backgroundImage='url('+JSON.stringify(url)+')';});
  const q=s=>root.querySelector(s),btn=(a,text,primary=false,disabled=false,extra='')=>'<button type="button" class="sw__button'+(primary?' sw__button--primary':'')+'" data-a="'+a+'"'+(disabled?' disabled':'')+extra+'>'+text+'</button>';
  let closing=false;async function close(deferred){if(closing)return;closing=true;root.querySelectorAll('button').forEach(x=>x.disabled=true);try{const r=await persist?.(deferred?{deferred:true}:{});if(r?.ok===false)ZH.toast?.('連線儲存尚未完成，請在原章節稍後再存一次。');}catch(e){ZH.toast?.('連線儲存尚未完成，請在原章節稍後再存一次。');}root.remove();hidden.forEach(([el,v])=>el.inert=v);document.body.style.overflow=bodyOverflow;active=null;decorate();if(focusBefore?.isConnected)focusBefore.focus({preventScroll:true});resolve(m.result());}
  function status(text){const el=q('.sw__status');el.textContent=text;el.classList.remove('is-flash');void el.offsetWidth;el.classList.add('is-flash');}
  function progress(){return'<div class="sw__progress" aria-label="第 '+Math.min(3,m.s.turn+1)+' 段，共三段">'+[0,1,2].map(i=>'<i class="'+(i<m.s.turn?'is-done':i===m.s.turn?'is-current':'')+'"></i>').join('')+'</div>';}
  function layout(){const s=m.s,l=s.local,r=m.round(),board=q('.sw__board-area'),paper=q('.sw__paper');q('.sw__resources').innerHTML=[['補給',s.supply],['信任',s.trust],['凝聚',s.cohesion]].map(([name,value])=>'<div class="sw__resource"><span>'+name+'</span><b>'+Number(value.toFixed(1))+'</b><meter min="0" max="12" value="'+value+'" aria-label="'+name+'"></meter></div>').join('');q('.sw__scene-title').textContent=s.phase==='done'?'三段推演，留下你的安排':r.title;q('.sw__caption').textContent='教學情境｜'+c.intro;
   if(s.phase==='brief'){board.innerHTML='<div class="sw__cast">'+figure(c)+'</div>';paper.innerHTML=progress()+'<h2>先在場景中試一試</h2><p class="sw__text">'+esc(c.intro)+'</p><p class="sw__small">三段短任務，資源會延續。途中可儲存離開，之後從「情境推演」接續。這裡的推演結果不計入原文題與正式首次成績。</p><div class="sw__legend"><span>'+esc(names[c.kind])+'</span><span>不比手速</span><span>可中途接續</span></div><div class="sw__controls">'+btn('begin','進入場景',true)+'</div>';return;}
   if(s.phase==='report'||s.phase==='done'){const last=s.reports.at(-1);board.innerHTML='<div class="sw__cast">'+figure(c,c.actor,last?.quality>=7?'happy':'serious')+'</div>';paper.innerHTML=progress()+'<h2>'+(s.phase==='done'?'推演完成':'這次安排的影響')+'</h2><p class="sw__text">'+esc(s.phase==='done'?'補給、信任與凝聚，會隨你的安排改變。接著回到原劇本，看看人物實際面對的情勢。':last?.text)+'</p>'+(s.phase==='done'?'<div class="sw__report-list">'+s.reports.map((r,i)=>'<div class="sw__report-item"><b>0'+(i+1)+'</b><span>'+esc(r.title)+'<br>'+esc(r.text)+'</span></div>').join('')+'</div>':'<p class="sw__small">目前的資源會帶入下一段。可比較不同安排，這些數值屬於教學推演。</p>')+'<div class="sw__controls">'+btn(s.phase==='done'?'finish':'next',s.phase==='done'?'回到劇本':s.turn===2?'查看回顧':'進入下一段',true)+'</div>';return;}
   let controls='',help='',title=r.title;
   if(s.kind==='route'){help='從隊伍所在處，點選相鄰的一格移動。先到「察看」能取得一次避險線索；石障不可通行。方向鍵也能移動。';const labels=Array.from({length:9},(_,i)=>i===l.blocked?['障','石障']:i===l.goal?['門','會合']:i===l.watch?['望','察看']:i===l.hazard?['險','路況變化']:i===l.at?['行','隊伍']:['·','道路']);board.innerHTML='<div class="sw__grid" role="group" aria-label="護送路線">'+labels.map(([glyph,label],i)=>'<button type="button" class="sw__tile'+(i===l.blocked?' is-blocked':'')+(l.visited.includes(i)?' is-visited':'')+(i===l.at?' is-here':'')+'" data-a="move" data-n="'+i+'" aria-label="第 '+(i+1)+' 格 '+label+'"'+(i===l.blocked?' disabled':'')+'>'+(i===l.at?'<span class="sw__route-actor">'+figure(c)+'</span>':'<b>'+glyph+'</b>')+'<small>'+label+'</small></button>').join('')+'</div>';controls='<p class="sw__small">已走 '+l.steps+' 步 · 避險線索 '+l.intel+' 份 · 最多行動 18 步</p>';}
   if(s.kind==='formation'){help='選一支隊伍，再點位置；電腦也能拖曳。前隊對應來路，支援在下一個位置，輜重在再下一個位置（左→中→右→左）。';const units=['前隊','支援','輜重'];board.innerHTML='<div class="sw__formation">'+[0,1,2].map(i=>'<button type="button" class="sw__slot'+(l.scouted&&l.threat===i?' is-threat':'')+'" data-a="place" data-n="'+i+'" aria-label="部署到'+['左','中','右'][i]+'路">'+(l.slots[i]!==null?figure(c,units[l.slots[i]]):'<span class="sw__seal" aria-hidden="true">'+['左','中','右'][i]+'</span>')+'<span>'+['左路','中路','右路'][i]+'</span></button>').join('')+'</div>';controls='<div class="sw__formation-tools">'+units.map((name,i)=>btn('select',name,false,false,' data-n="'+i+'" draggable="true" aria-pressed="'+(l.selected===i)+'"')).join('')+'</div><div class="sw__controls">'+btn('scout',l.scouted?'來路已查明':'察看來路 · 補給 −1',false,l.scouted||s.supply<1)+'</div><div class="sw__order">'+[['hold','穩住 · 凝聚 +1'],['advance','前進 · 補給 −1'],['support','支援 · 信任 +1']].map(([v,t])=>btn('order',t,false,false,' data-value="'+v+'" aria-pressed="'+(l.order===v)+'"')).join('')+'</div>';}
   if(s.kind==='network'){help='從水源向相鄰格接續建設，連到兩戶即可交接。點已建的末端可拆除；遠戶是可選目標，省下工力可延續。';board.innerHTML='<div class="sw__grid sw__grid--network" role="group" aria-label="水路建設">'+Array.from({length:12},(_,i)=>{const built=l.built.includes(i),label=i===4?'水源':l.targets.includes(i)?'需求戶':i===l.optional?'遠戶':i===l.blocked?'石障':built?'已接通':'空地';return'<button type="button" class="sw__tile'+(built?' is-built':'')+(i===l.blocked?' is-blocked':'')+'" data-a="build" data-n="'+i+'" aria-label="第 '+(i+1)+' 格 '+label+'"'+([4,l.blocked].includes(i)?' disabled':'')+'><b>'+({水源:'泉',需求戶:'戶',遠戶:'家',石障:'障',已接通:'流',空地:'·'}[label])+'</b><small>'+label+'</small></button>';}).join('')+gridLines(l.built,4)+'</div>';controls='<p class="sw__small">工力 '+(l.built.length-1)+' / '+l.budget+'　需求戶 '+l.targets.filter(x=>l.built.includes(x)).length+' / 2</p><div class="sw__controls">'+btn('resetNetwork','重新畫路')+'</div>';}
   if(s.kind==='evidence'){help='點開資料調查，再把兩份資料納入判斷。最多調查四份；來源獨立、日期相合、可追查都很重要。';board.innerHTML='<div class="sw__drawers">'+l.records.map((r,i)=>'<button type="button" class="sw__drawer'+(l.seen.includes(i)?' is-seen':'')+(l.selected.includes(i)?' is-selected':'')+'" data-a="inspect" data-n="'+i+'" aria-pressed="'+l.selected.includes(i)+'"><b>'+['壹','貳','參','肆','伍'][i]+'</b><span>'+esc(r.name)+(l.selected.includes(i)?' · 已納入':'')+'</span></button>').join('')+'</div>';const rec=l.records[l.active];controls='<p class="sw__small">調查 '+l.seen.length+' / 4　納入 '+l.selected.length+' / 2</p>'+(rec?'<div class="sw__record"><strong>'+esc(rec.name)+'</strong><p>'+esc(rec.text)+'</p><small>'+esc(rec.source)+' · '+esc(rec.event)+'</small><div class="sw__controls">'+btn('evidence',l.selected.includes(l.active)?'移出這份資料':'納入這份資料',false,!l.selected.includes(l.active)&&l.selected.length>=2,' data-n="'+l.active+'"')+'</div></div>':'');}
   if(s.kind==='diplomacy'){help='把最多四份籌碼放在三類條件中。先聽需要花一份補給；承諾會在下一輪要求履約。';board.innerHTML='<div class="sw__cast">'+figure(c)+'<div class="sw__scene-info"><div class="sw__seal">議</div><p>'+(l.heard?'對方最在意：<br><strong>'+['通行安排','糧食補給','禮遇地位'][l.need]+'</strong>':'先聽清楚對方的需要')+'</p></div></div>';controls='<div class="sw__controls">'+btn('hear',l.heard?'已聽明需要':'聽一聽 · 補給 −1',false,l.heard||s.supply<1)+'</div><div class="sw__offers">'+['通行安排','糧食補給','禮遇地位'].map((name,i)=>'<div class="sw__offer"><span>'+name+'</span><div class="sw__stepper"><button data-a="offer" data-n="'+i+'" data-delta="-1" aria-label="減少'+name+'"'+(!l.offers[i]?' disabled':'')+'>−</button><b>'+l.offers[i]+'</b><button data-a="offer" data-n="'+i+'" data-delta="1" aria-label="增加'+name+'"'+(l.offers.reduce((a,b)=>a+b,0)>=Math.min(4,Math.floor(s.supply))?' disabled':'')+'>＋</button></div></div>').join('')+'</div><div class="sw__controls">'+btn('pledge',l.pledge?'已承諾下輪補給一份':'承諾下輪補給一份',false,s.turn===2,' aria-pressed="'+l.pledge+'"')+'</div><p class="sw__small">上一輪承諾：'+(s.promise||0)+' 份　／　這輪安排：'+l.offers.reduce((a,b)=>a+b,0)+' 份</p>';}
   if(s.kind==='music'){help='試聽後依照四聲順序敲鐘。聲音可反覆聽，也有文字提示；不需要比反應速度。';board.innerHTML='<div class="sw__bells" role="group" aria-label="五聲編鐘">'+noteNames.map((name,i)=>'<button class="sw__bell" data-a="tap" data-n="'+i+'" aria-label="敲'+name+'音"><b>'+name+'</b><small>'+(i+1)+'</small></button>').join('')+'</div>';controls='<p class="sw__small">目標樂句：'+l.target.map(x=>noteNames[x]).join(' → ')+'</p><div class="sw__notes" aria-label="已敲出的樂句">'+[0,1,2,3].map(i=>'<span>'+esc(noteNames[l.notes[i]]||'')+'</span>').join('')+'</div><div class="sw__controls">'+btn('listen','試聽樂句')+btn('undo','撤回一聲',false,!l.notes.length)+'</div>';}
   if(s.kind==='hydraulic'){const v=m.water(),lims=l.limits;help='田間閘先配水、城內閘再配水，最後流入洩洪道。點 ＋／− 調整 0～4 級，觀察供水與保留水位。本圖為教學示意，流量不是歷史實測值。';board.innerHTML='<div class="sw__water"><div class="sw__water-top"><span>上游來水</span><b>'+l.inflow+'</b></div><svg viewBox="0 0 600 310" role="img" aria-label="三道水閘分流示意"><defs><linearGradient id="sw-water"><stop stop-color="#9ed9cf"/><stop offset="1" stop-color="#3a999e"/></linearGradient></defs><rect x="225" y="12" width="150" height="85" rx="13" fill="#0b303e" stroke="#a8cfc0"/><rect x="230" y="'+(87-v.level*4)+'" width="140" height="'+(5+v.level*4)+'" rx="8" fill="url(#sw-water)"/><text x="300" y="55" text-anchor="middle" fill="#fff8dc" font-size="20">水位 '+v.level+'</text><path d="M300 97 V132 M100 132 H500 M100 132 V205 M300 132 V205 M500 132 V205" fill="none" stroke="#5da8ab" stroke-width="15"/><path class="sw__flow" d="M300 97 V132 M100 132 H500 M100 132 V205 M300 132 V205 M500 132 V205" fill="none" stroke="#d1e4c7" stroke-width="3" stroke-dasharray="5 17"/>'+[['田',v.field,100],['城',v.town,300],['洪',v.spill,500]].map(([name,num,x])=>'<rect x="'+(x-72)+'" y="210" width="144" height="85" rx="10" fill="#e9d5a8" stroke="#e6c780"/><text x="'+x+'" y="245" text-anchor="middle" fill="#423a26" font-size="21">'+name+' · '+num+'</text><text x="'+x+'" y="274" text-anchor="middle" fill="#615337" font-size="13">'+(name==='田'?'需要 '+lims[0]+'～'+lims[1]:name==='城'?'需要 '+lims[2]+'～'+lims[3]:'排入旁路')+'</text>').join('')+'</svg><div class="sw__water-note '+(v.risk?'is-risk':'')+'">'+(v.risk?'仍有供水或水位需要調整':'供水與保留水位都合適')+' · 安全保留水位 ≤ '+lims[4]+'</div></div>';controls='<div class="sw__offers">'+['田間閘','城內閘','洩洪閘'].map((name,i)=>'<div class="sw__offer"><span>'+name+'</span><div class="sw__stepper"><button data-a="gate" data-n="'+i+'" data-delta="-1" aria-label="關小'+name+'"'+(!l.gates[i]?' disabled':'')+'>−</button><b>'+l.gates[i]+'</b><button data-a="gate" data-n="'+i+'" data-delta="1" aria-label="開大'+name+'"'+(l.gates[i]===4?' disabled':'')+'>＋</button></   function act(action,n,value,delta){if(action==='defer'){close(true);return;}if(action==='finish'){close(false);return;}if(action==='listen'){m.s.local.target.forEach((x,i)=>tone(x,i*.5));status('試聽：'+m.s.local.target.map(x=>noteNames[x]).join(' → '));return;}const oldPhase=m.s.phase;let ok=false;const arg=['order','convoyMode','councilSpeak'].includes(action)?value:n;try{ok=['begin','next','commit','scout','hear','pledge','undo','resetNetwork','convoyScout','crossingWait','sail','councilListen'].includes(action)?m[action]():['offer','gate','allocate'].includes(action)?m[action](n,delta):typeof m[action]==='function'?m[action](arg):false;}catch(e){console.error(e);status('這個操作未完成，可再試一次。');return;}if(!ok){status(action==='build'?'需從已接通的相鄰格建設，拆除也不能截斷其他水路。':action==='stow'?'本船最多三格，請先卸下一項再安排。':action==='inspect'?'本輪四次調查已用完，仍可翻閱調查過的資料。':['move','convoyMove'].includes(action)?'請從隊伍所在處，走向相鄰且可通行的一格。':'目前無法執行這個安排。');return;}persist?.({deferred:false});const focused=root.querySelector(':focus'),focusAction=focused?.dataset.a,focusN=focused?.dataset.n;layout();if(action==='sail'&&q('.sw__boat'))q('.sw__boat').classList.add('is-sailing');if(action==='tap'){tone(n);q('[data-a="tap"][data-n="'+n+'"]').classList.add('is-ringing');}const next=root.querySelector('[data-a="'+focusAction+'"]'+(focusN!==undefined?'[data-n="'+focusN+'"]':''));if(next&&!next.disabled)next.focus({preventScroll:true});if(oldPhase!==m.s.phase){root.scrollTo({top:0,behavior:'instant'});root.focus({preventScroll:true});status(m.s.phase==='report'?'這一段已完成，資源變動已保留。':'進度已保留。');}else status(action==='scout'?'來路已標示在部署位置。':action==='hear'?'已聽明白對方需要。':'安排已保留，隨章節存檔儲存。');}
  root.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled)act(b.dataset.a,Number(b.dataset.n),b.dataset.value,Number(b.dataset.delta));});
