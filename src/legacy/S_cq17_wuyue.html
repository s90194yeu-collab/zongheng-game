    n_return:async ctx=>{await ctx.scene('yue_hall',{place:'越・返國之後',time:'會稽求成之後・白天'});ctx.cast(['goujian','fanli','wenzhong']);await ctx.say([{text:'《史記》記吳赦越、勾踐返國，又記范蠡與柘稽赴吳為質，兩年後范蠡歸。'},{text:'本話依這段記載接續，不把勾踐入吳三年的後世敘事直接接成《史記》原文。'},{who:'goujian',text:'國家還在，眼前的困難也還在。我該如何面對？',expr:'sad'},{who:'wenzhong',text:'先從百姓的生計開始。國政不能只靠一股怨氣。',expr:'serious'}]);return 'n_kudan';},
    n_kudan:async ctx=>{await ctx.chapter('第三幕・日復一日的蓄力','嘗膽、養民、練兵');await ctx.scene('kudan_room',{place:'越宮・置膽之室',time:'返國之後・夜'});ctx.cast(['goujian','shiguan']);await ctx.say([{text:'先讀《史記》如何描寫勾踐返國後的日常，再判斷苦膽的作用。'},{who:'goujian',text:'當下的每一個動作，都連著會稽那一天。',expr:'serious'}]);await ctx.anchor('wy_07');ctx.unlock('idiom:woxinchangdan');ctx.unlock('treasure:cq17_kudan');await ctx.say([{who:'shiguan',text:'這裡只有嘗膽；「臥薪」是後世說法，不是這段《史記》的文字。',expr:'serious'}]);return 'n_policy';},
    n_policy:async ctx=>{await ctx.scene('yue_village',{place:'越・田野與織作',time:'長期恢復・白天'});ctx.cast(['goujian','wenzhong','fanli']);await ctx.say([{text:'勾踐身自耕作，夫人自織；文種治國，范蠡謀兵，百姓的生活逐步恢復。'},{who:'goujian',text:'我與百姓同勞，但年計還要怎樣安排？',expr:'serious'},{who:'wenzhong',text:'糧食、布帛、人口，都需要持續照顧。',expr:'normal'}]);const c=await ctx.choose({title:'恢復國政',text:'選擇改變推演品質，仍須完成經營關卡。',options:[{label:'養民與備兵並行，減少急徵',desc:'先讓人民能持續承擔。',value:'balance'},{label:'只催練兵，所有生計稍後再談',desc:'追求短期兵力。',value:'rush'},{label:'只求王室安逸，把恢復交給旁人',desc:'失去長期投入。',value:'comfort'}]});ctx.flag('policy',c);if(c==='balance'){ctx.add('power',12);ctx.add('people',15);ctx.add('suspicion',-5);}else if(c==='rush'){ctx.add('power',3);ctx.add('people',-15);ctx.add('suspicion',10);}else{ctx.add('power',-10);ctx.add('people',-10);}return 'n_shengju';},
    n_shengju:async ctx=>{await ctx.scene('yue_field',{place:'越・長期生聚總覽',time:'二十期教學推演・四季更迭'});ctx.cast(['goujian','wenzhong']);await ctx.say([{text:'接下來先總覽長期蓄力。二十期不是逐年紀年表，結束後會回到前482年的關鍵時刻。'},{who:'wenzhong',text:'人力要隨時分配。兵力與生計，要放在同一張年計裡。',expr:'serious'}]);const r=await ctx.minigame({id:'wy_shengju',title:'十年生聚',goal:'逐期分配人力、施行年計，完成二十期及必要的經營補作。',help:'<p>每期點五次分配五隊，再施行年計。耕作增糧，織布增布，生聚養民增人口，教訓練兵增加戒心，事吳耗糧布而降戒心。前十期每期五秒，後十期四秒。戒心80會遇查驗。國力須超70、兵力超75；失敗後須無時限調整到目標。補作不另加史實年數。</p>',skip:false},(b,g)=>ZH.games_cq17.shengju(b,g,{suspicion:ctx.meter('suspicion')}));const f=remember(ctx,'shengju',r);if(f.passed){ctx.add('power',35);ctx.add('people',15);ctx.add('suspicion',-15);}else{ctx.add('power',-8);ctx.add('people',-5);ctx.add('suspicion',10);}await ctx.say([{text:'經營操作已完成。評語採首次表現；無時限補作不回寫首次分數。'}]);return 'n_wait';},
    n_wait:async ctx=>{await ctx.scene('yue_hall',{place:'越宮・等待出兵的時機',time:'長期蓄力的回望・白天'});ctx.cast(['goujian','fanli']);await ctx.say([{who:'goujian',text:'備兵漸有成果。面對吳國，還要看什麼？',expr:'worried'},{who:'fanli',text:'國力是一面，對方的部署與百姓的承擔又是一面。',expr:'serious'}]);const c=await ctx.choose({title:'等待與守約',text:'這是國政推演，不決定史實中的進軍日期。',options:[{label:'察看時勢，維持生計與守約',desc:'保存蓄力，也注意對方動向。',value:'watch'},{label:'只見兵多，公開誇耀復仇',desc:'使吳王更生戒心。',value:'boast'},{label:'失去耐心，停止修備與聽諫',desc:'長期努力難以接續。',value:'neglect'}]});ctx.flag('timing',c);if(c==='watch'){ctx.add('power',10);ctx.add('people',8);ctx.add('suspicion',-10);}else if(c==='boast'){ctx.add('people',-8);ctx.add('suspicion',15);}else{ctx.add('power',-12);ctx.add('people',-10);}return 'n_huangchi';},
    n_huangchi:async ctx=>{await ctx.chapter('第四幕・黃池與姑蘇','回到前482年，再走向前473年');await ctx.scene('yue_hall',{place:'越宮・黃池消息傳來',time:'前482年・白天'});ctx.cast(['goujian','fanli']);await ctx.say([{text:'長期經營總覽結束，現在回到前482年：夫差北上黃池會盟。讀原典所列的部署。'},{who:'goujian',text:'這次消息與先前不同。范蠡，局勢到了什麼地方？',expr:'serious'},{who:'fanli',text:'請先判斷史書中，王此時如何行動。',expr:'serious'}]);await ctx.anchor('wy_08');return 'n_progress';},
    n_progress:async ctx=>{await ctx.scene('fujiao_river',{place:'吳越・再戰的歲月',time:'前482年至前473年・黃昏'});ctx.cast(['goujian','soldier','shiguan']);await ctx.say([{text:'越軍乘隙伐吳，但還不能一次滅吳，於是與吳議和。其後再戰，直到前473年。'},{who:'soldier',text:'復國與進軍，都不是一次發令便能完成。',expr:'serious'},{who:'shiguan',text:'各書相對年數有差異；本話以黃池前482年、吳亡前473年分開呈現。',expr:'normal'}]);return 'n_gusu';},
    n_gusu:async ctx=>{await ctx.scene('gusu',{place:'吳・姑蘇城下',time:'前473年・黃昏'});ctx.cast(['goujian','fanli','fuchai']);await ctx.say([{text:'越軍圍姑蘇。夫差請成，勾踐心生不忍；范蠡卻勸王不要放棄多年所謀。'},{who:'goujian',text:'會稽的往事，今天竟換了位置。',expr:'worried'},{who:'fanli',text:'讀我的理由，並問這種論證如何支持眼前的決定。',expr:'serious'}]);await ctx.anchor('wy_09');return 'n_wufalls';},
    n_wufalls:async ctx=>{await ctx.say([{text:'越滅吳，夫差自殺。'},{text:'勾踐北渡淮水，與齊、晉諸侯會盟，向周致貢，號稱霸王。'},{who:'goujian',text:'國勢已變，與我共同承擔的人，將走向哪裡？',expr:'worried'},{who:'shiguan',text:'勝利之後，還有君臣相處與退身的難題。',expr:'serious'}]);ctx.unlock('treasure:cq17_goujianjian');return 'n_fanli';},
    n_fanli:async ctx=>{await ctx.scene('river',{place:'范蠡離越・書信寄往文種',time:'滅吳之後・黎明',tod:'dawn',banner:'#3f7f5a',glyph:'越'});ctx.cast(['fanli','wenzhong','shiguan']);await ctx.say([{text:'范蠡離開越國，自齊寫信給文種。畫面表示書信對讀，並非兩人當面會談。'},{who:'fanli',text:'讀我的信，看看共同受苦與共同享樂之間，有什麼難處。',expr:'serious'},{who:'wenzhong',text:'國事已成，這封信卻要我再想自己的去留。',expr:'worried'}]);await ctx.anchor('wy_10');ctx.unlock('idiom:gongchengshentui');return 'n_cost';},
    n_cost:async ctx=>{await ctx.scene('yue_hall',{place:'越・功成之後的回望',time:'後世讀史・夜',tod:'night'});ctx.cast(['goujian','shiguan']);await ctx.say([{text:'文種後來因讒言被勾踐賜死。'},{who:'shiguan',text:'范蠡的形貌之說，是古人的人物判斷；今天不能用外貌斷定人的德行。',expr:'serious'},{who:'goujian',text:'能與人共患難，功成之後又該如何相待？',expr:'worried'}]);const c=await ctx.choose({title:'功成之後的省思',text:'這是你對史事的回望，文種的史實下場不因選擇改變。',options:[{label:'檢查猜忌，尊重共事者的功與去留',desc:'勝利仍須承擔信任與權力的責任。',value:'respect'},{label:'既然勝利，就能任意處置功臣',desc:'把功成當成免除責任的理由。',value:'control'},{label:'只記勝利，略去君臣關係的代價',desc:'功業遮住其他聲音。',value:'ignore'}]});ctx.flag('trust',c);if(c==='respect'){ctx.add('people',12);}else if(c==='control'){ctx.add('people',-18);}else{ctx.add('people',-8);}return 'n_judge';},
    n_judge:async ctx=>{await ctx.chapter('尾聲・太史公的評語','功業、退身與後世之名');await ctx.scene('academy',{place:'史官・讀史講席',time:'後世回望・夜',tod:'night'});ctx.cast(['shiguan','goujian']);await ctx.say([{who:'shiguan',text:'把勾踐的功業與文種的遭遇並讀，再看太史公如何稱許勾踐。',expr:'serious'}]);await ctx.anchor('wy_11');return 'n_name';},
    n_name:async ctx=>{ctx.cast(['shiguan','fanli']);await ctx.say([{text:'范蠡離越後至齊，又到陶，經營有成，世稱陶朱公。再看太史公的最後評語。'},{who:'fanli',text:'離開並不是人生的終點。還能在新的地方有所作為。',expr:'normal'},{who:'shiguan',text:'個人列傳事蹟將按本局推演生成，並非冒充《史記》原文。',expr:'serious'}]);await ctx.anchor('wy_12');return 'n_end';},
    n_end:async ctx=>{const key=ctx.meter('power')<30?'bad':ctx.meter('power')>=80&&ctx.meter('people')>=70?'great':'good';return ctx.end({type:'final',key});}
  };
  // 6. 三項必要體驗在 Side_cq17_games。
  // 7. 結局與結算
  const ENDINGS = {great:{id:'great',title:'北觀兵中國',good:true,text:'苦身焦思，養民蓄力；功成而能省其猜忌，國勢與民心並進。'},good:{id:'good',title:'越滅吳',good:true,text:'越終滅吳。蓄力與待時有所成，仍當省其國政與君臣之義。'},bad:{id:'bad',title:'會稽之恥',good:false,text:'史實中越終滅吳；此局推演失於經營，國力未振，當以會稽之困自警。'}};
  function onEnd(result,ctx){const s=ctx.state,e=ENDINGS[result&&result.key]||ENDINGS.good;ZH.sfx('seal');return ctx.banner(e.title,'吳越春秋・終').then(()=>ctx.say([{who:'shiguan',text:'三種評語都保留越滅吳的史實。你的首次表現，如何呈現生聚、等待與功成後的信任？',expr:'serious'}])).then(()=>ZH.deleteSave(SID,MODE).catch(()=>null)).then(()=>ZH.finishScenario(payload(s,e)));}
  function payload(s,ending){const f=s.flags,v=s.vars,trial=['fujiao','xingcheng','shengju'].reduce((n,k)=>n+Number(v[k]&&v[k].firstScore||0),0)/30,good=[f.policy==='balance',f.timing==='watch',f.trust==='respect'].filter(Boolean).length;const deeds=['檇李敗吳，闔閭傷死，夫差嗣立。','句踐不聽范蠡，出兵敗於夫椒，退保會稽。','遣大夫種因太宰嚭行成，吳王不聽伍員之諫而許之。','句踐反國，置膽於坐，與百姓同其勞。',f.policy==='balance'?'省急徵，養民與備兵並行。':f.policy==='rush'?'急於練兵，未盡顧民生，年計多困。':'初求安逸，國政修備有所未周。','種撫國，蠡謀兵，久蓄國力；伍員諫而見殺。',f.timing==='watch'?'察時勢，守約蓄力，不輕言其志。':f.timing==='boast'?'誇兵而露志，吳王戒心益增。':'倦於修備，長期之計有所未盡。','夫差北會黃池，越乘隙伐吳，後遂滅之。','范蠡去越，遺種書；種後見讒而死。',f.trust==='respect'?'省功成之猜忌，思尊共事者之去留。':f.trust==='control'?'以功成自恃，未盡察君臣相待之責。':'徒記勝功，未深思功臣之患。'];return {scenarioId:SID,mode:MODE,faction:'越',role:'勾踐',roleKind:'shijia',country:'越',bioTitle:'越王句踐世家',bioOpening:'越王句踐，其先禹之苗裔，而夏后帝少康之庶子也。',ending,scoreStrategy:Math.round(ZH.clamp(25+good*15+trial*30,0,100)),scoreVirtue:Math.round(ZH.clamp(25+good*10+s.meters.people*.45,0,100)),turns:s.steps||1,durationSec:Math.min(5400,Math.round((Date.now()-(s.startedAt||Date.now()))/1000)),deeds,anchors:s.anchors,games:s.games,codex:s.codex,opener:'余讀〈越王句踐世家〉，至置膽於坐、飲食亦嘗膽，未嘗不歎其能忍也。',prompts:['隱忍可以保存未來，也可能延續怨恨。勾踐的忍有哪些作用與代價？','范蠡為何選擇離開，文種為何仍留在越國？應如何理解功成之後的信任？','夫差如何對待伍子胥的警告？勝利與好聽的話，會如何影響判斷？']};}
  // ═════════════════════════ 8. 開始（通常不用改；需要時加 scenes、initState） ═════════════════════════

  const saveState = state => ZH.save(SID, MODE, { engine: state }).catch(() => null);

  function startGame(saved) {
    ROOT.innerHTML = '';
    const game = ZH.story.create(ROOT, {
      id: SID, mode: MODE, title: META.name, subtitle: META.episode,
      seed: Number(params.seed) || 0, start: 'n_intro',
      characters: CHARACTERS, meters: METERS, nodes: NODES, help: HELP, scenes: SCENES,
      anchorTotal: ANCHOR_ORDER.length, anchorOrder: ANCHOR_ORDER,
      onEnd: onEnd, save: saveState
    });
    if (params.test) window.__ep = game;
    game.start(saved || null);
  }

  function roleFace() {
    const c = CHARACTERS.find(x => x.id === ROLE.who);
    if (c && window.ART && ART.portrait) return '<span class="ep-seal has-art" aria-hidden="true">' + ART.portrait(c, { bust: true }) + '</span>';
    return '<span class="ep-seal" aria-hidden="true">' + esc(ROLE.glyph) + '</span>';
  }

  function renderTitle(saved) {
    const vol = ZH.VOLUMES.find(v => v.key === META.vol) || { no: '', name: '' };
    const st = saved && saved.engine;
    const btn = (a, label, primary) => '<button type="button" class="zh-btn ' + (primary ? 'zh-btn--primary' : 'zh-btn--quiet') + ' zh-btn--block" data-a="' + a + '">' + esc(label) + '</button>';
    ROOT.innerHTML =
      '<div class="ep-title" style="--ep-color:' + esc(ROLE.color) + '">' +
      '<div class="ep-title__bar"><a class="zh-mark" href="#" data-a="home"><span class="zh-mark__re">Re:</span><span class="zh-mark__name">縱橫鼎業</span></a>' +
      '<button type="button" class="zh-btn zh-btn--quiet zh-btn--sm" data-a="home">回首頁</button></div>' +
      '<main class="ep-title__main"><header>' +
      '<p class="ep-kicker">' + esc([vol.no + ' ' + vol.name, ZH.episodeLabel(META), META.year ? '前 ' + META.year + ' 年' : ''].filter(Boolean).join('・')) + '</p>' +
      '<h1 class="ep-h1">' + esc(META.name) + '</h1>' +
      '<p class="ep-episode">' + esc(META.episode) + '</p>' +
      '<div class="ep-chips">' + (META.guest ? '<span class="zh-chip zh-chip--gilt">訪客開放</span>' : '') +
      '<span class="zh-chip">原典' + esc(META.source) + '</span><span class="zh-chip zh-chip--patina">' + esc(META.genre) + '</span>' +
      '<span class="zh-chip">自動存檔</span></div>' +
      (ZH.isGuest() ? '<p class="ep-note" style="margin-top:12px">你目前是訪客：可以完整遊玩，但進度只保存在這個分頁，也不會留下成績。</p>' : '') +
      '</header>' +
      '<section class="ep-start">' + roleFace() +
      '<div><h2 class="ep-start__name">' + esc(ROLE.name) + '・' + esc(ROLE.title) + '</h2><p class="ep-start__lead">' + esc(ROLE.lead) + '</p></div>' +
      '<div class="ep-start__act">' + (st ? btn('continue', st.ended ? '查看結局' : '繼續', true) + btn('new', '重新開始', false) : btn('new', '開始遊戲', true)) + '</div></section>' +
      '<section class="ep-points" aria-label="本話重點">' + POINTS.map(p => '<div class="ep-point"><b>' + esc(p.title) + '</b><span>' + esc(p.text) + '</span></div>').join('') + '</section>' +
      '<p class="ep-note">本話共 ' + ANCHOR_ORDER.length + ' 個史實錨點。中途離開會自動存檔。</p>' +
      '</main></div>';
    ROOT.querySelectorAll('[data-a="home"]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); ZH.go('hub'); }));
    const cont = ROOT.querySelector('[data-a="continue"]');
    if (cont) cont.addEventListener('click', () => { ZH.sfx('click'); startGame(st); });
    ROOT.querySelector('[data-a="new"]').addEventListener('click', () => {
      ZH.sfx('click');
      if (!st) { startGame(null); return; }
      ZH.modal({
        title: '重新開始？', body: '<p>目前的進度會清除，從頭開始。</p>',
        actions: [{ label: '取消', value: false, kind: 'quiet' }, { label: '重新開始', value: true, kind: 'primary' }]
      }).then(ok => { if (ok) ZH.deleteSave(SID, MODE).catch(() => null).then(() => startGame(null)); });
    });
  }

  const loadSave = () => ZH.load(SID, MODE).then(r => (r && r.ok && r.state && r.state.engine ? r.state : null)).catch(() => null);

  ZH.ready(() => {
    ZH.loading(true, '展開竹簡');
    ZH.codex.init();
    Promise.all([loadSave(), Promise.race([anchorsReady, ZH.sleep(8000)])]).then(([saved]) => {
      ZH.loading(false);
      // 從首頁「繼續遊戲」帶著模式進來：直接接續
      if (String(params.mode || '') === MODE && saved) { startGame(saved.engine); return; }
      renderTitle(saved);
    });
  });
})();
</script>

<script>ZH.ready(function(){ZH.textplay?.install("S_cq17_wuyue",null);});</script>
