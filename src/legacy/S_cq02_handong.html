function kanpo(saved,rng){const deck=()=>shuffle([...shuffle(CLUES.map((c,i)=>c.answer==='trap'?i:-1).filter(i=>i>=0),rng).slice(0,5),...shuffle(CLUES.map((c,i)=>c.answer==='unknown'?i:-1).filter(i=>i>=0),rng).slice(0,3),...shuffle(CLUES.map((c,i)=>c.answer==='weak'?i:-1).filter(i=>i>=0),rng).slice(0,2)],rng),s=saved?copy(saved):{kind:'kanpo',phase:'plan',cursor:0,deck:deck(),seen:[],answers:[],combo:0,left:5,elapsed:0,actions:[],guideSteps:0,assisted:false,note:'親查前營與後營，再作判斷。'};

n_02:async ctx=>{await scene(ctx,'camp','楚・瑕營','前706年・楚營過場',['chuwu','doubobi','xiongshuai']);await ctx.chapter('第一幕　羸師以張之','先看一眼對方的計策');await ctx.say([{text:'楚武王侵隨，使薳章求成，軍於瑕以待。隨使少師到楚營主持和議。你暫看楚營過場：這些話並不是季梁已經聽到的密報。'},{who:'doubobi',expr:'serious',text:'我們先前炫耀三軍甲兵，漢東小國因恐懼而合謀對楚。隨最大，若隨自滿而棄小國，就能拆開他們。'},{who:'chuwu',expr:'serious',text:'少師驕侈。你要如何利用他的判斷？'}]);await ctx.anchor('su_01');await ctx.say([{who:'xiongshuai',expr:'worried',text:'季梁在，何益？'},{who:'doubobi',expr:'smirk',text:'以為後圖，少師得其君。'},{text:'楚王故意讓軍容顯得殘弱，迎少師入營。眼前不必立即得利，也能埋下日後利用隨侯寵信的伏筆。'}]);ctx.unlock('person:cq_doubobi');ctx.unlock('person:cq_chuwuwang');ctx.unlock('person:cq_xiongshuai');ctx.unlock('person:cq_weizhang');return 'n_03';},
n_03:async ctx=>{await scene(ctx,'hall','隨・朝堂','少師董成而歸',['suihou','shaoshi','jiliang']);await ctx.say([{who:'shaoshi',expr:'smirk',text:'楚營盡是老弱，軍容敗落。趁他們退去，追！'},{who:'suihou',expr:'happy',text:'若真如此，豈不是得利的時候？'},{text:'你是季梁。國君將要答應，你怎樣止住這道軍令？'}]);await ctx.anchor('su_02');ctx.add('heart',firstGood(ctx,'su_02')?10:-5);ctx.unlock('person:cq_suihou');ctx.unlock('person:cq_shaoshi');return 'n_04';},
n_04:async ctx=>{await scene(ctx,'city','隨・城頭','親查前營與後營',['jiliang','shaoshi']);await ctx.say([{who:'jiliang',expr:'serious',text:'一面破旗、幾個老弱，不能代表全軍。我要交叉核查補給、守衛與軍容。'},{who:'shaoshi',expr:'smirk',text:'再看下去，機會就過了！'},{text:'十幕線索採遊戲化情境：先點前營與後營兩處，再判「示弱有破綻」「證據不足」或「確有補給困難」。局部困難不代表全軍無力，也不直接等於可以追擊。'},{text:'每幕開始前可先看清兩處地點，按開始後限時親查。答錯須自己修正；卡關可不限時補做，首次判斷保留。'}]);return 'n_05';},
n_05:async ctx=>{const r=await challenge(ctx,'su_kanpo','kanpo','看破羸師・親查再判','親查十幕前後營，分辨旁證與只看表面的推論。');ctx.add('power',firstScore(r)-5);return 'n_06';},
n_06:async ctx=>{await scene(ctx,'hall','隨・朝堂','小之能敵大',['jiliang','suihou']);await ctx.chapter('第二幕　先成民','小國的道，要由誰來做');await ctx.say([{who:'suihou',expr:'worried',text:'楚軍若不是虛弱，我們這樣的小國，如何與大國相抗？'},{who:'jiliang',expr:'serious',text:'臣聞小之能敵大也，小道大淫。所謂道，忠於民而信於神也。'},{text:'「小道大淫」不是小國只需兵甲更精。對百姓與祭辭，季梁要求什麼？'}]);await ctx.anchor('su_03');ctx.add('heart',firstGood(ctx,'su_03')?5:-5);return 'n_07';},
n_07:async ctx=>{await scene(ctx,'village','隨・村邑','民餒而君逞欲',['jiliang','shiguan']);await ctx.say([{text:'村中有人食不果腹，國君卻仍滿足自己的欲望。祝史為祭祀虛飾告辭，將實際民情說得好看。'},{who:'jiliang',expr:'worried',text:'上思利民，忠也；祝史正辭，信也。忠不只對國君說好話，信也不是把祭品擺得豐盛。'}]);await ctx.anchor('su_04');ctx.add('heart',firstGood(ctx,'su_04')?5:-5);return 'n_08';},
n_08:async ctx=>{await scene(ctx,'shrine','隨・宗廟','牲牷與粢盛',['suihou','jiliang']);await ctx.say([{who:'suihou',expr:'surprised',text:'吾牲牷肥腯，粢盛豐備，何則不信？祭牲完整肥壯，穀物也備得多，為何還說不信？'},{who:'jiliang',expr:'serious',text:'夫民，神之主也。是以聖王先成民，而後致力於神。'},{text:'祭文中的豐足，要有百姓生計作根據；只讓國君獨豐，與民和年豐不同。'}]);await ctx.anchor('su_05');ctx.unlock('treasure:cq02_shengquan');ctx.unlock('treasure:cq02_zisheng');return 'n_09';},
n_09:async ctx=>{await scene(ctx,'hall','隨・政務案','準備報政',['jiliang','suihou']);const v=await choice(ctx,'civic',{title:'你先提哪一項政務？',text:'這是政策次序的推演，稍後還須逐月親分人力。',options:[{label:'先查民食與耕作，使祭文有真實的民情根據。',value:'people'},{label:'先增祭品，等神降福後再談百姓的飢餓。',value:'offering'}]});await ctx.say([{who:'jiliang',expr:v==='people'?'serious':'worried',text:v==='people'?'先成民不是取消祭祀，而是讓致祭有民和年豐的根據。':'祭品增加，不能替代百姓的食與生計。到每月政務，看看這個次序會帶來什麼。'}]);ctx.add('heart',v==='people'?10:-10);return 'n_10';},
n_10:async ctx=>{await scene(ctx,'river','隨・通使之路','親兄弟之國',['jiliang','shiguan']);const v=await choice(ctx,'neighbors',{title:'鄰國使者求通消息，你如何安排？',text:'兄弟之國指同姓之國；此處記錄你對聯鄰的看法。',options:[{label:'維持通使與相助，不因隨較大便疏遠小國。',value:'kin'},{label:'向小國炫耀隨軍，宣稱隨不必與他們往來。',value:'pride'}]});await ctx.say([{who:'shiguan',expr:'serious',text:v==='kin'?'鬬伯比正盼隨張而棄小國。親鄰，正是避免各自孤立。':'隨若自滿而棄小國，便可能照著楚的計策走。大小與自保，不能只用聲勢衡量。'}]);ctx.add('heart',v==='kin'?10:-10);return 'n_11';},
n_11:async ctx=>{await scene(ctx,'village','隨・十二月政務','概念推演・非逐月史實',['jiliang']);await ctx.say([{who:'jiliang',expr:'serious',text:'三份人力，不可能每件事都做到最多。先照顧糧食，再兼顧城備、祭祀與兄弟之國。'},{text:'每月先不限時讀事件與數值；開始調度後，親點加號分三份，可收回再分，按提交才入月報。遇祝史請求，還須自己選正辭或矯舉。'},{text:'十二個月與糧食、國力等數值用來體驗政策代價。原文沒有逐月政務表；史實結果仍是隨侯懼而修政，楚不敢伐。'}]);return 'n_12';},
n_12:async ctx=>{const r=await challenge(ctx,'su_minshen','minshen','先成民・十二月報政','親分十二個月各三份人力，安民、正辭與聯鄰。');const first=r.firstResult||r;setMeter(ctx,'power',first.stats?.power??45);setMeter(ctx,'chu',first.stats?.pressure??50);return 'n_13';},
n_13:async ctx=>{await scene(ctx,'hall','隨・朝堂','修政與親鄰',['suihou','jiliang']);await ctx.say([{who:'jiliang',expr:'serious',text:'今民各有心，而鬼神乏主，君雖獨豐，其何福之有！君姑脩政而親兄弟之國，庶免於難。'},{who:'suihou',expr:'worried',text:'你說的，讓我不能只看祭品。'}]);await ctx.anchor('su_06');await ctx.say([{text:'隨侯懼而脩政，楚不敢伐。這是前706年事件的結果；你的月報留在過程紀錄，供反思對照。'}]);ctx.add('heart',firstGood(ctx,'su_06')?10:-5);return 'n_14';},
n_14:async ctx=>{await scene(ctx,'field','楚・沈鹿','前704年・兩年後',['shiguan','chuwu','weizhang']);await ctx.chapter('第三幕　少師有寵','一時修政，是否足以長保');await ctx.say([{text:'兩年後，少師仍受隨侯寵信。鬬伯比認為敵國已有可乘之隙。夏，楚子合諸侯於沈鹿，黃、隨不會。'},{who:'weizhang',expr:'serious',text:'楚王使我責問黃國。對隨，楚軍已出。'},{text:'楚子伐隨，軍於漢、淮之間。此前的修政不能讓風險永遠消失；國君與寵臣的判斷，再一次左右局面。'}]);setMeter(ctx,'chu',80);return 'n_15';},
n_15:async ctx=>{await scene(ctx,'hallDusk','隨・戰前軍議','請下之',['suihou','jiliang','shaoshi']);await ctx.say([{who:'shaoshi',expr:'smirk',text:'必速戰，不然，將失楚師！'},{text:'你是季梁。面對楚軍來伐，你先提出什麼建議？「下之」不是立刻放棄整個國家。'}]);await ctx.anchor('su_07');ctx.add('heart',firstGood(ctx,'su_07')?5:-5);await ctx.say([{text:'季梁建議先示弱求和。若楚不許，再戰，能激起隨軍的憤怒而使敵人怠慢。隨侯卻出兵迎楚，局勢走向速杞。'}]);return 'n_16';},
n_16:async ctx=>{await scene(ctx,'campNight','隨・望楚師','楚人上左',['jiliang','suihou']);await ctx.say([{who:'jiliang',expr:'serious',text:'楚人上左，君必左，無與王遇，且攻其右。右無良焉，必敗。偏敗，眾乃攜矣。'},{text:'「左」從楚軍自身看：國君與主力在左翼，右翼較弱。圖上三路只作概念標示，不把畫面左右與軍隊本位混用。'}]);await ctx.anchor('su_08');return 'n_17';},
n_17:async ctx=>{await scene(ctx,'hallDusk','隨・最後軍令','少師反對',['shaoshi','suihou','jiliang']);await ctx.say([{who:'shaoshi',expr:'angry',text:'不當王，非敵也。若不與楚王對陣，算什麼敵手！'},{who:'jiliang',expr:'worried',text:'爭一時聲勢，能代替判斷敵軍的強弱嗎？'},{text:'隨侯不從季梁之策。請把少師的話與戰敗結果連讀，區分勇氣與驕矜。'}]);await ctx.anchor('su_09');ctx.add('heart',firstGood(ctx,'su_09')?5:-5);return 'n_18';},
n_18:async ctx=>{await scene(ctx,'battle','隨・速杞','前704年・戰局已敗',['jiliang','suihou']);await ctx.say([{text:'隨師在速杞敗績。你作為季梁所指揮的撤退守備，是對保全人員的虛擬體驗；不改寫成隨軍反勝，也不聲稱原文記載了這些具體調度。'},{who:'jiliang',expr:'serious',text:'現在先護送隨侯與人員。不是再去爭誰能正面迎王。'},{text:'沙盤將楚軍自身左翼標在第一路，中路在第二路，右翼在第三路。箭頭由畫面右方向左推進，退路在左邊。'}]);return 'n_19';},
n_19:async ctx=>{await ctx.say([{text:'親放戈陣、弓手、戰車，各一組；部署時可收回調整，準備好再開始。建議戈陣與戰車守楚軍右翼，弓手牽制中路。'},{text:'少師兩次擅移兵，須親選被移單位、點原路調回；三個護送節點，須自己下令。閱讀與下令停表，戰場進行合計60活動秒。'},{text:'卡關可不限時親做補足；協助中的軍報可以逐段親按推進，所有部署、調回與護送仍要自己做。'}]);return 'n_20';},
n_20:async ctx=>{const r=await challenge(ctx,'su_suqi','suqi','速杞之戰・掩護撤退','親布三組守備，調回兩次、護送三次；史實仍為隨師敗績。');ctx.add('power',firstScore(r)-26);return 'n_21';},
n_21:async ctx=>{await scene(ctx,'river','隨・退路','隨侯逸',['suihou','jiliang','doudan']);await ctx.say([{text:'史文記隨師敗績，隨侯逃脫，楚將鬬丹取得隨侯的戎車，並俘其戎右少師。'},{who:'jiliang',expr:'worried',text:'兵力與聲勢之外，少師得君而誤國的後果，已擺在眼前。'},{text:'你剛親做的護送與守備，留作對戰敗時責任的體驗紀錄，不當成原典逐項記載。'}]);ctx.unlock('person:cq_doudan');return 'n_22';},
n_22:async ctx=>{await scene(ctx,'camp','楚・議和','前704年・秋',['chuwu','doubobi','shiguan']);await ctx.chapter('第四幕　隨未可克','敗績之後，仍有何可恃');await ctx.say([{text:'隨與楚議和，楚王本欲不許。鬬伯比卻說：「天去其疾矣，隨未可克也。」'},{who:'shiguan',expr:'serious',text:'隨的「疾」是誰？少師被俘，為何反使楚不宜再攻？'}]);await ctx.anchor('su_10');await ctx.say([{text:'楚乃盟而還。隨師戰敗、隨侯逸、少師被俘、隨及楚平，是每一局共同的史實結果。'}]);return 'n_23';},
n_23:async ctx=>{await scene(ctx,'academy','史官・漢東回望','跨時代的線索',['shiguan','jiliang']);await ctx.say([{who:'shiguan',expr:'serious',text:'七十多年後，前632年晉楚交鋒，晉大夫欒貞子說：「漢陽諸姬，楚實盡之。」這是當時主戰的言論，提醒我們看楚的擴張；不能倒寫成前704年的隨已滅亡。'},{text:'再把眼光移到出土文物：湖北隨州的曾侯乙編鐘屬戰國早期，晚於季梁，不能搬進本話戰場或當作隨侯此時的祭器。'},{who:'shiguan',expr:'normal',text:'曾國很可能與史書中的隨國相聯，細節要持續對照文獻與考古。這張卡作延伸線索，不是本話的一件戰利品。'}]);ctx.unlock('treasure:cq02_bianzhong');return 'n_24';},
n_24:async ctx=>{await scene(ctx,'palace','隨・季梁列傳','本話收卷',['shiguan','jiliang']);await choice(ctx,'reflection',{title:'替季梁列傳留一個追問',text:'立場不計分。結算請引用一句原文與一次親做操作，說明自己的判斷。',options:[{label:'先成民，再致力於神，今天如何理解？',value:'people'},{label:'領導者為何信寵臣，卻不聽有根據的諫言？',value:'trust'},{label:'小國如何在大國之間兼顧自保與聯鄰？',value:'neighbors'}]});await ctx.say([{who:'jiliang',expr:'serious',text:'我所能提出的道理，需要國君真的聽、政務真的做。請帶著自己的首次判斷、月報與撤退軍令，寫成一段列傳。'}]);ctx.end({key:ctx.meter('power')<25?'bad':ctx.meter('power')>=60&&ctx.meter('heart')>=60?'great':'good'});return null;}

const ENDINGS={great:{key:'great',title:'隨未可克',good:true,text:'本局國力與君心較佳，你以安民、正辭與聯鄰理解小國之道，並親做戰敗中的護送。史實仍是隨師敗績、少師被俘、隨及楚平；高分不把敗戰改成勝戰。'},good:{key:'good',title:'修政自保',good:true,text:'三項必要體驗已親自完成。前706年修政使楚不敢伐，前704年速杞仍敗而後議和。從首次紀錄回看，修政、君心與軍令在哪裡失去銜接。'},bad:{key:'bad',title:'速杞之敗',good:false,text:'本局國力偏低，初次政務或撤退判斷留下弱點。必要體驗已親自完成，史實仍為隨侯逸、隨及楚平。請用月報與護送紀錄分辨一時聲勢與保全民生。'}};
function payload(s,ending){const a=s.vars.kanpo.firstScore,b=s.vars.minshen.firstScore,c=s.vars.suqi.firstScore,truths=s.vars.minshen.completion.months.filter(m=>m.truth==='honest').length,virtue=Number(firstGood(game.ctx,'su_04'))+Number(firstGood(game.ctx,'su_05'))+Number(firstGood(game.ctx,'su_06'))+Number(s.vars.choices.civic==='people')+Number(s.vars.choices.neighbors==='kin')+truths;return{scenarioId:SID,chapterVersion:VERSION,runId:s.vars.runId,mode:MODE,faction:'隨',country:'隨',role:'季梁',roleKind:'liezhuan',bioTitle:'季梁列傳',bioOpening:'季梁者，隨之賢大夫也。',ending,scoreStrategy:Math.round(a*3+b*3+c*4),scoreVirtue:Math.round(virtue/7*100),turns:s.steps,durationSec:Math.min(5400,Math.round((Date.now()-s.startedAt)/1000)),deeds:['楚以羸師張少師；親查十幕線索，首次'+a+'分，辨表象與旁證。','諫止追楚，對讀小道大淫、忠於民而信於神。','親分十二月政務，首次'+b+'分；兩次祝史請求，親選正辭或矯舉。','前706年隨侯懼而修政，楚不敢伐；回看親兄弟之國。','前704年不會沈鹿，速杞敗績；親布守備、調回兩次、護送三次，首次'+c+'分。','少師被俘，鬬伯比言天去其疾，楚與隨盟而還。'],anchors:copy(s.anchors),games:copy(s.games),codex:s.codex.slice(),opener:'遊戲史官評語（自擬）：余讀季梁之諫，至民為神主之言，未嘗不歎小國亦有賢人也。羸師示弱，少師以侈見誘；季梁察其情而止追，勸修政以親鄰。後隨侯不從其戰策，敗於速杞，少師見獲，乃與楚平。賢言能救一時，不能代君之聽與政之行；小國之道，當觀民食、正辭與聯鄰，不以祭品之豐及軍容之盛盡之。',prompts:['「先成民而後致力於神」如何理解忠與信？引用一句原文，結合一次人力分配或祭文選擇，說明祭品豐盛為何不能替代民生。','少師為何能影響隨侯？對讀「少師得其君」與「不當王，非敵也」，結合一次查證或調回軍令，分析寵信與證據的差別。','小國如何在大國之間自處？對讀「親兄弟之國」與「隨未可克」，用一次聯鄰或撤退操作說明自保、讓步與避免孤立。'],experience:{firstAnchors:copy(s.vars.firstAnchors),kanpo:copy(s.vars.kanpo),minshen:copy(s.vars.minshen),suqi:copy(s.vars.suqi),decisions:copy(s.vars.choices)}};}
async function onEnd(r,ctx){const s=ctx.state;if(ORDER.some(id=>!s.anchors.some(a=>a.anchorId===id))||['su_kanpo','su_minshen','su_suqi'].some(id=>!s.games.some(g=>g.gameId===id&&!g.skipped))||['kanpo','minshen','suqi'].some(k=>!s.vars[k]?.completed)||CODEX_KEYS.some(id=>!s.codex.includes(id)))throw Error('必要體驗或對讀尚未完成，請接續本話。');const ending=ENDINGS[r.key]||ENDINGS.good,p=s.vars.finishPayload||payload(s,ending);await ctx.banner(ending.title,'季梁列傳・本局評語');await ctx.say([{text:ending.text},{who:'shiguan',expr:'serious',text:'到結算用原文、首次判斷與親自操作完成反思。'}]);if(s.vars.submitted){ZH.session.set('result:'+SID,p);ZH.go('result',{s:SID});return;}s.vars.finishPayload=p;await checkpoint();await journal.flush();ZH.finishScenario(p);s.vars.submitted=true;await checkpoint();}
async function start(saved){if(loading)return;loading=true;ROOT.innerHTML='';game=ZH.story.create(ROOT,{id:SID,mode:MODE,title:'漢東小國',subtitle:'先成民，才有小國之道',seed:Number(params.seed)||0,start:'n_01',characters:CHARACTERS,scenes:SCENES,nodes:NODES,meters:[{id:'power',label:'國力',icon:'shield',max:100,start:45},{id:'heart',label:'君心',icon:'heart',max:100,start:40},{id:'chu',label:'楚威',icon:'flame',invert:true,max:100,start:50,danger:80}],help:HELP,anchorOrder:ORDER,anchorTotal:10,anchorRunner,snapshot,save,onProgress:save,onEnd,initState:()=>({vars:{schema:SCHEMA,runId:'su_'+Date.now().toString(36)+'_'+crypto.getRandomValues(new Uint32Array(1))[0].toString(36),firstAnchors:{},choices:{}}})});window.__ep=game;loading=false;game.start(saved||null);}
function title(saved){const compatible=saved?.vars?.schema===SCHEMA,st=compatible?saved:null;ROOT.innerHTML='<main class="su-title"><div class="su-title-bar"><span class="su-kicker">春秋篇・第二話・前706—前704年</span><button class="zh-btn zh-btn--quiet" data-home>回首頁</button></div><header><h1>漢東小國</h1><p class="su-subtitle">楚軍故意示弱，千萬別追</p></header><div class="su-title-scene">'+panorama('palace',['jiliang','suihou','shaoshi'])+'</div><section class="su-start"><div class="su-seal">隨</div><div><h2>你・季梁・察敵、安民與撤退</h2><p class="su-note">親查羸師、逐月報政、掩護隨侯，將諫言變成自己的操作。</p></div><div class="su-start-actions">'+(st?'<button class="zh-btn zh-btn--primary" data-continue>接續這一局</button>':'')+'<button class="zh-btn '+(st?'zh-btn--quiet':'zh-btn--primary')+'" data-new>'+(st?'重新開始':'開始遊戲')+'</button></div></section><section class="su-points"><div><b>看破羸師</b><p class="su-note">親查十幕前後營線索，用旁證辨表象，不因催促便追擊。</p></div><div><b>先成民</b><p class="su-note">十二月、每月三份人力，親分民食、城備、祭祀與鄰交。</p></div><div><b>速杞之戰</b><p class="su-note">部署三組守備、調回擅移兵、親下三次護送令。</p></div></section>'+(saved&&!compatible?'<p class="su-follow">偵測到不同版本進度。新版另開一局，已登錄的成績與史冊保留。</p>':'')+'<p class="su-note">預留約25～30分鐘，十段原文對讀、十二項圖鑑、三項必要體驗。卡關可不限時親做補足，首次紀錄保留。 v0.1.0</p></main>';ROOT.querySelector('[data-home]').onclick=()=>ZH.go('hub');const cont=ROOT.querySelector('[data-continue]');if(cont)cont.onclick=()=>start(st);ROOT.querySelector('[data-new]').onclick=async()=>{if(loading)return;if(saved){const ok=await ZH.modal({title:'另開一局？',body:'<p>本話未完成的進度會清除，已登錄的成績與史冊保留。</p>',actions:[{label:'取消',value:false,kind:'quiet'},{label:'重新開始',value:true,kind:'primary'}]});if(!ok)return;await journal.clear();}start(null);};}
