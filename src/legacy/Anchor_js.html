<!--
============================================================
 Re:縱橫鼎業
------------------------------------------------------------
 檔名：Anchor_js.html
 版本：v0.1.0（2026-10-03）
 依賴：Core_css.html、Core_js.html（ZH.call、ZH.track、ZH.sfx、ZH.settings）
       伺服器 AnchorBank.gs（api_getAnchors）
 說明：史實錨點引擎（歧路系統）。
   劇情走到史實發生的那一刻，畫面停筆，強制學生做選擇：
   ・選中史實：蓋上「史實」印，竹簡接著出現原文與解析。
   ・選錯：進入「歧路」，看見另一種歷史怎麼走不下去，
     再「回到那一刻」重選（已選過的選項劃掉）。
   ・第二次仍錯：直接揭曉史書記載與解析。
   每次作答都寫入 AnchorLog（訪客與教師試玩不寫入）。
   選項每次隨機排列，畫面以甲乙丙丁標示；紀錄一律用題庫原始代號 A–D。
 用法：
   ZH.anchor.load('S_cq08_weizheng').then(list => ...)
   ZH.anchor.run(item, { scenarioId, mode: 'history' | 'romance', index, total })
     → Promise<{ anchorId, correct, path, attempts, choice, seconds, cancelled }>
       correct＝第一次就答對；path＝direct 直選史實｜fork 歧路回歸｜fail 回歸後仍錯
   ZH.anchor.runAll(list, options) → 依序出題，回傳結果陣列
   options.preview：true 時不寫紀錄，並提供「結束試玩」按鈕（教師後臺用）
============================================================
-->
<style>
  body.za-lock { overflow: hidden; }

  .za {
    position: fixed; inset: 0; z-index: 55; overflow-y: auto; overscroll-behavior: contain;
    background: radial-gradient(120% 80% at 50% 0%, #27314f, #0a0c1a 72%);
  }
  .za.is-fork { background: radial-gradient(120% 80% at 50% 0%, #461a1e, #10080e 72%); }
  .za__stage {
    position: relative; display: grid; gap: 18px;
    width: min(760px, 100%); margin: 0 auto;
    padding: calc(22px + var(--safe-t)) var(--gutter) calc(40px + var(--safe-b));
    animation: za-open .7s ease both;
  }
  .za.is-rewind .za__stage { animation: za-rewind .7s ease both; }

  /* 標題：一道金色筆畫劃開，歷史停筆 */
  .za__head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px; }
  .za__seal { min-width: 58px; height: 58px; font-size: 20px; }
  .za__title { font-family: var(--f-display); font-size: clamp(21px, 4.2vw, 30px); line-height: 1.3; letter-spacing: .08em; }
  .za__meta { margin-top: 3px; font-size: 13px; color: var(--text-dim); }
  .za__brush { height: 2px; background: linear-gradient(90deg, transparent, var(--gilt) 18%, var(--gilt) 70%, transparent); transform-origin: left center; animation: za-brush 1s .15s cubic-bezier(.3, .7, .2, 1) both; }
  .za.is-fork .za__brush { background: linear-gradient(90deg, transparent, var(--cinnabar) 18%, var(--cinnabar) 70%, transparent); }

  /* 竹簡：短句直排，每一行字正好落在一片竹簡上 */
  .za__passage { justify-self: center; max-width: 100%; }
  .za__passage.is-vertical {
    writing-mode: vertical-rl; text-orientation: mixed;
    height: var(--za-h, 13.6em); max-height: 60vh; padding: 30px 34px; overflow-x: auto;
    font-family: "LXGW WenKai TC", "Noto Serif CJK TC", "Noto Serif TC", "Source Han Serif TC", "PMingLiU", "Songti TC", serif;
    font-size: 20px; line-height: 34px; letter-spacing: .12em;
    background-image: linear-gradient(90deg, transparent 0 33px, var(--slip-line) 33px 34px);
    background-size: 34px 100%; background-position: right top;
  }
  .za__passage.is-vertical::before, .za__passage.is-vertical::after { left: -6px; right: -6px; }

  .za__ask { display: grid; gap: 12px; }
  .za__lead { font-family: var(--f-display); color: var(--gilt); font-size: 16px; }
  .za__role {
    justify-self: start; padding: 3px 14px; border-radius: 4px;
    background: var(--cinnabar); color: #fff4ec;
    font-family: var(--f-display); font-weight: 700; letter-spacing: .1em;
  }
  .za__stem { font-family: var(--f-display); font-size: clamp(18px, 3.2vw, 22px); line-height: 1.7; }

  .za .zh-choice__key { font-family: var(--f-display); font-weight: 700; font-size: 15px; }
  .za .zh-choice:disabled:not(.is-right):not(.is-wrong):hover { border-color: var(--line); background: rgba(20, 26, 46, .65); }
  .za .zh-choice.is-struck { opacity: .42; }
  .za .zh-choice.is-struck .zh-choice__text { text-decoration: line-through; text-decoration-color: rgba(217, 72, 59, .85); }
  .za .zh-choice.is-dim { opacity: .5; }

  .za__out { display: grid; gap: 14px; }
  .za__out:empty { display: none; }

  /* 歧路 */
  .za-fork {
    display: grid; gap: 10px; padding: 14px 18px 16px;
    border-left: 3px solid var(--cinnabar); border-radius: 0 12px 12px 0;
    background: rgba(217, 72, 59, .09); animation: zh-rise .3s ease both;
  }
  .za-fork__title { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-size: 20px; letter-spacing: .2em; color: #ff9c90; }
  .za-fork__text { min-height: 3.8em; font-family: var(--f-display); font-size: 17px; line-height: 1.9; cursor: pointer; }
  .za-fork__turn { font-family: var(--f-display); color: var(--gilt); }

  /* 史實 */
  .za-done { display: grid; gap: 14px; animation: zh-rise .3s ease both; }
  .za-done__head { display: flex; align-items: center; gap: 14px; }
  .za-done__head .zh-seal { min-width: 64px; height: 64px; font-size: 22px; }
  .za-done__head .zh-seal.is-patina { border-color: var(--patina); color: #8fd3c2; }
  .za-done__msg { font-family: var(--f-display); font-size: 19px; }
  .za-done__msg small { display: block; font-family: var(--f-body); font-size: 13px; color: var(--text-dim); }
  .za-explain {
    padding: 14px 16px; border: 1px solid var(--line-soft); border-radius: 10px;
    background: rgba(20, 26, 46, .6); font-size: 15px; line-height: 1.85;
  }
  .za-explain b { margin-right: 8px; font-family: var(--f-display); color: var(--gilt); }
  .za-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; }

  @keyframes za-open { from { opacity: 0; transform: translateY(14px); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
  @keyframes za-brush { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes za-rewind {
    0% { opacity: 1; filter: none; transform: none; }
    35% { opacity: .45; filter: blur(3px) saturate(.2); transform: translateY(-8px); }
    100% { opacity: 1; filter: none; transform: none; }
  }

  @media (max-width: 560px) {
    .za__head { grid-template-columns: auto minmax(0, 1fr); }
    .za__close { grid-column: 1 / -1; grid-row: 1; justify-self: end; }
    .za__seal { min-width: 48px; height: 48px; font-size: 17px; }
    .za__passage.is-vertical {
      max-height: 52vh; padding: 26px 32px; font-size: 18px; line-height: 32px;
      background-image: linear-gradient(90deg, transparent 0 31px, var(--slip-line) 31px 32px); background-size: 32px 100%;
    }
  }
</style>
<script>
(function (ZH) {
  'use strict';

  const global = window;
  const LABELS = ['甲', '乙', '丙', '丁', '戊', '己'];
  const SPEED = { slow: 45, normal: 26, fast: 10, instant: 0 };
  const VERTICAL_MAX = 60;           // 原文短於這個字數時直排在竹簡上
  const COLUMN_MAX = 12;             // 直排時每一行（每片竹簡）最多幾個字
  const store = {};

  ZH.anchor = {
    KINDS: { decision: '情境抉擇', reading: '原文判讀' },

    /** 讀取某劇本的錨點（同一頁只向伺服器要一次） */
    load: function (scenarioId) {
      if (store[scenarioId]) return Promise.resolve(store[scenarioId]);
      return ZH.call('api_getAnchors', scenarioId).then(res => {
        if (!res || !res.ok) throw new Error((res && res.msg) || '讀取史實錨點失敗。');
        store[scenarioId] = res.anchors || [];
        return store[scenarioId];
      });
    },

    /** 依代碼取得已讀取的錨點 */
    get: function (scenarioId, anchorId) {
      return (store[scenarioId] || []).filter(a => a.id === anchorId)[0] || null;
    },

    run: run,

    /** 依序出題；試玩時按「結束試玩」會中止 */
    runAll: function (list, options) {
      const results = [];
      const total = list.length;
      return list.reduce((chain, item, i) => chain.then(stop => {
        if (stop) return true;
        return run(item, Object.assign({}, options, { index: i + 1, total: total })).then(r => {
          results.push(r);
          return !!r.cancelled;
        });
      }), Promise.resolve(false)).then(() => results);
    }
  };


  // ───────────────────────── 出題 ─────────────────────────

  function run(item, options) {
    const o = Object.assign({ scenarioId: item.scenarioId, mode: 'history', preview: false, index: 0, total: 0, shuffle: true }, options || {});
    const romance = o.mode === 'romance';
    const decision = item.kind === 'decision';
    const order = o.shuffle ? shuffle(item.options.slice()) : item.options.slice();
    const answerOpt = item.options.filter(op => op.key === item.answer)[0];

    return new Promise(resolve => {
      const tried = {};
      let attempt = 0;
      let shownAt = 0;
      let first = null;
      let path = 'direct';
      const previous = document.activeElement;

      const title = romance ? '史官問對' : decision ? '歷史在這裡停筆，等你落子' : '史官提筆，等你作答';
      const meta = [
        o.total ? '第 ' + o.index + ' / ' + o.total + ' 題' : '',
        romance ? '演義模式：答對計入史識' : '史實錨點',
        item.sourceRef || ''
      ].filter(Boolean).join('　');

      const root = ZH.html(
        '<div class="za' + (romance ? ' is-romance' : '') + '" role="dialog" aria-modal="true" aria-labelledby="za-title">' +
        '<div class="za__stage">' +
        '<header class="za__head">' +
        '<span class="zh-seal zh-seal--stamp za__seal" aria-hidden="true">' + (romance || !decision ? '史官' : '史') + '</span>' +
        '<div><h2 class="za__title" id="za-title">' + ZH.esc(title) + '</h2><p class="za__meta">' + ZH.esc(meta) + '</p></div>' +
        (o.preview ? '<button type="button" class="zh-btn zh-btn--quiet zh-btn--sm za__close">結束試玩</button>' : '') +
        '</header>' +
        '<div class="za__brush" aria-hidden="true"></div>' +
        slip(item.passage) +
        '<div class="za__ask">' +
        (romance && decision && item.role ? '<p class="za__lead">史官問：正史上的' + ZH.esc(item.role) + '，在這一刻怎麼做？</p>' : '') +
        (item.role ? '<span class="za__role">' + (romance ? '正史中的' : '你是') + ZH.esc(item.role) + '</span>' : '') +
        '<p class="za__stem">' + ZH.esc(item.stem) + '</p>' +
        '</div>' +
        '<div class="zh-choices za__choices" role="group" aria-label="選項"></div>' +
        '<div class="za__out" aria-live="polite"></div>' +
        '</div></div>'
      );
      const choicesEl = root.querySelector('.za__choices');
      const outEl = root.querySelector('.za__out');

      document.body.appendChild(root);
      document.body.classList.add('za-lock');
      document.addEventListener('keydown', onKey, true);
      ZH.sfx('drum');

      const closeBtn = root.querySelector('.za__close');
      if (closeBtn) closeBtn.addEventListener('click', () => finish(true));

      showChoices();

      // ── 顯示選項 ──
      function showChoices() {
        attempt++;
        outEl.innerHTML = '';
        choicesEl.innerHTML = '';
        order.forEach((op, i) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'zh-choice' + (tried[op.key] ? ' is-struck' : '');
          btn.disabled = !!tried[op.key];
          btn.dataset.key = op.key;
          btn.innerHTML = '<span class="zh-choice__key">' + LABELS[i] + '</span><span class="zh-choice__text">' + ZH.esc(op.text) + '</span>';
          btn.setAttribute('aria-label', LABELS[i] + '：' + op.text + (tried[op.key] ? '（已選過）' : ''));
          btn.addEventListener('click', () => pick(op.key));
          choicesEl.appendChild(btn);
        });
        shownAt = now();
        const firstBtn = choicesEl.querySelector('button:not(:disabled)');
        if (firstBtn) setTimeout(() => firstBtn.focus({ preventScroll: true }), 60);
      }

      // ── 作答 ──
      function pick(key) {
        if (choicesEl.dataset.locked === '1') return;
        choicesEl.dataset.locked = '1';
        const op = item.options.filter(x => x.key === key)[0];
        const correct = key === item.answer;
        const seconds = (now() - shownAt) / 1000;
        if (attempt === 1) first = { choice: key, correct: correct, seconds: seconds };
        path = correct ? (attempt === 1 ? 'direct' : 'fork') : (attempt === 1 ? 'fork' : 'fail');
        log({ attempt: attempt, choice: key, correct: correct, firstTry: attempt === 1, path: path, distractorType: correct ? '' : (op.type || ''), seconds: seconds });

        choicesEl.querySelectorAll('button').forEach(b => {
          b.disabled = true;
          if (b.dataset.key === key) b.classList.add(correct ? 'is-right' : 'is-wrong');
          else if (!b.classList.contains('is-struck')) b.classList.add('is-dim');
        });

        const remaining = item.options.filter(x => !tried[x.key] && x.key !== key).length;
        tried[key] = true;
        if (correct) showDone(false);
        else if (attempt === 1 && remaining > 0) showFork(op);
        else showDone(true);
      }

      // ── 歧路 ──
      function showFork(op) {
        ZH.sfx('ng');
        root.classList.add('is-fork');
        const fork = ZH.html(
          '<section class="za-fork">' +
          '<p class="za-fork__title">' + forkIcon() + '歧路</p>' +
          '<p class="za-fork__text"></p>' +
          '<p class="za-fork__turn">' + (romance ? '史官搖頭：「正史不是這樣記載的。」' : '——但史書不是這樣寫的。') + '</p>' +
          '<div class="za-actions"><button type="button" class="zh-btn zh-btn--primary">回到那一刻</button></div>' +
          '</section>'
        );
        outEl.appendChild(fork);
        const textEl = fork.querySelector('.za-fork__text');
        typeText(textEl, op.fork || '歷史在這裡走上了另一條路，卻怎麼也走不下去。回想原文，那一刻真正發生的是什麼？');
        const back = fork.querySelector('button');
        back.addEventListener('click', () => {
          if (textEl._skip) textEl._skip();
          ZH.sfx('chime');
          root.classList.remove('is-fork');
          root.classList.remove('is-rewind');
          void root.offsetWidth;
          root.classList.add('is-rewind');
          choicesEl.dataset.locked = '';
          showChoices();
          root.scrollTo({ top: 0, behavior: 'smooth' });
        });
        setTimeout(() => { fork.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); back.focus({ preventScroll: true }); }, 80);
      }

      // ── 揭曉 ──
      function showDone(failed) {
        if (failed) {
          ZH.sfx('ng');
          choicesEl.querySelectorAll('button').forEach(b => {
            if (b.dataset.key === item.answer) { b.classList.remove('is-dim', 'is-struck'); b.classList.add('is-right'); }
          });
        } else {
          ZH.sfx(path === 'direct' ? 'seal' : 'ok');
        }
        const msg = failed
          ? '史書上，這一刻是：「' + (answerOpt ? answerOpt.text : '') + '」'
          : path === 'direct' ? '與史書相合' : '走完歧路，回到了史書';
        const sub = failed ? '歧路走了兩次，這次先記住史實。' : path === 'direct' ? '第一次就選中史實。' : '第二次選回了史實。';
        const done = ZH.html(
          '<section class="za-done">' +
          '<div class="za-done__head"><span class="zh-seal zh-seal--stamp' + (failed ? ' is-patina' : '') + '" aria-hidden="true">' + (failed ? '史書' : '史實') + '</span>' +
          '<p class="za-done__msg">' + ZH.esc(msg) + '<small>' + ZH.esc(sub) + '</small></p></div>' +
          slip(item.followUp) +
          (item.explanation ? '<p class="za-explain"><b>解析</b>' + ZH.esc(item.explanation) + '</p>' : '') +
          '<div class="za-actions"><button type="button" class="zh-btn zh-btn--primary">繼續</button></div>' +
          '</section>'
        );
        outEl.appendChild(done);
        const next = done.querySelector('button');
        next.addEventListener('click', () => finish(false));
        setTimeout(() => { done.scrollIntoView({ block: 'start', behavior: 'smooth' }); next.focus({ preventScroll: true }); }, 120);
      }

      // ── 結束 ──
      function finish(cancelled) {
        document.removeEventListener('keydown', onKey, true);
        root.remove();
        if (!document.querySelector('.za')) document.body.classList.remove('za-lock');
        if (previous && previous.focus) previous.focus({ preventScroll: true });
        resolve({
          anchorId: item.id,
          cancelled: !!cancelled,
          correct: !!(first && first.correct),
          path: first ? path : '',
          attempts: first ? attempt : 0,
          choice: first ? first.choice : '',
          seconds: first ? Math.round(first.seconds * 10) / 10 : 0
        });
      }

      // ── 鍵盤：1～4 選選項；Tab 留在視窗內 ──
      function onKey(e) {
        if (e.key >= '1' && e.key <= String(order.length) && choicesEl.dataset.locked !== '1') {
          const btn = choicesEl.querySelectorAll('button')[Number(e.key) - 1];
          if (btn && !btn.disabled) { e.preventDefault(); btn.click(); }
          return;
        }
        if (e.key === 'Escape' && o.preview) { e.preventDefault(); finish(true); return; }
        if (e.key === 'Tab') {
          const focusables = Array.prototype.slice.call(root.querySelectorAll('button:not(:disabled)'));
          if (!focusables.length) return;
          const i = focusables.indexOf(document.activeElement);
          if (e.shiftKey && i <= 0) { e.preventDefault(); focusables[focusables.length - 1].focus(); }
          else if (!e.shiftKey && i === focusables.length - 1) { e.preventDefault(); focusables[0].focus(); }
        }
      }

      function log(data) {
        if (o.preview) return;
        ZH.track('anchor', Object.assign({ scenarioId: o.scenarioId, anchorId: item.id }, data));
      }
    });
  }


  // ───────────────────────── 小工具 ─────────────────────────

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function now() {
    return (global.performance && performance.now) ? performance.now() : Date.now();
  }

  function isVertical(text) {
    return String(text || '').length <= VERTICAL_MAX && !/[A-Za-z0-9]{3,}/.test(text);
  }

  /**
   * 竹簡：短句直排。每片竹簡最多 COLUMN_MAX 字，字數平均分到各片，
   * 竹簡高度跟著字數走，不留大片空白。
   */
  function slip(text) {
    if (!text) return '';
    if (!isVertical(text)) return '<div class="zh-slip za__passage is-horizontal">' + ZH.esc(text) + '</div>';
    const n = Array.from(text).length;
    const columns = Math.ceil(n / COLUMN_MAX);
    const perColumn = Math.max(3, Math.ceil(n / columns));
    return '<div class="zh-slip za__passage is-vertical" style="--za-h:calc(' + perColumn + ' * 1.12em + 60px)">' + ZH.esc(text) + '</div>';
  }

  /** 逐字顯示；點一下文字可立即顯示全部 */
  function typeText(el, text) {
    const speed = Object.prototype.hasOwnProperty.call(SPEED, ZH.settings.textSpeed) ? SPEED[ZH.settings.textSpeed] : SPEED.normal;
    const reduce = global.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!speed || reduce) {
      el.textContent = text;
      return Promise.resolve();
    }
    return new Promise(resolve => {
      let i = 0;
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        clearInterval(timer);
        el.textContent = text;
        el.removeEventListener('click', finish);
        el._skip = null;
        resolve();
      };
      const timer = setInterval(() => {
        i++;
        el.textContent = text.slice(0, i);
        if (i >= text.length) finish();
      }, speed);
      el.addEventListener('click', finish);
      el._skip = finish;
    });
  }

  /** 歧路圖示：一條路分岔 */
  function forkIcon() {
    return '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">' +
      '<path d="M12 22V13"/><path d="M12 13C12 9 7 8 5 3"/><path d="M12 13c0-4 5-5 7-10"/></svg>';
  }

})(window.ZH);
</script>
