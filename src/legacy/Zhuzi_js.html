<script>
(function(ZH){
 'use strict';
 const M=ZH.zhuziModel,A=ZH.adventureModel,L=ZH.literary,esc=ZH.esc;
 let c,s,bank,root,view,canvas,ctx,raf=0,lastFrame=0,lastCheckpoint=0,lastClock=Date.now(),saving=Promise.resolve(),busy=false,paused=false,disposed=false,bootOptions,saveError='',teacherPanelOpen=false;
 const testing=()=>!!ZH.teacherPreview?.active(),teacher=()=>!!ZH.teacherPreview?.isTeacher();
 const input={},images={},keys={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'dash',KeyQ:'guard'};
 const button=(text,action,primary)=>'<button type="button" class="zz-btn'+(primary?' primary':'')+'" data-action="'+action+'">'+esc(text)+'</button>';
 const collection=()=>c.collection||'先秦諸子';
 const level=()=>c.studyLabel||(c.level==='bio'?'初階・人物傳記':'進階・思想選讀');
 const stage=()=>c.stages[s.stage];
 const PLANS={
  clash:[['guard','穩守反擊','多承受2次攻勢，移動較慢，出手較輕。'],['rush','搶先壓制','出手更重、移動更快；少1格體力，衝刺耗氣較多。'],['read','觀勢巧行','多留20點氣力，讓走位、守備與反擊接得上。']],
  race:[['guard','穩步護行','更耐碰撞，但腳步較慢；須善用牽制追近對手。'],['rush','疾走搶位','移動較快、容錯較低；別把氣力一次用盡。'],['read','留氣看路','氣力上限較高，為轉彎與下一次衝刺保留餘地。']],
  siege:[['guard','固守要口','多2格體力，移動較慢；守住近處再尋機接應。'],['rush','前出攔截','擊退力較強、跑得較快，卻更不耐受擊。'],['read','預留接應','氣力較充足，能在三路之間多作一次移動。']],
  tempo:[['guard','穩住基本拍','判定稍寬，空拍只減少連段；上下移動較慢。'],['rush','搶下重拍','精準拍聲勢更高，但判定較窄，空拍損失較多。'],['read','聽拍再行','判定範圍較寬，保留標準走位速度。']]
 };
 function clearInput(){if(s?.world?.engine===3)L.cancel?.(s.world);Object.keys(input).forEach(k=>delete input[k]);document.querySelectorAll('.zz-touch .active').forEach(el=>el.classList.remove('active'));}
 function stop(){cancelAnimationFrame(raf);raf=0;clearInput();lastFrame=0;}
 function note(text,error){saveError=error?text:'';const el=root.querySelector('[data-save]');if(el){el.textContent=text;el.classList.toggle('error',!!error);}}
 function tickClock(){const now=Date.now();if(!paused&&!document.hidden)s.elapsed+=(now-lastClock)/1000;lastClock=now;}
 async function checkpoint(){
  tickClock();const snapshot=JSON.parse(JSON.stringify(s));note(testing()?'暫存教師測試……':ZH.isGuest()?'保存本分頁進度……':'保存進度……');
  const job=saving.catch(()=>{}).then(()=>ZH.save(c.id,'history',snapshot));saving=job;
  try{const r=await job;if(!r||!r.ok)throw Error(r&&r.msg||'存檔尚未完成');note(testing()?'教師測試局已暫存，不寫入正式紀錄':ZH.isGuest()?'已保存在本分頁':'已儲存至學校帳號');return true;}
  catch(e){note('存檔失敗：'+e.message+'。請按「儲存」重試。',true);throw e;}
 }
 function shell(){
  root.innerHTML='<div class="zz-app"><header class="zz-top"><div><div class="zz-brand">Re:縱橫鼎業 ／ '+esc(collection())+'</div><h1>'+esc(c.name)+' · '+esc(c.episode)+'</h1></div><nav class="zz-actions" aria-label="章節操作">'+button(c.readerLabel||'原典札記','text')+button(testing()?'暫存測試':'儲存','save')+(teacher()?button('教師自由選關','teacher'): '')+(testing()?button('回正式進度','exit-preview'):'')+button('暫停／離開','pause')+'</nav></header><div class="zz-progress" aria-label="章節進度">'+c.stages.map((t,i)=>teacher()?'<button type="button" class="zz-stage-jump '+(i===s.stage?'current':'')+'" data-teacher-jump="'+i+':intro:0">'+(i+1)+' · '+esc(t.title)+'</button>':'<span class="'+(i<s.stage?'passed':i===s.stage?'current':'')+'">'+(i+1)+' · '+esc(t.title)+'</span>').join('')+'</div>'+teacherPanel()+'<div data-save class="zz-save" role="status"></div><section id="zz-view"></section></div>';
  view=root.querySelector('#zz-view');
  if(saveError)note(saveError,true);
  root.scrollIntoView({block:'start'});
  root.querySelector('[data-action=save]').onclick=()=>guard(async()=>{await checkpoint();ZH.toast(testing()?'測試局已暫存，正式進度未變更。':'進度已儲存。','ok');});
  root.querySelector('[data-action=pause]').onclick=()=>pause();
  const exitPreview=root.querySelector('[data-action=exit-preview]');if(exitPreview)exitPreview.onclick=()=>ZH.teacherPreview.exit();
  const chooser=root.querySelector('[data-action=teacher]');if(chooser)chooser.onclick=()=>{teacherPanelOpen=!teacherPanelOpen;if(s.phase==='game'&&!paused){tickClock();paused=true;stop();checkpoint().catch(()=>{});}render();};
  root.querySelectorAll('[data-teacher-jump]').forEach(el=>el.onclick=()=>guard(()=>jumpForTeacher(...el.dataset.teacherJump.split(':'))));
  const exit=root.querySelector('[data-teacher-exit]');if(exit)exit.onclick=()=>ZH.teacherPreview.exit();
  const reader=root.querySelector('[data-action=text]');if(reader)reader.onclick=()=>{if(s.phase==='game'&&!paused)pause();ZH.modal({title:c.name+'・'+(c.readerLabel||'原文閱讀'),body:'<p>'+esc(c.school)+' · '+esc(c.period)+'</p>'+(c.fullText||c.stages.map(t=>t.passage)).map(p=>'<p class="zz-fulltext">'+esc(p)+'</p>').join('')+(c.readerKind==='guide'?'<p>本頁為自編導讀，全文請配合課本閱讀。</p>':'')+(c.editionNote?'<p>'+esc(c.editionNote)+'</p>':'')+'<p><a target="_blank" rel="noopener noreferrer" href="'+esc(c.url||stage()?.url||c.stages[0].url)+'">核對文本或教學來源</a></p>',actions:[{label:'返回本章',value:true,kind:'primary'}]});};
 }
 function showTeacherPanel(){teacherPanelOpen=true;if(s.phase==='game'&&!paused){tickClock();paused=true;stop();checkpoint().catch(()=>{});}render();}
 function teacherPanel(){
  if(!teacher()||!teacherPanelOpen)return '';
  return '<section class="zz-teacher-panel" aria-label="教師章內自由選關"><div class="zz-teacher-top"><h2>教師自由選關</h2><p>'+(testing()?'正在測試局：跳關、作答與通關不寫入正式紀錄。':'點選任一幕，直接測遊戲或閱讀題；原本進度會先保存。')+'</p>'+(testing()?'<button class="zz-btn" type="button" data-teacher-exit>結束測試，回原進度</button>':'')+'</div><div class="zz-teacher-grid">'+c.stages.map((t,i)=>'<article><h3>第'+(i+1)+'幕・'+esc(t.title)+'</h3><p>'+esc(t.mission?.genre||t.adventure?.title||t.game.title)+'</p><div class="zz-inline"><button class="zz-btn" type="button" data-teacher-jump="'+i+':intro:0">看劇情</button><button class="zz-btn primary" type="button" data-teacher-jump="'+i+':game:0">直接測遊戲</button></div><div class="zz-teacher-questions">'+t.questionIds.map((q,j)=>'<button class="zz-btn" type="button" data-teacher-jump="'+i+':question:'+j+'">閱讀第'+(j+1)+'題</button>').join('')+'</div></article>').join('')+'</div></section>';
 }
 async function jumpForTeacher(index,phase,question){
  if(!teacher())throw Error('僅教師帳號可使用自由選關');index=Number(index);question=Number(question)||0;
  if(!Number.isInteger(index)||index<0||index>=c.stages.length||!['intro','game','question'].includes(phase))throw Error('找不到測試關卡');
  if(question<0||question>=c.stages[index].questionIds.length)throw Error('找不到測試題目');
  tickClock();paused=true;stop();
  try{if(!testing())await ZH.teacherPreview.enter({scenarioId:c.id,mode:'history',settle:async()=>{await saving;await checkpoint();}});}catch(e){paused=false;lastClock=Date.now();render();throw e;}
  ZH.teacherPreview.setPicker(showTeacherPanel);
  s=M.fresh(c.id);s.stage=index;s.phase=phase;s.questionIndex=question;s.assist=false;s.gameAttempt=1;s.storyCursor={};s.tactics={};s.stageGames={};
  if(phase==='game')s.world=makeWorld(false);paused=false;teacherPanelOpen=false;lastClock=Date.now();render();note('教師測試局：不寫入正式紀錄');
 }
 function bind(action,fn){const el=view.querySelector('[data-action="'+action+'"]');if(el)el.onclick=()=>guard(fn);}
 async function guard(fn){if(busy)return;busy=true;try{await fn();}catch(e){ZH.toast(e.message||'操作未完成，請重試。','bad');}finally{busy=false;}}
 function source(t){if(c.readerKind==='guide')return '<p class="zz-source">自編導讀・全文請配合課本。<a href="'+esc(t.url)+'" target="_blank" rel="noopener noreferrer">教學參考來源</a></p>';return '<p class="zz-source">選讀：'+esc(t.source)+' · <a href="'+esc(t.url)+'" target="_blank" rel="noopener noreferrer">核對原典</a>（節錄；標點與字形依教學統一）</p>';}
 function portrait(person){
  try{return window.ART.portrait({id:c.philosopher,name:person,glyph:c.glyph,color:c.color,art:{hat:c.vol==='gw'?'jin':'guan',old:c.vol!=='gw',beard:c.vol==='gw'?1:3,robe:c.color,prop:'scroll',...c.art,...(['紅拂女','張李德和'].includes(person)?{female:true,hat:'none',beard:0}: {})}},{bust:false});}catch(e){return '<span>'+esc(person)+'</span>';}
 }
 function render(){
  stop();document.body.classList.toggle('zz-inbattle',s.phase==='game'&&!paused);syncStageArt();shell();if(paused){renderPause();return;}
  if(s.stage>=c.stages.length){if(testing()){view.innerHTML='<section class="zz-panel"><h2>這段測試已完成</h2><p>本次操作與作答只留在測試局。可從上方「教師自由選關」繼續測另一幕。</p><button class="zz-btn primary" data-action="exit-test">結束測試，回原進度</button></section>';bind('exit-test',()=>ZH.teacherPreview.exit());}else renderComplete();return;}
  if(s.phase==='game'){renderGame();return;}
  if(s.phase==='gameResult'){renderGameResult();return;}
  if(s.phase==='question'){renderQuestion();return;}
  renderIntro();
 }
 function sceneHTML(t,who,text,extra='',question=false){
  const setting=t.mission||t.adventure;
  return '<div class="zz-scene'+(question?' zz-anchor-scene':'')+'"><div class="zz-scene-place">'+esc((t.mission||t.adventure).place)+'<span>第 '+(s.stage+1)+' 幕 · '+esc(t.title)+'</span></div><div class="zz-cast"><div class="zz-cast-player"><img src="'+esc(images.player?.src||'')+'" alt="你的策士"><span>'+esc(ZH.player.name())+'</span></div><div class="zz-cast-npc">'+portrait(c.person)+'<span>'+esc(c.person)+'</span></div></div><div class="zz-scene-shade"></div><div class="zz-speech"><div class="zz-speaker">'+esc(who)+'<small>'+(question?'文本問答':who==='旁白'?'場景敘事':'教學改編對話')+'</small></div><p>'+esc(text)+'</p>'+extra+'</div></div>';
 }
 function currentTactic(){return (s.tactics||{})[s.stage]||'read';}
 function makeWorld(assist){const fresh=stage().mission;const w=(fresh?L:A).create(fresh||stage().adventure,assist,currentTactic(),(Date.now()^((s.gameAttempt+1)*2654435761))>>>0);w.gameId=stage().gameId+(w.creativeVersion===2?'_v4':fresh?'_v3':'_v2');return w;}
 function gameId(){return s.world?.gameId||stage().gameId;}
 function stageGames(){return M.stageGames(c.stages,s);}
 function renderIntro(){
  const t=stage(),a=t.mission||t.adventure;s.phase='intro';s.storyCursor=s.storyCursor||{};s.tactics=s.tactics||{};
  const i=Math.min(a.frames.length-1,s.storyCursor[s.stage]||0),f=a.frames[i],last=i===a.frames.length-1;
  const previous=s.stage?s.games.find(g=>g.gameId===(s.stageGames||{})[s.stage-1]):null;
  let context=previous?'<p class="zz-carry">上一幕首輪 '+previous.firstScore+'／10 · '+(previous.bestScore>previous.firstScore?'已再戰提升至 '+previous.bestScore:'這一步已留在旅程中')+'</p>':'';
  const navigation='<div class="zz-story-nav"><span>'+ (i+1)+' / '+a.frames.length+'</span>'+(i?button('回看上句','previous'):'')+(!last?button('下一句','dialogue',true):'')+button(c.readerKind==='guide'?'對讀導讀':'原文對讀','passage')+'</div>';
  const plans=last&&t.mission?'<section class="zz-plans zz-mission-brief"><p class="zz-kicker">'+esc(a.genre)+' · 依課文情境設計</p><h2>'+esc(a.title)+'</h2><p>'+esc(a.rule)+'</p><p class="zz-mission-warning">'+esc(a.loss)+'</p><details><summary>這個玩法如何接回課文？</summary><p>'+esc(a.connection)+'</p></details><div class="zz-start-row"><label><input type="checkbox" id="zz-assist" '+(s.assist?'checked':'')+'> 練習（較多操作餘裕，不上競技榜）</label>'+button('進入這幕情境','begin',true)+'</div></section>':last?'<section class="zz-plans" aria-label="選擇本幕戰術"><h2>這一幕，怎麼出手？</h2><div class="zz-plan-grid">'+PLANS[a.type].map(([key,title,desc])=>'<button class="zz-plan" data-plan="'+key+'" aria-pressed="'+(currentTactic()===key)+'"><b>'+title+'</b><span>'+desc+'</span></button>').join('')+'</div><div class="zz-start-row"><label><input type="checkbox" id="zz-assist" '+(s.assist?'checked':'')+'> 練習（較慢攻勢，不上競技榜）</label>'+button('進入挑戰','begin',true)+'</div><p class="zz-missionline"><b>'+esc(a.title)+'</b> · '+esc(a.objective)+'</p></section>':'';
  view.innerHTML=context+sceneHTML(t,f.who,f.text,navigation)+plans;
  bind('previous',async()=>{s.storyCursor[s.stage]=i-1;render();});
  bind('dialogue',async()=>{s.storyCursor[s.stage]=i+1;render();});
  bind('passage',()=>ZH.modal({title:t.title+'・'+(c.readerKind==='guide'?'自編導讀':'原文對讀'),body:'<div class="zz-fulltext">'+esc(t.passage)+'</div>'+source(t)+'<p>'+esc(t.gloss)+'</p>',actions:[{label:'回到劇情',value:true,kind:'primary'}]}));
  view.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{s.tactics[s.stage]=b.dataset.plan;render();});
  const practice=view.querySelector('#zz-assist');if(practice)practice.onchange=e=>{s.assist=e.target.checked;};
  bind('begin',async()=>{s.gameAttempt=(s.gameAttempt||0)+1;s.world=makeWorld(s.assist);s.phase='game';s.questionIndex=0;delete s.questionFeedback;render();checkpoint().catch(()=>{});});
 }

 function actionLabel(){if(s.world?.engine===3)return stage().mission.verb;if(s.world?.engine===2)return {clash:'出手',race:'牽制',siege:'擊退',tempo:'合拍'}[s.world.type];const type=stage().game.type;return type==='defend'?'護盾':['flow','seam'].includes(type)?'護身':type==='practice'?'練習':type==='rescue'?'領取／送達':'取簡／交付';}
 function renderGame(){
  if(!s.world)s.world=makeWorld(s.assist);
  const t=stage();
  if(s.world.engine===3){renderLiteraryGame(t);return;}
  if(s.world.engine===2){
   view.innerHTML='<div class="zz-battle-heading"><div><p class="zz-kicker">'+esc((t.mission||t.adventure).place)+' · '+(s.world.assist?'練習':'競技')+'</p><h2>'+esc(t.adventure.title)+'</h2></div><span>對手：'+esc(t.adventure.rival)+'</span></div><div class="zz-game zz-new-game"><div class="zz-hud"><span data-goal></span><span data-time></span><span data-health></span><span data-vigor></span></div><div class="zz-racebars"><label>我方<span><i data-me></i></span></label><label>對手<span><i data-rival></i></span></label></div><canvas width="1000" height="560" tabindex="0" aria-label="'+esc(t.adventure.title)+'。方向鍵移動，E '+esc(actionLabel())+'，Q 守備，空白鍵衝刺。"></canvas></div><p data-notice class="zz-battle-notice" role="status"></p><div class="zz-controlbar"><div class="zz-controlhint">'+esc(t.adventure.objective)+'<br>'+(s.world.type==='tempo'?'↑↓ 走位 · E 對拍（不要連按）':'方向鍵／WASD 移動 · E '+actionLabel()+' · Q 守備 · 空白鍵衝刺')+'</div><div class="zz-touch" aria-label="遊戲操作"><div class="zz-dpad"><button class="up" data-hold="up" aria-label="向上移動">↑</button><button class="left" data-hold="left" aria-label="向左移動">←</button><button class="down" data-hold="down" aria-label="向下移動">↓</button><button class="right" data-hold="right" aria-label="向右移動">→</button></div><div class="zz-touchactions"><button data-hold="action">'+esc(actionLabel())+'</button>'+(s.world.type==='tempo'?'':'<button data-hold="guard">守備</button><button data-hold="dash">衝刺</button>')+'</div></div></div>';
  }else{
  view.innerHTML='<p class="zz-objective"><strong>'+esc(t.game.title)+'</strong> · '+esc(t.game.goal)+'</p><div class="zz-game"><div class="zz-hud"><span data-goal></span><span data-time></span><span data-health></span></div><canvas width="1000" height="560" tabindex="0" aria-label="'+esc(t.game.title)+'遊戲場景。方向鍵或 WASD 移動，E '+esc(actionLabel())+'，空白鍵衝刺。也可使用下方按鈕。"></canvas></div><div class="zz-legend"><span>金色：目標／互動點</span><span>紅色：移動障礙／來襲標記</span></div><p data-notice role="status" class="zz-objective"></p><div class="zz-controlbar"><div class="zz-controlhint">'+(t.game.type==='practice'?'依序走到發光工位，在節奏點進入金色區間時按 E／練習。':t.game.type==='defend'?'移動到來襲標記附近，按 E／護盾擋下六次；可按住連續守備。':t.game.type==='rescue'?'左下補給站領一份物資，再送到尚未完成的求助點；每次都按 E／互動。':['flow','seam'].includes(t.game.type)?'用方向移動碰觸三枚金色概念簡；觀察移動障礙或牆面空隙。':'靠近金色書簡按 E／互動，帶到右上記錄臺再交付；一次帶一束。')+'<br>WASD／方向鍵移動 · E 互動 · 空白鍵衝刺 · Esc 暫停</div><div class="zz-touch" aria-label="遊戲操作"><div class="zz-dpad"><button class="up" data-hold="up" aria-label="向上移動">↑</button><button class="left" data-hold="left" aria-label="向左移動">←</button><button class="down" data-hold="down" aria-label="向下移動">↓</button><button class="right" data-hold="right" aria-label="向右移動">→</button></div><div class="zz-touchactions"><button data-hold="action">'+esc(actionLabel())+'</button><button data-hold="dash">衝刺</button></div></div></div>';
  }
  canvas=view.querySelector('canvas');ctx=canvas.getContext('2d');
  view.querySelectorAll('[data-hold]').forEach(el=>{
   el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);input[el.dataset.hold]=true;el.classList.add('active');if(el.dataset.hold==='action')act();});
   const end=()=>{delete input[el.dataset.hold];el.classList.remove('active');};
   ['pointerup','pointercancel','lostpointercapture'].forEach(k=>el.addEventListener(k,end));
  });
  lastFrame=0;lastCheckpoint=performance.now();raf=requestAnimationFrame(frame);canvas.focus({preventScroll:true});
 }

 function renderLiteraryGame(t){
  const cfg=t.mission,oldCreative=['archive','haoliang','contracts','weave','paperMoon','riverSong','moonwalk','woodcut'].includes(s.world.mode)&&s.world.creativeVersion!==2,rule=oldCreative?'正在續玩原操作，完成後再戰本篇可用新版。'+L.progress(s.world).detail:cfg.rule;view.classList.add('zz-literary-view');
  view.innerHTML='<div class="zz-battle-heading"><div><p class="zz-kicker">'+esc(cfg.genre)+' · '+esc(cfg.place)+' · '+(s.world.assist?'練習':'挑戰')+'</p><h2>'+esc(cfg.title)+'</h2></div><button class="zz-btn" data-mission-help>操作與課文</button></div><div class="zz-game zz-new-game zz-literary-game"><div class="zz-hud zz-mission-hud"><span data-goal></span><span data-time></span><span data-health></span><span data-vigor></span></div><canvas width="1000" height="560" tabindex="0" aria-label="'+esc(cfg.title)+'情境。'+esc(rule)+'"></canvas></div><p data-notice class="zz-battle-notice" role="status"></p><p data-mission-hint class="zz-controlhint"></p><div class="zz-mission-select"><label for="zz-mission-target">操作位置</label><select id="zz-mission-target" aria-label="選擇操作位置"></select></div><div class="zz-controlbar"><div class="zz-touch zz-mission-directions" aria-label="方向或位置操作"><div class="zz-dpad"><button class="up" data-hold="up" aria-label="向上或上一位置">↑</button><button class="left" data-hold="left" aria-label="向左或上一位置">←</button><button class="down" data-hold="down" aria-label="向下或下一位置">↓</button><button class="right" data-hold="right" aria-label="向右或下一位置">→</button></div></div><div class="zz-mission-tools" aria-label="本幕專用操作"></div></div>';
  canvas=view.querySelector('canvas');ctx=canvas.getContext('2d');

  view.querySelectorAll('[data-choice]').forEach(el=>el.onclick=()=>guard(async()=>{
   view.querySelectorAll('[data-choice]').forEach(b=>b.disabled=true);const choice=el.dataset.choice,event=M.answer(s,q,choice);
   s.questionFeedback={id:q.id,choice,correct:event.correct};
   ZH.track('anchor',{scenarioId:c.id,anchorId:q.id,choice,...event,distractorType:event.correct?'':(opts.find(o=>o.key===choice)||{}).type||'情節',seconds:0});
   render();checkpoint().catch(()=>{});
  }));
  bind('again',async()=>{delete s.questionFeedback;render();checkpoint().catch(()=>{});});
  bind('next',async()=>{
   if(!s.recovered[q.id])return;s.questionIndex++;delete s.questionFeedback;
   if(s.questionIndex>=t.questionIds.length){s.stage++;s.phase=s.stage<c.stages.length?'intro':'complete';s.questionIndex=0;s.world=null;}
   render();checkpoint().catch(()=>{});
  });
 }
 function renderComplete(){
  const answers=Object.values(s.answers),correct=answers.filter(a=>a.correct).length,chosen=stageGames();
  view.innerHTML='<div class="zz-panel zz-question"><img class="zz-sectionpic" src="'+esc(images.scene&&images.scene.src||'')+'" alt="'+esc(c.person)+'的 AI 藝術場景"><p class="zz-kicker">'+esc(level())+' ／ '+c.stages.length+' 幕完成</p><h2>'+esc(c.episode)+' · 本篇通關</h2><div class="zz-resultstat"><div><strong>'+correct+' / '+answers.length+'</strong>閱讀首答正確</div><div><strong>'+chosen.map(g=>g.bestScore).join(' · ')+'</strong>'+c.stages.length+' 幕最佳操作（含練習；各滿分 10）</div></div><p class="zz-intro">'+esc(c.note)+'</p>'+(chosen.some(g=>!/_v[34]$/.test(g.gameId))?'<p>新版劇情與挑戰已開放，可按「再戰本篇」進入；原有首答、分數與已存通關紀錄保留。</p>':'')+'<p>完成後可在結算頁回顧文本、保存反思並收錄人物與研讀札記。</p>'+button('保存通關並查看結算','finish',true)+button('再戰本篇・保留首答','relaunch')+'</div>';
  bind('relaunch',async()=>{s=M.relaunch(s);ZH.runs.begin(c.id,s,'history');await checkpoint();render();});
  bind('finish',async()=>{
   await checkpoint();const anchors=answers.map(a=>({...a,path:a.correct?'direct':s.recovered[a.anchorId]?'fork':'fail',attempts:s.attempts[a.anchorId],recovered:!!s.recovered[a.anchorId]}));
   const events=c.stages.map((t,i)=>({kind:'reading',id:'zz_read_'+i,title:t.title,text:t.passage,source:t.source,reading:t.gloss,decision:t.mission?.title||t.adventure.title,anchors:t.questionIds,notes:[t.gloss,'本幕操作：'+(t.mission?.rule||A.styles[(s.tactics||{})[i]]?.label||'舊版續玩')+'；操作紀錄 '+(chosen[i]?.firstScore??'—')+'／10。'],at:new Date().toISOString()}));ZH.session.set('learning:'+c.id,events);
   await ZH.codex.init();(ZH.CODEX||[]).filter(it=>it.scenarioId===c.id).forEach(it=>ZH.codex.unlock(it.type,it.id,c.id,'',{quiet:true}));
   tickClock();await ZH.finishScenario({scenarioId:c.id,mode:'history',role:c.person,roleKind:'liezhuan',faction:collection(),country:c.school,ending:{id:'zz_read_complete',title:level()+'・'+c.episode,text:'循文本之跡，據原文之證，辨其言而思其理。',good:true},anchors,games:chosen.map(g=>({gameId:g.gameId,score:g.firstScore,maxScore:10,bestScore:g.bestScore,practice:g.practice})),scoreStrategy:M.strategy(chosen,c.stages.length),turns:c.stages.length,durationSec:Math.round(s.elapsed),deeds:['讀'+c.name+'，核對出處與上下文。','歷'+c.stages.length+'段場景，以操作體察文本中的問題。','首答'+answers.length+'題，答中'+correct+'題；訂正另存，不移首答。'],opener:'讀經典者，當察其時、辨其言、問其所由。',prompts:['選一處原文，說明你的判斷依據。','遊戲操作呈現了文本的哪一面？它又省略了什麼？']});
  });
 }
 function pause(){if(!s||paused||disposed)return;tickClock();paused=true;stop();checkpoint().catch(()=>{});render();}
 function renderPause(){
  view.innerHTML='<div class="zz-panel zz-pause"><p class="zz-kicker">挑戰與計時已暫停</p><h2>稍停片刻，再讀一段</h2><p>'+(testing()?'教師測試局不寫入正式紀錄；結束測試後回到原進度。':'本章有獨立存檔。回首頁前會再確認存檔完成。')+'</p><div class="zz-inline">'+button('繼續遊戲','resume',true)+button(testing()?'結束教師測試':'儲存並回首頁','leave')+'</div><p class="zz-note">若存檔失敗，請留在本頁按「儲存」重試。</p></div>';
  bind('resume',()=>{paused=false;lastClock=Date.now();render();});bind('leave',async()=>{if(testing()){ZH.teacherPreview.exit();return;}await checkpoint();await ZH.flushAll();disposed=true;ZH.go('hub');});
 }
 function loadImage(key,url){return new Promise(resolve=>{const img=new Image();img.onload=()=>{images[key]=img;resolve(img);};img.onerror=()=>resolve(null);img.src=url;});}
 function svgUrl(svg){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);}
 function syncStageArt(){
  const id=stage()?.mission?.scene||stage()?.adventure?.scene||c.scene;if(images.sceneId===id)return;images.sceneId=id;
  const f=window.ZH_STATIC_MEDIA?.[id],entry=window.ZH_IMAGE_ASSETS?.entries?.[id],url=f&&window.ZH_STATIC_URL?ZH_STATIC_URL(f):'https://s90194yeu-collab.github.io/zongheng-game/media/'+entry?.file;
  if(f||entry){root.style.setProperty('--zz-scene','url("'+url.replace(/["\\]/g,'')+'")');loadImage('scene',url);}
 }
 async function loadArt(){
  const entry=window.ZH_IMAGE_ASSETS&&ZH_IMAGE_ASSETS.entries&&ZH_IMAGE_ASSETS.entries[stage()?.mission?.scene||stage()?.adventure?.scene||c.scene];
  const fallback='https://s90194yeu-collab.github.io/zongheng-game/media/'+(entry?entry.file:c.vol==='gw'?'scene_'+c.scene.slice(6)+'.webp':'scene_zhuzi_'+c.philosopher+'_ai.webp');
  const file=window.ZH_STATIC_MEDIA&&window.ZH_STATIC_MEDIA[stage()?.mission?.scene||stage()?.adventure?.scene||c.scene],url=file&&window.ZH_STATIC_URL?ZH_STATIC_URL(file):fallback;
  root.style.setProperty('--zz-scene','url("'+url.replace(/["\\]/g,'')+'")');
  images.sceneId=stage()?.mission?.scene||stage()?.adventure?.scene||c.scene;const npc=portrait(c.person);let player;
  try{const colorOption=ZH.player.LOOK_OPTIONS.color.find(x=>x[0]===ZH.player.profile?.appearance?.color);const robe=colorOption?.[2]||'#557f8d';player=window.ART.portrait({id:'zz_player',name:ZH.player.name(),glyph:'士',color:robe,art:{hat:'guan',robe,prop:'scroll'}},{bust:false});}catch(e){player=window.ART.portrait({id:'zz_player',name:'策士',glyph:'士',color:'#6b9e9c',art:{hat:'guan',robe:'#557f8d',prop:'scroll'}},{bust:false});}
  await Promise.all([loadImage('scene',url),loadImage('npc',svgUrl(npc)),loadImage('player',svgUrl(player))]);
 }
 async function start(options){
  bootOptions=options;document.body.classList.add('zz-study-page');root=document.getElementById('zhuzi-root');disposed=false;paused=false;busy=false;
  root.innerHTML='<div class="zz-loading"><h1>'+esc(options.loadingTitle||(options.collection==='aSelections'?'經典著作':options.collection==='classics'?'古文十五篇':'先秦諸子'))+'</h1><p role="status">讀取文本與本章進度……</p></div>';
  try{
   c=(options.collection==='aSelections'?ZH.A_SELECTIONS:options.collection==='classics'?ZH.CLASSICS:ZH.ZHUZI)?.chapters[options.id];if(!c)throw Error('找不到本章內容');if(!await ZH.requireStudentProfile())return;
   const [saved,questions]=await Promise.all([ZH.load(c.id,'history'),ZH.call('api_getStoryAnchors',c.id,options.anchorOrder)]);
   if(!saved||!saved.ok)throw Error(saved&&saved.msg||'讀取存檔失敗');if(!questions||!questions.ok)throw Error(questions&&questions.msg||'題庫未就緒');
   bank={};for(const q of questions.anchors||[])bank[q.id]=q;
   if(options.anchorOrder.some(id=>!bank[id]||!['A','B','C','D'].includes(bank[id].answer)))throw Error('必要題目缺漏，請重新讀取題庫');
   const old=saved.state;
   if(old&&old.schema==='zhuzi-v1'&&old.chapterId===c.id){s=Object.assign(M.fresh(c.id),old);if(!Number.isInteger(s.stage)||s.stage<0||s.stage>c.stages.length||!['intro','game','gameResult','question','complete'].includes(s.phase))throw Error('本章存檔格式無法辨認，請從首頁管理自己的紀錄');}
   else if(old)throw Error('本章存檔版本不相符，請從首頁管理自己的紀錄');else s=M.fresh(c.id);
   if(s.world?.engine===3){L.restore(s.world);L.cancel(s.world);}
   s.storyCursor=s.storyCursor||{};s.tactics=s.tactics||{};s.stageGames=s.stageGames||{};if(testing())ZH.teacherPreview.setPicker(showTeacherPanel);ZH.runs.begin(c.id,s,'history');await ZH.player.load().catch(()=>{});lastClock=Date.now();await loadArt();render();if(old)note('已讀取本章存檔，首答與首輪紀錄保留');
  }catch(e){root.innerHTML='<div class="zz-loading"><h1>本章暫時無法開啟</h1><p role="alert">'+esc(e.message)+'</p>'+button('重新讀取文本與進度','reload',true)+button('回首頁','home')+'</div>';root.querySelector('[data-action=reload]').onclick=()=>start(bootOptions);root.querySelector('[data-action=home]').onclick=()=>ZH.go('hub');}
 }
 document.addEventListener('keydown',e=>{
  if(!s||disposed||busy||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;
  if(e.code==='Escape'){e.preventDefault();if(paused){paused=false;lastClock=Date.now();render();}else pause();return;}
  if(s.phase==='intro'&&['Enter','Space'].includes(e.code)&&!['BUTTON','SUMMARY'].includes(e.target.tagName)){const next=view.querySelector('[data-action=dialogue]');if(next){e.preventDefault();next.click();}return;}
  if(s.phase!=='game'||paused)return;if(keys[e.code]){e.preventDefault();input[keys[e.code]]=true;if(s.world?.engine===3&&!e.repeat){if(e.code==='KeyQ')L.secondary(s.world);if(e.code==='Space')L.skill(s.world);}}
  if(e.code==='KeyE'){e.preventDefault();input.action=true;if(!e.repeat)act();}
 });
 document.addEventListener('keyup',e=>{if(keys[e.code])delete input[keys[e.code]];if(e.code==='KeyE')delete input.action;});
 window.addEventListener('blur',()=>{clearInput();if(s&&s.phase==='game'&&!paused)pause();});
 document.addEventListener('visibilitychange',()=>{clearInput();if(document.hidden&&s&&!paused)pause();lastClock=Date.now();});
 window.addEventListener('pagehide',()=>{disposed=true;stop();});
 ZH.zhuzi={start};
})(window.ZH);
</script>
