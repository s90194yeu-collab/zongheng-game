<script>
(function(ZH){
 'use strict';
 const M=ZH.zhuziModel,esc=ZH.esc;
 let c,s,bank,root,view,canvas,ctx,raf=0,lastFrame=0,lastCheckpoint=0,lastClock=Date.now(),saving=Promise.resolve(),busy=false,paused=false,disposed=false,bootOptions,saveError='';
 const input={},images={},keys={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'dash'};
 const button=(text,action,primary)=>'<button type="button" class="zz-btn'+(primary?' primary':'')+'" data-action="'+action+'">'+esc(text)+'</button>';
 const level=()=>c.level==='bio'?'初階・人物傳記':'進階・思想選讀';
 const stage=()=>c.stages[s.stage];
 function clearInput(){Object.keys(input).forEach(k=>delete input[k]);document.querySelectorAll('.zz-touch .active').forEach(el=>el.classList.remove('active'));}
 function stop(){cancelAnimationFrame(raf);raf=0;clearInput();lastFrame=0;}
 function note(text,error){saveError=error?text:'';const el=root.querySelector('[data-save]');if(el){el.textContent=text;el.classList.toggle('error',!!error);}}
 function tickClock(){const now=Date.now();if(!paused&&!document.hidden)s.elapsed+=(now-lastClock)/1000;lastClock=now;}
 async function checkpoint(){
  tickClock();const snapshot=JSON.parse(JSON.stringify(s));note(ZH.isGuest()?'保存本分頁進度……':'保存進度……');
  const job=saving.catch(()=>{}).then(()=>ZH.save(c.id,'history',snapshot));saving=job;
  try{const r=await job;if(!r||!r.ok)throw Error(r&&r.msg||'存檔尚未完成');note(ZH.isGuest()?'已保存在本分頁':'已儲存至學校帳號');return true;}
  catch(e){note('存檔失敗：'+e.message+'。請按「儲存」重試。',true);throw e;}
 }
 function shell(){
  root.innerHTML='<div class="zz-app"><header class="zz-top"><div><div class="zz-brand">Re:縱橫鼎業 ／ 先秦諸子</div><h1>'+esc(c.name)+' · '+esc(c.episode)+'</h1></div><nav class="zz-actions" aria-label="章節操作">'+button('儲存','save')+button('暫停／離開','pause')+'</nav></header><div class="zz-progress" aria-label="章節進度">'+c.stages.map((t,i)=>'<span class="'+(i<s.stage?'passed':i===s.stage?'current':'')+'">'+(i+1)+' · '+esc(t.title)+'</span>').join('')+'</div><div data-save class="zz-save" role="status"></div><section id="zz-view"></section></div>';
  view=root.querySelector('#zz-view');
  if(saveError)note(saveError,true);
  root.scrollIntoView({block:'start'});
  root.querySelector('[data-action=save]').onclick=()=>guard(async()=>{await checkpoint();ZH.toast('進度已儲存。','ok');});
  root.querySelector('[data-action=pause]').onclick=()=>pause();
 }
 function bind(action,fn){const el=view.querySelector('[data-action="'+action+'"]');if(el)el.onclick=()=>guard(fn);}
 async function guard(fn){if(busy)return;busy=true;try{await fn();}catch(e){ZH.toast(e.message||'操作未完成，請重試。','bad');}finally{busy=false;}}
 function source(t){return '<p class="zz-source">選讀：'+esc(t.source)+' · <a href="'+esc(t.url)+'" target="_blank" rel="noopener noreferrer">核對原典</a>（節錄；標點與字形依教學統一）</p>';}
 function portrait(person){
  try{return window.ART.portrait({id:c.philosopher,name:person,glyph:c.glyph,color:c.color,art:{hat:'guan',age:'old',beard:3,robe:c.color,prop:'scroll'}},{bust:false});}catch(e){return '<span>'+esc(person)+'</span>';}
 }
 function render(){
  stop();shell();if(paused){renderPause();return;}
  if(s.stage>=c.stages.length){renderComplete();return;}
  if(s.phase==='game'){renderGame();return;}
  if(s.phase==='gameResult'){renderGameResult();return;}
  if(s.phase==='question'){renderQuestion();return;}
  renderIntro();
 }
 function renderIntro(){
  const t=stage();s.phase='intro';
  view.innerHTML='<div class="zz-panel zz-reader"><div><p class="zz-kicker">'+esc(level())+' ／ 第 '+(s.stage+1)+' 段</p><h2>'+esc(t.title)+'</h2><div class="zz-passage">'+esc(t.passage)+'</div>'+source(t)+'<details><summary>語譯提示</summary><p class="zz-gloss">'+esc(t.gloss)+'</p></details><p class="zz-intro">'+esc(t.story)+'</p><div class="zz-mission"><strong>'+esc(t.game.title)+'</strong><p>'+esc(t.game.goal)+'</p><p>目標概念：'+t.game.targets.map(esc).join('、')+'。操作完成後回讀原文並作答。</p><label><input type="checkbox" id="zz-assist" '+(s.assist?'checked':'')+'> 練習模式（速度較緩、時間較寬；不上競技榜）</label><div class="zz-inline">'+button('進入場景','begin',true)+'</div></div></div><aside><div class="zz-art">'+portrait(c.person)+'</div><p class="zz-note">'+esc(c.note)+'</p><p class="zz-note">桌面：方向鍵／WASD 移動，E 互動，空白鍵衝刺。手機：使用畫面下方方向盤與互動鍵。三段各有獨立挑戰，可暫停、儲存及續玩。</p></aside></div>';
  view.querySelector('#zz-assist').onchange=e=>{s.assist=e.target.checked;};
  bind('begin',async()=>{s.world=M.create(t.game.type,s.assist);s.phase='game';s.gameAttempt++;s.questionIndex=0;delete s.questionFeedback;await checkpoint();render();});
 }
 function actionLabel(){const type=stage().game.type;return type==='defend'?'護盾':['flow','seam'].includes(type)?'護身':type==='practice'?'練習':type==='rescue'?'領取／送達':'取簡／交付';}
 function renderGame(){
  if(!s.world||s.world.type!==stage().game.type)s.world=M.create(stage().game.type,s.assist);
  const t=stage();
  view.innerHTML='<p class="zz-objective"><strong>'+esc(t.game.title)+'</strong> · '+esc(t.game.goal)+'</p><div class="zz-game"><div class="zz-hud"><span data-goal></span><span data-time></span><span data-health></span></div><canvas width="1000" height="560" tabindex="0" aria-label="'+esc(t.game.title)+'遊戲場景。方向鍵或 WASD 移動，E '+esc(actionLabel())+'，空白鍵衝刺。也可使用下方按鈕。"></canvas></div><div class="zz-legend"><span>金色：目標／互動點</span><span>紅色：移動障礙／來襲標記</span></div><p data-notice role="status" class="zz-objective"></p><div class="zz-controlbar"><div class="zz-controlhint">'+(t.game.type==='practice'?'依序走到發光工位，在節奏點進入金色區間時按 E／練習。':t.game.type==='defend'?'移動到來襲標記附近，按 E／護盾擋下六次；可按住連續守備。':t.game.type==='rescue'?'左下補給站領一份物資，再送到尚未完成的求助點；每次都按 E／互動。':['flow','seam'].includes(t.game.type)?'用方向移動碰觸三枚金色概念簡；觀察移動障礙或牆面空隙。':'靠近金色書簡按 E／互動，帶到右上記錄臺再交付；一次帶一束。')+'<br>WASD／方向鍵移動 · E 互動 · 空白鍵衝刺 · Esc 暫停</div><div class="zz-touch" aria-label="遊戲操作"><div class="zz-dpad"><button class="up" data-hold="up" aria-label="向上移動">↑</button><button class="left" data-hold="left" aria-label="向左移動">←</button><button class="down" data-hold="down" aria-label="向下移動">↓</button><button class="right" data-hold="right" aria-label="向右移動">→</button></div><div class="zz-touchactions"><button data-hold="action">'+esc(actionLabel())+'</button><button data-hold="dash">衝刺</button></div></div></div>';
  canvas=view.querySelector('canvas');ctx=canvas.getContext('2d');
  view.querySelectorAll('[data-hold]').forEach(el=>{
   el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);input[el.dataset.hold]=true;el.classList.add('active');if(el.dataset.hold==='action')act();});
   const end=()=>{delete input[el.dataset.hold];el.classList.remove('active');};
   ['pointerup','pointercancel','lostpointercapture'].forEach(k=>el.addEventListener(k,end));
  });
  lastFrame=0;lastCheckpoint=performance.now();raf=requestAnimationFrame(frame);canvas.focus({preventScroll:true});
 }
 let lastAction=0,lastHud=0;
 function act(){if(!s||s.phase!=='game'||paused)return;const now=performance.now();if(now-lastAction<280)return;lastAction=now;M.interact(s.world);}
 function frame(now){
  if(disposed||paused||s.phase!=='game'||document.hidden)return;
  const dt=lastFrame?Math.min(.05,(now-lastFrame)/1000):0;lastFrame=now;
  M.step(s.world,input,dt);if(input.action&&now-lastAction>480)act();draw();
  if(now-lastHud>160){updateHud();lastHud=now;}
  if(s.world.status!=='playing'){stop();settle().catch(e=>{note(e.message,true);render();});return;}
  if(now-lastCheckpoint>12000){lastCheckpoint=now;checkpoint().catch(()=>{});}
  raf=requestAnimationFrame(frame);
 }
 async function settle(){
  const result=M.recordGame(s,s.world,stage().gameId);s.phase='gameResult';
  if(!result.practice)ZH.track('minigame',{scenarioId:c.id,...result});
  await checkpoint().catch(()=>{});render();
 }
 function updateHud(){
  const w=s.world,type=w.type,done=type==='defend'?Math.min(6,w.hits):['journey','argue'].includes(type)?w.delivered.length:w.done.length;
  view.querySelector('[data-goal]').textContent=(w.assist?'練習 · ':'競技 · ')+(type==='defend'?'守備 ':'完成 ')+done+' / '+(type==='defend'?6:3)+(w.carry>=0?' · 攜帶中':type==='practice'?' · 第 '+(w.done.length+1)+' 站 '+stage().game.targets[w.done.length]:'');
  view.querySelector('[data-time]').textContent='剩餘 '+Math.max(0,Math.ceil(w.limit-w.time))+' 秒';
  view.querySelector('[data-health]').textContent='體力 '+w.hp+' / 8'+(w.cooldown>0?' · 衝刺冷卻':' · 衝刺就緒');
  view.querySelector('[data-notice]').textContent=w.noticeUntil>w.time?w.notice:'觀察場景中的金色標記，靠近後互動。';
 }
 function roundRect(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke();}}
 function label(text,x,y,color){ctx.font='bold 17px "PingFang TC",sans-serif';ctx.textAlign='center';ctx.lineWidth=5;ctx.strokeStyle='#102532';ctx.strokeText(text,x,y);ctx.fillStyle=color||'#ffe1a4';ctx.fillText(text,x,y);}
 function marker(x,y,name,done,active){
  ctx.beginPath();ctx.ellipse(x,y+8,32,12,0,0,Math.PI*2);ctx.fillStyle=done?'#74a89766':'#efd28e55';ctx.fill();
  roundRect(x-15,y-29,30,37,6,done?'#5b8a78':'#ebc875',active?'#fff5bd':'#886f46');
  ctx.fillStyle=done?'#d5ebdf':'#425d57';ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.fillText(done?'✓':'簡',x,y-3);label(name,x,y-40,done?'#b7d6c5':null);
 }
 function draw(){
  const w=s.world,t=stage(),ts=M.targets(w);ctx.clearRect(0,0,1000,560);
  if(images.scene&&images.scene.complete&&images.scene.naturalWidth)ctx.drawImage(images.scene,0,0,1000,560);
  ctx.fillStyle='#10232d69';ctx.fillRect(0,0,1000,560);
  const grd=ctx.createLinearGradient(0,110,0,550);grd.addColorStop(0,'#12313c22');grd.addColorStop(1,'#172b3be0');ctx.fillStyle=grd;ctx.fillRect(0,110,1000,450);
  ctx.strokeStyle='#dbc78c45';ctx.setLineDash([6,9]);ctx.lineWidth=2;ctx.strokeRect(40,125,920,400);ctx.setLineDash([]);
  if(w.type==='defend'){
   [205,345,475].forEach(y=>{ctx.strokeStyle='#b6c3a044';ctx.beginPath();ctx.moveTo(65,y);ctx.lineTo(940,y);ctx.stroke();});
   roundRect(40,140,24,370,6,'#b5a47a','#f5d18a');label('守備線',85,115);
   w.enemies.forEach(e=>{roundRect(e.x-24,e.y-16,48,32,8,'#ad6f57','#ffd0a2');label('攻',e.x,e.y+6,'#fff2ce');});
  }else{
   ts.forEach((point,i)=>marker(point.x,point.y,w.type==='rescue'?['近處求助','鄰里求助','遠處求助'][i]:t.game.targets[i],w.done.includes(i),w.type!=='practice'||i===w.done.length));
   if(['journey','argue'].includes(w.type)){
    ctx.beginPath();ctx.ellipse(885,187,48,17,0,0,Math.PI*2);ctx.fillStyle='#e4c47666';ctx.fill();
    if(images.npc&&images.npc.complete&&images.npc.naturalWidth)ctx.drawImage(images.npc,848,91,74,100);else marker(885,170,'記錄臺',false,true);
    label('記錄臺 · '+c.person,885,78);
   }
   if(w.type==='rescue')marker(135,440,'補給站',false,true);
  }
  M.barriers(w).forEach(b=>{roundRect(b.x,b.y,b.w,b.h,6,w.type==='seam'?'#6e8174dd':'#6c7464dd','#d0bf86aa');ctx.fillStyle='#d8ca9977';for(let y=b.y+14;y<b.y+b.h;y+=20)ctx.fillRect(b.x+5,y,b.w-10,2);});
  M.hazards(w).forEach((h,i)=>{ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,Math.PI*2);ctx.fillStyle='#ab6c5bcf';ctx.fill();ctx.strokeStyle='#edb899';ctx.stroke();label(t.game.bad[i%t.game.bad.length],h.x,h.y-h.r-8,'#ffc6a9');});
  if(w.type==='practice'){
   const p=(Math.sin(w.time*(w.assist?1.6:2.4))+1)/2,lo=w.assist?.15:.28,hi=w.assist?.85:.72;
   roundRect(350,65,300,20,5,'#112733','#b3ba9666');ctx.fillStyle='#d1ad5a';ctx.fillRect(350+300*lo,67,300*(hi-lo),16);ctx.fillStyle='#fff5c3';ctx.fillRect(350+p*292,60,8,30);label('節奏：亮點進入金色區時互動',500,45);
  }
  if(w.pulse>0){ctx.beginPath();ctx.arc(w.x,w.y,w.type==='defend'?(w.assist?150:115):55,0,Math.PI*2);ctx.strokeStyle='#e8d49bcc';ctx.lineWidth=5;ctx.stroke();ctx.fillStyle='#e0cf8112';ctx.fill();}
  ctx.beginPath();ctx.ellipse(w.x,w.y+15,23,9,0,0,Math.PI*2);ctx.fillStyle='#051a2788';ctx.fill();
  ctx.globalAlpha=w.inv>0&&Math.floor(w.inv*9)%2?.5:1;
  if(images.player&&images.player.complete&&images.player.naturalWidth)ctx.drawImage(images.player,w.x-30,w.y-67,60,84);
  else{ctx.fillStyle='#afcbba';ctx.beginPath();ctx.arc(w.x,w.y-20,16,0,Math.PI*2);ctx.fill();roundRect(w.x-18,w.y-9,36,29,8,'#527f8d','#e9d49b');}
  ctx.globalAlpha=1;if(w.carry>=0){roundRect(w.x+16,w.y-37,19,27,4,'#e5c778','#fff0b7');}
  label('你',w.x,w.y+40,'#d9f2da');
 }
 function renderGameResult(){
  const w=s.world,entry=s.games.find(x=>x.gameId===stage().gameId),won=w&&w.status==='won';
  view.innerHTML='<div class="zz-panel zz-question"><p class="zz-kicker">'+esc(stage().game.title)+' ／ '+(w.assist?'練習模式':'競技模式')+'</p><h2>'+(won?'操作完成，回到文本':'再觀察一次，重新挑戰')+'</h2><p class="zz-intro">'+(won?'你已完成這段場景任務。接著以原文證據檢查理解；操作分數不代替閱讀作答。':'時間或體力已用完。可重試或改用練習模式，已完成的閱讀與首輪成績會保留。')+'</p><div class="zz-resultstat"><div><strong>'+M.score(w)+' / 10</strong>本輪操作</div><div><strong>'+entry.firstScore+' ／ '+entry.bestScore+'</strong>首輪 ／ 最佳操作（含練習）</div></div><p class="zz-note">練習模式不上競技榜。首輪紀錄保留，重試不覆寫首輪；閱讀首答另計。</p><div class="zz-inline">'+(won?button('回讀與作答','questions',true):button('重試這段','retry',true))+button('用練習模式重試','assist')+button('查看競技成績','board')+'</div><div class="zz-board" data-board role="status"></div></div>';
  bind('retry',async()=>retry(false));bind('assist',async()=>retry(true));
  bind('questions',async()=>{s.phase='question';s.questionIndex=0;delete s.questionFeedback;await checkpoint();render();});
  bind('board',async()=>{
   const box=view.querySelector('[data-board]');box.textContent='讀取成績……';
   if(ZH.isGuest()){box.textContent='本分頁試玩不列入學校競技榜。';return;}
   try{const flushed=await ZH.flushAll();if(flushed&&flushed.ok===false)throw Error('操作紀錄尚未送出，請稍後再查詢');const r=await ZH.call('api_gameBoard',c.id,stage().gameId);if(!r||!r.ok)throw Error(r&&r.msg||'成績暫時無法讀取');const fmt=x=>x?String(x.score??x.bestScore??'—')+' / 10':'尚無成績';box.textContent='我的最佳：'+fmt(r.me)+'\n班級最佳：'+fmt(r.classBest)+'\n全校最佳：'+fmt(r.schoolBest)+(r.off?'\n教師目前關閉排行榜。':'\n排行榜約兩分鐘更新一次。');}catch(e){box.textContent=e.message;}
  });
 }
 async function retry(assist){s.assist=assist;s.world=M.create(stage().game.type,assist);s.gameAttempt++;s.phase='game';await checkpoint();render();}
 function currentQuestion(){return bank[stage().questionIds[s.questionIndex]];}
 function renderQuestion(){
  const t=stage(),q=currentQuestion();if(!q){view.innerHTML='<p role="alert">題目未就緒，請儲存後重新讀取。</p>';return;}
  const f=s.questionFeedback&&s.questionFeedback.id===q.id?s.questionFeedback:null;
  const opts=Array.isArray(q.options)?q.options:Object.entries(q.options).map(([key,v])=>({key,text:v[0],type:v[1]||''}));
  view.innerHTML='<div class="zz-panel zz-question"><p class="zz-kicker">'+esc(level())+' ／ 本段第 '+(s.questionIndex+1)+' / '+t.questionIds.length+' 題</p><h2>'+esc(q.stem)+'</h2><div class="zz-passage">'+esc(q.passage||t.passage)+'</div>'+source({...t,source:q.sourceRef||q.source||t.source})+'<details><summary>語譯提示</summary><p class="zz-gloss">'+esc(t.gloss)+'</p></details><div class="zz-options">'+opts.map(o=>'<button type="button" class="zz-option'+(f&&f.choice===o.key?(f.correct?' correct':' wrong'):'')+'" data-choice="'+esc(o.key)+'" '+(f?'disabled':'')+'><b>'+esc(o.key)+'</b><span>'+esc(o.text)+'</span></button>').join('')+'</div>'+(f?'<div class="zz-feedback" role="status"><strong>'+(f.correct?'理解正確':'請回到文本再想一次')+'</strong><p>'+esc(q.explanation||'請核對這段原文中的對象、字義與論證關係。')+'</p><p class="zz-note">首答已保留'+(s.answers[q.id].correct?'為正確':'為待釐清')+'；訂正不覆寫首答。</p></div>'+button(f.correct?(s.questionIndex+1<t.questionIds.length?'下一題':'繼續下一段'):'再答一次',f.correct?'next':'again',true):'')+'</div>';
  view.querySelectorAll('[data-choice]').forEach(el=>el.onclick=()=>guard(async()=>{
   view.querySelectorAll('[data-choice]').forEach(b=>b.disabled=true);const choice=el.dataset.choice,event=M.answer(s,q,choice);
   s.questionFeedback={id:q.id,choice,correct:event.correct};
   ZH.track('anchor',{scenarioId:c.id,anchorId:q.id,choice,...event,distractorType:event.correct?'':(opts.find(o=>o.key===choice)||{}).type||'情節',seconds:0});
   await checkpoint().catch(()=>{});render();
  }));
  bind('again',async()=>{delete s.questionFeedback;await checkpoint();render();});
  bind('next',async()=>{
   if(!s.recovered[q.id])return;s.questionIndex++;delete s.questionFeedback;
   if(s.questionIndex>=t.questionIds.length){s.stage++;s.phase=s.stage<c.stages.length?'intro':'complete';s.questionIndex=0;s.world=null;}
   await checkpoint();render();
  });
 }
 function renderComplete(){
  const answers=Object.values(s.answers),correct=answers.filter(a=>a.correct).length;
  view.innerHTML='<div class="zz-panel zz-question"><img class="zz-sectionpic" src="'+esc(images.scene&&images.scene.src||'')+'" alt="'+esc(c.person)+'的 AI 藝術場景"><p class="zz-kicker">'+esc(level())+' ／ 三段完成</p><h2>'+esc(c.episode)+' · 研讀完成</h2><div class="zz-resultstat"><div><strong>'+correct+' / '+answers.length+'</strong>閱讀首答正確</div><div><strong>'+s.games.map(g=>g.bestScore).join(' · ')+'</strong>三段最佳操作（含練習；各滿分 10）</div></div><p class="zz-intro">'+esc(c.note)+'</p><p>完成後可在結算頁回顧文本、保存反思並收錄人物與研讀札記。</p>'+button('保存通關並查看結算','finish',true)+'</div>';
  bind('finish',async()=>{
   await checkpoint();const anchors=answers.map(a=>({...a,path:a.correct?'direct':s.recovered[a.anchorId]?'fork':'fail',attempts:s.attempts[a.anchorId],recovered:!!s.recovered[a.anchorId]}));
   const events=c.stages.map((t,i)=>({kind:'reading',id:'zz_read_'+i,title:t.title,text:t.passage,source:t.source,reading:t.gloss,decision:t.game.title,anchors:t.questionIds,notes:[t.gloss],at:new Date().toISOString()}));ZH.session.set('learning:'+c.id,events);
   await ZH.codex.init();(ZH.CODEX||[]).filter(it=>it.scenarioId===c.id).forEach(it=>ZH.codex.unlock(it.type,it.id,c.id,'',{quiet:true}));
   tickClock();await ZH.finishScenario({scenarioId:c.id,mode:'history',role:c.person,roleKind:'liezhuan',faction:'先秦諸子',country:c.school,ending:{id:'zz_read_complete',title:level()+'・'+c.episode,text:'循人物之跡，據原文之證，辨其言而思其理。',good:true},anchors,games:s.games.map(g=>({gameId:g.gameId,score:g.firstScore,maxScore:10,bestScore:g.bestScore,practice:g.practice})),scoreStrategy:Math.round(s.games.reduce((n,g)=>n+g.firstScore,0)/3*10),turns:3,durationSec:Math.round(s.elapsed),deeds:['讀'+c.person+'之傳述與選文，核對出處。','歷三段場景，以操作體察文本中的問題。','首答'+answers.length+'題，答中'+correct+'題；訂正另存，不移首答。'],opener:'讀諸子者，當察其時、辨其言、問其所由。',prompts:['選一處原文，說明你的判斷依據。','遊戲操作呈現了文本的哪一面？它又省略了什麼？']});
  });
 }
 function pause(){if(!s||paused||disposed)return;tickClock();paused=true;stop();checkpoint().catch(()=>{});render();}
 function renderPause(){
  view.innerHTML='<div class="zz-panel zz-pause"><p class="zz-kicker">挑戰與計時已暫停</p><h2>稍停片刻，再讀一段</h2><p>本章有獨立存檔。回首頁前會再確認存檔完成。</p><div class="zz-inline">'+button('繼續遊戲','resume',true)+button('儲存並回首頁','leave')+'</div><p class="zz-note">若存檔失敗，請留在本頁按「儲存」重試。</p></div>';
  bind('resume',()=>{paused=false;lastClock=Date.now();render();});bind('leave',async()=>{await checkpoint();await ZH.flushAll();disposed=true;ZH.go('hub');});
 }
 function loadImage(key,url){return new Promise(resolve=>{const img=new Image();img.onload=()=>{images[key]=img;resolve(img);};img.onerror=()=>resolve(null);img.src=url;});}
 function svgUrl(svg){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);}
 async function loadArt(){
  const fallback='https://s90194yeu-collab.github.io/zongheng-game/media/scene_zhuzi_'+c.philosopher+'_ai.webp';
  const file=window.ZH_STATIC_MEDIA&&window.ZH_STATIC_MEDIA[c.scene],url=file&&window.ZH_STATIC_URL?ZH_STATIC_URL(file):fallback;
  root.style.setProperty('--zz-scene','url("'+url.replace(/["\\]/g,'')+'")');
  const npc=portrait(c.person);let player;
  try{const colorOption=ZH.player.LOOK_OPTIONS.color.find(x=>x[0]===ZH.player.profile?.appearance?.color);const robe=colorOption?.[2]||'#557f8d';player=window.ART.portrait({id:'zz_player',name:ZH.player.name(),glyph:'士',color:robe,art:{hat:'guan',robe,prop:'scroll'}},{bust:false});}catch(e){player=window.ART.portrait({id:'zz_player',name:'策士',glyph:'士',color:'#6b9e9c',art:{hat:'guan',robe:'#557f8d',prop:'scroll'}},{bust:false});}
  await Promise.all([loadImage('scene',url),loadImage('npc',svgUrl(npc)),loadImage('player',svgUrl(player))]);
 }
 async function start(options){
  bootOptions=options;root=document.getElementById('zhuzi-root');disposed=false;paused=false;busy=false;
  root.innerHTML='<div class="zz-loading"><h1>先秦諸子</h1><p role="status">讀取文本與本章進度……</p></div>';
  try{
   c=ZH.ZHUZI.chapters[options.id];if(!c)throw Error('找不到本章內容');if(!await ZH.requireStudentProfile())return;
   const [saved,questions]=await Promise.all([ZH.load(c.id,'history'),ZH.call('api_getStoryAnchors',c.id,options.anchorOrder)]);
   if(!saved||!saved.ok)throw Error(saved&&saved.msg||'讀取存檔失敗');if(!questions||!questions.ok)throw Error(questions&&questions.msg||'題庫未就緒');
   bank={};for(const q of questions.anchors||[])bank[q.id]=q;
   if(options.anchorOrder.some(id=>!bank[id]||!['A','B','C','D'].includes(bank[id].answer)))throw Error('必要題目缺漏，請重新讀取題庫');
   const old=saved.state;
   if(old&&old.schema==='zhuzi-v1'&&old.chapterId===c.id){s=Object.assign(M.fresh(c.id),old);if(!Number.isInteger(s.stage)||s.stage<0||s.stage>3||!['intro','game','gameResult','question','complete'].includes(s.phase))throw Error('本章存檔格式無法辨認，請從首頁管理自己的紀錄');}
   else if(old)throw Error('本章存檔版本不相符，請從首頁管理自己的紀錄');else s=M.fresh(c.id);
   ZH.runs.begin(c.id,s,'history');await ZH.player.load().catch(()=>{});lastClock=Date.now();await loadArt();render();if(old)note('已讀取本章存檔，首答與首輪紀錄保留');
  }catch(e){root.innerHTML='<div class="zz-loading"><h1>先秦諸子暫時無法開啟</h1><p role="alert">'+esc(e.message)+'</p>'+button('重新讀取文本與進度','reload',true)+button('回首頁','home')+'</div>';root.querySelector('[data-action=reload]').onclick=()=>start(bootOptions);root.querySelector('[data-action=home]').onclick=()=>ZH.go('hub');}
 }
 document.addEventListener('keydown',e=>{
  if(!s||disposed||busy||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;
  if(e.code==='Escape'){e.preventDefault();if(paused){paused=false;lastClock=Date.now();render();}else pause();return;}
  if(s.phase!=='game'||paused)return;if(keys[e.code]){e.preventDefault();input[keys[e.code]]=true;}
  if(e.code==='KeyE'){e.preventDefault();input.action=true;if(!e.repeat)act();}
 });
 document.addEventListener('keyup',e=>{if(keys[e.code])delete input[keys[e.code]];if(e.code==='KeyE')delete input.action;});
 window.addEventListener('blur',()=>{clearInput();if(s&&s.phase==='game'&&!paused)pause();});
 document.addEventListener('visibilitychange',()=>{clearInput();if(document.hidden&&s&&!paused)pause();lastClock=Date.now();});
 window.addEventListener('pagehide',()=>{disposed=true;stop();});
 ZH.zhuzi={start};
})(window.ZH);
</script>
