<script>(function(global){'use strict';
const copy=v=>JSON.parse(JSON.stringify(v)),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));

function clockwork(s,limit,active,score,complete){
 const record=a=>{if(s.actions.length<100)s.actions.push({...a,step:s.cursor+1});s.guideSteps+=Number(s.assisted);};
 const first=(early=false)=>({score:early?0:score(),max:10,passed:!early&&complete()&&score()>=6,elapsed:s.elapsed,firstAnswers:copy(s.firstAnswers)});
 return{record,snapshot:()=>copy(s),finish(){s.first=s.first||first();s.phase=s.assisted||s.first.passed?'done':'failed';s.resumePhase='done';},advance(dt){if(s.paused||s.assisted||!active.includes(s.phase))return false;dt=clamp(dt,0,limit);s.elapsed+=dt;s.left=Math.max(0,s.left-dt);if(!s.left){s.first=s.first||first();s.resumePhase=s.phase;s.phase='failed';s.note='時限已到，首次原分保留；請親自補足操作，沒有代你完成。';return true;}return false;},assist(){if(s.assisted||s.phase==='done')return false;s.first=s.first||first(true);s.assisted=true;s.paused=false;if(s.phase==='failed')s.phase=s.resumePhase;s.note='已顯示適合的操作提示，仍須親做，首次原分保留。';return true;},result(extra){return copy({...s.first,completed:s.phase==='done'&&complete(),assisted:s.assisted,guideSteps:s.guideSteps,completion:extra});}};

function kaoshi(saved,rng){const s=saved?copy(saved):{kind:'kaoshi',phase:'plan',cursor:0,left:65,elapsed:0,leather:0,cattle:0,alarm:false,delivered:false,firstGift:null,firstAnswers:{},options:SPEECHES.map(q=>shuffle([q.answer,...q.others],rng)),hits:0,streak:0,maxStreak:0,replies:[],readReports:0,actions:[],guideSteps:0,assisted:false,paused:false,note:'先看秦軍來路；按開始後親備禮、派報、送禮。'};

n_01:async ctx=>{await scene(ctx,'zheng','鄭・北門','前630年・圍鄭退師之後',['xiangao','shiguan']);await ctx.chapter('第九話　殽之戰','一位商人的急報，怎樣接上國家的警備？');await ctx.say([{text:'你是鄭國商人弦高。上一段秦晉圍鄭，燭之武說動秦伯撤軍，秦留下杞子、逢孫、楊孫戍鄭。那時的盟約，並不保證留守者此後永無異心。'},{who:'xiangao',expr:'normal',text:'做買賣靠看貨、看路，也得看人。下趟帶牛赴周，先問問道路是否安穩。'},{who:'shiguan',expr:'serious',text:'本話以弦高為主角。先看他尚不知道的秦國軍議；遇秦師後由你應對，再明示切換鄭國查證與晉國軍令。各人做的事，不能全算成商人一人完成。'}]);return 'n_02';},
n_02:async ctx=>{await scene(ctx,'qin','秦・遠襲之議','前628年冬',['mugong','qizi','jianshu']);await ctx.say([{text:'前628年，鄭文公與晉文公先後卒。鄭穆公、晉襄公接位。杞子從鄭遣使告秦，稱鄭人使他掌北門之管，可以配合潛師取鄭。'},{who:'mugong',expr:'normal',text:'北門在手，鄭國是否便唾手可得？'},{who:'jianshu',expr:'serious',text:'先看這封信的條件，別把一把城門鎖鑰，當成一座國家已經到手。'}]);return 'n_03';},
n_03:async ctx=>{await scene(ctx,'qin','秦・北門之管','內應不等於全局',['qizi','mugong','jianshu']);await ctx.say([{who:'qizi',expr:'smirk',text:'鄭人使我掌其北門之管，若潛師以來，國可得也。'},{text:'這是杞子傳來的話，不是鄭君邀秦來攻的國書。'}]);await ctx.anchor('xo_01');return 'n_04';},
n_04:async ctx=>{await scene(ctx,'qin','秦・蹇叔諫遠襲','師勞、敵備',['mugong','jianshu']);await ctx.say([{who:'jianshu',expr:'serious',text:'勞師以襲遠，非所聞也。師勞力竭，遠主備之，無乃不可乎！'},{who:'mugong',expr:'serious',text:'有內應，還要怕長路？'},{text:'白話追問為教學情境。讀蹇叔把哪些條件相連，再判斷內應能否抵消它們。'}]);await ctx.anchor('xo_02');return 'n_05';},
n_05:async ctx=>{await scene(ctx,'qin','秦・千里與保密','徒勞之後的軍心',['jianshu','mugong']);await ctx.say([{who:'jianshu',expr:'worried',text:'師之所為，鄭必知之。勤而無所，必有悖心。且行千里，其誰不知？'},{who:'shiguan',expr:'serious',text:'不是只看出發時的機會，也要推到走完長路、目的失效之後，隊伍會怎麼變。'}]);await ctx.anchor('xo_03');return 'n_06';},
n_06:async ctx=>{await scene(ctx,'qindoor','秦・東門之外','出師與哭送',['jianshu','mengming','jianzi']);const v=await choice(ctx,'risk',{title:'回看這場軍議，你會把什麼寫進出征前的核對單？',text:'秦穆公拒諫出師是本話史實；此選擇記錄你理解軍事判斷的方式。',options:[{label:'把師勞、保密、敵備、歸路一同核對；內應只是其中一項條件。',value:'listen'},{label:'有北門鎖鑰就能忽略所有路程與軍心風險。',value:'key'}]});ctx.add('heart',v==='listen'?10:0);await ctx.say([{text:'秦穆公不聽，召孟明、西乞、白乙出師。蹇叔哭送。'},{who:'mengming',expr:'worried',text:'老人看著軍隊，哭聲不是送行的喜聲。'}]);await ctx.anchor('xo_04');ctx.unlock('person:cq_mengming');ctx.unlock('text:jianshukushi');return 'n_07';},
n_07:async ctx=>{await scene(ctx,'road','秦・東行軍路','蹇叔之子亦隨軍',['jianshu','jianzi']);await ctx.say([{who:'jianshu',expr:'sad',text:'晉人禦師必於殽，殽有二陵焉。其南陵，夏後皋之墓也。其北陵，文王之所辟風雨也。必死是間，余收爾骨焉。'},{who:'jianzi',expr:'worried',text:'父親的警告落在一段必經的險路，不只落在一句不祥的話。'},{text:'秦師遂東。兩陵地形將在後面的教學沙盤出現；格位與旗令為推演，不能當成原文已記的部署。'}]);await ctx.anchor('xo_05');return 'n_08';},
n_08:async ctx=>{await scene(ctx,'zhou','周・北門','前627年春・秦軍過周',['wangsunman','shiguan']);await ctx.say([{text:'秦師過周北門，左右免冑而下，繼又超乘炫示。王孫滿尚幼，觀之，言於王。'},{who:'wangsunman',expr:'serious',text:'秦師輕而無禮，必敗。輕則寡謀，無禮則脫。入險而脫，又不能謀，能無敗乎？'},{who:'shiguan',expr:'serious',text:'王孫滿把輕慢推到少謀與失戒。別只留下「失禮必敗」四字，而忘了險地裡的軍紀。'}]);await ctx.anchor('xo_06');return 'n_09';},
n_09:async ctx=>{await scene(ctx,'market','滑・往周之路','回到弦高',['xiangao','huoji','mengming']);await ctx.chapter('第一幕　商人犒師','備禮、派報、說辭，一件也不能少');await ctx.say([{text:'及滑，鄭商人弦高將市於周，遇之。秦軍出現在你的路上。你並不是本已受國君差遣的使者。'},{who:'huoji',expr:'surprised',text:'帶著牛去周市，卻撞上整支秦軍！'},{who:'xiangao',expr:'serious',text:'不能先露出城內毫不知情。用禮穩住軍中，再把消息趕快送回去。'},{text:'以乘韋先，牛十二，犒師。'}]);await ctx.anchor('xo_07');ctx.unlock('person:cq_xiangao');ctx.unlock('treasure:chengwei');ctx.unlock('treasure:cq09_shierniu');return 'n_10';},
n_10:async ctx=>{await scene(ctx,'road','滑・犒秦師','假示有備，急報成備',['xiangao','mengming','huoji']);await ctx.say([{who:'mengming',expr:'serious',text:'鄭國為何有人到此？'},{text:'這句追問為教學情境。接著依原文，辨商人如何以君命姿態表達有備，並急報鄭。'}]);await ctx.anchor('xo_08');await ctx.say([{who:'xiangao',expr:'serious',text:'牽來十二牛，備好四張韋皮。你去急報鄭國，我留在軍前接著說。'},{text:'接下來由你親備禮、親派急報、親送犒師，再回應六次。台詞之外的追問是教學安排，閱讀回報停表。'}]);return 'n_11';},
n_11:async ctx=>{const r=await challenge(ctx,'wen_xo_kaoshi','kaoshi','弦高犒師・牛與辭令','親備四張韋皮、十二牛，親派急報與犒師，完成六次應對及回報。');ctx.add('crown',firstScore(r)*2);ctx.unlock('idiom:xiangaokaoshi');await ctx.say([{text:'弦高的話讓秦軍推斷鄭已有備。急報必須接上城內查察；畫面現在明示切換到鄭穆公，並不說弦高已親自進入客館。'}]);return 'n_12';},
n_12:async ctx=>{await scene(ctx,'room','鄭・客館','暫時扮演鄭穆公',['zhengbo','huangwuzi','shiguan']);await ctx.chapter('第二幕　讓警訊成為證據','先查，再辭，再備');await ctx.say([{text:'鄭穆公使視客館，則束載、厲兵、秣馬矣。使皇武子辭焉。'},{who:'huangwuzi',expr:'serious',text:'來訊、所見、處置，要分清。能查的事，就先派人去查。'}]);await ctx.anchor('xo_09');const v=await choice(ctx,'audit',{title:'商人急報和客館查察，怎麼一起使用？',text:'原文已記查館；這次選擇評你如何對待證據。',options:[{label:'保留警訊，但把內應準備交給客館查察核驗，再決定處置。',value:'verify'},{label:'把任何外來急報都視為已完成調查，直接替它補上所有內情。',value:'assume'}]});ctx.add('heart',v==='verify'?10:0);return 'n_13';},
n_13:async ctx=>{const r=await challenge(ctx,'xo_intel','intel','北門查證・三份證據','親讀三份證據，親送三輪會勘，最後下警備與辭客令。');ctx.add('shield',firstScore(r)*2);await ctx.say([{who:'huangwuzi',expr:'serious',text:'吾子淹久於敝邑，唯是脯資，餼牽竭矣。為吾子之將行也，鄭之有原圃，猶秦之有具囿也。吾子取其麋鹿，以閒敝邑，若何？'},{text:'用供給將盡與獵場比喻婉辭秦戍者。杞子奔齊，逢孫、楊孫奔宋；不是在客館展開遊戲自創的屠戍。'}]);return 'n_14';},
n_14:async ctx=>{await scene(ctx,'road','秦・回軍之議','鄭已成備',['mengming','xiqi','baiyi']);await ctx.say([{who:'mengming',expr:'worried',text:'鄭有備矣，不可冀也。攻之不克，圍之不繼，吾其還也。'},{text:'襲鄭的前提已失效。攻城未必克，圍城後續無法接上；秦軍決定回師，卻滅滑而還。滑不是鄭都。這次侵害也進入晉國軍議。'}]);await ctx.anchor('xo_10');return 'n_15';},
n_15:async ctx=>{await scene(ctx,'camp','晉・秦師歸路之議','暫時扮演晉襄公',['xianggong','xianzhen','luanzhi']);await ctx.chapter('第三幕　兩陵間的軍令','遠襲的歸路，也是鄰國的防線');await ctx.say([{who:'luanzhi',expr:'worried',text:'未報秦施而伐其師，其為死君乎？'},{who:'xianzhen',expr:'serious',text:'秦不哀吾喪而伐吾同姓，秦則無禮，何施之為？吾聞之，一日縱敵，數世之患也。謀及子孫，可謂死君乎！'},{text:'欒枝記秦施，先軫重長期防禦與秦侵同姓。不是晉軍只因父喪就可以不問軍議；兩種責任正有衝突。'}]);await ctx.anchor('xo_11');ctx.unlock('idiom:yirizongdi');return 'n_16';},
n_16:async ctx=>{await scene(ctx,'mountain','殽・兩陵險道','前627年・父喪與出師',['xianggong','jiangrong','xianzhen']);await ctx.say([{text:'遂發命，遽興姜戎。子墨衰絰，梁弘御戎，萊駒為右。'},{who:'xianggong',expr:'serious',text:'此時的我，是晉襄公，不是已卒的父親重耳。召起姜戎，共同迎擊秦師。'},{who:'shiguan',expr:'serious',text:'接下來親放北側、南側與西口三隊，等秦軍進入險道，再送協同旗令。原文記共同敗秦於殽；具體格位、旗令次序、部隊數為教學推演。'}]);await ctx.anchor('xo_12');ctx.unlock('person:cq_jinxianggong');ctx.unlock('treasure:cq09_moshuaidie');return 'n_17';},
n_17:async ctx=>{const r=await challenge(ctx,'xo_ambush','ambush','殽山伏擊・兩陵間的軍令','親放三隊，親判三次隱蔽時機，送三道旗令並收軍看守俘將。');setMeter(ctx,'shield',r.completion?.force||0);return 'n_18';},
n_18:async ctx=>{await scene(ctx,'battle','殽・戰後','晉人及姜戎敗秦師',['xianggong','xianzhen','mengming']);await ctx.say([{text:'夏，四月，辛巳，敗秦師於殽，獲百里孟明視、西乞術、白乙丙以歸。晉遂墨以葬文公。'},{who:'shiguan',expr:'serious',text:'秦敗、三帥被獲是史實。兵力分數評你的部署與操作，沒有以高分改寫秦勝；三隊沙盤也不代替全部參戰者。'}]);const v=await choice(ctx,'restraint',{title:'戰後你如何理解收軍與看守俘將？',text:'收軍是本關必要操作；這題再評取捨的理由。',options:[{label:'依令整隊、處理俘將與軍議；不要讓單隊追逐破壞整體控制。',value:'guard'},{label:'只追求繼續消耗，不必回報、整隊或交接俘將。',value:'pursue'}]});ctx.add('heart',v==='guard'?10:0);return 'n_19';},
n_19:async ctx=>{await scene(ctx,'hall','晉・文嬴請三帥','說辭與結果',['wenying','xianggong','xianzhen']);await ctx.say([{who:'wenying',expr:'serious',text:'彼實構吾二君。寡君若得而食之，不厭，君何辱討焉？使歸就戮於秦，以逞寡君之志，若何？'},{text:'文嬴以三帥挑起兩君衝突、可使歸秦受戮為由請釋。這是請求時的說辭，不是秦國已發生的處刑。'}]);await ctx.anchor('xo_13');ctx.unlock('person:cq_wenying');return 'n_20';},
n_20:async ctx=>{await scene(ctx,'river','河・追三帥','三帥已在舟中',['yangchufu','mengming']);await ctx.say([{text:'晉襄公許釋。先軫朝問秦囚，聞釋大怒；公使陽處父追，及諸河，則在舟中矣。陽處父釋左驂，以公命贈孟明。'},{who:'mengming',expr:'serious',text:'君之惠，不以纍臣釁鼓，使歸就戮於秦。寡君之以為戮，死且不朽。若從君惠而免之，三年將拜君賜。'},{who:'shiguan',expr:'serious',text:'孟明的謝辭也含未來回報的張力。放與追、恩與患，不在一個按鈕之內就全結束。'}]);ctx.unlock('person:cq_yangchufu');return 'n_21';},
n_21:async ctx=>{await scene(ctx,'qindoor','秦・郊外迎師','素服、哭師、認過',['mugong','mengming','jianshu']);await ctx.say([{text:'秦伯素服郊次，鄉師而哭。'},{who:'mugong',expr:'sad',text:'孤違蹇叔，以辱二三子，孤之罪也！'},{text:'不替孟明。秦穆公又說：'},{who:'mugong',expr:'sad',text:'孤之過也！大夫何罪？且吾不以一眚掩大德。'},{text:'尾聲不是處決三帥：穆公承認拒諫是自己的過失，沒有罷黜孟明。'}]);await ctx.anchor('xo_14');ctx.unlock('idiom:yishengyandade');const v=await choice(ctx,'responsibility',{title:'把這次失敗寫進檢討，哪一項能接上承責？',text:'穆公認過、續用孟明是史實；你選的是對這段結果的理解。',options:[{label:'認決策過失、檢討遠襲條件，並保留對人才德能的完整評價。',value:'own'},{label:'續用就代表沒有過錯，以後仍可忽略所有不順耳的警告。',value:'excuse'}]});ctx.add('heart',v==='own'?10:0);return 'n_22';},
n_22:async ctx=>{await scene(ctx,'academy','鄭・回看一封急報','回到弦高',['xiangao','huoji','shiguan']);await ctx.say([{who:'xiangao',expr:'serious',text:'十二頭牛換不了一座長久安全的城。它只穩住眼前對話；急報、查察、警備，得有人接下去。'},{who:'huoji',expr:'normal',text:'途中見到的軍情，和館內查出的準備，各自有證據的位置。'},{who:'shiguan',expr:'serious',text:'你完成三個視角的必要操作。弦高沒有指揮殽戰；鄭有備也不等於秦晉從此再無戰事。'}]);return 'n_23';},
n_23:async ctx=>{await scene(ctx,'mountain','殽・再讀遠襲','從保密到歸路',['shiguan','jianshu']);await ctx.say([{who:'shiguan',expr:'serious',text:'把蹇叔的師勞、敵備、難保密，接上弦高的說辭與急報，再接秦軍回路、晉的防禦與兩陵險地。這些條件一起作用，不是猜中神諭。'},{who:'jianshu',expr:'serious',text:'且行千里，其誰不知？'},{text:'兵家的學習在此是看條件、情報與風險，不只記奇招。完話後中央史冊會收兵家；不由本話再製一張重複卡。'}]);return 'n_24';},
n_24:async ctx=>{await scene(ctx,'academy','鄭・你的史官筆記','原文與首次操作',['xiangao','shiguan']);const v=await choice(ctx,'reflection',{title:'你準備用哪條線索寫反思？',text:'選擇方向不計分；結算請結合原文與一次首次操作。',options:[{label:'商人的假示有備，怎樣靠急報、查館變成真有備？',value:'report'},{label:'北門之管為何不能抵消遠襲、入險與軍心的風險？',value:'risk'},{label:'文嬴的說辭與穆公的結果不同，怎樣分清說辭、事實、承責？',value:'account'}]});await ctx.say([{who:'shiguan',expr:'serious',text:v==='report'?'寫出犒師與城內查證的接續，分清每個人完成的事。':v==='risk'?'引用蹇叔一句話，再用一次隱蔽或旗令說明條件如何相連。':'把請釋理由與秦穆公實際行動對讀，不把一方說辭直接當成結果。'}]);return 'n_25';},
n_25:async ctx=>{await scene(ctx,'zheng','鄭・城門仍在','本局評語',['xiangao','huoji']);await ctx.say([{who:'xiangao',expr:'normal',text:'沒有官爵的人，也能先把危險看見，把該送的消息送出去。餘下的，讓各有責任的人接續。'},{text:'三項必要體驗已親做。鄭有備、秦滅滑而還、晉與姜戎敗秦於殽、三帥獲釋、穆公認過的史實不變，結算評你如何作判斷。'}]);const strategy=ctx.state.vars.kaoshi.firstScore*4+ctx.state.vars.intel.firstScore*3+ctx.state.vars.ambush.firstScore*3;return ctx.end({key:strategy>=75&&ctx.meter('heart')>=70?'great':strategy>=45?'good':'bad'});}

const ENDINGS={great:{key:'great',title:'以智全鄭',text:'你把犒師、急報、查證與警備接合，也在首次軍令中理解條件與協同。史實仍是鄭有備、秦敗於殽、三帥獲釋、穆公認過。',good:true},good:{key:'good',title:'商人救鄭',text:'必要操作皆已親做。再回看首次說辭、證據選擇與軍令，說明誰完成了哪一步。史實仍是鄭有備、秦敗於殽、三帥獲釋、穆公認過。',good:true},bad:{key:'bad',title:'以敗為鑑',text:'你已親做補足必要體驗。用原文檢討錯判與失令，重試的最佳分不會抹去首次紀錄。史實仍是鄭有備、秦敗於殽、三帥獲釋、穆公認過。',good:false}};
function payload(s,ending){const a=s.vars.kaoshi.firstScore,b=s.vars.intel.firstScore,c=s.vars.ambush.firstScore,v=(Number(s.vars.choices.risk==='listen')+Number(s.vars.choices.audit==='verify')+Number(s.vars.choices.restraint==='guard')+Number(s.vars.choices.responsibility==='own')+Number(firstGood(game.ctx,'xo_14')))*20;return{scenarioId:SID,chapterVersion:VERSION,runId:s.vars.runId,mode:MODE,faction:'鄭',country:'鄭',role:'弦高',roleKind:'liezhuan',bioTitle:'弦高列傳',bioOpening:'弦高者，鄭之商人也。',ending,scoreStrategy:Math.round(a*4+b*3+c*3),scoreVirtue:v,turns:s.steps,durationSec:Math.min(5400,Math.round((Date.now()-s.startedAt)/1000)),deeds:['前628年秦議遠襲；辨北門之管、師勞敵備與歸路，讀蹇叔哭師。','前627年秦過周北門，王孫滿從輕慢推到寡謀與入險失戒。','扮弦高親備乘韋、十二牛，派急報、送犒師、回應六句並讀六次回報；首次'+a+'分。','暫扮鄭穆公，親讀三份證據、送三輪會勘、下警備與辭客令；首次'+b+'分。','孟明見鄭有備，判攻不克、圍不繼，秦滅滑而還；滑不是鄭都。','暫扮晉襄公，親放三隊、判三次隱蔽、送三道旗令並收軍；首次'+c+'分。主線晉與姜戎敗秦於殽、獲三帥。','對讀文嬴請釋、陽處父追至河，分清請求的說辭與實際後果。','秦穆公承認孤違蹇叔、不以一眚掩大德，續用孟明；回到弦高反思接續責任。'],anchors:copy(s.anchors),games:copy(s.games),codex:s.codex.slice(),opener:'遊戲史官評語（自擬）：弦高以市人遇師，韋與牛為先，言寡君已聞，而使遽告於鄭。言有其勢，事有其承；非一人盡能查館與禦師也。蹇叔論遠襲，見師勞而敵備，遠行而難密，歸路而有險；穆公始違之，終哭而認過。及秦滅滑，晉議秦施與後患，興姜戎而敗秦於殽。三帥既獲，文嬴請釋，所言歸戮，與穆公實際承責續用不同。此局記親備、親報、親查、親令，以首次之取捨求其因果。商人之智，在知危而使各司其責；國君之責，在受警而察、敗後而改。不可只記奇招，亦不可以一眚抹德；沙盤評學習，不改史事。',prompts:['引用弦高的一句犒師原文，結合你備禮或應對的一次首次操作，說明「假示已有備」怎樣靠急報、查館接成真警備；分清商人與國君各做了什麼。','引用蹇叔的一句話，結合殽山一次部署、隱蔽或旗令，說明北門之管為何不能抵消路程、保密、敵備與歸路的風險；指出哪部分是原文，哪部分是教學推演。','對讀文嬴請釋與秦穆公認過，說明說辭與實際結果的差別。「不以一眚掩大德」和承擔過失能否並存？結合你的一次查證選擇回答。'],experience:{firstAnchors:copy(s.vars.firstAnchors),kaoshi:copy(s.vars.kaoshi),intel:copy(s.vars.intel),ambush:copy(s.vars.ambush),decisions:copy(s.vars.choices)}};}
