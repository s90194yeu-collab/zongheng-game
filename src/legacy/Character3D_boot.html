<!-- Lazy rigged hero workshop. Appearance saves use the existing profile revision API. -->
<script>
(function(ZH){
  'use strict';
  const ASSETS=null; // CHARACTER3D_ASSETS
  if(!ASSETS||ZH.character3d)return;
  let controller=null,request=null,epoch=0,opened=false,app=null,paused=false,selectedColor='jade';
  const names={idle:'待機',walk:'走路',run:'跑步',bow:'行禮'};
  let selectedLook=null;
  async function createEditor(host,options={}){
    app=app||import(ZH_STATIC_URL(ASSETS.app)).catch(error=>{app=null;throw error;});
    const module=await app,low=options.quality==='low'||(options.quality!=='high'&&innerWidth<700);
    return module.createPreview(host,{...options,modelUrl:ZH_STATIC_URL(low?ASSETS.heroMobile:ASSETS.hero)});
  }
  function init(){
    const section=document.getElementById('character3d-pilot');if(!section)return;
    section.innerHTML='<div class="c3-intro"><div><p class="c3-eyebrow">策士造型工坊 · 原創角色</p><h2>古風策士，三套衣裝</h2><p class="zh-dim">轉動鏡頭近看人物，換上書院服、行旅服或輕甲，再帶進博物館村。</p></div><button type="button" class="zh-btn zh-btn--primary" data-c3-open aria-expanded="false" aria-controls="c3-content">開啟古風策士試看</button></div><div id="c3-content" hidden><p class="c3-note">這一款為成年男策士，保留束髮與玉簪。可調整三套服裝、衣色、膚色與髮色；儲存後，我的策士與村莊會使用同一套搭配。</p><div class="c3-layout"><div class="c3-host" data-c3-host></div><div class="c3-tools"><h3>專屬衣裝</h3><div class="c3-actions" role="group" aria-label="角色服裝"><button type="button" data-c3-outfit="scholar" aria-pressed="true">書院服</button><button type="button" data-c3-outfit="traveler" aria-pressed="false">行旅服</button><button type="button" data-c3-outfit="armor" aria-pressed="false">輕甲</button></div><h3>讓策士動一動</h3><div class="c3-actions" role="group" aria-label="試看角色動作"><button type="button" data-c3-motion="idle" aria-pressed="true">待機</button><button type="button" data-c3-motion="walk" aria-pressed="false">走路</button><button type="button" data-c3-motion="run" aria-pressed="false">跑步</button><button type="button" data-c3-motion="bow" aria-pressed="false">行禮</button></div><h3>衣服配色</h3><div class="c3-colors" role="group" aria-label="試看衣服配色">'+[['jade','青玉','#46745f'],['ink','墨藍','#47627a'],['amber','琥珀','#967342'],['crane','白鶴','#84959f'],['plum','梅紅','#986579'],['moon','月紫','#77749d'],['peach','桃粉','#c68e91'],['sky','晴空','#73a2ad']].map(([id,label,color])=>'<button type="button" data-c3-color="'+id+'" aria-pressed="'+(id==='jade')+'"><i style="background:'+color+'" aria-hidden="true"></i>'+label+'</button>').join('')+'</div><label class="c3-quality">畫質<select data-c3-quality><option value="auto">依裝置調整</option><option value="low">流暢</option><option value="high">精緻</option></select></label><div class="c3-actions"><button type="button" data-c3-pause aria-pressed="false">暫停動作</button><button type="button" data-c3-reset>鏡頭回正</button><button type="button" data-c3-photo>下載角色照片</button></div><p class="zh-small zh-dim">拖曳旋轉，滾輪或雙指縮放。也可聚焦畫面後使用方向鍵與加減鍵。</p><p role="status" aria-live="polite" data-c3-status>準備試看角色。</p><button type="button" class="zh-btn" data-c3-retry hidden>重新載入角色</button><button type="button" class="zh-btn zh-btn--primary" data-c3-save>套用這套造型</button><button type="button" class="zh-btn zh-btn--quiet" data-c3-close>返回我的造型</button></div></div></div>';
    const content=section.querySelector('#c3-content'),host=section.querySelector('[data-c3-host]'),status=section.querySelector('[data-c3-status]'),openButton=section.querySelector('[data-c3-open]'),editor=document.getElementById('profile-player');
    const controls=[...section.querySelectorAll('[data-c3-motion],[data-c3-outfit],[data-c3-save],[data-c3-color],[data-c3-pause],[data-c3-reset],[data-c3-photo],[data-c3-quality]')];
    function enabled(value){controls.forEach(control=>control.disabled=!value);}
    function state(value){
      if(!opened)return;
      section.querySelectorAll('[data-c3-motion]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.c3Motion===value.motion)));
      section.querySelector('[data-c3-pause]').setAttribute('aria-pressed',String(value.paused));
      section.querySelector('[data-c3-pause]').textContent=value.paused?'繼續動作':'暫停動作';
      status.textContent=value.status==='lost'?'立體畫面暫時中斷，請重新載入角色。':value.reduced?'依減少動態設定，顯示靜態姿勢。':value.paused?'動作已暫停，可繼續旋轉與換色。':names[value.motion]+'中。';
      section.querySelector('[data-c3-retry]').hidden=value.status!=='lost';enabled(value.status!=='lost');
    }
    async function open(){
      opened=true;paused=false;const token=++epoch;request?.abort();request=new AbortController();
      controller?.dispose();controller=null;editor.hidden=true;content.hidden=false;openButton.hidden=true;openButton.setAttribute('aria-expanded','true');
      enabled(false);status.textContent='正在準備古風策士……';section.querySelector('[data-c3-retry]').hidden=true;
      host.innerHTML='<p class="c3-loading" role="status">角色準備中……</p>';
      try{
        app=app||import(ZH_STATIC_URL(ASSETS.app)).catch(error=>{app=null;throw error;});
        const module=await app;if(token!==epoch||!opened)return;
        await ZH.player?.load();if(token!==epoch||!opened)return;const current=ZH.player?.profile?.appearance||{};
        if(!selectedLook){selectedLook={...current,outfit:['scholar','traveler','armor'].includes(current.outfit)?current.outfit:'scholar'};selectedColor=current.color||'jade';}selectedLook.color=selectedColor;
        section.querySelectorAll('[data-c3-color]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.c3Color===selectedColor)));
        const quality=section.querySelector('[data-c3-quality]').value,low=quality==='low'||(quality!=='high'&&innerWidth<700);
        const view=await module.createPreview(host,{modelUrl:ZH_STATIC_URL(low?ASSETS.heroMobile:ASSETS.hero),appearance:selectedLook,color:selectedColor,quality,signal:request.signal,onState:state});
        if(token!==epoch||!opened){view.dispose();return;}
        controller=view;section.querySelectorAll('[data-c3-outfit]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.c3Outfit===selectedLook.outfit)));enabled(true);host.querySelector('canvas')?.focus({preventScroll:true});
      }catch(error){if(token!==epoch||!opened)return;host.replaceChildren();status.textContent=error.name==='AbortError'?'已停止載入。':error.message||'角色暫時無法載入，請重試。';section.querySelector('[data-c3-retry]').hidden=false;}
    }
    function close(){opened=false;++epoch;request?.abort();request=null;controller?.dispose();controller=null;content.hidden=true;editor.hidden=false;openButton.hidden=false;openButton.setAttribute('aria-expanded','false');openButton.focus();}
    openButton.onclick=open;section.querySelector('[data-c3-close]').onclick=close;section.querySelector('[data-c3-retry]').onclick=open;
    section.querySelectorAll('[data-c3-motion]').forEach(button=>button.onclick=()=>{if(controller){paused=false;controller.play(button.dataset.c3Motion);}});
    section.querySelectorAll('[data-c3-color]').forEach(button=>button.onclick=()=>{if(controller?.setColor(button.dataset.c3Color)){selectedColor=button.dataset.c3Color;selectedLook.color=selectedColor;section.querySelectorAll('[data-c3-color]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));}});
    section.querySelectorAll('[data-c3-outfit]').forEach(button=>button.onclick=()=>{selectedLook.outfit=button.dataset.c3Outfit;controller?.setAppearance(selectedLook);section.querySelectorAll('[data-c3-outfit]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));});
    section.querySelector('[data-c3-save]').onclick=async()=>{enabled(false);try{await ZH.player.saveAppearance({...selectedLook,characterStyle:'hero'});status.textContent=ZH.isGuest()?'已套用；訪客造型只留在本分頁。':'已儲存；回到村莊就會換上這套造型。';}catch(error){status.textContent=error.message;}finally{if(opened)enabled(true);}};
    section.querySelector('[data-c3-pause]').onclick=()=>{paused=!paused;controller?.setPaused(paused);};
    section.querySelector('[data-c3-reset]').onclick=()=>controller?.reset();
    section.querySelector('[data-c3-quality]').onchange=open;
    section.querySelector('[data-c3-photo]').onclick=()=>{try{if(!controller)return;const link=document.createElement('a');link.href=controller.snapshot();link.download='縱橫鼎業_古風策士.png';link.click();status.textContent='已準備角色照片。';}catch(error){status.textContent=error.message;}};
    window.addEventListener('pagehide',event=>{if(event.persisted)controller?.setPaused(true);else{request?.abort();controller?.dispose();controller=null;}});
    window.addEventListener('pageshow',event=>{if(event.persisted&&controller)controller.setPaused(paused);});
    ZH.character3d={open,close,createEditor,inspect:()=>controller?.inspect()||{opened,loading:!!request},get active(){return !!controller;}};
  }
  ZH.ready(init);
})(window.ZH);
</script>
<style>
.c3-panel{margin:0 0 22px;border:1px solid #8a7953;border-radius:14px;background:linear-gradient(125deg,#243e43,#1b2b36);padding:20px;color:var(--text,#f3ead5)}.c3-intro{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}.c3-eyebrow{color:#d9bd7f;font-size:12px;letter-spacing:.1em;margin:0 0 8px}.c3-intro h2{font-size:23px;color:#eddbac;margin:0 0 8px}.c3-intro p{line-height:1.7}.c3-note{border-left:3px solid #b89d68;padding:10px 14px;margin:18px 0;background:#142a34;line-height:1.7;font-size:14px}.c3-layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(250px,1fr);gap:20px;margin-top:18px}.c3-host{height:480px;max-height:66dvh;min-height:320px;position:relative;overflow:hidden;border:1px solid #69827c;border-radius:12px;background:#172e36;display:grid;place-items:center}.c3-canvas{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;display:block;width:100%;height:100%;outline-offset:-4px;touch-action:none}.c3-canvas:focus-visible{outline:3px solid #f3d690}.c3-loading{color:#eddbac}.c3-tools h3{margin:8px 0 12px;color:#e7d7b1;font-size:16px}.c3-actions,.c3-colors{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 20px}.c3-actions button,.c3-colors button,.c3-quality select{font:inherit;min-height:44px;border:1px solid #71857f;border-radius:8px;color:#f4ead2;background:#243e48;padding:9px 13px;cursor:pointer}.c3-actions button[aria-pressed=true],.c3-colors button[aria-pressed=true]{border-color:#eed49a;background:#405a59;box-shadow:inset 0 0 0 1px #eed49a}.c3-colors button{display:flex;align-items:center;gap:8px}.c3-colors i{display:inline-block;width:17px;height:17px;border:1px solid #b6b8a5;border-radius:50%}.c3-tools button:disabled,.c3-tools select:disabled{opacity:.5;cursor:wait}.c3-quality{display:flex;align-items:center;gap:12px;font-size:14px;margin:16px 0}.c3-tools [role=status]{min-height:2.8em;line-height:1.6;font-size:14px;color:#e6d7b3}.c3-tools [data-c3-close]{margin-top:10px}.c3-panel [hidden]{display:none!important}@media(max-width:700px){.c3-panel{padding:15px}.c3-layout{grid-template-columns:minmax(0,1fr)}.c3-host{height:420px;max-height:56dvh}.c3-intro .zh-btn{width:100%}.c3-intro h2{font-size:21px}.c3-tools [data-c3-close]{width:100%}}
</style>
