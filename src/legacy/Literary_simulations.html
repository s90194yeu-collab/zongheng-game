<script>
(function(L){
 'use strict';const U=L.U,B=U.button,C=U.clamp,D=U.dist;
 L.register('gourd',{
 init(w){w.loads=[{mass:2,pos:-1},{mass:3,pos:0},{mass:5,pos:1}];w.roll=.1;w.omega=0;w.distance=0;w.y=320;w.center=0;w.trial=false;w.limit=75;w.rocks=[{x:200,y:220},{x:390,y:430},{x:560,y:250}];},
 step(w,k,d){U.select(w,k,d,3,3);w.center=w.loads.reduce((n,p)=>n+p.mass*p.pos,0)/10;if(!w.trial)return;const force=Math.sin(w.time*1.7)*.55+w.center*2+(Number(!!k.right)-Number(!!k.left))*1.5;w.omega+=(force-w.roll*.7)*d;w.omega*=Math.exp(-d*1.1);w.roll+=w.omega*d;w.distance+=d*(w.assist?19:23);w.y=C(w.y+(Number(!!k.down)-Number(!!k.up))*145*d+Math.sin(w.time)*15*d,165,475);if(Math.abs(w.roll)>1){U.hurt(w,'偏載翻覆，移動重物並反向傾身穩住。');w.roll*=.3;w.omega=0;}for(const r of w.rocks)if(Math.abs(w.distance-r.x)<25&&Math.abs(w.y-r.y)<50)U.hurt(w,'浮瓠碰到礁石，水流並非只容一條直線。');if(w.distance>680&&Math.abs(w.roll)<.7)U.win(w,'大瓠以浮具用途過江，載重與水勢都親自試過。');},
 command(w,c){if(c==='primary')w.loads[w.selected].pos=w.loads[w.selected].pos===1?-1:w.loads[w.selected].pos+1;else if(c==='secondary'){w.trial=true;U.say(w,'已入水試浮，現在須反向傾身穩住。');}},options(w){return w.loads.map((p,i)=>({x:250+i*250,y:190,label:'載物'+(i+1)+'・重'+p.mass+'・'+['左','中','右'][p.pos+1]}));},controls(){return[B('primary','把此載物換到下一側'),B('secondary','載好後入水試浮')];},view(w){return{goal:'調平載重、傾身穩舟，避礁浮到對岸',resource:'重心 '+w.center.toFixed(2)+'／舟傾 '+w.roll.toFixed(2),threat:w.trial?'江程 '+Math.floor(w.distance)+'／680':'先調載，再按Q入水試浮',detail:'E調載、Q選載物；←→傾身，↑↓換水路。改作浮具仍須有實際重心條件。',me:w.distance/680,other:Math.abs(w.roll)};}
 });
 L.register('well',{
 init(w){w.x=100;w.y=420;w.anchor={x:500,y:145};w.anchored=false;w.length=95;w.angle=0;w.omega=0;w.child={x:730,y:430};w.caught=false;w.steady=false;w.tip={x:500,y:240};w.limit=w.assist?120:80;w.grip=100;},
 step(w,k,d){if(!w.anchored)U.move(w,k,d,240);else{const torque=(Number(!!k.right)-Number(!!k.left))*.9-w.angle*.7;w.omega+=torque*d;w.omega*=Math.exp(-d*(k.guard?5:2.3));w.angle=C(w.angle+w.omega*d,-1.2,1.2);const pull=(Number(!!k.down)-Number(!!k.up))*(k.guard?48:95);w.length=C(w.length+pull*d,70,480);w.tip={x:w.anchor.x+Math.sin(w.angle)*w.length,y:w.anchor.y+Math.cos(w.angle)*w.length};if(w.caught&&!k.guard&&Math.abs(pull)>70){w.grip-=d*9;U.say(w,'拉得太急，按住穩繩再提。');}if(w.grip<=0)w.hp=0;if(w.caught&&w.length<135&&Math.abs(w.angle)<.35)U.win(w,'支點、繩長與穩提接上，幼童已回到井沿。');}},
 command(w,c){if(c==='primary'){if(!w.anchored){if(D(w,w.anchor)<85){w.anchored=true;fx(w,'支點已架好，再放繩調整擺動。');}else U.say(w,'先走到井沿的支點處。');}else if(!w.caught&&D(w.tip,w.child)<(w.assist?65:48)){w.caught=true;fx(w,'已接住，須穩住再縮短繩梯。');}else if(!w.caught)U.say(w,'繩端尚未到幼童身旁，先調角度與長度。');}},controls(){return[B('primary','架支點／抓牢接人'),B('secondary','按住穩繩慢提')];},view(w){return{goal:'先架支點，放繩接人，再穩提回井沿',resource:w.anchored?'繩長 '+Math.round(w.length)+'／握力 '+Math.ceil(w.grip):'先移動到井上方支點',threat:w.caught?'已接住，請回正並縮繩':'幼童仍待接應',detail:w.anchored?'←→控制繩角，↓放繩、↑提繩，E接人；按住Q可穩繩慢提。':'方向移動至金色支點，E架設。',me:w.caught?.7:w.anchored?.3:0};}
 });function fx(w,t){w.hits++;U.say(w,t);}
 L.register('peach',{
 init(w){w.x=95;w.y=300;w.vx=0;w.vy=0;w.boat=w.index===0;w.asked=false;w.marked=[];w.failedMark=false;w.stageGoal=w.index===2?'return':'enter';w.returning=false;w.cave={x:880,y:300};w.limit=150;},
 step(w,k,d){const old={x:w.x,y:w.y};if(w.boat){w.vx+=(Number(!!k.right)-Number(!!k.left))*300*d;w.vy+=(Number(!!k.down)-Number(!!k.up))*300*d;w.vx*=Math.exp(-d*1.7);w.vy*=Math.exp(-d*1.7);w.x=C(w.x+w.vx*d+18*d,65,915);w.y=C(w.y+w.vy*d,150,490);const center=300+Math.sin(w.x/160)*65;if(Math.abs(w.y-center)>95){w.x=old.x;w.y=old.y;w.vx*= -.4;w.vy*= -.4;U.hurt(w,'舟身撞到淺灘，沿溪勢修正再行。');}if(w.x>790){w.x=790;U.say(w,'山口太窄，須把舟留在水邊。');}}else U.move(w,k,d,180);
 if(!w.boat&&w.index===0&&w.x>850&&Math.abs(w.y-300)<30)U.win(w,'舟留溪邊，人物步入有光的小口。');
 if(w.index===1){if(w.x>760&&!w.asked){w.x=760;U.say(w,'村口正有人詢問外間何世，可停步交談。');}if(w.x>890&&w.asked)U.win(w,'外間的年表留在對話中，村落仍與外界相隔。');}
 if(w.index===2){if(w.x>720&&!w.failedMark){w.failedMark=true;w.returning=true;U.say(w,'順著所誌前來，路卻不再通。請返回郡下留下這一結果。');}if(w.returning&&w.x<130&&w.marked.length>=2)U.win(w,'記號與回尋都做過，仍不可復得。');}},
 command(w,c){if(c==='primary'){if(w.index===0&&w.boat&&w.x>700){w.boat=false;w.vx=w.vy=0;U.say(w,'捨舟，從小口步入。');}else if(w.index===1&&w.x>650){w.asked=true;fx(w,'村人不知有漢，對話打開的是認識，不是永久座標。');}else if(w.index===2){if(!w.marked.some(x=>Math.abs(x-w.x)<120)){w.marked.push(w.x);fx(w,'留下路誌，回尋時仍須再核對。');}}}},controls(w){return[B('primary',w.index===0?'靠岸捨舟':w.index===1?'停步與村人交談':'留下這一處路誌')];},view(w){return{goal:w.index===0?'沿溪操舟，到窄口捨舟後步入':w.index===1?'在村口問世，再走進隔絕村路':'留下至少兩處路誌，回尋失路後返回郡下',resource:w.boat?'漁舟帶著慣性':'已用步行',threat:w.returning?'路誌失效，返回左側郡下':'探索仍在進行',detail:'方向鍵移動；舟可走的溪路與人可走的窄口不同。結尾不解鎖桃源永久地圖。',me:w.returning?1-w.x/900:w.x/900};}
 });
 L.register('riverSong',{
 init(w){w.pitch=1;w.breath=100;w.roll=0;w.notes=[1,0,2,1,2,0,1,2];w.next=0;w.sustain=0;w.scale=0;w.limit=105;w.spark=[];w.nav=0;},
 step(w,k,d){U.select(w,{left:k.left,right:k.right},d,3,3);w.pitch=w.selected;w.roll+=d*(Math.sin(w.time*1.1)*.55+(Number(!!k.down)-Number(!!k.up))*1.1-w.roll*.7);if(Math.abs(w.roll)>.95){U.hurt(w,'船身失穩，先反向調整。');w.roll*=.4;}if(k.guard&&!k.action)w.breath=C(w.breath+d*42,0,100);if(k.action&&w.breath>0){w.breath-=d*20;const target=w.notes[w.next],expected=w.index===0?0:w.index===1?(w.next<4?0:1):w.next%2;if(w.pitch===target&&Math.abs(w.roll)<.7&&w.scale===expected){w.sustain+=d;if(w.sustain>(w.assist?.6:.85)){w.next++;w.sustain=0;fx(w,'聲與舟相和，留出換氣再接下句。');if(w.next===w.notes.length)U.win(w,'江聲與呼吸接續，水月也留下不同觀看尺度。');}}else{w.sustain=0;U.say(w,w.scale!==expected?'換一種觀水月的尺度，再接這一句。':'先調音高與舟身，不必用一口氣吹盡。');}}if(w.breath<=0&&k.action)U.hurt(w,'氣已用盡，先收息換氣。');},
 command(w,c){if(c==='skill')w.scale=1-w.scale;},options(w){return [0,1,2].map((n,i)=>({x:250+i*250,y:310,label:['低音','中音','高音'][i]}));},controls(w){return[B('primary','按住吹簫'),B('secondary','按住收息換氣'),B('skill','改觀'+(w.scale?'變化中的水月':'接續不盡的江月'))];},view(w){const expected=w.index===0?0:w.index===1?(w.next<4?0:1):w.next%2;return{goal:'調音高、穩舟、留換氣，把八句聲景接起',resource:'氣息 '+Math.ceil(w.breath)+'／舟傾 '+w.roll.toFixed(2),threat:'已和 '+w.next+'／8；下一音 '+['低','中','高'][w.notes[w.next]??1],detail:'←→選音、↑↓穩舟、E吹、Q換氣；本句觀尺：'+(expected?'接續不盡':'眼前變化')+'，空白鍵可換觀尺。',me:w.next/8};}
 });
 L.register('moonwalk',{
 init(w){w.x=110;w.y=350;w.exposure=1;w.shots=[];w.targets=[1,3,5];w.film=7;w.bridges=Array.from({length:6},(_,i)=>({x:130+i*145,y:300+(i%2)*90}));w.hour=4;w.limit=210;},
 step(w,k,d){U.move(w,{left:k.left,right:k.right},d,160);w.nav-=d;if(w.nav<0&&(k.up||k.down)){w.exposure=C(w.exposure+(k.up?1:-1),0,4);w.nav=.25;}w.hour=(4+w.time/4)%24;},
 command(w,c){if(c==='secondary'){w.time+=8;U.say(w,'換了一段時辰，光與人潮也會改變。');return;}if(c==='primary'&&w.film>0){const i=w.bridges.findIndex(p=>Math.abs(w.x-p.x)<48),hour=w.hour,target=w.index===0?6:w.index===1?18:21;const window=Math.abs(hour-target)<1.6,crowd=w.index===1&&hour>10&&hour<17,exposure=hour>=20||hour<5?3:hour>16?2:1;w.film--;if(w.targets.includes(i)&&window&&!crowd&&w.exposure===exposure&&!w.shots.includes(i)){w.shots.push(i);fx(w,'這一橋、這一刻與曝光相合，取景留下。');}else U.say(w,'位置、光線或曝光尚未相合，膠片已用一張。');if(w.shots.length===3)U.win(w,'移步與待時都留下過，六橋的盛景不只午遊。');else if(w.film<=0)w.hp=0;}},
 controls(){return[B('primary','在此橋取景'),B('secondary','候一段時辰')];},view(w){return{goal:'在第2、4、6橋，捕捉'+['晨光','夕嵐','月夜'][w.index],resource:'時辰 '+w.hour.toFixed(1)+'／曝光 '+w.exposure+'／膠片 '+w.film,threat:'成片 '+w.shots.length+'／3',detail:'←→步行換橋、↑↓調曝光；晨光約6時曝光1，夕嵐18時曝光2，月夜21時曝光3。',me:w.shots.length/3};}
 });
 L.register('woodcut',{
 init(w){w.charge=0;w.last=false;w.angle=0;w.grain=0;w.stamina=100;w.wood=0;w.target=8;w.limit=95;},
 step(w,k,d){w.angle=C(w.angle+(Number(!!k.right)-Number(!!k.left))*d*.8,-1,1);w.grain=Math.sin(w.time*.75)*.4;if(k.guard&&!k.action)w.stamina=C(w.stamina+d*25,0,100);if(k.action){w.charge+=d;w.stamina-=d*13;}if(w.last&&!k.action){if(w.charge>=.6&&w.charge<=1.6&&Math.abs(w.angle-w.grain)<(w.assist?.4:.25)){w.wood++;fx(w,'沿木紋落斧，一份木料已備。');}else{U.hurt(w,'力或木紋不合，反震耗力。');w.stamina-=8;}w.charge=0;}w.last=!!k.action;if(w.stamina<=0)w.hp=0;if(w.wood===w.target)U.win(w,'每份木料都有蓄力與休息，不靠仙術代勞。');},
 command(){},controls(){return[B('primary','按住蓄斧／放開落斧'),B('secondary','按住收斧歇力')];},view(w){return{goal:'調準木紋後蓄0.6～1.6秒，備好八份木料',resource:'腳力 '+Math.ceil(w.stamina)+'／蓄力 '+w.charge.toFixed(1),threat:'木料 '+w.wood+'／8',detail:'←→調斧向，E蓄放、Q歇力；指針須與木紋相近，猛按並不更快。',me:w.wood/8};}
 });
 L.register('ink',{
 init(w){w.x=120;w.y=470;w.targets=Array.from({length:10},(_,i)=>{const a=i/10*Math.PI*2;return{x:560+Math.cos(a)*130,y:290+Math.sin(a)*100,ink:0};});w.targets.push({x:560,y:420,ink:0},{x:640,y:440,ink:0});w.ink=28;w.dab=0;w.spread=0;w.well={x:110,y:470};w.refills=2;w.limit=180;},
 step(w,k,d){U.move(w,k,d,195);w.dab-=d;if(k.action&&w.dab<=0&&w.ink>0){w.dab=.23;w.ink-=.6;const p=w.targets.find(p=>D(w,p)<43);if(p){p.ink+=.35;if(p.ink>1.75){w.spread++;p.ink=1.5;U.say(w,'此處墨已暈開，留白不能直接補回。');}}else{w.spread++;U.say(w,'筆落到構圖留白，先收筆再移動。');}}if(w.spread>8)w.hp=0;if(w.targets.every(p=>p.ink>=.65&&p.ink<=1.75))U.win(w,'菊瓣、枝葉與留白分層完成；本局只記筆墨操作。');},
 command(w,c){if(c==='secondary'&&D(w,w.well)<90&&w.refills>0){w.ink=28;w.refills--;U.say(w,'已蘸墨，先收筆再走回畫紙。');}},point(w,x,y){w.pointer={x,y};},controls(){return[B('primary','按住落筆／放開提筆'),B('secondary','回左下硯臺蘸墨')];},view(w){return{goal:'分層完成十二處菊瓣枝葉，每處適量而非塗滿',resource:'墨 '+w.ink.toFixed(1)+'／可再蘸 '+w.refills,threat:'完成 '+w.targets.filter(p=>p.ink>=.65).length+'／12；暈開 '+w.spread,detail:'移動筆鋒，E落墨、放開提筆；場景也可拖曳筆尖。淺色構圖可對照，墨會累積。',me:w.targets.filter(p=>p.ink>=.65).length/12};}
 });
 L.register('canglang',{
 init(w){w.x=100;w.y=300;w.vx=0;w.vy=0;w.angle=0;w.use=0;w.next=0;w.stops=[320,580,840];w.cleaned=[];w.water='清';w.limit=150;},
 step(w,k,d){w.angle=C(w.angle+(Number(!!k.down)-Number(!!k.up))*d*1.4,-1,1);w.vx*=Math.exp(-d*1.6);w.vy*=Math.exp(-d*2);w.x=C(w.x+w.vx*d-5*d,60,940);w.y=C(w.y+w.vy*d+Math.sin(w.time)*12*d,160,480);w.water=Math.sin(w.x/100+w.index)>0?'清':'濁';const stop=w.stops[w.next];if(stop&&w.x>stop+55){w.x=stop+55;U.say(w,'先在此水帶選合宜用途，再鼓枻離去。');}if(w.y<175||w.y>470)U.hurt(w,'篙勢偏向岸石，調角度再行。');if(w.next===3&&w.x>915)U.win(w,'清濁各有用途，舟已離岸，兩種立場仍留在原文。');},
 command(w,c){if(c==='primary'&&w.cooldown===0){w.vx+=135*Math.cos(w.angle);w.vy+=105*Math.sin(w.angle);w.cooldown=.55;}else if(c==='secondary')w.use=1-w.use;else if(c==='skill'){const stop=w.stops[w.next];if(stop&&Math.abs(w.x-stop)<65){const expected=w.water==='清'?0:1;if(w.use===expected){w.cleaned.push({water:w.water,use:w.use});w.next++;fx(w,'依此刻水情換用，歌意暫留在水上。');}else U.hurt(w,'用途與此刻水情未合，先看清濁。');}else U.say(w,'先撐篙到標出的水帶，再依水情洗用。');}},controls(w){return[B('primary','撐一篙前行'),B('secondary','改用'+(w.use?'纓':'足')),B('skill','依此水情洗用')];},view(w){return{goal:'穩舟過三處水帶，清可洗纓、濁可濯足',resource:'此水 '+w.water+'／當前用途 '+(w.use?'足':'纓'),threat:'已換用 '+w.next+'／3',detail:'↑↓調篙角，E撐篙，Q換用途，空白洗用；本局操作漁舟，不替屈原改變立場。',me:w.next/3};}
 });
 L.register('banquet',{
 init(w){w.pose=0;w.balance=0;w.flowers=0;w.flowerSlots=[0,2,1,3,0];w.pause=0;w.beat=0;w.nextAt=2;w.lastAt=-1;w.reactions=Array.from({length:8},(_,i)=>({person:i%4,at:2+i*2.4,done:false}));w.caught=0;w.missed=0;w.limit=55;},
