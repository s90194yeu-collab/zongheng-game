<script>
(function(){
  'use strict';
  const $=id=>document.getElementById(id),esc=ZH.esc,state={environment:null,type:'all',query:'',ownedOnly:false,page:0,key:'',loaded:false};let view=null,epoch=0,opening=null,refreshing=false;const PAGE_SIZE=6;
  const types=[{key:'all',label:'全部'},...ZH.CODEX_TYPES];
  function all(){return ZH.CODEX.filter((x,i,a)=>a.findIndex(y=>ZH.codexKey(x)===ZH.codexKey(y))===i);}
  function filtered(){const keys=new Set(ZH.codex.keys()),query=state.query.normalize('NFKC').toLowerCase();return all().filter(it=>(state.type==='all'||state.type===(ZH.codexCategory?ZH.codexCategory(it):it.type))&&(!state.ownedOnly||keys.has(ZH.codexKey(it)))&&(!query||[it.name,it.title,(ZH.findScenario(it.scenarioId)||{}).name].join(' ').normalize('NFKC').toLowerCase().includes(query)));}
  function visibleItems(){const keys=new Set(ZH.codex.keys());return filtered().slice(state.page*PAGE_SIZE,(state.page+1)*PAGE_SIZE).map(item=>({item,owned:keys.has(ZH.codexKey(item))}));}
  function progress(){const total=all().length,keys=new Set(ZH.codex.keys()),got=all().filter(x=>keys.has(ZH.codexKey(x))).length;$('gallery-progress').innerHTML='<b>'+(state.loaded?'收藏 '+got+' / '+total:'讀取收藏中')+'</b><small>人物・成語・寶物・史冊・諸子・六經・名場面</small>';$('gallery-mode').textContent=(ZH.access.state&&ZH.access.state.mode==='all'?'目前為全蒐集展示；':'')+(ZH.isGuest()?'訪客收藏留在目前分頁。':'收藏沿用帳號的蒐集設定。')+'查看展品不會直接解鎖收藏。';}
  function render(){progress();const list=filtered(),pages=Math.max(1,Math.ceil(list.length/PAGE_SIZE));state.page=Math.min(state.page,pages-1);const visible=visibleItems();if(!visible.some(x=>ZH.codexKey(x.item)===state.key))state.key=visible.length?ZH.codexKey(visible[0].item):'';
    $('gallery-types').innerHTML=types.map(t=>'<button type="button" data-type="'+t.key+'" aria-pressed="'+(state.type===t.key)+'">'+t.label+'</button>').join('');$('gallery-types').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.type=b.dataset.type;state.page=0;render();});
    $('gallery-items').innerHTML=visible.length?visible.map(({item,owned})=>'<button type="button" class="gallery-item'+(ZH.cutinIsItem&&ZH.cutinIsItem(item)?' gallery-item--cutin':'')+(!owned?' is-locked':'')+'" data-key="'+esc(ZH.codexKey(item))+'" aria-pressed="'+(state.key===ZH.codexKey(item))+'">'+(ZH.cutinIsItem&&ZH.cutinIsItem(item)?ZH.cutinArt(item,owned):(item.type==='treasure'?'<span class="gallery-item-art">'+ZH.itemArt(item)+'</span>':''))+'<small>'+esc(ZH.codexTypeLabel(ZH.codexCategory?ZH.codexCategory(item):item.type))+' · '+(state.loaded?(owned?'已收藏':'未收藏'):'資料待讀取')+'</small><b>'+esc(item.name)+'</b><span>'+esc((ZH.findScenario(item.scenarioId)||{}).name||'諸子六經')+'</span></button>').join(''):'<p class="gallery-empty">'+(state.ownedOnly?'這裡還沒有收藏。可取消「只看已收藏」，看看下一個想收錄的展品。':'沒有符合條件的收藏，試試其他名稱或類別。')+'</p>';
    $('gallery-items').querySelectorAll('button').forEach(b=>b.onclick=()=>pick(b.dataset.key));$('gallery-page').textContent=(state.page+1)+' / '+pages+' 組 · '+list.length+' 件';$('gallery-prev').disabled=state.page===0;$('gallery-next').disabled=state.page===pages-1;
    if(view){view.setItems(visible);view.select(state.key);}detail();
  }
  function pick(key){if(!visibleItems().some(x=>ZH.codexKey(x.item)===key))return;state.key=key;$('gallery-items').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.key===key)));if(view)view.select(key);detail();}
  function detail(){const item=all().find(x=>ZH.codexKey(x)===state.key),p=ZH.player.profile||{},owned=item&&ZH.codex.has(item.type,item.id),source=item&&ZH.findScenario(item.scenarioId),grants=item&&ZH.codexGrants?ZH.codexGrants(item):[];const first=source||grants.map(g=>ZH.findScenario(g.s)).find(Boolean);
    $('gallery-detail').innerHTML=(item?'<div><span class="zh-chip '+(owned?'zh-chip--patina':'')+'">'+(state.loaded?(owned?'已收入收藏':'尚未收藏'):'收藏資料待讀取')+'</span></div>'+(ZH.cutinIsItem&&ZH.cutinIsItem(item)?'<div class="gallery-cutin-art">'+ZH.cutinArt(item,owned)+'</div>':(item.type==='treasure'?'<div class="gallery-detail-art">'+ZH.itemArt(item)+'</div>':''))+'<h2>'+esc(item.name)+'</h2><p>'+esc(item.title||'')+'</p>'+(item.quote?'<blockquote>'+esc(item.quote)+'</blockquote>':'')+'<p data-copy>'+esc(item.text||'')+'</p><p class="zh-dim zh-small">出處：'+esc(item.source||'原典見圖鑑')+'</p><div class="zh-row"><button type="button" class="zh-btn zh-btn--primary" data-detail>放大欣賞</button>'+(ZH.cutinIsItem&&ZH.cutinIsItem(item)&&owned?'<button type="button" class="zh-btn zh-btn--quiet" data-cutin-replay>重播演出</button>':'')+(first?'<button type="button" class="zh-btn zh-btn--quiet" data-chapter>'+esc(first.name)+'</button>':'')+'</div>'+(!owned?'<p class="zh-small zh-dim">完成相關篇章可收錄；現在先看看介紹。</p>':''):'<h2>收藏從一篇古文開始</h2><p>換個類別，或取消搜尋條件，看看下一個想收錄的故事。</p>')+'<div class="gallery-self"><span class="pl-avatar">'+ZH.player.avatar(p.avatarId,p.appearance)+'</span><div><b>'+esc(ZH.player.name())+'</b><p>收藏館裡的策士沿用已存造型。</p><button type="button" class="zh-btn zh-btn--quiet zh-btn--sm" data-dress>去換裝</button></div></div>';
    $('gallery-detail').querySelector('[data-cutin-replay]')?.addEventListener('click',()=>ZH.replayCutin(item));
    $('gallery-detail').querySelector('[data-detail]')?.addEventListener('click',()=>ZH.codexBook.detail(state.key));$('gallery-detail').querySelector('[data-dress]').onclick=()=>ZH.go('profile');$('gallery-detail').querySelector('[data-chapter]')?.addEventListener('click',()=>{if(!first||first.status!=='ready'){ZH.toast('這一篇尚在製作中，先看看圖鑑介紹。');return;}if(!ZH.canPlay(first.id)){ZH.login();return;}ZH.go(first.id);});
  }
  function fallback(message){epoch++;if(view){view.dispose();view=null;}const host=$('gallery-scene');host.innerHTML='<div class="gallery-fallback">'+ZH.player.avatar(ZH.player.profile&&ZH.player.profile.avatarId,ZH.player.profile&&ZH.player.profile.appearance)+'<p>'+esc(message)+'</p><button type="button" class="zh-btn zh-btn--quiet" data-retry3d>重試3D</button><p class="zh-small">收藏清單與圖鑑仍可使用。</p></div>';host.querySelector('[data-retry3d]').onclick=start3d;document.querySelectorAll('.gallery-controls button,.gallery-play button').forEach(b=>b.disabled=true);$('gallery-environment').disabled=true;$('gallery-quality').disabled=true;}
  async function start3d(){if(opening)return;const id=++epoch;if(view){view.dispose();view=null;}$('gallery-scene').innerHTML='<div class="gallery-fallback"><p>佈置小小收藏館……</p></div>';opening=ZH.studio3d.create($('gallery-scene'),{mode:'gallery',environment:state.environment||(ZH.player.profile&&ZH.player.profile.appearance&&ZH.player.profile.appearance.environment)||'museum',quality:ZH.local.get('player3dQuality','auto'),appearance:ZH.player.safeLook(ZH.player.profile&&ZH.player.profile.appearance,ZH.player.profile&&ZH.player.profile.avatarId),items:visibleItems(),onPick:pick,isCurrent:()=>id===epoch});try{const v=await opening;if(id!==epoch){v.dispose();return;}view=v;$('gallery-environment').value=v.inspect().environment;$('gallery-environment').disabled=false;$('gallery-quality').disabled=false;document.querySelectorAll('.gallery-play button').forEach(b=>b.disabled=false);view.setItems(visibleItems());view.select(state.key);view.setAuto($('gallery-spin').getAttribute('aria-pressed')==='true');document.querySelectorAll('.gallery-controls button').forEach(b=>b.disabled=false);$('gallery-status').textContent='收藏館已打開。拖曳展台，看看你的收藏。';}catch(e){if(id===epoch){fallback(e.message);$('gallery-status').textContent='暫時使用平面收藏清單。';}}finally{opening=null;}}
  async function refresh(force){if(refreshing)return;refreshing=true;$('gallery-refresh').disabled=true;$('gallery-status').textContent='正在讀取收藏與策士資料……';try{const tasks=[ZH.player.load(!!force)];tasks.push(ZH.isGuest()?ZH.codex.init():ZH.access.read(!!force));await Promise.all(tasks);state.loaded=true;render();if(force&&view&&view.inspect().contextLost){view.dispose();view=null;}if(view){const look=ZH.player.safeLook(ZH.player.profile.appearance,ZH.player.profile.avatarId);view.setAppearance(look);if(ZH.player.profile.appearance&&ZH.player.profile.appearance.environment){state.environment=look.environment;view.setEnvironment(look.environment);$('gallery-environment').value=look.environment;}}else await start3d();$('gallery-status').textContent=view?'收藏館已打開。拖曳展台，看看你的收藏。':'暫時使用平面收藏清單。';}catch(e){$('gallery-status').textContent=e.message||'資料暫時無法讀取。請按「重新讀取」重試。';render();fallback('資料尚未備妥，請先重新讀取。');}finally{refreshing=false;$('gallery-refresh').disabled=false;}}
  document.addEventListener('zh:collection-change',()=>{if(state.loaded)render();});document.addEventListener('zh:player-change',()=>{if(!state.loaded)return;detail();if(view){const look=ZH.player.safeLook(ZH.player.profile.appearance,ZH.player.profile.avatarId);view.setAppearance(look);if(ZH.player.profile.appearance&&ZH.player.profile.appearance.environment){state.environment=look.environment;view.setEnvironment(look.environment);$('gallery-environment').value=look.environment;}}});document.addEventListener('zh:3d-restored',e=>{if(e.detail.host===$('gallery-scene'))$('gallery-status').textContent='3D收藏館已恢復。';});document.addEventListener('zh:3d-lost',e=>{if(e.detail.host===$('gallery-scene')){$('gallery-status').textContent='3D畫面暫時中斷，可重新讀取；收藏清單仍可使用。';}});
  ZH.ready(()=>{
    const config=window.ZH_DOLL3D||{};
    function reveal(){const r=$('gallery-scene').getBoundingClientRect();if(r.top<74||r.bottom>innerHeight)$('gallery-scene').scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});}
    $('gallery-environment').innerHTML=Object.entries(config.environments||{}).map(([id,v])=>'<option value="'+esc(id)+'">'+esc(v.label)+'</option>').join('');
    $('gallery-environment').onchange=e=>{state.environment=e.target.value;if(view)view.setEnvironment(state.environment);};
    $('gallery-quality').value=ZH.local.get('player3dQuality','auto');$('gallery-quality').onchange=e=>{ZH.local.set('player3dQuality',e.target.value);if(view)view.setQuality(e.target.value);};
    $('gallery-motions').innerHTML=(config.motions||[]).map(([id,label])=>'<button type="button" data-gallery-motion="'+esc(id)+'" aria-pressed="false">'+esc(label)+'</button>').join('');
    $('gallery-motions').querySelectorAll('button').forEach(b=>b.onclick=()=>{reveal();if(view&&!view.play(b.dataset.galleryMotion))$('gallery-motion-status').textContent='目前使用減少動畫設定，策士保持靜態展示。';});
    document.querySelectorAll('.gallery-play [data-walk]').forEach(b=>b.onclick=()=>{if(!view)return;reveal();const [x,z]=b.dataset.walk.split(',').map(Number);if(!view.move(x*.6,z*.6))$('gallery-motion-status').textContent='這個方向已到活動範圍邊緣，換個方向試試。';});
    $('gallery-position-reset').onclick=()=>view&&view.home();$('gallery-stop').onclick=()=>view&&view.stop();
    $('gallery-scene').addEventListener('zh:motion',e=>{const kind=e.detail.kind,label=(config.motions||[]).find(x=>x[0]===kind);$('gallery-motions').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.galleryMotion===kind)));$('gallery-motion-status').textContent=kind?(label?label[1]:'動作')+'中…':'挑一個動作，或讓策士走一小步。';});
$('gallery-mark').href=ZH.url('hub');$('gallery-home').onclick=()=>ZH.go('hub');$('gallery-profile').onclick=()=>ZH.go('profile');$('gallery-book').onclick=()=>ZH.codexBook.open();$('gallery-refresh').onclick=()=>refresh(true);$('gallery-search').oninput=e=>{state.query=e.target.value.trim();state.page=0;render();};$('gallery-owned').onchange=e=>{state.ownedOnly=e.target.checked;state.page=0;render();};$('gallery-prev').onclick=()=>{state.page=Math.max(0,state.page-1);render();};$('gallery-next').onclick=()=>{state.page++;render();};document.querySelectorAll('[data-camera]').forEach(b=>b.onclick=()=>{if(!view)return;const k=b.dataset.camera;if(k==='reset')view.reset();if(k==='left')view.rotate(-.3);if(k==='right')view.rotate(.3);if(k==='in')view.zoom(-.7);if(k==='out')view.zoom(.7);});$('gallery-spin').onclick=()=>{const active=$('gallery-spin').getAttribute('aria-pressed')!=='true';$('gallery-spin').setAttribute('aria-pressed',String(active));if(view)view.setAuto(active);};$('gallery-photo').onclick=()=>{if(!view)return;try{const a=document.createElement('a');a.href=view.snapshot();a.download='我的小小史冊收藏館.png';a.click();}catch(e){ZH.toast('這次照片未能保存，請再試一次。','bad');}};render();refresh(false);});
  ZH.gallery={refresh,get view(){return view;},get state(){return Object.assign({},state);}};
})();
</script></body></html>
