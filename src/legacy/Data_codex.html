  /** 圖鑑項目的鍵（類型:代碼），與紀錄、存檔使用的格式相同 */
  ZH.codexKey = item => item.type + ':' + item.id;

  /** 依鍵找項目 */
  ZH.codexItem = key => ZH.CODEX.find(item => ZH.codexKey(item) === key) || null;

  /** 諸子、六經這類跨劇本的項目：授予清單 [{ s, why }]；一般項目回傳空陣列 */
  ZH.codexGrants = itemOrKey => {
    const key = typeof itemOrKey === 'string' ? itemOrKey : ZH.codexKey(itemOrKey);
    return (ZH.CODEX_GRANTS && ZH.CODEX_GRANTS[key]) || [];
  };

  /** 是不是跨劇本的項目（諸子、六經） */
  ZH.codexIsLore = itemOrKey => ZH.codexGrants(itemOrKey).length > 0;

  /** 玩完某一話會收入的跨劇本項目（鍵的陣列） */
  ZH.codexGrantedBy = scenarioId => Object.keys(ZH.CODEX_GRANTS || {})
    .filter(key => ZH.CODEX_GRANTS[key].some(g => g.s === scenarioId));

  /** 某個劇本的全部項目（含這一話會收入的諸子、六經） */
  ZH.codexOf = scenarioId => ZH.CODEX.filter(item => ZH.codexIsLore(item)
    ? ZH.codexGrants(item).some(g => g.s === scenarioId)
    : item.scenarioId === scenarioId);

  /** 類型的中文名稱 */
  ZH.codexTypeLabel = type => {
    const t = ZH.CODEX_TYPES.find(x => x.key === type);
    return t ? t.label : type;
  };
