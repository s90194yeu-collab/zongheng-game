});}

n_04:async ctx=>{await scene(ctx,'jintent','向・會前對辭','你・駒支',['juzhi','fanxuanzi']);await ctx.say([{who:'juzhi',expr:'serious',text:'受田開荒、殽役合作、往來條件與賦詩慎讒，是四條回應線索。每一辭都要把證據與指控接上，不能只求饒或辱罵。'},{text:'四輪是把一段辯詞拆成閱讀操作，不表示史書記下四次一問一答。證據與辭令須你親選，送出後讀回報，最後解詩義、親賦詩而退。'}]);return 'n_05';},
n_05:async ctx=>{const r=await challenge(ctx,'wen_jc_juzhi','debate','駒支對辭・證據與尊嚴','親選四組證據與辭令、送出讀報，再親解詩義、賦詩而退。');ctx.add('peace',firstScore(r));return 'n_06';},
n_06:async ctx=>{await scene(ctx,'jin','向・恩惠與開荒','重讀駒支辯詞',['juzhi','fanxuanzi']);await ctx.say([{who:'juzhi',expr:'serious',text:'惠公蠲其大德，謂我諸戎是四嶽之裔胄也，毋是翦棄。賜我南鄙之田，狐狸所居，豺狼所嗥。'},{text:'駒支承認受田之恩，也追述諸戎除荊棘、驅狐狸豺狼，盡力不侵不叛。受恩不等於所有付出都可抹去。'}]);await ctx.anchor('jc_02');return 'n_07';},
n_07:async ctx=>{await ctx.say([{who:'juzhi',expr:'serious',text:'譬如捕鹿，晉人角之，諸戎掎之，與晉踣之。'},{text:'殽役的相助被說成捕鹿。三個動作不是互相打架，而是把共同成事的關係說具體。'}]);await ctx.anchor('jc_03');return 'n_08';},
n_08:async ctx=>{await ctx.say([{who:'juzhi',expr:'serious',text:'我諸戎飲食衣服，不與華同，贄幣不通，言語不達，何惡之能為？'},{text:'駒支用往來阻隔回應洩語指控。這是他在會上的辯詞，不替當事人虛造史官另查的罪證，也不把差異說成高下。'}]);await ctx.anchor('jc_04');const v=await choice(ctx,'evidence',{title:'你是駒支，辯護應守住什麼？',text:'本選擇評查證與尊重，與操作速度分開。',options:[{label:'以合作與往來條件回應具體指控，也要求聽證；不攻擊族群高下。',value:'evidence'},{label:'只要辱罵對方身分，就可以省去證據。',value:'insult'}]});ctx.add('crown',v==='evidence'?15:0);return 'n_09';},
n_09:async ctx=>{await ctx.say([{who:'juzhi',expr:'serious',text:'不與於會，亦無瞢焉。'},{text:'駒支賦〈青蠅〉而退。詩中「豈弟君子，無信讒言」可幫你理解勸戒之意；《左傳》並未逐句記現場唱詞。'}]);await ctx.anchor('jc_05');await ctx.say([{who:'fanxuanzi',expr:'serious',text:'我應重新聽取你的辯詞，請你回會任事。'},{text:'宣子辭焉，使即事於會，成愷悌也。這段史實不因你先前錯判而改成拘執。'}]);ctx.unlock('person:cq_juzhi');ctx.unlock('person:cq_fanxuanzi');ctx.unlock('text:juzhibuqu');ctx.unlock('text:qingying');return 'n_10';},
n_10:async ctx=>{await scene(ctx,'zheng','鄭・子產的夜書','前549年・襄公二十四年',['zichan','zixi']);await ctx.chapter('第二幕　重幣能換來令名嗎','你是鄭國的子產');await ctx.say([{text:'你現在是子產。范宣子掌政，諸侯之幣重，鄭人病之。鄭伯將如晉，你託子西送一封勸告的書信。'},{who:'zichan',expr:'worried',text:'四鄰聽見的若不是德，而是重幣，晉也會因離心受到傷害。不是只抱怨我們出得多，要把對方的根基一起說清楚。'},{who:'zixi',expr:'serious',text:'幣是禮物與貢獻，賄在信中是財貨。請親編八簡、校讀兩輪，再交我轉告宣子。'}]);ctx.unlock('treasure:cq12_bi');return 'n_11';},
n_11:async ctx=>{const r=await challenge(ctx,'wen_jc_shu','letter','子產編簡・令名與輕幣','親編八簡兩輪、每簡綁入讀報，分辨第二輪錯簡，託子西親送書。');ctx.add('peace',firstScore(r)*2);ctx.add('burden',-firstScore(r)*2);return 'n_12';},
n_12:async ctx=>{await scene(ctx,'zheng','鄭・信中所患','對讀子產之書',['zichan','zixi']);await ctx.say([{who:'zichan',expr:'serious',text:'子為晉國，四鄰諸侯，不聞令德，而聞重幣。僑也惑之。'},{text:'僑是子產的名。信由四鄰所聞起筆，再把執政者所憂轉向令名，不能把長國家讀成疆域大小。'}]);await ctx.anchor('jc_06');return 'n_13';},
n_13:async ctx=>{await scene(ctx,'jinhall','晉・公室、私家與貳心','子西轉書・信中論證',['fanxuanzi','zixi']);await ctx.say([{text:'諸侯之財聚於公室，諸侯可能離心；執政者若私賴財貨，晉國也可能離心。兩種離心，都會傷及所要保全的國與家。'},{who:'zichan',expr:'serious',text:'夫令名，德之輿也。德，國家之基也，有基無壞，無亦是務乎？'},{text:'輿與基兩個譬喻，把名聲、德行、政治根基接在一起。並不是只把取財說得好聽，就已務德。'}]);await ctx.anchor('jc_07');return 'n_14';},
n_14:async ctx=>{await ctx.say([{who:'zichan',expr:'serious',text:'恕思以明德，則令名載而行之，是以遠至邇安。'},{text:'你希望人說子實生我，而不是浚我以生。最後用象牙反招禍患的譬喻，提醒財貨可以傷身。'}]);await ctx.anchor('jc_08');await ctx.say([{who:'fanxuanzi',expr:'normal',text:'宣子說，乃輕幣。'},{text:'原文的結果是宣子欣然接受，減輕幣物。最佳成績不覆蓋你的第一次校簡，但史實結果照原文。'}]);const v=await choice(ctx,'relief',{title:'你是子產，輕幣之後，令名怎樣才不只是外觀？',text:'本選擇評恕思與民生。',options:[{label:'以減負與守德支撐名聲，追蹤鄰國與民眾是否真的較安。',value:'relief'},{label:'只把重徵改名，數量照舊，再宣傳自己有好名聲。',value:'rename'}]});ctx.add('crown',v==='relief'?15:0);ctx.unlock('text:zichanqingbi');return 'n_15';},
n_15:async ctx=>{await scene(ctx,'song','宋・向戌的倡議','前546年・襄公二十七年',['xiangxu','shiguan']);await ctx.chapter('第三幕　奔走弭兵','你是宋左師向戌');await ctx.say([{text:'你回到向戌的身分。你善於趙文子，又善於令尹子木，欲弭諸侯之兵以為名。這一句同時寫交情、和平與求名。'},{who:'xiangxu',expr:'serious',text:'我先如晉，聽他們的諸大夫是否願意答應。先有意願，後面的交見與先盟，仍須一條條談。'},{who:'shiguan',expr:'serious',text:'你不能一鍵替四國答覆。論據、承諾、使者和回報，要各自親做。'}]);return 'n_16';},
n_16:async ctx=>{await scene(ctx,'jinhall','晉・諸大夫共議','你・向戌',['xiangxu','zhaowenzi','hanxuanzi']);await ctx.say([{who:'hanxuanzi',expr:'serious',text:'兵，民之殘也，財用之蠹，小國之大菑也。將或弭之，雖曰不可，必將許之。'},{who:'zhaowenzi',expr:'serious',text:'向戌已告趙孟。諸大夫的共議，既要看兵害，也要看諸侯願歸誰的號召。'}]);await ctx.anchor('jc_09');ctx.unlock('person:cq_zhaowenzi');return 'n_17';},
n_17:async ctx=>{await scene(ctx,'road','宋・共議桌與使者','外交推演・非疆域圖',['xiangxu','shiguan']);await ctx.say([{who:'xiangxu',expr:'serious',text:'四張論據牌分別回應兵害、晉楚相匹、齊的民心、告秦通知。每張成功用一次；三名使者用於三份教學急報。'},{text:'本關容許你選擇交涉次序，史實路線稍後另讀。告秦用通知使者表現，不虛造向戌親訪秦。急報隨時間或進度出現，每份都要親核、派使、讀回報。'},{who:'shiguan',expr:'serious',text:'時限內沒完成可以不限時補做，首次原分保留。協助只提示適合選項，不能替你派使，也不會自動簽盟。'}]);return 'n_18';},
n_18:async ctx=>{const r=await challenge(ctx,'jc_mibing','diplomacy','弭兵奔走・四國共議','親交涉四國、派三次調停、讀七報、核交見與和平界限，親邀宋會。');ctx.add('peace',firstScore(r)*7);ctx.add('burden',-firstScore(r)*2);return 'n_19';},
n_19:async ctx=>{await scene(ctx,'chu','晉楚至齊秦・原文路線','從教學桌回到史實',['xiangxu','qujian','chenwenzi']);await ctx.say([{text:'史實的順序：晉人許之；向戌如楚，楚亦許之；如齊，齊人難之。陳文子從局勢與民心勸齊。'},{who:'chenwenzi',expr:'serious',text:'晉楚許之，我焉得已？且人曰弭兵，而我弗許，則固攜吾民矣，將焉用之？'}]);await ctx.anchor('jc_10');await ctx.say([{text:'齊人許之。告於秦，秦亦許之。皆告於小國，為會於宋。告秦的記載簡短，本話不替秦君增加未載的台詞與條件。'}]);ctx.unlock('person:cq_qujian');return 'n_20';},
n_20:async ctx=>{await scene(ctx,'meeting','宋・會盟之前的交見條款','停戰與負擔分開看',['xiangxu','zhaowenzi','qujian']);await ctx.say([{who:'qujian',expr:'serious',text:'請晉楚之從，交相見也。'},{text:'趙孟指出晉楚齊秦相匹。晉難強使齊，猶楚難強使秦；楚王最後說釋齊秦，他國請相見也。'},{who:'xiangxu',expr:'worried',text:'停戰值得促成，交相朝見卻仍有小國要承擔的往來與財貨。和平值上升，不代表困苦自動歸零。'},{text:'邾、滕沒有參與這次盟誓。不能把皆告小國直接讀成所有國家都參盟。指標是本局教學提醒，不是歷史負擔統計。'}]);ctx.add('burden',15);return 'n_21';},
n_21:async ctx=>{await scene(ctx,'meeting','宋・西門之外','會盟當日・楚人衷甲',['xiangxu','qujian','bozhouli']);await ctx.say([{text:'楚人把甲藏在衣內。伯州犁勸子木，諸侯望信於楚；若以不信為利，就會失去本來可以歸服的諸侯。'},{who:'bozhouli',expr:'serious',text:'安全的顧慮要處理，失信所得又能維持多久？'},{who:'xiangxu',expr:'worried',text:'共議正在危險中。只因願意赴會，就宣稱毫無猜疑，會遮掉需要查核與協商的事。'}]);const v=await choice(ctx,'trust',{title:'你是向戌，怎樣面對會盟中的安全疑慮？',text:'本題評守信與責任，不替史實另造一次戰役。',options:[{label:'維持查核與安全準備，把疑慮帶回協商，不以欺襲換短利。',value:'trust'},{label:'利用和平邀請使對方卸防，趁機突襲。',value:'ambush'}]});ctx.add('crown',v==='trust'?15:0);return 'n_22';},
n_22:async ctx=>{await scene(ctx,'banquet','宋・誰先盟','暫代趙文子判斷',['zhaowenzi','shuxiang','qujian']);await ctx.say([{text:'晉楚又爭盟先後。晉以久為盟主自持；楚反問既稱晉楚匹，晉若常先，豈不成楚弱？'},{who:'zhaowenzi',expr:'worried',text:'你暫以我的位置作判斷：諸侯長久歸晉，究竟靠什麼？'}]);await ctx.anchor('jc_11');if(firstGood(ctx,'jc_11'))ctx.add('crown',15);await ctx.say([{who:'shuxiang',expr:'serious',text:'諸侯歸晉之德只，非歸其尸盟也。子務德，無爭先。'},{text:'乃先楚人。這是史實的現場先後；史官記事還有另一層判斷。'}]);return 'n_23';},
n_23:async ctx=>{await scene(ctx,'banquet','宋・盟誓與記錄','你・向戌',['xiangxu','shiguan']);await ctx.say([{text:'原文說「乃先楚人」，又說「書先晉，晉有信也」。現場楚先盟，記事列晉在先，不能用記事倒改現場。'},{who:'xiangxu',expr:'normal',text:'奔走已成，願盟者共赴宋會。接下來不是讓我把所有武力與矛盾宣布消失，而是看履約、文德與負擔。'},{who:'shiguan',expr:'serious',text:'你在桌上做過的調停是教學操作；這次盟約的條款、限制與先後，仍按原文記下。'}]);ctx.unlock('treasure:cq12_mibing');return 'n_24';},
n_24:async ctx=>{await scene(ctx,'hall','宋・請賞與子罕的異議','弭兵之後',['xiangxu','zihan']);await ctx.chapter('第四幕　求名之後，誰能止我','你仍是宋左師向戌');await ctx.say([{text:'向戌請賞，求免死之邑。宋公與之邑六十，子罕卻不肯把去兵之功照單全收。'},{who:'zihan',expr:'serious',text:'兵之設久矣，所以威不軌而昭文德也。'},{text:'他質疑以弭兵為去盡武力之功，又藉此請賞。這個立場應與停戰的成果並讀，不簡化成一切戰爭都值得增加。'}]);await ctx.anchor('jc_12');ctx.unlock('person:cq_zihan');return 'n_25';},
n_25:async ctx=>{await ctx.say([{text:'子罕削而投之，削下、投棄賞邑的文書。向氏族人憤怒，想攻司城。'},{who:'xiangxu',expr:'worried',text:'功名得到以後，我是否還能聽那個使我難堪、也使我免於自害的人？'}]);const v=await choice(ctx,'criticism',{title:'你是向戌，面對批評與族人報復，願怎樣承擔？',text:'首次選擇保留，後續史實仍固定。',options:[{label:'接受批評，辭邑，阻止族人攻子罕；把不同意見留在討論中。',value:'listen'},{label:'只求名望不願受諫，任族人攻擊批評者。',value:'revenge'}]});ctx.add('crown',v==='listen'?15:0);await ctx.say([{text:'史實：左師辭邑，並阻止族人攻子罕。向戌說我將亡，夫子存我，德莫大焉，又可攻乎。無論你的首次選擇，都讀回這個修正。'}]);return 'n_26';},
n_26:async ctx=>{await scene(ctx,'school','宋・三次對大國說話','反思不另計分',['xiangxu','juzhi','zichan']);const v=await choice(ctx,'reflection',{title:'你想先回看哪一筆首次操作？',text:'結算用一句原文，連到一次首次判斷。',options:[{label:'駒支的證據：身分、合作與洩語指控怎樣分開？',value:'debate'},{label:'子產的信：財貨、令名、德基與民生怎樣相接？',value:'letter'},{label:'向戌的盟：約定停戰後，哪些負擔與異議仍須處理？',value:'diplomacy'}]});await ctx.say([{who:'shiguan',expr:'serious',text:v==='debate'?'挑一個首次證據或辭令，對讀角掎踣或何惡之能為，再說致歉與聽證的關係。':v==='letter'?'挑一個首次錯簡或正簡，用德之輿、國家之基或象齒之喻說明它的位置。':'挑一次交涉、急報或條款的首次判斷，對讀兵害、交見與務德無爭先；不把高分當永久和平證明。'},{text:'人物呈現為三段經驗回看，不表示不同年份的三人此刻同席。子產的完整人物卡留待下一話，本話收這封信。'}]);return 'n_27';},
n_27:async ctx=>{await scene(ctx,'song','宋・夾在強國之間的人','向戌列傳・本局評語',['xiangxu','shiguan']);await ctx.say([{who:'xiangxu',expr:'serious',text:'不屈需要證據，令名需要德與民生，弭兵需要共議與履約。求名之後，還有人能指出我沒看見的負擔。'},{text:'駒支復參會、范宣子輕幣、宋會弭兵、向戌辭邑止報復，均依原文。你完成的三關、首次與最佳，另作學習紀錄。'}]);const score=ctx.state.vars.debate.firstScore+ctx.state.vars.letter.firstScore*2+ctx.state.vars.diplomacy.firstScore*7;return ctx.end({key:score>=80&&ctx.meter('crown')>=60?'great':score>=40?'good':'bad'});}
};
const FIXED='駒支復參會，范宣子輕幣，前546年宋會弭兵；向戌辭邑，並止族人報復子罕';
const ENDINGS={great:{key:'great',title:'和平，仍須看見負擔',text:'你能把證據、德名與共議接到原文，也願受不同立場的提醒。高分評本局學習，和平仍須履約，不會讓小國之困自動歸零。',good:true},good:{key:'good',title:'在兩強之間，繼續共議',text:'三段必要體驗已親做。回看一次首次判斷，問誰承擔兵害、幣物與朝見，誰的異議容易在求名中消失。',good:true},bad:{key:'bad',title:'從一份證據重新說起',text:'你已親做補足三關。挑一次首次錯判，用原文說明修正；最佳成績保留，首次也不抹去。史實結果照原文，不用勝敗羞辱學習。',good:false}};
function payload(s,ending){const a=s.vars.debate.firstScore,b=s.vars.letter.firstScore,c=s.vars.diplomacy.firstScore,v=(Number(s.vars.choices.evidence==='evidence')+Number(s.vars.choices.relief==='relief')+Number(s.vars.choices.trust==='trust')+Number(s.vars.choices.criticism==='listen')+Number(firstGood(game.ctx,'jc_11')))*20;return{scenarioId:SID,chapterVersion:VERSION,runId:s.vars.runId,mode:MODE,faction:'宋',country:'宋',role:'向戌',roleKind:'liezhuan',bioTitle:'向戌列傳',bioOpening:'向戌者，宋之左師也。',ending,scoreStrategy:Math.round(a+b*2+c*7),scoreVirtue:v,turns:s.steps,durationSec:Math.min(5400,Math.round((Date.now()-s.startedAt)/1000)),deeds:['前559年暫扮駒支，親選四組證據辭令，送出讀報，解青蠅之義、親賦詩而退，首次'+a+'分。','讀惠公受田、除荊安居、殽役角掎踣與往來阻隔，不以族群高下代查證。','暫代范宣子判斷，讀致歉及駒支即事於會。','前549年暫扮子產，親編八簡兩輪、辨自擬錯簡、綁簡讀報，託子西送告宣子，首次'+b+'分。','讀令名德之輿、德國家基與象齒之喻，區分財貨和現代賄賂；宣子說乃輕幣。','前546年主扮向戌，四國親交涉、三份教學急報親調停，讀七報核條款與界限，親邀宋會，首次'+c+'分。','回到原文如晉如楚如齊、告秦；看交見之從、齊秦例外與邾滕不與盟。','讀衷甲與信義，暫代趙文子判斷；區分現場楚先盟和史官書先晉。','讀子罕兵之設久之批評；'+FIXED+'。'],anchors:copy(s.anchors),games:copy(s.games),codex:s.codex.slice(),opener:'遊戲史官評語（自擬）：向戌者，宋之左師也，善晉趙文子與楚令尹子木，欲弭諸侯之兵以為名。其前，駒支見責於向，陳受田開荒、殽役相助、衣食言語之別，賦青蠅而退；宣子辭焉，使即事於會。不屈之辭，須有可聽之證，身分與聲量不能代之。又子產寓書於子西，告范宣子輕幣，以令名為德之輿、德為國家之基，終以象齒招禍為喻。積財未必安國，生民乃可得名。至向戌奔走弭兵，晉楚齊秦皆許，諸侯為會於宋；交見之約仍有小國所承，齊秦例外，邾滕不與盟。楚先盟而書先晉，儀位不可盡代德信。向戌請賞，子罕責其以去兵求功，左師辭邑，並止族人攻司城。夫求名者亦須聽逆耳之言。此局對辭、編簡、派使與急報為親做的閱讀推演，分數非永久無戰之證。和平可求，負擔須察；首次之失可記，後行之責須補，功成之後亦不廢查證與受諫。',prompts:['引用捕鹿三動作、何惡之能為或〈青蠅〉，連到一次首次證據辭令；說明怎樣辨指控、辯護、查證與身分差異。','引用令名德之輿、德國家基或象齒之喻，連到一次首次編簡；幣與賄在此為何不能直接當現代錢幣或受賄罪？','引用兵害、交相見、務德無爭先或子罕的批評，連到一次首次交涉或條款；說明停戰、負擔、名望與去盡武力有何不同。'],experience:{firstAnchors:copy(s.vars.firstAnchors),debate:copy(s.vars.debate),letter:copy(s.vars.letter),diplomacy:copy(s.vars.diplomacy),decisions:copy(s.vars.choices)}};}
async function onEnd(r,ctx){const s=ctx.state;if(ORDER.some(id=>!s.anchors.some(a=>a.anchorId===id))||['wen_jc_juzhi','wen_jc_shu','jc_mibing'].some(id=>!s.games.some(g=>g.gameId===id&&!g.skipped))||['debate','letter','diplomacy'].some(k=>!s.vars[k]?.completed)||CODEX_KEYS.some(id=>!s.codex.includes(id)))throw Error('必要體驗或對讀尚未完成，請接續本話。');const ending=ENDINGS[r.key]||ENDINGS.good,p=s.vars.finishPayload||payload(s,ending);await ctx.banner(ending.title,'向戌列傳・本局評語');await ctx.say([{text:ending.text},{who:'shiguan',expr:'serious',text:'到結算以原文和一次首次操作完成反思。其他篇章可回首頁進入，子產的施政留待下一話。'}]);if(s.vars.submitted){ZH.session.set('result:'+SID,p);ZH.go('result',{s:SID});return;}s.vars.finishPayload=p;await checkpoint();await journal.flush();ZH.finishScenario(p);s.vars.submitted=true;await checkpoint();}
