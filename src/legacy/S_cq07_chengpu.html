  for(const key of Object.keys(snap.progress||{})){

      // An ended run resumes straight into onEnd. Its complete first/best
      // evidence is already in vars and finishPayload, and scores in games.
      if(snap.ended||completedAway(key.slice(6))){delete snap.progress[key];continue;}
      const ar=snap.progress[key];

      // Drop only those redundant references in the serialized snapshot.

    if(snap.ended||completedAway(m[1])){delete snap.progress[key];continue;}
    const ar=snap.progress['arena:'+m[1]];
    if(ar?.last&&(!ar.active||Number(m[2])<Number(ar.tries)))delete snap.progress[key];
  }
  if(snap.ended&&snap.vars.finishPayload){
    // After submission, full first/best and manual-operation evidence lives
    // once in finishPayload.experience. Keep validation and score summaries.
    for(const key of ['alliance','zhanxi','battle']){

n_01:async ctx=>{await scene(ctx,'palace','周・王城','前635年・勤王復位',['wengong','xiangwang']);await ctx.chapter('第七話　城濮爭霸','退軍之前，先看主盟的根基');await ctx.say([{text:'上一話看宋襄公爭盟受挫。這一話，你扮演晉文公重耳：前636年回國即位，前635年助周襄王復位，正把流亡的經驗轉成治理與外交的能力。'},{who:'xiangwang',expr:'normal',text:'叔父勤王，王室得安。以封地酬功。'},{who:'wengong',expr:'serious',text:'若能得王者所用的隧，這份功業是否更可彰顯？'},{text:'「叔父」是周王對同姓諸侯的稱呼。請隧是墓葬制度與名分問題，不是申請一條行軍道路。'}]);return 'n_02';},
n_02:async ctx=>{await scene(ctx,'hall','周・王章之議','受地與請隧',['xiangwang','wengong']);await ctx.say([{who:'xiangwang',expr:'serious',text:'王章也。未有代德而有二王，亦叔父之所惡也。'},{who:'wengong',expr:'worried',text:'功可以受賞，王者的名分，卻不能當成另一件賞物。'}]);await ctx.anchor('cp_01');ctx.unlock('person:cq_zhouxiangwang');return 'n_03';},
n_03:async ctx=>{await scene(ctx,'hall','周・襄王不許請隧','個人功勞與公共典章',['xiangwang','wengong']);await ctx.say([{who:'xiangwang',expr:'serious',text:'余何敢以私勞變前之大章，以忝天下，其若先王與百姓何？何政令之為也？'}]);await ctx.anchor('cp_02');const v=await choice(ctx,'king',{title:'受地而還時，你如何理解這次拒絕？',text:'請隧被拒是史實；選擇記錄你如何對待功勞與制度。',options:[{label:'受賞而尊王章，以治理與救患建立列國的信任。',value:'respect'},{label:'只把拒絕當作羞辱，日後凡有功就要求越過制度。',value:'rank'}]});ctx.add('heart',v==='respect'?10:0);await ctx.say([{who:'wengong',expr:v==='respect'?'serious':'worried',text:v==='respect'?'受地而還。霸業要讓人相信，不能只要求別人把名分讓給我。':'若只記住受拒的難堪，便忽略了王章對整個政治秩序的意義。'}]);return 'n_04';},
n_04:async ctx=>{await scene(ctx,'road','晉・伐原','前635年・三日之糧',['wengong','zifan','junli']);await ctx.say([{text:'晉侯圍原，約定三日之糧。原未降，文公命退；軍吏說原將降，請再等一等。'},{who:'wengong',expr:'serious',text:'信，國之寶也，民之所庇也。得原失信，何以庇之？'},{text:'文公退一舍，原降。這段退軍與後來退三舍不同：此時是履行用糧與時限之約，後來則是回報楚惠。相同的線索是信用。'}]);ctx.add('crown',5);return 'n_05';},
n_05:async ctx=>{await scene(ctx,'lu','魯・邊境','前634年・齊師將至',['shiguan','zhanxi','zhanqin']);await ctx.chapter('第一幕　恃先王之命','暫時扮演魯使展喜');await ctx.say([{who:'shiguan',expr:'serious',text:'先展開同時期另一國的一段辭令。這裡暫時扮演展喜，完成出使後再回到晉文公；魯事不由晉侯親自介入。'},{text:'齊孝公伐魯，魯僖公使展喜犒師，也使他向展禽受命。齊師尚未入境，展喜已前往。'},{who:'zhanqin',expr:'serious',text:'物力不足時，不能只與強國爭兵多兵少。先讀對方也承認的盟命與責任。'},{who:'qixiao',expr:'serious',text:'室如縣罄，野無青草，何恃而不恐？'}]);await ctx.anchor('cp_03');ctx.unlock('person:cq_zhanxi');ctx.unlock('person:cq_zhanqin');ctx.unlock('idiom:shiruxuanqing');return 'n_06';},
n_06:async ctx=>{await scene(ctx,'lu','魯・展喜犒齊師','齊魯先祖之盟',['zhanxi','qixiao']);await ctx.say([{who:'zhanxi',expr:'serious',text:'恃先王之命。昔周公、大公股肱周室，夾輔成王，成王勞之而賜之盟曰：世世子孫，無相害也！'},{who:'qixiao',expr:'serious',text:'魯國所恃，不只在眼前的庫與野？'}]);await ctx.anchor('cp_04');return 'n_07';},
n_07:async ctx=>{await scene(ctx,'lu','魯・先君與諸侯之望','讓退軍有一條路',['zhanxi','qixiao']);await ctx.say([{who:'zhanxi',expr:'serious',text:'及君即位，諸侯之望曰：其率桓之功。君必不然。恃此以不恐。'}]);await ctx.anchor('cp_05');await ctx.say([{text:'接下來你親自回應齊侯八次。先讀本輪目標，按開始才計時；答錯仍須改選，再讀回報。原文之外的追問是教學情境。'},{who:'zhanxi',expr:'serious',text:'先禮遇，再引盟命，繼以先君功業，最後留住對方的名聲。八句不是互相替換的口號。'}]);return 'n_08';},
n_08:async ctx=>{const r=await challenge(ctx,'wen_cp_zhanxi','zhanxi','犒師辭令・展喜出使','親回應八次、讀八次回報，以盟命與聲望勸齊退師。');ctx.unlock('text:zhanxikaoshi');ctx.add('crown',firstScore(r));await ctx.say([{text:'齊侯乃還。犒師的禮遇承接了政治勸說；你完成展喜這段體驗，現在回到晉文公。'}]);return 'n_09';},
n_09:async ctx=>{await scene(ctx,'hall','晉・宋使告急','前633年冬',['wengong','gongsungu','xianzhen']);await ctx.chapter('第二幕　報施救患','盟主，要讓別人看見援助');await ctx.say([{text:'宋與晉交好，離楚而即晉。楚與諸侯圍宋，宋使公孫固向晉告急。'},{who:'gongsungu',expr:'worried',text:'宋受圍，請晉救患。'},{who:'xianzhen',expr:'serious',text:'報施救患，取威定霸，於是乎在矣。'},{who:'wengong',expr:'serious',text:'流亡時宋曾厚待寡人；如今救宋，也是對列國說明晉能承擔什麼。'}]);await ctx.anchor('cp_06');ctx.unlock('person:cq_xianzhen');return 'n_10';},
n_10:async ctx=>{await scene(ctx,'tent','晉・救宋軍議','不只直赴宋都',['wengong','zifan','xianzhen']);await ctx.say([{who:'zifan',expr:'serious',text:'楚始得曹，而新昏於衛，若伐曹、衛，楚必救之，則齊、宋免矣。'},{who:'wengong',expr:'serious',text:'找楚不得不顧的關係，讓救宋不只變成一條正面戰線。'}]);await ctx.anchor('cp_07');return 'n_11';},
n_11:async ctx=>{await scene(ctx,'field','晉・被廬','前633年・作三軍',['wengong','zhaocui','xigu']);await ctx.say([{text:'晉在被廬整軍，作三軍，議元帥。趙衰薦郤縠。'},{who:'zhaocui',expr:'serious',text:'《詩》、《書》，義之府也；《禮》、《樂》，德之則也；德、義，利之本也。'},{who:'wengong',expr:'normal',text:'聽其言，也試其功。讓德義與能力一同支持任將。'}]);await ctx.anchor('cp_08');ctx.unlock('person:cq_xigu');return 'n_12';},
n_12:async ctx=>{await scene(ctx,'camp','晉・曹衛之役','前632年春',['wengong','xianzhen','zifan']);await ctx.say([{text:'前632年，郤縠卒，先軫接任中軍將，郤溱佐之；胥臣佐下軍。別把被廬初任的名單直接搬到城濮。'},{text:'晉侵曹、伐衛。入曹後，文公令不入僖負羈之宮，回報流亡時所受的禮遇。宋仍告急，齊秦尚未確定共同作戰。'},{who:'wengong',expr:'worried',text:'舍宋，則絕；告楚，不許。我欲戰矣，齊、秦未可，若之何？'}]);return 'n_13';},
n_13:async ctx=>{await scene(ctx,'tent','晉・宋再告急','齊秦未可',['xianzhen','wengong']);await ctx.say([{who:'xianzhen',expr:'serious',text:'使宋舍我而賂齊、秦，藉之告楚。我執曹君而分曹、衛之田以賜宋人。'},{text:'改變求援對象、土地利益與楚的顧慮，讓幾國交涉連動。這不只是「找越多朋友越好」，而是要看各國願為什麼介入。'}]);await ctx.anchor('cp_09');return 'n_14';},
n_14:async ctx=>{await scene(ctx,'chu','楚・撤宋與追晉之議','楚成王與子玉',['chucheng','ziyu']);await ctx.say([{who:'chucheng',expr:'serious',text:'無從晉師。晉侯在外十九年矣，而果得晉國。險阻艱難，備嘗之矣！'},{text:'楚成王勸勿追晉，子玉仍求戰。子玉使宛春告晉：請復衛侯而封曹，臣亦釋宋之圍。'}]);await scene(ctx,'tent','晉・宛春來使','楚一言而定三國',['wengong','wanchun','xianzhen']);await ctx.say([{who:'xianzhen',expr:'serious',text:'不如私許復曹、衛以攜之，執宛春以怒楚，既戰而後圖之。'},{text:'六筆交涉沙盤將讓你親派使者與選條件，辨明這套權謀如何重排聯盟；之後還要反思其代價。'}]);await ctx.anchor('cp_10');ctx.unlock('person:cq_ziyu');return 'n_15';},
n_15:async ctx=>{const r=await challenge(ctx,'cp_alliance','alliance','聯盟交涉・六筆親派','在列國關係圖親選目的國、條件並派使；六項任務與回報不可略過。');ctx.add('crown',firstScore(r)*2);return 'n_16';},
n_16:async ctx=>{await scene(ctx,'camp','晉・曹衛告絕於楚','局勢改變',['wengong','xianzhen','zifan']);await ctx.say([{text:'晉拘宛春於衛，私許復曹衛。曹衛告絕於楚，子玉怒，從晉師。'},{who:'xianzhen',expr:'serious',text:'楚一言定三國的局，已被改動。'},{who:'wengong',expr:'worried',text:'聯盟重排不代表每一個手段都沒有代價。'}]);const v=await choice(ctx,'diplomacy',{title:'六筆派使完成，你如何評拘使怒楚？',text:'原文的行動已發生；這裡辨政治效果與德行評價。',options:[{label:'承認離間與誘追的效果，也記下拘使失禮、升高戰爭風險的代價。',value:'weigh'},{label:'只要戰術有效，就當作所有手段都值得稱德。',value:'effect'}]});ctx.add('heart',v==='weigh'?10:0);await ctx.say([{who:'shiguan',expr:'serious',text:'計策的效果要讀懂，手段的責任也要另問。謀略分和德望分在這裡分開。'}]);return 'n_17';},
n_17:async ctx=>{await scene(ctx,'road','晉・楚追晉師','退三舍以前',['wengong','zifan','junli']);await ctx.chapter('第三幕　師直為壯','退軍，也在決定誰失理');await ctx.say([{who:'junli',expr:'worried',text:'以君辟臣，辱也。且楚師老矣，何故退？'},{who:'zifan',expr:'serious',text:'師直為壯，曲為老，豈在久乎！微楚之惠不及此，退三舍辟之，所以報也。'}]);await ctx.anchor('cp_11');ctx.unlock('idiom:tuibisanshe');return 'n_18';},
n_18:async ctx=>{await scene(ctx,'road','晉・退三舍','流亡恩遇與今日履約',['wengong','zifan']);await ctx.say([{who:'wengong',expr:'serious',text:'昔在楚受惠，曾許避楚三舍。如今君退而臣仍犯，直曲便有分別。'},{who:'zifan',expr:'serious',text:'我退而楚還，我將何求？若其不還，君退臣犯，曲在彼矣。'},{text:'晉退三舍，楚眾欲止，子玉不可。一舍三十古里，三舍九十古里；不要把它讀成現代九十公里。'}]);ctx.add('heart',firstGood(ctx,'cp_11')?10:0);return 'n_19';},
n_19:async ctx=>{await scene(ctx,'field','城濮・諸軍會合','前632年夏・四月',['wengong','zifan','xianzhen']);await ctx.say([{text:'晉與宋、齊、秦之師次於城濮。晉侯仍有疑慮，子犯把勝利收益與失利保障一同提出。'},{who:'zifan',expr:'serious',text:'戰而捷，必得諸侯。若其不捷，表裡山河，必無害也。'}]);await ctx.anchor('cp_12');ctx.unlock('idiom:biaolishanhe');return 'n_20';},
n_20:async ctx=>{await scene(ctx,'battle','城濮・會戰軍議','三軍協同',['wengong','xuchen','xianzhen']);await ctx.say([{who:'xuchen',expr:'serious',text:'下軍先當陳蔡。蒙馬虎皮，先動楚的右軍。'},{text:'狐毛、欒枝配合旗退與曳柴偽遁，誘楚追進；先軫郤溱中軍橫擊，狐毛狐偃上軍夾攻子西。'},{who:'wengong',expr:'serious',text:'各軍不是同時亂衝。先擾一翼，再誘追，橫擊、夾攻才有位置。'}]);await ctx.anchor('cp_13');ctx.unlock('person:cq_xuchen');return 'n_21';},
n_21:async ctx=>{await scene(ctx,'battle','城濮・指揮沙盤','你親自送出每一道令',['wengong','huma','luanzhi']);await ctx.say([{text:'先親放三軍，再做三段退軍與四道會戰令。這是將先前退三舍與城濮部署連起來的回演；不把兩者當作同一地點的七次真實回合。'},{text:'會戰每一步都要親選部隊、目標與戰術後送令。楚右軍在畫面左，楚左軍在畫面右，是兩軍面對面之故。部署不合任務會增加損失。'},{text:'90活動秒，準備、軍報、說明與暫停不計時。錯令須親自改正；不限時提示不會代你退軍、出擊或收隊。'}]);return 'n_22';},
n_22:async ctx=>{const r=await challenge(ctx,'cp_battle','battle','三舍與城濮・協同軍令','親放三軍、三舍退軍、四道會戰令、讀七報並收軍整隊。'),f=r.firstResult||r;setMeter(ctx,'shield',f.force??r.completion.force);ctx.add('crown',firstScore(r)*2);return 'n_23';},
n_23:async ctx=>{await scene(ctx,'battle','城濮・收軍','楚師敗績',['wengong','xianzhen','ziyu']);await ctx.say([{text:'楚師敗績。子玉收其卒而止，故不敗。'},{who:'shiguan',expr:'serious',text:'楚整體敗，與子玉中軍仍收住，可以同時成立。不是把所有楚部隊寫成全數消失。'},{text:'晉軍留於楚營三日而還。子玉其後死於連穀。遊戲高低分評本局指揮與保全，史實都回到晉勝楚。'}]);return 'n_24';},
n_24:async ctx=>{await scene(ctx,'palace','踐土・王宮','前632年五月・策命侯伯',['xiangwang','wengong']);await ctx.chapter('第四幕　敬服王命','勝一戰，接著要承擔四國');await ctx.say([{text:'晉為周王作王宮於踐土。王命尹氏、王子虎與內史叔興父策命晉侯為侯伯，賜彤弓、彤矢等。'},{who:'xiangwang',expr:'serious',text:'敬服王命，以綏四國，糾逖王慝。'},{who:'wengong',expr:'serious',text:'重耳敢再拜稽首，奉揚天子之丕顯休命。'}]);await ctx.anchor('cp_14');ctx.unlock('treasure:tonggong');ctx.add('heart',firstGood(ctx,'cp_14')?10:0);return 'n_25';},
n_25:async ctx=>{await scene(ctx,'hall','踐土・盟後之議','侯伯的責任',['wengong','zifan']);const v=await choice(ctx,'peace',{title:'受命之後，你要把勝利用在哪裡？',text:'踐土受命依史實完成；此選擇記錄你對主盟責任的理解。',options:[{label:'以綏四國，兌現救患與守約，讓兵民能安定生活。',value:'care'},{label:'把勝利當作私人名位，只要求列國承認自己的威風。',value:'glory'}]});ctx.add('heart',v==='care'?10:0);await ctx.say([{who:'wengong',expr:v==='care'?'serious':'worried',text:v==='care'?'威望要讓人願意相信下一次援助與承諾。侯伯之命，不止是一張慶功策書。':'若只剩威風，先前勤王、救宋與退三舍的信用，便難以延續。'}]);return 'n_26';},
n_26:async ctx=>{await scene(ctx,'academy','史官・並讀兩話','從泓水到城濮',['shiguan','wengong','zifan']);await ctx.say([{who:'shiguan',expr:'serious',text:'上一話宋襄公不趁楚未渡、未列；這一話晉文公退三舍後會戰。都在談禮、時機與兵民代價，不能把所有「等」或「退」當成同一決策。'},{who:'zifan',expr:'serious',text:'退三舍是履約與改變直曲；到了城濮，再看地形、聯盟與各軍協同。'},{who:'shiguan',expr:'normal',text:'展喜用先王盟命勸強國，襄王用王章限有功之臣。語言不只表達態度，也界定對方能怎樣行動。'}]);return 'n_27';},
n_27:async ctx=>{await scene(ctx,'palace','晉・霸業回望','本局收卷',['wengong','zifan','shiguan']);await choice(ctx,'reflection',{title:'選一個問題帶進結算',text:'立場不計分；請引用原文與一次自己的操作作分析。',options:[{label:'展喜如何讓物力不足的魯國取得說話的位置？',value:'speech'},{label:'聯盟交涉的有效計策，是否也有失禮與激化的代價？',value:'diplomacy'},{label:'退三舍如何同時關係到報惠、守信與用兵？',value:'retreat'}]});await ctx.say([{who:'wengong',expr:'serious',text:'這一局，你親說八次辭令、親派六筆使者、親自調度退避、誘敵與夾擊。從功勞到王章，從求援到聯盟，從守約到協同，都要把理由說清楚。'},{who:'shiguan',expr:'serious',text:'本局評語不同，晉勝楚與踐土受命的史實不變。用第一次的操作與原文，評你的取捨與代價。'}]);const strategy=ctx.state.vars.zhanxi.firstScore*3+ctx.state.vars.alliance.firstScore*3+ctx.state.vars.battle.firstScore*4;return ctx.end({key:strategy>=75&&ctx.meter('heart')>=70?'great':strategy>=45?'good':'bad'});}

function payload(s,ending){const a=s.vars.zhanxi.firstScore,b=s.vars.alliance.firstScore,c=s.vars.battle.firstScore,v=(Number(s.vars.choices.king==='respect')+Number(s.vars.choices.diplomacy==='weigh')+Number(s.vars.choices.peace==='care')+Number(firstGood(game.ctx,'cp_11'))+Number(firstGood(game.ctx,'cp_14')))*20;return{scenarioId:SID,chapterVersion:VERSION,runId:s.vars.runId,mode:MODE,faction:'晉',country:'晉',role:'晉文公',roleKind:'shijia',bioTitle:'晉世家・文公',bioOpening:'晉文公重耳，晉獻公之子也。',ending,scoreStrategy:Math.round(a*3+b*3+c*4),scoreVirtue:v,turns:s.steps,durationSec:Math.min(5400,Math.round((Date.now()-s.startedAt)/1000)),deeds:['前635勤王復襄王，請隧被拒，受地而還，辨功勞與王章。','前634暫扮魯使展喜，八次辭令首次'+a+'分；以盟命、先君與諸侯期待勸齊退師。','前633宋告急，被廬作三軍，趙衰以德義與功績薦郤縠。','前632郤縠卒，先軫將中軍；六筆派使首次'+b+'分，辨齊秦、曹衛、宋楚的利益連動。','對讀私許復國、拘使怒楚，分辨計策效果與失禮風險。','三軍部署、退軍、會戰與收軍皆親做，首次'+c+'分；主線晉勝楚，子玉中軍收卒。','踐土受命為侯伯、受彤弓，仍須敬服王命、以綏四國。'],anchors:copy(s.anchors),games:copy(s.games),codex:s.codex.slice(),opener:'遊戲史官評語（自擬）：余讀文公勤王，見有功而不得隧；展喜犒師，見國困而能恃命。名分既定，言有其據。及宋告急，先軫圖救患以定霸，子犯謀曹衛以牽楚，趙衰薦郤縠而本德義。城濮之役，先調列國，繼退三舍，後以三軍協同；直曲不在久，勝捷不止奇招。然私許拘使，效可見而責亦當問。王策為侯伯，非許為天子。是局記親辭、親派、親令，問信用如何得人，權謀如何有度，威望如何安民；不借沙盤改寫史實，不以手速判定德行。',prompts:['引用展喜的兩句話，結合你的一次辭令回應，說明先王盟命、先君功業與諸侯期待如何形成說服；與襄王拒請隧有何共同界線？','從六筆交涉選一次派使，說明它改變了誰的利益或依靠；再以拘宛春怒楚為例，區分政治效果與德行評價。','引用師直為壯、曲為老，結合一段退軍與一道會戰令，分析報惠守約、地形保障與協同的關系；比較泓水，不要只用「等」或「退」作單一評價。'],experience:{firstAnchors:copy(s.vars.firstAnchors),zhanxi:copy(s.vars.zhanxi),alliance:copy(s.vars.alliance),battle:copy(s.vars.battle),decisions:copy(s.vars.choices)}};}
