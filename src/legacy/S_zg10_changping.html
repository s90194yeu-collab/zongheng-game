n_12:async ctx=>{await scene(ctx,'handan','趙・邯鄲','還國・位在廉頗之右',['lin','lian']);await ctx.chapter('第三幕　敢抗秦，為何避廉頗？','國家之急與私讎');await ctx.say([{text:'相如以功拜上卿，位在廉頗之右。這裡「右」表示地位較高，不是澠池宴席的方向。'},{who:'lian',expr:'angry',text:'我為趙將，有攻城野戰之大功；相如徒以口舌為勞，而位居我上。'},{text:'廉頗揚言見相如必辱之，相如常稱病不與爭列，出行遇廉頗也引車避匿。'}]);return 'n_13';},
n_13:async ctx=>{await scene(ctx,'home','趙・相如門下','日・舍人不解',['lin']);await ctx.say([{text:'舍人以為避讓可羞，想辭去。相如反問：廉將軍與秦王孰強？我不怕強秦，難道只因怕廉頗才躲？'},{who:'lin',expr:'serious',text:'今兩虎共鬥，其勢不俱生。吾所以為此者，以先國家之急而後私讎也。'}]);await ctx.anchor('cg_08');return 'n_14';},

n_16:async ctx=>{await scene(ctx,'zhao','趙・新君即位','時間後移・孝成王時',['xiao','queen']);await ctx.chapter('第四幕　不捨，是愛的全部嗎？','你轉為左師觸讋');await ctx.say([{text:'趙惠文王已卒，趙孝成王新立，太后用事。秦急攻趙，齊要長安君入質才出兵。這不是先前隨相如赴澠池的惠文王；人物與時間已轉換。'},{who:'queen',expr:'angry',text:'有復言令長安君為質者，老婦必唾其面！'}]);ctx.unlock('person:zg_chulong');return 'n_17';},

n_18:async ctx=>{await ctx.say([{who:'chu',expr:'worried',text:'老臣病足，曾不能疾走，不得見久矣。'},{who:'queen',expr:'serious',text:'老婦恃輦而行。'},{text:'觸讋關問飲食，說自己每日稍走、少益嗜食，太后之色少解。他再談幼子舒祺，希望使其入宮補黑衣之數；從自己的愛子之心，逐步轉到太后的考量。'}]);return 'n_19';},

function payload(s,ending){const scores=['bi','mianchi','buji'].map(k=>s.vars[k].firstScore);return{scenarioId:SID,chapterVersion:VERSION,runId:s.vars.runId,mode:MODE,faction:'趙',country:'趙',role:'藺相如',roleKind:'liezhuan',bioTitle:'廉頗藺相如列傳',bioOpening:'藺相如者，趙人也，為趙宦者令繆賢舍人。',ending,scoreStrategy:Math.round(scores.reduce((a,b)=>a+b,0)/30*100),scoreVirtue:Math.round(s.anchors.filter(a=>a.correct).length/13*100),turns:s.steps,durationSec:Math.min(5400,Math.round((Date.now()-s.startedAt)/1000)),deeds:['扮演相如，八次秦廷策略與親送璧，首次'+scores[0]+'分。','澠池先看再回節奏、親核三個御史字幕，首次'+scores[1]+'分。','對讀先國後私與負荊，練習穩住將相合作。','轉觸讋視角，讀關問起居、愛子與計深遠。','四回合親配十二次糧、查證流言，親閱換將；首次'+scores[2]+'分。'],anchors:copy(s.anchors),games:copy(s.games),codex:s.codex.slice(),opener:'遊戲史官評語（自擬）：相如持璧，勇中有計；澠池爭禮，強言有備；讓廉頗，知國急先私怨。觸讋論愛，從起居之問到子孫之計。長平用將失當，糧道既絕，敗亡之痛不可掩。願以原文與親身取捨，辨勇與莽、名與實、眼前與深遠。',prompts:['藺相如的勇敢和魯莽有什麼差別？引用一段秦廷或澠池原文，以一次策略或拍點、字幕操作說明。','如果同僚不服你，你會如何回應？對讀先國後私與負荊，再引用一次合作選擇或配糧查報紀錄。','觸讋的說話方式如何應用於親子溝通？引用開場與計深遠，說明如何關心、理解情緒並提出長遠安排。'],experience:{firstAnchors:copy(s.vars.firstAnchors),bi:copy(s.vars.bi),mianchi:copy(s.vars.mianchi),buji:copy(s.vars.buji),decisions:copy(s.vars.choices)}};}
async function onEnd(r,ctx){const s=ctx.state;if(ORDER.some(id=>!s.anchors.some(a=>a.anchorId===id))||['cg_bi','wen_cg_mianchi','cg_buji'].some(id=>!s.games.some(g=>g.gameId===id&&!g.skipped))||['bi','mianchi','buji'].some(k=>!s.vars[k]?.completed)||CODEX_KEYS.some(id=>!s.codex.includes(id)))throw Error('必要體驗或對讀尚未完成，請接續本話。');const ending=ENDINGS[r.key]||ENDINGS.good,p=s.vars.finishPayload||payload(s,ending);await ctx.banner(ending.title,'廉頗藺相如列傳・本局評語');await ctx.say([{text:ending.text},{who:'shiguan',expr:'serious',text:'到結算留下反思，把原文、首次判斷與親自操作放在同一份證據中。'}]);if(s.vars.submitted){ZH.session.set('result:'+SID,p);ZH.go('result',{s:SID});return;}s.vars.finishPayload=p;await checkpoint();await journal.flush();ZH.finishScenario(p);s.vars.submitted=true;await checkpoint();}
async function start(saved){if(loading)return;loading=true;ROOT.innerHTML='';game=ZH.story.create(ROOT,{id:SID,mode:MODE,title:'將相長平',subtitle:'敢抗強秦，也懂退讓；名聲能代替應變嗎？',seed:Number(params.seed)||0,start:'n_01',characters:CHARACTERS,scenes:SCENES,nodes:NODES,meters:[{id:'courage',label:'膽識',icon:'sword',max:100,start:55},{id:'anger',label:'秦王怒氣',icon:'flame',max:100,start:40,danger:70,invert:true},{id:'team',label:'將相和',icon:'heart',max:100,start:55}],help:HELP,anchorOrder:ORDER,anchorTotal:13,anchorRunner,snapshot,save,onProgress:save,onEnd,initState:()=>({vars:{schema:SCHEMA,runId:'cg_'+Date.now().toString(36)+'_'+crypto.getRandomValues(new Uint32Array(1))[0].toString(36),firstAnchors:{},choices:{}}})});window.__ep=game;loading=false;game.start(saved||null);}
function title(saved){const compatible=saved?.vars?.schema===SCHEMA,st=compatible?saved:null;ROOT.innerHTML='<main class="cg-title"><div class="cg-title-bar"><span class="zh-mark"><span class="zh-mark__re">Re:</span><span class="zh-mark__name">縱橫鼎業</span></span><button class="zh-btn zh-btn--quiet" data-home>回首頁</button></div><header><p class="cg-kicker">戰國篇・第十話・趙</p><h1>將相長平</h1><p class="cg-subtitle">敢抗強秦，也懂退讓；名聲能代替應變嗎？</p><div class="ep-chips"><span class="zh-chip zh-chip--patina">外交 × 合作 × 前線補給</span><span class="zh-chip">自動存檔</span></div></header><section class="cg-title-scene" aria-label="藺相如與廉頗">'+panorama('zhao',['lin','lian'])+'</section><section class="cg-start"><span class="cg-seal" aria-hidden="true">和</span><div><h2>藺相如 → 觸讋 → 趙方軍議</h2><p class="cg-note">親選秦廷策略、澠池回拍與核字幕、長平配糧查報；從強硬到退讓，練習判斷。</p></div><div class="cg-start-actions">'+(st?'<button class="zh-btn zh-btn--primary" data-continue>'+(st.ended?'查看結局':'繼續遊戲')+'</button>':'')+'<button class="zh-btn '+(st?'zh-btn--quiet':'zh-btn--primary')+'" data-new>'+(st?'重新開始':'開始遊戲')+'</button></div></section><section class="cg-points"><div><b>完璧歸趙</b><p class="cg-note">八次交涉，掌握膽識與怒氣分寸，親核從者衣褐、徑道歸璧。</p></div><div><b>澠池擊缻</b><p class="cg-note">先看四向節奏，再按回應；三次親核御史字幕，維護對等。</p></div><div><b>長平補給線</b><p class="cg-note">四回合配糧、查證、澄清；親閱史實換將，檢討支援與應變。</p></div></section>'+(saved&&!compatible?'<p class="cg-follow">偵測到不同版本進度。新版另開一局，先前已登錄的成績與史冊保留。</p>':'')+'<p class="cg-note">預留約25～35分鐘。十三個原文對讀、三項必要體驗；卡關可不限時親自補做。v1.1.0</p></main>';ROOT.querySelector('[data-home]').onclick=()=>ZH.go('hub');const cont=ROOT.querySelector('[data-continue]');if(cont)cont.onclick=()=>start(st);ROOT.querySelector('[data-new]').onclick=async()=>{if(loading)return;if(saved){const ok=await ZH.modal({title:'另開一局？',body:'<p>此話未完成的進度會清除；已登錄的成績與史冊保留。</p>',actions:[{label:'取消',value:false,kind:'quiet'},{label:'重新開始',value:true,kind:'primary'}]});if(!ok)return;}await journal.clear();start(null);};}
ZH.ready(async()=>{if(!ZH.story?.createJournal||!ZH.arena||!window.ART){ROOT.innerHTML='<main class="cg-title"><h1>共用核心尚未齊備</h1><p>請使用目前的 Eng_Story、Art_kit 與挑戰賽共用檔。</p><button class="zh-btn zh-btn--primary" data-home>回首頁</button></main>';ROOT.querySelector('[data-home]').onclick=()=>ZH.go('hub');return;}journal=ZH.story.createJournal({id:SID,mode:MODE,scope:ZH.user?.email||window.ZH_BOOT.user?.email||'guest',remote:s=>ZH.save(SID,MODE,{engine:s,chapterVersion:VERSION})});ZH.loading(true,'展開將相長平的竹簡');try{const [saved]=await Promise.all([load(),ZH.anchor.load(SID),ZH.codex.init()]);if(ORDER.some(id=>!ZH.anchor.get(SID,id)))throw Error('第十話題庫尚未加入，請一併放入 S_zg10_changping_data，並清除題庫快取後部署。');ZH.loading(false);if(String(params.mode||'')===MODE&&saved?.vars?.schema===SCHEMA)start(saved);else title(saved);}catch(e){ZH.loading(false);ROOT.innerHTML='<main class="cg-title"><h1>載入尚未完成</h1><p>'+E(e.message||String(e))+'</p><button class="zh-btn zh-btn--primary" data-reload>重新載入</button></main>';ROOT.querySelector('[data-reload]').onclick=()=>location.reload();}});
