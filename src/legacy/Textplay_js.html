function tacticHint(rule){return{retreat:'所有隊伍退到西側三線內。',flank:'主隊在中央（440,220），北翼到北側（620,85）。',lure:'主隊先到東方接近追兵，再下佯退令，退回西方。',pincer:'主隊在中央（480,220），兩翼分到北、南側，再下協擊令。',seal:'北翼到西端（185,230），南翼到東端（680,230），保持隱蔽。',ally:'姜戎到西端（180,230），北翼到（250,100）聯絡。',close:'兩翼分到（280,230）與（590,230），再協擊。',halfCross:'看渡河比例約35%～75%，再下協擊。',escort:'主隊與後備靠近，兩隊都留在西半場。',rally:c.naval?'所有船到西岸。':'全隊到收軍區（450～640,150～340）。',threat:'主隊逼近大梁（690,365），下協擊牽動回援。',recall:'主隊在大梁，北翼到回援路側（470,85）。',allies:'五國各到自己的接應圈。',discipline:'兩翼留駐北南兩側，再下守紀令。',naval:'前船先到西側水口。'}[rule]||'依地形標記與本段條件親下令。';}
function pause(value){paused=value;root.dataset.t3Paused=String(value);Object.keys(keys).forEach(k=>keys[k]=false);root.querySelector('[data-t3=pause]').textContent=value?'繼續':'暫停';persist();render();}
async function dispatch(a,v){if(!alive)return;if(a==='zoom'){root.querySelector('.t3-board-scroll').classList.toggle('is-zoomed');return;}if(a==='pause'||a==='resume'){pause(a==='resume'?false:!paused);return;}if(a==='save'||a==='exit'){persist();try{const r=await g.checkpoint?.();if(r?.ok===false){say('儲存尚未完成，請稍後再試。');return;}if(a==='exit'){pause(true);if(g.exit)g.exit();else ZH.go?.('hub');}else say('此段進度已保存。');}catch(e){say('儲存尚未完成：'+e.message);}return;}if(paused||document.hidden)return;
 if(a==='finish'){const r=m.result();if(r){dispose();resolve(r);}return;}if(a==='begin')m.start();else if(a==='next')m.next();else if(a==='proof')m.select(Number(v));else if(a==='submit')m.submit();else if(a==='assist')m.assist();else{if(a==='note'||a==='listen'||a==='strikeOnce')tone(Number(v)||0);m.act(a,v);}render();}
listen(root,'click',e=>{const el=e.target.closest('[data-t3]');if(!el||el.disabled)return;let v=el.dataset.value;try{v=JSON.parse(v);}catch{}dispatch(el.dataset.t3,v);});
listen(root,'pointerdown',e=>{const el=e.target.closest('[data-t3-hold]');if(el){e.preventDefault();keys[el.dataset.t3Hold]=true;el.setPointerCapture?.(e.pointerId);}});
listen(w,'pointerup',()=>Object.keys(keys).forEach(k=>keys[k]=false));listen(w,'pointercancel',()=>Object.keys(keys).forEach(k=>keys[k]=false));
listen(canvas,'click',e=>{if(paused||document.hidden)return;const p=renderer.point(e.clientX,e.clientY);if(c.kind==='journey')m.act('route',p);if(c.kind==='tactics'||c.kind==='ambush'&&m.s.phase==='deploy'){const i=m.s.units.findIndex(u=>Math.hypot(u.x-p.x,u.y-p.y)<30);m.act(i>=0?'unit':'move',i>=0?i:p);}if(c.kind==='land'){const x=Math.floor((p.x-70)/80),y=Math.floor((p.y-35)/76);if(x>=0&&x<8&&y>=0&&y<5)m.act('canal',y*8+x);}render();});
const keyMap={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',Shift:'run',k:'block',K:'block',f:'call',F:'call'};
listen(w,'keydown',e=>{if(!root.isConnected||e.target.matches('input,textarea,select'))return;const key=keyMap[e.key];if(key&&!paused){keys[key]=true;e.preventDefault();}if(e.repeat)return;if(e.key==='Escape'||e.key==='p'||e.key==='P'){e.preventDefault();pause(!paused);return;}if(paused)return;if(c.kind==='journey'&&(e.key==='e'||e.key==='E')){e.preventDefault();dispatch('interact');}if(c.kind==='assault'||c.kind==='raid'){if(e.key===' '){e.preventDefault();dispatch('jump');}if(e.key==='j'||e.key==='J')dispatch('strike');if(e.key==='f'||e.key==='F')dispatch('signal');}if(c.kind==='horses'&&e.key===' '){e.preventDefault();dispatch('pace');}if(c.kind==='music'&&/^[1-5]$/.test(e.key))dispatch('note',Number(e.key)-1);});
listen(w,'keyup',e=>{const k=keyMap[e.key];if(k)keys[k]=false;});listen(w,'blur',()=>pause(true));listen(document,'visibilitychange',()=>{if(document.hidden)pause(true);});
function frame(now){if(!alive||!root.isConnected)return;const dt=Math.min(.05,Math.max(0,(now-(last||now))/1000));last=now;if(!paused&&!document.hidden&&!document.querySelector('.zh-modal,.zh-cutin')){m.step(dt,keys);if(m.s.phase!==lastPhase)render();else{say(m.s.message);if(now-lastHud>200){stat();lastHud=now;}}if(now-lastPersist>3000){persist();lastPersist=now;}}
renderer.draw(m.s);raf=requestAnimationFrame(frame);}
active={root,c,m,persist,dispatch,pause,dispose};g.onCleanup?.(dispose);render();raf=requestAnimationFrame(frame);
});}
async function direct(sid,id,state,save){const c=route(sid,id,state);if(!c)return null;state._textPlay=state._textPlay||{};const prior=state._textPlay[id]||{};if(prior.result)return prior.result;
const host=document.createElement('div');host.className='t3-direct';document.body.append(host);const oldOverflow=document.body.style.overflow;document.body.style.overflow='hidden';const hidden=[...document.body.children].filter(x=>x!==host&&!['SCRIPT','STYLE'].includes(x.tagName)).map(x=>[x,x.inert]);hidden.forEach(([x])=>x.inert=true);let clean=[];const g={rng:()=>.717, getProgress:()=>state._textPlay[id]?.progress||{},setProgress:v=>{state._textPlay[id]={...(state._textPlay[id]||{}),progress:v};},checkpoint:()=>save?.(),onCleanup:f=>clean.push(f)};
try{const r=await play(c,host,g);state._textPlay[id]={progress:state._textPlay[id]?.progress,result:r};await save?.();ZH.track?.('minigame',{scenarioId:sid,gameId:recordId(id),score:r.score,maxScore:10,durationSec:r.sec,ruleset:'t3'});return r;}finally{clean.forEach(f=>f());host.remove();document.body.style.overflow=oldOverflow;hidden.forEach(([x,v])=>x.inert=v);}}
function dialogue(sid,text,state){if(!eligible(state))return text;return D.dialoguePatches?.[sid]?.[text]??text;}

let chapterButton=null,chapterState=null,chapterId='',chapterMeta={};
function install(sid,state,meta={}){if(!D.chapters[sid])return;chapterId=sid;if(meta.player)chapterMeta=meta;if(state)chapterState=state;if(!chapterButton){chapterButton=document.createElement('button');chapterButton.type='button';chapterButton.className='t3-chapter-help';chapterButton.textContent='任務脈絡';chapterButton.onclick=()=>{const base=D.chapters[chapterId],ch={...base,...(base.variants?.[chapterMeta.player]||{})},tasks=Object.values(D.activities).filter(a=>a.scenarioId===chapterId&&a.id!=='ws_yanwu'&&(!chapterMeta.player||chapterMeta.player==='zheng'));const body='<div class="t3-help-body"><p><b>你是：'+E(ch.actor)+'</b></p><p>'+E(ch.situation)+'</p><p>'+E(ch.cause)+'</p><ul>'+tasks.map(a=>'<li><b>'+E(a.title)+'</b>：'+E(a.goal)+'</li>').join('')+'</ul><p>'+E(ch.limit)+'</p>'+(!chapterState?'<p>開始新遊戲會使用新版任務；既有進度可繼續原局。</p>':!eligible(chapterState)?'<p>這份既有進度沿用原局玩法，重新開始可體驗新版。</p>':'')+'</div>';ZH.modal?.({title:ch.name+'｜任務脈絡',body,actions:[{label:'回到場景',value:true,kind:'primary'}]});};document.body.append(chapterButton);}chapterButton.hidden=false;
}
function validResult(id,r){const c=D.activities[id];if(!c||!r||r.ruleset!=='t3'||r.completed!==true||r.max!==10||!Number.isInteger(r.score)||r.score<0||r.score>10||r.completion?.complete!==true)return false;if(c.kind==='journey'){const n=c.scenes.reduce((n,s)=>n+s.items.length,0);return r.arrived===true&&r.found?.length===n&&r.read?.length===n;}if(c.kind==='chorus')return r.answers?.length===c.rounds.length;return true;}
ZH.textplay={version:'3.0.0',install,helpHTML,validResult,eligible,route,recordId,chapter,wrap,play,direct,dialogue,activities:D.activities,current:()=>active?{id:active.c.id,state:active.m.snapshot(),paused:active.root.dataset.t3Paused==='true'}:null};
})(window);
</script>
