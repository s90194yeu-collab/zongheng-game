function play(kind){return(body,g)=>new Promise(resolve=>{
 const model=M[kind](g.getProgress().model,g.rng),s=model.s;let alive=true,last=performance.now(),lastFrame=0,lastUi=0,raf=0,bucket=-1,ui={};
 const race=g.race({me:{qihuo:'你的估值',xunbao:'論證筆記',shu:'上書信使'}[kind],rival:{qihuo:'其他商人',xunbao:'逐客的期限',shu:'出關的時刻'}[kind],goal:{qihuo:'辨成本、回報、風險，親選支持方案',xunbao:'親走、親查、親讀九處材料',shu:'按原文布局親排十二段'}[kind]});
 const persist=()=>g.setProgress({model:model.snapshot()});
 function draw(){if(kind!=='xunbao'||!ui.player)return;ui.player.setAttribute('transform','translate('+s.player.x*60+','+s.player.y*60+')');const guard=model.guard();ui.guard.setAttribute('transform','translate('+guard.x*60+','+guard.y*60+')');ui.guard.style.opacity=s.assisted?'.35':'1';const here=model.here(),can=s.phase==='walk'&&!s.route.length&&here&&!s.read.includes(here.id);ui.inspect.disabled=!can;ui.inspect.textContent=can?'親查・'+here.name:s.route.length?'步行中・到達後查閱':here?'此處已讀・前往下一處':'抵達材料格再查閱';ui.here.textContent=here?here.name+'・'+(s.read.includes(here.id)?'已讀':'待查'):'道路・'+(s.player.x+1)+'列'+(s.player.y+1)+'行';}
 function clock(){if(ui.index)ui.index.textContent=kind==='qihuo'?'第'+(s.cursor+1)+'／4次取捨':kind==='xunbao'?'材料 '+s.read.length+'／9':'第'+Math.min(12,s.cursor+1)+'／12段';const paused=['plan','event','evidence'].includes(s.phase);if(ui.clock)ui.clock.textContent=s.assisted?'協助・不限時':['done','failed'].includes(s.phase)?'本次已結束':paused?'準備／閱讀・暫停':'剩 '+Math.ceil(s.left)+' 秒';if(ui.counters)ui.counters.textContent=kind==='qihuo'?'餘額 '+s.budget+'・淨益 '+s.net+'・合宜 '+s.correct:kind==='xunbao'?'步行 '+s.moves+'格・查問 '+s.seen+'次':'已排 '+s.correct+'・錯誤 '+s.wrong+'・連擊 '+s.streak;if(ui.note)ui.note.textContent=s.note;const r=model.race();race.me(r.me);race.rival(r.rival);draw();}
 function paint(){if(!alive)return;const focus=body.contains(document.activeElement)?[...document.activeElement.attributes].find(a=>a.name.startsWith('data-')):null,done=s.phase==='done',failed=s.phase==='failed';body.innerHTML='<div class="zk-game" data-kind="'+kind+'"><h2>'+({qihuo:'奇貨可居',xunbao:'咸陽・取物與取人',shu:'上書：諫逐客'}[kind])+'</h2><div class="zk-live"><b data-index></b><span data-clock></span><span data-counters></span></div>'+(!done&&!failed?({qihuo:qihuoBoard,xunbao:xunbaoBoard,shu:shuBoard}[kind])(model):'')+'<p class="zk-feedback" role="status" data-note></p>'+(done?'<p class="zk-follow">本次原分 '+s.first.score+'／10'+(s.assisted?'，親自補做已完成，原分保留。':'。')+'</p><button class="zh-btn zh-btn--primary" data-finish>交回挑戰成績</button>':'<button class="zh-btn '+(failed?'zh-btn--primary':'zh-btn--quiet')+'" data-assist '+(s.assisted?'hidden':'')+'>協助補做・不限時</button>')+'</div>';ui={index:body.querySelector('[data-index]'),clock:body.querySelector('[data-clock]'),counters:body.querySelector('[data-counters]'),note:body.querySelector('[data-note]'),player:body.querySelector('[data-player]'),guard:body.querySelector('[data-guard]'),inspect:body.querySelector('[data-inspect]'),here:body.querySelector('[data-here]')};clock();if(focus){const same=body.querySelector('['+focus.name+'="'+focus.value+'"]'),target=s.phase==='event'?body.querySelector('[data-next]'):s.phase==='evidence'?body.querySelector('[data-read]'):done?body.querySelector('[data-finish]'):same&&!same.disabled?same:body.querySelector('button:not(:disabled):not([hidden])');target?.focus({preventScroll:true});}persist();g.setStatus(done?'必要體驗完成':failed?'請親自補足體驗':s.assisted?'協助操作・原分保留':'正在挑戰');}
 function act(name,value){const phase=s.phase;let ok=false;if(name==='invest')ok=model.invest(value);else if(name==='select')ok=model.select(value);else if(name==='step'){const v={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[value];if(v)ok=model.step(...v);}else if(['begin','next','place','inspect','read'].includes(name))ok=model[name]();if(ok)g.sfx('click');if(s.phase!==phase||ok&&kind!=='xunbao')paint();else{clock();persist();}return ok;}
 const click=async e=>{if(!alive||pause())return;const b=e.target.closest('button');if(!b){const svg=e.target.closest('[data-map]');if(kind==='xunbao'&&svg&&s.phase==='walk'){const r=svg.getBoundingClientRect();model.move(Math.floor((e.clientX-r.left)/r.width*M.W),Math.floor((e.clientY-r.top)/r.height*M.H));clock();persist();}return;}if(b.disabled)return;if(b.hasAttribute('data-assist')){const ok=await ZH.modal({title:'協助補做',body:'<p>不限時提示，仍須親做四次取捨、步行查閱九處、親排十二段。提前協助原分0；失敗後保留原分。</p>',actions:[{label:'繼續挑戰',value:false,kind:'quiet'},{label:'開始補做',value:true,kind:'primary'}]});if(ok&&alive){model.assist();last=performance.now();paint();}return;}if(b.hasAttribute('data-finish')){if(s.phase!=='done')return;persist();alive=false;resolve({...model.result(),sec:s.assisted?g.elapsed():s.elapsed});return;}for(const name of ['invest','select','step','begin','next','place','inspect','read'])if(b.hasAttribute('data-'+name)){act(name,b.getAttribute('data-'+name));return;}};
 const key=e=>{if(!alive||pause()||e.altKey||e.ctrlKey||e.metaKey||e.repeat||e.target.matches('input,textarea,select'))return;const d={ArrowUp:'up',ArrowRight:'right',ArrowDown:'down',ArrowLeft:'left'}[e.key];if(kind==='xunbao'&&d&&s.phase==='walk'){e.preventDefault();act('step',d);}};
 body.addEventListener('click',click);window.addEventListener('keydown',key);
 function frame(now){if(!alive)return;raf=requestAnimationFrame(frame);if(now-lastFrame<32)return;lastFrame=now;const dt=Math.max(0,Math.min(.25,(now-last)/1000));last=now;if(pause())return;const phase=s.phase;model.advance(dt);if(s.phase!==phase)paint();else draw();if(now-lastUi>=250){lastUi=now;clock();}const next=Math.floor(s.elapsed/5);if(next!==bucket){bucket=next;persist();}}
 g.onCleanup(()=>{alive=false;cancelAnimationFrame(raf);body.removeEventListener('click',click);window.removeEventListener('keydown',key);});paint();raf=requestAnimationFrame(frame);
});}
async function challenge(ctx,id,kind,title,goal){const r=await ctx.minigame({id,title,goal,help:HELP,hideClock:true,skip:false,attempts:3},play(kind));const first=r.firstResult||r;if(!r.completed)throw Error('必要操作尚未完成，請接續親自補做。');ctx.state.vars[kind]=copy({...r,firstScore:first.score,firstMax:first.max});return r;}

function payload(s,ending){const scores=['qihuo','xunbao','shu'].map(k=>s.vars[k].firstScore);return{scenarioId:SID,chapterVersion:VERSION,runId:s.vars.runId,mode:MODE,faction:'秦',country:'秦',role:'李斯',roleKind:'liezhuan',bioTitle:'李斯列傳',bioOpening:'李斯者，楚上蔡人也。',ending,scoreStrategy:Math.round(scores.reduce((a,b)=>a+b,0)/30*100),scoreVirtue:Math.round(s.anchors.filter(a=>a.correct).length/12*100),turns:s.steps,durationSec:Math.min(5400,Math.round((Date.now()-s.startedAt)/1000)),deeds:['暫扮呂不韋，親做四次估值與異人支持取捨；首次'+scores[0]+'分。','對讀鄭國為間與渠成秦利，辨個案與一切逐客。','扮李斯步行查閱九處材料，親讀寶物與人物對比；首次'+scores[1]+'分。','親排十二段論證，核對四君、愛物逐人、道理與後果；首次'+scores[2]+'分。','對讀十二段原文，回到秦王撤令、李斯復官及鄭渠完成的史實。'],anchors:copy(s.anchors),games:copy(s.games),codex:s.codex.slice(),opener:'遊戲史官評語（自擬）：余讀諫逐客之書，見四君用客之功，又見取物取人之異。山海廣納，國亦需材；逐客資敵，非所以求無危。李斯為秦陳利，亦為己爭留。願以原文、成本取捨與親見材料，辨論證之強弱，不以私利一言盡廢其說。',prompts:['〈諫逐客書〉哪一段最有說服力？引用原文，連結一次尋寶材料或排序操作說明。','今天的國家怎樣看待外國人才？對讀鄭國為間與渠成秦利，說明個別風險、審查與一律排斥的差別。','李斯為秦國說話，也是在為自己說話，會減損說服力嗎？以兩項論據與一次首次判斷支持你的立場。'],experience:{firstAnchors:copy(s.vars.firstAnchors),qihuo:copy(s.vars.qihuo),xunbao:copy(s.vars.xunbao),shu:copy(s.vars.shu),decisions:copy(s.vars.choices)}};}
