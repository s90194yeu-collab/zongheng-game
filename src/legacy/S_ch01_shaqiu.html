<script>
(function () {
  'use strict';
  // Chapter helpers use the platform APIs. They do not replace the router,
  // catalogue, identity, saves, logging, codex or result services.
  const SID = 'S_ch01_shaqiu', E = ZH.esc;
  const KEY = 'shaqiu-platform-v1:' + (ZH.user.email || 'guest') + ':';
  let run = '', first = {}, progress = {}, latest = null;
  const clone = v => JSON.parse(JSON.stringify(v));
  const read = (k, d) => ZH.local.get(KEY + k, d);
  const write = (k, v) => ZH.local.set(KEY + k, v);
  const freshId = () => 'sq_' + Date.now().toString(36) + '_' + crypto.getRandomValues(new Uint32Array(1))[0].toString(36);
  const status = text => document.querySelectorAll('[data-sq-save]').forEach(el => { el.textContent = text; });
  const current = () => window.__ep && window.__ep.state;
  function meta(state) {
    state.vars = state.vars || {};
    state.vars.sqRunId = run;
    state.vars.sqFirst = clone(first);
    state.vars.sqProgress = clone(progress);
  }
  window.SQ = {
    read, write, runId: () => run,
    newRun() { run = freshId(); first = {}; progress = {}; latest = null; write('save', null); },
    useState(state) {
      const v = state && state.vars || {};
      run = v.sqRunId || freshId(); first = clone(v.sqFirst || {}); progress = clone(v.sqProgress || {});
      if (state) {
        state.progress=state.progress || {};
        // Preserve old recorded scores on their original scale. Existing runs
        // carry a legacy marker; do not invent missing first-attempt records.
        for(const rec of state.anchors || []) if(!first[rec.anchorId])first[rec.anchorId]=Object.assign({},rec,{completed:true,legacy:true});
        for(const rec of state.games || []) {
          if(state.progress['arena:'+rec.gameId])continue;
          const raw={score:rec.score,max:rec.maxScore,passed:rec.passed,completed:true,legacy:true,sec:rec.sec || 0};
          const normalized=Math.round((raw.score/Math.max(1,raw.max))*10);
          const key={sq_unify:'unify',sq_bolang:'bolang',sq_five_questions:'five'}[rec.gameId];
          if(key){state.vars[key+'Legacy']={score:raw.score,max:raw.max};state.vars[key+'Score']=normalized;}
          const attempt={r:clone(raw),mine:{score:normalized,sec:raw.sec},stars:normalized>=9?3:normalized>=7?2:normalized>=4?1:0,first:clone(raw)};
          state.progress['arena:'+rec.gameId]={tries:1,active:false,best:attempt,last:attempt,first:clone(raw)};
          rec.legacy=true;
        }
        meta(state);
      }
    },
    snapshot(snap) { meta(snap); },
    progress(k) { return progress[k] || {}; },
    saveProgress(k, value) { progress[k] = clone(value); },
    cacheProgress(state) { meta(state); latest = {engine:clone(state), updatedAt:Date.now(), chapterVersion:'v1.1.0'}; if(ZH.isGuest()) ZH.save(SID,'history',latest); else write('save',latest); },
    async saveState(state) {
      meta(state);
      const value = { engine: clone(state), updatedAt: Date.now(), chapterVersion: 'v1.1.0' };
      latest = value; write('save', value);
      status(ZH.isGuest() ? '訪客進度已暫存於此分頁' : '正在保存進度');
      try {
        const r = await ZH.save(SID, 'history', value);
        status(r && r.ok ? (ZH.isGuest() ? '訪客進度已暫存於此分頁' : '進度已保存') : '已存此裝置・雲端尚未保存，請匯出備份');
        return r;
      } catch (e) { status('已存此裝置・雲端暫時未連線，請匯出備份'); return { ok: false }; }
    },
    async loadState() {
      const local = read('save', null);
      try {
        const r = await ZH.load(SID, 'history');
        const cloud = r && r.ok && r.state && r.state.engine ? r.state : null;
        // Guest progress follows Core_js's per-tab lifetime. School backups
        // cover failed RPCs and are scoped to the authenticated account.
        const value = ZH.isGuest() ? cloud : local && (!cloud || Number(local.updatedAt) > Number(cloud.updatedAt || 0)) ? local : cloud;
        latest = value;
        if (value) write('save', value);
        return value;
      } catch (e) { latest = ZH.isGuest() ? null : local; return latest; }
    },
    checkpoint() {
      const state = current();
      if (state) meta(state);
      // Commit the first answer before any modal continuation or page reload.
      if (window.__ep && window.__ep.save) return window.__ep.save().then(()=>ZH.flushAll ? ZH.flushAll() : null);
      return Promise.resolve();
    },
    download(value, name) {
      const url = URL.createObjectURL(new Blob([JSON.stringify(value, null, 2)], { type: 'application/json;charset=utf-8' }));
      const a = document.createElement('a'); a.href = url; a.download = name;
      document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
    },
    async exportSave() {
      await SQ.checkpoint();
      SQ.download({ format: 'shaqiu-full', version: 1, save: latest, run, progress, first }, '秦政與沙丘_進度.json');
    },
    async importSave(data) {
      if (JSON.stringify(data.save).length > 45000) throw Error('進度檔過大，請使用本話匯出的檔案。');
      const state = clone(data.save.engine);
      state.vars = state.vars || {};
      state.vars.sqRunId = data.run || state.vars.sqRunId || freshId();
      state.vars.sqFirst = data.first || state.vars.sqFirst || {};
      state.vars.sqProgress = data.progress || state.vars.sqProgress || {};
      SQ.useState(state); await SQ.saveState(state);
    },
    teacher() { ZH.go('teacher'); },
    async finish(payload) {
      const state=current(),v=state?.vars || {},required=['sq_unify','sq_bolang','sq_five_questions'];
      if(payload.anchors.length!==12 || payload.codex.length!==12 || required.some(id=>!payload.games.some(g=>g.gameId===id&&!g.skipped)) || !['roads220','frontier215','afang212'].every(id=>state.flags['policy_'+id]?.length===2)) throw Error('必要體驗尚未完成，請接續本話。');
      payload.runId=run;payload.chapterVersion='v1.1.0';
      payload.experience={unify:v.unifyResult,bolang:v.bolangResult,five:v.fiveResult,policy:clone(progress),firstAnchors:clone(first)};
      await SQ.checkpoint();
      // Core_js logs the scenario and transfers the complete payload to Result.
      if(read('finishedRun','')===run){const prior=ZH.session.get('result:'+SID,null);ZH.session.set('result:'+SID,Object.assign({},payload,prior || {}));ZH.go('result',{s:SID});return;}
      write('finishedRun',run);
      return ZH.finishScenario(payload);
    }
  };

  // Read questions through Anchor_js.load/get so edits made by the teacher in
  // AnchorBank remain authoritative. This chapter's overlay adds durable
  // first-answer records while reporting every attempt through Core_js.track.
  SQ.runAnchor = (a,options={}) => new Promise(resolve => {
    let rec = first[a.id];
    if (rec && rec.completed) return resolve(clone(rec));
    let reading = false, finished = false, shownAt = performance.now();
    const previous = document.activeElement;
    const order = a.options.slice();
    for (let i = order.length - 1; i > 0; i--) { const j = Math.floor((window.__ep ? window.__ep.ctx.rng() : crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296) * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }

  function scoreValues(s) {

    const five = Number(s.vars.fiveScore) || 0;
    const care = Number(s.vars.careScore) || 0;
    const strategy = Math.round(Math.min(100, 20 + (unify / 10) * 20 + (bolang / 10) * 15 + (five / 10) * 20 + (anchorGood / 12) * 25));

    return { strategy: strategy, virtue: virtue };
  }

      '<div class="ep-title" style="--ep-color:' + esc(ROLE.color) + '">' +
      '<div class="ep-title__bar"><a class="zh-mark" href="#" data-a="home"><span class="zh-mark__re">Re:</span><span class="zh-mark__name">縱橫鼎業</span></a><button type="button" class="zh-btn zh-btn--quiet zh-btn--sm" data-a="home">回首頁</button></div>' +
      '<main class="ep-title__main"><header><p class="ep-kicker">' + esc([vol.no + ' ' + vol.name, ZH.episodeLabel(META), '前 ' + META.year + ' 年'].join('・')) + '</p>' +
      '<h1 class="ep-h1">' + esc(META.name) + '</h1><p class="ep-episode">' + esc(META.episode) + '</p>' +
      '<div class="ep-chips"><span class="zh-chip zh-chip--patina">' + esc(META.genre) + '</span><span class="zh-chip">自動存檔</span></div>' +
      (ZH.isGuest() ? '<p class="ep-note" style="margin-top:12px">訪客進度只保存在這個分頁。</p>' : '') + '</header>' +
      '<section class="ep-start"><span class="ep-seal" aria-hidden="true">' + esc(ROLE.glyph) + '</span><div><h2 class="ep-start__name">' + esc(ROLE.name) + '・' + esc(ROLE.title) + '</h2><p class="ep-start__lead">' + esc(ROLE.lead) + '</p></div><div class="ep-start__act">' +
      (st ? btn('continue', st.ended ? '查看結局' : '繼續', true) + btn('new', '重新開始', false) : btn('new', '開始遊戲', true)) +
      '</div></section><section class="sq-title-scene" aria-label="咸陽宮與本話人物">'+ART.scene('palace',{banner:'#3d4352',glyph:'秦'})+'<div class="sq-title-cast">'+['lisi','qinshihuang','zhaogao','fusu'].map(id=>'<span>'+ART.portrait(CHARACTERS.find(c=>c.id===id),{expr:id==='zhaogao'?'smirk':'normal'})+'</span>').join('')+'</div></section><section class="ep-points" aria-label="本話重點">' + POINTS.map(p => '<div class="ep-point"><b>' + esc(p.title) + '</b><span>' + esc(p.text) + '</span></div>').join('') + '</section>' +
      '<p class="ep-note">本話共 12 個史實錨點與 3 項必經體驗。中途離開會自動存檔。</p></main></div>';
    ROOT.querySelectorAll('[data-a="home"]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); ZH.go('hub'); }));
    const cont = ROOT.querySelector('[data-a="continue"]');
    if (cont) cont.addEventListener('click', () => { ZH.sfx('click'); startGame(st); });
    ROOT.querySelector('[data-a="new"]').addEventListener('click', () => {
      ZH.sfx('click');
      if (!st) { startGame(null); return; }
      ZH.modal({
        title: '重新開始？', body: '<p>目前進度會清除，從頭開始。</p>',
        actions: [{ label: '取消', value: false, kind: 'quiet' }, { label: '重新開始', value: true, kind: 'primary' }]
      }).then(ok => { if (ok) ZH.deleteSave(SID, MODE).catch(() => null).then(() => startGame(null)); });
    });
  }

  const loadSave = SQ.loadState;

  function showCoreMessage(){ROOT.innerHTML='<main class="ep-title__main"><h1 class="ep-h1">共用核心待更新</h1><p class="ep-note">請先套用上一批共用核心，再重新開啟第一回。需有 Code、Eng_Story、Art_kit 與 Arena_js 的新版內容。</p><button class="zh-btn zh-btn--primary" data-core-home>回首頁</button></main>';ROOT.querySelector('[data-core-home]').onclick=()=>ZH.go('hub');}

  ZH.ready(() => {
    if(!ZH.story || !ZH.arena || !window.ART){showCoreMessage();return;}
    ZH.loading(true, '展開竹簡');
    ZH.codex.init();
    Promise.all([loadSave(), anchorsReady]).then(([saved]) => {
      ZH.loading(false);
      if (String(params.mode || '') === MODE && saved) { startGame(saved.engine); return; }
      renderTitle(saved);
    });
  });
})();
</script>
<script>ZH.ready(function(){ZH.textplay?.install("S_ch01_shaqiu",null);});</script>
</body></html>
