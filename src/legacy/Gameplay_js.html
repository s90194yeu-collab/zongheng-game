<script>
(function(w){'use strict';const ZH=w.ZH=w.ZH||{},entries=w.ZH_GAMEPLAY?.entries||{},E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current=null;
const kindNames={adventure:'動作冒險',fighter:'橫向格鬥',command:'即時指揮',simulation:'經營模擬',race:'騎乘競速',archery:'移動騎射',cards:'策略卡牌',rhythm:'音樂合奏',nativeCards:'組牌與連鎖',nativeTactics:'戰棋'};
function route(sid,id,state){const c=entries[id];return state?._gameplayV===2&&c?.scenarioId===sid?c:null;}
function dialogue(sid,text,state){if(state?._gameplayV!==2)return text;return w.ZH_GAMEPLAY?.dialoguePatches?.[sid]?.[text]??text;}
function upgraded(sid,state){return state?._gameplayV===2&&Object.values(entries).some(c=>c.scenarioId===sid);}
function blocked(){return document.hidden||!!document.querySelector('.zh-modal,.zh-cutin,.hm-anchor,.zc-detail');}
function mount(body,g,c){const host=body.closest('.sty-game');host?.classList.add('g2-mount');body.innerHTML='<section class="g2" data-kind="'+E(c.kind)+'" data-paused="false" data-reading="false" tabindex="-1"><header class="g2-head"><div><div class="g2-kicker">'+E(c.volume)+' · '+E(c.chapter)+' · '+E(kindNames[c.kind])+'</div><h2>'+E(c.title)+'</h2></div><div class="g2-toolbar"><button data-g2="pause">暫停</button><button data-g2="save">儲存</button><button data-g2="exit">存檔離開</button></div></header><div class="g2-grid"><div class="g2-main"><div class="g2-stats" aria-live="off"></div><div class="g2-viewport"><canvas width="900" height="500" tabindex="0" role="img" aria-label="'+E(c.title)+'，'+E(c.goal)+'"></canvas></div><div class="g2-controls"></div><div class="g2-hand"></div></div><aside class="g2-side"></aside></div><div class="g2-message" role="status" aria-live="polite"></div></section>';
const root=body.querySelector('.g2'),canvas=root.querySelector('canvas'),side=root.querySelector('.g2-side'),controls=root.querySelector('.g2-controls'),hand=root.querySelector('.g2-hand'),hud=root.querySelector('.g2-stats'),msg=root.querySelector('.g2-message'),renderer=w.GameplayCanvas.create(canvas,c);let alive=true,paused=false,cleanups=[],raf=0;
function say(text){if(msg.textContent!==text)msg.textContent=text||'';}
function pause(value){paused=value===undefined?!paused:value;root.dataset.paused=String(paused);root.querySelector('[data-g2=pause]').textContent=paused?'繼續':'暫停';if(paused){if(current?.root===root){current.suspend?.();current.flush?.();}g.checkpoint?.();}}
function reading(value){root.dataset.reading=String(!!value);}
function dispose(){if(!alive)return;alive=false;cancelAnimationFrame(raf);renderer.dispose();cleanups.forEach(fn=>fn());cleanups=[];host?.classList.remove('g2-mount');if(current?.root===root)current=null;}
const shell={root,canvas,side,controls,hand,hud,renderer,say,pause,reading,dispose,get alive(){return alive;},get paused(){return paused;},get active(){return alive&&!paused&&!blocked();},listen(el,type,fn,options){el.addEventListener(type,fn,options);cleanups.push(()=>el.removeEventListener(type,fn,options));},frame(fn){let last=performance.now();function frame(now){if(!alive||!root.isConnected)return;const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;fn(dt,now);raf=requestAnimationFrame(frame);}raf=requestAnimationFrame(frame);},button(action,label,primary=false,disabled=false,extra=''){return'<button type="button" data-g2="'+action+'"'+(primary?' class="primary"':'')+(disabled?' disabled':'')+' '+extra+'>'+E(label)+'</button>';},stats(parts){hud.innerHTML=parts.map(([a,b])=>'<span class="g2-stat">'+E(a)+'<b>'+E(b)+'</b></span>').join('');}};
shell.listen(root.querySelector('[data-g2=pause]'),'click',()=>pause());shell.listen(root.querySelector('[data-g2=save]'),'click',async()=>{if(current?.root===root)current.flush?.();const ok=await g.checkpoint?.();say(ok?.ok===false?'儲存尚未完成，請稍後再試。':'進度已送出儲存。');});shell.listen(root.querySelector('[data-g2=exit]'),'click',async()=>{pause(true);await g.checkpoint?.();const b=document.querySelector('.sty [data-act=home]');if(b)b.click();else{say('離線預覽已儲存在這台瀏覽器，可用上方返回。');}});shell.listen(w,'blur',()=>{if(alive)pause(true);});shell.listen(document,'keydown',e=>{if(c.kind.startsWith('native')&&alive&&!blocked()&&['p','P','Escape'].includes(e.key)){e.preventDefault();e.stopImmediatePropagation();pause();}},true);g.onCleanup?.(dispose);return shell;}
function stats(s,c){if(s.kind==='adventure')return[['尋訪',s.found.length+'/'+s.items.length],['體力',Math.round(s.player.stamina)],['查問',s.caught]];if(s.kind==='fighter')return[['波次',s.defeated+'/'+(c.waves||3)],['體力',Math.max(0,Math.round(s.player.hp))],['招式體力',Math.round(s.player.stamina)]];if(s.kind==='command')return[['接應',s.flags.filter(Boolean).length+'/'+s.flags.length],['可用補給',s.supply],['隊伍',s.units.filter(u=>u.side==='ally'&&u.hp>0).length]];if(s.kind==='simulation')return[['糧',Math.floor(s.food)],['木',Math.floor(s.wood)],['人力',s.idle],['整備',Math.floor(s.soldiers)],['船',Math.floor(s.boats)],['時段',Math.min(20,s.period)+'/20']];if(s.kind==='race')return[['場次',s.match+1+'/'+(c.matches||1)],['路程',Math.round(s.distance)],['勝場',s.races.filter(r=>r.won).length]];if(s.kind==='archery')return[['命中',s.hits],['已處理靶',s.resolved+'/'+(c.targets||20)],['餘箭',s.ammo],['風',s.wind.toFixed(1)]];if(s.kind==='cards')return[['回合',s.round+1+'/'+(c.rounds||5)],['行動',s.ap],['補給',s.res.supply],['支持',s.support],['壓力',s.pressure]];if(s.kind==='rhythm')return[['樂句',s.notes.filter(n=>n.resolved).length+'/'+s.notes.length],['合拍',s.notes.filter(n=>n.hit).length],['評語',s.acks.length+'/'+(c.readings||[]).length]];return[];}
function play(c,body,g){return new Promise(resolve=>{const old=g.getProgress?.()||{},m=w.GameplayModels.create(c,old.model,Math.floor((g.rng?.()||.71)*4294967295)),ui=mount(body,g,c),keys={},b=ui.button;let lastPhase='',lastHud=-1,saveAt=m.s.time,lastMessage='',audio=null,lastTone=-1;
function persist(){g.setProgress?.({model:m.snapshot(),ruleset:2});}
function finish(){const r=m.result();if(!r)return;persist();ui.dispose();resolve(r);}
function say(){ui.say(m.s.message||c.goal);}
function audioTone(n){if(ZH.settings?.sound===false||Number(ZH.settings?.volume)===0)return;try{const A=w.AudioContext||w.webkitAudioContext;audio=audio||new A();audio.resume().catch(()=>{});const o=audio.createOscillator(),v=audio.createGain(),t=audio.currentTime;o.frequency.value=[261.63,293.66,329.63,392,440][n%5];v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(.09*(ZH.settings?.volume??.7),t+.01);v.gain.exponentialRampToValueAtTime(.0001,t+.32);o.connect(v);v.connect(audio.destination);o.start(t);o.stop(t+.34);}catch(e){}}
function render(){const s=m.s;ui.reading(['brief','reading','review','musicRepair','choose','pit','cardReport','complete','failure'].includes(s.phase));ui.hand.innerHTML='';let html='<div class="g2-goal">'+E(c.goal)+'</div>';
if(s.phase==='brief'){html+='<h3>親自進入場景</h3><p>可以暫停、儲存後接續。操作說明在畫面下方，失敗後可保留首次紀錄、放慢親做。</p>'+b('begin','開始挑戰',true);}
else if(s.phase==='complete'){const r=m.result();html+='<h3>挑戰完成</h3><p>本次首次 '+r.score+'／10'+(r.assisted?'，親做輔助另有紀錄。':'。')+'</p>'+b('finish','交回成績，繼續劇情',true);}
else if(s.phase==='failure'){html+='<h3>先重整，再行動</h3><p>'+E(s.message)+'</p>'+b('assist','保留首次，放慢親做',true);}
else if(s.phase==='reading'){const it=s.items.find(it=>it.id===s.interacting);html+='<h3>'+E(it?.name)+'</h3><p class="g2-reading">'+E(it?.text)+'</p>'+b('ack','親讀完畢，接續探索',true);}
else if(s.phase==='fox'){html+='<h3>叢祠狐鳴</h3><p>按住下方發聲或 F 鍵；每聲完成後放開，再發下一聲。</p><div class="g2-summary">已完成 '+s.foxCalls+' / 3 聲</div>';}else if(s.phase==='echo'){html+='<h3>雞鳴應和</h3><p>指示到中央時按「互動」，十二拍後再完成驗傳。這是教學節奏。</p><div class="g2-summary">已應和 '+s.echoIndex+' / 12</div>';}
else if(s.phase==='review'){const it=c.readings[s.readIndex];html+='<h3>〈'+E(it.name)+'〉</h3><p class="g2-reading">'+E(it.text)+'</p>'+b('ack','親讀這章評語',true);}
else if(s.phase==='musicRepair'){const n=s.notes.filter(n=>!n.hit)[s.repair];html+='<h3>先保留節奏首次，再補作</h3><p>依提示親敲 '+E(n?['宮','商','角','徵','羽'][n.lane]:'')+'，完成後回讀樂章。無需再比手速。</p>';}
else if(s.kind==='race'&&s.phase==='choose'){html+='<h3>'+(c.mode==='horses'?'本場先配馬':'選擇隊伍步速')+'</h3><p>'+(c.mode==='horses'?'齊王依次出上、中、下等馬。三等馬每匹只可出一次；配馬與你的騎乘都會影響勝負。':'選擇穩健、均衡或快速的初始步速，再親自轉向、加速與避障。')+'</p>'+[0,1,2].map((n)=>b('horse',(c.mode==='horses'?['下等馬 · 耐行','中等馬 · 均衡','上等馬 · 較快']:['穩健步速','均衡步速','快速步速'])[n],false,s.used.includes(n),'data-value="'+n+'"')).join('');}
else if(s.kind==='race'&&s.phase==='pit'){const r=s.races.at(-1);html+='<h3>本場'+(r.won?'領先抵達':'稍後抵達')+'</h3><p>'+(c.mode==='horses'?'配馬 '+['下','中','上'][r.horse]+'等，騎乘 ':'隊伍行進 ')+r.time.toFixed(1)+' 秒。體力與隊形會留在紀錄。</p>'+b('nextRace',s.match+1>=(c.matches||1)?(c.mode==='horses'?'確認三場成績':'確認本段成績'):'下一場配馬',true);}
else if(s.kind==='simulation'){const names={canal:'疏洫',farm:'田地',workshop:'木工作坊',house:'生聚居所',barracks:'訓練營',dock:'船塢',inspect:'核界'};html+='<h3>施工與人力</h3><p>'+(c.mode==='farm'?'先連通水路，再選 A～E 各劃三田；紅框出現時切換核界。':'先建木工作坊與農田、安排人力，再增建居所、訓練營與船塢。')+'</p><div class="g2-toolgrid">'+(c.mode==='farm'?['canal','farm','inspect']:['farm','workshop','house','barracks','dock']).map(v=>b('tool',names[v]+(m.costs[v]?' · 木'+m.costs[v]:''),false,false,'data-value="'+v+'" aria-pressed="'+(s.tool===v)+'"')).join('')+'</div>'+(c.mode==='farm'?'<p>田地歸戶</p><div class="g2-owner">'+[0,1,2,3,4].map(n=>b('owner','ABCDE'[n],false,false,'data-value="'+n+'" aria-pressed="'+(s.owner===n)+'"')).join('')+'</div><p>已照應 '+m.householdCount()+' / 5 戶；已核界 '+s.checked.length+' / 2；已收穫 '+Math.floor(s.harvest)+'</p>':'<p>點一棟設施，再分派工人。每棟最多三隊，閒置人力 '+s.idle+'。</p>'+b('worker','− 一隊',false,false,'data-value="-1"')+b('worker','＋ 一隊',false,false,'data-value="1"')+'<p>目標：二十時段、糧≥25、木≥15、整備≥6、船≥2、人口≥12。</p>');}
else if(s.kind==='command'){html+='<h3>選隊，下達路點</h3><div class="g2-unit-list">'+s.units.filter(u=>u.side==='ally').map(u=>b('select',u.name+' '+Math.round(u.hp),false,u.hp<=0,'data-value="'+u.id+'" aria-pressed="'+(s.selected===u.id)+'"')).join('')+'</div><p>點地面會移動並自動接戰；固守降低損失。小隊分開可包抄，但也會失去接應。</p>'+b('guard','本隊固守')+b('reinforce','呼叫援隊 · 補給 6',false,s.supply<6)+'<p>'+E(s.navy?'將三艘船各自帶到西岸接應水域。':c.retreat?'先讓前隊退過三條標記，再接應三點。':'接應點附近清空對手後，停留片刻即可建立接應。')+'</p>';}
else if(s.kind==='cards'){html+='<h3>對手：'+['強勢施壓','拖延與斷援','查核你的證據'][s.intent]+'</h3><p>本輪結算壓力＋'+[9,6,11][s.intent]+'。查訪後出證據可連鎖；盟約需要補給，不能只追支持數。</p><div class="g2-summary">本回合已出 '+s.roundCards.map(id=>m.cardPool[id].name).join('、')+'</div>'+b('endCard','結算本回合',true,!s.roundCards.length);ui.hand.innerHTML='<div class="g2-cardhand">'+s.hand.map((id,n)=>{const v=m.cardPool[id];return'<button class="g2-card" data-g2="card" data-value="'+n+'"'+(v.cost>s.ap||id==='pact'&&s.res.supply<3?' disabled':'')+'><span class="g2-card-glyph">'+v.icon+'</span><b>'+v.name+'</b><small>行動 '+v.cost+'</small><small>'+v.effect+'</small></button>';}).join('')+'</div>';if(s.phase==='cardReport')html+='<div class="g2-report">這輪已結算：支持 '+s.support+'，壓力 '+s.pressure+'，補給 '+s.res.supply+'。</div>'+b('nextCard','下一回合／收束',true);}
else if(s.kind==='adventure')html+='<h3>沿路觀察，再行動</h3><p>方向鍵／WASD 移動，也可點地面尋路。Shift 奔跑、C 蹲伏、E 親自互動。巡哨視線有方向；掩護中距離太近仍有風險。</p><div class="g2-goals">'+s.items.map(it=>'<span>'+(s.found.includes(it.id)?'✓ ':'○ ')+E(it.name)+'</span>').join('')+'</div>';
else if(s.kind==='fighter')html+='<h3>距離與破綻</h3><p>左右移動，↑／空白鍵跳躍；J 輕擊、K 重擊、L 格擋。重擊可破防，擋住起手後有反擊時間。連續猛攻會耗盡招式體力。</p><p>木兵與軍事單位採教學抽象，隊勢歸零表示退出這段推演。</p>';
else if(s.kind==='archery')html+='<h3>先瞄，再放</h3><p>移動滑鼠／拖曳畫面設定準星，按住放箭鈕或空白鍵蓄力，放開出箭。左右／AD 調整騎乘位置；箭會飛行，需估計靶的提前量。</p><p>箭矢會逐步補回。至少親射十箭，才算完成本段操作。</p>';
else if(s.kind==='rhythm')html+='<h3>看拍點，也聽呼應</h3><p>按 1～5 或下方五聲鍵。音符到金線時敲擊；長音需按住。音效可關閉，畫面仍提供節拍。</p><p>樂句是遊戲創作，評語使用原版文字。漏拍會安排親敲補作，首次表現保留。</p>';
else if(s.kind==='race')html+='<h3>看前方道路</h3><p>左右／AD 轉向，↑／W 加速、↓／S 放緩。加速會耗體力；彎道需要修正路線。糧袋能補回體力。</p>';
if(!['brief','complete','failure'].includes(s.phase)&&s.kind!=='cards')html+='<div class="g2-buttons">'+b('assist',s.assisted?'已記錄親做輔助':'保留首次・放慢親做',false,s.assisted)+'</div>';ui.side.innerHTML=html;say();lastPhase=s.phase;persist();}
function controlMarkup(){const dpad='<div class="g2-pad" aria-label="方向控制">'+[['up','↑'],['left','←'],['down','↓'],['right','→']].map(([d,label])=>'<button class="g2-hold" data-hold="'+d+'" aria-label="'+d+'">'+label+'</button>').join('')+'</div>';if(c.kind==='rhythm')return'<div class="g2-music-keys">'+['宮','商','角','徵','羽'].map((n,i)=>'<button class="g2-hold" data-tone="'+i+'">'+n+' '+(i+1)+'</button>').join('')+'</div>';if(c.kind==='adventure')return dpad+'<div class="g2-buttons"><button class="g2-hold" data-hold="run">奔跑</button><button class="g2-hold" data-hold="crouch">藏身</button>'+b('interact','互動 E',true)+(c.id==='ch02_fox'?'<button class="g2-hold" data-hold="call">按住發聲 F</button>':'')+'</div>';if(c.kind==='fighter')return dpad+'<div class="g2-buttons">'+b('jump','跳躍')+b('strike','輕擊 J')+b('heavy','重擊 K')+'<button class="g2-hold" data-hold="block">格擋 L</button></div>';if(c.kind==='archery')return dpad+'<button class="g2-hold primary" data-bow="true">按住拉弓 · 放開出箭</button>';if(c.kind==='race')return dpad+'<p class="g2-keyhelp">↑ 加速／↓ 放緩　← → 轉向；也可使用 WASD。</p>';return'<p class="g2-keyhelp">點選畫面與右方指令；P 可暫停。</p>';}
function act(action,value){if(!ui.alive||blocked()||ui.paused&&action!=='pause')return;let ok=false;const s=m.s;if(action==='begin')ok=m.start();if(action==='finish')return finish();if(action==='assist')ok=m.assist();if(action==='ack')ok=m.ack();if(action==='interact')ok=s.phase==='echo'?m.hit(0):m.interact();if(action==='jump')ok=m.jump();if(action==='strike')ok=m.strike();if(action==='heavy')ok=m.strike(true);if(action==='horse')ok=m.chooseHorse(Number(value));if(action==='nextRace')ok=m.nextRace();if(action==='select')ok=m.select(Number(value));if(action==='guard'){const u=s.units.find(u=>u.id===s.selected);ok=u&&m.command(u.id,u.x,u.y,'guard');}if(action==='reinforce')ok=m.reinforce();if(action==='tool'){s.tool=value;ok=true;}if(action==='owner'){s.owner=Number(value);ok=true;}if(action==='worker')ok=m.assign(s.selectedCell,Number(value));if(action==='card')ok=m.card(Number(value));if(action==='endCard')ok=m.endCard();if(action==='nextCard')ok=m.nextCard();if(ok){g.sfx?.('click');render();}else if(action&&!['pause','save','exit'].includes(action)){ui.say('這個安排目前無法執行，請檢查體力、資源或所在位置。');}}
ui.controls.innerHTML=controlMarkup();ui.listen(ui.root,'click',e=>{const b=e.target.closest('[data-g2]');if(b&&!b.disabled)act(b.dataset.g2,b.dataset.value);});
function pointerDown(e){const b=e.target.closest('[data-hold],[data-tone],[data-bow]');if(!b||!ui.active)return;e.preventDefault();b.setPointerCapture?.(e.pointerId);b.classList.add('is-held');if(b.dataset.hold)keys[b.dataset.hold]=true;if(b.dataset.tone!==undefined){m.hit(Number(b.dataset.tone));audioTone(Number(b.dataset.tone));}if(b.dataset.bow)m.s.holding=true;}
function pointerUp(e){const b=e.target.closest('[data-hold],[data-tone],[data-bow]');if(!b)return;b.classList.remove('is-held');if(b.dataset.hold)keys[b.dataset.hold]=false;if(b.dataset.tone!==undefined)m.release(Number(b.dataset.tone));if(b.dataset.bow){if(ui.active)m.shoot();else m.s.holding=false;persist();}}
ui.listen(ui.controls,'pointerdown',pointerDown);for(const type of ['pointerup','pointercancel','lostpointercapture'])ui.listen(ui.controls,type,pointerUp);
let canvasPointer=null;ui.listen(ui.canvas,'pointerdown',e=>{if(!ui.active)return;canvasPointer={x:e.clientX,y:e.clientY};if(c.kind==='archery'){const p=ui.renderer.point(e.clientX,e.clientY);m.aim(p.x,p.y);}});ui.listen(ui.canvas,'pointermove',e=>{if(c.kind==='archery'&&ui.active){const p=ui.renderer.point(e.clientX,e.clientY);m.aim(p.x,p.y);}});ui.listen(ui.canvas,'pointerup',e=>{if(!ui.active||!canvasPointer)return;const moved=Math.hypot(e.clientX-canvasPointer.x,e.clientY-canvasPointer.y);canvasPointer=null;if(moved>15&&c.kind!=='archery')return;const p=ui.renderer.point(e.clientX,e.clientY),s=m.s;if(c.kind==='adventure')m.route(p.x,p.y);if(c.kind==='command'){const ally=s.units.filter(u=>u.side==='ally'&&u.hp>0).find(u=>Math.hypot(u.x-p.x,u.y-p.y)<35);if(ally)m.select(ally.id);else m.command(s.selected,p.x,p.y);}if(c.kind==='simulation')m.build(p.at);render();});
const keyMap={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',Shift:'run',f:'call',F:'call',c:'crouch',C:'crouch',l:'block',L:'block'};
ui.listen(document,'keydown',e=>{if(!ui.alive||e.target.matches('input,textarea,select')||e.ctrlKey||e.metaKey||e.altKey||blocked())return;if(e.key==='p'||e.key==='P'||e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();ui.pause();Object.keys(keys).forEach(k=>keys[k]=false);persist();return;}if(!ui.active)return;let used=false;if(keyMap[e.key]){keys[keyMap[e.key]]=true;used=true;if(c.kind==='fighter'&&keyMap[e.key]==='up'&&!e.repeat)m.jump();}if(!e.repeat){if(c.kind==='fighter'&&e.code==='Space'){m.jump();used=true;}if(['e','E'].includes(e.key)){act('interact');used=true;}if(c.kind==='fighter'&&['j','J','k','K'].includes(e.key)){m.strike(['k','K'].includes(e.key));used=true;}if(c.kind==='archery'&&e.code==='Space'){m.s.holding=true;used=true;}if(c.kind==='rhythm'&&/^[1-5]$/.test(e.key)){const lane=Number(e.key)-1;m.hit(lane);audioTone(lane);used=true;}}if(used){e.preventDefault();e.stopImmediatePropagation();}},true);
ui.listen(document,'keyup',e=>{if(keyMap[e.key])keys[keyMap[e.key]]=false;if(c.kind==='rhythm'&&/^[1-5]$/.test(e.key))m.release(Number(e.key)-1);if(c.kind==='archery'&&e.code==='Space'){if(ui.active)m.shoot();else m.s.holding=false;}},true);ui.listen(document,'visibilitychange',()=>{Object.keys(keys).forEach(k=>keys[k]=false);m.s.holding=false;persist();});
ui.listen(w,'blur',()=>{Object.keys(keys).forEach(k=>keys[k]=false);m.s.holding=false;});render();current={root:ui.root,c,m,ui,kind:c.kind,flush:persist,suspend:()=>{Object.keys(keys).forEach(k=>keys[k]=false);m.s.holding=false;if(c.kind==='rhythm')m.s.held={};}};ui.frame((dt,now)=>{if(ui.active)m.step(dt,keys);if(c.kind==='rhythm'&&m.s.phase==='play'&&ui.active){const beat=Math.floor((m.s.musicTime-1.5)/.47);if(beat>=0&&beat!==lastTone){lastTone=beat;audioTone((beat*2+Math.floor(beat/8))%5);}}if(m.s.phase!==lastPhase)render();if(now-lastHud>120){if(m.s.phase!=='brief')ui.stats(stats(m.s,c));lastHud=now;say();}if(m.s.time-saveAt>=2){saveAt=m.s.time;persist();}ui.renderer.draw(m.s,dt,{paused:!ui.active&&!blocked()});});});}
function nativeCards(body,g,input){return new Promise(resolve=>{const c=g.gameplayConfig,saved=g.getProgress?.()||{},m=w.GameplayNative.cards({...input,ruleset:2},saved),s=m.state,ui=mount(body,g,c),b=ui.button,defs=w.GameplayNative.cardDefs;let feedback=saved.feedback||'先看對方意圖與可用行動。';function persist(){g.setProgress({...m.snapshot(),feedback});}function render(){ui.reading(s.phase!=='plan');ui.stats([['局次',input.stage],['回合',s.round+1+'/3'],['行動',s.ap],['金',s.m.gold],['楚疑',s.m.doubt],['圍城',s.m.siege]]);ui.hand.innerHTML='';let html='<div class="g2-goal">'+E(c.goal)+'</div>';if(s.phase==='intro')html+='<h3>同一牌組，安排連鎖</h3><p>三回合，每輪三點行動。偵察→反間會加成；堅守→運糧會額外減壓。對手可能急攻、斷糧或查核。</p>'+b('ncStart','開始第一回合',true);if(s.phase==='plan'){const v=s.pending>=0?defs[s.hand[s.pending]]:null;html+='<h3>對手意圖：'+E(s.intent?.name||'攻勢')+'</h3><p>'+E(s.intent?.text||'')+'</p><div class="g2-summary">本輪已出：'+s.turnCards.map(id=>defs[id].name).join('、')+'</div><p>連鎖：'+E(m.comboHint?.()||'先查訪再反間，或先守再運糧。')+'</p>'+(v?'<div class="g2-report"><b>'+E(v.name)+'</b><p>預覽：金 '+m.preview(s.pending).gold+'、楚疑 '+m.preview(s.pending).doubt+'、圍城 '+m.preview(s.pending).siege+'</p></div>':'')+b('ncPlay','確認出牌',true,!v)+b('ncEnd','結算本回合',false,!s.turnPlays);ui.hand.innerHTML='<div class="g2-cardhand">'+s.hand.map((id,i)=>'<button type="button" class="g2-card" data-g2="ncSelect" data-value="'+i+'" aria-pressed="'+(s.pending===i)+'"'+(!m.usable(id)?' disabled':'')+'><span class="g2-card-glyph">'+E(defs[id].name.slice(0,1))+'</span><b>'+E(defs[id].name)+'</b><small>金 '+defs[id].gold+' · 行動 '+defs[id].ap+'</small><small>'+E(defs[id].detail)+'</small></button>').join('')+'</div>';}if(s.phase==='report'){const r=s.rounds[s.round];html+='<h3>對手已行動</h3><p>'+E(r.intentName||'本輪攻勢')+'，圍城變化 '+r.attack+'。</p><p>反間成效 '+s.doubtWork+'；防備成效 '+s.defenseWork+'。</p>'+b('ncNext',s.round===2?'挑選新牌':'開始下一回合',true);}if(s.phase==='reward'){html+='<h3>挑一張加入後續牌組</h3><p>本局 '+s.score+'／10，資源會延續。</p>'+w.GameplayNative.rewards.map(id=>b('ncReward',defs[id].name+' · '+defs[id].detail,false,false,'data-value="'+id+'"')).join('');}if(s.phase==='finish')html+='<h3>牌組已接續</h3><p>你選了 '+E(defs[s.reward].name)+'，本局 '+s.score+'／10。</p>'+b('ncFinish','確認入組，回軍議',true);ui.side.innerHTML=html;ui.say(feedback);persist();}
ui.listen(ui.root,'click',e=>{const btn=e.target.closest('[data-g2]');if(!btn||btn.disabled||!ui.active)return;const a=btn.dataset.g2,v=btn.dataset.value;let ok=false;if(a==='ncStart'){m.startRound();ok=true;}if(a==='ncSelect'&&s.phase==='plan'){s.pending=Number(v);ok=true;}if(a==='ncPlay')ok=m.play(s.pending);if(a==='ncEnd')ok=m.endRound();if(a==='ncNext')ok=m.next();if(a==='ncReward')ok=m.chooseReward(v);if(a==='ncFinish'){const r=m.result();if(r){persist();ui.dispose();resolve({...r,ruleset:'g2'});}return;}if(ok){feedback=s.phase==='report'?'對手已回應，資源與出牌順序均已留下。':'安排已保留。';g.sfx?.('click');render();}});render();current={root:ui.root,c,m,ui,kind:c.kind,flush:persist};ui.frame(dt=>ui.renderer.draw(s,dt,{kind:'nativeCards',paused:!ui.active}));});}
function nativeTactics(body,g){return new Promise(resolve=>{const c=g.gameplayConfig,old=g.getProgress?.()||{},m=w.GameplayNative.tactics(old.model||{}),s=m.state,ui=mount(body,g,c),b=ui.button;let feedback=old.feedback||'先看地形與旗位，再親自下令。',focusCell=old.focusCell||1;const actions={move:'移動',attack:'壓制',guard:'固守',raise:'舉旗',retreat:'佯退',flag:'換旗'};function persist(){g.setProgress({model:JSON.parse(JSON.stringify(s)),feedback,focusCell});}function render(){ui.reading(s.phase!=='plan');ui.stats([['回合',s.turn],['已下令',s.orders],['背水固守',s.held+'/3'],['換旗',s.flags.filter(Boolean).length+'/2']]);const goals={lured:'引空趙壁',retreat:'佯退回水上軍',held:'背水連守三回合',north:'北旗',south:'南旗'};let html='<div class="g2-goal">'+E(c.goal)+'</div><div class="g2-goals">'+Object.entries(m.objectives()).map(([id,yes])=>'<span>'+(yes?'✓ ':'○ ')+goals[id]+'</span>').join('')+'</div>';if(s.phase==='intro')html+='<p>河道不能通行；輕騎可走北面山間道。操作先預覽再確認，敵方會在回合結束後追擊、壓制與回防。</p>'+b('ntStart','開始井陘推演',true);if(s.phase==='plan'){html+='<div class="g2-unit-list">'+s.units.filter(u=>u.side==='han').map(u=>b('ntUnit',u.id+' '+u.name,false,u.hp<=0,'data-value="'+u.id+'" aria-pressed="'+(s.selected===u.id)+'"')).join('')+'</div><div class="g2-toolgrid">'+Object.entries(actions).map(([id,name])=>b('ntOrder',name,false,!s.selected,'data-value="'+id+'" aria-pressed="'+(s.mode===id)+'"')).join('')+'</div>'+(s.pending?'<div class="g2-report">'+E(s.pending.text)+'</div>'+b('ntConfirm','確認軍令',true)+b('ntCancel','取消預覽'):'<p>先選一隊與命令，再點地圖目標。</p>')+b('ntEnd','結束本回合',false,!m.canEnd())+'<details><summary>提示與鍵盤選格</summary><p>'+(s.assisted?E((m.guide()||[]).join(' → ')):'G 先到 D5 舉旗，次回合下佯退令並回 B5；步隊固守，騎隊等待趙營出壁，再由北路進營。')+'</p><div class="g2-tactics-textgrid">'+Array.from({length:80},(_,n)=>'<button data-g2="ntCell" data-value="'+n+'" aria-label="'+w.GameplayNative.coord(n%8,Math.floor(n/8))+' '+w.GameplayNative.terrain(n%8,Math.floor(n/8))+'">'+w.GameplayNative.coord(n%8,Math.floor(n/8))+'</button>').join('')+'</div></details>'+b('ntAssist','保留首績・分步推演',false,s.assisted);}
if(['report','repair'].includes(s.phase))html+='<h3>對方行動回報</h3><div class="g2-report">'+s.report.map(t=>'<p>'+E(t)+'</p>').join('')+'</div>'+(s.phase==='repair'?b('ntAssist','保留首績・親自重布',true):b('ntNext',s.outcome==='success'?'查看成果':'下一回合',true));if(s.phase==='finish')html+='<h3>各路已親自配合</h3><p>首次 '+s.first.score+'／10，回合 '+s.turn+'；'+(s.assisted?'分步重演已完成。':'部隊狀態已保留。')+'</p>'+b('ntFinish','交回成績，回劇情',true);ui.side.innerHTML=html;ui.say(feedback);persist();}
function cell(x,y){if(s.phase!=='plan'||x<0||x>7||y<0||y>9)return;focusCell=y*8+x;if(s.mode&&s.selected){const p=m.preview(s.selected,s.mode,x,y);if(p){s.pending=p;feedback=p.text;}else feedback='這個目標目前不合法，請看地形、距離與本隊行動額度。';}else{const u=m.at(x,y);if(u?.side==='han'){s.selected=u.id;s.mode=null;s.pending=null;feedback=u.name+'已選。';}else feedback=w.GameplayNative.coord(x,y)+' · '+w.GameplayNative.terrain(x,y);}render();}
ui.controls.innerHTML='<div class="g2-buttons">'+b('ntZoom','放大／全覽地圖')+'</div><p class="g2-keyhelp">可直接點選單位；也可打開鍵盤選格。所有軍令確認後才執行。</p>';ui.listen(ui.canvas,'click',e=>{if(!ui.active)return;const p=ui.renderer.point(e.clientX,e.clientY,'nativeTactics');cell(p.x,p.y);});ui.listen(ui.root,'click',e=>{const btn=e.target.closest('[data-g2]');if(!btn||btn.disabled||!ui.active)return;const a=btn.dataset.g2,v=btn.dataset.value;let ok=false;if(a==='ntStart')ok=m.start();if(a==='ntZoom'){ui.canvas.parentElement.classList.toggle('is-wide');return;}if(a==='ntUnit'&&s.phase==='plan'){s.selected=v;s.mode=null;s.pending=null;ok=true;}if(a==='ntCell'){cell(Number(v)%8,Math.floor(Number(v)/8));return;}if(a==='ntOrder'&&s.selected&&s.phase==='plan'){if(['move','attack'].includes(v)){s.mode=v;s.pending=null;ok=true;}else{s.pending=m.preview(s.selected,v);s.mode=null;ok=!!s.pending;}}if(a==='ntConfirm')ok=m.commit(s.pending);if(a==='ntCancel'){s.pending=null;s.mode=null;ok=true;}if(a==='ntEnd')ok=m.endTurn();if(a==='ntNext')ok=m.next();if(a==='ntAssist'){if(['plan','report'].includes(s.phase))m.requestAssist();ok=m.assist();}if(a==='ntFinish'){const r=m.result();if(r){persist();ui.dispose();resolve({...r,ruleset:'g2'});}return;}if(ok){feedback=s.pending?.text||'軍令與部隊狀態已保留。';render();}});render();current={root:ui.root,c,m,ui,kind:c.kind,flush:persist};ui.frame(dt=>ui.renderer.draw(s,dt,{kind:'nativeTactics',api:{...m,terrain:w.GameplayNative.terrain,focusCell},paused:!ui.active}));});}
ZH.gameplay={version:'2.0.0',route,dialogue,chapterUpgraded:upgraded,play,nativeCards,nativeTactics,entries,current:()=>current?{id:current.c.id,kind:current.kind,state:JSON.parse(JSON.stringify(current.m.s||current.m.state)),paused:current.ui.paused}:null};
