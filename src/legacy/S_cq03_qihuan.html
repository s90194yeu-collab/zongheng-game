  function shuffle(list, rng) {
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  function face(id, expr) {
    const c = CHARACTERS.find(x => x.id === id) || { id: id, name: id, glyph: '' };
    if (window.ART && ART.portrait) return ART.portrait(c, { bust: true, expr: expr || null });
    return '<span class="qh-face__seal" style="color:' + esc(c.color || '#e0b44c') + '">' + esc(c.glyph || '') + '</span>';
  }

  function zhengxianGame(body, g) {
    return new Promise(resolve => {
      body.innerHTML =
        '<div class="qh-race">' +
        '<div class="qh-race__field">' +
        '<div class="qh-lane qh-lane--me"><span class="qh-lane__name">小白（你）・莒 → 臨淄</span><i class="qh-lane__goal"><span>臨<br>淄</span></i><b class="qh-car qh-car--me">' + carSvg('#7f5598', '#c9b0dc') + '</b></div>' +

        '<div class="qh-race__aim" hidden><span class="qh-face">' + face('guanzhong', 'serious') + '</span>' +
        '<div><p class="qh-aim__txt">管仲在莒道上拉弓……<small>紅圈縮到帶鉤上的那一刻，按「詳死」！</small></p><div class="qh-aim__target"><i class="qh-aim__hook"></i><i class="qh-aim__ring"></i></div></div></div>' +
        '</div>' +
        '<p class="qh-race__msg" aria-live="polite">左右交替按，催馬快跑！</p>' +
        '<div class="qh-race__pad">' +
        '<button type="button" class="zh-btn qh-pad" data-k="L">左驂<small>← 或 A</small></button>' +
        '<button type="button" class="zh-btn zh-btn--primary qh-pad qh-pad--die" data-k="D" hidden>詳死！<small>空白鍵</small></button>' +
        '<button type="button" class="zh-btn qh-pad" data-k="R">右驂<small>→ 或 D</small></button>' +
        '</div></div>';
      const $ = s => body.querySelector(s);
      const field = $('.qh-race__field');
      const carMe = $('.qh-car--me');
      const carRv = $('.qh-car--rv');
      const laneMe = $('.qh-lane--me');
      const laneRv = $('.qh-lane--rv');
      const aim = $('.qh-race__aim');
      const ring = $('.qh-aim__ring');
      const aimTxt = $('.qh-aim__txt');
      const msg = $('.qh-race__msg');
      const btnL = $('[data-k="L"]');
      const btnR = $('[data-k="R"]');
      const btnD = $('[data-k="D"]');
      const race = g.race ? g.race({ me: '小白（你）', rival: '公子糾', rivalColor: '#5f8a5a', goal: '先到臨淄的人當國君' }) : null;

      const RV = 4.2;            // 公子糾每秒前進（全程 100）；詳死裝得像，魯國的人馬才會放慢
      const VMAX = 9;
      const AIM_AT = 42;         // 跑到這裡，管仲放箭
      const AIM_DUR = 1.8;       // 紅圈縮小的時間
      const HIT_T = AIM_DUR * (2.2 - 1) / 2;   // 紅圈剛好蓋住帶鉤的時間
      let me = 0, rv = 0, v = 0, mult = 1, phase = 'run', phaseT = 0, waitFor = 0.6 + g.rng() * 0.8;
      let last = null, lockUntil = 0, streak = 0, stunned = 0, feign = '', ambushed = false, over = false, raf = 0, lastLi = -1;

      const setMsg = (text, kind) => { msg.textContent = text; msg.className = 'qh-race__msg' + (kind ? ' is-' + kind : ''); };
      const place = () => {
        const wMe = laneMe.clientWidth - carMe.offsetWidth - 44;
        const wRv = laneRv.clientWidth - carRv.offsetWidth - 44;
        carMe.style.transform = 'translateX(' + Math.max(0, wMe * me / 100).toFixed(1) + 'px)';
        carRv.style.transform = 'translateX(' + Math.max(0, wRv * rv / 100).toFixed(1) + 'px)';
        laneMe.style.backgroundPosition = (-me * 18).toFixed(0) + 'px 0, 0 0';
        laneRv.style.backgroundPosition = (-rv * 18).toFixed(0) + 'px 0, 0 0';
        if (race) { race.me(me / 100); race.rival(rv / 100); }
        btnL.classList.toggle('is-next', phase === 'run' && last !== 'L');
        btnR.classList.toggle('is-next', phase === 'run' && last !== 'R');
        const li = Math.max(0, Math.ceil((100 - me) * 0.6));
        if (li !== lastLi) { lastLi = li; g.setStatus('距臨淄 ' + li + ' 里'); }
        if (TEST) {
          field.dataset.phase = phase;
          field.dataset.next = last === 'L' ? 'R' : 'L';
          field.dataset.hit = phase === 'aim' && Math.abs(phaseT - HIT_T) < 0.06 ? '1' : '0';
        }
      };
      const end = win => {
        if (over) return;
        over = true;
        cancelAnimationFrame(raf);
        place();
        let score;
        if (win) {
          score = Math.round(5 + clamp((100 - rv) / 10, 0, 5));
          g.sfx('ok');
          if (g.pop) g.pop('先入臨淄！', 'gold');
          setMsg('城門大開，高傒迎你入城。', 'good');
        } else {
          score = Math.round(4 * me / 100);
          g.sfx('ng');
          if (g.pop) g.pop('公子糾先到了……', 'bad');
          setMsg('公子糾的車隊先進了城門。', 'bad');
        }
        const result = { passed: !!win, score: clamp(score, 0, 10), max: 10, win: !!win, feign: feign || 'miss' };
        setTimeout(() => resolve(result), 1400);
      };
      const tap = side => {
        if (over || paused()) return;
        if (side === 'D') { if (phase === 'wait' || phase === 'aim') feignDeath(); return; }
        if (phase !== 'run') return;
        const now = performance.now();
        if (now < lockUntil || stunned > 0) return;
        if (side === last) {
          v *= 0.35;
          lockUntil = now + 350;
          streak = 0;
          if (g.combo) g.combo(0);
          if (g.shake) g.shake();
          g.sfx('ng');
          carMe.classList.remove('is-stun');
          void carMe.offsetWidth;
          carMe.classList.add('is-stun');
          setMsg('同一邊連按，馬失前蹄！要左右交替。', 'bad');
          last = null;
          return;
        }
        last = side;
        v = Math.min(VMAX, v + 1.7);
        streak += 1;
        if (g.combo && streak % 5 === 0) g.combo(streak);
        if (streak === 10) setMsg('好！保持節奏！', 'good');
      };
      const feignDeath = () => {
        let kind;
        if (phase === 'wait') kind = 'miss';
        else {
          const d = Math.abs(phaseT - HIT_T);
          kind = d <= 0.12 ? 'perfect' : d <= 0.3 ? 'good' : 'miss';
        }
        resolveAmbush(kind);
      };
      const resolveAmbush = kind => {
        feign = kind;
        btnD.hidden = true;
        ring.classList.add('is-hit');
        if (kind === 'perfect') {
          mult = 0.45;
          g.sfx('ok');
          if (g.pop) g.pop('詳死！管仲信了', 'gold');
          aimTxt.innerHTML = '箭中帶鉤，你應聲倒下……<small>管仲派人快馬回報魯國：小白死了！</small>';
        } else if (kind === 'good') {
          mult = 0.65;
          g.sfx('ok');
          if (g.pop) g.pop('裝得還算像', 'ok');
          aimTxt.innerHTML = '箭中帶鉤，你倒在車上。<small>管仲遲疑了一下，還是派人回報。</small>';
        } else {
          mult = 0.95;
          stunned = 1.2;
          g.sfx('ng');
          if (g.shake) g.shake();
          if (g.flash) g.flash('bad');
          if (g.pop) g.pop('管仲起疑了！', 'bad');
          aimTxt.innerHTML = '你倒得不自然，管仲起了疑心……<small>魯國的人馬只稍微放慢了一點。</small>';
        }
        phase = 'fall';
        phaseT = 0;
      };
      const step = dt => {
        rv += RV * mult * dt;
        if (phase === 'run') {
          if (stunned > 0) stunned = Math.max(0, stunned - dt);
          me += v * dt;
          v *= Math.exp(-1.6 * dt);
          if (!ambushed && me >= AIM_AT) {
            ambushed = true;
            phase = 'wait';
            phaseT = 0;
            v = 0;
            aim.hidden = false;
            btnD.hidden = false;
            ring.style.setProperty('--s', '2.2');
            ring.style.setProperty('--o', '0');
            setMsg('有埋伏！', 'bad');
          }
        } else if (phase === 'wait') {
          phaseT += dt;
          if (phaseT >= waitFor) { phase = 'aim'; phaseT = 0; ring.style.setProperty('--o', '1'); g.sfx('tick'); }
        } else if (phase === 'aim') {
          phaseT += dt;
          const sc = 2.2 - 2 * Math.min(1, phaseT / AIM_DUR);
          ring.style.setProperty('--s', sc.toFixed(3));
          if (phaseT >= AIM_DUR) resolveAmbush('miss');
        } else if (phase === 'fall') {
          phaseT += dt;
          if (phaseT >= 1.6) {
            phase = 'run';
            aim.hidden = true;
            setMsg('趁魯國以為你死了，快馬加鞭！', 'good');
          }
        }
        place();
        if (me >= 100) { me = 100; end(true); }
        else if (rv >= 100) { rv = 100; end(false); }
      };
      [btnL, btnR, btnD].forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); tap(b.dataset.k); }));
      const onKey = e => {
        if (e.repeat) return;
        const k = e.key;
        if (k === 'ArrowLeft' || k === 'a' || k === 'A') { e.preventDefault(); tap('L'); }
        else if (k === 'ArrowRight' || k === 'd' || k === 'D') { e.preventDefault(); tap('R'); }
        else if (k === ' ' || k === 'Enter') { e.preventDefault(); tap('D'); }
      };
      document.addEventListener('keydown', onKey);
      let lastT = performance.now();
      const loop = now => {
        const dt = Math.min(0.05, (now - lastT) / 1000);
        lastT = now;
        if (!over && !paused()) step(dt);
        if (!over) raf = requestAnimationFrame(loop);
      };
      g.onCleanup(() => { over = true; cancelAnimationFrame(raf); document.removeEventListener('keydown', onKey); });
      place();
      raf = requestAnimationFrame(loop);
    });
  }

      let p1 = 0, hits = 0, wrongs = 0;
      const setFb = (text, kind) => { fb.textContent = text; fb.className = 'qh-cs__fb' + (kind ? ' is-' + kind : ''); };
      const setZhuang = expr => { zhuangFace.innerHTML = face('luzhuang', expr); };
      const paint = () => {
        if (race) { race.me(luQi); race.rival(qiQi); }
        drums.forEach((d, i) => d.classList.toggle('is-on', i < drumN));
        btnStop.classList.toggle('is-live', !!live);
        btnGo.classList.toggle('is-ready', phase === 1 && drumN >= 3 && rt < 0);
        zhuang.classList.toggle('is-urge', !!live);
        if (TEST) { body.dataset.live = live ? '1' : '0'; body.dataset.ready = drumN >= 3 && rt < 0 ? '1' : '0'; }
      };
      const beat = n => {
        drumN = n;
        drumEl.classList.remove('is-beat');
        void drumEl.offsetWidth;
        drumEl.classList.add('is-beat');
        g.sfx('drum');
        qiQi = n === 1 ? 1 : n === 2 ? 0.72 : 0.38;
        sayEl.innerHTML = n === 1 ? '<b>齊人一鼓！</b>齊軍士氣正盛。' : n === 2 ? '<b>齊人再鼓！</b>鼓聲已經沒那麼響了。' : '<b>齊人三鼓！</b>齊軍的士氣耗盡了——';
      };
      const stop = () => {
        if (phase !== 1 || over || paused()) return;
        if (!live) return;
        live.done = true;
        live = null;
        stops += 1;
        g.sfx('ok');
        if (g.pop) g.pop('未可！', 'ok');
        setZhuang('worried');
        setFb('你攔住了魯莊公：「未可。」', 'good');
        paint();
      };
      const go = () => {
        if (phase !== 1 || over || paused()) return;
        if (drumN < 3) {
          early += 1;
          luQi = Math.max(0.1, luQi - 0.2);
          g.sfx('ng');
          if (g.shake) g.shake();
          if (g.pop) g.pop('太早了！', 'bad');
          setFb('齊軍的氣還沒竭，魯軍先衝反而吃虧。等它擂完三通鼓！', 'bad');
          paint();
          return;
        }
        if (rt >= 0) return;
        rt = t - t3;
        luQi = Math.min(1, luQi + 0.25);
        g.sfx('drum');
        if (g.pop) g.pop(rt <= 0.6 ? '一鼓作氣！' : '可矣！', rt <= 0.6 ? 'gold' : 'ok');
        sayEl.innerHTML = '<b>魯軍一鼓！</b>彼竭我盈——齊師敗績！';
        setZhuang('happy');
        finishPhase1();
      };
      const finishPhase1 = () => {
        const timing = rt < 0 ? 0 : rt <= 0.6 ? 3 : rt <= 1.0 ? 2.5 : rt <= 1.6 ? 2 : rt <= 2.5 ? 1 : 0.5;
        p1 = Math.max(0, 2 * stops / urges.length + timing - 0.8 * early);
        phase = 0;
        paint();
        timer = setTimeout(startPhase2, 1500);
      };
      const step = dt => {
        if (phase !== 1) return;
        t += dt;
        if (drumN < 1 && t >= t1) beat(1);
        else if (drumN < 2 && t >= t2) beat(2);
        else if (drumN < 3 && t >= t3) beat(3);
        // 齊軍的氣慢慢消退
        qiQi = Math.max(drumN >= 3 ? 0.12 : 0.3, qiQi - dt * 0.05);
        urges.forEach(u => {
          if (!u.started && t >= u.at) {
            u.started = true;
            live = u;
            setZhuang('angry');
            sayEl.innerHTML = '<b>公將鼓之！</b>魯莊公舉起了鼓槌——';
            g.sfx('tick');
          }
          if (u === live && t >= u.at + u.win) {
            live = null;
            u.done = true;
            luQi = Math.max(0.1, luQi - 0.2);
            g.sfx('ng');
            if (g.shake) g.shake();
            if (g.pop) g.pop('魯軍先鼓了……', 'bad');
            setZhuang('serious');
            setFb('沒攔住！魯軍的鼓聲白白響了一通，士氣先洩了一些。', 'bad');
          }
        });
        if (drumN >= 3 && rt < 0 && t - t3 > 8) { rt = 9; finishPhase1(); }
        paint();
      };

      // 第二階段：察轍望旗
      const ROUNDS = [
        ['r', 'r', 'a', 'a'],
        ['r', 'r', 'a', 'm'],
        ['r', 'r', 'm', 'm']
      ];
      let round = -1, cards = [], found = 0, need = 0, fuse = 0, fuseMax = 1, rLock = true;
      const startPhase2 = () => {
        if (over) return;
        phase = 2;
        body.innerHTML =
          '<div class="qh-cs"><div class="qh-cs2">' +
          '<p class="qh-cs2__head">齊師敗績！魯莊公想立刻追——「未可。」<small>下視其轍，登軾而望之：只追<b>車轍雜亂、旗子倒下</b>的齊軍。</small></p>' +
          '<div class="qh-fuse"><i></i></div><div class="qh-cs2__grid"></div>' +
          '<p class="qh-cs__fb" aria-live="polite"></p></div></div>';
        nextRound();
      };
      const nextRound = () => {
        if (over) return;
        round += 1;
        if (round >= ROUNDS.length) { finishAll(); return; }
        const kinds = shuffle(ROUNDS[round], g.rng).map(k => {
          if (k === 'm') return g.rng() < 0.5 ? { r: false, ruts: true, flag: false } : { r: false, ruts: false, flag: true };
          return k === 'r' ? { r: true, ruts: true, flag: true } : { r: false, ruts: false, flag: false };
        });
        cards = kinds;
        found = 0;
        need = kinds.filter(k => k.r).length;
        fuseMax = 6.5 - round * 0.8;
        fuse = fuseMax;
        const grid = body.querySelector('.qh-cs2__grid');
        grid.innerHTML = kinds.map((k, i) => '<button type="button" class="qh-unit" data-i="' + i + '"' + (TEST && k.r ? ' data-r="1"' : '') + ' aria-label="第 ' + (i + 1) + ' 支齊軍">' + unitSvg(k.ruts, k.flag, g.rng) + '<b></b></button>').join('');
        grid.querySelectorAll('.qh-unit').forEach(b => b.addEventListener('click', () => pickUnit(Number(b.dataset.i), b)));
        const fbEl = body.querySelector('.qh-cs__fb');
        fbEl.textContent = '第 ' + (round + 1) + ' / 3 輪';
        fbEl.className = 'qh-cs__fb';
        g.setStatus('察轍望旗 ' + (round + 1) + ' / 3');
        rLock = false;
      };
      const pickUnit = (i, btn) => {
        if (rLock || over || paused() || btn.disabled) return;
        btn.disabled = true;
        const k = cards[i];
        const tag = btn.querySelector('b');
        const fbEl = body.querySelector('.qh-cs__fb');
        if (k.r) {
          hits += 1;
          found += 1;
          btn.classList.add('is-ok');
          tag.textContent = '逐！';
          g.sfx('ok');
          if (g.combo) g.combo(hits);
          if (found >= need) endRound(true);
        } else {
          wrongs += 1;
          btn.classList.add('is-bad');
          tag.textContent = '有伏！';
          g.sfx('ng');
          if (g.shake) g.shake();
          if (g.pop) g.pop('中了埋伏！', 'bad');
          if (g.combo) g.combo(0);
          fbEl.textContent = k.ruts ? '車轍是亂了，可是旗子還豎著——可能是假裝敗退。' : k.flag ? '旗子倒了，可是車轍整整齊齊——退得很有秩序。' : '車轍整齊、旗子豎著，這是有秩序的撤退。';
          fbEl.className = 'qh-cs__fb is-bad';
        }
      };
      const endRound = clean => {
        rLock = true;
        body.querySelectorAll('.qh-unit').forEach((b, i) => { if (!b.disabled && cards[i].r) b.classList.add('is-reveal'); b.disabled = true; });
        if (clean && g.pop) g.pop('轍亂旗靡，逐之！', 'gold');
        timer = setTimeout(nextRound, 1000);
      };
      const finishAll = () => {
        if (over) return;
        over = true;
        cancelAnimationFrame(raf);
        clearTimeout(timer);
        const p2 = 5 * Math.max(0, hits - wrongs) / 6;
        const score = clamp(Math.round(p1 + p2), 0, 10);
        const fbEl = body.querySelector('.qh-cs__fb');
        if (fbEl) { fbEl.textContent = '追擊結束：追對 ' + hits + ' 支，誤入埋伏 ' + wrongs + ' 次。'; fbEl.className = 'qh-cs__fb is-good'; }
        g.sfx(score >= 5 ? 'ok' : 'ng');
        const result = { passed: score >= 5, score: score, max: 10, stops: stops, early: early, rt: rt, hits: hits, wrongs: wrongs };
        timer = setTimeout(() => resolve(result), 1300);
      };

      btnStop.addEventListener('pointerdown', e => { e.preventDefault(); stop(); });
      btnGo.addEventListener('pointerdown', e => { e.preventDefault(); go(); });
      const onKey = e => {
        if (e.repeat || phase !== 1) return;
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { e.preventDefault(); stop(); }
        else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D' || e.key === ' ') { e.preventDefault(); go(); }
      };
      document.addEventListener('keydown', onKey);
      let lastT = performance.now();
      const loop = now => {
        const dt = Math.min(0.05, (now - lastT) / 1000);
        lastT = now;
        if (!over && !paused()) {
          if (phase === 1) step(dt);

            fuse -= dt;
            const fz = body.querySelector('.qh-fuse');
            if (fz) { fz.querySelector('i').style.setProperty('--p', Math.max(0, 100 * fuse / fuseMax).toFixed(1) + '%'); fz.classList.toggle('is-warn', fuse < 2); }
            if (fuse <= 0) endRound(false);
          }
        }
        if (!over) raf = requestAnimationFrame(loop);
      };
      g.onCleanup(() => { over = true; cancelAnimationFrame(raf); clearTimeout(timer); document.removeEventListener('keydown', onKey); });
      g.setStatus('三鼓');
      paint();
      raf = requestAnimationFrame(loop);
    });
  }

  // ───── 小遊戲三：九合諸侯（地圖戰略） ─────

  const JH_STATES = [

    { id: 'wei', name: '衛', x: 58, y: 37 },

    { id: 'chen', name: '陳', x: 56, y: 79, south: true },
    { id: 'xu', name: '許', x: 22, y: 70, south: true },
    { id: 'cai', name: '蔡', x: 39, y: 89, south: true }

  const JH_TURNS = [

    { year: '前 679 年', title: '鄄之會', text: '諸侯開始以齊國為首。楚國也在南方拉攏小國。', crisis: [] },
    { year: '前 663 年', title: '山戎伐燕', text: '北方的山戎攻打燕國，燕國向齊國求救。', crisis: ['yan'] },
    { year: '前 661 年', title: '狄人伐邢', text: '狄人攻打邢國。管仲：「戎狄豺狼，不可厭也；諸夏親暱，不可棄也。」', crisis: ['xing'] },
    { year: '前 660 年', title: '狄人滅衛', text: '衛懿公好鶴，國人不肯替他作戰，狄人攻破衛都。衛國的遺民等著救援。', crisis: ['wei'] },
    { year: '前 656 年', title: '伐楚・召陵', text: '最後一年：楚國全力北上，今年要拉攏兩個國家。召陵之會以前，盡量讓諸侯站在齊國這邊。', crisis: [], chuMoves: 2 }
  ];
  const JH_COST = { save: 15, keep: 10, ally: 12, attack: 22 };

  function jiuheGame(body, g) {
    return new Promise(resolve => {
      const owner = {};
      JH_STATES.forEach(s => { owner[s.id] = 'none'; });
      owner.lu = 'qi';
      owner.cai = 'chu';
      let bing = 26, xin = 18, ap = 2, turn = -1, crisis = {}, targets = [], sel = null, fuse = 0, over = false, raf = 0, timer = 0, lock = true;
      const logs = [];
      body.innerHTML =
        '<div class="qh-jh">' +
        '<div class="qh-jh__bar"><span class="qh-jh__year"></span>' +
        '<span class="qh-jh__res">兵力 <b data-r="bing"></b></span><span class="qh-jh__res">信義 <b data-r="xin"></b></span>' +
        '<span class="qh-jh__res">行動 <span class="qh-jh__ap"><i></i><i></i></span></span><div class="qh-fuse"><i></i></div></div>' +
        '<div class="qh-jh__main">' +
        '<div class="qh-jh__map">' + jhMapBg() +
        '<span class="qh-jh__home" style="left:86%;top:22%"><b style="color:#6a3f8a">齊</b>臨淄</span>' +
        '<span class="qh-jh__home" style="left:12%;top:92%"><b style="color:#a3362c">楚</b></span>' +
        '<span class="qh-jh__home" style="left:20%;top:42%"><b style="color:#a8843a;font-size:22px">周</b>王城</span>' +
        JH_STATES.map(s => '<button type="button" class="qh-st" data-id="' + s.id + '" style="left:' + s.x + '%;top:' + s.y + '%">' + s.name + '</button>').join('') +
        '</div>' +
        '<div class="qh-jh__side"><div class="qh-jh__event"></div><div class="qh-jh__sel"></div>' +
        '<div class="qh-jh__global"><button type="button" class="zh-btn" data-jh="farm">修內政<small>（兵+12、信+4）</small></button><button type="button" class="zh-btn zh-btn--quiet" data-jh="end">結束這一年</button></div>' +
        '<div class="qh-jh__log" aria-live="polite"></div></div>' +
        '</div>' +
        '<div class="qh-jh__intro" hidden><div><small></small><h3></h3><p></p></div></div>' +
        '</div>';
      const $ = s => body.querySelector(s);

      const race = g.race ? g.race({ me: '從齊的諸侯', rival: '從楚的諸侯', rivalColor: '#a83a2c', goal: '九國之中，讓更多國家站在齊國這邊' }) : null;
      const count = who => JH_STATES.filter(s => owner[s.id] === who).length;
      const log = text => { logs.unshift(text); if (logs.length > 8) logs.pop(); $('.qh-jh__log').innerHTML = logs.map(x => '<p>' + esc(x) + '</p>').join(''); };

      const actionsFor = id => {

        if (o === 'chu') acts.push({ act: 'attack', label: '伐', note: '兵 ' + JH_COST.attack + '・打回中立、信義 -3', ok: bing >= JH_COST.attack });
        return acts;
      };

        } else {

            (acts.length ? acts.map(a => '<button type="button" class="zh-btn zh-btn--primary" data-act="' + a.act + '"' + (a.ok && ap > 0 && !lock ? '' : ' disabled') + '>' + a.label + ' <small>' + esc(a.note) + '</small></button>').join('') : '<p style="color:var(--text-dim)">已經是齊國的盟國，暫時不用行動。</p>') +
            '</div>';

        }

        $('[data-jh="end"]').disabled = lock;
        if (race) { race.me(count('qi') / 9); race.rival(count('chu') / 9); }
      };
      const spend = () => { ap -= 1; if (ap <= 0) timer = setTimeout(endTurn, 500); };
      const doAct = (id, act) => {
        if (lock || ap <= 0 || over || paused()) return;
        const n = nameOf(id);
        if (act === 'save' && bing >= JH_COST.save) { bing -= JH_COST.save; owner[id] = 'qi'; delete crisis[id]; xin += 8; log('齊師救' + n + '，' + n + '國歸附。'); g.sfx('ok'); if (g.pop) g.pop(n + '歸附！', 'gold'); }
        else if (act === 'keep' && bing >= JH_COST.keep) { bing -= JH_COST.keep; delete crisis[id]; xin += 5; log('齊師救' + n + '，盟國安定。'); g.sfx('ok'); if (g.pop) g.pop('救' + n + '！', 'ok'); }
        else if (act === 'ally' && xin >= JH_COST.ally) {
          xin -= JH_COST.ally; owner[id] = 'qi'; log('齊與' + n + '盟。'); g.sfx('ok');
          if (targets.indexOf(id) > -1) { if (g.pop) g.pop('搶在楚國之前！', 'gold'); } else if (g.pop) g.pop('與' + n + '盟', 'ok');
        }
        else if (act === 'attack' && bing >= JH_COST.attack) { bing -= JH_COST.attack; owner[id] = 'none'; xin = Math.max(0, xin - 3); log('齊伐' + n + '，' + n + '國不再附楚。'); g.sfx('drum'); if (g.pop) g.pop('伐' + n + '！', 'ok'); }
        else return;
        if (g.combo) g.combo(count('qi'));

        paint();
      };

        if (lock || ap <= 0 || over || paused()) return;
        bing += 12; xin += 4;

        g.sfx('click');
        spend();
        paint();
      };
      const endTurn = () => {
        if (lock || over) return;
        lock = true;
        clearTimeout(timer);
        Object.keys(crisis).forEach(id => {
          const n = nameOf(id);
          if (owner[id] === 'qi') { owner[id] = 'none'; xin = Math.max(0, xin - 8); log(n + '國求救無門，離開了盟約。'); }

        });

          else if (owner[id] === 'qi') {

            else { owner[id] = 'none'; log(n + '國在楚國的壓力下退出盟約。'); }
          }
        });
        targets = [];
        sel = null;
        paint();
        timer = setTimeout(nextTurn, 900);
      };
      const pickTargets = nMoves => {
        const out = [];
        for (let k = 0; k < nMoves; k++) {
          let pool = JH_STATES.filter(s => s.south && owner[s.id] === 'none' && out.indexOf(s.id) === -1);
          if (!pool.length) pool = JH_STATES.filter(s => s.south && owner[s.id] === 'qi' && out.indexOf(s.id) === -1);
          if (!pool.length) break;
          out.push(pool[Math.floor(g.rng() * pool.length)].id);
        }
        return out;
      };
      const nextTurn = () => {
        if (over) return;
        turn += 1;

        const T = JH_TURNS[turn];

        ap = 2;
        crisis = {};
        T.crisis.forEach(id => { crisis[id] = true; });
        targets = pickTargets(T.chuMoves || 1);
        $('.qh-jh__year').textContent = T.year + '・' + T.title + '（第 ' + (turn + 1) + ' / ' + JH_TURNS.length + ' 年）';
        $('.qh-jh__event').innerHTML = '<b>' + esc(T.title) + '</b>' + esc(T.text);
        g.setStatus('第 ' + (turn + 1) + ' / ' + JH_TURNS.length + ' 年');
        const intro = $('.qh-jh__intro');
        intro.querySelector('small').textContent = T.year + (turn > 0 ? '・兵力 +10、信義 +5' : '');
        intro.querySelector('h3').textContent = T.title;
        intro.querySelector('p').textContent = T.text;
        intro.hidden = false;
        paint();
        timer = setTimeout(() => {
          intro.hidden = true;
          fuse = 20;
          lock = false;
          paint();
        }, turn === 0 ? 2200 : 1500);
      };
      const finish = () => {
        over = true;
        lock = true;
        cancelAnimationFrame(raf);
        clearTimeout(timer);
        const qi = count('qi'), chu = count('chu');
        const score = clamp(Math.round(qi * 1.2 - chu * 0.4 - 0.4), 0, 10);
        const intro = $('.qh-jh__intro');
        intro.querySelector('small').textContent = '前 656 年・召陵';
        intro.querySelector('h3').textContent = '從齊 ' + qi + ' 國・從楚 ' + chu + ' 國';
        intro.querySelector('p').textContent = qi >= 7 ? '九合諸侯，一匡天下。楚人遣屈完請盟。' : qi >= 5 ? '諸侯多從齊，楚國不得不派人求和。' : '諸侯各懷二心，齊國的號令打了折扣。';
        intro.hidden = false;
        g.sfx(qi >= 5 ? 'ok' : 'ng');
        if (g.pop) g.pop(qi >= 7 ? '九合諸侯！' : '從齊 ' + qi + ' 國', qi >= 7 ? 'gold' : 'ok');
        paint();
        const result = { passed: qi >= 5 && qi > chu, score: score, max: 10, allies: qi, chu: chu };
        timer = setTimeout(() => resolve(result), 1800);
      };

      body.querySelectorAll('.qh-st').forEach(b => b.addEventListener('click', () => {
        if (over) return;
        sel = b.dataset.id;
        g.sfx('click');
        paint();
        if (window.innerWidth <= 860) { const el = $('.qh-jh__sel'); const r = el.getBoundingClientRect(); if (r.bottom > window.innerHeight) el.scrollIntoView({ block: 'end', behavior: 'smooth' }); }
      }));
      $('[data-jh="farm"]').addEventListener('click', farm);
      $('[data-jh="end"]').addEventListener('click', () => { if (!lock) endTurn(); });
      let lastT = performance.now();
      const loop = now => {
        const dt = Math.min(0.1, (now - lastT) / 1000);
        lastT = now;
        if (!over && !lock && !paused()) {
          fuse -= dt;
          const fz = $('.qh-jh__bar .qh-fuse');
          fz.querySelector('i').style.setProperty('--p', Math.max(0, 100 * fuse / 20).toFixed(1) + '%');
          fz.classList.toggle('is-warn', fuse < 5);
          if (fuse <= 0) { log('時間到，這一年就這樣過去了。'); endTurn(); }
        }
        if (!over) raf = requestAnimationFrame(loop);
      };
      g.onCleanup(() => { over = true; cancelAnimationFrame(raf); clearTimeout(timer); });
      paint();
      nextTurn();
      raf = requestAnimationFrame(loop);
    });
  }

  function jhMapBg() {
    return '<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">' +
      '<path d="M76 0 L100 0 L100 40 C94 38 86 32 78 26 Z" fill="#d6c8e0" opacity=".7"/>' +
      '<path d="M0 82 C20 78 40 84 60 92 L60 100 L0 100 Z" fill="#e2c4b0" opacity=".7"/>' +
      '<path d="M6 0 C8 14 10 28 14 40 C24 44 34 42 44 40 C54 38 62 32 70 24 C78 16 86 8 96 2" fill="none" stroke="#6a8bb0" stroke-width="1.6" vector-effect="non-scaling-stroke" style="stroke-width:6px"/>' +
      '<path d="M0 74 C8 80 16 88 24 100" fill="none" stroke="#6a8bb0" style="stroke-width:4px" vector-effect="non-scaling-stroke"/>' +
      '</svg>';
  }


  // ═════════════════════════ 8. 結局與結算 ═════════════════════════

  const ENDINGS = {
    great: { id: 'great', title: '一匡天下', good: true, text: '九合諸侯，不以兵車，管仲之力也' },
    good: { id: 'good', title: '春秋首霸', good: true, text: '齊桓公以霸，九合諸侯，一匡天下' },
    bad: { id: 'bad', title: '霸業未竟', good: false, text: '諸侯雖會，而楚未服，霸業未竟' }
  };

  function onEnd(result, ctx) {
    const s = ctx.state;
    const e = ENDINGS[(result && result.key) || 'good'] || ENDINGS.good;
    ZH.sfx('seal');
    return ctx.banner(e.title, '齊桓稱霸・終')
      .then(() => ctx.say([{ who: 'shiguan', text: '從莒道上的那一箭，到葵丘的那一拜，齊桓公走了三十多年。成就他的，是一個射過他的人，和一個懂得朋友的人。' }]))
      .then(() => ZH.deleteSave(SID, MODE).catch(() => null))
      .then(() => ZH.finishScenario(payload(s, e)));
  }

  function payload(s, ending) {
    const f = s.flags;
    const zheng = Number(f.zhengScore) || 0;
    const chang = Number(f.changScore) || 0;
    const jiu = Number(f.jiuScore) || 0;
    const allies = Number(f.jiuAllies) || 0;
    const played = id => (s.games || []).some(x => x.gameId === id && !x.skipped);
    const strategy = clamp(Math.round(zheng * 3 + chang * 3 + jiu * 4), 0, 100);
    const virtue = clamp(Math.round((s.meters.xin || 0) * 0.6 + (s.meters.guo || 0) * 0.4), 0, 100);

    const deeds = ['齊襄公立，無常。鮑叔牙奉公子小白出奔莒，管夷吾、召忽奉公子糾奔魯。'];
    deeds.push('無知弒襄公，國人殺無知。魯送公子糾，管仲遮莒道，射中小白帶鉤，小白詳死，遂先入，是為桓公。' + (played('qh_zhengxian') && zheng >= 8 ? '糾後六日乃至。' : ''));
    deeds.push('魯師敗于乾時，殺子糾，召忽死之。鮑叔受管仲而薦之，桓公置射鉤而使管仲相。');
    deeds.push('明年，齊師伐魯，戰于長勺。曹劌待齊人三鼓而擊之，視其轍亂，望其旗靡，乃逐之，齊師敗績。');
    deeds.push('管仲任政，通貨積財，富國彊兵。盟于柯，桓公欲背曹沫之約，管仲因而信之，諸侯由是歸齊。');
    deeds.push('北伐山戎以救燕，救邢存衛。' + (played('qh_jiuhe') ? (allies >= 7 ? '九合諸侯，一匡天下。' : allies >= 5 ? '諸侯多從之。' : '然諸侯猶有貳心。') : ''));
    deeds.push('以諸侯之師侵蔡，遂伐楚，責包茅之貢。屈完及諸侯盟于召陵。');
    deeds.push('會諸侯于葵丘，王使宰孔賜胙，命無下拜。桓公曰：「天威不違顏咫尺。」下，拜；登，受。');
    deeds.push('管仲卒，桓公近易牙、開方、豎刁。桓公卒，五公子爭立。' + (ending.id === 'great' ? '然一匡天下之功，民到于今受其賜。' : ''));

    return {
      scenarioId: SID, mode: MODE, faction: '齊',
      role: '齊桓公', roleKind: 'shijia', country: '齊',
      bioTitle: '齊太公世家・桓公', bioOpening: '齊桓公小白，齊僖公之子也。',
      ending: ending,
      scoreStrategy: strategy, scoreVirtue: virtue,
      turns: s.steps || 1,
      durationSec: Math.min(5400, Math.round((Date.now() - (s.startedAt || Date.now())) / 1000)),
      deeds: deeds,
      anchors: s.anchors,
      games: s.games,
      codex: s.codex,
      opener: '余讀管氏書，至「生我者父母，知我者鮑子也」，未嘗不歎鮑叔之能知人也。',
      prompts: [
        '齊桓公放下一箭之仇，任用管仲為相。如果你是他，你做得到嗎？「用人」和「記仇」之間，你怎麼取捨？',
        '曹劌說「肉食者鄙，未能遠謀」，又等齊軍「三而竭」才出擊。生活中，有沒有「先忍住、看準時機」反而成功的經驗？',
        '柯之盟是被人拿刀逼著答應的，管仲仍然主張守約。你認為被迫的承諾要不要遵守？為什麼？'
      ]
    };
  }


  // ═════════════════════════ 9. 開始 ═════════════════════════

  const saveState = state => ZH.save(SID, MODE, { engine: state }).catch(() => null);

  function startGame(saved) {
    ROOT.innerHTML = '';
    const game = ZH.story.create(ROOT, {
      id: SID, mode: MODE, title: META.name, subtitle: META.episode,
      seed: Number(params.seed) || 0, start: 'n_intro',
      characters: CHARACTERS, meters: METERS, nodes: ZH.character?.springNodes(SID, NODES, () => game.save()) || NODES, help: HELP, scenes: SCENES,
      initState: () => ({ _ocChapter: ZH.character?.newChapterState(SID) }),
      anchorTotal: ANCHOR_ORDER.length, anchorOrder: ANCHOR_ORDER,
      snapshot: (snap, live) => { if (live?._ocChapter) snap._ocChapter = JSON.parse(JSON.stringify(live._ocChapter)); },
      onEnd: onEnd, save: saveState
    });
    if (params.test) window.__ep = game;
    game.start(saved ? ZH.character?.applyChapterChoice(SID, saved) || saved : null);
  }

  function roleFace() {
    const c = CHARACTERS.find(x => x.id === ROLE.who);
    if (c && window.ART && ART.portrait) return '<span class="ep-seal has-art" aria-hidden="true">' + ART.portrait(c, { bust: true }) + '</span>';
    return '<span class="ep-seal" aria-hidden="true">' + esc(ROLE.glyph) + '</span>';
  }

  function renderTitle(saved) {
    const vol = ZH.VOLUMES.find(v => v.key === META.vol) || { no: '', name: '' };
    const st = saved && saved.engine;
    const btn = (a, label, primary) => '<button type="button" class="zh-btn ' + (primary ? 'zh-btn--primary' : 'zh-btn--quiet') + ' zh-btn--block" data-a="' + a + '">' + esc(label) + '</button>';
    ROOT.innerHTML =
      '<div class="ep-title" style="--ep-color:' + esc(ROLE.color) + '">' +
      '<div class="ep-title__bar"><a class="zh-mark" href="#" data-a="home"><span class="zh-mark__re">Re:</span><span class="zh-mark__name">縱橫鼎業</span></a>' +
      '<button type="button" class="zh-btn zh-btn--quiet zh-btn--sm" data-a="home">回首頁</button></div>' +
      '<main class="ep-title__main"><header>' +
      '<p class="ep-kicker">' + esc([vol.no + ' ' + vol.name, ZH.episodeLabel(META), '前 ' + META.year + ' 年'].join('・')) + '</p>' +
      '<h1 class="ep-h1">' + esc(META.name) + '</h1>' +
      '<p class="ep-episode">' + esc(META.episode) + '</p>' +
      '<div class="ep-chips">' + (META.guest ? '<span class="zh-chip zh-chip--gilt">訪客開放</span>' : '') +
      '<span class="zh-chip">原典' + esc(META.source) + '</span><span class="zh-chip zh-chip--patina">' + esc(META.genre) + '</span>' +
      '<span class="zh-chip">自動存檔</span></div>' +
      (ZH.isGuest() ? '<p class="ep-note" style="margin-top:12px">你目前是訪客：可以完整遊玩，但進度只保存在這個分頁，也不會留下成績。</p>' : '') +
      '</header>' +
      '<section class="ep-start">' + roleFace() +
      '<div><h2 class="ep-start__name">' + esc(ROLE.name) + '・' + esc(ROLE.title) + '</h2><p class="ep-start__lead">' + esc(ROLE.lead) + '</p></div>' +
      '<div class="ep-start__act">' + (st ? btn('continue', st.ended ? '查看結局' : '繼續', true) + btn('new', '重新開始', false) : btn('new', '開始遊戲', true)) + '</div></section>' +
      '<section class="ep-points" aria-label="本話重點">' + POINTS.map(p => '<div class="ep-point"><b>' + esc(p.title) + '</b><span>' + esc(p.text) + '</span></div>').join('') + '</section>' +
      '<p class="ep-note">本話寫前 686 年到前 643 年齊桓公稱霸的經過。他晚年收留的晉公子重耳，是第 4 話〈重耳流亡〉的主角。共 ' + ANCHOR_ORDER.length + ' 個史實錨點，約 40 分鐘。中途離開會自動存檔。</p>' +
      '</main></div>';
    const characterEntry = document.createElement('div'); characterEntry.setAttribute('data-character-entry', '');
    ROOT.querySelector('.ep-start').after(characterEntry); ZH.character?.mountEntry(characterEntry, SID, st);
    ROOT.querySelectorAll('[data-a="home"]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); ZH.go('hub'); }));
    const cont = ROOT.querySelector('[data-a="continue"]');
    if (cont) cont.addEventListener('click', () => { ZH.sfx('click'); startGame(st); });
    ROOT.querySelector('[data-a="new"]').addEventListener('click', () => {
      ZH.sfx('click');
      if (!st) { startGame(null); return; }
      ZH.modal({
        title: '重新開始？', body: '<p>目前的進度會清除，從頭開始。</p>',
        actions: [{ label: '取消', value: false, kind: 'quiet' }, { label: '重新開始', value: true, kind: 'primary' }]
      }).then(ok => { if (ok) ZH.deleteSave(SID, MODE).catch(() => null).then(() => startGame(null)); });
    });
  }

  const loadSave = () => ZH.load(SID, MODE).then(r => (r && r.ok && r.state && r.state.engine ? r.state : null)).catch(() => null);

  ZH.ready(() => {
    ZH.loading(true, '展開竹簡');
    ZH.codex.init();
    Promise.all([loadSave(), Promise.race([anchorsReady, ZH.sleep(8000)])]).then(([saved]) => {
      ZH.loading(false);
      if (String(params.mode || '') === MODE && saved) { startGame(saved.engine); return; }
      renderTitle(saved);
    });
  });
})();
</script>
<script>ZH.ready(function(){ZH.textplay?.install("S_cq03_qihuan",null);});</script>
