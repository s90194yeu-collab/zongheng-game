        "庖丁釋刀對曰：「臣之所好者道也，進乎技矣。始臣之解牛之時，所見無非全牛者；三年之後，未嘗見全牛也。方今之時，臣以神遇而不以目視，官知止而神欲行。依乎天理，批大郤，導大窾，因其固然；技經肯綮之未嘗，而況大軱乎！良庖歲更刀，割也；族庖月更刀，折也。今臣之刀十九年矣，所解數千牛矣，而刀刃若新發於硎。彼節者有閒，而刀刃者無厚；以無厚入有間，恢恢乎其於遊刃必有餘地矣。是以十九年而刀刃若新發於硎。雖然，每至於族，吾見其難為，怵然為戒，視為止，行為遲。動刀甚微，謋然已解，如土委地。提刀而立，為之四顧，為之躊躇滿志，善刀而藏之。」",

        "慶曆四年春，滕子京謫守巴陵郡。越明年，政通人和，百廢具興，乃重修岳陽樓，增其舊制，刻唐賢今人詩賦於其上；屬予作文以記之。",
        "予觀夫巴陵勝狀，在洞庭一湖。銜遠山，吞長江，浩浩湯湯，橫無際涯；朝暉夕陰，氣象萬千；此則岳陽樓之大觀也，前人之述備矣。然則北通巫峽，南極瀟湘，遷客騷人，多會於此，覽物之情，得無異乎？",
        "若夫霪雨霏霏，連月不開；陰風怒號，濁浪排空；日星隱曜，山嶽潛形；商旅不行，檣傾楫摧；薄暮冥冥，虎嘯猿啼。登斯樓也，則有去國懷鄉，憂讒畏譏，滿目蕭然，感極而悲者矣。",
        "至若春和景明，波瀾不驚，上下天光，一碧萬頃；沙鷗翔集，錦鱗游泳，岸芷汀蘭，郁郁青青。而或長煙一空，皓月千里，浮光躍金，靜影沉璧，漁歌互答，此樂何極。登斯樓也，則有心曠神怡，寵辱偕忘，把酒臨風，其喜洋洋者矣。",
        "嗟夫！予嘗求古仁人之心，或異二者之為，何哉？不以物喜，不以己悲。居廟堂之高，則憂其民；處江湖之遠，則憂其君。是進亦憂，退亦憂；然則何時而樂耶？其必曰「先天下之憂而憂，後天下之樂而樂」歟！噫！微斯人，吾誰與歸？",
        "時六年九月十五日。"
      ],

      "intro": "追蹤移步換景、朝暮四時與樂的層次，讀出太守樂其樂。",
      "fullText": [
        "環滁皆山也。其西南諸峰，林壑尤美，望之蔚然而深秀者，琅琊也。山行六七里，漸聞水聲潺潺，而瀉出於兩峰之間者，釀泉也。峰迴路轉，有亭翼然臨於泉上者，醉翁亭也。作亭者誰？山之僧智仙也。名之者誰？太守自謂也。太守與客來飲於此，飲少輒醉，而年又最高，故自號曰醉翁也。醉翁之意不在酒，在乎山水之間也。山水之樂，得之心而寓之酒也。",
        "若夫日出而林霏開，雲歸而巖穴暝，晦明變化者，山間之朝暮也。野芳發而幽香，佳木秀而繁陰，風霜高潔，水落而石出者，山間之四時也。朝而往，暮而歸，四時之景不同，而樂亦無窮也。",
        "至於負者歌於途，行者休於樹，前者呼，後者應，傴僂提攜，往來而不絕者，滁人遊也。臨谿而漁，谿深而魚肥；釀泉為酒，泉香而酒洌；山肴野蔌，雜然而前陳者，太守宴也。宴酣之樂，非絲非竹，射者中，弈者勝，觥籌交錯，起坐而諠譁者，眾賓懽也；蒼顏白髮，頹然乎其間者，太守醉也。",
        "已而夕陽在山，人影散亂，太守歸而賓客從也。樹林陰翳，鳴聲上下，遊人去而禽鳥樂也。然而禽鳥知山林之樂，而不知人之樂；人知從太守遊而樂，而不知太守之樂其樂也。醉能同其樂，醒能述以文者，太守也。太守謂誰？廬陵歐陽脩也。"
      ],

          "passage": "至於負者歌於途，行者休於樹，前者呼，後者應，傴僂提攜，往來而不絕者，滁人遊也。臨谿而漁，谿深而魚肥；釀泉為酒，泉香而酒洌；山肴野蔌，雜然而前陳者，太守宴也。宴酣之樂，非絲非竹，射者中，弈者勝，觥籌交錯，起坐而諠譁者，眾賓懽也；蒼顏白髮，頹然乎其間者，太守醉也。已而夕陽在山，人影散亂，太守歸而賓客從也。樹林陰翳，鳴聲上下，遊人去而禽鳥樂也。然而禽鳥知山林之樂，而不知人之樂；人知從太守遊而樂，而不知太守之樂其樂也。醉能同其樂，醒能述以文者，太守也。太守謂誰？廬陵歐陽脩也。",

      "intro": "以逸事見人物精神，辨認左光斗與史可法的師生關係及敘事來源。",
      "fullText": [
        "先君子嘗言，鄉先輩左忠毅公視學京畿。一日，風雪嚴寒，從數騎出，微行入古寺。廡下一生伏案臥，文方成草。公閱畢，即解貂覆生，為掩戶。叩之寺僧，則史公可法也。及試，吏呼名至史公，公瞿然注視，呈卷，即面署第一。召入，使拜夫人，曰：「吾諸兒碌碌，他日繼吾志事，惟此生耳。」",
        "及左公下廠獄，史朝夕獄門外。逆閹防伺甚嚴，雖家僕不得近。久之，聞左公被炮烙，旦夕且死，持五十金，涕泣謀於禁卒，卒感焉。一日，使史更敝衣草屨，背筐，手長鑱，為除不潔者，引入，微指左公處。則席地倚牆而坐，面額焦爛不可辨，左膝以下筋骨盡脫矣。史前跪，抱公膝而嗚咽。公辨其聲，而目不可開，乃奮臂以指撥眥，目光如炬，怒曰：「庸奴！此何地也，而汝來前！國家之事，糜爛至此；老夫已矣，汝復輕身而昧大義，天下事誰可支拄者？不速去，無俟奸人構陷，吾今即撲殺汝！」因摸地上刑械作投擊勢。史噤不敢發聲，趨而出。後常流涕述其事以語人，曰：「吾師肺肝，皆鐵石所鑄造也。」",
        "崇禎末，流賊張獻忠出沒蘄、黃、潛、桐間，史公以鳳廬道奉檄守御。每有警，輒數月不就寢，使將士更休，而自坐幄幕外。擇健卒十人，令二人蹲踞而背倚之，漏鼓移則番代。每寒夜起立，振衣裳，甲上冰霜迸落，鏗然有聲。或勸以少休，公曰：「吾上恐負朝廷，下恐愧吾師也。」",
        "史公治兵，往來桐城，必躬造左公第，候太公、太母起居，拜夫人於堂上。余宗老塗山，左公甥也，與先君子善，謂獄中語，乃親得之於史公云。"
      ],

      "intro": "辨析文人相輕、文體四科、文氣與文章價值的不同論述層次。",
      "fullText": [
        "文人相輕，自古而然。傅毅之於班固，伯仲之間耳，而固小之，與弟超書曰「武仲以能屬文為蘭臺令史，下筆不能自休。」夫人善於自見，而文非一體，鮮能備善。是以各以所長，相輕所短。里語曰：「家有敝帚，享之千金。」斯不自見之患也。今之文人，魯國孔融文舉，廣陵陳琳孔璋，山陽王粲仲宣，北海徐幹偉長，陳留阮瑀元瑜，汝南應瑒德璉，東平劉楨公幹：斯七子者，於學無所遺，於辭無所假，咸以自騁驥騄於千里，仰齊足而並馳。以此相服，亦良難矣。蓋君子審己以度人，故能免於斯累，而作論文。",
        "王粲長於辭賦，徐幹時有齊氣，然粲之匹也。如粲之初征、登樓、槐賦、征思，幹之玄猿、漏卮、圓扇、橘賦，雖張、蔡不過也。然於他文，未能稱是。琳、瑀之章表書記，今之雋也。應瑒和而不壯；劉楨壯而不密。孔融體氣高妙，有過人者；然不能持論，理不勝辭；以至乎雜以嘲戲。及其所善，揚、班儔也。",
        "常人貴遠賤近，向聲背實，又患闇於自見，謂己為賢。夫文本同而末異。蓋奏議宜雅，書論宜理，銘誄尚實，詩賦欲麗。此四科不同，故能之者偏也；唯通才能備其體。",
        "文以氣為主；氣之清濁有體，不可力強而致。譬諸音樂，曲度雖均，節奏同檢；至於引氣不齊，巧拙有素，雖在父兄，不能以移子弟。",
        "蓋文章經國之大業，不朽之盛事。年壽有時而盡，榮樂止乎其身。二者必至之常期，未若文章之無窮。是以古之作者，寄身於翰墨，見意於篇籍，不假良史之辭，不託飛馳之勢，而聲名自傳於後。故西伯幽而演易，周旦顯而制禮；不以隱約而弗務，不以康樂而加思。夫然，則古人賤尺璧而重寸陰，懼乎時之過已。而人多不強力，貧賤則懾於飢寒，富貴則流於逸樂，遂營目前之務，而遺千載之功。日月逝於上，體貌衰於下，忽然與萬物遷化，斯志士之大痛也！融等已逝，唯幹著論，成一家言。"
      ],

      "intro": "由根源譬喻、創守對比走到十思與任人，掌握疏體說理的層次。",
      "fullText": [
        "臣聞求木之長者，必固其根本；欲流之遠者，必浚其泉源；思國之安者，必積其德義。源不深而望流之遠？根不固而求木之長？德不厚而思國之治，臣雖下愚，知其不可，而況於明哲乎？人君當神器之重，居域中之大，將崇極天之峻，永保無疆之休。不念居安思危，戒奢以儉，德不處其厚，情不勝其欲，斯亦伐根以求木茂，塞源而欲流長也。",
        "凡百元首，承天景命，莫不殷憂而道著，功成而德衰。有善始者實繁，能克終者蓋寡，豈其取之易守之難乎？昔取之而有餘，今守之而不足，何也？夫在殷憂，必竭誠以待下；既得志，則縱情以傲物。竭誠則吳越為一體，傲物則骨肉為行路。雖董之以嚴刑，震之以威怒，終苟免而不懷仁，貌恭而不心服。怨不在大，可畏惟人。載舟覆舟，所宜深慎，奔車朽索，其可忽乎！",
        "君人者，誠能見可欲，則思知足以自戒；將有作，則思知止以安人；念高危，則思謙沖而自牧；懼滿溢，則思江海下百川；樂盤遊，則思三驅以為度；憂懈怠，則思慎始而敬終；慮壅蔽，則思虛心以納下；懼讒邪，則思正身以黜惡；恩所加，則思無因喜以謬賞，罰所及，則思無以怒而濫刑。總此十思，宏茲九德，簡能而任之，擇善而從之；則智者盡其謀，勇者竭其力，仁者播其惠，信者效其忠。文武爭馳，君臣無事，可以盡豫遊之樂，可以養松喬之壽，鳴琴垂拱，不言而化。何必勞神苦思，代下司職，役聰明之耳目，虧無為之大道哉？"
      ],

        "擡過卓子，太公分付道：「胡亂教師父在外面耳房中歇一宵。夜間如若外面熱鬧，不可出來窺望。」智深道：「敢問貴莊今夜有甚事？」太公道：「非是你出家人閑管的事。」智深道：「太公緣何模樣不甚喜歡？莫不怪小僧來攪擾你麽？明日灑家算還你房錢便了。」太公道：「師父聽說：我家如常齋僧布施，那爭師父一個。只是我家今夜小女招夫，以此煩惱。」魯智深呵呵大笑道：「男大須婚，女大必嫁。這是人倫大事，五常之禮。何故煩惱？」太公道：「師父不知。這頭親事，不是情願與的。」智深大笑道：「太公，你也是個癡漢。既然不兩相情願，如何招贅做個女婿？」太公道：「老漢止有這個小女，今年方得一十九歲。被此間有座山，喚做桃花山。近來山上有兩個大王紥了寨柵，聚集著五、七百人，打家劫舍。此間青州官軍捕盜，禁他不得。因來老漢莊上討進奉，見了老漢女兒，撇下二十兩金子，一匹紅錦為定禮，選著今夜好日，晚間來入贅老漢莊上，又和他爭執不得，只得與他。因此煩惱。非是爭師父一個人。」智深聽了道：「原來如此。小僧有個道理，教他回心轉意，不要娶你女兒，如何？」太公道：「他是個殺人不斬眼魔君，你如何能勾得他回心轉意？」智深道：「灑家在五臺山真長老處，學得說因緣。便是鐵石人也勸得他轉。今晚可教你女兒別處藏了，俺就你女兒房內說因緣，勸他便回心轉意。」太公道：「好卻甚好，只是不要捋虎鬚。」智深道：「灑家的不是性命？你只依著俺行，並不要說有灑家。」太公道：「卻是好也。我家有福，得遇這個活佛下降。」莊客聽得，都吃一驚。",
        "太公問智深：「再要飯吃麽？」智深道：「飯便不要吃，有酒再將些來吃。」太公道：「有，有！」隨即叫莊客取一隻熟鵝，大碗斟將酒來，叫智深盡意吃了三二十碗。那隻熟鵝也吃了。叫莊客將了包裹，先安放房裏，提了禪杖，帶了戒刀，問道：「太公，你的女兒躲過了不曾？」太公道：「老漢已把女兒寄送在鄰舍莊裏去了。」智深道：「引灑家新婦房內去。」太公引至房邊，指道：「這裏面便是。」智深道：「你們自去躲了。」太公與眾莊客自出外面，安排筵席。智深把房中一椅獨卓，都掇過了。將戒刀放在床頭，禪杖把來倚在床邊。把銷金帳子下了，脫得赤條條地，跳上床去坐了。",
        "那大王來到莊前，下了馬。只見眾小嘍囉齊聲賀道：「帽兒光光，今夜做個新郎。衣衫窄窄，今夜做個嬌客。」劉太公慌忙親捧臺盞，斟下一杯好酒，跪在地下。眾莊客都跪著。那大王把手來扶道：「你是我的丈人，如何倒跪我？」太公道：「休說這話，老漢只是大王治下管的人戶。」那大王已有七八分醉了，呵呵大笑道：「我與你家做個女婿，也不虧負了你。你的女兒匹配我也好。我的哥哥大頭領不下山來，教傳示你。」劉太公把了下馬杯，來到打麥場上，見了香花燈燭，便道：「泰山何須如此迎接？」那裏又飲了三杯。來到廳上，喚小嘍囉教把馬去繫在綠楊樹上。小嘍囉把鼓樂就廳前擂將起來。大王上廳坐下，叫道：「丈人，我的夫人在那裏？」太公道：「便是怕羞不敢出來。」大王笑道：「且將酒來，我與丈人回敬。」那大王把了一杯，便道：「我且和夫人廝見了，卻來吃酒未遲。」那劉太公一心只要那和尚勸他，便道：「老漢自引大王去。」拿了燭臺，引著大王，轉入屏風背後，直到新人房前。太公指與道：「此間便是，請大王自入去。」太公拿了燭臺，一直去了，未知凶吉如何，先辦一條走路。",
        "那大王推開房門，見裏面黑洞洞地。大王道：「你看我那丈人是個做家的人，房裏也不點碗燈，由我那夫人黑地裏坐地。明日叫小嘍囉山寨裏扛一桶好油來與他點。」魯智深坐在帳子裏都聽得，忍住笑，不做一聲。那大王摸進房中，叫道：「娘子，你如何不出來接我？你休要怕羞。我明日要你做壓寨夫人。」一頭叫娘子，一面摸來摸去。一摸摸著銷金帳子，便揭起來，探一隻手入去摸時，摸著魯智深的肚皮。被魯智深就勢劈頭巾帶角兒揪住，一按按將下床來。那大王卻待掙扎。魯智深把右手捏起拳頭，罵一聲「直娘賊」，連耳根帶脖子只一拳。那大王叫一聲：「做甚麽便打老公？」魯智深喝道：「教你認的老婆！」拖倒在床邊，拳頭腳尖一齊上，打得大王叫救人。劉太公驚得呆了。只道這早晚正說因緣，勸那大王，卻聽的裏面叫救人。太公慌忙把著燈燭，引了小嘍囉，一齊搶將入來。眾人燈下打一看時，只見一個胖大和尚，赤條條不著一絲，騎翻大王在床面前打。為頭的小嘍囉叫道：「你眾人都來救大王！」眾小嘍囉一齊拖槍拽棒，打將入來救時，魯智深見了，撇下大王，床邊綽了禪杖，著地打將出來，小嘍囉見來得兇猛，發聲喊「都走了！」劉太公只管叫苦。打鬧裏，那大王扒出房門，奔到門前，摸著空馬，樹上折枝柳條，托地跳在馬背上，把柳條便打那馬，卻跪不去。大王道：「苦也！畜生也來欺負我。」再看時，原來心慌，不曾解得韁繩。連忙扯斷了，騎著摌馬，飛走出得莊門，大罵劉太公：「老驢休慌！不怕你飛了！」把馬打上兩柳條，不喇喇地馱了大王上山去。",
        "再說魯智深正吃酒俚，莊客報道：「山上大頭領盡數都來了。」智深道：「你等休慌，灑家但打翻的，你們只顧縛了，解去官司請賞。取俺的戒刀來。」魯智深把直裰脫了，拽紥起下面衣服，跨了戒刀，大踏步提了禪杖，出到打麥場上。只見大頭領在火把叢中，一騎馬搶到莊前。馬上挺著長槍，高聲喝道：「那禿驢在那裏？早早出來決個勝負。」魯智深大怒罵：「腌臢打脊潑才，叫你認得灑家。」輪起禪杖，著地卷將來。那大頭領逼住槍，大叫道：「和尚且休要動手，你的聲音好廝熟。你且通個姓名。」魯智深道：「灑家不是別人，老种經略相公帳前提轄魯達的便是。如今出了家做和尚，喚做魯智深。」那大頭領呵呵大笑，滾鞍下馬，撇了槍，撲翻身便拜道：「哥哥別來無恙。可知二哥著了你手。」魯智深只道賺他，托地跳退數步，把禪杖收住，定睛看時，火把下認得不是別人，卻是江湖上使槍棒賣藥的教頭打虎將李忠。原來強人下拜，不說此二字，為軍中不利，只喚做剪拂。此乃吉利的字樣。李忠當下剪拂了起來。扶住魯智深道：「哥哥緣何做了和尚？」智深道：「且和你到裏面說話。」劉太公見了，又只叫苦：「這和尚原來也是一路。」",
        "眾人上山來。智深、太公到得寨前下了轎子。李忠也下了馬，邀請智深入到寨中。向這聚義廳上，三人坐定，李忠教請周通出來。周通見了和尚，心中怒道：「哥哥卻不與我報仇，倒請他來寨裏，讓他上面坐。」李忠道：「兄弟，你認得這和尚麽？」周通道：「我若認得他時，卻不吃他打了。」李忠笑道：「這和尚便是我日常和你說的三拳打死鎮關西的便是他。」周通把頭摸一摸，叫聲：「呵呀！」撲翻身便剪拂。魯智深答禮道：「休怪衝撞。」三個坐定，劉太公立在面前。魯智深便道：「周家兄弟，你來聽俺說。劉太公這頭親事，你卻不知。他只有這個女兒，養老送終，承祀香火，都在他身上。你若娶了，教他老人家失所。他心裏怕不情願。你依著灑家，把來棄了，別選一個好的。原定的金子段疋，將在這裏。你心下如何？」周通道：「並聽大哥言語，兄弟再不敢登門。」智深道：「大丈夫作事，卻休要翻悔。」周通折箭為誓。劉太公拜謝了，納還金子段疋，自下山回莊去了。"

上大頭領盡數都來了。」智深道：「你等休慌，灑家但打翻的，你們只顧縛了，解去官司請賞。取俺的戒刀來。」魯智深把直裰脫了，拽紥起下面衣服，跨了戒刀，大踏步提了禪杖，出到打麥場上。只見大頭領在火把叢中，一騎馬搶到莊前。馬上挺著長槍，高聲喝道：「那禿驢在那裏？早早出來決個勝負。」魯智深大怒罵：「腌臢打脊潑才，叫你認得灑家。」輪起禪杖，著地卷將來。那大頭領逼住槍，大叫道：「和尚且休要動手，你的聲音好廝熟。你且通個姓名。」魯智深道：「灑家不是別人，老种經略相公帳前提轄魯達的便是。如今出了家做和尚，喚做魯智深。」那大頭領呵呵大笑，滾鞍下馬，撇了槍，撲翻身便拜道：「哥哥別來無恙。可知二哥著了你手。」魯智深只道賺他，托地跳退數步，把禪杖收住，定睛看時，火把下認得不是別人，卻是江湖上使槍棒賣藥的教頭打虎將李忠。原來強人下拜，不說此二字，為軍中不利，只喚做剪拂。此乃吉利的字樣。李忠當下剪拂了起來。扶住魯智深道：「哥哥緣何做了和尚？」智深道：「且和你到裏面說話。」劉太公見了，又只叫苦：「這和尚原來也是一路。」\n眾人上山來。智深、太公到得寨前下了轎子。李忠也下了馬，邀請智深入到寨中。向這聚義廳上，三人坐定，李忠教請周通出來。周通見了和尚，心中怒道：「哥哥卻不與我報仇，倒請他來寨裏，讓他上面坐。」李忠道：「兄弟，你認得這和尚麽？」周通道：「我若認得他時，卻不吃他打了。」李忠笑道：「這和尚便是我日常和你說的三拳打死鎮關西的便是他。」周通把頭摸一摸，叫聲：「呵呀！」撲翻身便剪拂。魯智深答禮道：「休怪衝撞。」三個坐定，劉太公立在面前。魯智深便道：「周家兄弟，你來聽俺說。劉太公這頭親事，你卻不知。他只有這個女兒，養老送終，承祀香火，都在他身上。你若娶了，教他老人家失所。他心裏怕不情願。你依著灑家，把來棄了，別選一個好的。原定的金子段疋，將在這裏。你心下如何？」周通道：「並聽大哥言語，兄弟再不敢登門。」智深道：「大丈夫作事，卻休要翻悔。」周通折箭為誓。劉太公拜謝了，納還金子段疋，自下山回莊去了。",

        "且說林冲在柴大官人東莊上，聽得這話，如坐針氈。伺候柴進回莊，林冲便說道：「非是大官人不留小弟，爭奈官司追捕甚緊，排家搜捉。倘若尋到大官人莊上時，須負累大官人不好。既蒙大官人仗義疏財，求借林冲些小盤纏，投奔他處棲身。異日不死，當以犬馬之報。」柴進道：「既是兄長要行，小人有個去處。作書一封，與兄長去如何？」",
        "林冲道：「若得大官人如此賙濟，教小人安身立命。只不知投何處去？」柴進道：「是山東濟州管下一個水鄉，地名梁山泊，方圓八百餘里。中間是宛子城、蓼兒窪。如今有三個好漢在那裡紥寨。為頭的喚做白衣秀士王倫，第二個喚做摸着天杜遷，第三個喚做雲裡金剛宋萬。那三個好漢，聚集着七八百小嘍囉，打家劫舍，多有做下迷天大罪的人，都投奔那裡躲災避難。他都收留在彼。三位好漢，亦與我交厚。常寄書緘來。我今修一封書與兄長，去投那裡入夥如何？」林冲道：「若得如此顧盻，最好。深謝主盟。」柴進道：「只是滄州道口，見今官司張掛榜文，又差兩個軍官，在那裡搜檢，把住道口。兄長必用從那裡經過。」柴進低頭一想道：「再有個計策，送兄長過去。」林冲道：「若蒙周全，死而不忘。」柴進當日，先叫莊客背了包裹出關去等。柴進卻備了三二十疋馬，帶了弓箭旗槍，駕了鷹鵰，牽着獵狗，一行人馬都打扮了，卻把林冲雜在裡面，一齊上馬，都投關外。",
        "卻說把關軍官坐在關上，看見是柴大官人，卻都認得。原來這軍官未襲職時，曾到柴進莊上，因此識熟。軍官起身道：「大官人又去快活？」柴進下馬問道：「二位官人緣何在此？」軍官道：「滄州大尹行移文書，畫影圖形，捉拿犯人林冲。特差某等在此守把。但有過往客商，一一盤問，才放出關。」柴進笑道：「我這一夥人內，中間夾帶着林冲，你緣何不認得？」軍官也笑道：「大官人是識法度的，不到得肯挾帶了出去？請尊便上馬。」柴進又笑道：「只恁地相托得過。拿得野味回來相送。」作別了，一齊上馬出關去了。行得十四五里，卻見先去的莊客在那裡等候。柴進叫林冲下了馬，脫去打獵的衣服，卻穿上莊客帶來的自己衣裳，繫了腰刀，戴上紅纓氈笠，背上包裹，提了袞刀，相辭柴進，拜別了便行。",
        "林冲與柴大官人別後，上路行了十數日。時遇暮冬天氣，彤雲密布，朔風緊起，又早紛紛揚揚下着滿天大雪。行不到二十餘里，只見滿地如銀。但見：",
        "林冲踏着雪只顧走。看看天色冷得緊切，漸漸晚了。遠遠望見枕溪靠湖一個酒店，被雪漫漫地壓着。但見：",
        "林冲叫酒保只顧篩酒。林冲說道：「酒保，你也來吃碗酒。」酒保吃了一碗。林冲問道：「此間去梁山泊還有多少路？」酒保答道：「此間要去梁山泊，雖只數里，卻是水路，全無旱路。若要去時，須用船去，方才渡得到那裡。」林冲道：「你可與我覓隻船兒？」酒保道：「這般大雪，天色又晚了，那裡去尋船隻。」林冲道：「我與你些錢，央你覓隻船來渡我過去。」酒保道：「卻是沒討處。」林冲尋思道：「這般怎的好？」又吃了幾碗酒，悶上心來。驀然間想起：「以先在京師做教頭，禁軍中每日六街三市，遊玩吃酒，誰想今日被高俅這賊坑陷了我這一場，文了面，直斷送到這裡。閃得我有家難奔，有國難投，受此寂寞！」因感傷懷抱，問酒保借筆硯來，乘着一時酒興，向那白粉壁上，寫下八句五言詩，寫道：",
        "林冲題罷詩，撇下筆，再取酒來。正飲之間，只見那漢子，走向前來，把林冲匹腰揪住，說道：「你好大膽！你在滄州做下迷天大罪，卻在這裡！見今官司出三千貫信賞錢捉你，卻是要怎的？」林冲道：「你道我是誰？」那漢道：「你不是林冲？」林冲道：「我自姓張。」那漢笑道：「你莫胡說！見今壁上寫下名字，你臉上文着金印，如何要賴得過？」林冲道：「你真箇要拿我？」那漢笑道：「我卻拿你做甚麼？你跟我進來，到裡面和你說話。」那漢放了手。林冲跟着，到後面一個水亭上，叫酒保點起燈來，和林冲施禮，對面坐下。那漢問道：「卻才見兄長只顧問梁山泊路頭，要尋舡去，那裡是強人山寨，你待要去做甚麼？」林冲道：「實不相瞞，如今官司追捕小人緊急，無安身處，特投這山寨裡好漢入夥。因此要去。」那漢道：「雖然如此，必有個人薦兄長來入夥。」林冲道：「滄州橫海郡故友舉薦將來。」那漢道：「莫非柴進麼？」林冲道：「足下何以知之？」那漢道：「柴大官人與山寨中大王頭領交厚，常有書信往來。」原來是王倫當初不得地之時，與杜遷投奔柴進，多得柴進留在莊子上住了幾時。臨起身，又賫發盤纏銀兩。因此有恩。林冲聽了，便拜道：「有眼不識太山。願求大名。」那漢慌忙答禮，說道：「小人是王頭領手下耳目。小人姓朱名貴，原是沂州沂水縣人氏。山寨裡教小弟在此間開酒店為名，專一探聽往來客商經過。但有財帛者，便去山寨裡報知。但是孤單客人到此，無財帛的，放他過去。有財帛的來到這裡，輕則蒙汗藥麻翻，重則登時結果，將精肉片為羓子，肥肉煎油點燈。卻才見兄長只顧問梁山泊路頭，因此不敢下手。次後見寫出大名來。曾有東京來的人，傳說兄長的豪傑，不期今日得會。既有柴大官人書緘相薦，亦是兄長名震寰海，王頭領必當重用。」隨即叫酒保安排分例酒來相待。林冲道：「何故重賜分例酒食，拜擾不當。」朱貴道：「山寨中留下分例酒食，但有好漢經過，必教小弟相待。既是兄長來此入夥，怎敢有失祇應。」隨即安排魚肉盤饌酒餚，到來相待。兩個在水亭上吃了半夜酒。林冲道：「如何能勾船來渡過去？」朱貴道：「這裡自有船隻，兄長放心。且暫宿一宵，五更卻請起來同往。」",

      "title": "馮諼客孟嘗君",

      "url": "https://zh.wikisource.org/zh-hant/馮諼客孟嘗君",
      "fullText": [
        "齊人有馮諼者，貧乏不能自存，使人屬孟嘗君，願寄食門下。孟嘗君曰：「客何好？」曰：「客無好也！」曰：「客何能？」曰：「客無能也！」孟嘗君笑而受之，曰：「諾！」左右以君賤之也，食以草具。居有頃，倚柱彈其劍，歌曰：「長鋏歸來乎！食無魚！」左右以告。孟嘗君曰：「食之，比門下之客。」居有頃，復彈其鋏，歌曰：「長鋏歸來乎！出無車！」左右皆笑之，以告。孟嘗君曰：「為之駕，比門下之車客。」於是，乘其車，揭其劍，過其友，曰：「孟嘗君客我！」後有頃，復彈其劍鋏，歌曰：「長鋏歸來乎！無以為家！」左右皆惡之，以為貪而不知足。孟嘗君問：「馮公有親乎？」對曰：「有老母。」孟嘗君使人給其食用，無使乏。於是馮諼不復歌。",
        "後，孟嘗君出記，問門下諸客：「誰習會計，能為文收責於薛者乎？」馮諼署曰：「能！」孟嘗君怪之曰：「此誰也？」左右曰：「乃歌夫長鋏歸來者也。」孟嘗君笑曰：「客果有能也。吾負之，未嘗見也。」請而見之，謝曰：「文倦於事，憒於憂，而性懧愚，沈於國家之事，開罪於先生。先生不羞，乃有意欲為收責於薛乎？」馮諼曰：「願之！」",
        "於是，約車治裝，載券契而行。辭曰：「責收畢，以何市而反？」孟嘗君曰：「視吾家所寡有者。」驅而之薛。使吏召諸民當償者，悉來合券。券徧合赴，矯命以責賜諸民，因燒其券，民稱萬歲。長驅到齊，晨而求見。孟嘗君怪其疾也，衣冠而見之，曰：「責畢收乎？來何疾也？」曰：「收畢矣！」「以何市而反？」馮諼曰：「君雲『視吾家所寡有者。』臣竊計君，宮中積珍寶，狗馬實外廄，美人充下陳。君家所寡有者，以義耳。竊以為君市義。」孟嘗君曰：「市義奈何？」曰：「今君有區區之薛，不拊愛子其民，因而賈利之。臣竊矯君命，以責賜諸民，因燒其券，民稱萬歲，乃臣所以為君市義也。」孟嘗君不說，曰：「諾！先生休矣。」",
        "後朞年，齊王謂孟嘗君曰：「寡人不敢以先王之臣為臣。」孟嘗君就國於薛，未至百里，民扶老攜幼，迎君道中，終日。孟嘗君顧謂馮諼：「先生所為文市義者，乃今日見之！」",
        "馮諼曰：「狡兔有三窟，僅得免其死耳。今有一窟，未得高枕而臥也。請為君復鑿二窟！」孟嘗君予車五十乘，金五百斤，西遊於梁。謂梁王曰：「齊放其大臣孟嘗君於諸侯，先迎之者，富而兵強。」於是梁王虛上位，以故相為上將軍。遣使者黃金千斤，車百乘，往聘孟嘗君。馮諼先驅，誡孟嘗君曰：「千金重幣也，百乘顯使也，齊其聞之矣！」梁使三反，孟嘗君固辭不往也。齊王聞之，君臣恐懼。遣太傅齎黃金千斤，文車二駟，服劍一，封書謝孟嘗君曰：「寡人不祥，被於宗廟之祟，沈於諂諛之臣，開罪於君，寡人不足為也！願君顧先王之宗廟，姑反國統萬人乎？」馮諼誡孟嘗君曰：「願請先王之祭器，立宗廟薛。」廟成，還報孟嘗君曰：「三窟已就，君姑高枕為樂矣！」",
        "孟嘗君為相數十年，無纖介之禍者，馮諼之計也。"
      ],

        "庖丁為文惠君解牛，手之所觸，肩之所倚，足之所履，膝之所踦，砉然嚮然，奏刀騞然，莫不中音：合於《桑林》之舞，乃中《經首》之會。",
        "文惠君曰：「譆，善哉！技蓋至此乎？」",
        "庖丁釋刀對曰：「臣之所好者道也，進乎技矣。始臣之解牛之時，所見無非全牛者；三年之後，未嘗見全牛也。方今之時，臣以神遇而不以目視，官知止而神欲行。依乎天理，批大郤，導大窾，因其固然；技經肯綮之未嘗，而況大軱乎！良庖歲更刀，割也；族庖月更刀，折也。今臣之刀十九年矣，所解數千牛矣，而刀刃若新發於硎。彼節者有閒，而刀刃者無厚；以無厚入有間，恢恢乎其於遊刃必有餘地矣。是以十九年而刀刃若新發於硎。雖然，每至於族，吾見其難為，怵然為戒，視為止，行為遲。動刀甚微，謋然已解，如土委地。提刀而立，為之四顧，為之躊躇滿志，善刀而藏之。」",
        "文惠君曰：「善哉！吾聞庖丁之言，得養生焉。」"
      ],

    "S_al16_dianlun": {
      "id": "S_al16_dianlun",
      "title": "典論論文",
      "author": "曹丕",
      "period": "三國魏",
      "url": "https://zh.wikisource.org/zh-hant/%E5%85%B8%E8%AB%96/%E8%AB%96%E6%96%87",
      "fullText": [
        "文人相輕，自古而然。傅毅之於班固，伯仲之間耳，而固小之，與弟超書曰「武仲以能屬文為蘭臺令史，下筆不能自休。」夫人善於自見，而文非一體，鮮能備善。是以各以所長，相輕所短。里語曰：「家有敝帚，享之千金。」斯不自見之患也。今之文人，魯國孔融文舉，廣陵陳琳孔璋，山陽王粲仲宣，北海徐幹偉長，陳留阮瑀元瑜，汝南應瑒德璉，東平劉楨公幹：斯七子者，於學無所遺，於辭無所假，咸以自騁驥騄於千里，仰齊足而並馳。以此相服，亦良難矣。蓋君子審己以度人，故能免於斯累，而作論文。",
        "王粲長於辭賦，徐幹時有齊氣，然粲之匹也。如粲之初征、登樓、槐賦、征思，幹之玄猿、漏卮、圓扇、橘賦，雖張、蔡不過也。然於他文，未能稱是。琳、瑀之章表書記，今之雋也。應瑒和而不壯；劉楨壯而不密。孔融體氣高妙，有過人者；然不能持論，理不勝辭；以至乎雜以嘲戲。及其所善，揚、班儔也。",
        "常人貴遠賤近，向聲背實，又患闇於自見，謂己為賢。夫文本同而末異。蓋奏議宜雅，書論宜理，銘誄尚實，詩賦欲麗。此四科不同，故能之者偏也；唯通才能備其體。",
        "文以氣為主；氣之清濁有體，不可力強而致。譬諸音樂，曲度雖均，節奏同檢；至於引氣不齊，巧拙有素，雖在父兄，不能以移子弟。",
        "蓋文章經國之大業，不朽之盛事。年壽有時而盡，榮樂止乎其身。二者必至之常期，未若文章之無窮。是以古之作者，寄身於翰墨，見意於篇籍，不假良史之辭，不託飛馳之勢，而聲名自傳於後。故西伯幽而演易，周旦顯而制禮；不以隱約而弗務，不以康樂而加思。夫然，則古人賤尺璧而重寸陰，懼乎時之過已。而人多不強力，貧賤則懾於飢寒，富貴則流於逸樂，遂營目前之務，而遺千載之功。日月逝於上，體貌衰於下，忽然與萬物遷化，斯志士之大痛也！融等已逝，唯幹著論，成一家言。"
      ],
      "focus": "辨析文人相輕、文體四科、文氣與文章價值的不同論述層次。",
      "reuse": false,
      "readerKind": "full",
      "editionNote": "標點與常用字形依教學統一；異文請與任課版本對讀。",

    "S_al17_shisi": {
      "id": "S_al17_shisi",
      "title": "諫太宗十思疏",
      "author": "魏徵",
      "period": "唐代",
      "url": "https://zh.wikisource.org/zh-hant/%E8%AB%AB%E5%A4%AA%E5%AE%97%E5%8D%81%E6%80%9D%E7%96%8F",
      "fullText": [
        "臣聞求木之長者，必固其根本；欲流之遠者，必浚其泉源；思國之安者，必積其德義。源不深而望流之遠？根不固而求木之長？德不厚而思國之治，臣雖下愚，知其不可，而況於明哲乎？人君當神器之重，居域中之大，將崇極天之峻，永保無疆之休。不念居安思危，戒奢以儉，德不處其厚，情不勝其欲，斯亦伐根以求木茂，塞源而欲流長也。",
        "凡百元首，承天景命，莫不殷憂而道著，功成而德衰。有善始者實繁，能克終者蓋寡，豈其取之易守之難乎？昔取之而有餘，今守之而不足，何也？夫在殷憂，必竭誠以待下；既得志，則縱情以傲物。竭誠則吳越為一體，傲物則骨肉為行路。雖董之以嚴刑，震之以威怒，終苟免而不懷仁，貌恭而不心服。怨不在大，可畏惟人。載舟覆舟，所宜深慎，奔車朽索，其可忽乎！",
        "君人者，誠能見可欲，則思知足以自戒；將有作，則思知止以安人；念高危，則思謙沖而自牧；懼滿溢，則思江海下百川；樂盤遊，則思三驅以為度；憂懈怠，則思慎始而敬終；慮壅蔽，則思虛心以納下；懼讒邪，則思正身以黜惡；恩所加，則思無因喜以謬賞，罰所及，則思無以怒而濫刑。總此十思，宏茲九德，簡能而任之，擇善而從之；則智者盡其謀，勇者竭其力，仁者播其惠，信者效其忠。文武爭馳，君臣無事，可以盡豫遊之樂，可以養松喬之壽，鳴琴垂拱，不言而化。何必勞神苦思，代下司職，役聰明之耳目，虧無為之大道哉？"
      ],
      "focus": "由根源譬喻、創守對比走到十思與任人，掌握疏體說理的層次。",
      "reuse": false,
      "readerKind": "full",
      "editionNote": "標點與常用字形依教學統一；異文請與任課版本對讀。",
      "readerLabel": "原文"
    },
    "S_al13_yueyang": {
      "id": "S_al13_yueyang",
      "title": "岳陽樓記",
      "author": "范仲淹",
      "period": "北宋",
      "url": "https://zh.wikisource.org/zh-hant/%E5%B2%B3%E9%99%BD%E6%A8%93%E8%A8%98",
      "fullText": [
        "慶曆四年春，滕子京謫守巴陵郡。越明年，政通人和，百廢具興，乃重修岳陽樓，增其舊制，刻唐賢今人詩賦於其上；屬予作文以記之。",
        "予觀夫巴陵勝狀，在洞庭一湖。銜遠山，吞長江，浩浩湯湯，橫無際涯；朝暉夕陰，氣象萬千；此則岳陽樓之大觀也，前人之述備矣。然則北通巫峽，南極瀟湘，遷客騷人，多會於此，覽物之情，得無異乎？",
        "若夫霪雨霏霏，連月不開；陰風怒號，濁浪排空；日星隱曜，山嶽潛形；商旅不行，檣傾楫摧；薄暮冥冥，虎嘯猿啼。登斯樓也，則有去國懷鄉，憂讒畏譏，滿目蕭然，感極而悲者矣。",
        "至若春和景明，波瀾不驚，上下天光，一碧萬頃；沙鷗翔集，錦鱗游泳，岸芷汀蘭，郁郁青青。而或長煙一空，皓月千里，浮光躍金，靜影沉璧，漁歌互答，此樂何極。登斯樓也，則有心曠神怡，寵辱偕忘，把酒臨風，其喜洋洋者矣。",
        "嗟夫！予嘗求古仁人之心，或異二者之為，何哉？不以物喜，不以己悲。居廟堂之高，則憂其民；處江湖之遠，則憂其君。是進亦憂，退亦憂；然則何時而樂耶？其必曰「先天下之憂而憂，後天下之樂而樂」歟！噫！微斯人，吾誰與歸？",
        "時六年九月十五日。"
      ],
      "focus": "由寫景、遷客悲喜到古仁人之心，辨認層層轉進的論述。",

      "editionNote": "標點與常用字形依教學統一；異文請與任課版本對讀。",
      "readerLabel": "原文"
    },
    "S_al14_zuiweng": {
      "id": "S_al14_zuiweng",
      "title": "醉翁亭記",
      "author": "歐陽脩",
      "period": "北宋",
      "url": "https://zh.wikisource.org/zh-hant/%E9%86%89%E7%BF%81%E4%BA%AD%E8%A8%98",
      "fullText": [
        "環滁皆山也。其西南諸峰，林壑尤美，望之蔚然而深秀者，琅琊也。山行六七里，漸聞水聲潺潺，而瀉出於兩峰之間者，釀泉也。峰迴路轉，有亭翼然臨於泉上者，醉翁亭也。作亭者誰？山之僧智仙也。名之者誰？太守自謂也。太守與客來飲於此，飲少輒醉，而年又最高，故自號曰醉翁也。醉翁之意不在酒，在乎山水之間也。山水之樂，得之心而寓之酒也。",
        "若夫日出而林霏開，雲歸而巖穴暝，晦明變化者，山間之朝暮也。野芳發而幽香，佳木秀而繁陰，風霜高潔，水落而石出者，山間之四時也。朝而往，暮而歸，四時之景不同，而樂亦無窮也。",
        "至於負者歌於途，行者休於樹，前者呼，後者應，傴僂提攜，往來而不絕者，滁人遊也。臨谿而漁，谿深而魚肥；釀泉為酒，泉香而酒洌；山肴野蔌，雜然而前陳者，太守宴也。宴酣之樂，非絲非竹，射者中，弈者勝，觥籌交錯，起坐而諠譁者，眾賓懽也；蒼顏白髮，頹然乎其間者，太守醉也。",
        "已而夕陽在山，人影散亂，太守歸而賓客從也。樹林陰翳，鳴聲上下，遊人去而禽鳥樂也。然而禽鳥知山林之樂，而不知人之樂；人知從太守遊而樂，而不知太守之樂其樂也。醉能同其樂，醒能述以文者，太守也。太守謂誰？廬陵歐陽脩也。"
      ],

    "S_al15_zuo": {
      "id": "S_al15_zuo",
      "title": "左忠毅公逸事",
      "author": "方苞",
      "period": "清代",
      "url": "https://zh.wikisource.org/zh-hant/%E6%9C%9B%E6%BA%AA%E9%9B%86%20(%E5%9B%9B%E5%BA%AB%E5%85%A8%E6%9B%B8%E6%9C%AC)/%E5%85%A8%E8%A6%BD",
      "fullText": [
        "先君子嘗言，鄉先輩左忠毅公視學京畿。一日，風雪嚴寒，從數騎出，微行入古寺。廡下一生伏案臥，文方成草。公閱畢，即解貂覆生，為掩戶。叩之寺僧，則史公可法也。及試，吏呼名至史公，公瞿然注視，呈卷，即面署第一。召入，使拜夫人，曰：「吾諸兒碌碌，他日繼吾志事，惟此生耳。」",
        "及左公下廠獄，史朝夕獄門外。逆閹防伺甚嚴，雖家僕不得近。久之，聞左公被炮烙，旦夕且死，持五十金，涕泣謀於禁卒，卒感焉。一日，使史更敝衣草屨，背筐，手長鑱，為除不潔者，引入，微指左公處。則席地倚牆而坐，面額焦爛不可辨，左膝以下筋骨盡脫矣。史前跪，抱公膝而嗚咽。公辨其聲，而目不可開，乃奮臂以指撥眥，目光如炬，怒曰：「庸奴！此何地也，而汝來前！國家之事，糜爛至此；老夫已矣，汝復輕身而昧大義，天下事誰可支拄者？不速去，無俟奸人構陷，吾今即撲殺汝！」因摸地上刑械作投擊勢。史噤不敢發聲，趨而出。後常流涕述其事以語人，曰：「吾師肺肝，皆鐵石所鑄造也。」",
        "崇禎末，流賊張獻忠出沒蘄、黃、潛、桐間，史公以鳳廬道奉檄守御。每有警，輒數月不就寢，使將士更休，而自坐幄幕外。擇健卒十人，令二人蹲踞而背倚之，漏鼓移則番代。每寒夜起立，振衣裳，甲上冰霜迸落，鏗然有聲。或勸以少休，公曰：「吾上恐負朝廷，下恐愧吾師也。」",
        "史公治兵，往來桐城，必躬造左公第，候太公、太母起居，拜夫人於堂上。余宗老塗山，左公甥也，與先君子善，謂獄中語，乃親得之於史公云。"
      ],
      "focus": "以逸事見人物精神，辨認左光斗與史可法的師生關係及敘事來源。",

      "readerLabel": "原文"
    },
    "S_al19_taohua": {

      "fullText": [
        "擡過卓子，太公分付道：「胡亂教師父在外面耳房中歇一宵。夜間如若外面熱鬧，不可出來窺望。」智深道：「敢問貴莊今夜有甚事？」太公道：「非是你出家人閑管的事。」智深道：「太公緣何模樣不甚喜歡？莫不怪小僧來攪擾你麽？明日灑家算還你房錢便了。」太公道：「師父聽說：我家如常齋僧布施，那爭師父一個。只是我家今夜小女招夫，以此煩惱。」魯智深呵呵大笑道：「男大須婚，女大必嫁。這是人倫大事，五常之禮。何故煩惱？」太公道：「師父不知。這頭親事，不是情願與的。」智深大笑道：「太公，你也是個癡漢。既然不兩相情願，如何招贅做個女婿？」太公道：「老漢止有這個小女，今年方得一十九歲。被此間有座山，喚做桃花山。近來山上有兩個大王紥了寨柵，聚集著五、七百人，打家劫舍。此間青州官軍捕盜，禁他不得。因來老漢莊上討進奉，見了老漢女兒，撇下二十兩金子，一匹紅錦為定禮，選著今夜好日，晚間來入贅老漢莊上，又和他爭執不得，只得與他。因此煩惱。非是爭師父一個人。」智深聽了道：「原來如此。小僧有個道理，教他回心轉意，不要娶你女兒，如何？」太公道：「他是個殺人不斬眼魔君，你如何能勾得他回心轉意？」智深道：「灑家在五臺山真長老處，學得說因緣。便是鐵石人也勸得他轉。今晚可教你女兒別處藏了，俺就你女兒房內說因緣，勸他便回心轉意。」太公道：「好卻甚好，只是不要捋虎鬚。」智深道：「灑家的不是性命？你只依著俺行，並不要說有灑家。」太公道：「卻是好也。我家有福，得遇這個活佛下降。」莊客聽得，都吃一驚。",
        "太公問智深：「再要飯吃麽？」智深道：「飯便不要吃，有酒再將些來吃。」太公道：「有，有！」隨即叫莊客取一隻熟鵝，大碗斟將酒來，叫智深盡意吃了三二十碗。那隻熟鵝也吃了。叫莊客將了包裹，先安放房裏，提了禪杖，帶了戒刀，問道：「太公，你的女兒躲過了不曾？」太公道：「老漢已把女兒寄送在鄰舍莊裏去了。」智深道：「引灑家新婦房內去。」太公引至房邊，指道：「這裏面便是。」智深道：「你們自去躲了。」太公與眾莊客自出外面，安排筵席。智深把房中一椅獨卓，都掇過了。將戒刀放在床頭，禪杖把來倚在床邊。把銷金帳子下了，脫得赤條條地，跳上床去坐了。",
        "那大王來到莊前，下了馬。只見眾小嘍囉齊聲賀道：「帽兒光光，今夜做個新郎。衣衫窄窄，今夜做個嬌客。」劉太公慌忙親捧臺盞，斟下一杯好酒，跪在地下。眾莊客都跪著。那大王把手來扶道：「你是我的丈人，如何倒跪我？」太公道：「休說這話，老漢只是大王治下管的人戶。」那大王已有七八分醉了，呵呵大笑道：「我與你家做個女婿，也不虧負了你。你的女兒匹配我也好。我的哥哥大頭領不下山來，教傳示你。」劉太公把了下馬杯，來到打麥場上，見了香花燈燭，便道：「泰山何須如此迎接？」那裏又飲了三杯。來到廳上，喚小嘍囉教把馬去繫在綠楊樹上。小嘍囉把鼓樂就廳前擂將起來。大王上廳坐下，叫道：「丈人，我的夫人在那裏？」太公道：「便是怕羞不敢出來。」大王笑道：「且將酒來，我與丈人回敬。」那大王把了一杯，便道：「我且和夫人廝見了，卻來吃酒未遲。」那劉太公一心只要那和尚勸他，便道：「老漢自引大王去。」拿了燭臺，引著大王，轉入屏風背後，直到新人房前。太公指與道：「此間便是，請大王自入去。」太公拿了燭臺，一直去了，未知凶吉如何，先辦一條走路。",
        "那大王推開房門，見裏面黑洞洞地。大王道：「你看我那丈人是個做家的人，房裏也不點碗燈，由我那夫人黑地裏坐地。明日叫小嘍囉山寨裏扛一桶好油來與他點。」魯智深坐在帳子裏都聽得，忍住笑，不做一聲。那大王摸進房中，叫道：「娘子，你如何不出來接我？你休要怕羞。我明日要你做壓寨夫人。」一頭叫娘子，一面摸來摸去。一摸摸著銷金帳子，便揭起來，探一隻手入去摸時，摸著魯智深的肚皮。被魯智深就勢劈頭巾帶角兒揪住，一按按將下床來。那大王卻待掙扎。魯智深把右手捏起拳頭，罵一聲「直娘賊」，連耳根帶脖子只一拳。那大王叫一聲：「做甚麽便打老公？」魯智深喝道：「教你認的老婆！」拖倒在床邊，拳頭腳尖一齊上，打得大王叫救人。劉太公驚得呆了。只道這早晚正說因緣，勸那大王，卻聽的裏面叫救人。太公慌忙把著燈燭，引了小嘍囉，一齊搶將入來。眾人燈下打一看時，只見一個胖大和尚，赤條條不著一絲，騎翻大王在床面前打。為頭的小嘍囉叫道：「你眾人都來救大王！」眾小嘍囉一齊拖槍拽棒，打將入來救時，魯智深見了，撇下大王，床邊綽了禪杖，著地打將出來，小嘍囉見來得兇猛，發聲喊「都走了！」劉太公只管叫苦。打鬧裏，那大王扒出房門，奔到門前，摸著空馬，樹上折枝柳條，托地跳在馬背上，把柳條便打那馬，卻跪不去。大王道：「苦也！畜生也來欺負我。」再看時，原來心慌，不曾解得韁繩。連忙扯斷了，騎著摌馬，飛走出得莊門，大罵劉太公：「老驢休慌！不怕你飛了！」把馬打上兩柳條，不喇喇地馱了大王上山去。",
        "再說魯智深正吃酒俚，莊客報道：「山上大頭領盡數都來了。」智深道：「你等休慌，灑家但打翻的，你們只顧縛了，解去官司請賞。取俺的戒刀來。」魯智深把直裰脫了，拽紥起下面衣服，跨了戒刀，大踏步提了禪杖，出到打麥場上。只見大頭領在火把叢中，一騎馬搶到莊前。馬上挺著長槍，高聲喝道：「那禿驢在那裏？早早出來決個勝負。」魯智深大怒罵：「腌臢打脊潑才，叫你認得灑家。」輪起禪杖，著地卷將來。那大頭領逼住槍，大叫道：「和尚且休要動手，你的聲音好廝熟。你且通個姓名。」魯智深道：「灑家不是別人，老种經略相公帳前提轄魯達的便是。如今出了家做和尚，喚做魯智深。」那大頭領呵呵大笑，滾鞍下馬，撇了槍，撲翻身便拜道：「哥哥別來無恙。可知二哥著了你手。」魯智深只道賺他，托地跳退數步，把禪杖收住，定睛看時，火把下認得不是別人，卻是江湖上使槍棒賣藥的教頭打虎將李忠。原來強人下拜，不說此二字，為軍中不利，只喚做剪拂。此乃吉利的字樣。李忠當下剪拂了起來。扶住魯智深道：「哥哥緣何做了和尚？」智深道：「且和你到裏面說話。」劉太公見了，又只叫苦：「這和尚原來也是一路。」",
        "眾人上山來。智深、太公到得寨前下了轎子。李忠也下了馬，邀請智深入到寨中。向這聚義廳上，三人坐定，李忠教請周通出來。周通見了和尚，心中怒道：「哥哥卻不與我報仇，倒請他來寨裏，讓他上面坐。」李忠道：「兄弟，你認得這和尚麽？」周通道：「我若認得他時，卻不吃他打了。」李忠笑道：「這和尚便是我日常和你說的三拳打死鎮關西的便是他。」周通把頭摸一摸，叫聲：「呵呀！」撲翻身便剪拂。魯智深答禮道：「休怪衝撞。」三個坐定，劉太公立在面前。魯智深便道：「周家兄弟，你來聽俺說。劉太公這頭親事，你卻不知。他只有這個女兒，養老送終，承祀香火，都在他身上。你若娶了，教他老人家失所。他心裏怕不情願。你依著灑家，把來棄了，別選一個好的。原定的金子段疋，將在這裏。你心下如何？」周通道：「並聽大哥言語，兄弟再不敢登門。」智深道：「大丈夫作事，卻休要翻悔。」周通折箭為誓。劉太公拜謝了，納還金子段疋，自下山回莊去了。"
      ],
      "focus": "由問答、反差、動作與喜劇節奏，辨認魯智深的俠義及敘事對強婚的處理。",

    "S_al20_linchong": {
      "id": "S_al20_linchong",
      "title": "林沖夜奔",
      "author": "施耐庵（傳）",
      "period": "明代章回小說",
      "url": "https://zh.wikisource.org/zh-hant/%E6%B0%B4%E6%BB%B8%E5%82%B3%20(100%E5%9B%9E%E6%9C%AC)/%E7%AC%AC011%E5%9B%9E",
      "fullText": [
        "林冲看時，不是別人，卻是柴進。連忙叫道：「大官人救我。」柴進道：「教頭為何到此，被村夫恥辱？」林冲道：「一言難盡。」兩個且到裡面坐下，把這火燒草料場一事，備細告訴。柴進聽罷，道：「兄長如此命蹇！今日天假其便，但請放心。這裡是小弟的東莊，且住幾時，卻再商議。」叫莊客取一籠衣裳出來，叫林冲撤裡至外都換了。請去暖閣裡坐地。安排酒食杯盤管待。自此林冲只在柴進東莊上，住了五七日，滄州牢城營裡管營，首告林冲殺死差撥、陸虞候、富安等三人，放火沿燒大軍草料場。州尹大驚，隨即押了公文帖，仰緝捕人員，將帶做公的，沿鄉歷邑，道店村坊，畫影圖形，出三千貫信賞錢，捉拿正犯林冲。看看挨捕甚緊，各處村坊講動了。",
        "且說林冲在柴大官人東莊上，聽得這話，如坐針氈。伺候柴進回莊，林冲便說道：「非是大官人不留小弟，爭奈官司追捕甚緊，排家搜捉。倘若尋到大官人莊上時，須負累大官人不好。既蒙大官人仗義疏財，求借林冲些小盤纏，投奔他處棲身。異日不死，當以犬馬之報。」柴進道：「既是兄長要行，小人有個去處。作書一封，與兄長去如何？」",
        "林冲道：「若得大官人如此賙濟，教小人安身立命。只不知投何處去？」柴進道：「是山東濟州管下一個水鄉，地名梁山泊，方圓八百餘里。中間是宛子城、蓼兒窪。如今有三個好漢在那裡紥寨。為頭的喚做白衣秀士王倫，第二個喚做摸着天杜遷，第三個喚做雲裡金剛宋萬。那三個好漢，聚集着七八百小嘍囉，打家劫舍，多有做下迷天大罪的人，都投奔那裡躲災避難。他都收留在彼。三位好漢，亦與我交厚。常寄書緘來。我今修一封書與兄長，去投那裡入夥如何？」林冲道：「若得如此顧盻，最好。深謝主盟。」柴進道：「只是滄州道口，見今官司張掛榜文，又差兩個軍官，在那裡搜檢，把住道口。兄長必用從那裡經過。」柴進低頭一想道：「再有個計策，送兄長過去。」林冲道：「若蒙周全，死而不忘。」柴進當日，先叫莊客背了包裹出關去等。柴進卻備了三二十疋馬，帶了弓箭旗槍，駕了鷹鵰，牽着獵狗，一行人馬都打扮了，卻把林冲雜在裡面，一齊上馬，都投關外。",
        "卻說把關軍官坐在關上，看見是柴大官人，卻都認得。原來這軍官未襲職時，曾到柴進莊上，因此識熟。軍官起身道：「大官人又去快活？」柴進下馬問道：「二位官人緣何在此？」軍官道：「滄州大尹行移文書，畫影圖形，捉拿犯人林冲。特差某等在此守把。但有過往客商，一一盤問，才放出關。」柴進笑道：「我這一夥人內，中間夾帶着林冲，你緣何不認得？」軍官也笑道：「大官人是識法度的，不到得肯挾帶了出去？請尊便上馬。」柴進又笑道：「只恁地相托得過。拿得野味回來相送。」作別了，一齊上馬出關去了。行得十四五里，卻見先去的莊客在那裡等候。柴進叫林冲下了馬，脫去打獵的衣服，卻穿上莊客帶來的自己衣裳，繫了腰刀，戴上紅纓氈笠，背上包裹，提了袞刀，相辭柴進，拜別了便行。",
        "林冲與柴大官人別後，上路行了十數日。時遇暮冬天氣，彤雲密布，朔風緊起，又早紛紛揚揚下着滿天大雪。行不到二十餘里，只見滿地如銀。但見：",
        "林冲踏着雪只顧走。看看天色冷得緊切，漸漸晚了。遠遠望見枕溪靠湖一個酒店，被雪漫漫地壓着。但見：",
        "林冲叫酒保只顧篩酒。林冲說道：「酒保，你也來吃碗酒。」酒保吃了一碗。林冲問道：「此間去梁山泊還有多少路？」酒保答道：「此間要去梁山泊，雖只數里，卻是水路，全無旱路。若要去時，須用船去，方才渡得到那裡。」林冲道：「你可與我覓隻船兒？」酒保道：「這般大雪，天色又晚了，那裡去尋船隻。」林冲道：「我與你些錢，央你覓隻船來渡我過去。」酒保道：「卻是沒討處。」林冲尋思道：「這般怎的好？」又吃了幾碗酒，悶上心來。驀然間想起：「以先在京師做教頭，禁軍中每日六街三市，遊玩吃酒，誰想今日被高俅這賊坑陷了我這一場，文了面，直斷送到這裡。閃得我有家難奔，有國難投，受此寂寞！」因感傷懷抱，問酒保借筆硯來，乘着一時酒興，向那白粉壁上，寫下八句五言詩，寫道：",
        "林冲題罷詩，撇下筆，再取酒來。正飲之間，只見那漢子，走向前來，把林冲匹腰揪住，說道：「你好大膽！你在滄州做下迷天大罪，卻在這裡！見今官司出三千貫信賞錢捉你，卻是要怎的？」林冲道：「你道我是誰？」那漢道：「你不是林冲？」林冲道：「我自姓張。」那漢笑道：「你莫胡說！見今壁上寫下名字，你臉上文着金印，如何要賴得過？」林冲道：「你真箇要拿我？」那漢笑道：「我卻拿你做甚麼？你跟我進來，到裡面和你說話。」那漢放了手。林冲跟着，到後面一個水亭上，叫酒保點起燈來，和林冲施禮，對面坐下。那漢問道：「卻才見兄長只顧問梁山泊路頭，要尋舡去，那裡是強人山寨，你待要去做甚麼？」林冲道：「實不相瞞，如今官司追捕小人緊急，無安身處，特投這山寨裡好漢入夥。因此要去。」那漢道：「雖然如此，必有個人薦兄長來入夥。」林冲道：「滄州橫海郡故友舉薦將來。」那漢道：「莫非柴進麼？」林冲道：「足下何以知之？」那漢道：「柴大官人與山寨中大王頭領交厚，常有書信往來。」原來是王倫當初不得地之時，與杜遷投奔柴進，多得柴進留在莊子上住了幾時。臨起身，又賫發盤纏銀兩。因此有恩。林冲聽了，便拜道：「有眼不識太山。願求大名。」那漢慌忙答禮，說道：「小人是王頭領手下耳目。小人姓朱名貴，原是沂州沂水縣人氏。山寨裡教小弟在此間開酒店為名，專一探聽往來客商經過。但有財帛者，便去山寨裡報知。但是孤單客人到此，無財帛的，放他過去。有財帛的來到這裡，輕則蒙汗藥麻翻，重則登時結果，將精肉片為羓子，肥肉煎油點燈。卻才見兄長只顧問梁山泊路頭，因此不敢下手。次後見寫出大名來。曾有東京來的人，傳說兄長的豪傑，不期今日得會。既有柴大官人書緘相薦，亦是兄長名震寰海，王頭領必當重用。」隨即叫酒保安排分例酒來相待。林冲道：「何故重賜分例酒食，拜擾不當。」朱貴道：「山寨中留下分例酒食，但有好漢經過，必教小弟相待。既是兄長來此入夥，怎敢有失祇應。」隨即安排魚肉盤饌酒餚，到來相待。兩個在水亭上吃了半夜酒。林冲道：「如何能勾船來渡過去？」朱貴道：「這裡自有船隻，兄長放心。且暫宿一宵，五更卻請起來同往。」",
        "當時兩個各自去歇息。睡到五更時分，朱貴自來叫林冲起來，洗漱罷，再取三五杯酒相待。吃了些肉食之類。此時天尚未明。朱貴把水亭上窗子開了，取出一張鵲畫弓，搭上那一枝響箭，覷着對港敗蘆折葦裡面，射將去。林冲道：「此是何意？」朱貴道：「此是山寨裡的號箭。少刻便有船來。」沒多時，只見對過蘆葦泊裡，三五個小嘍囉，搖着一隻快船過來，逕到水亭下。朱貴當時引了林冲，取了刀仗行李下船。小嘍囉把船搖開，望泊子裡去，奔金沙灘來。林冲看時，見那八百里梁山水泊，果然是個陷人去處。但見："
