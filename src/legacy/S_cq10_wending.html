<script>(function(global){'use strict';
const copy=v=>JSON.parse(JSON.stringify(v)),clamp=(n,a,b)=>Math.max(a,Math.min(b,n));

function clockwork(s,limit,active,score,complete){
 const record=a=>{if(s.actions.length<150)s.actions.push({...a,step:s.cursor+1});s.guideSteps+=Number(s.assisted);};
 const first=(early=false)=>({score:early?0:score(),max:10,passed:!early&&complete()&&score()>=6,elapsed:s.elapsed,firstAnswers:copy(s.firstAnswers)});
 return{record,snapshot:()=>copy(s),finish(){s.first=s.first||first();s.phase=s.assisted||s.first.passed?'done':'failed';s.resumePhase='done';},advance(dt){if(s.paused||s.assisted||!active.includes(s.phase))return false;dt=clamp(dt,0,limit);s.elapsed+=dt;s.left=Math.max(0,s.left-dt);if(!s.left){s.first=s.first||first();s.resumePhase=s.phase;s.phase='failed';s.note='時限已到，首次原分保留；請親做補足，沒有代你完成。';return true;}return false;},assist(){if(s.assisted||s.phase==='done')return false;s.first=s.first||first(true);s.assisted=true;s.paused=false;if(s.phase==='failed')s.phase=s.resumePhase;s.note='已標出適合的操作，仍須親自完成；首次原分保留。';return true;},result(extra){return copy({...s.first,completed:s.phase==='done'&&complete(),assisted:s.assisted,guideSteps:s.guideSteps,completion:extra});}};

 bird:{name:'伍舉的隱語',text:'有鳥在於阜，三年不蜚不鳴，是何鳥也？',detail:'伍舉借鳥影射君王未有作為。莊王說蜚將沖天、鳴將驚人，但數月之後淫益甚；承諾尚未成為行動。'},

{title:'為什麼要借隱語？',goal:'先看敢諫者面對的危險，決定如何讓諫言進入判斷。',proof:'ban',decision:'hear',report:'「有敢諫者死無赦」使進諫有風險。先聽完的選擇是教學推演，不能把禁諫之令讀成歡迎任何批評。'},
{title:'鳴將驚人，已經驚人了嗎？',goal:'把伍舉的鳥語和莊王答語放回前後情節，避免把承諾當成政績。',proof:'bird',decision:'check',report:'伍舉借鳥進諫，莊王知其意。然而居數月淫益甚；口頭知之不能取代實際聽政。'},

function jian(saved,rng){const s=saved?copy(saved):{kind:'jian',phase:'plan',cursor:0,left:90,elapsed:0,proofOrder:shuffle(Object.keys(PROOFS),rng),cards:DOSSIERS.map(()=>shuffle(Object.keys(DECISIONS),rng)),selected:null,decision:null,eventKind:null,reading:null,readEvidence:[],reports:[],firstAnswers:{},hits:0,readReports:0,appointed:[],sealed:false,actions:[],guideSteps:0,assisted:false,paused:false,note:'你是楚莊王；先親讀四份記錄，再核對證據與行動。'};

async function challenge(ctx,id,kind,title,goal){const r=await ctx.minigame({id,title,goal,help:HELP,hideClock:true,skip:false,attempts:3},play(kind)),first=r.firstResult||r;if(!r.completed)throw Error('必要操作尚未完成，請接續親做補足。');ctx.state.vars[kind]=copy({...r,firstScore:first.score,firstMax:first.max});return r;}

const NODES={
n_01:async ctx=>{await scene(ctx,'hall','楚・郢都','前613年・新王即位',['zhuang','shiguan']);await ctx.chapter('第十話　楚莊問鼎','三年不鳴的王，一開口就問鼎有多重');await ctx.say([{text:'你是楚莊王。父王卒後繼位，楚國的強弱、臣子的進言、鄰國的存亡，都將落到你的判斷上。本話依次看納諫、問鼎、復陳、圍鄭與邲之戰。'},{who:'shiguan',expr:'serious',text:'你主要扮演楚莊王，論鼎時會明示暫換王孫滿。操作與白話追問為教學情境；史實結果固定，成績評你如何理解。'},{who:'zhuang',expr:'normal',text:'若只想聽順耳的話，還能知道自己做錯了什麼嗎？'}]);ctx.unlock('person:cq_chuzhuang');return 'n_02';},
n_02:async ctx=>{await scene(ctx,'hall','楚・鐘鼓之間','即位第三年',['zhuang','wuju']);await ctx.say([{text:'莊王三年不出號令，日夜為樂，還下令敢諫者死無赦。伍舉仍進諫。'},{who:'wuju',expr:'serious',text:'願有進隱。'},{who:'wuju',expr:'serious',text:'有鳥在於阜，三年不蜚不鳴，是何鳥也？'},{who:'zhuang',expr:'smirk',text:'三年不蜚，蜚將沖天；三年不鳴，鳴將驚人。舉退矣，吾知之矣。'},{text:'蜚在這裡指飛。你聽懂鳥語，但聽懂不代表此後已經聽政。'}]);await ctx.anchor('wd_01');return 'n_03';},
n_03:async ctx=>{await scene(ctx,'hall','楚・數月之後','承諾尚未落實',['zhuang','sucong']);await ctx.say([{text:'居數月，淫益甚。伍舉之諫後，莊王仍更沉於享樂。蘇從再入諫。'},{who:'zhuang',expr:'serious',text:'若不聞令乎？'},{who:'sucong',expr:'serious',text:'殺身以明君，臣之願也。'},{text:'國君用禁令反問，臣子用進諫的目的回答。這次直言把你推向真正的行動。'}]);await ctx.anchor('wd_02');return 'n_04';},
n_04:async ctx=>{await scene(ctx,'hall','楚・諫言與行動','你・楚莊王',['zhuang','wuju','sucong']);const v=await choice(ctx,'listen',{title:'聽懂鳥語後仍淫益甚，你怎樣面對這次直諫？',text:'原文接著罷淫樂、聽政；此選擇評你對改變的理解。',options:[{label:'讓諫言接受檢驗，核對實際行為，再轉向聽政與任人。',value:'check'},{label:'只重複鳴將驚人，認為漂亮承諾就是政績。',value:'promise'}]});ctx.add('heart',v==='check'?20:0);await ctx.say([{who:'shiguan',expr:'serious',text:'接下來親讀禁令、鳥語、直諫、聽政四份記錄，再選證據與行動。最後仍要你親任兩位臣子、親下聽政令。'},{text:'常見解讀會把三年享樂說成秘密識人。此處先依敘事保留淫益甚與蘇從直諫的轉折，不把推測說成已記明的計畫。'}]);return 'n_05';},
n_05:async ctx=>{const r=await challenge(ctx,'wd_jian','jian','納諫識人・從知之到聽政','親讀四份記錄，親做四輪證據與行動判斷，任伍舉、蘇從並下聽政令。');ctx.add('crown',firstScore(r)*3);await ctx.say([{text:'四份記錄與四輪判斷皆已親做。成績保留你的首次判斷；進諫者的風險、國君的承諾與實際改變，不能混成同一件事。'}]);return 'n_06';},
n_06:async ctx=>{await scene(ctx,'palace','楚・聽政','從知之到任人',['zhuang','wuju','sucong']);await ctx.say([{text:'於是乃罷淫樂，聽政，所誅者數百人，所進者數百人，任伍舉、蘇從以政，國人大說。'},{who:'shiguan',expr:'serious',text:'人事整頓中有嚴厲的誅罰，也有任用。遊戲的必要操作是納諫與任人，不把處罰人數變成追求高分的目標。'},{who:'zhuang',expr:'serious',text:'知道，還要接上做到。進諫不能只換得一句「吾知之矣」。'}]);await ctx.anchor('wd_03');ctx.unlock('person:cq_wuju');ctx.unlock('person:cq_sucong');ctx.unlock('idiom:yimingjingren');ctx.unlock('text:chushijia');return 'n_07';},
n_07:async ctx=>{await scene(ctx,'road','周疆・雒','前606年・楚軍北至',['zhuang','shiguan']);await ctx.chapter('第二幕　在德不在鼎','兵威之下，怎樣改變問答的焦點？');await ctx.say([{text:'楚子伐陸渾之戎，遂至於雒，觀兵於周疆。納諫之後的楚逐漸強大，莊王此時把軍隊帶到周疆。'},{who:'zhuang',expr:'serious',text:'九鼎在周。它們到底有多大、多重？'},{who:'shiguan',expr:'serious',text:'楚王的白話問句為情境呈現。這不是普通參觀：展示兵威，緊接問鼎，器物問題已有王權試探的意味。'}]);await ctx.anchor('wd_04');return 'n_08';},
n_08:async ctx=>{await scene(ctx,'zhou','周・慰勞楚軍','暫時扮演王孫滿',['wangsunman','zhuang']);await ctx.say([{text:'周定王使王孫滿勞楚子。楚子問鼎之大小輕重焉。畫面明示換到周方答話者王孫滿，由你組織答辭。'},{who:'wangsunman',expr:'serious',text:'在德不在鼎。'},{text:'一開口先把焦點從器物轉到德。接著還要用故事、對比與周命之說支持這個轉題。'}]);await ctx.anchor('wd_05');ctx.unlock('person:cq_wangsunman');return 'n_09';},
n_09:async ctx=>{await scene(ctx,'zhou','周・鼎與民','夏有德之時',['wangsunman','shiguan']);await ctx.say([{who:'wangsunman',expr:'serious',text:'昔夏之方有德也，遠方圖物，貢金九牧，鑄鼎象物，百物而為之備，使民知神姦。'},{who:'shiguan',expr:'serious',text:'九牧是九州牧伯。王孫滿的故事把鑄鼎接到辨物、避害與民的生活；這是他用來說明王權根基的論證。'},{text:'不是先報一個重量，便完成了外交答話。'}]);await ctx.anchor('wd_06');return 'n_10';},
n_10:async ctx=>{await scene(ctx,'zhou','周・鼎遷三代','握有不等於永有',['wangsunman','zhuang']);await ctx.say([{who:'wangsunman',expr:'serious',text:'桀有昏德，鼎遷於商，載祀六百。商紂暴虐，鼎遷於周。'},{who:'zhuang',expr:'serious',text:'器物可以傳到下一朝，握有它的人卻不一定能守住國。'},{text:'楚王的白話反思為教學情境。王孫滿用鼎遷的歷史敘說，讓問鼎不只停在誰兵器多、誰能搬走。'}]);await ctx.anchor('wd_07');return 'n_11';},
n_11:async ctx=>{await scene(ctx,'zhou','周・小而重，大而輕','德與器物的對比',['wangsunman','shiguan']);await ctx.say([{who:'wangsunman',expr:'serious',text:'德之休明雖小，重也。其姦回昏亂，雖大，輕也。'},{who:'shiguan',expr:'serious',text:'重與輕在此有政治寓意。德行不會改變金屬的實際質量。接下來的試演讓你把器物大小與政治德行親自配對，讀出這個對比。'}]);await ctx.anchor('wd_08');return 'n_12';},
n_12:async ctx=>{await scene(ctx,'zhou','周・未可問也','承認周衰，仍守界線',['wangsunman','zhuang']);await ctx.say([{who:'wangsunman',expr:'serious',text:'成王定鼎於郟鄏，卜世三十，卜年七百，天所命也。周德雖衰，天命未改。鼎之輕重，未可問也。'},{who:'shiguan',expr:'serious',text:'世是世代，年是年數。王孫滿承認周德衰，仍借周命之說拒絕楚此刻問鼎；這是外交辭令的界線。'},{text:'接著親做兩次鼎德試演，再送六段論證。未可問也要由你送出，不靠旁白代答。'}]);await ctx.anchor('wd_09');ctx.unlock('treasure:jiuding');ctx.unlock('text:cq10_wangsunmandui');return 'n_13';},
n_13:async ctx=>{const r=await challenge(ctx,'wen_wd_ding','ding','王孫滿論鼎・在德不在鼎','親配兩次鼎德對比，依問題送出六段論證、逐段讀回報。');ctx.add('crown',firstScore(r)*4);await ctx.say([{text:'兩次試演與六段辭令皆已親做。現在回到楚莊王視角，看這場試探的結果。'}]);return 'n_14';},
n_14:async ctx=>{await scene(ctx,'road','楚・周疆歸路','九鼎仍在周',['zhuang','shiguan']);await ctx.say([{text:'楚王乃歸。楚莊王沒有在這場問鼎後搬走周鼎。'},{who:'zhuang',expr:'serious',text:'兵威可以逼人回答，卻不能讓器物替我證明有德。'},{text:'自擬反思為教學情境。史實離周的結果固定，不以辯論高分改寫周亡或九鼎入楚。'}]);const v=await choice(ctx,'boundary',{title:'回看王孫滿的答辭，楚王應理解哪條界線？',text:'此題評對辭令的理解，沒有另一條奪鼎史實分支。',options:[{label:'軍事壓力與器物在手不足以證德；答辭守住周命未改、未可問的界線。',value:'respect'},{label:'只要知道鼎的重量，就已取得周王的全部政治資格。',value:'mass'}]});ctx.add('heart',v==='respect'?20:0);ctx.unlock('idiom:wendingzhongyuan');return 'n_15';},
n_15:async ctx=>{await scene(ctx,'chen','陳・討罪之後','前598年・申叔時進諫',['zhuang','shenshushi']);await ctx.chapter('第三幕　德不只在答話裡','討罪、貪國與願意改過');await ctx.say([{text:'楚討夏徵舒弒君之罪，卻把陳國占作楚縣。申叔時自齊返楚，群臣賀而他不賀。莊王詢問，他以牽牛蹊田為喻。'},{who:'shenshushi',expr:'serious',text:'牽牛以蹊人之田，而奪之牛。牽牛以蹊者，信有罪矣，而奪之牛，罰已重矣。'},{who:'shenshushi',expr:'serious',text:'以討召諸侯，而以貪歸之，無乃不可乎？'}]);await ctx.anchor('wd_10');const v=await choice(ctx,'chen',{title:'討罪之後占其國，怎樣對待這次進諫？',text:'莊王接受而復封陳是史實；此題評理解罪與罰的分寸。',options:[{label:'承認討罪有理，但不能以此無限貪取；復封陳，改正過重的結果。',value:'restore'},{label:'既有罪，任何懲罰都不需再衡量，討罪就是取國的永久理由。',value:'take'}]});ctx.add('heart',v==='restore'?20:0);await ctx.say([{who:'zhuang',expr:'serious',text:'善哉，吾未之聞也。反之，可乎？'},{text:'乃復封陳。這次納諫落在對外行動的修正；它不是一開始從未做錯。'}]);return 'n_16';},
n_16:async ctx=>{await scene(ctx,'zheng','鄭・楚軍入城','前597年春・請存社稷',['zhuang','zhengxiang']);await ctx.say([{text:'楚圍鄭，克城入皇門。鄭襄公請不泯其社稷、讓鄭改事楚。左右主張得國無赦。'},{who:'zhuang',expr:'serious',text:'其君能下人，必能信用其民矣，庸可幾乎。'},{text:'退三十里，而許之平。潘尪入盟，子良出質。這裡是楚莊王退三十里，不是城濮的晉文公退三舍。'}]);await ctx.anchor('wd_11');return 'n_17';},
n_17:async ctx=>{await scene(ctx,'jin','晉・黃河邊的軍議','前597年夏・鄭已與楚平',['xunlinfu','xianhu','shihui']);await ctx.chapter('第四幕　邲之戰','同一支軍隊，能否接上同一道命令？');await ctx.say([{text:'晉軍救鄭，至河得知鄭已和楚議和。荀林父本欲回軍，士會也認應觀條件而進退。先縠反對，自行率所屬渡河。'},{who:'xianhu',expr:'serious',text:'由我失霸，不如死。'},{who:'shiguan',expr:'serious',text:'原文以中軍佐濟，濟為渡河。主帥欲還，佐將擅渡，全軍最終也渡河。晉軍並非沒有勇氣，問題在不同主張難以接合。'}]);await ctx.anchor('wd_12');return 'n_18';},
n_18:async ctx=>{await scene(ctx,'camp','楚・兩廣輪值','軍情與準備',['zhuang','sunshuao','wucan']);await ctx.say([{text:'楚方也曾議還。孫叔敖不欲戰，伍參則分析晉帥初掌政、佐將剛愎與指揮不一。楚王轉向北師以待，並非一句話便已打完會戰。'},{who:'shiguan',expr:'serious',text:'晉欒書提醒：楚軍並非驕而無備。兩廣交替，夜間也待不虞。'},{text:'右廣，雞鳴而駕，日中而說，左則受之，日入而說。'},{who:'sunshuao',expr:'serious',text:'接下來你先親排輪值，再依軍情親選人、令與目標。方向、保全數值與收軍令為教學示意；具體史實以軍報回到原文。'}]);await ctx.anchor('wd_13');ctx.unlock('person:cq_sunshuao');ctx.unlock('treasure:cq10_chengguang');return 'n_19';},
n_19:async ctx=>{const r=await challenge(ctx,'wd_bi','bi','邲之戰・兩廣與軍令','親排兩廣與內官輪值，送六道人、令、目標相合的軍令，逐次讀報並收軍結報。');setMeter(ctx,'shield',r.completion?.force||0);return 'n_20';},
n_20:async ctx=>{await scene(ctx,'battle','邲・會戰之後','楚勝，晉各軍結果不同',['zhuang','sunshuao','shihui']);await ctx.say([{text:'晉師敗績。楚軍疾進，晉中軍、下軍爭舟退去。士會有備，晉上軍以殿卒掩護後退，原文記不敗。楚師軍於邲，次日進至衡雍。'},{who:'shiguan',expr:'serious',text:'你在軍令中已親讀各隊回報。楚勝是整體戰果，不等於每支晉軍都被消滅。保全數值評操作，沒有改寫原文勝負。'},{who:'zhuang',expr:'serious',text:'戰報已到。此後怎樣對待戰場上的人，還是要再作判斷。'}]);return 'n_21';},
n_21:async ctx=>{await scene(ctx,'river','衡雍・戰後之議','潘黨請築京觀',['zhuang','pandang']);await ctx.chapter('第五幕　止戈為武','贏了，為什麼還要自省？');await ctx.say([{text:'潘黨建議收晉軍遺骸築京觀，以示子孫而不忘武功。這個提議只讀對話，不設蒐集遺骸的操作。'},{who:'pandang',expr:'serious',text:'臣聞克敵，必示子孫，以無忘武功。'},{who:'zhuang',expr:'serious',text:'非爾所知也。夫文，止戈為武。'},{who:'zhuang',expr:'serious',text:'夫武，禁暴、戢兵、保大、定功、安民、和眾、豐財者也。'}]);await ctx.anchor('wd_14');if(firstGood(ctx,'wd_14'))ctx.add('heart',20);return 'n_22';},
n_22:async ctx=>{await scene(ctx,'river','衡雍・七德與自省','勝利不是全部證明',['zhuang','pandang','shiguan']);await ctx.say([{who:'zhuang',expr:'serious',text:'武有七德，我無一焉，何以示子孫？'},{who:'zhuang',expr:'serious',text:'今罪無所，而民皆盡忠，以死君命，又何以為京觀乎？'},{who:'shiguan',expr:'serious',text:'禁暴、戢兵、保大、定功、安民、和眾、豐財。莊王用七項德行衡量勝後處境，並不因贏了就說自己全有德。止戈為武是文本中的說法，這裡讀它如何支持拒築京觀。'}]);const v=await choice(ctx,'restraint',{title:'要把什麼留給子孫？',text:'原文莊王拒築京觀；此選擇評你如何讀戰勝與七德的關係。',options:[{label:'保留勝報，也承認未盡七德；不拿忠於各自主君者的遺骸炫勝，收軍告成。',value:'stop'},{label:'只要戰勝就代表七德全備，可以省略對民與戰後責任的檢討。',value:'boast'}]});ctx.add('heart',v==='stop'?20:0);ctx.unlock('idiom:zhigeweiwu');return 'n_23';},
n_23:async ctx=>{await scene(ctx,'river','楚・告成而還','祀河，作先君宮',['zhuang','sunshuao']);await ctx.say([{text:'祀於河作先君宮，告成事而還。楚莊王拒築京觀，告成後回師。'},{who:'shiguan',expr:'serious',text:'這一幕沒有說列國從此永遠無戰。它只保留這次軍議裡，如何在勝後限制炫功、反省武德的取捨。'},{who:'sunshuao',expr:'normal',text:'接續軍令，也是接續責任。把軍情報清，把隊伍收回。'}]);return 'n_24';},
n_24:async ctx=>{await scene(ctx,'academy','楚・回看德與鼎','三項必要體驗已親做',['zhuang','wangsunman','shiguan']);await ctx.say([{who:'wangsunman',expr:'serious',text:'在德不在鼎。'},{who:'shiguan',expr:'serious',text:'納諫時看承諾與行動；問鼎時看器物與王權；戰後看勝利與七德。三處都不能只拿一個表面的證明，代替還需核對的判斷。'},{who:'zhuang',expr:'serious',text:'強國與勝報，仍可能讓我看不見自己正在貪取什麼。能接受一句反問，才有機會再改。'}]);return 'n_25';},
n_25:async ctx=>{await scene(ctx,'academy','楚・你的史官筆記','引用原文與首次操作',['zhuang','shiguan']);const v=await choice(ctx,'reflection',{title:'你準備沿哪條線索寫反思？',text:'選方向不計分，結算時請結合一次首次操作與一句原文。',options:[{label:'從吾知之矣到罷樂聽政，何時才算真的納諫？',value:'listen'},{label:'在德不在鼎如何靠鼎遷、小重大輕與未可問也成立？',value:'ding'},{label:'贏邲之戰仍說我無一焉，怎樣理解勝利與七德的差別？',value:'wu'}]});await ctx.say([{who:'shiguan',expr:'serious',text:v==='listen'?'引用一段納諫記錄，對照一次證據與行動判斷，寫出承諾、改變、任人的區別。':v==='ding'?'引用一段王孫滿答辭，再對照試演或一次親送論證，說明政治輕重與物理重量不同。':'引用七德或我無一焉，對照邲之戰一次軍報與收軍判斷，說明戰勝並非全部德行的保證。'}]);return 'n_26';},

const ENDINGS={great:{key:'great',title:'聞諫而知德',text:'你把諫言接到行動，把鼎接到德與王權，也在首次軍令中保留不同隊伍的結果。史實仍是'+FIXED+'。',good:true},good:{key:'good',title:'鼎外有德',text:'必要操作皆已親做。再看首次配對、辭令與軍報，分清承諾、器物與勝報各能證明什麼。史實仍是'+FIXED+'。',good:true},bad:{key:'bad',title:'勝後再問',text:'你已親做補足三項體驗。用原文檢討首次錯判，最佳分不會抹去首次紀錄。史實仍是'+FIXED+'。',good:false}};
function payload(s,ending){const a=s.vars.jian.firstScore,b=s.vars.ding.firstScore,c=s.vars.bi.firstScore,v=(Number(s.vars.choices.listen==='check')+Number(s.vars.choices.boundary==='respect')+Number(s.vars.choices.chen==='restore')+Number(s.vars.choices.restraint==='stop')+Number(firstGood(game.ctx,'wd_14')))*20;return{scenarioId:SID,chapterVersion:VERSION,runId:s.vars.runId,mode:MODE,faction:'楚',country:'楚',role:'楚莊王',roleKind:'shijia',bioTitle:'楚世家・莊王',bioOpening:'莊王者，楚君也，名侶。',ending,scoreStrategy:Math.round(a*3+b*4+c*3),scoreVirtue:v,turns:s.steps,durationSec:Math.min(5400,Math.round((Date.now()-s.startedAt)/1000)),deeds:['前613年即位，對讀伍舉隱語、數月淫益甚、蘇從直諫與聽政任人。','親讀四份記錄、核對四輪證據與行動，親任兩臣並下聽政令；首次'+a+'分。','前606年楚觀兵周疆、問鼎，暫扮王孫滿親做兩次鼎德對比、送六段論證；首次'+b+'分。','問鼎沒有取得九鼎；楚王乃歸。對讀政治輕重與器物質量，守住未可問也的界線。','前598年申叔時以牽牛蹊田諫縣陳，莊王接受、復封陳；討罪不等於無限貪國。','前597年楚許鄭平而退三十里；晉軍至河，欲還與擅渡造成指揮不一。','親排兩廣與內官輪值、送六次軍令、讀六次軍報並收軍結報；首次'+c+'分。楚勝而晉上軍不敗。','勝後拒潘黨築京觀之議，以武有七德自省，祀河作先君宮告成而還。'],anchors:copy(s.anchors),games:copy(s.games),codex:s.codex.slice(),opener:'遊戲史官評語（自擬）：莊王初為樂而禁諫，伍舉進隱，借鳥以問；王知其意，數月而行未改。蘇從願殺身以明君，王乃聽政，任其進言之臣。故知之與行之，須有後事相驗。及觀兵周疆而問鼎，王孫滿以德轉題，述鑄鼎之用、三代之遷，又以小重與大輕相對，終守周命未改之界。鼎有其形，王權有其根，不可徒以兵威與器物自證。莊王又聞申叔時之諫而復陳，許鄭之平而退師。邲戰楚勝，晉上軍仍全其退；軍報須辨全局與各部，不可以勝名抹其異。潘黨請京觀，王論七德而自省，拒以盡忠之民為炫功之物。此局記親讀、親任、親答與親令，以首次取捨問因果；高分不改史事，勝後亦不可忘再問其德。',prompts:['引用伍舉或蘇從的一句諫言，對照你納諫關的一次首次配對，說明吾知之矣、罷樂聽政、任人三者的差別；不可用秘密識人的推測替代文本轉折。','引用王孫滿答辭，對照一次鼎德試演或親送論證，說明在德不在鼎如何成立，以及政治輕重為什麼不等於實際金屬重量。','楚莊王贏邲之戰卻說我無一焉。引用七德或拒京觀之言，結合一次軍報、軍令或復陳選擇，說明勝報與是否有德的差別。'],experience:{firstAnchors:copy(s.vars.firstAnchors),jian:copy(s.vars.jian),ding:copy(s.vars.ding),bi:copy(s.vars.bi),decisions:copy(s.vars.choices)}};}
async function onEnd(r,ctx){const s=ctx.state;if(ORDER.some(id=>!s.anchors.some(a=>a.anchorId===id))||['wd_jian','wen_wd_ding','wd_bi'].some(id=>!s.games.some(g=>g.gameId===id&&!g.skipped))||['jian','ding','bi'].some(k=>!s.vars[k]?.completed)||CODEX_KEYS.some(id=>!s.codex.includes(id)))throw Error('必要體驗或對讀尚未完成，請接續本話。');const ending=ENDINGS[r.key]||ENDINGS.good,p=s.vars.finishPayload||payload(s,ending);await ctx.banner(ending.title,'楚世家・莊王・本局評語');await ctx.say([{text:ending.text},{who:'shiguan',expr:'serious',text:'到結算以一句原文與一次首次操作完成反思。下一話將看晉國霸業在不同君臣手中如何接續。'}]);if(s.vars.submitted){ZH.session.set('result:'+SID,p);ZH.go('result',{s:SID});return;}s.vars.finishPayload=p;await checkpoint();await journal.flush();ZH.finishScenario(p);s.vars.submitted=true;await checkpoint();}
