<script>
(function(w){'use strict';const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const ink='#352f29',gold='#e4c57d',jade='#75b9a0',blue='#274c61',red='#a14c43';
function round(x,y,ww,hh,r,fill,stroke){g.beginPath();g.roundRect(x,y,ww,hh,r);g.fillStyle=fill;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=2;g.stroke();}}

function background(kind='day'){const grad=g.createLinearGradient(0,0,0,500);grad.addColorStop(0,kind==='night'?'#132438':'#547371');grad.addColorStop(1,kind==='night'?'#213d43':'#75815f');g.fillStyle=grad;g.fillRect(0,0,900,500);cover(bg,0,0,900,500,.9);g.fillStyle=kind==='night'?'#06162760':'#122b3140';g.fillRect(0,0,900,500);}
function actor(x,y,size=70,o={}){g.save();g.translate(x,y);g.scale((o.dir||1)*size/100,size/100);const phase=(o.t||0)*10,run=o.moving?Math.sin(phase):0,crouch=o.crouch?12:0,attack=o.attack||0;ellipse(0,3,28,6,'#071a2760');g.translate(0,crouch);const robe=o.enemy?red:o.robe||blue;line(-12,-21,-13+run*9,-2,ink,12);line(12,-21,13-run*9,-2,ink,12);ellipse(-14+run*9,-1,10,5,'#d2b274');ellipse(14-run*9,-1,10,5,'#d2b274');g.beginPath();g.moveTo(-22,-53);g.quadraticCurveTo(0,-68,22,-53);g.lineTo(28,-17);g.quadraticCurveTo(0,-6,-28,-17);g.closePath();g.fillStyle=robe;g.fill();g.strokeStyle=ink;g.lineWidth=3;g.stroke();line(-14,-43,11,-16,gold,5);line(-23,-21,24,-21,gold,4);g.save();g.translate(18,-48);g.rotate(o.block?-.9:attack?-.5-Math.sin(attack*6)*1.5:run*.2);line(0,0,9,23,robe,12);ellipse(10,23,7,7,'#f0d1ae');if(o.weapon||attack){line(10,20,14,-44,'#d4c5a4',4);line(4,10,22,10,gold,4);}g.restore();line(-21,-48,-27-run*4,-27,robe,11);ellipse(-26-run*4,-25,6,6,'#f1d4b1');if(o.block){ellipse(-28,-38,18,25,'#bda263');ellipse(-28,-38,11,17,'#804e40');}ellipse(0,-76,29,29,'#f4d6b4');g.strokeStyle=ink;g.lineWidth=3;g.stroke();g.beginPath();g.moveTo(-28,-76);g.quadraticCurveTo(-31,-112,0,-107);g.quadraticCurveTo(31,-108,28,-77);g.lineTo(19,-85);g.lineTo(10,-82);g.lineTo(0,-89);g.lineTo(-12,-82);g.lineTo(-22,-85);g.closePath();g.fillStyle='#3b322f';g.fill();g.stroke();ellipse(0,-108,10,5,'#3b322f');line(-13,-109,14,-109,gold,3);ellipse(-10,-74,5,7,'#302825');ellipse(10,-74,5,7,'#302825');ellipse(-11,-77,1.5,2,'#fff8e5');ellipse(9,-77,1.5,2,'#fff8e5');ellipse(-19,-64,5,2.5,'#e99d8d80');ellipse(19,-64,5,2.5,'#e99d8d80');g.beginPath();g.arc(0,-63,6,0,Math.PI);g.strokeStyle='#794b39';g.lineWidth=2;g.stroke();if(o.beard){g.beginPath();g.moveTo(-6,-58);g.lineTo(0,-39);g.lineTo(6,-58);g.fillStyle='#443631';g.fill();}if(o.enemy){g.fillStyle='#756854';g.beginPath();g.moveTo(-29,-91);g.quadraticCurveTo(0,-124,29,-91);g.closePath();g.fill();}g.restore();}
function horse(x,y,size=110,o={}){g.save();g.translate(x,y);g.scale(size/100,size/100);const t=(o.t||0)*12;ellipse(0,17,43,6,'#0b1b2d65');for(let j=0;j<4;j++){const xx=-25+j*16,a=Math.sin(t+j*1.8)*11;line(xx,0,xx+a,20,'#543c2d',5);}ellipse(0,-9,37,19,o.color||'#9c7950');g.beginPath();g.moveTo(25,-17);g.lineTo(29,-45);g.lineTo(46,-47);g.lineTo(57,-25);g.lineTo(46,-19);g.lineTo(35,-18);g.fillStyle=o.color||'#9c7950';g.fill();line(-34,-11,-51,-25,'#322c29',5);line(29,-41,32,-52,'#322c29',4);ellipse(42,-38,2,2,'#211f21');actor(0,-20,42,{dir:1,t:o.t,moving:true,robe:o.enemy?red:blue});g.restore();}
function racer(x,y,size,o={}){if(c.mode!=='break'){horse(x,y,size,o);if(c.mode==='convoy'){const z=size/100;g.save();g.translate(x-60*z,y+12*z);g.scale(z,z);round(-35,-28,62,30,5,'#8c7651','#d8bd7e');ellipse(-23,5,11,11,'#473e35');ellipse(17,5,11,11,'#473e35');for(let j=0;j<3;j++)ellipse(-24+j*20,-34,12,17,'#d0ba7d');g.restore();}return;}g.save();g.translate(x,y);g.scale(size/100,size/100);ellipse(0,18,43,6,'#0b1b2d65');for(let j=0;j<4;j++)line(-25+j*16,0,-25+j*16+Math.sin((o.t||0)*12+j*1.8)*10,20,'#4d3f32',6);ellipse(0,-12,39,23,o.enemy?'#8f8270':'#bba478');round(-25,-31,40,32,4,o.enemy?'#4c626c':'#9c4941',gold);ellipse(36,-26,20,24,'#bca583');line(24,-39,15,-55,'#f1ddb6',5);line(47,-39,56,-55,'#f1ddb6',5);ellipse(42,-29,3,3,'#292e29');line(-37,-15,-61,-35,'#bc6854',4);line(-61,-35,-76,-31,gold,3);g.restore();}
function flag(x,y,label,color=gold){line(x,y,x,y-65,'#785f3f',4);g.fillStyle=color;g.beginPath();g.moveTo(x,y-65);g.lineTo(x+38,y-58);g.lineTo(x+35,y-29);g.lineTo(x,y-36);g.closePath();g.fill();text(label,x+18,y-47,14,'#272d29');}
function bar(x,y,ww,value,max,color=jade){round(x,y,ww,5,3,'#0a152477');round(x,y,ww*Math.max(0,Math.min(1,value/max)),5,3,color);}
function labelBox(t,x,y,color='#1d3649dd'){const size=13*scaleText;g.font=size+'px "PingFang TC",sans-serif';const ww=g.measureText(t).width+18;round(x-ww/2,y-12*scaleText,ww,24*scaleText,6,color);text(t,x,y,13);}
function scrollIcon(x,y,label,active,t){g.save();g.translate(x,y+(active?Math.sin(t*3)*4:0));round(-17,-20,34,34,5,active?'#e8d5a3':'#799a85','#765d3e');line(-9,-9,10,-9,'#8d7048',2);line(-9,-2,10,-2,'#8d7048',2);line(-9,5,5,5,'#8d7048',2);g.restore();labelBox(label,x,y+32,active?'#193548e8':'#325444e8');}
function adventure(s){background(c.stealth?'night':'day');const p=s.player,cam={x:Math.max(0,Math.min(500,p.x-450)),y:Math.max(0,Math.min(340,p.y-250))};lastCamera=cam;g.save();g.translate(-cam.x,-cam.y);g.fillStyle='#49725668';g.fillRect(0,0,1400,840);g.lineWidth=44;g.strokeStyle='#c2aa7eaa';g.beginPath();g.moveTo(40,740);g.bezierCurveTo(300,740,260,470,600,500);g.bezierCurveTo(1100,500,900,760,1360,760);g.stroke();g.strokeStyle='#c2aa7e66';g.lineWidth=32;g.beginPath();g.moveTo(220,740);g.lineTo(230,100);g.lineTo(1300,100);g.moveTo(680,740);g.lineTo(680,120);g.moveTo(1190,760);g.lineTo(1190,100);g.stroke();for(const r of s.walls){round(r.x+5,r.y+14,r.w,r.h,10,'#10202d66');round(r.x,r.y,r.w,r.h,5,'#b3986b','#66533c');g.fillStyle='#594f45';g.beginPath();g.moveTo(r.x-17,r.y+17);g.lineTo(r.x+r.w/2,r.y-38);g.lineTo(r.x+r.w+17,r.y+17);g.closePath();g.fill();line(r.x+15,r.y+34,r.x+r.w-15,r.y+34,'#7e664c',3);text('舍',r.x+r.w/2,r.y+r.h/2,20,'#59452f');}for(const b of s.bushes){for(let i=0;i<10;i++)ellipse(b.x+(i%5)*24,b.y+Math.floor(i/5)*24,25,17,'#365f4bd9');}for(const guard of s.guards){g.save();g.translate(guard.x,guard.y);g.rotate(guard.a);g.beginPath();g.moveTo(0,0);g.arc(0,0,guard.range,-.66,.66);g.closePath();g.fillStyle=s.alarm>.2?'#efaa554d':'#e6cc7838';g.fill();g.restore();actor(guard.x,guard.y,46,{enemy:true,t:s.time,moving:true,dir:Math.cos(guard.a)>0?1:-1});}for(const it of s.items)scrollIcon(it.x,it.y,it.name,!s.found.includes(it.id),s.time);flag(s.exit.x,s.exit.y,'營',s.arrived?jade:gold);labelBox('接應出口',s.exit.x,s.exit.y+18);actor(p.x-30,p.y+18,45,{dir:p.dir,t:s.time-.5,moving:p.moving||s.path.length>0,robe:'#847256'});actor(p.x,p.y,63,{dir:p.dir,t:s.time,moving:p.moving||s.path.length>0,robe:'#335b69',crouch:p.hidden});g.restore();if(s.alarm>.05){round(250,22,400,32,8,'#1c2637e8');bar(260,36,380,s.alarm,1.3,'#e3ab5f');text('巡哨注意',450,70,15,gold);}}
function fighter(s){background();const cam=s.camera||0;g.save();g.translate(-cam*.16,0);for(let x=-60;x<1300;x+=230){line(x,70,x,410,'#19333277',20);g.fillStyle='#445a4277';g.beginPath();g.moveTo(x-80,180);g.lineTo(x,15);g.lineTo(x+100,180);g.closePath();g.fill();}g.restore();g.fillStyle='#806d4d';g.fillRect(0,420,900,80);g.fillStyle='#c1ab78';g.fillRect(0,420,900,7);g.save();g.translate(-cam,0);for(const b of s.platforms){round(b.x,b.y,b.w,13,4,'#a48b5a','#574b35');line(b.x+12,b.y+12,b.x+12,420,'#62553b',9);line(b.x+b.w-12,b.y+12,b.x+b.w-12,420,'#62553b',9);}for(const e of s.enemies){actor(e.x,e.y,88,{enemy:true,dir:e.dir,t:s.time,moving:e.mode==='approach',weapon:true,attack:e.mode==='windup'?1:e.mode==='recover'?.3:0,block:e.mode==='guard'});bar(e.x-32,e.y-119,64,e.hp,e.max,red);if(e.mode==='windup')labelBox('起手',e.x,e.y-150,'#8b3f2ded');}const p=s.player;actor(p.x,p.y,94,{dir:p.dir,t:s.time,moving:p.anim==='run',weapon:true,attack:p.attack,block:p.block,robe:'#376576'});for(const a of (s.bolts||[]))line(a.x-10*Math.sign(a.vx),a.y,a.x+7*Math.sign(a.vx),a.y,'#f0cb7b',3);for(const f of s.hitFx){g.save();g.globalAlpha=f.t/.3;g.strokeStyle=gold;g.lineWidth=5;g.beginPath();g.arc(f.x,f.y,30*(1-f.t/.4),-.9,.9);g.stroke();g.restore();}g.restore();labelBox('甬道／演武 '+Math.min(c.waves||3,s.wave+1)+' / '+(c.waves||3),450,30);bar(30,30,210,p.hp,100,jade);bar(30,44,210,p.stamina,100,gold);}
function command(s){background(s.navy?'night':'day');g.fillStyle=s.navy?'#24627bbd':'#78845bba';g.fillRect(0,0,900,500);if(s.navy){g.strokeStyle='#b6d9d449';g.lineWidth=3;for(let j=0;j<12;j++){g.beginPath();for(let x=0;x<=900;x+=20){const y=j*45+Math.sin(x/90+s.time)*5;x?g.lineTo(x,y):g.moveTo(x,y);}g.stroke();}round(0,20,100,460,0,'#a1936b');text('接應岸',52,470,16,'#eee0b5');}else{g.strokeStyle='#cbb78588';g.lineWidth=45;g.beginPath();g.moveTo(10,250);g.bezierCurveTo(300,170,600,330,900,200);g.stroke();if(c.retreat)for(let i=0;i<3;i++){line(470-i*100,40,470-i*100,465,i<s.retreat?'#9ed3af77':'#e5c57099',2);labelBox('退 '+(i+1),470-i*100,35);}}
 for(let i=0;i<s.points.length;i++){const p=s.points[i];ellipse(p.x,p.y,48,20,s.flags[i]?'#78b39499':'#e9c67655');flag(p.x-14,p.y,c.mode==='naval'?'岸':String(i+1),s.flags[i]?jade:gold);if(!s.navy)bar(p.x-30,p.y+18,60,s.capture[i],2.3,gold);}
 for(const u of [...s.units].filter(u=>u.hp>0).sort((a,b)=>a.y-b.y)){if(u.target&&u.side==='ally'){g.setLineDash([7,9]);line(u.x,u.y,u.target.x,u.target.y,'#eee0b475',2);g.setLineDash([]);}if(u.id===s.selected){ellipse(u.x,u.y+3,32,12,'#e8c77866');g.strokeStyle=gold;g.lineWidth=2;g.stroke();}if(s.navy){g.fillStyle=u.side==='enemy'?'#795249':'#a58b5d';g.beginPath();g.moveTo(u.x-34,u.y);g.quadraticCurveTo(u.x,u.y+29,u.x+34,u.y);g.closePath();g.fill();actor(u.x,u.y-5,32,{enemy:u.side==='enemy',t:s.time,dir:u.target&&u.target.x<u.x?-1:1});flag(u.x-23,u.y-5,u.side==='ally'?'越':'吳',u.side==='enemy'?red:gold);}else{for(let j=0;j<3;j++)actor(u.x+(j-1)*16,u.y+(j%2)*7,36,{enemy:u.side==='enemy',dir:u.target&&u.target.x<u.x?-1:1,t:s.time+j,moving:!!u.target,block:u.guard,weapon:true});}bar(u.x-26,u.y-53,52,u.hp,u.max,u.side==='ally'?jade:red);labelBox(u.name,u.x,u.y+28,u.side==='ally'?'#173e50e8':'#6a3535e8');}}
function simulation(s){background();g.fillStyle='#496b50cc';g.fillRect(0,0,900,500);const tw=78,th=57,ox=58,oy=40,wet=new Set(w.GameplayModels.create?[]:[]);const waterSet=new Set();let q=[30];waterSet.add(30);for(let i=0;i<q.length;i++)for(const n of [q[i]-10,q[i]+10,q[i]-1,q[i]+1])if(n>=0&&n<70&&Math.abs(n%10-q[i]%10)+Math.abs(Math.floor(n/10)-Math.floor(q[i]/10))===1&&!waterSet.has(n)&&s.tiles[n]?.kind==='canal'){waterSet.add(n);q.push(n);}for(let y=0;y<7;y++)for(let x=0;x<10;x++){const n=y*10+x,xx=ox+x*tw,yy=oy+y*th,t=s.tiles[n];round(xx+2,yy+2,tw-4,th-4,6,(x+y)%2?'#86966b':'#758762','#adb28c45');if(t){if(t.kind==='canal'){round(xx+5,yy+8,tw-10,th-14,5,waterSet.has(n)?'#579dafa8':'#506572');g.setLineDash([7,13]);line(xx+10,yy+20+Math.sin(s.time*2+x)*3,xx+tw-10,yy+20,'#dbede9aa',2);g.setLineDash([]);}if(t.kind==='farm'){const col=['#e5bd68','#b5c58b','#cc947b','#94b2bd','#c3a5c4'][t.owner||0];for(let j=0;j<4;j++){line(xx+12+j*15,yy+14,xx+12+j*15+Math.sin(s.time+j)*3,yy+th-10,col,3);}text(String.fromCharCode(65+(t.owner||0)),xx+tw-12,yy+13,12,'#313c30');}if(['workshop','house','barracks','dock'].includes(t.kind)){round(xx+13,yy+18,tw-26,th-21,3,'#ceb68b','#65523c');g.fillStyle=t.kind==='barracks'?red:'#58605c';g.beginPath();g.moveTo(xx+7,yy+22);g.lineTo(xx+tw/2,yy+3);g.lineTo(xx+tw-7,yy+22);g.closePath();g.fill();text({workshop:'工',house:'居',barracks:'營',dock:'船'}[t.kind],xx+tw/2,yy+36,15,'#453a2a');}if(t.workers&&c.mode!=='farm'){for(let j=0;j<t.workers;j++)actor(xx+14+j*16,yy+th-2,21,{t:s.time+j,moving:true,robe:'#8f6d43'});}}if(s.disputes.includes(n)){g.strokeStyle='#f2b394';g.lineWidth=4;g.strokeRect(xx+3,yy+3,tw-6,th-6);text('!',xx+tw/2,yy+th/2,25,'#ffd7ac');}if(n===s.selectedCell){g.strokeStyle=gold;g.lineWidth=3;g.strokeRect(xx+1,yy+1,tw-2,th-2);}}if(c.mode==='base'){for(let i=0;i<Math.min(14,Math.floor(s.soldiers));i++)actor(70+i*52,475,28,{t:s.time+i*.2,moving:true,weapon:true});if(s.raid){flag(840,470,'備',jade);}}text(c.mode==='farm'?'田里教學沙盤 · A–E 五戶':'越地教學沙盤 · 生產與訓練',450,19,14,gold);}
function race(s){background();const horizon=120,curve=Math.sin(s.distance/175)*120;g.fillStyle='#334f4cb5';g.fillRect(0,horizon,900,380);for(let i=0;i<35;i++){const t=i/35,tt=(i+1)/35,y=horizon+t*t*380,yy=horizon+tt*tt*380,half=25+t*300,half2=25+tt*300,cx=450+curve*(1-t),cx2=450+curve*(1-tt);g.beginPath();g.moveTo(cx-half,y);g.lineTo(cx+half,y);g.lineTo(cx2+half2,yy);g.lineTo(cx2-half2,yy);g.closePath();g.fillStyle=(Math.floor(s.distance/28)+i)%2?'#b29a6c':'#bba576';g.fill();line(cx-half,y,cx2-half2,yy,'#e5d5a088',3);line(cx+half,y,cx2+half2,yy,'#e5d5a088',3);}for(const o of s.obstacles){const d=o.d-s.distance;if(o.hit||d<0||d>700)continue;const t=1-d/700,y=horizon+t*t*330,x=450+curve*(1-t)+o.l*t*1.9;round(x-20*t,y-26*t,40*t,27*t,3,'#665844','#d3ba79');}for(const b of s.grain){const d=b.d-s.distance;if(b.taken||d<0||d>700)continue;const t=1-d/700,x=450+curve*(1-t)+b.l*t*1.9,y=horizon+t*t*330;ellipse(x,y,12*t,18*t,gold);}const delta=s.rival-s.distance;racer(450+Math.sin(s.trackTime||0)*30,360-clamp(delta,-160,200)*.65,delta>0?70:105,{enemy:true,t:s.time,color:'#735845'});racer(450+s.lateral,420,110,{t:s.time,color:['#9c7950','#805b3b','#b4a991'][s.horse||0]});text('對手',450,290-clamp(delta,-100,160)*.7,14,'#ffe3bf');labelBox('體力 '+Math.round(s.stamina)+' · 隊形 '+Math.round(s.integrity),450,35);}
function archery(s){background();g.fillStyle='#1d3f4466';g.fillRect(0,0,900,500);for(const t of s.targets){if(t.resolved){if(t.hit&&t.life>0){text('命中',t.x,t.y-30,18,gold);}continue;}g.save();g.translate(t.x,t.y);line(0,20,-12,72,'#8c714a',5);line(0,20,12,72,'#8c714a',5);for(const [r,col]of [[28,'#eee1bc'],[20,'#914b3c'],[12,'#eee1bc'],[5,'#8e4939']])ellipse(0,0,r,r,col);g.restore();}for(const a of s.projectiles){const t=Math.min(1,a.t/a.duration),x=a.x+(a.tx-a.x)*t,y=a.y+(a.ty-a.y)*t-Math.sin(t*Math.PI)*55;line(x-7,y+9,x+6,y-5,gold,3);}horse(450+s.rider,458,105,{t:s.time});const a=s.aim;line(a.x-18,a.y,a.x-5,a.y,'#f5e6bc',2);line(a.x+5,a.y,a.x+18,a.y,'#f5e6bc',2);line(a.x,a.y-18,a.x,a.y-5,'#f5e6bc',2);line(a.x,a.y+5,a.x,a.y+18,'#f5e6bc',2);g.beginPath();g.arc(a.x,a.y,10+(1-s.charge)*12,0,Math.PI*2);g.strokeStyle=gold;g.lineWidth=2;g.stroke();bar(330,477,240,s.charge,1,gold);}

 for(const u of s.units){if(u.hp<=0)continue;let p=images.get(u.id);if(!p){p={x:u.x,y:u.y};images.set(u.id,p);}p.x+=(u.x-p.x)*Math.min(1,dt*10);p.y+=(u.y-p.y)*Math.min(1,dt*10);const xx=ox+(p.x+.5)*tile,yy=oy+(p.y+.85)*tile;actor(xx,yy,32,{enemy:u.side!=='han',t:performance.now()/1000,moving:Math.abs(p.x-u.x)+Math.abs(p.y-u.y)>.05,weapon:true,block:u.guard});bar(xx-16,yy-40,32,u.hp,u.max||u.hp,u.side==='han'?jade:red);text(u.id,xx,yy+10,10,'#293f3c');if(u.id===s.selected){g.strokeStyle=gold;g.lineWidth=2;g.strokeRect(ox+u.x*tile,oy+u.y*tile,tile,tile);}}text('井陘教學軍圖',450,488,14,'#3d4431');}
function draw(s,dt=.016,extra={}){const rect=canvas.getBoundingClientRect(),dpr=Math.min(2,w.devicePixelRatio||1),ww=Math.max(1,rect.width),hh=Math.max(1,rect.height);if(canvas.width!==Math.round(ww*dpr)||canvas.height!==Math.round(hh*dpr)){canvas.width=Math.round(ww*dpr);canvas.height=Math.round(hh*dpr);}g.setTransform(canvas.width/900,0,0,canvas.height/500,0,0);g.clearRect(0,0,900,500);scaleText=Math.max(1,Math.min(1.8,700/ww));if(!s||s.phase==='brief'||!s.player&&!s.units&&!s.tiles&&!s.notes&&!s.hand&&c.kind!=='race'&&c.kind!=='archery'){background();actor(450,420,180,{t:0,robe:'#3b6878'});return;}const kind=extra.kind||c.kind;({adventure,fighter,command,simulation,race,archery,cards,rhythm}[kind]||background)(s);if(kind==='nativeTactics')tactics(s,extra.api,dt);if(kind==='nativeCards')cards({intent:s.intent?.kind||0,intentName:s.intent?.name,intentAttack:Math.max(0,(s.intent?.attack||0)+s.round-s.shield),support:s.doubtWork||0,time:0});if(extra.paused){g.fillStyle='#08192799';g.fillRect(0,0,900,500);text('已暫停',450,240,32,gold);}}
