<script>
(function(ZH){
 'use strict';
 const ASSETS=null; // VILLAGE_ASSETS
 if(!ASSETS||ZH.village)return;
 let view=null,request=null,epoch=0,app=null,style=null;
 ZH.ready(()=>{
  const button=document.querySelector('[data-village-open]');if(!button)return;
  const dialog=document.createElement('dialog');dialog.className='village-modal';dialog.setAttribute('aria-label','3D博物館村');document.body.append(dialog);
  const host=document.createElement('div');host.className='village-host';dialog.append(host);
  function close(){++epoch;request?.abort();view?.dispose();view=null;dialog.close();button.focus({preventScroll:true});}
  function loadStyle(){if(style)return style;style=new Promise((resolve,reject)=>{const link=document.createElement('link');link.rel='stylesheet';link.href=ZH_STATIC_URL(ASSETS.css);link.onload=resolve;link.onerror=()=>{link.remove();style=null;reject(Error('村莊畫面樣式暫時無法載入。'));};document.head.append(link);});return style;}
  async function open(){
   const token=++epoch;request?.abort();request=new AbortController();view?.dispose();view=null;
   if(!dialog.open)dialog.showModal();host.innerHTML='<div class="village-wait"><p role="status">正在準備博物館村……</p><button type="button" data-return>返回原選關頁</button></div>';host.querySelector('[data-return]').onclick=close;
   try{
    app=app||import(ZH_STATIC_URL(ASSETS.app)).catch(error=>{app=null;throw error;});
    const [module]=await Promise.all([app,loadStyle()]);if(token!==epoch)return;
    const controller=await module.mountVillage(host,{assets:Object.fromEntries(Object.entries(ASSETS.assets).map(([k,v])=>[k,ZH_STATIC_URL(v)])),catalog:ZH.CATALOG,canPlay:id=>ZH.canPlay(id),color:ZH.player?.profile?.appearance?.color||'jade',signal:request.signal,onClose:close,onSelect:id=>{const chapter=ZH.findScenario(id);if(chapter?.status!=='ready'||chapter.legacyOnly||!ZH.canPlay(id))return;close();document.dispatchEvent(new CustomEvent('zh:village-select',{detail:{id}}));}});
    if(token!==epoch){controller.dispose();return;}view=controller;
   }catch(error){if(token!==epoch)return;host.replaceChildren();const box=document.createElement('div');box.className='village-wait';const text=document.createElement('p');text.setAttribute('role','status');text.textContent=error.message||'村莊暫時無法開啟。';const retry=document.createElement('button');retry.textContent='重新載入村莊';retry.onclick=open;const back=document.createElement('button');back.textContent='返回原選關頁';back.onclick=close;box.append(text,retry,back);host.append(box);}
  }
  button.onclick=open;dialog.addEventListener('cancel',event=>{event.preventDefault();close();});
  window.addEventListener('pagehide',event=>{if(!event.persisted){request?.abort();view?.dispose();view=null;}});
  ZH.village={open,close,inspect:()=>view?.inspect()||{loading:!!request,opened:dialog.open}};
 });
})(window.ZH);
</script>
<style>
.village-entry{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px 22px;margin:0 0 22px;border:1px solid #c9ad70;border-radius:14px;background:linear-gradient(110deg,#27463de8,#182b3ae8);color:#f5e6c2}.village-entry h2{font-size:22px;margin:0 0 6px;color:#f0d092}.village-entry p{font-size:13px;line-height:1.7;color:#d6ddc9;margin:0}.village-entry small{display:block;font-size:11px;color:#b9c5b9;margin-top:5px}.village-entry button{flex-shrink:0;min-height:48px}.village-modal{padding:0;border:0;max-width:100vw;max-height:100dvh;width:100vw;height:100dvh;margin:0;background:#edf0e4;overflow:hidden}.village-modal::backdrop{background:#142d2b}.village-host{height:100dvh;min-height:0}.village-wait{padding:40px;color:#234b40;background:#fbf6e8;height:100%;font-size:18px}.village-wait button{margin:12px 10px 0 0;min-height:44px;padding:10px 16px;border:1px solid #899d80;border-radius:8px;font:inherit;background:#f4ebd8;color:#234b40}@media(max-width:700px){.village-entry{display:block;padding:16px}.village-entry h2{font-size:20px}.village-entry button{width:100%;margin-top:14px}}
</style>
