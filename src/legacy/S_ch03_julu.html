    for (let i = order.length - 1; i > 0; i--) { const j = Math.floor((window.__ep ? window.__ep.ctx.rng() : crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296) * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }

    document.body.append(wrap);  wrap.querySelector('button').focus();
    wrap.addEventListener('keydown', e => {
      if (e.key !== 'Tab') return;
      const bs = [...wrap.querySelectorAll('button:not([hidden]):not(:disabled)')];
      if (e.shiftKey && document.activeElement === bs[0]) { e.preventDefault(); bs.at(-1).focus(); }
      else if (!e.shiftKey && document.activeElement === bs.at(-1)) { e.preventDefault(); bs[0].focus(); }
    });
    function complete() {
      finished = true; rec.completed = true; first[a.id] = rec; JL.checkpoint();
      wrap.remove();  if (previous?.isConnected) previous.focus({preventScroll:true}); resolve(clone(rec));
    }
    function showRead() {
      reading = true; const fb = wrap.querySelector('.hm-feedback'); fb.hidden = false; fb.textContent = a.explanation;
      wrap.querySelectorAll('[data-answer]').forEach(x => { x.disabled = true; });
      const follow = wrap.querySelector('[data-follow]'); if (follow) follow.hidden = false;
      const done = wrap.querySelector('[data-read-done]'); done.hidden = false; done.focus();
    }
    if (rec?.finalAnswer === a.answer) showRead();
    wrap.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b || b.disabled || finished) return;
      if (b.hasAttribute('data-read-done') && reading) { complete(); return; }
      if (!b.dataset.answer || reading) return;
      const answer = b.dataset.answer, correct = answer === a.answer, seconds = Math.round((performance.now() - shownAt) / 100) / 10;
      if (!rec) rec = { anchorId: a.id, choice: answer, correct, seconds, attempts: 0, completed: false };
      rec.attempts++; rec.path = correct ? (rec.attempts === 1 ? 'direct' : 'fork') : rec.attempts === 1 ? 'fork' : 'fail';
      const op = a.options.find(o => o.key === answer);
      ZH.track('anchor', { scenarioId: SID, anchorId: a.id, attempt: rec.attempts, choice: answer, correct, firstTry: rec.attempts === 1, path: rec.path, distractorType: correct ? '' : op.type || '', seconds });
      if (correct) { rec.finalAnswer = answer; showRead(); }
      else { const fb = wrap.querySelector('.hm-feedback'); fb.hidden = false; fb.textContent = (op.fork || '請重新對讀原文。') + ' 請再判斷一次。'; shownAt = performance.now(); }
      first[a.id] = rec; JL.checkpoint();
    });
  });

    const s = document.querySelector('#jl-speed'); s.value = ZH.settings.textSpeed; s.addEventListener('change', () => ZH.setSetting('textSpeed', s.value));
    document.querySelector('#jl-still').addEventListener('change', e => { write('still', e.target.checked); document.documentElement.classList.toggle('hm-still', e.target.checked); });
  };

    const report=RACE_STAGES[race.cursor-1]+'：'+event.title+'，選'+action.label+'；'+(extra?'額外延誤'+extra+'回合':'沒有額外延誤')+'。';
    race.actions.push({stage:race.cursor,event:event.id,action:actionId,extra:extra});
    race.score=Math.max(0,10-race.delay*2);race.gap=2+race.delay;
    return report;
  }
  function raceGame(body,g,input) {
    return new Promise(resolve=>{
      const restored=g.getProgress();
      const race=restored?.race?copy(restored.race):input.saved?JSON.parse(JSON.stringify(input.saved)):{cursor:0,delay:0,rounds:0,care:0,aid:0,actions:[],entered:false,score:10,max:10,gap:2};
      if(!restored?.race)race.meters={...input.meters};race.max=10;race.score=Math.max(0,10-race.delay*2);
      if(!race.sequence)race.sequence=Array.from({length:5},()=>RACE_EVENTS[Math.floor(g.rng()*RACE_EVENTS.length)].id);
      const stop=input.phase===1?3:5, reports=restored?.reports || [];
      let event=null,review=restored?.review || false,completed=false,stopped=false;
      const persist=()=>g.setProgress({race:copy(race),reports:copy(reports),review,report:q('[data-race-report]').textContent});
      const listen=(el,type,fn)=>{el.addEventListener(type,fn);g.onCleanup(()=>el.removeEventListener(type,fn));};
      body.innerHTML='<div class="ch03-game ch03-race"><p>你是項羽，安排北路軍務。劉邦西進是史料對照；先定關中的先後固定，選擇改變你的延誤與補給。</p>' +
        '<p class="jl-route-hint ch03-small">行程圖可左右滑動，查看兩路軍務。<\/p><div class="jl-route-art">'+routeArt(race)+'<\/div><div class="ch03-route"><p><b>項羽北路・函谷關</b><span data-race-north-label></span></p><div class="ch03-bar" role="progressbar" aria-label="項羽北路軍務進度" aria-valuemin="0" aria-valuemax="100"><i data-race-north></i></div>' +
        '<p><b>劉邦西進・武關</b><span data-race-liu-label></span></p><div class="ch03-bar ch03-bar--liu" role="progressbar" aria-label="劉邦史料對照進度" aria-valuemin="0" aria-valuemax="100"><i data-race-liu></i></div></div>' +
        '<div class="ch03-hud"><span>軍心 <b data-race-heart></b></span><span>糧 <b data-race-grain></b></span><span>威名 <b data-race-fame></b></span></div>' +
        '<ol class="ch03-route-steps">'+RACE_STAGES.map((s,i)=>'<li data-race-stage="'+i+'">'+g.esc(s)+'</li>').join('')+'</ol>' +
        '<p class="ch03-small" data-race-summary></p><section class="ch03-event"><p class="ch03-small" data-race-stage-label></p><h3 data-race-title></h3><p data-race-text></p></section>' +
        '<div class="ch03-race-actions">'+RACE_ACTIONS.map((a,i)=>'<button type="button" class="zh-btn zh-btn--quiet" data-race-action="'+a.id+'"><b>'+(i+1)+'・'+g.esc(a.label)+'</b><small>'+g.esc(a.desc)+'</small></button>').join('')+'</div>' +
        '<div class="ch03-race-rescue" hidden><button type="button" class="zh-btn zh-btn--primary" data-race-aid="rest">1・整隊籌糧：糧+36、軍心+24、威名-3，延誤1回合</button><button type="button" class="zh-btn zh-btn--quiet" data-race-aid="transport">2・集中轉運：糧+46、軍心+12、威名+1，延誤2回合</button></div>' +
        '<p class="ch03-signal" aria-live="polite" data-race-report></p><button type="button" class="zh-btn zh-btn--primary" data-race-next hidden>讀完回報，繼續行程</button>' +
        '<button type="button" class="zh-btn zh-btn--primary" data-race-finish hidden></button><p class="ch03-small">五項軍務至少五回合；劉邦對照條第三回合先定關中。基本差距2回合，加上你的額外延誤。回合與地圖為教學縮時，並非同步日期或真實距離。</p></div>';
      const q=s=>body.querySelector(s),actionBox=q('.ch03-race-actions'),aidBox=q('.ch03-race-rescue');
      const short=()=>race.meters.grain<16||race.meters.heart<12;
      const refresh=()=>{
        q('.jl-route-art').innerHTML=routeArt(race);
        ['heart','grain','fame'].forEach(k=>q('[data-race-'+k+']').textContent=String(race.meters[k]));
        const north=race.cursor/5*100,liu=Math.min(100,race.rounds/3*100);
        q('[data-race-north]').style.width=north+'%';q('[data-race-liu]').style.width=liu+'%';
        q('[data-race-north]').parentElement.setAttribute('aria-valuenow',String(north));q('[data-race-liu]').parentElement.setAttribute('aria-valuenow',String(Math.round(liu)));
        q('[data-race-north-label]').textContent=race.cursor===5?'抵關外・待主線傳令入關':race.cursor+' / 5項軍務';
        q('[data-race-liu-label]').textContent=liu===100?'史料對照：已先定關中':'史料對照：西進中';
        q('[data-race-summary]').textContent='已用'+race.rounds+'個教學回合・額外延誤'+race.delay+'・目前成績'+race.score+'/10。';
        body.querySelectorAll('[data-race-stage]').forEach((el,i)=>{el.classList.toggle('is-done',i<race.cursor);el.classList.toggle('is-current',i===race.cursor);});
        actionBox.hidden=review||completed||short();aidBox.hidden=review||completed||!short();
        q('[data-race-next]').hidden=!review||completed;
        q('[data-race-finish]').hidden=!completed;
        g.setStatus(completed?input.phase===1?'前段完成・接原典':'抵達函谷關外':review?'查看安排後果':'軍務'+(race.cursor+1)+' / 5');
      };
      const showEvent=()=>{
        if(review){q('[data-race-stage-label]').textContent='查看安排後果';q('[data-race-title]').textContent='軍務已下令';q('[data-race-text]').textContent='讀完回報再繼續；每項安排與資源變化都已保存。';refresh();return;}
        if(race.cursor>=stop){completed=true;review=false;q('[data-race-stage-label]').textContent='本段完成';q('[data-race-title]').textContent=input.phase===1?'新安之前，先讀原典':'抵函谷關，先讀軍報';q('[data-race-text]').textContent=input.phase===1?'行程與補給會接到後段；中間的新安事件固定必經。':'行程到關外。回主線讀原文，再親自傳令完成入關；兩段只計一份成績。';q('[data-race-finish]').textContent=input.phase===1?'保留行程，回到新安主線':'保留行程，讀函谷軍報';refresh();return;}
        if(!event)event=RACE_EVENTS.find(e=>e.id===race.sequence[race.cursor]);
        q('[data-race-stage-label]').textContent='第'+(race.cursor+1)+'項・'+RACE_STAGES[race.cursor];
        q('[data-race-title]').textContent=short()?'補給與隊伍需要整理':event.title;
        q('[data-race-text]').textContent=short()?'糧或軍心不足。先由你安排補給，付出延誤代價後，再完成這項軍務。':event.text;
        refresh();
      };
      const act=id=>{
        if(gameBlocked()||stopped||completed||review||short())return;
        const report=raceAction(race,event,id);reports.push(report);q('[data-race-report]').textContent=report+' 軍心'+race.meters.heart+'、糧'+race.meters.grain+'、威名'+race.meters.fame+'。';
        event=null;review=true;refresh();persist();
      };
      const resupply=id=>{
        if(gameBlocked()||stopped||completed||review||!short())return;
        const extra=id==='rest'?1:2,d=id==='rest'?{grain:36,heart:24,fame:-3}:{grain:46,heart:12,fame:1};
        Object.keys(d).forEach(k=>race.meters[k]=bounded(race.meters[k]+d[k]));
        race.delay+=extra;race.rounds=race.cursor+race.delay;race.aid++;race.score=Math.max(0,10-race.delay*2);race.gap=2+race.delay;
        const report='你安排'+(id==='rest'?'整隊籌糧':'集中轉運')+'，補給已到；額外延誤'+extra+'回合，仍需完成原軍務。';reports.push(report);q('[data-race-report]').textContent=report;review=true;refresh();persist();
      };
      body.querySelectorAll('[data-race-action]').forEach(b=>listen(b,'click',()=>act(b.dataset.raceAction)));
      body.querySelectorAll('[data-race-aid]').forEach(b=>listen(b,'click',()=>resupply(b.dataset.raceAid)));
      listen(q('[data-race-next]'),'click',()=>{if(!review||stopped)return;review=false;q('[data-race-report]').textContent='';showEvent();persist();});
      listen(q('[data-race-finish]'),'click',()=>{if(!completed||stopped)return;stopped=true;resolve({completed:true,passed:true,score:race.score,max:10,race:race,reports:reports});});
      listen(document,'keydown',e=>{if(gameBlocked()||e.target.closest('input,textarea,select'))return;if(e.key==='Enter'&&(review||completed)){e.preventDefault();q(completed?'[data-race-finish]':'[data-race-next]').click();return;}const index=Number(e.key)-1;if(index<0||index>3||!Number.isInteger(index))return;e.preventDefault();if(short()){if(index<2)resupply(index===0?'rest':'transport');}else act(RACE_ACTIONS[index].id);});
      g.onCleanup(()=>{stopped=true;});showEvent();if(restored?.report)q('[data-race-report]').textContent=restored.report;refresh();persist();
    });
  }



  // ═════════════════════════ 7. 結局 ═════════════════════════
  const ENDINGS = {
    great: { id: 'great', title: '威震諸侯', good: true, text: '此局九戰功成，軍威益振；沛公先入，懷王之約猶在。' },
    good: { id: 'good', title: '破釜沉舟', good: true, text: '此局親成渡河與九戰，復率軍西行；勇戰之外，尚有先定之約。' },
    bad: { id: 'bad', title: '三日糧盡', good: false, text: '此局限時糧盡，得輔助而卒成九戰；史載楚勝，宜察軍需之失。' }
  };
  function onEnd(result, ctx) {
    const s = ctx.state;
    const e = ENDINGS[(result && result.key) || 'good'] || ENDINGS.good;
    ZH.sfx('seal');
    return ctx.banner(e.title, '鉅鹿與入關・終')
      .then(() => ctx.say([{ who: 'shiguan', expr: 'normal', text: '劉邦已先定關中。你的本局評語留下軍令、補給與突破的體驗。' }, { text: '新安的政治影響，請在反思時連結秦人的處境。' }]))
      .then(() => JL.finish(payload(s, e)));
  }
  function payload(s, ending) {
    const f = s.flags || {}, v = s.vars || {}, nine = v.nine || {}, race = v.raceFirst || v.race || {};
    const planning = [f.campCare === 'share', f.vanguard === 'report', f.ration === 'count', f.reception === 'rest', f.siegeSupply === 'ration', f.surrenderPrep === 'count'].filter(Boolean).length / 6;
    const care = [f.campCare === 'share', f.vanguard === 'report', f.ration === 'count', f.reception === 'rest', f.resupply === 'share', f.gateOrder === 'order'].filter(Boolean).length / 6;
    const deeds = ['少志萬人敵，既觀始皇，言欲取而代之。', '定陶軍敗，從宋義北救趙，軍留安陽。'];
    deeds.push(f.campCare === 'share' ? '此局分糧避雨，以恤同行之卒。' : '此局先保糧袋，士卒有勞。');
    deeds.push('斬宋義，既掌軍權，悉引兵渡河，沈船破釜。');
    deeds.push(nine.assisted ? '此局三日糧為限，得輔助而親成九處之役。' : '此局三日糧為限，九處之役皆成。');
    deeds.push('史載九戰絕甬道，諸侯膝行，皆屬項羽。');
    deeds.push(f.resupply === 'share' ? '此局分隊籌糧，輪營而西。' : '此局急催糧運，集軍而西。');
    deeds.push('與章邯約降，率軍西行，至新安。');
    deeds.push('史載新安之事，當察降卒與秦人之情。');
    deeds.push('至函谷不得入，聞沛公已破咸陽，大怒，遂入而軍戲西。');
    deeds.push(f.review === 'battle' ? '此局復察戰中糧與退路，思勇決之用。' : '此局復察行軍遲速，思軍功與先定之約。');
    return {
      scenarioId: SID, mode: MODE, faction: '楚', role: '項羽', roleKind: 'benji', country: '楚',
      bioTitle: '項羽本紀', bioOpening: '項籍者，下相人也，字羽。', ending: ending,
      scoreStrategy: bounded(planning * 30 + (nine.score || 0) / (nine.max || 100) * 30 + (race.score || 0) / (race.max || 100) * 40),
      scoreVirtue: bounded(care * 80 + Math.min(1, (race.care || 0) / 5) * 20),
      turns: s.steps || 1, durationSec: Math.min(5400, Math.max(0, Math.round((Date.now() - (s.startedAt || Date.now())) / 1000))),
      deeds: deeds, anchors: s.anchors, games: s.games, codex: s.codex,
      opener: '遊戲生成史官評語：余讀〈項羽本紀〉，至破釜沈舟，歎其勇決，亦察糧運、降卒與先定之約。',
      prompts: [
        '破釜沉舟適合用在什麼處境？請用九戰的補給壓力，說明下決心前應確認哪些資源與風險。',
        '諸侯為何作壁上觀？請從各軍利害、風險與合作條件說明，再連結一次現代團隊經驗。',
        '新安之事如何影響項羽取得秦人支持？請區分原句記載與你的政治影響分析，思考軍威和信任的關係。'
      ]
    };
  }

  // ═════════════════════════ 8. 開始（沿用官方範例） ═════════════════════════

  const saveState = JL.saveState;

  function startGame(saved) {
    if(saved)JL.useState(saved);else JL.newRun();
    document.documentElement.classList.toggle('hm-still',JL.read('still',false));
    ROOT.innerHTML = '';
    const game = ZH.story.create(ROOT, {
      id: SID, mode: MODE, title: META.name, subtitle: META.episode,
      seed: Number(params.seed) || 0, start: 'n_01',
      characters: CHARACTERS, meters: METERS, nodes: ZH.character?.chuhanNodes(SID,NODES,()=>game.save())||NODES, help: HELP,
      initState:()=>({_ocChapter:ZH.character?.newChapterState(SID)}),
      anchorTotal: ANCHOR_ORDER.length, anchorOrder: ANCHOR_ORDER,
      onEnd: onEnd, save: saveState, snapshot:JL.snapshot, anchorRunner:JL.runAnchor, onProgress:JL.cacheProgress, actions:[{label:"史冊",run:JL.book},{label:"存檔",run:JL.saveMenu}]
    });
    window.__ep = game;
    game.start(saved?ZH.character?.applyChapterChoice(SID,saved)||saved:null);
  }

  function renderTitle(saved) {
    const vol = ZH.VOLUMES.find(v => v.key === META.vol) || { no: '', name: '' };
    const st = saved && saved.engine;
    const btn = (a, label, primary) => '<button type="button" class="zh-btn ' + (primary ? 'zh-btn--primary' : 'zh-btn--quiet') + ' zh-btn--block" data-a="' + a + '">' + esc(label) + '</button>';
    ROOT.innerHTML =
      '<div class="ep-title" style="--ep-color:' + esc(ROLE.color) + '">' +
      '<div class="ep-title__bar"><a class="zh-mark" href="#" data-a="home"><span class="zh-mark__re">Re:</span><span class="zh-mark__name">縱橫鼎業</span></a>' +
      '<button type="button" class="zh-btn zh-btn--quiet zh-btn--sm" data-a="home">回首頁</button></div>' +
      '<main class="ep-title__main"><header>' +
      '<p class="ep-kicker">' + esc([vol.no + ' ' + vol.name, ZH.episodeLabel(META), '前 ' + META.year + ' 年'].join('・')) + '</p>' +
      '<h1 class="ep-h1">' + esc(META.name) + '</h1>' +
      '<p class="ep-episode">' + esc(META.episode) + '</p>' +
      '<div class="ep-chips">' + (META.guest ? '<span class="zh-chip zh-chip--gilt">訪客開放</span>' : '') +
      '<span class="zh-chip zh-chip--patina">' + esc(META.genre) + '</span>' +
      '<span class="zh-chip">自動存檔</span></div>' +
      (ZH.isGuest() ? '<p class="ep-note" style="margin-top:12px">你目前是訪客：可以完整遊玩，但進度只保存在這個分頁，也不會留下成績。</p>' : '') +
      '</header><section class="jl-title-scene" aria-label="楚軍營地與本話人物">'+ART.scene('camp',{tod:'dusk',banner:'#a5412e',glyph:'楚'})+'<div class="jl-title-cast">'+['xiangyu','songyi','zhanghan'].map(id=>'<span>'+ART.portrait(CHARACTERS.find(c=>c.id===id),{expr:'serious'})+'</span>').join('')+'</div></section>' +
      '<section class="ep-start"><span class="ep-seal" aria-hidden="true">' + esc(ROLE.glyph) + '</span>' +
      '<div><h2 class="ep-start__name">' + esc(ROLE.name) + '・' + esc(ROLE.title) + '</h2><p class="ep-start__lead">' + esc(ROLE.lead) + '</p></div>' +
      '<div class="ep-start__act">' + (st ? btn('continue', st.ended ? '查看結局' : '繼續', true) + btn('new', '重新開始', false) : btn('new', '開始遊戲', true)) + '</div></section>' +
      '<section class="ep-points" aria-label="本話重點">' + POINTS.map(p => '<div class="ep-point"><b>' + esc(p.title) + '</b><span>' + esc(p.text) + '</span></div>').join('') + '</section>' +
      '<p class="ep-note">本話共 ' + ANCHOR_ORDER.length + ' 個史實錨點。中途離開會自動存檔。</p>' +
      '</main></div>';
    const characterEntry=document.createElement('div');characterEntry.setAttribute('data-character-entry','');ROOT.querySelector('.ep-start').after(characterEntry);ZH.character?.mountEntry(characterEntry,SID,st);
    ROOT.querySelectorAll('[data-a="home"]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); ZH.go('hub'); }));
    const cont = ROOT.querySelector('[data-a="continue"]');
    if (cont) cont.addEventListener('click', () => { ZH.sfx('click'); startGame(st); });
    ROOT.querySelector('[data-a="new"]').addEventListener('click', () => {
      ZH.sfx('click');
      if (!st) { startGame(null); return; }
      ZH.modal({
        title: '重新開始？', body: '<p>目前的進度會清除，從頭開始。</p>',
        actions: [{ label: '取消', value: false, kind: 'quiet' }, { label: '重新開始', value: true, kind: 'primary' }]
      }).then(ok => { if (ok) ZH.deleteSave(SID, MODE).catch(() => null).then(() => startGame(null)); });
    });
  }

  const loadSave = JL.loadState;

  ZH.ready(() => {
    if(!ZH.story?.createJournal||!ZH.arena||!window.ART){ROOT.innerHTML='<main class="ep-title__main"><h1>共用核心待更新</h1><p>請先安裝 Eng_Story v0.2.2、Arena_js 與 Art_kit，再開啟第三話。</p><button class="zh-btn zh-btn--primary" data-home>回首頁</button></main>';ROOT.querySelector('[data-home]').onclick=()=>ZH.go('hub');return;}
    ZH.loading(true, '展開竹簡');
    ZH.codex.init();
    Promise.all([loadSave(), anchorsReady]).then(([saved]) => {
      ZH.loading(false);
      // 從首頁「繼續遊戲」帶著模式進來：直接接續
      if (String(params.mode || '') === MODE && saved) { startGame(saved.engine); return; }
      renderTitle(saved);
    });
  });
})();

</script>
