<script>(function(w){'use strict';
const clone=x=>JSON.parse(JSON.stringify(x)),clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function create(c,saved,seed=20261016){
 if(!c||c.mode!=='replace')throw Error('尚未登錄文本玩法。');
 if(saved&&(saved.v!==3||saved.id!==c.id||saved.kind!==c.kind))throw Error('這份挑戰存檔屬於另一套規則，請保留備份後重新開始此活動。');
 const s=saved?clone(saved):{v:3,id:c.id,kind:c.kind,phase:'brief',seed:seed>>>0,time:0,turn:0,stage:0,selected:[],events:[],answers:[],mistakes:0,assisted:false,message:c.goal,first:null,read:[],actionScore:0};
 const log=(type,extra={})=>{s.events.push({type,t:+s.time.toFixed(2),...extra});if(s.events.length>300)s.events.shift();};
 function freeze(){if(!s.first)s.first={score:score(),max:10,passed:score()>=7};}
 function score(){if(['argument','diplomacy','debate','intel','hearing','chorus','parity'].includes(c.kind))return Math.round(10*s.answers.filter(x=>x.firstRight).length/Math.max(1,(c.rounds||parityRounds()).length));if(c.kind==='music')return Math.round(10*s.answers.filter(x=>x.firstRight).length/c.pairs.length);if(c.kind==='horses')return s.wins>=2?10:s.wins===1?5:0;if(c.kind==='debt')return Math.round(10*s.answers.filter(x=>x.firstRight).length/(c.households.length*2));let progress=1;if(s.phase!=='complete'){if(c.kind==='tactics')progress=s.stage/c.phases.length;else if(c.kind==='journey')progress=s.found.length/Math.max(1,c.scenes.reduce((n,x)=>n+x.items.length,0));else if(c.kind==='assault'||c.kind==='raid')progress=(s.stage+(s.cart?.hp===0?.5:0))/(c.segments||3);else if(c.kind==='ambush')progress=(s.day||0)/4;else if(c.kind==='land')progress=((s.inspected||[]).length+(s.boundaries||[]).filter(Boolean).length)/7;else if(c.kind==='siege')progress=(Number(s.contact?.han)+Number(s.contact?.wei)+Number(s.coordinated)+Number(s.gate))/5;else if(c.kind==='league'||c.kind==='recovery'||c.kind==='changping')progress=s.turn/(c.periods||c.rounds||4);}return clamp(Math.round(10*progress-s.mistakes*.8-(s.damage||0)/60),0,10);}
 function finish(text){s.phase='complete';s.message=text||c.reason;freeze();log('complete',{score:s.first.score});}
 function report(text,next='play'){s.phase='report';s.report=text;s.after=next;log('consequence',{text});}
 function parityRounds(){return[
 {prompt:'秦御史寫「令趙王鼓瑟」，哪兩項構成問題？',quote:'令趙王鼓瑟。',cards:['秦王發令、趙王演奏','記錄呈現上下命令關係','只是兩人一起練節拍','秦王已替趙王奏樂'],answers:[0,1],reply:'奏樂本身之外，御史用字留下地位不對等。'},
 {prompt:'相如要如何回應，才能建立對等？',quote:'請奏盆缻秦王，以相娛樂。',cards:['請秦王為趙王擊缻','由趙御史記錄對等關係','叫趙王繼續獨奏','相如自己代秦王擊缻'],answers:[0,1],reply:'秦王為一擊缻。這裡只操作一次擊缻，並保留雙方記錄。'},
 {prompt:'趙御史應寫下哪兩項？',quote:'某年月日，秦王為趙王擊缻。',cards:['演奏者是秦王','受奏者是趙王','趙王奉秦王命再鼓瑟','把相如寫成秦王'],answers:[0,1],reply:'對等記錄完成，回到外交與軍事準備相互支撐的原段。'}];}
 const proofKinds=['argument','diplomacy','debate','intel','hearing','chorus','parity'];
 function current(){if(proofKinds.includes(c.kind))return(c.rounds||parityRounds())[s.turn];if(c.kind==='music')return c.pairs[s.turn];if(c.kind==='tactics')return c.phases[s.stage];return null;}
 function shuffleProof(){const r=current();s.cardOrder=r?.cards?r.cards.map((_,i)=>i):[];for(let i=s.cardOrder.length-1;i>0;i--){s.seed=(Math.imul(s.seed,1664525)+1013904223)>>>0;const j=Math.floor(s.seed/4294967296*(i+1));[s.cardOrder[i],s.cardOrder[j]]=[s.cardOrder[j],s.cardOrder[i]];}}
 function setup(){s.phase='play';s.selected=[];s.attempted=false;
  if(proofKinds.includes(c.kind)){shuffleProof();s.role=c.actor;if(c.kind==='chorus'){s.heard=s.heard||[];s.focus=-1;}return;}
  if(c.kind==='music'){s.phase='music';s.musicTime=0;s.notes=Array.from({length:c.notes||16},(_,i)=>({lane:(i*2+Math.floor(i/4))%5,due:1+i*.45,resolved:false,hit:false}));s.hits=0;s.held={};return;}
  if(c.kind==='horses'){s.phase='stable';s.pairing=[null,null,null];s.used=[];s.races=[];s.wins=0;s.race=0;return;}
  if(c.kind==='league'){s.resources=clone(c.resources);s.support={};s.turn=0;s.actions=[];s.doneCountries=[];return;}
  if(c.kind==='recovery'){s.resources={food:30,people:50,army:10,alert:20};s.allocation=[0,0,0,0];s.history=[];s.reserves=0;return;}
  if(c.kind==='land'){s.source=16;s.canals=[16];s.inspected=[];s.boundaries=[false,false,false];s.targets=[1,15,37];s.selectedHouse=0;s.work=22;s.tool='inspect';return;}
  if(c.kind==='siege'){s.resources={wall:46,water:30,food:26,morale:40};s.contact={han:false,wei:false};s.coordinated=false;s.gate=false;s.actions=[];s.usedActions=0;return;}
  if(c.kind==='changping'){s.resources={food:35,morale:50,rumor:45};s.allocation=[0,0,0];s.checked=false;s.history=[];return;}
  if(c.kind==='debt'){s.stage=0;s.turn=0;s.matched=false;s.actions=[];s.support=0;s.receipts=0;return;}
  if(c.kind==='ambush'){s.stage=0;s.day=0;s.cooks=null;s.cookHistory=[];s.confidence=0;s.tactical=null;return;}
  if(c.kind==='journey'){s.inventory=[];s.found=[];s.caught=0;s.callCount=0;world();return;}
  if(c.kind==='assault'||c.kind==='raid'){s.prepared=c.kind!=='raid';s.preparation=[];s.hp=100;s.damage=0;s.grain=100;s.stage=0;battle();return;}
  if(c.kind==='tactics'){s.stage=0;s.damage=0;tactical();return;}
  throw Error('玩法尚未實作：'+c.kind);
 }
 function world(){const sc=c.scenes[s.stage];s.phase='play';s.player={x:55,y:365,dir:1};s.path=[];s.localFound=[];s.interacting=null;s.callCount=0;s.callCharge=0;s.callReleased=true;s.sceneTime=0;s.alert=0;s.checkpoint={x:55,y:365};s.walls=s.stage%2?[{x:270,y:110,w:75,h:205},{x:525,y:265,w:80,h:80}]:[{x:290,y:160,w:75,h:190},{x:510,y:50,w:95,h:90}];const locations=[[205,100],[440,240],[665,95],[655,330]];s.items=sc.items.map((v,i)=>({...v,id:s.stage+':'+i,x:locations[i][0],y:locations[i][1]}));s.exit={x:750,y:370};s.guards=sc.stealth?[{x:385,y:75,a:0,t:0,range:125},{x:600,y:270,a:Math.PI,t:2,range:110}]:[];s.message=sc.goal;}
 function tactical(){s.phase='play';s.localTime=0;s.holdTime=0;s.command='move';s.selectedUnit=0;s.lured=false;s.atTarget=null;s.orderFlags={};const n=c.allies||4,navy=c.naval;s.units=Array.from({length:n},(_,i)=>({id:i,name:navy?['旗船','前船','接應船','後船'][i]:c.id==='hf_lianjun'?['燕軍','趙軍','魏軍','韓軍','秦軍'][i]:['主隊','北翼','南翼',c.id==='xo_ambush'?'姜戎':'後備'][i],x:navy?650:120+i*30,y:90+i*72,hp:100,target:null,order:'hold'}));s.enemies=Array.from({length:3},(_,i)=>({id:i,x:625,y:145+i*75,hp:100}));s.message=current().goal;}
 function battle(){s.phase=s.prepared?'play':'prepare';s.player={x:70,y:380,vy:0,dir:1,ground:true,stamina:100,cool:0,block:false};s.cart={x:500,y:380,hp:90};s.escort={x:30,y:380,go:false};s.enemies=[{x:350,y:380,hp:65,mode:'watch',t:1.3},{x:680,y:380,hp:70,mode:'watch',t:2}];s.projectiles=[];s.localTime=0;s.message=c.kind==='raid'?'牛群突破後，步卒須接上缺口。':'分隊突破甬道後，後隊才有通路接上。';}
 function start(){if(s.phase!=='brief')return false;setup();log('start');return true;}
 function select(index){if(s.phase!=='play'||!proofKinds.includes(c.kind)||!Number.isInteger(index)||index<0||index>=current().cards.length)return false;const at=s.selected.indexOf(index);if(at>=0)s.selected.splice(at,1);else s.selected.push(index);log('select',{index});return true;}
 function submit(){if(s.phase!=='play'||!proofKinds.includes(c.kind))return false;const r=current();if(c.kind==='chorus'&&(s.heard||[]).length<4){s.message='先轉向聽四方的楚音，再判讀項羽的驚疑。';return false;}if(s.selected.length!==r.answers.length){s.message='請把兩張能共同支持說明的材料放入論證。';return false;}const right=s.selected.length===r.answers.length&&r.answers.every(i=>s.selected.includes(i));if(!s.attempted){s.answers.push({turn:s.turn,firstRight:right,selected:s.selected.slice()});s.attempted=true;}if(!right){s.mistakes++;s.message='材料尚未接上問題。請比較可觀察事實、人物判斷與過度推論；首次選擇保留。';log('revise',{turn:s.turn});return false;}s.lastProof=s.selected.map(i=>r.cards[i]);report(r.reply,'proofNext');return true;}
 function next(){if(s.phase!=='report')return false;const after=s.after;s.phase='play';s.after=null;
  if(after==='proofNext'){s.turn++;s.selected=[];s.attempted=false;if(s.turn===(c.rounds||parityRounds()).length)finish(current()?.reply||c.reason);else{shuffleProof();if(c.kind==='parity'&&s.turn===2){s.phase='strikeOnce';s.beatTime=0;}}return true;}
  if(after==='tacticNext'){s.stage++;if(s.stage===c.phases.length)finish('各路軍令已相互接上。'+c.reason);else tactical();return true;}
  if(after==='worldNext'){s.stage++;if(s.stage===c.scenes.length)finish(c.reason);else world();return true;}
  if(after==='battleNext'){s.grain=Math.max(0,(s.grain??100)-15);s.stage++;if(s.stage===(c.segments||3))finish(c.reason);else battle();return true;}
  if(after==='ambushDeploy'){deploy();return true;}
  if(after==='ambushDone'){finish('竈跡誘敵與兩側伏兵接合；不是把敵軍實際兵力減為三萬。');return true;}
  if(after==='musicNext'){s.turn++;s.selected=[];s.attempted=false;if(s.turn===c.pairs.length)finish('樂章與評語已接合；節奏表現另列，不代替觀樂理解。');return true;}
  if(after==='debtNext'){s.turn++;s.matched=false;if(s.turn===c.households.length){if(s.stage===0){s.stage=1;s.turn=0;report('《戰國策》以債賜民、燒券。接下來另開《史記》對讀，不能把兩篇的做法拼回同一段。','debtCompare');}else finish('兩篇處理方式分開記錄，市義仍須連到後來薛民迎接。');}return true;}
  if(after==='debtCompare')return true;
  if(after==='periodNext'){s.turn++;s.allocation=c.kind==='recovery'?[0,0,0,0]:[0,0,0];s.checked=false;if(s.turn>=(c.periods||c.rounds||4))finish(c.kind==='recovery'?'恢復、養民、訓練與事吳留下實際取捨；教學期不換成史實年數。':'軍需與消息已分開查核；換將與戰敗仍回原文讀其決策責任。');return true;}
  if(after==='siegeNext')return true;
  if(after==='leagueNext'){s.turn++;if(s.turn>=c.countries.length)finish('主盟靠救援、安置、守約與調停累積；九合不等於九國領土。');return true;}
  return true;
 }
 function act(name,value){if(s.phase==='complete'||s.phase==='brief'||s.phase==='report')return false;
  if(name==='listen'&&c.kind==='chorus'){const i=Number(value);if(i<0||i>3)return false;if(!s.heard.includes(i))s.heard.push(i);s.focus=i;s.message=['東面楚音','南面楚音','西面楚音','北面楚音'][i]+'：耳熟的鄉音從漢軍包圍處傳來。';log('hear',{direction:i});return true;}
  if(name==='strikeOnce'&&s.phase==='strikeOnce'){s.actionScore=Math.abs(s.beatTime%2-1)<.4?10:5;s.phase='play';s.message='秦王為一擊缻。接著讓趙御史記下對等關係。';log('oneStrike');return true;}
  if(c.kind==='music'){if(s.phase==='music'&&name==='note'){const lane=Number(value),note=s.notes.find(n=>!n.resolved&&n.lane===lane&&Math.abs(n.due-s.musicTime)<.22);if(note){note.hit=note.resolved=true;s.hits++;}log('note',{lane,hit:!!note});return true;}if(s.phase==='play'&&name==='pair'){const i=Number(value);const right=i===s.turn;if(!s.attempted){s.answers.push({turn:s.turn,firstRight:right});s.attempted=true;}if(!right){s.mistakes++;s.message='評語還未對上這一樂章。看關鍵字與所論政治，再試一次。';return false;}report(c.pairs[i][0]+'：'+c.pairs[i][1]+'。節奏分與對讀分已分開。','musicNext');return true;}}
  if(c.kind==='horses'){if(s.phase==='stable'&&name==='horse'){const [slot,horse]=value;if(![slot,horse].every(i=>Number.isInteger(i)&&i>=0&&i<3))return false;const old=s.pairing.indexOf(horse);if(old>=0)s.pairing[old]=null;s.pairing[slot]=horse;return true;}if(s.phase==='stable'&&name==='race'&&s.pairing.every(x=>x!==null)){s.phase='race';s.localTime=0;s.pace=0;s.race=0;return true;}if(s.phase==='race'&&name==='pace'){s.pace++;return true;}if(s.phase==='raceReport'&&name==='nextRace'){s.race++;if(s.race===3)finish(s.wins>=2?'一不勝而再勝；配馬改變整組結果。':'本次整組未勝兩場；請比較下對上、上對中、中對下的安排。');else{s.phase='race';s.localTime=0;s.pace=0;}return true;}}
  if(c.kind==='league'&&name==='policy'){const target=c.countries[s.turn],correct=value===target[2];if(!s.actions.includes(s.turn)){s.actions.push(s.turn);if(!correct)s.mistakes++;}s.doneCountries.push({name:target[0],policy:value,correct});s.support[target[0]]=correct?'願參與主盟':'仍有疑慮';s.resources.信義=clamp(s.resources.信義+(correct?2:-1),0,20);s.resources.兵力=clamp(s.resources.兵力-(value==='救援'?2:1),0,20);report(correct?target[0]+'的處境得到回應，信用因履行行動增加。':target[0]+'眼前需要'+target[2]+'，這次行動未解決主要困難。下一國仍須重看情勢。','leagueNext');return true;}
  if(['recovery','changping'].includes(c.kind)&&name==='allocate'){const [i,delta]=value;if(!Number.isInteger(i)||i<0||i>=s.allocation.length||![1,-1].includes(delta))return false;const used=s.allocation.reduce((a,b)=>a+b,0);if(delta===1&&used>=6||delta===-1&&s.allocation[i]<=0)return false;s.allocation[i]+=delta;return true;}
  if(c.kind==='recovery'&&name==='period'){if(s.allocation.reduce((a,b)=>a+b,0)!==6){s.message='六份人力都須親自安排。';return false;}const [farm,care,train,serve]=s.allocation,r=s.resources;r.food=clamp(r.food+farm*4-serve*2-5,0,150);r.people=clamp(r.people+care*2-Number(r.food<15)*4,0,100);r.army=clamp(r.army+train*6,0,100);r.alert=clamp(r.alert+train*9+2-serve*8,0,100);if(r.food<15||r.people<45||r.alert>=75)s.mistakes++;s.history.push({period:s.turn,allocation:s.allocation.slice(),...clone(r)});report('糧 '+r.food+'，民生 '+r.people+'，整備 '+r.army+'，吳方戒心 '+r.alert+'。'+(serve?'事吳耗去物資，也降低戒心。':'未安排事吳，訓練更容易引起注意。')+(care?'休養使民生恢復。':'本期沒有休養投入。'),'periodNext');return true;}
  if(c.kind==='changping'&&name==='check'){s.checked=true;s.resources.rumor=Math.max(0,s.resources.rumor-12);s.message='「秦獨畏趙括」是敵方反間內容；轉述不等於查證趙括能代廉頗。';log('rumorChecked');return true;}
  if(c.kind==='changping'&&name==='period'){if(s.allocation.reduce((a,b)=>a+b,0)!==6)return false;const [supply,rest,verify]=s.allocation,r=s.resources;r.food=clamp(r.food+supply*5-8,0,100);r.morale=clamp(r.morale+rest*4-4-Number(r.food<15)*8,0,100);r.rumor=clamp(r.rumor+10-verify*5-(s.checked?6:0),0,100);if(!s.checked||r.food<15)s.mistakes++;s.history.push({allocation:s.allocation.slice(),checked:s.checked,...clone(r)});report('守軍供應 '+r.food+'、士氣 '+r.morale+'、未澄清消息 '+r.rumor+'。'+(s.checked?'反間已辨明，是否採信與換將是君主決策。':'未查核的轉述仍可能影響決策。')+(s.turn===3?'原段接續換將與戰敗，遊戲不以配糧高分改成趙勝。':''),'periodNext');return true;}
  if(c.kind==='siege')return siegeAct(name,value);
  if(c.kind==='land')return landAct(name,value);
  if(c.kind==='debt'){if(name==='match'){s.matched=true;s.message='券契相合，先確認債項；這一步尚未決定如何處理。';return true;}if(name==='debt'){if(!s.matched)return false;const h=c.households[s.turn],right=s.stage===0?value==='grant':value===(h.ability?'term':'burn');if(!s.attempted){s.answers.push({stage:s.stage,house:s.turn,firstRight:right});s.attempted=true;}if(!right){s.mistakes++;s.message=s.stage===0?'本段《戰國策》寫以債賜民、燒券，不能換成按貧富催收。':'《史記》此處有餘者約期、貧者燒券；請分清版本。';return false;}s.attempted=false;if(value==='term')s.receipts++;else s.support++;report((s.stage===0?'《戰國策》：託命以債賜民，燒券。':'《史記》：'+(h.ability?'與有餘者約期。':'為無力者燒券。'))+'兩篇成效分開，不能填回另一篇原文。','debtNext');return true;}}
  if(c.kind==='ambush')return ambushAct(name,value);
  if(c.kind==='tactics')return tacticalAct(name,value);
  if(c.kind==='journey')return worldAct(name,value);
  if(c.kind==='assault'||c.kind==='raid')return battleAct(name,value);
  return false;
 }
 function siegeAct(name){const r=s.resources;
  if(!['day','reverse'].includes(name)&&s.usedActions>=2){s.message='本日兩道安排已用，推進一日讀城況後再接續。';return false;}
  if(name==='repair'&&r.food<2||name==='feed'&&r.food<3){s.message='糧食不足，不能空付修防或分糧承諾。';return false;}
  if(name==='reverse'&&s.turn<2){s.message='先經歷守城與密談的兩個行動期，再共同反制。';return false;}
  if(name==='repair'){r.wall=Math.min(80,r.wall+12);r.food=Math.max(0,r.food-2);s.actions.push('repair');}
  else if(name==='feed'){r.morale=Math.min(90,r.morale+14);r.food=Math.max(0,r.food-3);s.actions.push('feed');}
  else if(name==='han'||name==='wei'){s.contact[name]=true;s.message='向'+(name==='han'?'韓':'魏')+'說明趙亡後共同受威脅，接上共同利害。';}
  else if(name==='coordinate'){if(!s.contact.han||!s.contact.wei){s.message='韓魏尚未共同答應，不能跳過密談直接反灌。';return false;}s.coordinated=true;s.message='約定城內外接應時機，密約成立。';}
  else if(name==='gate'){if(!s.coordinated){s.message='先確認韓魏接應，避免單獨開水道。';return false;}s.gate=true;}
  else if(name==='reverse'){if(!s.gate||!s.coordinated)return false;finish('韓魏與趙內外相應，反灌接到共同反制。先守城安民，才能爭取合力的機會。');return true;}
