<script>
(function(ZH){
 'use strict';
 function draw(ctx,w,t,images){
  const A=ZH.adventureModel,progress=A.progress(w),cfg=t.adventure;
  const rect=(x,y,ww,h,fill,stroke)=>{ctx.beginPath();ctx.roundRect(x,y,ww,h,8);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke();}};
  const text=(s,x,y,color='#ffe4a8',size=17)=>{ctx.font='bold '+size+'px "PingFang TC",sans-serif';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='#10222b';ctx.strokeText(s,x,y);ctx.fillStyle=color;ctx.fillText(s,x,y);};
  const circle=(x,y,r,fill,stroke)=>{ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=3;ctx.stroke();}};
  function actor(x,y,img,color,label,scale=1){const bob=Math.sin(w.time*8+x)*2;ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.fillStyle='#06131f77';ctx.beginPath();ctx.ellipse(0,12,26,9,0,0,Math.PI*2);ctx.fill();if(img&&img.complete&&img.naturalWidth){ctx.drawImage(img,-31,-69+bob,62,86);}else{circle(0,-32,15,color,'#f0d298');rect(-20,-15,40,35,color,'#d8bd7c');}if(label)text(label,0,43,'#fff1cc',15);ctx.restore();}
  ctx.clearRect(0,0,1000,560);
  if(images.scene&&images.scene.complete&&images.scene.naturalWidth)ctx.drawImage(images.scene,0,0,1000,560);else{ctx.fillStyle='#28474d';ctx.fillRect(0,0,1000,560);}
  const shade=ctx.createLinearGradient(0,0,0,560);shade.addColorStop(0,'#0b172966');shade.addColorStop(.45,'#142c3a45');shade.addColorStop(1,'#091d32b8');ctx.fillStyle=shade;ctx.fillRect(0,0,1000,560);
  rect(26,22,948,62,'#0a1d2bce','#d7bd7166');text(cfg.rival,500,47,'#efd9a1',19);text(progress.text,500,71,'#c5dad4',16);
  rect(115,100,770,11,'#a1645044');rect(115,100,Math.max(2,770*Math.min(1,progress.me)),11,'#d6bd6c');
  ctx.strokeStyle='#b1b9a455';ctx.strokeRect(45,140,910,375);
  if(w.type==='clash'){
   const b=w.boss;
   if(b.state==='tell'){
    const pulse=.5+Math.sin(w.time*15)*.15;
    if(b.pattern===0){ctx.strokeStyle='rgba(255,113,84,'+pulse+')';ctx.lineWidth=70;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.aim.x,b.aim.y);ctx.stroke();circle(b.aim.x,b.aim.y,37,'#e87c6266','#ffc19e');}
    else if(b.pattern===1)circle(b.x,b.y,w.assist?140:180,'#ec765c33','#fba580');
    else{ctx.strokeStyle='#f4ae78';for(let i=-b.phase;i<=b.phase;i++){const a=Math.atan2(b.aim.y-b.y,b.aim.x-b.x)+i*.24;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x+Math.cos(a)*280,b.y+Math.sin(a)*280);ctx.stroke();}}
    text('蓄力 '+Math.max(0,b.clock).toFixed(1),b.x,b.y-100,'#ffd7b6',19);
   }
   actor(b.x,b.y,images.npc,'#a86e65',b.state==='recover'?'破綻！':b.state==='rush'?'衝鋒':'第 '+b.phase+' 勢',1.2);
   rect(b.x-50,b.y-88,100,8,'#342b34');rect(b.x-50,b.y-88,100*b.hp/b.maxHp,8,'#e99b78');
   for(const p of w.bolts)circle(p.x,p.y,9,'#f2a171','#ffdc9c');
  }else if(w.type==='race'){
   ctx.setLineDash([8,11]);ctx.strokeStyle='#e3c88870';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(130,400);w.route.forEach(p=>ctx.lineTo(p.x,p.y));ctx.stroke();ctx.setLineDash([]);
   for(const b of w.walls)rect(b.x,b.y,b.w,b.h,'#32483fe8','#d7be87');
   w.route.forEach((p,i)=>{const active=i===w.next%w.route.length;circle(p.x,p.y,active?31:18,active?'#e8c16a99':'#b3c6b833',active?'#fff2b8':'#a9bba466');text(String(i+1),p.x,p.y+6,active?'#fff9d2':'#c4d1bb',18);if(active)text('下一路標',p.x,p.y-40,'#ffe79f');});
   for(const h of w.hazards)circle(h.x,h.y,h.r,'#ad695ce3','#e9b393');
   actor(w.rival.x,w.rival.y,images.npc,'#ae7569',w.rival.slow>0?'受牽制':w.rival.next+1<w.next?'追趕中':'對手');text('第 '+(Math.min(1,Math.floor(w.next/w.route.length))+1)+' 圈 / 2',140,130,'#dfd6b7',15);
  }else if(w.type==='siege'){
   for(const y of [195,320,455]){ctx.strokeStyle='#d1d5b744';ctx.setLineDash([10,8]);ctx.beginPath();ctx.moveTo(90,y);ctx.lineTo(950,y);ctx.stroke();ctx.setLineDash([]);rect(62,y-40,52,80,'#b3a377','#efda9b');rect(73,y-25,30,50,'#4e6358');}
   for(const e of w.enemies){actor(e.x,e.y,null,e.speed>90?'#c99a60':'#ba7967',e.speed>90?'急襲':'來襲',.85);rect(e.x-25,e.y-66,50,5,'#392c32');rect(e.x-25,e.y-66,50*e.hp/e.maxHp,5,'#f5ad83');}
   for(const p of w.scraps){rect(p.x-10,p.y-13,20,22,'#d6c286','#f3e2ac');text('補',p.x,p.y+4,'#2d413c',14);}
   circle(165,480,36,'#a3c8b122','#c6d99d');text('守備修復',165,530,'#d7e4b9',16);
  }else if(w.type==='tempo'){
   [190,310,430].forEach((y,i)=>{ctx.strokeStyle='#b7c4b75a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(125,y);ctx.lineTo(940,y);ctx.stroke();circle(180,y,w.assist?50:36,'#d1af5644','#eed394');text(['上拍','中拍','下拍'][i],72,y+5,'#dfd7b8',16);});
   for(const n of w.notes){if(n.done)continue;rect(n.x-31,n.y-22,62,44,Math.abs(n.x-180)<55?'#f2d68f':'#9a6c64','#f1d391');text(String(n.id+1),n.x,n.y+7,'#fff2c8',19);}
   text('連段 '+w.combo,770,125,'#f5da88',20);text('完成 '+w.resolved+' / '+w.total,360,125,'#d7dfbf',16);
  }
  if(w.guard>0)circle(w.x,w.y,51,'#8bc9cc22','#a7dfe6');
  if(w.attack>0){circle(w.x,w.y,w.type==='tempo'?42:116,'#e8c76d15','#ffe9a799');}
  ctx.globalAlpha=w.inv>0&&Math.floor(w.inv*12)%2?.45:1;actor(w.x,w.y,images.player,'#7aa5a0','你');ctx.globalAlpha=1;
  for(const f of w.fx)text(f.text,f.x,f.y-45-(.6-f.ttl)*28,'#fff2b0',23);
  if(w.flash>0){ctx.fillStyle='#c54b4726';ctx.fillRect(0,0,1000,560);}
  text(w.type==='tempo'?'上下走位 · 金圈合拍':w.type==='race'?'沿亮起路標前進 · 留氣力衝刺':w.type==='siege'?'三路接應 · 左側守備可修復':'看蓄力 → 閃避 → 破綻反擊',500,548,'#d8dfca',15);
 }
 ZH.adventureCanvas={draw};
})(window.ZH);
</script>
