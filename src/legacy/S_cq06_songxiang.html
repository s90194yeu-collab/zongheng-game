function battleBoard(m){const s=m.s;if(s.phase==='event'){const r=s.orders.at(-1);return battleGrid(m)+paper('第'+s.turn+'令・'+r.stage,(r.order==='wait'?'守禮等待。':'擊之。')+(r.timing?'抓住未成列的戰機；這是子魚的論戰立場，接下來仍讀宋公的實際選擇。':'')+' 本回合損失 '+r.loss+'，兵力剩 '+r.force+'／60。')+'<button class="zh-btn zh-btn--primary" data-next>讀畢，'+(s.turn===6?'安排收軍護送':'下一回合')+'</button>';}

 const model=M[kind](g.getProgress()?.model,g.rng),s=model.s;let alive=true,raf=0,last=performance.now(),lastFrame=last,lastUi=last,bucket=Math.floor(s.elapsed/5),ui={};

 function paint(){if(!alive)return;const done=s.phase==='done',failed=s.phase==='failed',hadFocus=body.contains(document.activeElement);body.innerHTML='<div class="sx-game" data-kind="'+kind+'"><h2>'+TITLE[kind]+'</h2><div class="sx-live"><b data-index></b><span data-clock></span></div>'+(!done&&!failed?({zhengmeng:diplomacyBoard,hong:battleBoard,lun:debateBoard}[kind])(model):'')+'<p class="sx-feedback" role="status" data-note></p>'+(done?'<p class="sx-follow">本次原分 '+s.first.score+'／10'+(s.assisted?'，必要操作已親做補足；原分保留。':'。')+'</p><button class="zh-btn zh-btn--primary" data-finish>交回挑戰成績</button>':'<div class="sx-help-row">'+(!failed?'<button class="zh-btn zh-btn--quiet" data-pause>'+ (s.paused?'繼續操作':'暫停操作')+'</button>':'')+'<button class="zh-btn '+(failed?'zh-btn--primary':'zh-btn--quiet')+'" data-assist '+(s.assisted?'hidden':'')+'>協助補做・不限時</button></div>')+'</div>';ui={index:body.querySelector('[data-index]'),clock:body.querySelector('[data-clock]'),note:body.querySelector('[data-note]')};clock();if(hadFocus)(body.querySelector('[data-next],[data-finish],[data-escort]')||body.querySelector('button:not(:disabled):not([hidden])'))?.focus({preventScroll:true});persist();g.setStatus(done?'必要體驗完成':failed?'請親做補足':s.assisted?'原分保留・親做補足':'正在挑戰');}

function payload(s,ending){const a=s.vars.zhengmeng.firstScore,b=s.vars.hong.firstScore,c=s.vars.lun.firstScore,v=(Number(s.vars.choices.capacity==='measure')+Number(s.vars.choices.responsibility==='care')+Number(s.vars.choices.hospitality==='dignity')+Number(firstGood(game.ctx,'sx_07'))+Number(firstGood(game.ctx,'sx_12')))*20;return{scenarioId:SID,chapterVersion:VERSION,runId:s.vars.runId,mode:MODE,faction:'宋',country:'宋',role:'宋襄公',roleKind:'shijia',bioTitle:'宋微子世家・襄公',bioOpening:'宋襄公茲甫，宋桓公之太子也。',ending,scoreStrategy:Math.round(a*3+b*4+c*3),scoreVirtue:v,turns:s.steps,durationSec:Math.min(5400,Math.round((Date.now()-s.startedAt)/1000)),deeds:['齊桓卒後，宋襄助立齊孝，進而向楚求諸侯。','親做九回合交涉，首次'+a+'分；體會小國爭盟、資源與信用的限制。','盂會被執，薄盟釋放，對讀子魚禍猶未也之諫。','泓水沙盤親放三軍、下六令與收軍護送，首次'+b+'分；守禮'+s.vars.honorChoices+'次，史實仍敗績傷股。','兩輪八組子魚論戰親配，首次'+c+'分；辨重傷、二毛、阻隘與鼓儳。','回望厚待重耳、贈馬二十乘，不把贈送與後來軍援寫成必然交易。','前637宋襄卒；並讀《左傳》與《公羊傳》，分辨制敵與守禮的評價。'],anchors:copy(s.anchors),games:copy(s.games),codex:s.codex.slice(),opener:'遊戲史官評語（自擬）：余讀泓水之戰，見襄公欲以小國主盟，楚許而執之，目夷諫而未止。臨敵半濟、行列未成，公不肯鼓，終敗而傷。子魚以利用明恥論戰，公羊以不忘大禮稱之；兩說所重，各有其端。又見公厚待流亡重耳，知其人不可盡於一敗。是局記親盟、部署、軍令與對讀，問名位是否配得實力，守禮是否兼顧兵民；不以手速定德，不借推演改寫古事。',prompts:['引用宋公的一項主張與子魚對應的反駁，結合你的一道泓水軍令，說明各自的原則、收益與代價；你如何判斷？','子魚為什麼說「小國爭盟，禍也」？結合一次使者需求、牌卡資源與回報，分辨名位、信用、可兌現的實力。','《左傳》與《公羊傳》對同一場敗戰有不同評價。引用兩段原文，說明評價的標準；別只用成敗把人判完。'],experience:{firstAnchors:copy(s.vars.firstAnchors),zhengmeng:copy(s.vars.zhengmeng),hong:copy(s.vars.hong),lun:copy(s.vars.lun),decisions:copy(s.vars.choices),honorChoices:s.vars.honorChoices}};}
