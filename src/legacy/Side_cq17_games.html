<!-- 吳越春秋・必要體驗 v0.1.1（2026-10-14）。只供 S_cq17_wuyue 引入。 -->
<style>
.cq17-game{display:grid;gap:12px;width:min(760px,100%);margin:auto;padding:12px 12px 24px;font-size:16px;line-height:1.6;box-sizing:border-box;overflow-wrap:anywhere}.cq17-game h2{font-size:24px;color:var(--gilt);margin:0}.cq17-game p{margin:0}.cq17-note,.cq17-edge{color:var(--text-dim);font-size:15px}.cq17-game button{min-height:44px;font:inherit;touch-action:manipulation;cursor:pointer;padding:9px;border:1px solid #aa925e;border-radius:8px;background:#23394a;color:#f8e9c8}.cq17-game button:focus-visible{outline:3px solid #fff0ad;outline-offset:2px}.cq17-game button:disabled{opacity:.5;cursor:default}.cq17-message{min-height:3.2em;color:#b9e5d4}.cq17-message.is-bad{color:#ffb9ae}.cq17-scroll{border:1px solid #bba367;border-radius:12px;background:linear-gradient(100deg,#e2ce9f,#f6e9c8,#e2ce9f);color:#342d24;padding:14px;box-shadow:inset 0 0 0 5px #70543322}.cq17-scroll b{font-size:20px}.cq17-roundbar{height:8px;background:#47382244;border-radius:5px;overflow:hidden;margin-top:8px}.cq17-roundbar i{display:block;height:100%;width:100%;background:#9e563f}.cq17-controls{display:flex;flex-wrap:wrap;gap:8px}.cq17-controls button{flex:1;min-width:90px}.cq17-stats,.cq17-resources{white-space:pre-line;border:1px solid #638184;border-radius:8px;padding:9px;background:#182f3d;color:#e1e8d8;font-variant-numeric:tabular-nums}.cq17-water{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;background:linear-gradient(130deg,#1b4d64,#153341);border:2px solid #759aa1;border-radius:12px;padding:8px}.cq17-tile{height:42px;display:grid;place-items:center;border:1px solid #76b3bd33;border-radius:6px;color:#71acb7;font-size:17px}.cq17-tile.is-blocked{background:#733d3d;color:#ffcebb;border-color:#b97060}.cq17-tile.is-flag{background:#4a795c;color:#fff4ba;border-color:#efd28a;font-weight:bold}.cq17-tile.is-flag.is-blocked{background:linear-gradient(45deg,#733d3d 45%,#4a795c 45%)}.cq17-beat{position:relative;height:44px;border:1px solid #ad935e;border-radius:8px;background:#263c4c;overflow:hidden}.cq17-beat span{position:absolute;top:0;bottom:0;background:#c19c46;opacity:.8}.cq17-beat i{position:absolute;top:0;bottom:0;width:4px;background:#fff6d9;box-shadow:0 0 9px #fff8c5}.cq17-gifts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.cq17-gifts button:last-child{grid-column:1/-1}.cq17-speech{display:grid;gap:8px}.cq17-speech button{text-align:left}.cq17-work{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.cq17-work button{min-width:0;display:grid;gap:4px}.cq17-work small{font-size:15px}.cq17-work b{font-weight:600}.cq17-work span{display:block;font-size:23px;color:#f5d588}
@media(max-width:860px){.cq17-game{padding:8px;gap:9px}.cq17-scroll{padding:12px}.cq17-scroll b{font-size:18px}.cq17-work{grid-template-columns:repeat(3,minmax(0,1fr))}.cq17-work button{min-height:62px;padding:6px;gap:0}.cq17-work small{display:none}.cq17-work span{display:inline;margin-left:8px;font-size:19px}.cq17-water{padding:6px}.cq17-tile{height:35px}.cq17-game h2{font-size:22px}}
</style>
<script>
(function (ZH) {
  'use strict';
  const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
  const paused=()=>document.hidden||!!document.querySelector('.zh-modal');
  const shuffle=(a,rng)=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;};
  function session(body,g,seconds,judge,resolve){
    const prior=g.getProgress?g.getProgress():{};
    let observing=0,focusBusy=false,pendingFirst=prior.playerFocusPendingFirst||null;
    let done=false,assisted=!!prior.playerFocusUsed,first=prior.playerFocusFirst||null,elapsed=0,left=seconds,timer=null,last=performance.now();
    const freeze=()=>{if(!first)first=Object.assign({max:10,sec:Math.round(elapsed)},judge());};
    const clean=()=>{clearInterval(tick);if(timer)timer.stop();};
    const assist=()=>{if(done||assisted)return;freeze();assisted=true;if(timer)timer.stop();body.querySelector('[data-assist]').disabled=true;body.querySelector('[data-guide]').hidden=false;body.querySelector('[data-guide]').textContent='首次表現已保存。現在無時限練習，請親自完成操作。';if(api.onAssist)api.onAssist();};
    const api={get done(){return done||focusBusy||observing>0;},get assisted(){return assisted;},get elapsed(){return elapsed;},get left(){return left;},onStep:null,onAssist:null,assist,
      finish(extra){if(done)return;freeze();done=true;clean();resolve(Object.assign({},first,extra,{completed:true,assisted,independentScore:first.score,independentPassed:first.passed}));},
      message(t,bad){const el=body.querySelector('[data-message]');el.textContent=t;el.classList.toggle('is-bad',!!bad);},
      feedback(ok,streak){g.sfx(ok?'ok':'ng');if(g.combo)g.combo(ok?streak:0);if(g.flash)g.flash(ok?'ok':'bad');},
      dispose(){done=true;clean();}
    };
    if(g.timer&&!assisted)timer=g.timer(seconds,{warn:10,onEnd:assist});
    const focus=document.createElement('button');focus.type='button';focus.className='zh-btn zh-btn--quiet pl-focus-button';focus.textContent='專注・觀察五秒後練習';focus.dataset.playerFocus='';focus.hidden=!g.playerSkillAvailable||!g.playerSkillAvailable('zhuanzhu');body.querySelector('section').appendChild(focus);
    const focusNote=document.createElement('p');focusNote.className='pl-focus-note';focusNote.hidden=true;focus.before(focusNote);
    const useFocus=async()=>{if(done||focusBusy||paused())return;focusBusy=true;focus.disabled=true;if(!pendingFirst)pendingFirst=Object.assign({max:10,sec:Math.round(elapsed)},judge());if(g.setProgress)g.setProgress(Object.assign({},g.getProgress(),{playerFocusPendingFirst:pendingFirst}));try{await g.playerSkill('zhuanzhu',()=>{if(!first)first=pendingFirst;assist();observing=5;focus.hidden=true;focusNote.hidden=false;if(g.setProgress)g.setProgress(Object.assign({},g.getProgress(),{playerFocusUsed:true,playerFocusFirst:first}));});}catch(e){api.message(e.message,true);focus.disabled=false;}finally{focusBusy=false;}};focus.addEventListener('click',useFocus);
    if(assisted){body.querySelector('[data-assist]').disabled=true;body.querySelector('[data-guide]').hidden=false;body.querySelector('[data-guide]').textContent='本局已使用專注，首次表現仍保留；請繼續親自完成無時限練習。';}
    const tick=setInterval(()=>{const now=performance.now(),dt=clamp((now-last)/1000,0,.25);last=now;if(done||paused())return;if(focusBusy){if(timer)timer.add(dt);return;}if(observing>0){observing=Math.max(0,observing-dt);focusNote.textContent='專注觀察：'+Math.ceil(observing)+'秒。觀察結束後請親自操作。';if(!observing)focusNote.hidden=true;return;}elapsed+=dt;if(!assisted){left=Math.max(0,left-dt);if(!left)assist();}if(api.onStep)api.onStep(dt);},100);
    const hint=body.querySelector('[data-assist]');hint.addEventListener('click',assist);g.onCleanup(()=>{api.dispose();hint.removeEventListener('click',assist);focus.removeEventListener('click',useFocus);});return api;
  }
  function shell(body,title,tip,markup){body.innerHTML='<section class="cq17-game"><h2>'+ZH.esc(title)+'</h2><p>'+ZH.esc(tip)+'</p>'+markup+'<p class="cq17-message" data-message role="status" aria-live="polite"></p><p class="cq17-note" data-guide hidden></p><button type="button" class="zh-btn zh-btn--quiet" data-assist>提示與無時限練習</button></section>';}
  const DIR=[{dx:0,dy:-1,arrow:'↑',name:'北'},{dx:1,dy:0,arrow:'→',name:'東'},{dx:0,dy:1,arrow:'↓',name:'南'},{dx:-1,dy:0,arrow:'←',name:'西'}];
  // 夫椒僅以水域與旗艦表現撤退；格子、節拍及甲兵指數均為教學推演。
  function fujiao(body,g){return new Promise(resolve=>{
    let x=2,y=2,heading=0,cursor=0,time=0,p=0,phase='play',waiting=0,correct=0,troops=100,safety=100,streak=0,best=0,safe='',blocked=[],repairs=[],responses=[];
    shell(body,'夫椒水戰','看旗艦朝向與紅色封鎖格，在金色節拍區發令：進、退或向右轉舵。十二段撤退，後半段節拍更快。',
      '<div class="cq17-stats" data-status></div><div class="cq17-water" data-water aria-label="水域與旗艦"></div><div class="cq17-edge">吳船自東西南北包圍；紅格表示下一拍受阻。</div><p data-order></p><div class="cq17-beat"><span data-window></span><i data-cursor></i></div><div class="cq17-controls"><button data-nav="go">進</button><button data-nav="back">退</button><button data-nav="turn">轉舵 ↻</button></div>');
    const race=g.race?g.race({me:'越軍撤退',rival:'吳國水軍',rivalColor:'#af6565',goal:'旗艦退向岸邊'}):null;
    const judge=()=>({score:Math.round(correct/12*8+troops/100+safety/100),passed:correct>=8&&safety>30,correct,troops,safety,turns:cursor,combo:best});
    const s=session(body,g,50,judge,resolve);
    const destination=k=>{const d=DIR[heading];return k==='turn'?[x,y]:[x+d.dx*(k==='go'?1:-1),y+d.dy*(k==='go'?1:-1)];};
    function render(){body.querySelector('[data-status]').textContent='撤退 '+Math.min(cursor+1,12)+'/12　甲兵指數 '+troops+'　旗艦 '+safety;let h='';for(let yy=0;yy<5;yy++)for(let xx=0;xx<5;xx++){const b=blocked.some(z=>z[0]===xx&&z[1]===yy),at=xx===x&&yy===y;h+='<div class="cq17-tile '+(b?'is-blocked ':'')+(at?'is-flag':'')+'">'+(at?'越'+DIR[heading].arrow:b?'吳舟':'≈')+'</div>';}body.querySelector('[data-water]').innerHTML=h;if(race){race.me(cursor/12);race.rival(s.elapsed/50);}}
    function setup(){time=0;p=0;phase='play';const choices=['go','back','turn'].filter(k=>destination(k).every(v=>v>=0&&v<5));safe=choices[Math.floor(g.rng()*choices.length)];blocked=['go','back','turn'].filter(k=>k!==safe).map(destination).filter(a=>a.every(v=>v>=0&&v<5));for(let i=0;i<2+Math.floor(cursor/3);i++){const a=[Math.floor(g.rng()*5),Math.floor(g.rng()*5)],keep=destination(safe);if(!(a[0]===keep[0]&&a[1]===keep[1]))blocked.push(a);}const lo=cursor<6?.43:.49,hi=cursor<6?.77:.69,w=body.querySelector('[data-window]');w.style.left=lo*100+'%';w.style.width=(hi-lo)*100+'%';w.dataset.lo=lo;w.dataset.hi=hi;body.querySelector('[data-order]').textContent=(repairs.length&&cursor>=12?'補作：':'')+'旗艦朝'+DIR[heading].name+'；先辨下一格，再等節拍。';body.querySelectorAll('[data-nav]').forEach(b=>b.disabled=false);render();guide();}
    function guide(){if(s.assisted){const label={go:'進',back:'退',turn:'轉舵'}[safe];s.message('提示：本段安全指令為「'+label+'」。仍須等金色節拍發令。');}}
    function complete(ok,key){responses.push({round:Math.min(cursor+1,12),command:key,correct:ok,repair:cursor>=12,beat:Math.round(p*100)});if(cursor>=12){if(ok)repairs.shift();}else{if(ok&&!s.assisted){correct++;streak++;best=Math.max(best,streak);}else if(!ok){repairs.push(cursor);streak=0;if(!s.assisted){troops=Math.max(0,troops-8);safety=Math.max(0,safety-7);}}cursor++;}s.feedback(ok,streak);phase='wait';waiting=.65;body.querySelectorAll('[data-nav]').forEach(b=>b.disabled=true);s.message(ok?'旗隊保持接應，向岸邊推進。':'時機或航向失準。這段列入補作，先看清包圍。',!ok);render();}
    s.onAssist=()=>guide();
    s.onStep=dt=>{if(race)race.rival(s.elapsed/50);if(phase==='wait'){waiting-=dt;if(waiting<=0){if(cursor>=12&&!repairs.length){s.finish({responses,finalTroops:troops,finalSafety:safety});return;}if(cursor>=12&&!s.assisted)s.assist();setup();}return;}time+=dt;const period=cursor<6?3.5:2.6;p=(time%period)/period;const c=body.querySelector('[data-cursor]');c.style.left=p*100+'%';c.dataset.progress=p;if(!s.assisted&&time>(cursor<6?4:3))complete(false,'timeout');};
    const click=e=>{const b=e.target.closest('[data-nav]');if(!b||b.disabled||s.done||paused()||phase!=='play')return;const k=b.dataset.nav,w=body.querySelector('[data-window]'),ok=k===safe&&p>=Number(w.dataset.lo)&&p<=Number(w.dataset.hi);if(ok){const next=destination(k);x=next[0];y=next[1];if(k==='turn')heading=(heading+1)%4;}complete(ok,k);};body.addEventListener('click',click);g.onCleanup(()=>body.removeEventListener('click',click));setup();
  });}
  const TALKS=[
    {title:'伍子胥：越國並非真心歸服。',gift:'寶器',right:'承認戰敗，提出守約與貢獻的承諾。',wrong:['宣稱越國已戰勝吳國，要求吳王退兵。','聲稱伍子胥是越國使者，應立刻聽從他。'],why:'戰敗求成要承認處境；誇大勝勢只會使對方更警惕。'},
    {title:'吳王：留越國，對吳有何益？',gift:'財貨',right:'說明保留越國可供貢賦，減少吳軍消耗。',wrong:['要求吳王把王位交給勾踐。','只讚美寶器，完全不說國家利害。'],why:'說辭須回答吳王的利害問題，不能只用空泛稱讚。'},
    {title:'伍子胥：文種善謀，不可輕信。',gift:'寶器',right:'降低姿態，提出可以查驗的履約安排。',wrong:['聲稱越國沒有文種這個人。','直接辱罵伍子胥，催吳王停止聽諫。'],why:'反對者提出風險，應以具體承諾回應，否認與辱罵都無助。'},
    {title:'伯嚭：吳王盼望北方的聲名。',gift:'財貨',right:'把越國守約與吳軍減少南方負擔相連。',wrong:['保證吳國永遠不必防守任何國家。','要求吳國立即把所有兵力移交越國。'],why:'抓住吳王北向的意圖，不等於可以承諾毫無風險。'},
    {title:'吳王：怎樣確認越國願意服從？',gift:'寶器',right:'重申貢獻與守約，使求成條件前後一致。',wrong:['撤回前四輪承諾，臨時要求吳國賠償。','聲稱財貨已能證明越國永無異心。'],why:'收尾應使條件一致；財物不能消除伍子胥所說的長期風險。'}
  ];
  function xingcheng(body,g){return new Promise(resolve=>{
    let cursor=0,phase='gift',time=0,cash=8,gift='',amount=0,correct=0,mind=0,streak=0,best=0,repairs=[],responses=[],order=[];
    shell(body,'行成・文種的交涉','你改扮文種。八份財貨，先選禮物，再回應吳王與諫言。五輪每輪最多八秒，後半段更快；說辭是教學推演。',
      '<div class="cq17-stats" data-status></div><div class="cq17-scroll"><b data-prompt></b><p data-need></p><div class="cq17-roundbar"><i data-roundtime></i></div></div><div class="cq17-gifts">'+['寶器','財貨'].map(k=>[1,2].map(n=>'<button data-gift="'+k+'" data-amount="'+n+'">'+k+' '+n+' 份</button>').join('')).join('')+'<button data-gift="保留" data-amount="0">暫不送禮</button></div><div class="cq17-speech" data-speech></div>');
    const race=g.race?g.race({me:'吳王許成',rival:'伍子胥的諫言',rivalColor:'#af6565',goal:'五輪求成'}):null;
    const judge=()=>({score:Math.round(correct/5*7+clamp(cash/3,0,1)*3),passed:correct>=4&&mind>=80,correct,remainingCash:cash,mind,combo:best});
    const s=session(body,g,40,judge,resolve);const round=()=>cursor<5?cursor:repairs[0];
    function render(){body.querySelector('[data-status]').textContent=(cursor>=5?'補作':'交涉 '+(cursor+1)+'/5')+'　剩餘財貨 '+cash+'　吳王心意 '+mind+'%';if(race){race.me(mind/100);race.rival(clamp((5-correct)/5,0,1));}}
    function setup(){phase='gift';time=0;gift='';amount=0;const q=TALKS[round()];order=shuffle([{text:q.right,good:true},...q.wrong.map(text=>({text,good:false}))],g.rng);body.querySelector('[data-prompt]').textContent=q.title;body.querySelector('[data-need]').textContent='伯嚭偏好：'+q.gift+'。一份已足表達禮意，仍須配合說辭。';body.querySelector('[data-speech]').innerHTML=order.map((o,i)=>'<button data-talk="'+i+'" disabled>'+ZH.esc(o.text)+'</button>').join('');body.querySelectorAll('[data-gift]').forEach(b=>b.disabled=!s.assisted&&Number(b.dataset.amount)>cash);render();guide();}
    function guide(){if(s.assisted)s.message('提示：'+TALKS[round()].gift+'一份；'+TALKS[round()].right+' 練習不再扣首次財貨。');}
    function complete(ok){responses.push({round:round()+1,gift,amount,correct:ok,repair:cursor>=5});if(cursor>=5){if(ok)repairs.shift();}else{if(ok&&!s.assisted){correct++;mind+=20;streak++;best=Math.max(best,streak);}else if(!ok){repairs.push(cursor);streak=0;}cursor++;}s.feedback(ok,streak);s.message(ok?'條件與說辭相符，這一輪交涉完成。':TALKS[responses[responses.length-1].round-1].why+' 本輪需補作。',!ok);phase='wait';time=0;body.querySelectorAll('[data-talk],[data-gift]').forEach(b=>b.disabled=true);render();}
    s.onAssist=()=>{body.querySelectorAll('[data-gift]').forEach(b=>b.disabled=phase!=='gift');guide();};
    s.onStep=dt=>{time+=dt;if(phase==='wait'){if(time<.65)return;if(cursor>=5&&!repairs.length){s.finish({responses,finalMind:100});return;}if(cursor>=5&&!s.assisted)s.assist();setup();return;}const limit=8-Math.min(round(),4)*.6;body.querySelector('[data-roundtime]').style.width=(s.assisted?100:clamp(1-time/limit,0,1)*100)+'%';if(!s.assisted&&time>=limit)complete(false);};
    const click=e=>{if(s.done||paused())return;const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.gift&&phase==='gift'){gift=b.dataset.gift;amount=Number(b.dataset.amount);if(!s.assisted)cash-=amount;phase='speech';body.querySelectorAll('[data-gift]').forEach(x=>x.disabled=true);body.querySelectorAll('[data-talk]').forEach(x=>x.disabled=false);render();guide();}else if(b.dataset.talk!==undefined&&phase==='speech')complete(order[Number(b.dataset.talk)].good&&gift===TALKS[round()].gift&&amount>=1);};body.addEventListener('click',click);g.onCleanup(()=>body.removeEventListener('click',click));setup();
  });}
  const WORK=[{key:'field',name:'耕作',tip:'每隊糧＋8'},{key:'cloth',name:'織布',tip:'每隊布＋4'},{key:'birth',name:'生聚',tip:'養民增人口'},{key:'train',name:'教訓',tip:'練兵＋4／戒心＋5'},{key:'tribute',name:'事吳',tip:'糧布換戒心－8'}];
  function shengju(body,g,cfg){return new Promise(resolve=>{
    cfg=cfg||{};let year=0,time=0,phase='assign',food=30,cloth=10,population=30,power=20,army=10,suspicion=clamp(Number(cfg.suspicion)||40,25,50),alarm=false,inspections=0,manual=0,streak=0,best=0,recovery=0,alloc={},history=[];
    const events=Array.from({length:20},(_,i)=>({season:['春耕','夏織','秋收','冬訓'][i%4],drought:g.rng()<.15,alert:i<10&&g.rng()<.25}));
    shell(body,'十年生聚・二十期經營','二十年壓縮成九十秒。每期分配五隊人力，再按「施行年計」。糧布不足會損人口；不能只練兵。後十期更快。',
      '<div class="cq17-scroll"><b data-year></b><p data-event></p><div class="cq17-roundbar"><i data-roundtime></i></div></div><div class="cq17-resources" data-resources></div><p data-budget></p><div class="cq17-work">'+WORK.map(w=>'<button data-work="'+w.key+'"><b>'+w.name+' <span data-count="'+w.key+'">0</span></b><small>'+w.tip+'</small></button>').join('')+'</div><div class="cq17-controls"><button data-clear>重新分配</button><button data-enact class="zh-btn zh-btn--primary">施行年計</button></div><p class="cq17-note">目標：國力＞70、兵力＞75。前十期每期5秒，後十期4秒；所有數值均為教學推演。</p>');
    const race=g.race?g.race({me:'越國蓄力',rival:'吳王戒心',rivalColor:'#af6565',goal:'養民備兵'}):null;
    const judge=()=>({score:Math.round(clamp(power/85,0,1)*3+clamp(army/85,0,1)*3+(food>0&&cloth>0?1:0)+manual/20+(alarm?0:2)),passed:year>=20&&power>70&&army>75&&!alarm,power,army,population,suspicion,food,cloth,alarm,inspections,manualYears:manual,years:Math.min(year,20),combo:best});
    const s=session(body,g,90,judge,resolve);const assigned=()=>Object.values(alloc).reduce((a,b)=>a+b,0);

    const click=e=>{if(s.done||paused()||phase!=='assign')return;const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.work&&assigned()<5){alloc[b.dataset.work]++;g.sfx('click');render();}else if(b.hasAttribute('data-clear')){WORK.forEach(w=>alloc[w.key]=0);render();}else if(b.hasAttribute('data-enact')&&assigned()===5)settle(true);};body.addEventListener('click',click);g.onCleanup(()=>body.removeEventListener('click',click));setup();
