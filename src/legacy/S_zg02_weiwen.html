function play(kind){return(body,g)=>new Promise(resolve=>{
 const old=g.getProgress(),model=M[kind](old.model,g.rng),s=model.s;let alive=true,last=performance.now(),persistAt=-1,drawing=false,paintedCell=null;
 const race=g.race({me:kind==='recruit'?'合適的配置':kind==='investigate'?'有證據的推論':'已灌田地',rival:kind==='recruit'?'他國的招攬':kind==='investigate'?'查核工期':'民怨',goal:'讀長處、找證據、讓水連通；首次與最佳成績分開'});
 const persist=()=>g.setProgress({model:model.snapshot()});
 function clock(){const e=body.querySelector('[data-clock]');if(e&&s.phase==='play')e.textContent='剩 '+Math.ceil(s.left)+' 秒'+(kind==='recruit'?'・本卡 '+Math.ceil(s.cardLeft)+' 秒':'');
  const stat=body.querySelector('[data-cost]');if(stat&&kind==='canals')stat.textContent='民力 '+s.spent+'／44・民怨 '+Math.round(s.resentment)+'／100';
  if(kind==='recruit'){race.me(s.answers.filter(a=>a.correct).length/7);race.rival(s.answers.filter(a=>!a.correct).length/7);}else if(kind==='investigate'){race.me(s.slots.filter(Boolean).length/3);race.rival(1-Math.min(90,s.left)/90);}else{race.me(s.irrigated.length/12);race.rival(s.resentment/100);}
 }
 function paint(){if(!alive)return;const focusedCell=body.contains(document.activeElement)?document.activeElement.dataset.cell:undefined;const assist=s.phase==='assist',done=s.phase==='done',failed=s.phase==='failed';let content='',controls='';
  if(kind==='recruit'&&!done&&!failed){content=talentCard(model)+(assist?'<p class="ww-clues">提示：'+E(model.roles.find(r=>r.id===model.card().role).name)+'，再讀卡上理由後任命。</p>':'');controls='<div class="ww-role-buttons">'+model.roles.map(r=>'<button type="button" class="zh-btn" data-role="'+r.id+'" '+(s.phase==='feedback'?'disabled':'')+'>'+E(r.name)+'</button>').join('')+'</div>'+(s.phase==='feedback'?'<button type="button" class="zh-btn zh-btn--primary" data-next>確認配置，下一位</button>':'');}
  if(kind==='investigate'&&!done&&!failed)content=investigationBoard(model);
  if(kind==='canals'){content=canalBoard(model);if(!done&&!failed)controls='<button type="button" class="zh-btn zh-btn--quiet" data-undo '+(assist||!s.dug.length?'disabled':'')+'>撤回最後一段（民力不退）</button>';}
  const title=kind==='recruit'?'招賢館・你是魏文侯':kind==='investigate'?'河伯娶婦大調查・你是西門豹':'十二渠・你是西門豹';
  const progress=kind==='recruit'?Math.min(assist?s.guide+1:s.round+1,7)+'／7 人才':kind==='investigate'?s.visited.length+'／5 證詞・'+s.slots.filter(Boolean).length+'／3 核對':s.irrigated.length+'／12 田地';
  body.innerHTML='<div class="ww-game" data-kind="'+kind+'"><h2>'+title+'</h2><div class="ww-live"><b>'+(assist?'協助補做・':done?'完成・':failed?'工期結束・':'')+progress+'</b><span data-clock>'+(assist?'不限時':s.phase==='play'?'剩 '+Math.ceil(s.left)+' 秒':'倒數暫停')+'</span>'+(kind==='canals'?'<span data-cost></span>':'')+'</div>'+content+(s.note?'<p class="ww-feedback" role="status">'+E(s.note)+'</p>':'')+controls+(failed?'<p class="ww-follow">首次成績 '+s.first.score+'／10。請協助補做必要操作，原分保留。</p>':'')+(done?'<p class="ww-follow">本次成績 '+s.first.score+'／10'+(s.assisted?'；已完成協助操作，原分保留。':'。')+'</p><button type="button" class="zh-btn zh-btn--primary" data-finish>交回挑戰成績</button>':'<div class="ww-help-row"><button type="button" class="zh-btn '+(failed?'zh-btn--primary':'zh-btn--quiet')+'" data-assist '+(assist?'hidden':'')+'>協助補做・不限時</button></div>')+'</div>';
  if(focusedCell!==undefined)body.querySelector('[data-cell="'+focusedCell+'"]').focus({preventScroll:true});clock();persist();g.setStatus(assist?'親自補做・保留原分':done?'必要操作完成':failed?'請補做必要體驗':'正在挑戰');
 }
 const click=async e=>{const b=e.target.closest('button');if(!b||b.disabled||!alive)return;
  if(b.hasAttribute('data-assist')){const ok=await ZH.modal({title:'協助補做',body:'<p>改為不限時並提供操作提示，仍須親自完成。已完成挑戰的原分保留；提前求助的本次成績鎖為0分，之後可另挑戰最佳。</p>',actions:[{label:'繼續挑戰',value:false,kind:'quiet'},{label:'開始補做',value:true,kind:'primary'}]});if(ok&&alive){model.assist();last=performance.now();paint();}return;}
  if(b.hasAttribute('data-finish')){if(s.phase!=='done')return;alive=false;persist();resolve({...model.result(),sec:g.elapsed()});return;}
  if(b.hasAttribute('data-next'))model.next();else if(b.dataset.role)model.choose(b.dataset.role);
  else if(b.dataset.visit){model.visit(b.dataset.visit);model.afterVisit();}else if(b.dataset.slot!==undefined)model.selectSlot(Number(b.dataset.slot));
  else if(b.dataset.claim!==undefined)model.claim(Number(b.dataset.claim));else if(b.dataset.evidence)model.evidence(b.dataset.evidence);
  else if(b.hasAttribute('data-submit'))model.submit();else if(b.dataset.cell!==undefined){if(paintedCell===Number(b.dataset.cell)){paintedCell=null;return;}model.dig(Number(b.dataset.cell));}
  else if(b.hasAttribute('data-undo'))model.undo();else return;g.sfx('click');paint();
 };
 const pointerDown=e=>{const b=e.target.closest('[data-cell]');if(kind!=='canals'||!b||!alive||!['play','assist'].includes(s.phase)||e.button!==0)return;e.preventDefault();drawing=true;paintedCell=Number(b.dataset.cell);model.dig(paintedCell);paint();};
 const pointerMove=e=>{if(!drawing||!alive)return;e.preventDefault();const b=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-cell]');if(!b||!body.contains(b)||Number(b.dataset.cell)===paintedCell)return;paintedCell=Number(b.dataset.cell);model.dig(paintedCell);paint();};
 const pointerUp=()=>{drawing=false;};
 const keys=e=>{if(kind!=='canals'||!e.target.matches('[data-cell]'))return;const offsets={ArrowLeft:-1,ArrowRight:1,ArrowUp:-6,ArrowDown:6};if(offsets[e.key]===undefined)return;e.preventDefault();const id=Number(e.target.dataset.cell),next=id+offsets[e.key];if(next<0||next>=48||((e.key==='ArrowLeft'||e.key==='ArrowRight')&&Math.floor(next/6)!==Math.floor(id/6)))return;body.querySelector('[data-cell="'+next+'"]').focus();};
 body.addEventListener('click',click);body.addEventListener('pointerdown',pointerDown);window.addEventListener('pointermove',pointerMove,{passive:false});body.addEventListener('keydown',keys);window.addEventListener('pointerup',pointerUp);window.addEventListener('pointercancel',pointerUp);
 const interval=setInterval(()=>{const now=performance.now(),dt=Math.min(.5,(now-last)/1000);last=now;if(!alive||pause())return;if(model.advance(dt))paint();else clock();const bucket=Math.floor(g.elapsed()/5);if(bucket!==persistAt){persistAt=bucket;persist();}},250);
 g.onCleanup(()=>{alive=false;clearInterval(interval);body.removeEventListener('click',click);body.removeEventListener('pointerdown',pointerDown);window.removeEventListener('pointermove',pointerMove);body.removeEventListener('keydown',keys);window.removeEventListener('pointerup',pointerUp);window.removeEventListener('pointercancel',pointerUp);});paint();
});}

function title(saved){const compatible=saved?.vars?.schema===SCHEMA,st=compatible?saved:null;ROOT.innerHTML='<main class="ww-title"><div class="ww-title-bar"><span class="zh-mark"><span class="zh-mark__re">Re:</span><span class="zh-mark__name">縱橫鼎業</span></span><button class="zh-btn zh-btn--quiet" data-home>回首頁</button></div><header><p class="ww-kicker">戰國篇・第二話・文侯時期</p><h1>魏文霸業</h1><p class="ww-subtitle">河伯要娶新娘？那請巫婆先去問問</p><div class="ep-chips"><span class="zh-chip zh-chip--patina">招賢 × 調查 × 引水</span><span class="zh-chip">自動存檔</span></div></header><section class="ww-title-scene" aria-label="魏廷的文侯與鄴令西門豹">'+panorama('weiPalace',['wen','ximen'])+'</section><section class="ww-start"><span class="ww-seal" aria-hidden="true">魏</span><div><h2>魏文侯 → 西門豹</h2><p class="ww-note">先守信、親配人才，再切換鄴令訪查斂財與引水灌田。把信用、任賢與民生放回自己的一次次行動。</p></div><div class="ww-start-actions">'+(st?'<button class="zh-btn zh-btn--primary" data-continue>'+(st.ended?'查看結局':'繼續遊戲')+'</button>':'')+'<button class="zh-btn '+(st?'zh-btn--quiet':'zh-btn--primary')+'" data-new>'+(st?'重新開始':'開始遊戲')+'</button></div></section><section class="ww-points"><div><b>招賢館</b><p class="ww-note">七位人才、四種任務，讀長處與提醒，在他國先行接洽前決定。</p></div><div><b>河伯娶婦大調查</b><p class="ww-note">五人訪查，三格推論各配證詞。收多少、花多少、誰拿餘款？</p></div><div><b>十二渠</b><p class="ww-note">親畫連通水網，用有限民力灌溉十二田；不只求挖得多。</p></div></section>'+(saved&&!compatible?'<p class="ww-follow">偵測到不同版本進度。新版另開一局，先前已登錄的成績與史冊保留。</p>':'')+'<p class="ww-note">預留約20～30分鐘。十個原文對讀、三項必要體驗；卡關可不限時補做。新版 v1.1.0</p></main>';
