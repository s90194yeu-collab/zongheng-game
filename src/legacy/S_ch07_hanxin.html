(function () {

  // Chapter helpers use the platform APIs. They do not replace the router,

  const SID = 'S_ch07_hanxin', E = ZH.esc;
  const KEY = 'hanxin-platform-v1:' + (ZH.user.email || 'guest') + ':';
  let run = '', first = {}, progress = {}, latest = null;
  const clone = v => JSON.parse(JSON.stringify(v));
  const read = (k, d) => ZH.local.get(KEY + k, d);
  const write = (k, v) => ZH.local.set(KEY + k, v);
  const freshId = () => 'hx_' + Date.now().toString(36) + '_' + crypto.getRandomValues(new Uint32Array(1))[0].toString(36);
  const status = text => document.querySelectorAll('[data-hx-save]').forEach(el => { el.textContent = text; });
  const current = () => window.__ep && window.__ep.state;
  function meta(state) {

    state.vars.hxRunId = run;
    state.vars.hxFirst = clone(first);
    state.vars.hxProgress = clone(progress);
  }
  window.HX = {
    read, write, runId: () => run,
    newRun() { run = freshId(); first = {}; progress = {}; latest = null; write('save', null); },
    useState(state) {
      const v = state && state.vars || {};
      run = v.hxRunId || freshId(); first = clone(v.hxFirst || {}); progress = clone(v.hxProgress || {});

  const coord = (x, y) => String.fromCharCode(65 + x) + (y + 1);
  const distance = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y);

  const GUIDE = [
    [['G', 'move', 3, 4], ['G', 'raise'], ['B1', 'guard'], ['B2', 'guard'], ['B3', 'guard'], ['end']],
    [['G', 'move', 1, 4], ['G', 'retreat'], ['B1', 'guard'], ['B2', 'guard'], ['B3', 'guard'], ['end']],
    [['K2', 'move', 6, 1], ['K1', 'move', 5, 1], ['B1', 'guard'], ['B2', 'guard'], ['B3', 'guard'], ['G', 'guard'], ['end']],

  function createBattleModel(saved={}) {
    const s = { phase: 'intro', turn: 1, units: [], raised: false, raisedTurn: 0, retreatOrdered: false,
      enteredWater: false, held: 0, heldDone: false, flags: [null, null], first: null, assisted: false,
      guideIndex: 0, orders: 0, totalOrders: 0, history: [], report: [], selected: null, mode: null, pending: null, returnPhase: null };
    const unit = id => s.units.find(u => u.id === id);
    const at = (x, y) => s.units.find(u => u.hp > 0 && u.x === x && u.y === y);
    const campEmpty = () => s.units.filter(u => u.side === 'zhao').every(u => u.exited);
    const guide = () => s.assisted ? (GUIDE[s.turn - 1] || [])[s.guideIndex] || null : null;
    function reset() {
      s.units = INITIAL_UNITS.map(u => ({ ...u, max: u.hp, moved: false, acted: false, guard: false, exposed: false, exited: false }));
      s.turn = 1; s.raised = false; s.raisedTurn = 0; s.retreatOrdered = false; s.enteredWater = false;
      s.held = 0; s.heldDone = false; s.flags = [null, null]; s.orders = 0; s.guideIndex = 0;
      s.selected=null;s.mode=null;s.pending=null;s.history=[];s.report=[];s.outcome=null;
    }
    reset();if(Array.isArray(saved.units)&&saved.units.length)Object.assign(s,JSON.parse(JSON.stringify(saved)));
    function pathFor(u, x, y, allowTarget) {
      if (!u || u.hp <= 0 || x < 0 || x >= 8 || y < 0 || y >= 10) return null;
      if (terrain(x, y) === 'river' || terrain(x, y) === 'mountain' && u.kind !== 'cavalry') return null;
      const queue = [{ x: u.x, y: u.y, path: [] }], visited = new Set([u.x + ',' + u.y]);
      for (let i = 0; i < queue.length; i++) {
        const current = queue[i]; if (current.x === x && current.y === y) return current.path;
        for (const [dx, dy] of [[-1, 0], [0, -1], [0, 1], [1, 0]]) {
          const nx = current.x + dx, ny = current.y + dy, key = nx + ',' + ny;
          if (nx < 0 || nx >= 8 || ny < 0 || ny >= 10 || visited.has(key)) continue;
          const t = terrain(nx, ny), occupied = at(nx, ny);
          if (t === 'river' || t === 'mountain' && u.kind !== 'cavalry' || occupied && occupied.id !== u.id && !(allowTarget && nx === x && ny === y)) continue;

    }
    function objectives() { return { lured: s.raised && campEmpty(), retreat: s.retreatOrdered && s.enteredWater,
      held: s.heldDone, north: !!s.flags[0], south: !!s.flags[1] }; }
    const achieved = () => Object.values(objectives()).every(Boolean);
    function snapshot(success) {
      const losses = s.units.filter(u => u.side === 'han' && u.hp <= 0).length;
      const exposed = s.units.filter(u => u.kind === 'cavalry' && u.exposed).length;
      const goal = objectives(), efficiency = Math.max(0, 10 - Math.max(0, s.turn - 6) - losses * 2 - exposed);
      return { success, score: success ? efficiency : Math.min(3, Object.values(goal).filter(Boolean).length), turns: s.turn,
        losses, exposed, infantryCohesion: s.units.filter(u => u.kind === 'infantry').reduce((sum, u) => sum + u.hp, 0),
        objectives: goal, orders: s.totalOrders, units: s.units.filter(u => u.side === 'han').map(u => ({ id: u.id, hp: u.hp, x: u.x, y: u.y })) };
    }
    function guideAllows(id, action, x, y) {
      if (!s.assisted) return true;
      const step = guide(); return !!step && step[0] === id && step[1] === action && (action !== 'move' || step[2] === x && step[3] === y);
    }
    function legal(id, action, x, y) {
      const u = unit(id); if (s.phase !== 'plan' || !u || u.side !== 'han' || u.hp <= 0 || !guideAllows(id, action, x, y)) return false;
      if (action === 'move') { const path = pathFor(u, x, y, false); return !u.moved && !!path && path.length > 0 && path.length <= u.move; }
      if (u.acted) return false;
      if (action === 'guard') return true;
      if (action === 'attack') { const target = at(x, y); return !!target && target.side === 'zhao' && distance(u, target) === 1; }
      if (action === 'raise') return u.kind === 'banner' && !s.raised;
      if (action === 'retreat') return u.kind === 'banner' && s.raised && !s.retreatOrdered && s.turn > s.raisedTurn;
      if (action === 'flag') { const i = BOARD.flags.findIndex(f => f.x === u.x && f.y === u.y); return u.kind === 'cavalry' && i >= 0 && !s.flags[i] && !s.flags.includes(id) && campEmpty(); }
      return false;
    }
    function preview(id, action, x, y) {
      if (!legal(id, action, x, y)) return null;
      const u = unit(id), verbs = { guard: '固守，抵消下一敵階段首個損失', raise: '舉旗接戰，讓趙軍出壁追逐', retreat: '下佯退令，還須親自移回水上軍', flag: '拔趙幟、立漢赤幟' };
      return { id, action, x, y, path: action === 'move' ? pathFor(u, x, y, false) : [], text: u.name + '：' +
        (action === 'move' ? coord(u.x, u.y) + ' → ' + coord(x, y) : action === 'attack' ? '壓制' + at(x, y).name + '，隊勢－1' : verbs[action]) + '。' };
    }
    function exposure() {
      if (campEmpty()) return;
      for (const u of s.units.filter(v => v.kind === 'cavalry' && v.hp > 0 && !v.exposed && terrain(v.x, v.y) !== 'mountain')) {
        if (s.units.some(z => z.side === 'zhao' && z.hp > 0 && distance(u, z) <= 2)) { u.exposed = true; s.report.push(u.name + '提前暴露；首次隱蔽紀錄已留下。'); }
      }
    }
    function commit(p) {
      if (!p || !legal(p.id, p.action, p.x, p.y)) return false;
      const u = unit(p.id);
      if (p.action === 'move') { u.x = p.x; u.y = p.y; u.moved = true; exposure(); }
      else {
        u.acted = true;
        if (p.action === 'guard') u.guard = true;
        else if (p.action === 'attack') { const target = at(p.x, p.y); target.hp = Math.max(0, target.hp - 1); }
        else if (p.action === 'raise') { s.raised = true; s.raisedTurn = s.turn; }
        else if (p.action === 'retreat') s.retreatOrdered = true;
        else if (p.action === 'flag') { const i = BOARD.flags.findIndex(f => f.x === u.x && f.y === u.y); s.flags[i] = u.id; }
      }
      if (s.retreatOrdered && inWaterArmy(unit('G'))) s.enteredWater = true;
      s.orders++; s.totalOrders++; if (s.assisted) s.guideIndex++;

    function enemyPhase() {
      if (!s.raised) { s.report.push('趙軍仍守趙壁：尚未見大將旗鼓。'); return; }
      const returning = s.flags.every(Boolean);
      for (const z of s.units.filter(u => u.side === 'zhao' && u.hp > 0)) {
        const target = unit('G').hp > 0 ? unit('G') : s.units.find(u => u.kind === 'infantry' && u.hp > 0);
        const home = INITIAL_UNITS.find(u => u.id === z.id), aim = returning ? home : target;

        if (path && path.length && (returning || path.length > 1)) {

          s.report.push(z.id + '：' + old + ' → ' + coord(z.x, z.y) + (returning ? '，回望漢旗。' : '，追向旗鼓。'));
        } else s.report.push(z.id + '：' + coord(z.x, z.y) + '停留，前路受阻。');
        exposure();
        if (returning) continue;
        const adjacent = s.units.filter(u => u.side === 'han' && u.hp > 0 && distance(z, u) === 1 && (u.kind !== 'cavalry' || u.exposed));
        adjacent.sort((a, b) => ({ banner: 0, infantry: 1, cavalry: 2 })[a.kind] - ({ banner: 0, infantry: 1, cavalry: 2 })[b.kind] || a.id.localeCompare(b.id));
        const victim = adjacent[0]; if (!victim) continue;

        victim.hp = Math.max(0, victim.hp - damage);
        s.report.push(z.id + '壓制' + victim.id + '：隊勢－' + damage + (victim.hp === 0 ? '，該隊退出本次推演。' : '。'));

  function battleGame(body, g) {
    if(g.ruleset===2&&ZH.gameplay)return ZH.gameplay.nativeTactics(body,g);
    return new Promise(resolve => {
      const old=g.getProgress(),model=createBattleModel(old.model),s=model.state;
      let alive=true,showHint=!!old.showHint,focusCell=old.focusCell || 1,feedback=old.feedback || '先讀規則，再親自開始推演。';
      const persist=()=>g.setProgress({model:JSON.parse(JSON.stringify(s)),showHint,focusCell,feedback});
      const actionNames = { move: '移動', attack: '壓制', guard: '固守', raise: '舉旗', retreat: '佯退', flag: '換旗' };
      function goalHTML() {
        const names = { lured: '引空趙壁', retreat: '佯退回水上軍', held: '背水守三回合', north: '北旗', south: '南旗' };
        return Object.entries(model.objectives()).map(([k, v]) => '<span>' + (v ? '✓ ' : '○ ') + names[k] + '</span>').join('');
      }
      function hint() {
        if (!s.raised) return '先選旗鼓隊G，思考接戰位置，再下舉旗令。D5能兼顧誘敵與回水上軍的路。';
        if (!s.retreatOrdered) return '舉旗次回合可下佯退令。旗鼓仍須由你移回B4～B8水上軍，B5留有通道。';
        if (!model.campEmpty()) return '先讓趙軍追出趙壁，輕騎在山間道等待，避免提前暴露。';
        if (!s.heldDone) return '至少兩隊背水隊留在B4～B8，親自固守與結算，維持三個敵方階段。';
        return '兩騎分赴H3、H7；沿G、H通道走，注意友軍占格。到旗位後還要親自選換旗並確認。';
      }
      function guideText() {
        const step = model.guide(); if (!step) return '';
        return step[0] === 'end' ? '本步：親自結算回合，閱讀趙軍回報。' : '本步：選' + step[0] + '，' + actionNames[step[1]] + (step[1] === 'move' ? '到' + coord(step[2], step[3]) : '') + '，看預覽後確認。';
      }
      function available(id, action) {
        if (action === 'move' || action === 'attack') {
          for (let y = 0; y < 10; y++) for (let x = 1; x < 8; x++) if (model.legal(id, action, x, y)) return true;
          return false;
        }
        return model.legal(id, action);
      }
      function boardHTML() {
        let cells = '';
        for (let y = 0; y < 10; y++) for (let x = 0; x < 8; x++) {
          const index = y * 8 + x, t = terrain(x, y), u = model.at(x, y), flag = BOARD.flags.findIndex(f => f.x === x && f.y === y);
          const possible = !!s.mode && !!s.selected && model.legal(s.selected, s.mode, x, y), pending = s.pending && s.pending.x === x && s.pending.y === y;
          const label = coord(x, y) + '・' + terrainName(t) + (u ? '・' + (u.side === 'han' ? '漢' : '趙') + '・' + u.name + '・隊勢' + u.hp : '') +
            (flag >= 0 ? '・' + BOARD.flags[flag].name + (s.flags[flag] ? '漢旗' : '趙旗') : '') + (possible ? '・可選目標' : '');

    const deeds = [
      '信少貧，漂母飯之，知其施不望報。', '遭市人之侮，忍而不爭一旦之氣。',
      '既將漢兵定魏，復與張耳北擊趙代。', '察敵計之不用，乃進井陘而籌其勢。',
      '分輕騎持赤幟，伏山伺趙，候其空壁。', '設背水之陳，與張耳以旗鼓出而佯退。',
      b.assisted ? '此局初策有失，存其績而親復推演，遂成諸路。' : b.score >= 7 ? '此局下令有序，護陣與易幟相接而成。' : '此局指揮有得失，逐回合察其變而記之。',
      '趙壁易幟，軍亂而破；信解左車之縛，師事之。', '從左車策，休兵鎮撫，遣使說燕而燕從之。',
      percent(command) >= 67 ? '後報漂母之恩，既為淮陰侯；此局論將，能辨將兵與將將。' : '後報漂母之恩，既為淮陰侯；此局論將初答有失，親讀而更之。'
    ];
    return { scenarioId: SID, mode: MODE, faction: '漢', role: '韓信', roleKind: 'liezhuan', country: '漢',
      bioTitle: '淮陰侯列傳', bioOpening: '淮陰侯韓信者，淮陰人也。', ending,
      scoreStrategy: bounded(b.score * 10 * .8 + percent(command) * .2), scoreVirtue: bounded((s.vars.consult.score + reflection.score) / 2),
      turns: s.steps || 1, durationSec: Math.min(5400, Math.max(0, Math.round((Date.now() - (s.startedAt || Date.now())) / 1000))),
      deeds, anchors: s.anchors, games: s.games, codex: s.codex,
      opener: '遊戲史官評語（自擬）：余觀井陘之策，察其諸路相應，亦思士卒之患與聽人之明。',
      prompts: ['如何理解韓信的忍辱？今日遇到欺凌，還有哪些保護尊嚴與安全的方法？',
        '背水戰術有哪些成立條件？請用本話一項操作說明，為何不能直接套成讀書時逼自己走投無路。',
        '韓信為何向敗將請教？如何避免只用輸贏判斷一個人的見解？'] };
  }
  function onEnd(r, ctx) {
    const s = ctx.state;
    const ending = ENDINGS[r.key] || ENDINGS.good; ZH.sfx('seal');
    return ctx.banner(ending.title, '韓信・此局列傳')
      .then(() => ctx.say([{ text: '井陘首次' + s.vars.battle.score + '／10；論將首答' + s.vars.command.score+'／'+s.vars.command.max+'分。核心操作均已親自完成。' },
        { who: 'shiguan', text: '以下為遊戲生成列傳。大事依史實，自擬事蹟與史官評語不冒充司馬遷原文。' }]))
      .then(()=>HX.finish(payload(s,ending)));
  }


  // ═════════════════════════ 8. 開始（沿用官方範例） ═════════════════════════
  const saveState=HX.saveState;

  function startGame(saved) {
    if(saved)HX.useState(saved);else HX.newRun();document.documentElement.classList.toggle('hm-still',HX.read('still',false));
    ROOT.innerHTML='';
    const game = ZH.story.create(ROOT, {
      id: SID, mode: MODE, title: META.name, subtitle: META.episode,
      seed: Number(params.seed) || 0, start: 'n_01',
      characters: CHARACTERS, meters: METERS, nodes: ZH.character?.chuhanNodes(SID,NODES,()=>game.save())||NODES, help: HELP,
      initState:()=>({_ocChapter:ZH.character?.newChapterState(SID)}),
      anchorTotal: ANCHOR_ORDER.length, anchorOrder: ANCHOR_ORDER,
      onEnd:onEnd,save:saveState,snapshot:HX.snapshot,anchorRunner:HX.runAnchor,onProgress:HX.cacheProgress,actions:[{label:"史冊",run:HX.book},{label:"存檔",run:HX.saveMenu}]
    });
    window.__ep=game;
    game.start(saved?ZH.character?.applyChapterChoice(SID,saved)||saved:null);
  }

  function renderTitle(saved) {
    const vol = ZH.VOLUMES.find(v => v.key === META.vol) || { no: '', name: '' };
    const st = saved && saved.engine;
    const btn = (a, label, primary) => '<button type="button" class="zh-btn ' + (primary ? 'zh-btn--primary' : 'zh-btn--quiet') + ' zh-btn--block" data-a="' + a + '">' + esc(label) + '</button>';
    ROOT.innerHTML =
      '<div class="ep-title" style="--ep-color:' + esc(ROLE.color) + '">' +
      '<div class="ep-title__bar"><a class="zh-mark" href="#" data-a="home"><span class="zh-mark__re">Re:</span><span class="zh-mark__name">縱橫鼎業</span></a>' +
      '<button type="button" class="zh-btn zh-btn--quiet zh-btn--sm" data-a="home">回首頁</button></div>' +
      '<main class="ep-title__main"><header>' +
      '<p class="ep-kicker">' + esc([vol.no + ' ' + vol.name, ZH.episodeLabel(META), '前 ' + META.year + ' 年'].join('・')) + '</p>' +
      '<h1 class="ep-h1">' + esc(META.name) + '</h1>' +
      '<p class="ep-episode">' + esc(META.episode) + '</p>' +
      '<div class="ep-chips">' + (META.guest ? '<span class="zh-chip zh-chip--gilt">訪客開放</span>' : '') +
      '<span class="zh-chip zh-chip--patina">' + esc(META.genre) + '</span>' +
      '<span class="zh-chip">自動存檔</span></div>' +
      (ZH.isGuest() ? '<p class="ep-note" style="margin-top:12px">你目前是訪客：可以完整遊玩，但進度只保存在這個分頁，也不會留下成績。</p>' : '') +
      '</header><section class="hx-title-panorama" aria-label="韓信、張耳與李左車">'+panorama('river',['hanxin','zhanger','lizuoche'],'dawn')+'</section>'+
      '<section class="ep-start"><span class="ep-seal" aria-hidden="true">' + esc(ROLE.glyph) + '</span>' +
      '<div><h2 class="ep-start__name">' + esc(ROLE.name) + '・' + esc(ROLE.title) + '</h2><p class="ep-start__lead">' + esc(ROLE.lead) + '</p></div>' +
      '<div class="ep-start__act">' + (st ? btn('continue', st.ended ? '查看結局' : '繼續', true) + btn('new', '重新開始', false) : btn('new', '開始遊戲', true)) + '</div></section>' +
      '<section class="ep-points" aria-label="本話重點">' + POINTS.map(p => '<div class="ep-point"><b>' + esc(p.title) + '</b><span>' + esc(p.text) + '</span></div>').join('') + '</section>' +
      '<p class="ep-note">本話共 ' + ANCHOR_ORDER.length + ' 個史實錨點。中途離開會自動存檔。</p>' +
      '</main></div>';
    const characterEntry=document.createElement('div');characterEntry.setAttribute('data-character-entry','');ROOT.querySelector('.ep-start').after(characterEntry);ZH.character?.mountEntry(characterEntry,SID,st);
    ROOT.querySelectorAll('[data-a="home"]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); ZH.go('hub'); }));
    const cont = ROOT.querySelector('[data-a="continue"]');
    if (cont) cont.addEventListener('click', () => { ZH.sfx('click'); startGame(st); });
    ROOT.querySelector('[data-a="new"]').addEventListener('click', () => {
      ZH.sfx('click');
      if (!st) { startGame(null); return; }
      ZH.modal({
        title: '重新開始？', body: '<p>目前的進度會清除，從頭開始。</p>',
        actions: [{ label: '取消', value: false, kind: 'quiet' }, { label: '重新開始', value: true, kind: 'primary' }]
      }).then(ok => { if (ok) ZH.deleteSave(SID, MODE).catch(() => null).then(() => startGame(null)); });
    });
  }

  const loadSave=HX.loadState;

  ZH.ready(()=>{
    if(!ZH.story?.createJournal || !ZH.arena || !window.ART){ROOT.innerHTML='<main class="ep-title__main"><h1>共用核心待更新</h1><p>請先安裝 Eng_Story v0.2.2、Arena_js 與 Art_kit，再開啟第七話。</p><button class="zh-btn zh-btn--primary" data-home>回首頁</button></main>';ROOT.querySelector('[data-home]').onclick=()=>ZH.go('hub');return;}
    ZH.loading(true, '展開竹簡');
    ZH.codex.init();
    Promise.all([loadSave(), anchorsReady]).then(([saved]) => {
      ZH.loading(false);
      // 從首頁「繼續遊戲」帶著模式進來：直接接續
      if (String(params.mode || '') === MODE && saved) { startGame(saved.engine); return; }
      renderTitle(saved);
    });
  });
})();

</script>
<script>ZH.ready(function(){ZH.textplay?.install("S_ch07_hanxin",null);});</script>
</body></html>
