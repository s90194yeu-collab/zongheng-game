  function onEnd(result,ctx){const s=ctx.state,e=ENDINGS[result&&result.key]||ENDINGS.good;ZH.sfx('seal');return ctx.banner(e.title,'吳師入郢・終').then(()=>ctx.say([{who:'shiguan',text:'三種評語都保留吳入郢、秦救楚、吳退的史實。回望這一局，你如何等待，又如何看待怨毒？',expr:'serious'}])).then(()=>ZH.deleteSave(SID,MODE).catch(()=>null)).then(()=>ZH.finishScenario(payload(s,e)));}
  function payload(s,ending){
    const f=s.flags,v=s.vars,trial=['zhaoguan','sanling','boju'].reduce((n,k)=>n+Number(v[k]&&v[k].firstScore||0),0)/30;
    const goodChoices=[f.resolve==='steady',f.prepare==='prepare',f.limit==='reflect'].filter(Boolean).length;
    const strategy=Math.round(ZH.clamp(25+goodChoices*15+trial*30,0,100));
    const virtue=Math.round(ZH.clamp(25+goodChoices*10+s.meters.heart*.3+(100-s.meters.resent)*.25,0,100));
    const deeds=['楚平王信讒，囚伍奢，召其二子。','尚歸與父俱死，員出奔，與勝入吳。'];
    deeds.push(f.resolve==='steady'?'哀而能持，察路保身以待時。':f.resolve==='haste'?'哀憤急行，失察前路，乃更慎之。':'初喪其志，賴人指途，乃知當自任。');
    deeds.push('過昭關，遇漁父，解劍相贈，漁父辭而不受。','至吳，進專諸於公子光，退耕於野。','闔閭既立，與員謀國；孫武明約束而練兵。');
    deeds.push(f.prepare==='prepare'?'省民勞，修糧秣，思與唐蔡共謀。':f.prepare==='press'?'屢催進師，未盡察民勞，乃更圖其備。':'專念私讎，未周國計，備兵有所未盡。');
    deeds.push('吳與唐蔡伐楚，五戰及郢；申包胥責其報讎過甚。');
    deeds.push(f.limit==='reflect'?'聞其責，知怨毒可害其判，省所行之度。':f.limit==='justify'?'徒以功成自解，未盡知報讎之限。':'拒異議而怨益深，功成亦失其度。');
    deeds.push('申包胥如秦乞師，秦師出，楚君復郢，吳師乃歸。');
    return {scenarioId:SID,mode:MODE,faction:'吳',role:'伍子胥',roleKind:'liezhuan',country:'楚',bioTitle:'伍子胥列傳',bioOpening:'伍子胥者，楚人也，名員。',ending,scoreStrategy:strategy,scoreVirtue:virtue,turns:s.steps||1,durationSec:Math.min(5400,Math.round((Date.now()-(s.startedAt||Date.now()))/1000)),deeds,anchors:s.anchors,games:s.games,codex:s.codex,opener:'余讀〈伍子胥列傳〉，至江上漁父辭劍，未嘗不歎楚之有義人也。',prompts:['你能理解伍子胥的復仇嗎？理解動機後，如何仍判斷行動是否越界？','漁父不收劍、申包胥如秦乞師，他們所守的義有什麼不同？','受到傷害後，可以用哪些方法避免怨恨吞沒判斷，又不忽視自己的傷痛？']};

      '<div><h2 class="ep-start__name">' + esc(ROLE.name) + '・' + esc(ROLE.title) + '</h2><p class="ep-start__lead">' + esc(ROLE.lead) + '</p></div>' +
      '<div class="ep-start__act">' + (st ? btn('continue', st.ended ? '查看結局' : '繼續', true) + btn('new', '重新開始', false) : btn('new', '開始遊戲', true)) + '</div></section>' +
      '<section class="ep-points" aria-label="本話重點">' + POINTS.map(p => '<div class="ep-point"><b>' + esc(p.title) + '</b><span>' + esc(p.text) + '</span></div>').join('') + '</section>' +
      '<p class="ep-note">本話共 ' + ANCHOR_ORDER.length + ' 個史實錨點。中途離開會自動存檔。</p>' +
      '</main></div>';
    ROOT.querySelectorAll('[data-a="home"]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); ZH.go('hub'); }));
    const cont = ROOT.querySelector('[data-a="continue"]');
    if (cont) cont.addEventListener('click', () => { ZH.sfx('click'); startGame(st); });
    ROOT.querySelector('[data-a="new"]').addEventListener('click', () => {
      ZH.sfx('click');
      if (!st) { startGame(null); return; }
      ZH.modal({
        title: '重新開始？', body: '<p>目前的進度會清除，從頭開始。</p>',
        actions: [{ label: '取消', value: false, kind: 'quiet' }, { label: '重新開始', value: true, kind: 'primary' }]
      }).then(ok => { if (ok) ZH.deleteSave(SID, MODE).catch(() => null).then(() => startGame(null)); });
    });
  }

  const loadSave = () => ZH.load(SID, MODE).then(r => (r && r.ok && r.state && r.state.engine ? r.state : null)).catch(() => null);

  ZH.ready(() => {
    ZH.loading(true, '展開竹簡');
    ZH.codex.init();
    Promise.all([loadSave(), Promise.race([anchorsReady, ZH.sleep(8000)])]).then(([saved]) => {
      ZH.loading(false);
      // 從首頁「繼續遊戲」帶著模式進來：直接接續
      if (String(params.mode || '') === MODE && saved) { startGame(saved.engine); return; }
      renderTitle(saved);
    });
  });
})();
</script>
