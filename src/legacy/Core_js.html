<!-- Core_js.html — v0.3.8（2026-10-16）
完整替換 Apps Script 的 Core_js HTML 內容，不是追加段。
結算改用原分頁原生連結；保留所有既有平台、紙娃娃、技能、收藏與配樂功能。
保留平台 v0.3.0 功能，整合配樂 v0.1.3（沿用 v0.1.2 播放與快取）；沿用 MusicApi.gs。
紙娃娃設定與技能模組完整內嵌；3D展示由 Profile／Gallery 直接 include Studio3D；現用 Code 需有 profile、gallery 路由。
-->
<script>
(function (global) {
  'use strict';

  const ZH = global.ZH || {};
  const BOOT = global.ZH_BOOT || {};

  ZH.VERSION = 'v0.3.8';
  ZH.boot = BOOT;
  ZH.user = Object.assign({ email: '', isSchool: false, isGuest: true, isTeacher: false, loginUrl: '' }, BOOT.user || {});
  ZH.guestScenarios = Array.isArray(BOOT.guestScenarios) ? BOOT.guestScenarios : [];


  // ───────────────────────── 小工具 ─────────────────────────

  ZH.esc = function (value) {
    return String(value === null || value === undefined ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  };
  ZH.qs = (sel, root) => (root || document).querySelector(sel);
  ZH.qsa = (sel, root) => Array.prototype.slice.call((root || document).querySelectorAll(sel));
  ZH.sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
  ZH.clamp = (n, min, max) => Math.min(max, Math.max(min, n));

  /** 用 HTML 字串建立元素 */
  ZH.html = function (markup) {
    const tpl = document.createElement('template');
    tpl.innerHTML = String(markup).trim();
    return tpl.content.firstElementChild;
  };

  /** DOM 準備好後執行 */
  ZH.ready = function (fn) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn, { once: true });
    else fn();
  };

  ZH.isGuest = () => !ZH.user.isSchool;
  ZH.isSchool = () => !!ZH.user.isSchool;
  ZH.isGuestPlayable = id => ZH.guestScenarios.indexOf(id) > -1;
  /** 這個劇本目前能不能玩：學校帳號全部可玩，訪客只能玩開放的關卡 */
  ZH.canPlay = id => ZH.isSchool() || ZH.isGuestPlayable(id);


  // ───────────────────────── 瀏覽器儲存（失敗時改存記憶體） ─────────────────────────

  const memoryStore = {};
  function makeStore(kind) {
    return {
      get(key, fallback) {
        try {
          const raw = global[kind].getItem('zh:' + key);
          return raw === null ? fallback : JSON.parse(raw);
        } catch (err) {
          return Object.prototype.hasOwnProperty.call(memoryStore, kind + key) ? memoryStore[kind + key] : fallback;
        }
      },
      set(key, value) {
        try {
          global[kind].setItem('zh:' + key, JSON.stringify(value));
        } catch (err) {
          memoryStore[kind + key] = value;
        }
      },
      remove(key) {
        try { global[kind].removeItem('zh:' + key); } catch (err) { delete memoryStore[kind + key]; }
      }
    };
  }
  ZH.local = makeStore('localStorage');     // 個人設定（留在這台裝置）
  ZH.session = makeStore('sessionStorage'); // 訪客進度（關閉分頁就消失）


  // ───────────────────────── 呼叫伺服器 ─────────────────────────

  /**
   * 呼叫伺服器函式，回傳 Promise。
   * 例：ZH.call('api_saveGame', 'S_cq08_weizheng', 'history', state, ZH.VERSION)
   */
  ZH.call = function (fnName) {
    const args = Array.prototype.slice.call(arguments, 1);
    return new Promise((resolve, reject) => {
      if (!(global.google && google.script && google.script.run)) {
        reject(new Error('目前不在遊戲網址中，無法連線伺服器。'));
        return;
      }
      let done = false;
      const timer = setTimeout(() => {
        if (done) return;
        done = true;
        reject(new Error('伺服器回應逾時，請檢查網路後再試一次。'));
      }, 30000);
      const runner = google.script.run
        .withSuccessHandler(result => {
          if (done) return;
          done = true;
          clearTimeout(timer);
          resolve(result);
        })
        .withFailureHandler(error => {
          if (done) return;
          done = true;
          clearTimeout(timer);
          reject(error instanceof Error ? error : new Error(String((error && error.message) || error)));
        });
      runner[fnName].apply(runner, args);
    });
  };


  // ───────────────────────── 頁面切換與登入 ─────────────────────────

  /** 組出某頁的網址 */
  ZH.url = function (page, params) {
    const base = BOOT.appUrl || '';
    const query = Object.assign({ page: page }, params || {});
    const parts = Object.keys(query)
      .filter(k => query[k] !== undefined && query[k] !== null && query[k] !== '')
      .map(k => encodeURIComponent(k) + '=' + encodeURIComponent(query[k]));
    return base + (parts.length ? '?' + parts.join('&') : '');
  };

  /** 直接更新最外層目前分頁；遇到 iframe 限制時交給使用者點選原生連結。 */
  function openTop(href) {
    try {
      if (global.top === global) global.location.assign(href);
      else global.top.location.href = href;
      return true;
    } catch (err) { return false; }
  }

  // 非同步儲存會讓瀏覽器的使用者啟用狀態過期；過期後用原生連結接續，不模擬點擊。
  let lastGesture = 0, navigationSeq = 0;
  ['pointerdown', 'keydown', 'click', 'touchend'].forEach(type => {
    document.addEventListener(type, e => { if (e.isTrusted) lastGesture = Date.now(); }, true);
  });
  function canNavigate() {
    const ua = global.navigator && global.navigator.userActivation;
    if (ua && typeof ua.isActive === 'boolean') return ua.isActive && Date.now() - lastGesture < 4000;
    return Date.now() - lastGesture < 1000;
  }

  // 原專案若仍有 target=_blank 的遊戲內連結，按下時統一導向目前分頁。
  document.addEventListener('click', e => {
    const a = e.target.closest && e.target.closest('a[href]');
    if (!a || !BOOT.appUrl || a.hasAttribute('download')) return;
    try {
      const app = new URL(BOOT.appUrl, global.location.href), destination = new URL(a.href, global.location.href);
      if (destination.origin === app.origin && destination.pathname === app.pathname) a.target = '_top';
    } catch (err) { /* 無法解析的外部連結沿用本身行為。 */ }
  }, true);

  const GATE_TEXT = {
    result: { title: '這一話結束了', body: '本局結算已留在這個分頁。按下面的連結，查看本局成績與列傳。', label: '前往結算頁' },
    hub: { title: '回到首頁', body: '這次操作已完成。按下面的連結回到首頁。', label: '回首頁' },
    login: { title: '登入學校帳號', body: '按下面的連結，在這個分頁登入學校帳號。', label: '登入學校帳號' }
  };
  /** 真正的連結由使用者直接啟用，讓 Apps Script iframe 在原分頁切換。 */
  function gate(href, page) {
    const t = GATE_TEXT[page] || { title: '準備好了', body: '按下面的連結繼續。', label: '繼續' };
    const old = document.querySelector('.zh-gate');
    if (old) old.remove();
    const el = ZH.html(
      '<div class="zh-modal zh-gate" role="dialog" aria-modal="true" aria-labelledby="zh-gate-t">' +
      '<div class="zh-modal__dialog"><h2 class="zh-modal__title" id="zh-gate-t">' + ZH.esc(t.title) + '</h2>' +
      '<div class="zh-modal__body"><p>' + ZH.esc(t.body) + '</p></div>' +
      '<div class="zh-modal__actions"><a class="zh-btn zh-btn--primary" data-gate="go" href="' + ZH.esc(href) + '" target="_top">' + ZH.esc(t.label) + '</a></div></div></div>'
    );
    document.body.appendChild(el);
    const link = el.querySelector('[data-gate="go"]');
    link.addEventListener('click', e => {
      if (e.button || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
      if (link.getAttribute('aria-disabled') === 'true') { e.preventDefault(); return; }
      link.setAttribute('aria-disabled', 'true');
      ZH.loading(true, '前往中');
      // 預設連結行為直接換頁；若瀏覽器限制了導覽，三秒後仍可再按一次。
      setTimeout(() => { if (el.isConnected) { link.removeAttribute('aria-disabled'); ZH.loading(false); } }, 3000);
    });
    link.focus();
  }

  /** 紀錄先送出；結算及等待後的導覽，都以目前分頁的原生連結接續。 */
  const GO_WAIT = 8000;
  ZH.go = function (page, params) {
    const href = ZH.url(page, params), seq = ++navigationSeq;
    if (page !== 'result' && !ZH.pendingCount() && canNavigate()) {
      ZH.loading(true, '前往中');
      if (openTop(href)) return;
      ZH.loading(false); gate(href, page); return;
    }
    ZH.loading(true, ZH.pendingCount() ? '保存紀錄中' : '準備中');
    Promise.race([Promise.resolve().then(() => ZH.flushAll()).catch(() => null), ZH.sleep(GO_WAIT)]).then(() => {
      if (seq !== navigationSeq) return;
      ZH.loading(false);
      gate(href, page);
    });
  };

  /** 前往 Google 帳號登入，沿用目前分頁。 */
  ZH.login = function () {
    ZH.flush();
    const href = ZH.user.loginUrl || BOOT.appUrl || '/';
    if (!canNavigate() || !openTop(href)) gate(href, 'login');
  };


  // ───────────────────────── 存檔 ─────────────────────────

  const guestSaveKey = (id, mode) => 'save:' + id + ':' + mode;

  /** 存檔：學校帳號存伺服器，訪客存在這個分頁 */
  ZH.save = function (scenarioId, mode, state) {
    if (ZH.isGuest()) {
      ZH.session.set(guestSaveKey(scenarioId, mode), { state: state, savedAt: new Date().toISOString() });
      return Promise.resolve({ ok: true, guest: true });
    }
    return ZH.call('api_saveGame', scenarioId, mode, state, ZH.VERSION);
  };

  /** 讀檔：沒有存檔時 state 為 null */
  ZH.load = function (scenarioId, mode) {
    if (ZH.isGuest()) {
      const saved = ZH.session.get(guestSaveKey(scenarioId, mode), null);
      return Promise.resolve({ ok: true, guest: true, state: saved ? saved.state : null });
    }
    return ZH.call('api_loadGame', scenarioId, mode);
  };

  /** 列出存檔（首頁「繼續遊戲」） */
  ZH.listSaves = function () {
    if (ZH.isGuest()) return Promise.resolve({ ok: true, guest: true, saves: [] });
    return ZH.call('api_listSaves');
  };

  /** 刪除存檔（重新開始） */
  ZH.deleteSave = function (scenarioId, mode) {
    if (ZH.isGuest()) {
      ZH.session.remove(guestSaveKey(scenarioId, mode));
      return Promise.resolve({ ok: true, guest: true });
    }
    return ZH.call('api_deleteSave', scenarioId, mode);
  };


  // ───────────────────────── 紀錄佇列 ─────────────────────────

  const queue = [];
  const QUEUE_LIMIT = 200;   // 斷線時最多暫存的事件數
  const FLUSH_SIZE = 10;     // 累積到這個數量就送出
  const FLUSH_DELAY = 12000; // 或者每 12 秒送一次
  const PENDING_KEY = 'pendingLog'; // 換頁時暫存未送出紀錄的鍵名
  let flushing = null;
  let flushTimer = null;
  let leaving = false;

  /** 還沒送出（含送出中）的紀錄數 */
  ZH.pendingCount = () => queue.length + (flushing ? 1 : 0);

  /**
   * 記錄一個事件。訪客不記錄。
   * type：scenario｜anchor｜minigame｜codex｜reflection（欄位見 Log.gs）
   */
  ZH.track = function (type, data) {
    if (ZH.isGuest()) return;
    queue.push({ type: type, data: data || {} });
    if (queue.length > QUEUE_LIMIT) queue.splice(0, queue.length - QUEUE_LIMIT);
    if (queue.length >= FLUSH_SIZE) ZH.flush();
    else if (!flushTimer) flushTimer = setTimeout(() => ZH.flush(), FLUSH_DELAY);
  };

  /** 把佇列全部送完（分批送出）；任何一批失敗就停下，留待下次 */
  ZH.flushAll = function () {
    return ZH.flush().then(result => {
      if (queue.length && result && result.ok !== false) return ZH.flushAll();
      return result;
    });
  };

  /** 立即送出佇列中的事件；失敗時保留在佇列下次再送 */
  ZH.flush = function () {
    if (flushTimer) { clearTimeout(flushTimer); flushTimer = null; }
    if (flushing) return flushing;
    if (!queue.length || ZH.isGuest()) return Promise.resolve({ ok: true, recorded: 0 });

    const batch = queue.splice(0, 60);
    flushing = ZH.call('api_logBatch', batch)
      .then(result => {
        if (!result || !result.ok) queue.unshift.apply(queue, batch);
        return result;
      })
      .catch(err => {
        queue.unshift.apply(queue, batch);
        return { ok: false, msg: err.message };
      })
      .then(result => {
        flushing = null;
        if (queue.length && !flushTimer) flushTimer = setTimeout(() => ZH.flush(), FLUSH_DELAY);
        return result;
      });
    return flushing;
  };

  // 分頁被切到背景時先送出；離開這一頁時，把還沒送出的紀錄暫存到分頁裡
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && !leaving) ZH.flush();
  });
  global.addEventListener('pagehide', () => {
    leaving = true;
    if (queue.length && !ZH.isGuest()) {
      ZH.session.set(PENDING_KEY, { email: ZH.user.email, events: queue.slice(-QUEUE_LIMIT) });
    } else {
      ZH.session.remove(PENDING_KEY);
    }
  });
  // 按「上一頁」從快取回到這一頁時，佇列還在記憶體裡，暫存的那份就不需要了
  global.addEventListener('pageshow', e => {
    if (!e.persisted) return;
    leaving = false;
    ZH.session.remove(PENDING_KEY);
  });

  // 上一頁沒送完的紀錄：同一個帳號才補送
  (function restorePending() {
    const saved = ZH.session.get(PENDING_KEY, null);
    ZH.session.remove(PENDING_KEY);
    if (!saved || !Array.isArray(saved.events) || !saved.events.length) return;
    if (ZH.isGuest() || saved.email !== ZH.user.email) return;
    queue.unshift.apply(queue, saved.events.slice(-QUEUE_LIMIT));
    flushTimer = setTimeout(() => ZH.flush(), 600);
  })();


  // ───────────────────────── 一話結束 ─────────────────────────

  /**
   * 劇本頁在一話結束時呼叫：寫入每局結果、把結算資料交給結算頁，然後換頁。
   * result 欄位（* 為必填）：
   *   scenarioId*   劇本代碼
   *   mode          history 正史｜romance 演義（預設 history）
   *   faction       陣營，例如 鄭（寫入紀錄）
   *   role          扮演的人物，例如 燭之武
   *   roleKind      liezhuan 列傳（遊士、臣子）｜shijia 世家（國君）｜benji 本紀（天子）
   *   country       人物所屬國家，例如 鄭
   *   ending        { id, title: '小國存續', text: '結局的一兩句文言敘述', good: true }
   *   scoreStrategy 謀略 0–100；scoreVirtue 德望 0–100
   *   turns、durationSec
   *   deeds         列傳正文：依玩家實際作為組成的文言句子陣列
   *   anchors       ZH.anchor.runAll 的回傳結果
   *   games         [{ gameId, score, maxScore }] 這一局的小遊戲成績
   *   codex         這一局新解鎖的圖鑑（類型:代碼）；用 ZH.codex.unlock 解鎖的會自動加入，
   *                 這一話授予的諸子、六經（ZH.CODEX_GRANTS）也會在這裡自動收入
   *   opener        「太史公曰」的第一句（劇本專屬）
   *   prompts       反思題目（2–3 題）
   */
  ZH.finishScenario = function (result) {
    const r = Object.assign({ mode: 'history', deeds: [], anchors: [], games: [], codex: [], prompts: [] }, result || {});
    if (!r.scenarioId) throw new Error('ZH.finishScenario 需要 scenarioId。');
    r.finishedAt = new Date().toISOString();
    r.bioLogged = false;
    ZH.codex.grantFor(r.scenarioId);
    ZH.codex.fresh().forEach(k => { if (r.codex.indexOf(k) === -1) r.codex.push(k); });
    const ending = r.ending && typeof r.ending === 'object' ? r.ending : { title: String(r.ending || '') };
    r.ending = ending;
    ZH.track('scenario', {
      scenarioId: r.scenarioId,
      mode: r.mode,
      faction: r.faction || '',
      ending: ending.title || '',
      scoreStrategy: r.scoreStrategy,
      scoreVirtue: r.scoreVirtue,
      turns: r.turns,
      durationSec: r.durationSec,
      clientVersion: ZH.VERSION
    });
    ZH.session.set('result:' + r.scenarioId, r);
    ZH.go('result', { s: r.scenarioId });
  };


  // ───────────────────────── 史冊圖鑑 ─────────────────────────

  const codexSet = {};
  const codexFresh = [];   // 這一頁新解鎖的項目（一話結束時交給結算頁）
  let codexLoaded = null;

  ZH.codex = {
    /** 載入已解鎖清單（頁面開始時呼叫一次） */
    init() {
      if (codexLoaded) return codexLoaded;
      if (ZH.isGuest()) {
        ZH.session.get('codex', []).forEach(k => { codexSet[k] = true; });
        codexLoaded = Promise.resolve(Object.keys(codexSet));
      } else {
        codexLoaded = ZH.access.read()
          .then(() => Object.keys(codexSet))
          .catch(() => Object.keys(codexSet));
      }
      return codexLoaded;
    },
    has(itemType, itemId) {
      return !!codexSet[itemType + ':' + itemId];
    },
    count(itemType) {
      return Object.keys(codexSet).filter(k => !itemType || k.indexOf(itemType + ':') === 0).length;
    },
    /** 已解鎖的全部項目（類型:代碼） */
    keys() {
      return Object.keys(codexSet);
    },
    /** 這一頁新解鎖的項目 */
    fresh() {
      return codexFresh.slice();
    },
    /**
     * 解鎖一個圖鑑項目；第一次解鎖時顯示提示並寫入紀錄。
     * itemType：person 人物｜idiom 成語｜treasure 寶物｜text 原文｜school 諸子｜classic 六經
     */
    unlock(itemType, itemId, scenarioId, label, options) {
      const key = itemType + ':' + itemId;
      if (codexSet[key]) return false;
      codexSet[key] = true;
      codexFresh.push(key);
      if (ZH.isGuest()) ZH.session.set('codex', Object.keys(codexSet));
      else if (!(ZH.cutinIsItem && ZH.cutinIsItem(key))) ZH.track('codex', { itemType: itemType, itemId: itemId, scenarioId: scenarioId || '' }); // 名場面由伺服器依通關紀錄計算，重播不寫入授予。
      if (options && options.quiet) return true; // 不跳卡片（例如一話結束、馬上要換頁時）
      if (ZH.codexBook && ZH.codexBook.announce) {
        ZH.codexBook.announce(key); // 有載入 Codex_js 時顯示解鎖卡片
      } else {
        if (label) ZH.toast('史冊解鎖：' + label, 'ok');
        ZH.sfx('seal');
      }
      return true;
    },
    /**
     * 收入這一話授予的跨劇本項目（諸子、六經；Data_codex 的 ZH.CODEX_GRANTS）。
     * ZH.finishScenario 會自動呼叫；回傳這次新收入的鍵。
     */
    grantFor(scenarioId) {
      const map = ZH.CODEX_GRANTS || {};
      const got = [];
      Object.keys(map).forEach(key => {
        const list = Array.isArray(map[key]) ? map[key] : [];
        if (!list.some(g => g && g.s === scenarioId)) return;
        const i = key.indexOf(':');
        if (i < 1) return;
        if (ZH.codex.unlock(key.slice(0, i), key.slice(i + 1), scenarioId, '', { quiet: true })) got.push(key);
      });
      return got;
    }
  };


  // 帳號蒐集設定與紀錄管理：一次載入，對話切換不增加伺服器請求。
  let accessPromise = null;
  ZH.access = {
    state: null,
    apply(res, preserveFresh) {
      if (!res || res.ok === false) throw new Error(res && res.msg || '讀取蒐集設定失敗。');
      this.state = Object.assign({}, this.state || {}, res);
      if (typeof res.isTeacher === 'boolean') ZH.user.isTeacher = res.isTeacher;
      const pending = preserveFresh ? codexFresh.slice() : [];
      Object.keys(codexSet).forEach(k => { delete codexSet[k]; });
      (res.items || []).forEach(k => { codexSet[k] = true; });
      pending.forEach(k => { codexSet[k] = true; });
      if (!preserveFresh) codexFresh.length = 0;
      codexLoaded = Promise.resolve(Object.keys(codexSet));
      document.dispatchEvent(new CustomEvent('zh:collection-change', { detail: res }));
      return res;
    },
    read(force) {
      if (accessPromise && !force) return accessPromise;
      accessPromise = ZH.call('api_getProgressAccess').then(res => this.apply(res, !force)).catch(err => { accessPromise = null; throw err; });
      return accessPromise;
    },
    async set(action) {
      if (action === 'reset') {
        const ok = await ZH.modal({ title: '改回未解鎖？', body: '<p>會清空你的實際蒐集與教師授予，並關閉全蒐集展示。遊玩成績和存檔保留；之後可以重新蒐集。</p>', actions: [{ label: '取消', value: false, kind: 'quiet' }, { label: '清空並改回未解鎖', value: true, kind: 'seal' }] });
        if (!ok) return null;
      }
      const flushed = await ZH.flushAll();
      if (flushed && flushed.ok === false) throw new Error('尚有紀錄未送出，請稍後再設定。');
      const res = await ZH.call('api_setMyCollectionMode', action);
      this.apply(res);
      if (action === 'reset') clearRecordLocal('collections');
      accessPromise = Promise.resolve(res);
      ZH.toast(action === 'all' ? '已開啟全蒐集展示。' : action === 'reset' ? '已改回未解鎖。' : '已切回實際遊玩蒐集。', 'ok');
      return res;
    }
  };
  function clearRecordLocal(scope, sid, mode) {
    const matches = key => {
      if (!key.startsWith('zh:')) return false;
      const bare = key.slice(3);
      if (scope === 'collections') return bare === 'codex' || bare.startsWith('result:');
      if (scope === 'all') return /^(save:|result:|world:|codex$|pendingLog$)/.test(bare);
      if (scope === 'save') return bare === guestSaveKey(sid, mode) || (sid === 'campaign' && bare === 'world:' + String(mode).split(':')[1]);
      return bare.startsWith('save:' + sid + ':') || bare === 'result:' + sid;
    };
    ['localStorage', 'sessionStorage'].forEach(kind => {
      try { const storage = global[kind], keys = []; for (let i = 0; i < storage.length; i++) keys.push(storage.key(i)); keys.filter(matches).forEach(k => storage.removeItem(k)); } catch (e) { /* 儲存由記憶體備援 */ }
      Object.keys(memoryStore).forEach(k => { if (k.startsWith(kind) && matches('zh:' + k.slice(kind.length))) delete memoryStore[k]; });
    });
    const ticket = ZH.session.get('world:return', null);
    if (scope === 'all' || scope === 'save' && ticket && sid === 'campaign' && ticket.w === String(mode).split(':')[1] || scope === 'chapter' && ticket && ticket.sid === sid) ZH.session.remove('world:return');
  }
  function localSummary() {
    const saves = [], seen = new Set();
    function add(key) {
      const m = /^zh:save:(S_(?:cq|zg|ch)\d{2}_[a-z0-9]+|campaign):(.+)$/.exec(key);
      if (!m || seen.has(key)) return; seen.add(key);
      const value = ZH.session.get(key.slice(3), {});
      saves.push({ scenarioId: m[1], mode: m[2], savedAt: value.savedAt || '' });
    }
    try { for (let i = 0; i < global.sessionStorage.length; i++) add(global.sessionStorage.key(i)); } catch (e) { /* 記憶體備援 */ }
    Object.keys(memoryStore).filter(k => k.startsWith('sessionStorage')).forEach(k => add('zh:' + k.slice('sessionStorage'.length)));
    return { ok: true, guest: true, saves, chapters: (ZH.CATALOG || []).filter(s => s.status === 'ready'), collection: { items: ZH.codex.keys() } };
  }
  ZH.records = {
    summary() { return ZH.isGuest() ? Promise.resolve(localSummary()) : ZH.call('api_getMyRecordSummary'); },
    async remove(scope, sid, mode) {
      if (!ZH.isGuest()) {
        const flushed = await ZH.flushAll();
        if (flushed && flushed.ok === false) throw new Error('尚有紀錄未送出，請稍後再刪除。');
      }
      const res = ZH.isGuest() ? { ok: true } : await ZH.call('api_deleteMyRecords', scope, sid || '', mode || '');
      if (!res || !res.ok) throw new Error(res && res.msg || '刪除失敗。');
      clearRecordLocal(scope, sid, mode);
      if (scope !== 'save' && ZH.isGuest()) {
        const kept = scope === 'all' ? [] : ZH.codex.keys().filter(k => { const it = ZH.codexItem(k); return !it || it.scenarioId !== sid; });
        ZH.session.set('codex', kept); res.collection = { items: kept, mode: 'earned' };
      }
      if (res.collection) { ZH.access.apply(res.collection); accessPromise = ZH.isGuest() ? null : Promise.resolve(res.collection); }
      document.dispatchEvent(new CustomEvent('zh:records-change', { detail: { scope, sid, mode } }));
      ZH.toast('已刪除選定紀錄。', 'ok');
      return res;
    },
    async confirm(scope, sid, mode) {
      const s = ZH.findScenario(sid), names = { cq: '春秋爭盟', zg: '戰國縱橫', ch: '楚漢逐鹿' };
      const label = sid === 'campaign' ? names[String(mode).split(':')[1]] || '天下大地圖' : s ? s.name : sid;
      const body = scope === 'all' ? '<p>刪除你的全部劇本與三篇大地圖存檔、作答、成績、反思、列傳及蒐集，並取消全蒐集展示與教師授予。班級座號、暱稱和音樂設定保留。</p>' : scope === 'save' ? '<p>刪除「' + ZH.esc(label) + '」這筆存檔，保留成績與蒐集。</p>' : '<p>刪除「' + ZH.esc(label) + '」的全部模式存檔、作答、成績、反思、列傳及由此話首次收錄的蒐集，並取消本話教師授予。</p><p>由其他章節收錄的共享項目保留；全蒐集展示如仍開啟，會繼續顯示全部項目。</p>';
      const ok = await ZH.modal({ title: '確認刪除紀錄', body: body + '<p class="zh-dim">刪除後無法復原。</p>', actions: [{ label: '取消', value: false, kind: 'quiet' }, { label: '確認刪除', value: true, kind: 'seal' }] });
      if (!ok) return null;
      ZH.loading(true, '刪除紀錄');
      try { return await this.remove(scope, sid, mode); } finally { ZH.loading(false); }
    },
    async open() {
      ZH.loading(true, '讀取自己的紀錄');
      let data;
      try { data = await this.summary(); if (!data || !data.ok) throw new Error(data && data.msg || '讀取失敗。'); }
      finally { ZH.loading(false); }
      const label = s => { const vol = (ZH.VOLUMES || []).find(v => v.key === s.vol); return (vol ? vol.name + '・' : '') + ZH.episodeLabel(s) + ' ' + s.name; };
      const worlds = { cq: '春秋爭盟', zg: '戰國縱橫', ch: '楚漢逐鹿' };
      const saveName = s => s.scenarioId === 'campaign' ? '天下大地圖・' + (worlds[String(s.mode).split(':')[1]] || s.mode) : (ZH.findScenario(s.scenarioId) || {}).name || s.scenarioId;
      const h = '<div class="zh-field"><label for="record-scope">刪除範圍</label><select class="zh-input zh-select" id="record-scope"><option value="save">只刪除單筆存檔</option><option value="chapter">指定章節的紀錄與蒐集</option><option value="all">全部遊玩紀錄與蒐集</option></select></div>' +
        '<div class="zh-field" id="record-save-field"><label for="record-save">存檔</label><select class="zh-input zh-select" id="record-save">' + (data.saves.length ? data.saves.map((s, i) => '<option value="' + i + '">' + ZH.esc(saveName(s) + '・' + s.mode + '・' + s.savedAt) + '</option>').join('') : '<option value="">沒有存檔</option>') + '</select></div>' +
        '<div class="zh-field" id="record-chapter-field" hidden><label for="record-chapter">章節</label><select class="zh-input zh-select" id="record-chapter">' + data.chapters.map(s => '<option value="' + ZH.esc(s.id) + '">' + ZH.esc(label(s)) + '</option>').join('') + '</select></div>' +
        '<p class="zh-dim zh-small" style="margin-top:16px">' + (ZH.isGuest() ? '管理本分頁的訪客進度。' : '只管理目前登入帳號的紀錄。') + '下一步會列出刪除內容供你確認。</p>';
      const done = ZH.modal({ title: '我的紀錄', body: h, actions: [{ label: '收起', value: false, kind: 'quiet' }, { label: '下一步', value: true, kind: 'primary' }] });
      const scopeEl = document.getElementById('record-scope'), chapterEl = document.getElementById('record-chapter'), saveEl = document.getElementById('record-save');
      scopeEl.addEventListener('change', () => { document.getElementById('record-save-field').hidden = scopeEl.value !== 'save'; document.getElementById('record-chapter-field').hidden = scopeEl.value !== 'chapter'; });
      if (!await done) return;
      const scope = scopeEl.value, save = data.saves[Number(saveEl.value)];
      if (scope === 'save' && (!save || saveEl.value === '')) { ZH.toast('目前沒有可刪除的存檔。'); return; }
      return this.confirm(scope, scope === 'save' ? save.scenarioId : scope === 'chapter' ? chapterEl.value : '', scope === 'save' ? save.mode : '');
    }
  };


  // ───────────────────────── 個人設定 ─────────────────────────

  const DEFAULT_SETTINGS = { sound: true, volume: 0.7, textSpeed: 'normal' };
  ZH.settings = Object.assign({}, DEFAULT_SETTINGS, ZH.local.get('settings', {}));
  ZH.setSetting = function (key, value) {
    ZH.settings[key] = value;
    ZH.local.set('settings', ZH.settings);
    if (key === 'volume' || key === 'sound') applyVolume();
  };


  // ───────────────────────── 介面元件 ─────────────────────────

  function ensureLayer(className) {
    let el = document.querySelector('.' + className);
    if (!el) {
      el = document.createElement('div');
      el.className = className;
      document.body.appendChild(el);
    }
    return el;
  }

  /** 底部提示訊息。kind：ok｜bad｜不填 */
  ZH.toast = function (message, kind, ms) {
    const layer = ensureLayer('zh-toasts');
    layer.setAttribute('role', 'status');
    layer.setAttribute('aria-live', 'polite');
    const item = document.createElement('div');
    item.className = 'zh-toast' + (kind ? ' zh-toast--' + kind : '');
    item.textContent = message;
    layer.appendChild(item);
    setTimeout(() => {
      item.classList.add('is-leaving');
      setTimeout(() => item.remove(), 320);
    }, ms || 2600);
  };

  /**
   * 彈出視窗，回傳 Promise，值為使用者按下的按鈕 value。
   * ZH.modal({ title, body, actions: [{ label, value, kind: 'primary'|'quiet'|'seal' }], dismissible })
   * body 為 HTML 字串，請先用 ZH.esc 處理使用者輸入。
   */
  ZH.modal = function (options) {
    const opts = Object.assign({ title: '', body: '', actions: [{ label: '確定', value: true, kind: 'primary' }], dismissible: true }, options || {});
    return new Promise(resolve => {
      const previous = document.activeElement;
      const wrap = ZH.html(
        '<div class="zh-modal" role="dialog" aria-modal="true">' +
        '<div class="zh-modal__dialog">' +
        (opts.title ? '<h2 class="zh-modal__title">' + ZH.esc(opts.title) + '</h2>' : '') +
        '<div class="zh-modal__body">' + opts.body + '</div>' +
        '<div class="zh-modal__actions"></div>' +
        '</div></div>'
      );
      const actions = wrap.querySelector('.zh-modal__actions');
      const close = value => {
        document.removeEventListener('keydown', onKey);
        wrap.remove();
        if (previous && previous.focus) previous.focus();
        resolve(value);
      };
      const onKey = e => {
        if (e.key === 'Escape' && opts.dismissible) close(null);
      };
      opts.actions.forEach(action => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'zh-btn' + (action.kind ? ' zh-btn--' + action.kind : '');
        btn.textContent = action.label;
        btn.addEventListener('click', () => {
          ZH.sfx('click');
          close(action.value);
        });
        actions.appendChild(btn);
      });
      wrap.addEventListener('click', e => {
        if (e.target === wrap && opts.dismissible) close(null);
      });
      document.addEventListener('keydown', onKey);
      document.body.appendChild(wrap);
      const firstButton = actions.querySelector('button:last-child');
      if (firstButton) firstButton.focus();
    });
  };

  /** 全畫面讀取中。ZH.loading(true, '讀取存檔') / ZH.loading(false) */
  ZH.loading = function (on, text) {
    let el = document.querySelector('.zh-loading');
    if (!on) {
      if (el) el.remove();
      return;
    }
    if (!el) {
      el = ZH.html('<div class="zh-loading" role="status" aria-live="polite"><div class="zh-loading__ring"></div><div class="zh-loading__text"></div></div>');
      document.body.appendChild(el);
    }
    el.querySelector('.zh-loading__text').textContent = text || '讀取中';
  };


  // ───────────────────────── 音效合成 ─────────────────────────

  let audioCtx = null;
  let master = null;
  const sounds = {};

  function getAudio() {
    if (!audioCtx) {
      const Ctx = global.AudioContext || global.webkitAudioContext;
      if (!Ctx) return null;
      audioCtx = new Ctx();
      master = audioCtx.createGain();
      master.connect(audioCtx.destination);
      applyVolume();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function applyVolume() {
    if (master) master.gain.value = ZH.settings.sound ? ZH.clamp(Number(ZH.settings.volume) || 0, 0, 1) : 0;
  }

  // 瀏覽器規定：使用者第一次點擊後才能發聲
  document.addEventListener('pointerdown', () => getAudio(), { once: true, capture: true });

  /** 一個衰減的正弦泛音 */
  function partial(ctx, dest, freq, start, duration, peak) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(peak, start + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
    osc.connect(gain).connect(dest);
    osc.start(start);
    osc.stop(start + duration + 0.05);
  }

  /** 一段濾波後的噪音 */
  function noise(ctx, dest, start, duration, filterType, freq, peak) {
    const length = Math.max(1, Math.floor(ctx.sampleRate * duration));
    const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = filterType;
    filter.frequency.value = freq;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(peak, start);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
    src.connect(filter).connect(gain).connect(dest);
    src.start(start);
    src.stop(start + duration);
  }

  /** 編鐘：非整數倍泛音、長衰減 */
  function bell(ctx, dest, t, base) {
    [[1, 0.5, 2.2], [2.76, 0.22, 1.4], [5.4, 0.12, 0.8], [8.93, 0.06, 0.5]]
      .forEach(p => partial(ctx, dest, base * p[0], t, p[2], p[1]));
  }

  /** 磬：高頻泛音、短衰減 */
  function chime(ctx, dest, t, base) {
    [[1, 0.4, 0.9], [2.32, 0.18, 0.6], [3.9, 0.09, 0.35]]
      .forEach(p => partial(ctx, dest, base * p[0], t, p[2], p[1]));
  }

  sounds.bell = (ctx, dest, t) => bell(ctx, dest, t, 392);
  sounds.chime = (ctx, dest, t) => chime(ctx, dest, t, 880);
  sounds.ok = (ctx, dest, t) => { bell(ctx, dest, t, 523); bell(ctx, dest, t + 0.12, 784); };
  sounds.ng = (ctx, dest, t) => chime(ctx, dest, t, 220);
  sounds.drum = (ctx, dest, t) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.setValueAtTime(130, t);
    osc.frequency.exponentialRampToValueAtTime(45, t + 0.35);
    gain.gain.setValueAtTime(0.9, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
    osc.connect(gain).connect(dest);
    osc.start(t);
    osc.stop(t + 0.5);
    noise(ctx, dest, t, 0.08, 'lowpass', 900, 0.35);
  };
  sounds.click = (ctx, dest, t) => noise(ctx, dest, t, 0.035, 'bandpass', 2200, 0.35);  // 竹簡相碰
  sounds.seal = (ctx, dest, t) => {
    partial(ctx, dest, 95, t, 0.25, 0.6);
    noise(ctx, dest, t, 0.06, 'lowpass', 600, 0.4);
  };

  /** 播放音效：ZH.sfx('bell') */
  ZH.sfx = function (name) {
    if (!ZH.settings.sound || !sounds[name]) return;
    const ctx = getAudio();
    if (!ctx) return;
    try {
      sounds[name](ctx, master, ctx.currentTime + 0.01);
    } catch (err) {
      // 音效失敗不影響遊戲
    }
  };

  /** 其他模組可以註冊新音效：ZH.sfx.register('arrows', (ctx, dest, t) => {...}) */
  ZH.sfx.register = function (name, fn) {
    sounds[name] = fn;
  };
  ZH.sfx.tools = { partial: partial, noise: noise, bell: bell, chime: chime };


  // ───────────────────────── 錯誤處理 ─────────────────────────

  let errorShown = false;
  global.addEventListener('error', event => {
    if (errorShown) return;
    errorShown = true;
    console.error(event.error || event.message);
    ZH.toast('畫面發生錯誤，請重新整理頁面。', 'bad', 5000);
  });
  global.addEventListener('unhandledrejection', event => {
    console.error(event.reason);
  });

  global.ZH = ZH;
})(window);
</script>

  async function teacher(root,token,email){root.innerHTML='<p>讀取個人資料管理……</p>';try{const r=await ZH.call('api_teacherPlayerProfile',token,email);if(!r||!r.ok)throw Error(r&&r.msg||'資料讀取失敗。');const p=r.profile;root.innerHTML='<section class="pl-profile"><h3>策士名稱管理</h3><div class="pl-profile-head"><span class="pl-avatar">'+avatar(p.avatarId,p.appearance)+'</span><div><b>'+esc(p.nickname)+'</b><p>'+(p.nameLocked?'名稱已鎖定':'名稱可由使用者設定')+'</p></div></div><form data-moderate><label>替代名稱<input class="zh-input" name="nickname" value="'+esc(p.nickname)+'" maxlength="40"></label><label>處置原因<textarea class="zh-input" name="reason" maxlength="200" required></textarea></label><p>「改名並鎖定」立即生效，使用者不能自行修正。只有管理者能再次改名或解除限制。</p><div class="zh-row"><button class="zh-btn zh-btn--seal" type="submit">改名並鎖定</button>'+(p.nameLocked?'<button class="zh-btn zh-btn--quiet" type="button" data-unlock>解除命名限制</button>':'')+'</div><p data-message role="status" aria-live="polite"></p></form><details><summary>處置紀錄（'+r.history.length+'）</summary>'+r.history.map(h=>'<p>'+esc(h.at)+' · '+esc({userRename:'使用者改名',renameLock:'管理者改名並鎖定',unlock:'管理者解除限制'}[h.action]||'資料更新')+' · '+esc(h.oldName)+' → '+esc(h.newName)+'<br>'+esc(h.reason)+' · '+esc(h.actor)+'</p>').join('')+'</details><details><summary>技能使用紀錄</summary>'+r.skillRuns.map(x=>'<p>'+esc(x.scope==='world'?({cq:'春秋爭盟',zg:'戰國縱橫',ch:'楚漢逐鹿'}[x.context]||'天下推演'):((ZH.findScenario(x.context)||{}).name||'劇本'))+' · '+esc(x.createdAt)+'<br>'+x.uses.map(u=>esc((SKILLS.find(s=>s.id===u.id)||{}).name||u.id)+'（'+esc(u.id==='bowen'?'已答原文回顧':u.id==='zhuanzhu'?({wy_fujiao:'夫椒水戰',wen_wy_xingcheng:'行成',wy_shengju:'十年生聚'}[u.target]||'關卡練習'):'大地圖操作')+'）').join('、')+'</p>').join('')+'</details></section>';
    const form=root.querySelector('form');async function act(action){const reason=form.elements.reason.value,msg=form.querySelector('[data-message]'),buttons=Array.from(form.querySelectorAll('button'));buttons.forEach(b=>b.disabled=true);try{const v=await ZH.call('api_teacherModeratePlayer',token,email,{action,nickname:form.elements.nickname.value,reason,revision:p.revision});if(!v||!v.ok)throw Error(v&&v.msg||'處置失敗。');await teacher(root,token,email);document.dispatchEvent(new CustomEvent('zh:player-moderated',{detail:{email,profile:v.profile}}));}catch(e){msg.textContent=e.message;}finally{buttons.forEach(b=>b.disabled=false);}}form.onsubmit=e=>{e.preventDefault();act('renameLock');};const unlock=form.querySelector('[data-unlock]');if(unlock)unlock.onclick=()=>act('unlock');
  }catch(e){root.innerHTML='<p role="alert">'+esc(e.message)+'</p>';}}
  function name(){return profile&&profile.nickname|| (ZH.isGuest()?'訪客策士':'策士');}
  ZH.player={version:'v0.5.0',AVATARS,LOOK_OPTIONS,doll,safeLook,SKILLS,POLICY,load,editor,avatar,name,initRun,available,consume,applyReceipt,skillCard,storyPanel,teacher,get profile(){return profile;},get story(){return activeStory;}};
  const finish=ZH.finishScenario;ZH.finishScenario=function(result){const r=Object.assign({},result);if(activeStory&&activeStory._player)r.playerSkills=copy(activeStory._player.uses||[]);return finish(r);};
  document.addEventListener('zh:3d-lost',e=>{if(editorRoot&&editorRoot.contains(e.detail.host)){const m=editorRoot.querySelector('[data-player-message]');if(m)m.textContent='3D畫面暫時中斷，可切回2D，或再次按3D重新開啟。';}});
  // 從其他頁面返回時，伺服器核定名稱與鎖定狀態立即套回編輯器。
  document.addEventListener('zh:player-change',()=>{if(editorRoot&&editorRoot.querySelector('[data-player-form]')&&(editorRoot.dataset.playerName!==profile.nickname||editorRoot.dataset.playerLocked!==String(profile.nameLocked))){renderEditor();editorRoot.querySelector('[data-player-message]').textContent='名稱與管理狀態已更新，請確認最新資料。';}});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ZH.isSchool())load(true).catch(()=>{});});
})(window.ZH);
