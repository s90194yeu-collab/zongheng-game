        FZ_SEG.map((s, i) =>
          '<div class="hy-seg" data-seg="' + i + '">' +
          '<div class="hy-seg__head"><b>' + s.name + '</b><small>' + s.sub + '</small></div>' +
          '<div class="hy-seg__ctl"><button type="button" data-minus="' + i + '" aria-label="' + s.name + '減一支船隊">−</button>' +
          '<span class="hy-seg__n" aria-live="polite">4</span>' +
          '<button type="button" data-plus="' + i + '" aria-label="' + s.name + '加一支船隊">＋</button></div>' +
          '<p class="hy-seg__cap"></p>' +
          '<div class="hy-seg__river"><i class="hy-boat" aria-hidden="true">舟</i></div></div>' +
          (i === 0 ? '<div class="hy-node" data-node="A">渭汭・渭水入河處<small>存糧 <b>0</b> 船</small></div>' : '') +
          (i === 1 ? '<div class="hy-node" data-node="B">汾口・汾水入河處<small>存糧 <b>0</b> 船</small></div>' : '')).join('') +
        '<div class="hy-node is-goal">晉都絳城・已運到<small><b class="hy-fz__d">0</b> 船（過關 ' + FZ_PASS + '）</small><i class="hy-goal"><b></b></i></div>' +
        '</div>' +
        '<p class="hy-fz__log" aria-live="polite">先看糧道：下游無上游接續便無糧可運；運到晉地才形成救災之實。</p>' +
        '<div class="hy-fz__foot"><span class="hy-fz__chainN">相繼 0 天</span><span class="hy-fz__act"></span></div>' +
        '</div>';
      const root = body.querySelector('.hy-fz');
      body.style.background = '#0b0e1d'; // 背後是淺色地圖，整片蓋掉，免得透出來
      const dayEl = body.querySelector('.hy-fz__day');
      const crewsEl = body.querySelector('.hy-fz__crews b');
      const evEl = body.querySelector('.hy-fz__event');
      const logEl = body.querySelector('.hy-fz__log');
      const actEl = body.querySelector('.hy-fz__act');
      const chainEl = body.querySelector('.hy-fz__chainN');
      const goalBar = body.querySelector('.hy-goal b');

      const mult = () => (day < FZ_DAYS ? FZ_EVENTS[events[day]].m : [1, 1, 1]);
      const caps = () => alloc.map((n, i) => Math.round(n * FZ_SEG[i].rate * mult()[i]));

      function render() {
        const m = mult();
        const cap = caps();
        const used = alloc[0] + alloc[1] + alloc[2];
        dayEl.textContent = day < FZ_DAYS ? '第 ' + (day + 1) + ' / ' + FZ_DAYS + ' 天' : '八天過去了';
        crewsEl.textContent = String(FZ_CREWS - used);
        evEl.textContent = day < FZ_DAYS ? FZ_EVENTS[events[day]].text : '糧船陸續靠岸。';
        body.querySelectorAll('.hy-seg').forEach(el => {
          const i = Number(el.dataset.seg);
          el.querySelector('.hy-seg__n').textContent = String(alloc[i]);
          const rate = Math.round(FZ_SEG[i].rate * m[i] * 10) / 10;
          const cls = m[i] > 1 ? 'is-up' : m[i] < 1 ? 'is-down' : '';
          const stock = i === 0 ? '糧倉充足' : i === 1 ? '渭汭存糧 ' + A : '汾口存糧 ' + B;
          el.querySelector('.hy-seg__cap').innerHTML = '每隊運 <b class="' + cls + '">' + rate + '</b> 船・今天最多 <b>' + cap[i] + '</b> 船（' + stock + '）';
          el.querySelector('[data-minus]').disabled = busy || day >= FZ_DAYS || alloc[i] <= 0;
          el.querySelector('[data-plus]').disabled = busy || day >= FZ_DAYS || used >= FZ_CREWS;
        });
        body.querySelector('[data-node="A"] b').textContent = String(A);
        body.querySelector('[data-node="B"] b').textContent = String(B);
        body.querySelector('.hy-fz__d').textContent = String(D);
        goalBar.style.setProperty('--v', clamp(D / 120 * 100, 0, 100) + '%');
        chainEl.textContent = '相繼 ' + chain + ' 天';
        root.dataset.day = String(day + 1);
        root.dataset.a = String(A);
        root.dataset.b = String(B);
        root.dataset.delivered = String(D);
        g.setStatus(day < FZ_DAYS ? '第 ' + (day + 1) + ' 天・已運 ' + D : '已運 ' + D);
      }

      function sail() {
        if (busy || day >= FZ_DAYS) return;
        busy = true;
        const cap = caps();
        const o0 = cap[0];
        const o1 = Math.min(A, cap[1]);
        const o2 = Math.min(B, cap[2]);
        A += o0 - o1;
        B += o1 - o2;
        D += o2;
        if (o0 > 0 && o1 > 0 && o2 > 0) chain += 1;
        const moved = [o0, o1, o2];
        body.querySelectorAll('.hy-seg').forEach(el => {
          const i = Number(el.dataset.seg);
          const river = el.querySelector('.hy-seg__river');
          el.style.setProperty('--rw', river.clientWidth + 'px');
          el.classList.remove('is-sail', 'is-idle');
          void el.offsetWidth;
          el.classList.add(moved[i] > 0 ? 'is-sail' : 'is-idle');
        });
        g.sfx(o2 > 0 ? 'chime' : 'click');
        const idle = [];
        if (alloc[1] > 0 && o1 === 0) idle.push('渭汭沒有存糧，黃河的船隊空等了一天');
        if (alloc[2] > 0 && o2 === 0) idle.push('汾口沒有存糧，汾水的船隊空等了一天');
        if (cap[1] > 0 && o1 < cap[1] && o1 > 0) idle.push('渭汭的糧不夠黃河的船隊運');
        if (cap[2] > 0 && o2 < cap[2] && o2 > 0) idle.push('汾口的糧不夠汾水的船隊運');
        logEl.textContent = '第 ' + (day + 1) + ' 天：渭水運 ' + o0 + '、黃河運 ' + o1 + '、汾水運 ' + o2 + ' 船，絳城收到 ' + o2 + ' 船。' + (idle.length ? idle.join('；') + '。' : '');
        actEl.innerHTML = '';
        setTimeout(() => {
          day += 1;
          busy = false;
          render();
          if (day >= FZ_DAYS) { finish(); return; }
          setGo();
        }, 950);
      }

      function setGo() {
        actEl.innerHTML = '<button type="button" class="zh-btn zh-btn--primary" data-go>開船（第 ' + (day + 1) + ' 天）›</button>';
        actEl.querySelector('[data-go]').addEventListener('click', sail);
      }

      function finish() {
        const score = clamp(Math.round((D - 40) / 70 * 10), 0, 10);
        const passed = D >= FZ_PASS;
        g.sfx(passed ? 'ok' : 'ng');
        g.setStatus(passed ? '過關' : '未過關');
        evEl.textContent = passed ? '糧船一艘接著一艘，從雍城一直連到絳城！' : '糧食運到了，可是船隊常常卡在半路。';
        logEl.textContent = '八天共運到絳城 ' + D + ' 船（過關 ' + FZ_PASS + '）。黃河逆流最慢：船隊要多派到瓶頸，上游也要先替下游存好糧。';
        actEl.innerHTML = '<button type="button" class="zh-btn zh-btn--primary" data-done>糧食送到了 ›</button>';
        const db = actEl.querySelector('[data-done]');
        db.addEventListener('click', () => resolve({ passed: passed, score: score, max: 10, delivered: D, chain: chain }));
        db.focus({ preventScroll: true });
      }

      body.querySelectorAll('[data-minus]').forEach(b => b.addEventListener('click', () => {
        const i = Number(b.dataset.minus);
        if (busy || alloc[i] <= 0) return;
        alloc[i] -= 1;
        g.sfx('click');
        render();
      }));
      body.querySelectorAll('[data-plus]').forEach(b => b.addEventListener('click', () => {
        const i = Number(b.dataset.plus);
        if (busy || alloc[0] + alloc[1] + alloc[2] >= FZ_CREWS) return;
        alloc[i] += 1;
        g.sfx('click');
        render();
      }));
      render();
      setGo();
    });
  }

  // ───── 小遊戲二：韓原之圍 ─────
  // 秦伯的戰車在戰場中央，晉軍從四邊衝進來。

  function hanGame(body, g) {
    return new Promise(resolve => {
      const P1 = 24;
      const P2 = 10;
      body.innerHTML =
        '<div class="hy-han" data-phase="p1" data-hp="100">' +
        '<div class="hy-han__hud"><span class="hy-han__hp">秦伯安危 <i><b></b></i></span><span class="hy-han__time"></span></div>' +
        '<div class="hy-han__field"><canvas aria-label="韓原戰場：秦穆公在中央，晉軍從四面圍來"></canvas><b class="hy-han__pause" aria-hidden="true">暫停</b></div>' +
        '<p class="hy-han__tip" aria-live="polite">點衝過來的晉軍兵車，把它們擋回去！（空白鍵：打最近的一輛）</p>' +
        '<div class="hy-han__bar"></div>' +
        '</div>';
      const root = body.querySelector('.hy-han');
      const field = body.querySelector('.hy-han__field');
      const cv = body.querySelector('canvas');
      const c2 = cv.getContext('2d');
      const hpBar = body.querySelector('.hy-han__hp i b');
      const timeEl = body.querySelector('.hy-han__time');
      const tip = body.querySelector('.hy-han__tip');
      const bar = body.querySelector('.hy-han__bar');

      // 世界座標：電腦橫放 100 × 60；手機直立時改成 60 × 92，戰場才不會只剩一條
      const portrait = body.clientHeight - 170 > (root.clientWidth - 20) * 1.15;
      const WW = portrait ? 60 : 100;
      const WH = portrait ? 92 : 60;
      const C = { x: WW / 2, y: WH / 2 + 1 };
      let k = 4;
      let dpr = 1;
      const X = v => v * k;
      let hp = 100;
      let phase = 'p1';
      let t = 0;
      let tp = 0;
      let spawnT = 0.6;
      let units = [];
      let flashes = [];
      let raf = 0;
      let last = performance.now();
      let captured = false;
      let grab = 0;
      let lord = null;
      let rescueT = 0;
      const muds = [];
      for (let i = 0; i < 3; i++) {
        let mx = 0;
        let my = 0;
        let tries = 0;
        const bad = () => Math.hypot(mx - C.x, my - C.y) < 16 || muds.some(m => Math.hypot(mx - m.x, my - m.y) < 22);
        do { mx = 12 + g.rng() * (WW - 24); my = 9 + g.rng() * (WH - 18); tries += 1; } while (bad() && tries < 200);
        muds.push({ x: mx, y: my, rx: 9 + g.rng() * 3, ry: 5 + g.rng() * 2 });
      }
      const inMud = (x, y) => muds.some(m => ((x - m.x) / m.rx) ** 2 + ((y - m.y) / m.ry) ** 2 <= 1);

      function fit() {
        const availW = Math.max(240, root.clientWidth - 20);
        const availH = Math.max(160, body.clientHeight - (portrait ? 220 : 170));
        const ratio = WH / WW;
        const W = Math.floor(Math.min(availW, availH / ratio, portrait ? 560 : 900));
        const H = Math.floor(W * ratio);
        k = W / WW;
        dpr = Math.min(2, window.devicePixelRatio || 1);
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        cv.style.width = W + 'px';
        cv.style.height = H + 'px';
        field.style.width = W + 'px';
        field.style.height = H + 'px';
      }

      function spawn(kind) {
        const side = Math.floor(g.rng() * 4);
        const p = g.rng();
        const pos = side === 0 ? { x: p * WW, y: -3 } : side === 1 ? { x: WW + 3, y: p * WH } : side === 2 ? { x: p * WW, y: WH + 3 } : { x: -3, y: p * WH };
        units.push({ x: pos.x, y: pos.y, kind: kind, hp: kind === 'jian' ? 3 : 1, sp: kind === 'jian' ? 7 : 8 + g.rng() * 3, stun: 0 });
      }

      function flash(x, y, text, color) { flashes.push({ x: x, y: y, text: text, color: color, t: 0.7 }); }

      function hpRender() {
        hpBar.style.setProperty('--v', clamp(hp, 0, 100) + '%');
        root.dataset.hp = String(Math.max(0, Math.round(hp)));
      }

      function strike(u) {
        u.hp -= 1;
        u.stun = 0.35;
        const dx = u.x - C.x;
        const dy = u.y - C.y;
        const d = Math.hypot(dx, dy) || 1;
        u.x += dx / d * 5;
        u.y += dy / d * 5;
        g.sfx('drum');
        if (u.hp <= 0) {
          flash(u.x, u.y, u.kind === 'jian' ? '韓簡退了！' : '擋下！', '#ffe7a8');
          units = units.filter(x => x !== u);
        }
      }

      function hitAt(wx, wy) {
        if (phase === 'p1') {
          let best = null;
          let bd = 8;
          units.forEach(u => { const d = Math.hypot(u.x - wx, u.y - wy); if (d < bd) { bd = d; best = u; } });
          if (best) strike(best);
        } else if (phase === 'p2' && lord) {
          if (Math.hypot(lord.x - wx, lord.y - wy) < 10) grabLord();
        }
      }

      function grabLord() {
        if (captured) return;
        grab += 1;
        g.sfx('drum');
        flash(lord.x, lord.y - 6, '擒！' + grab + ' / 6', '#ffe7a8');
        if (grab >= 6) {
          captured = true;
          g.sfx('ok');
          finish();
        }
      }

      function autoHit() {
        if (phase === 'p1') {
          let best = null;
          let bd = 999;
          units.forEach(u => { const d = Math.hypot(u.x - C.x, u.y - C.y); if (d < bd) { bd = d; best = u; } });
          if (best) strike(best);
        } else if (phase === 'p2') grabLord();
      }

      function toP2() {
        phase = 'rescue';
        root.dataset.phase = 'rescue';
        rescueT = 0;
        tip.textContent = '晉軍撤圍了！——慶鄭把韓簡叫去救晉惠公（《左傳》）；岐下三百野人也殺進了晉軍（《史記》）！';
        g.sfx('bell');
      }

      function startCapture() {
        phase = 'p2';
        root.dataset.phase = 'p2';
        units = [];
        tp = 0;
        const m = muds[Math.floor(g.rng() * muds.length)];
        lord = { x: m.x, y: m.y };
        tip.textContent = '晉惠公的戰車早就陷在泥裡了！連點他的戰車（或按空白鍵）把他擒下！';
      }

      function finish() {
        if (phase === 'done') return;
        phase = 'done';
        root.dataset.phase = 'done';
        document.body.classList.remove('hy-action');
        const hpPts = Math.round(clamp(hp, 0, 100) / 100 * 6);
        const score = clamp(hpPts + (captured ? 4 : 0), 0, 10);
        const passed = captured && hp > 0;
        g.setStatus(passed ? '大勝' : '收兵');
        tip.textContent = captured ? '晉戎馬還濘而止——秦獲晉侯！' : '晉惠公的戰車還陷在泥裡……';
        bar.innerHTML = '<b>秦伯安危 ' + Math.max(0, Math.round(hp)) + '・' + (captured ? '擒獲晉惠公' : '沒能親手擒下晉惠公') + '</b>' +
          '<button type="button" class="zh-btn zh-btn--primary" data-done>收兵 ›</button>';
        const db = bar.querySelector('[data-done]');
        db.addEventListener('click', () => resolve({ passed: passed, score: score, max: 10, hp: Math.max(0, Math.round(hp)), captured: captured }));
        db.focus({ preventScroll: true });
      }

      function draw() {
        c2.setTransform(dpr, 0, 0, dpr, 0, 0);
        c2.fillStyle = '#4a5a3a';
        c2.fillRect(0, 0, X(WW), X(WH));
        c2.fillStyle = 'rgba(30, 40, 22, .35)';
        for (let i = 0; i < 18; i++) { c2.fillRect(X((i * 37) % WW), X((i * 23) % WH), X(6), X(0.6)); }
        c2.fillStyle = '#4b3826';
        muds.forEach(m => { c2.beginPath(); c2.ellipse(X(m.x), X(m.y), X(m.rx), X(m.ry), 0, 0, Math.PI * 2); c2.fill(); });
        muds.forEach(m => {
          c2.fillStyle = 'rgba(236, 220, 190, .5)';
          c2.font = Math.max(11, Math.round(X(2.6))) + 'px ' + FONT;
          c2.textAlign = 'center';
          c2.textBaseline = 'middle';
          c2.fillText('濘', X(m.x), X(m.y));
        });
        // 秦伯
        const r = Math.max(14, X(3.6));
        c2.fillStyle = '#7f8fb8';
        c2.beginPath(); c2.arc(X(C.x), X(C.y), r, 0, Math.PI * 2); c2.fill();
        c2.lineWidth = 3;
        c2.strokeStyle = hp > 35 ? '#e0b44c' : '#d9483b';
        c2.stroke();
        c2.fillStyle = '#fff';
        c2.font = 'bold ' + Math.round(r * 1.1) + 'px ' + FONT;
        c2.fillText('秦', X(C.x), X(C.y) + 1);
        // 晉軍
        units.forEach(u => {
          const ur = u.kind === 'jian' ? Math.max(13, X(3.2)) : Math.max(10, X(2.4));
          c2.fillStyle = u.kind === 'jian' ? '#3d5f8f' : '#5b78a3';
          c2.beginPath(); c2.arc(X(u.x), X(u.y), ur, 0, Math.PI * 2); c2.fill();
          c2.lineWidth = 2;
          c2.strokeStyle = u.stun > 0 ? '#ffe7a8' : '#d6e2f5';
          c2.stroke();
          c2.fillStyle = '#fff';
          c2.font = Math.round(ur * 1.1) + 'px ' + FONT;
          c2.fillText(u.kind === 'jian' ? '簡' : '晉', X(u.x), X(u.y) + 1);
        });
        // 援軍的箭
        if (phase === 'rescue') {
          c2.strokeStyle = 'rgba(255, 231, 168, .8)';
          c2.lineWidth = 2;
          for (let i = 0; i < 14; i++) {
            const px = ((i * 13 + rescueT * 80) % (WW + 10)) - 5;
            const py = (i * 7) % WH;
            c2.beginPath(); c2.moveTo(X(px), X(py)); c2.lineTo(X(px + 3), X(py + 1)); c2.stroke();
          }
        }
        // 晉惠公
        if (lord) {
          const lr = Math.max(16, X(4));
          c2.fillStyle = '#2f4f7f';
          c2.beginPath(); c2.arc(X(lord.x), X(lord.y), lr, 0, Math.PI * 2); c2.fill();
          c2.lineWidth = 3;
          c2.strokeStyle = captured ? '#a9e2d4' : '#ffe7a8';
          c2.stroke();
          c2.fillStyle = '#fff';
          c2.font = 'bold ' + Math.round(lr * 1.05) + 'px ' + FONT;
          c2.fillText(captured ? '擒' : '惠', X(lord.x), X(lord.y) + 1);
          c2.font = Math.max(11, Math.round(X(2.4))) + 'px ' + FONT;
          c2.fillStyle = '#ffe7a8';
          c2.fillText('晉惠公（陷在泥裡）', X(lord.x), X(lord.y) + lr + 12);
        }
        flashes.forEach(f => {
          c2.globalAlpha = clamp(f.t / 0.7, 0, 1);
          c2.fillStyle = f.color;
          c2.font = 'bold 15px ' + FONT;
          c2.fillText(f.text, X(f.x), X(f.y) - (0.7 - f.t) * 20);
        });
        c2.globalAlpha = 1;
      }

      // 打開「說明」或圖鑑內容時暫停，關掉再繼續
      const paused = () => !!document.querySelector('.zh-modal, .zc-detail, .zc[role="dialog"]');

      function step(now) {
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        const hold = phase !== 'done' && paused();
        root.classList.toggle('is-paused', hold);
        if (hold) { raf = requestAnimationFrame(step); return; }
        if (phase === 'p1') {
          t += dt;
          spawnT -= dt;
          if (spawnT <= 0) {
            spawn('jin');
            spawnT = Math.max(0.85, 1.3 - t * 0.02);
          }
          if ((t > 7 && t - dt <= 7) || (t > 15 && t - dt <= 15)) { spawn('jian'); tip.textContent = '韓簡的戰車衝過來了！（要擋三次）'; }
          units.forEach(u => {
            if (u.stun > 0) { u.stun -= dt; return; }
            const dx = C.x - u.x;
            const dy = C.y - u.y;
            const d = Math.hypot(dx, dy) || 1;
            const sp = u.sp * (inMud(u.x, u.y) ? 0.45 : 1);
            u.x += dx / d * sp * dt;
            u.y += dy / d * sp * dt;
            if (d < 4.5) {
              hp -= u.kind === 'jian' ? 20 : 12;
              u.dead = true;
              flash(C.x, C.y - 6, u.kind === 'jian' ? '−20' : '−12', '#ffb4aa');
              g.sfx('ng');
            }
          });
          units = units.filter(u => !u.dead);
          hpRender();
          timeEl.textContent = '撐住：' + Math.max(0, Math.ceil(P1 - t)) + ' 秒';
          g.setStatus('剩 ' + Math.max(0, Math.ceil(P1 - t)) + ' 秒');
          if (hp <= 0) { hp = 0; hpRender(); toP2(); }
          else if (t >= P1) toP2();
        } else if (phase === 'rescue') {
          rescueT += dt;
          units.forEach(u => { u.x += (u.x - C.x) * dt * 1.5; u.y += (u.y - C.y) * dt * 1.5; });
          if (rescueT > 1.6) startCapture();
        } else if (phase === 'p2') {
          tp += dt;
          timeEl.textContent = '擒晉侯：' + Math.max(0, Math.ceil(P2 - tp)) + ' 秒';
          g.setStatus('剩 ' + Math.max(0, Math.ceil(P2 - tp)) + ' 秒');
          if (tp >= P2) finish();
        }
        flashes.forEach(f => { f.t -= dt; });
        flashes = flashes.filter(f => f.t > 0);
        draw();
        raf = requestAnimationFrame(step);
      }

      cv.addEventListener('pointerdown', e => {
        e.preventDefault();
        const rect = cv.getBoundingClientRect();
        hitAt((e.clientX - rect.left) / k, (e.clientY - rect.top) / k);
      });
      const onKey = e => {
        if (paused()) return;
        if (e.code === 'Space' || e.key === ' ' || e.key === 'Enter') {
          if (phase === 'done') return;
          e.preventDefault();
          autoHit();
        }
      };
      document.addEventListener('keydown', onKey);
      window.addEventListener('resize', fit);
      document.body.classList.add('hy-action');
      g.onCleanup(() => {
        cancelAnimationFrame(raf);
        document.removeEventListener('keydown', onKey);
        window.removeEventListener('resize', fit);
        document.body.classList.remove('hy-action');
      });
      // 給自動測試看的：目前兵車和晉惠公的位置（世界座標）與縮放比例
      root.__peek = () => ({ k: k, c: C, w: WW, h: WH, lord: lord, units: units.map(u => ({ x: u.x, y: u.y, kind: u.kind })) });
      fit();
      hpRender();
      draw();
      raf = requestAnimationFrame(step);
    });
  }

  // ───── 小遊戲三：小人與君子 ─────

  const CI_CARDS = [
    { id: 'c1', side: 'xiao', q: 1, text: '恥失其君而悼喪其親' },
    { id: 'c2', side: 'xiao', q: 1, text: '不憚征繕以立圉也' },
    { id: 'c3', side: 'xiao', q: 1, text: '必報讎，寧事戎狄' },
    { id: 'c4', side: 'jun', q: 1, text: '愛其君而知其罪' },
    { id: 'c5', side: 'jun', q: 1, text: '不憚征繕以待秦命' },
    { id: 'c6', side: 'jun', q: 1, text: '必報德，有死無二' },
    { id: 'c7', side: 'xiao', q: 2, text: '慼，謂之不免' },
    { id: 'c8', side: 'jun', q: 2, text: '恕，以為必歸' },
    { id: 'c9', side: 'xiao', q: 2, text: '我毒秦，秦豈歸君？' },
    { id: 'c10', side: 'jun', q: 2, text: '我知罪矣，秦必歸君' }
  ];
  const CI_Q = { 1: '秦伯問：晉國和乎？', 2: '秦伯問：國謂君何？' };
  const CI_MARK = {
    1: { xiao: '小人說的：要報讎', jun: '君子說的：要報德' },
    2: { xiao: '小人以為：秦國不會放君回來', jun: '君子以為：秦國一定放君回來' }
  };

  function ciGame(body, g) {
    return new Promise(resolve => {
      const cards = CI_CARDS.slice();
      for (let i = cards.length - 1; i > 0; i--) { const j = Math.floor(g.rng() * (i + 1)); const tmp = cards[i]; cards[i] = cards[j]; cards[j] = tmp; }
      const pick = {};
      body.innerHTML =
        '<div class="hy-ci">' +
        '<p class="hy-ci__tip">陰飴甥回答秦伯的兩個問題，都把晉國人分成兩種：<b>小人</b>怎麼說，<b>君子</b>怎麼說。替每一句選對邊。</p>' +
        '<div class="hy-ci__list">' + cards.map(c =>
          '<div class="hy-card" data-card="' + c.id + '"><p class="hy-card__t">' + esc(c.text) + '<small>' + esc(CI_Q[c.q]) + '</small></p>' +
          '<div class="hy-card__btns" role="group" aria-label="' + esc(c.text) + '">' +
          '<button type="button" class="hy-side" data-side="xiao" aria-pressed="false">小人</button>' +
          '<button type="button" class="hy-side" data-side="jun" aria-pressed="false">君子</button></div></div>').join('') + '</div>' +
        '<div class="hy-ci__out" aria-live="polite"></div>' +
        '<div class="hy-ci__foot"><span class="hy-ci__n">已分 0 / 10</span><span class="hy-ci__act"><button type="button" class="zh-btn zh-btn--primary" data-submit disabled>說給秦伯聽</button></span></div>' +
        '</div>';
      const nEl = body.querySelector('.hy-ci__n');
      const sub = body.querySelector('[data-submit]');
      const out = body.querySelector('.hy-ci__out');
      const act = body.querySelector('.hy-ci__act');
      g.setStatus('已分 0 / 10');
      body.querySelectorAll('.hy-card').forEach(card => {
        card.querySelectorAll('.hy-side').forEach(b => b.addEventListener('click', () => {
          if (b.disabled) return;
          pick[card.dataset.card] = b.dataset.side;
          card.querySelectorAll('.hy-side').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
          g.sfx('click');
          const n = Object.keys(pick).length;
          nEl.textContent = '已分 ' + n + ' / 10';
          g.setStatus('已分 ' + n + ' / 10');
          sub.disabled = n < CI_CARDS.length;
        }));
      });
      sub.addEventListener('click', () => {
        if (Object.keys(pick).length < CI_CARDS.length) return;
        let correct = 0;
        CI_CARDS.forEach(c => {
          const ok = pick[c.id] === c.side;
          if (ok) correct += 1;
          const card = body.querySelector('.hy-card[data-card="' + c.id + '"]');
          card.classList.add(ok ? 'is-right' : 'is-wrong');
          card.querySelectorAll('.hy-side').forEach(x => { x.disabled = true; });
          card.insertAdjacentHTML('beforeend', '<p class="hy-card__mark">' + (ok ? '✓ ' : '✗ ') + CI_MARK[c.q][c.side] + '</p>');
        });
        g.sfx(correct >= 7 ? 'ok' : 'ng');
        g.setStatus('分對 ' + correct + ' / 10');
        out.innerHTML = '分對 ' + correct + ' / 10。第一問「晉國和乎」：小人要「報讎」——這是警告，晉國已經準備再戰；君子要「報德」——這是台階，放了晉君，晉國會感恩。第二問「國謂君何」：小人說「秦豈歸君」，君子說「秦必歸君」——把放不放晉君，說成秦國自己有沒有德。兩邊放在一起，就是陰飴甥的軟硬兼施。';
        act.innerHTML = '<button type="button" class="zh-btn zh-btn--primary" data-done>繼續 ›</button>';
        const db = act.querySelector('[data-done]');
        db.addEventListener('click', () => resolve({ passed: correct >= 7, score: correct, max: 10, correct: correct }));
        out.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        db.focus({ preventScroll: true });
      });
    });
  }


  // ═════════════════════════ 8. 結局與結算 ═════════════════════════

  const ENDINGS = {
    great: { id: 'great', title: '秦晉復好', good: true, text: '秦歸晉侯，晉大子圉為質於秦，秦晉復好' },
    good: { id: 'good', title: '韓原之戰', good: true, text: '秦獲晉侯於韓，許晉平；陰飴甥盟于王城，晉侯乃歸' },
    bad: { id: 'bad', title: '恩怨相尋', good: false, text: '施而不報，怨而相攻，秦晉之好幾絕' }
  };

  function onEnd(result, ctx) {
    const s = ctx.state;
    const e = ENDINGS[(result && result.key) || 'good'] || ENDINGS.good;
    ZH.sfx('seal');
    return ctx.banner(e.title, '韓原之戰・終')
      .then(() => ctx.say([{ who: 'shiguan', text: '秦國三次施恩，晉國一次也沒報；穆姬以死相逼、子桑進言，秦伯答應講和，而讓晉君體面回國的，是陰飴甥的一張嘴。' }]))
      .then(() => ZH.deleteSave(SID, MODE).catch(() => null))
      .then(() => ZH.finishScenario(payload(s, e)));
  }

  function payload(s, ending) {
    const f = s.flags;
    const fan = Number(f.fanScore) || 0;
    const han = Number(f.hanScore) || 0;
    const ci = Number(f.ciScore) || 0;
    const strategy = clamp(Math.round(fan * 4 + han * 3 + ci * 3), 0, 100);
    const virtue = clamp(Math.round((s.meters.en || 0) - (s.meters.yuan || 0) + 50), 0, 100);

    const deeds = ['初，晉惠公之入也，賂秦伯以河外列城五，既而不與。'];
    const fd = Number(f.fanDelivered);
    const played = id => (s.games || []).some(x => x.gameId === id && !x.skipped);
    deeds.push('晉饑，乞糴于秦，秦輸之粟，自雍及絳相繼，命之曰汎舟之役。' + (fd >= 90 ? '舟楫相繼，未嘗絕也。' : fd >= 0 && fd < FZ_PASS ? '然轉輸未暢，晉人望粟甚久。' : ''));
    deeds.push('明年秦饑，乞糴于晉，晉人弗與，慶鄭諫，弗聽。');
    deeds.push('秦伯伐晉，戰于韓原。晉戎馬還濘而止。' + (played('hy_han') && Number(f.hanHp) < 40 ? '韓簡將止秦伯，秦伯幾不免。' : '') + '秦獲晉侯以歸。');
    deeds.push(f.qinChoice === 'zhi' ? '秦伯從子桑之言，許晉平。' : '秦人或欲殺晉侯，子桑諫，秦伯乃許晉平。');
    deeds.push('十月，飴甥會秦伯，盟于王城。秦伯曰：「晉國和乎？」對曰：「不和。」' + (ci >= 8 ? '因言小人、君子之異，辭婉而意切。' : played('wen_hy_ci') && ci < 5 ? '因言小人、君子之異，其辭未盡達。' : '因言小人、君子之異。'));
    deeds.push('秦伯曰：「是吾心也。」改館晉侯，饋七牢焉。十一月，晉侯歸。');

    return {
      scenarioId: SID, mode: MODE, faction: '晉',
      role: '陰飴甥', roleKind: 'liezhuan', country: '晉',
      bioTitle: '陰飴甥列傳', bioOpening: '陰飴甥者，晉大夫也，一曰呂甥，字子金。',
      ending: ending,
      scoreStrategy: strategy, scoreVirtue: virtue,
      turns: s.steps || 1,
      durationSec: Math.min(5400, Math.round((Date.now() - (s.startedAt || Date.now())) / 1000)),
      deeds: deeds,
      anchors: s.anchors,
      games: s.games,
      codex: s.codex,
      opener: '余讀《左氏》，至陰飴甥對秦伯，未嘗不歎辭令之可以存君也。',
      prompts: [
        '秦國在晉國饑荒時送糧，晉國卻在秦國饑荒時不賣糧。晉惠公為什麼會這樣選？如果你是他，你會怎麼做？',
        '子桑從「利害」、百里奚從「道義」勸秦穆公送糧。你比較被哪一種說法說服？為什麼？',
        '陰飴甥用「小人」和「君子」兩種說法，同時警告又討好秦伯。這樣的說話方式，在今天的談判裡還用得上嗎？'
      ]
    };
  }


  // ═════════════════════════ 9. 開始 ═════════════════════════

  const saveState = state => ZH.save(SID, MODE, { engine: state }).catch(() => null);

  function startGame(saved) {
    ROOT.innerHTML = '';
    const game = ZH.story.create(ROOT, {
      id: SID, mode: MODE, title: META.name, subtitle: META.episode,
      seed: Number(params.seed) || 0, start: 'n_intro',
      characters: CHARACTERS, meters: METERS, nodes: NODES, help: HELP, scenes: SCENES,
      initState: () => ({ vars: { act: 0 } }),
      anchorTotal: ANCHOR_ORDER.length, anchorOrder: ANCHOR_ORDER,
      onEnd: onEnd, save: saveState
    });
    if (params.test) window.__ep = game;
    game.start(saved || null);
  }

  function renderTitle(saved) {
    const vol = ZH.VOLUMES.find(v => v.key === META.vol) || { no: '', name: '' };
    const st = saved && saved.engine;
    const btn = (a, label, primary) => '<button type="button" class="zh-btn ' + (primary ? 'zh-btn--primary' : 'zh-btn--quiet') + ' zh-btn--block" data-a="' + a + '">' + esc(label) + '</button>';
    ROOT.innerHTML =
      '<div class="ep-title" style="--ep-color:' + esc(ROLE.color) + '">' +
      '<div class="ep-title__bar"><a class="zh-mark" href="#" data-a="home"><span class="zh-mark__re">Re:</span><span class="zh-mark__name">縱橫鼎業</span></a>' +
      '<button type="button" class="zh-btn zh-btn--quiet zh-btn--sm" data-a="home">回首頁</button></div>' +
      '<main class="ep-title__main"><header>' +
      '<p class="ep-kicker">' + esc([vol.no + ' ' + vol.name, ZH.episodeLabel(META), '前 ' + META.year + ' 年'].join('・')) + '</p>' +
      '<h1 class="ep-h1">' + esc(META.name) + '</h1>' +
      '<p class="ep-episode">' + esc(META.episode) + '</p>' +
      '<div class="ep-chips">' + (META.guest ? '<span class="zh-chip zh-chip--gilt">訪客開放</span>' : '') +
      '<span class="zh-chip">原典' + esc(META.source) + '</span><span class="zh-chip zh-chip--patina">' + esc(META.genre) + '</span>' +
      '<span class="zh-chip">自動存檔</span></div>' +
      (ZH.isGuest() ? '<p class="ep-note" style="margin-top:12px">你目前是訪客：可以完整遊玩，但進度只保存在這個分頁，也不會留下成績。</p>' : '') +
      '</header>' +
      '<section class="ep-start"><span class="ep-seal" aria-hidden="true">' + esc(ROLE.glyph) + '</span>' +
      '<div><h2 class="ep-start__name">' + esc(ROLE.name) + '・' + esc(ROLE.title) + '</h2><p class="ep-start__lead">' + esc(ROLE.lead) + '</p></div>' +
      '<div class="ep-start__act">' + (st ? btn('continue', st.ended ? '查看結局' : '繼續', true) + btn('new', '重新開始', false) : btn('new', '開始遊戲', true)) + '</div></section>' +
      '<section class="ep-points" aria-label="本話重點">' + POINTS.map(p => '<div class="ep-point"><b>' + esc(p.title) + '</b><span>' + esc(p.text) + '</span></div>').join('') + '</section>' +
      '<p class="ep-note">本話寫前 651 年到前 645 年的秦晉恩怨，是「秦晉之間」的第一章；接下來是第 8 話〈秦晉圍鄭〉。共 ' + ANCHOR_ORDER.length + ' 個史實錨點，約 30 分鐘。中途離開會自動存檔。</p>' +
      '</main></div>';
    ROOT.querySelectorAll('[data-a="home"]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); ZH.go('hub'); }));
    const cont = ROOT.querySelector('[data-a="continue"]');
    if (cont) cont.addEventListener('click', () => { ZH.sfx('click'); startGame(st); });
    ROOT.querySelector('[data-a="new"]').addEventListener('click', () => {
      ZH.sfx('click');
      if (!st) { startGame(null); return; }
      ZH.modal({
        title: '重新開始？', body: '<p>目前的進度會清除，從頭開始。</p>',
        actions: [{ label: '取消', value: false, kind: 'quiet' }, { label: '重新開始', value: true, kind: 'primary' }]
      }).then(ok => { if (ok) ZH.deleteSave(SID, MODE).catch(() => null).then(() => startGame(null)); });
    });
  }

  const loadSave = () => ZH.load(SID, MODE).then(r => (r && r.ok && r.state && r.state.engine ? r.state : null)).catch(() => null);

  ZH.ready(() => {
    ZH.loading(true, '展開竹簡');
    ZH.codex.init();
    Promise.all([loadSave(), Promise.race([anchorsReady, ZH.sleep(8000)])]).then(([saved]) => {
      ZH.loading(false);
      if (String(params.mode || '') === MODE && saved) { startGame(saved.engine); return; }
      renderTitle(saved);
    });
  });
})();
</script>
<script>ZH.ready(function(){ZH.textplay?.install("S_cq05_hanyuan",null);});</script>
</body>
