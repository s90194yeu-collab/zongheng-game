function play(kind){return(body,g)=>new Promise(resolve=>{
 const old=g.getProgress(),model=M[kind](old.model,g.rng),s=model.s;let alive=true,last=performance.now(),persistAt=-1,drag=null;
 const race=g.race({me:kind==='xumu'?'信用':kind==='reform'?'國力':'核判正確',rival:kind==='xumu'?'謠言':kind==='reform'?'舊貴族反撲':'失準案件',goal:kind==='xumu'?'看心情、提高賞金，搬木後真付五十金':kind==='reform'?'選兩政令、看事件，兼顧國力與民怨':'先讀規則、再看身分；也判你自己'});
 const persist=()=>g.setProgress({model:model.snapshot()});
 function clock(){const e=body.querySelector('[data-clock]');if(e)e.textContent=s.assisted&&s.phase!=='done'?'不限時':['play','carry','pay'].includes(s.phase)?'剩 '+Math.ceil(s.left)+' 秒':'倒數暫停';
  if(kind==='xumu'){const mood=body.querySelector('[data-mood]');if(mood){mood.textContent=model.mood();mood.dataset.mood=model.mood();}const counters=body.querySelector('[data-counters]');if(counters)counters.textContent='信用 '+s.credit+'・謠言 '+s.rumor+'・賞金 '+s.reward+' 金';race.me(s.assisted&&s.phase!=='done'?s.guide/6:s.credit/100);race.rival(s.rumor/100);}
  else if(kind==='reform'){race.me(s.power/100);race.rival(s.backlash/100);}else{race.me(s.assisted?s.guide/10:s.answers.filter(a=>a.correct).length/10);race.rival(s.answers.filter(a=>!a.correct).length/10);}
 }
 function paint(){if(!alive)return;const active=body.contains(document.activeElement)?document.activeElement:null,focus=active?[...active.attributes].find(a=>a.name.startsWith('data-')):null,assist=s.phase==='assist',done=s.phase==='done',failed=s.phase==='failed';let content='',controls='';
  if(kind==='xumu'&&!done&&!failed){if(['play','assist','feedback'].includes(s.phase)){content=personBoard(model);controls='<button type="button" class="zh-btn '+(s.raised?'zh-btn--quiet':'zh-btn--primary')+'" data-raise '+(s.raised||(!s.assisted&&s.answers.length<2)||s.assisted&&s.guide<2?'disabled':'')+'>'+(s.raised?'已公開五十金':'把十金提高至五十金')+'</button>'+(s.phase==='feedback'?'<button class="zh-btn zh-btn--primary" data-next>讀畢，下一位路人</button>':'');}else{content=woodBoard(model);controls=s.phase==='carry'?'<button class="zh-btn zh-btn--primary" data-step>移木至下一段　'+s.walk+'／6</button>':'<button class="zh-btn zh-btn--primary" data-pay>兌付五十金</button>';}}

  if(kind==='judge'&&!done&&!failed){content=caseBoard(model);if(s.phase==='feedback')controls='<button class="zh-btn zh-btn--primary" data-next>讀畢，'+(s.round===9?'核對十案結果':'下一件')+'</button>';}
  const title={xumu:'徙木立信・你是衛鞅',reform:'變法十年・你是衛鞅',judge:'法不阿貴・你是衛鞅'}[kind],progress=kind==='xumu'?Math.min(s.assisted?s.guide+1:s.round+1,6)+'／6 次觀察':kind==='reform'?['第一年','第五年','第十年'][s.round]+'・'+(s.round+1)+'／3 回合':Math.min(s.assisted?s.guide+1:s.round+1,10)+'／10 案';
  body.innerHTML='<div class="sy-game" data-kind="'+kind+'"><h2>'+title+'</h2><div class="sy-live"><b>'+(assist?'協助補做・':done?'必要操作完成・':failed?'本次結束・':'')+progress+'</b><span data-clock></span>'+(kind==='xumu'?'<span data-counters></span>':'')+'</div>'+content+(s.note?'<p class="sy-feedback" role="status">'+E(s.note)+'</p>':'')+controls+(failed?'<p class="sy-follow">本次原分 '+s.first.score+'／10。親自補做後才能回到主線。</p>':'')+(done?'<p class="sy-follow">本次成績 '+s.first.score+'／10'+(s.assisted?'；協助完成，原分保留。':'。')+'</p><button type="button" class="zh-btn zh-btn--primary" data-finish>交回挑戰成績</button>':'<div class="sy-help-row"><button type="button" class="zh-btn '+(failed?'zh-btn--primary':'zh-btn--quiet')+'" data-assist '+(s.assisted?'hidden':'')+'>協助補做・不限時</button></div>')+'</div>';
  if(focus){const same=body.querySelector('['+focus.name+'="'+focus.value+'"]');const target=same&&!same.disabled?same:body.querySelector('[data-next],[data-step],[data-pay],[data-finish],button:not(:disabled):not([hidden])');target?.focus({preventScroll:true});}clock();persist();g.setStatus(s.assisted?'親自補做・原分保留':done?'必要操作完成':failed?'請補做必要體驗':'正在挑戰');
 }
 const click=async e=>{const b=e.target.closest('button');if(!b||b.disabled||!alive)return;
  if(b.hasAttribute('data-assist')){const ok=await ZH.modal({title:'協助補做',body:'<p>改為不限時並提供提示，仍須親自操作。完成挑戰的原分保留；提前求助，本次鎖為0分，稍後可挑戰最佳。</p>',actions:[{label:'繼續挑戰',value:false,kind:'quiet'},{label:'開始補做',value:true,kind:'primary'}]});if(ok&&alive){model.assist();last=performance.now();paint();}return;}

  if(b.hasAttribute('data-person')){if(s.phase==='feedback')return;model.persuade();}else if(b.hasAttribute('data-raise'))model.raise();else if(b.hasAttribute('data-step'))model.step();else if(b.hasAttribute('data-pay'))model.pay();else if(b.hasAttribute('data-next'))model.next();else if(b.dataset.policy)model.choose(b.dataset.policy);else if(b.hasAttribute('data-enact'))model.enact();else if(b.dataset.verdict!==undefined)model.decide(Number(b.dataset.verdict));else return;g.sfx('click');paint();
 };
 const down=e=>{if(kind!=='xumu'||s.phase!=='carry'||!e.target.closest('.sy-route-wood')||e.button!==0)return;e.preventDefault();drag={x:e.clientX};};
 const move=e=>{if(!drag||!alive||s.phase!=='carry')return;e.preventDefault();const track=body.querySelector('.sy-route-track');if(!track)return;const unit=track.getBoundingClientRect().width*.8/6;if(e.clientX-drag.x>=unit){drag.x+=unit;model.step();paint();}};

 g.onCleanup(()=>{alive=false;clearInterval(interval);body.removeEventListener('click',click);body.removeEventListener('pointerdown',down);window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);});paint();
});}
