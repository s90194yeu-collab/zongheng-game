  // 每次挑戰都會重新呼叫小遊戲函式：所有狀態都寫在函式裡面。
  // 本機測試伺服器加上 &test=1 時，會在畫面元素上標出答案（自動試玩用）；正式網址不會。

  function shuffle(list, rng) {
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  function face(id, expr) {
    const c = CHARACTERS.find(x => x.id === id) || { id: id, name: id, glyph: '' };
    if (window.ART && ART.portrait) return ART.portrait(c, { bust: true, expr: expr || null });
    return '<span class="ce-face__seal" style="color:' + esc(c.color || '#e0b44c') + '">' + esc(c.glyph || '') + '</span>';
  }

  const JIAN = [

    { head: '故《周書》曰：「皇天無親，', ans: '惟德是輔。」', bad: ['惟祀是輔。」', '惟強是輔。」'] },

  const GIFT_SVG = '<svg class="ce-gift" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="18" fill="#8fd0b0" stroke="#2f6f5a" stroke-width="3"/>' +
    '<circle cx="24" cy="24" r="6" fill="#1b2238" stroke="#2f6f5a" stroke-width="2"/><path d="M13 19 q4 -5 9 -4" stroke="#e8fff4" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>';

  function jianGame(body, g) {
    return new Promise(resolve => {
      const N = JIAN.length;
      let i = 0, correct = 0, wrong = 0, streak = 0, bonus = 0;
      let rival = 0, fuse = 1, fuseMax = 1, locked = true, over = false, raf = 0, timer = 0;
      let opts = [];
      body.innerHTML =
        '<div class="ce-jian">' +
        '<div class="ce-jian__duel">' +
        '<div class="ce-jian__p"><span class="ce-face ce-face--me"></span><b>宮之奇（你）</b></div>' +
        '<div class="ce-jian__say" aria-live="polite"></div>' +
        '<div class="ce-jian__p"><span class="ce-face ce-face--yu"></span><b>虞公</b>' + GIFT_SVG + '</div>' +
        '</div>' +
        '<div class="ce-jian__slip"><p class="ce-jian__head"></p><div class="ce-fuse"><i></i></div></div>' +
        '<div class="ce-jian__opts"></div>' +
        '<p class="ce-jian__fb" aria-live="polite"></p>' +
        '</div>';
      const $ = s => body.querySelector(s);
      const sayEl = $('.ce-jian__say');
      const headEl = $('.ce-jian__head');
      const fuseEl = $('.ce-fuse');
      const optsEl = $('.ce-jian__opts');
      const fbEl = $('.ce-jian__fb');
      const gift = $('.ce-gift');
      const meFace = $('.ce-face--me');
      const yuFace = $('.ce-face--yu');
      let meExpr = '', yuExpr = '';
      const setFaces = (me, yu) => {
        if (me !== meExpr) { meExpr = me; meFace.innerHTML = face('gongzhiqi', me); }
        if (yu !== yuExpr) { yuExpr = yu; yuFace.innerHTML = face('yugong', yu); }
      };
      const race = g.race ? g.race({ me: '宮之奇的諫言', rival: '璧與馬（虞公動心）', rivalColor: '#d9a43a', goal: '在虞公被璧和馬迷住以前，把諫言說完' }) : null;

      const paint = () => {
        if (race) { race.me(i / N); race.rival(rival); }
        gift.classList.toggle('is-glow', rival > 0.6);
        fuseEl.querySelector('i').style.setProperty('--p', Math.max(0, 100 * fuse / fuseMax).toFixed(1) + '%');
        fuseEl.classList.toggle('is-warn', !locked && fuse < 2.5);
      };
      const finalScore = lost => {
        const s = 6 * correct / N + Math.min(3, bonus) + (lost ? 0 : 1);
        return clamp(Math.round(s), 0, 10);
      };
      const end = lost => {
        if (over) return;
        over = true;
        locked = true;
        cancelAnimationFrame(raf);
        clearTimeout(timer);
        optsEl.querySelectorAll('button').forEach(b => { b.disabled = true; });
        if (lost) {
          setFaces('worried', 'happy');
          sayEl.innerHTML = '<b>虞公：</b>「好了好了，寡人意已決。」';
          if (g.pop) g.pop('虞公收下了璧和馬', 'bad');
          g.sfx('ng');
        } else {
          setFaces('serious', 'worried');
          sayEl.textContent = '虞公一時答不上話……';
          if (g.pop) g.pop(correct >= N - 1 ? '字字有據！' : '諫言說完了', correct >= N - 1 ? 'gold' : 'ok');
          g.sfx('ok');
        }
        const result = { passed: !lost && correct >= 7, score: finalScore(lost), max: 10, correct: correct, wrong: wrong, lost: !!lost };
        timer = setTimeout(() => resolve(result), 1300);
      };
      const round = () => {
        if (over) return;
        if (i >= N) { end(false); return; }
        const r = JIAN[i];
        opts = shuffle([r.ans].concat(r.bad), g.rng);
        fuseMax = 10 - 0.45 * i;
        fuse = fuseMax;
        sayEl.innerHTML = r.yu ? '<b>虞公：</b>「' + esc(r.yu) + '」' : i === 0 ? '晉國的使者又來借路了。你開口——' : '（你接著說）';
        headEl.innerHTML = esc(r.head) + '<span class="ce-blank">＿＿＿＿</span>';
        optsEl.innerHTML = opts.map((t, k) => '<button type="button" class="ce-opt" data-k="' + k + '"><small>' + (k + 1) + '</small><span>' + esc(t) + '</span></button>').join('');
        optsEl.querySelectorAll('.ce-opt').forEach((b, k) => b.addEventListener('click', () => pick(k)));
        fbEl.className = 'ce-jian__fb';
        fbEl.textContent = '';
        if (TEST) body.dataset.answer = String(opts.indexOf(r.ans));
        setFaces('normal', r.yu ? 'smirk' : 'normal');
        g.setStatus('第 ' + (i + 1) + ' / ' + N + ' 句');
        locked = false;
        paint();
      };
      const pick = k => {
        if (locked || over || paused()) return;
        locked = true;
        const r = JIAN[i];
        const ok = k >= 0 && opts[k] === r.ans;
        const btns = optsEl.querySelectorAll('.ce-opt');
        btns.forEach(b => { b.disabled = true; });
        headEl.innerHTML = esc(r.head) + '<span class="ce-fill' + (ok ? '' : ' is-fix') + '">' + esc(r.ans) + '</span>';
        if (ok) {
          const frac = fuse / fuseMax;
          correct += 1;
          streak += 1;
          bonus += 0.3 * frac;
          if (frac > 0.6) rival = Math.max(0, rival - 0.03);
          if (g.combo) g.combo(streak);
          btns[k].classList.add('is-ok');
          g.sfx('ok');
          if (g.pop) g.pop(frac > 0.7 ? '一針見血！' : '說得好！', frac > 0.7 ? 'gold' : 'ok');
          setFaces('serious', 'surprised');
        } else {
          wrong += 1;
          streak = 0;
          rival = Math.min(1, rival + 0.09);
          if (g.combo) g.combo(0);
          if (k >= 0) btns[k].classList.add('is-bad');
          const right = opts.indexOf(r.ans);
          if (btns[right]) btns[right].classList.add('is-answer');
          g.sfx('ng');
          if (g.shake) g.shake();
          if (g.flash) g.flash('bad');
          fbEl.className = 'ce-jian__fb is-bad';
          fbEl.textContent = k < 0 ? '時間到！虞公又看了一眼那塊璧。' : '說錯了。虞公的眼睛又飄向那塊璧。';
          setFaces('worried', 'happy');
        }
        i += 1;
        paint();
        if (rival >= 1) { end(true); return; }
        timer = setTimeout(round, ok ? 700 : 1600);
      };
      const onKey = e => {
        const n = parseInt(e.key, 10);
        if (n >= 1 && n <= 3 && !locked) { e.preventDefault(); pick(n - 1); }
      };
      document.addEventListener('keydown', onKey);
      let last = performance.now();
      const loop = now => {
        const dt = Math.min(0.1, (now - last) / 1000);
        last = now;
        if (!over && !locked && !paused()) {
          fuse -= dt;
          rival = Math.min(1, rival + dt * (1 + i * 0.07) / 115);
          paint();
          if (rival >= 1) { end(true); return; }
          if (fuse <= 0) { fuse = 0; pick(-1); }
        }
        if (!over) raf = requestAnimationFrame(loop);
      };
      g.onCleanup(() => { over = true; cancelAnimationFrame(raf); clearTimeout(timer); document.removeEventListener('keydown', onKey); });
      round();
      raf = requestAnimationFrame(loop);
    });
  }

  // ───── 小遊戲二：醉載出齊（三線道閃避） ─────

  function zuicheGame(body, g) {
    return new Promise(resolve => {
      body.innerHTML =
        '<div class="ce-run">' +
        '<div class="ce-run__wrap"><canvas role="img" aria-label="醉載出齊：三條車道上的馬車"></canvas><p class="ce-run__tip">按左半邊往左、右半邊往右</p></div>' +
        '<div class="ce-run__pad"><button type="button" class="zh-btn" data-d="-1">◀ 往左</button><button type="button" class="zh-btn" data-d="1">往右 ▶</button></div>' +
        '</div>';
      // 先放上競速條（競技列變高以後再量畫面大小）
      const race = g.race ? g.race({ me: '出齊的路程', rival: '公子醒酒', rivalColor: '#d9a43a', goal: '公子醒來以前，把車趕出齊境' }) : null;
      const wrap = body.querySelector('.ce-run__wrap');
      const cv = wrap.querySelector('canvas');
      const tip = wrap.querySelector('.ce-run__tip');
      const pad = body.querySelector('.ce-run__pad');
      const availW = Math.max(260, (body.clientWidth || 360) - 20);
      const availH = Math.max(280, (body.clientHeight || 560) - pad.offsetHeight - 40);
      const W = Math.round(Math.min(560, availW));
      const H = Math.round(Math.max(280, Math.min(availH, W * 1.3, 620)));
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      cv.width = Math.round(W * dpr);
      cv.height = Math.round(H * dpr);
      cv.style.width = W + 'px';
      cv.style.height = H + 'px';
      pad.style.width = W + 'px';
      const c = cv.getContext('2d');
      c.setTransform(dpr, 0, 0, dpr, 0, 0);

      const ROAD_X = W * 0.09;
      const ROAD_W = W * 0.82;
      const LANE_W = ROAD_W / 3;
      const laneX = k => ROAD_X + LANE_W * (k + 0.5);
      const S = Math.min(1.3, LANE_W / 100);              // 圖形縮放
      const CART_Y = H - Math.max(64, H * 0.15);
      const CART_TOP = CART_Y - 62 * S;
      const CART_BOT = CART_Y + 26 * S;
      const OBJ = Math.min(LANE_W * 0.6, 62);
      const GOAL = H * 24;
      let lane = 1, cartX = laneX(1);
      let dist = 0, t = 0, wake = 0, hits = 0, streak = 0, inv = 0, slow = 0, lastLi = -1;
      let obs = [], nextSpawn = H * 0.7, over = false, raf = 0;

      const speed = () => H * (0.5 + 0.55 * Math.min(1, t / 40)) * (slow > 0 ? 0.55 : 1);
      const mk = k => {
        const kinds = t < 6 ? ['rock', 'pit'] : t < 15 ? ['rock', 'pit', 'rock', 'guard'] : ['rock', 'pit', 'guard'];
        return { lane: k, x: laneX(k), y: -OBJ, type: kinds[Math.floor(g.rng() * kinds.length)], done: false, hit: false, shift: 0, shifted: false, shiftAt: 0 };
      };
      const spawnRow = () => {
        const level = Math.min(1, t / 30);
        if (t > 9 && g.rng() < 0.15 + 0.2 * level) {
          const gap = Math.floor(g.rng() * 3);
          [0, 1, 2].filter(k => k !== gap).forEach(k => obs.push(mk(k)));
        } else {
          const k = Math.floor(g.rng() * 3);
          const o = mk(k);
          if (t > 15 && g.rng() < 0.35) {
            o.type = 'guard';
            o.shift = k === 0 ? 1 : k === 2 ? -1 : (g.rng() < 0.5 ? -1 : 1);
            o.shiftAt = CART_TOP - H * (0.28 + 0.08 * g.rng());
          }
          obs.push(o);
        }
      };
      const finish = success => {
        if (over) return;
        over = true;
        cancelAnimationFrame(raf);
        draw();
        const quality = clamp(1 - wake, 0, 1);
        const sc = success ? Math.round(4 + 6 * quality) : Math.round(4 * Math.min(1, dist / GOAL));
        if (success) {
          g.sfx('ok');
          if (g.pop) g.pop('出了齊境！', 'gold');
          tip.textContent = '……公子翻了個身，還在睡。';
        } else {
          g.sfx('ng');
          if (g.pop) g.pop('公子醒了！', 'bad');
          tip.textContent = '「這是哪裡？子犯！」';
        }
        const result = { passed: success, score: clamp(sc, 0, 10), max: 10, hits: hits, woke: !success };
        setTimeout(() => resolve(result), 1400);
      };
      const step = dt => {
        t += dt;
        inv = Math.max(0, inv - dt);
        slow = Math.max(0, slow - dt);
        const v = speed();
        dist += v * dt;
        cartX += (laneX(lane) - cartX) * Math.min(1, dt * 16);
        if (dist >= nextSpawn && dist < GOAL - H * 1.1) {
          spawnRow();
          nextSpawn = dist + H * (0.8 - 0.25 * Math.min(1, t / 35)) * (0.85 + 0.3 * g.rng());
        }
        obs.forEach(o => {
          o.y += v * dt;
          if (o.shift && !o.shifted && o.y >= o.shiftAt) { o.shifted = true; o.lane = clamp(o.lane + o.shift, 0, 2); }
          o.x += (laneX(o.lane) - o.x) * Math.min(1, dt * 7);
          if (!o.done && !o.hit && inv <= 0 && o.y + OBJ * 0.4 > CART_TOP && o.y - OBJ * 0.4 < CART_BOT && Math.abs(o.x - cartX) < LANE_W * 0.52) {
            o.hit = true;
            hits += 1;
            streak = 0;
            wake = Math.min(1, wake + 0.2);
            inv = 0.9;
            slow = 0.8;
            if (g.combo) g.combo(0);
            if (g.shake) g.shake();
            if (g.flash) g.flash('bad');
            g.sfx('ng');
            if (g.pop) g.pop(['顛！', '咚！', '哎喲！'][hits % 3], 'bad');
          }
          if (!o.done && o.y - OBJ * 0.4 > CART_BOT) {
            o.done = true;
            if (!o.hit) {
              streak += 1;
              if (g.combo) g.combo(streak);
              if (streak % 8 === 0) { wake = Math.max(0, wake - 0.04); if (g.pop) g.pop('穩！公子睡得更沉了', 'ok'); }
            }
          }
        });
        obs = obs.filter(o => o.y < H + OBJ);
        wake = Math.min(1, wake + dt * 0.008);
        if (race) { race.me(dist / GOAL); race.rival(wake); }
        const li = Math.max(0, Math.ceil((GOAL - dist) / GOAL * 30));
        if (li !== lastLi) { lastLi = li; g.setStatus('距齊境 ' + li + ' 里'); }
        if (t > 3 && tip.textContent && !over) tip.textContent = '';
        if (TEST) {
          // 每一道最近的障礙物還有多遠（以畫面高度為單位；已經過去的不算）
          const near = [9, 9, 9];
          obs.forEach(o => {
            if (o.done || o.hit || o.y - OBJ * 0.4 > CART_BOT) return;
            const d = Math.max(0, (CART_TOP - (o.y + OBJ * 0.4)) / H);
            near[o.lane] = Math.min(near[o.lane], d);
            if (o.shift && !o.shifted) { const k2 = clamp(o.lane + o.shift, 0, 2); near[k2] = Math.min(near[k2], d); }
          });
          wrap.dataset.lane = String(lane);
          wrap.dataset.near = near.map(x => x.toFixed(2)).join(',');
          wrap.dataset.hits = String(hits);
          wrap.dataset.t = t.toFixed(1);
        }
        if (wake >= 1) finish(false);
        else if (dist >= GOAL) finish(true);
      };

      // ── 畫面 ──
      const tree = (x, y) => {
        c.fillStyle = 'rgba(0,0,0,.18)';
        c.beginPath(); c.ellipse(x + 4, y + 6, 20 * S, 16 * S, 0, 0, Math.PI * 2); c.fill();
        c.fillStyle = '#3f6b33';
        c.beginPath(); c.arc(x, y, 18 * S, 0, Math.PI * 2); c.fill();
        c.fillStyle = '#5a8a45';
        c.beginPath(); c.arc(x - 5 * S, y - 5 * S, 10 * S, 0, Math.PI * 2); c.fill();
      };
      const glyph = (text, x, y, color, size) => {
        c.fillStyle = color;
        c.font = '700 ' + Math.round(size) + 'px ' + FONT;
        c.textAlign = 'center';
        c.textBaseline = 'middle';
        c.fillText(text, x, y + 1);
      };
      const drawObs = o => {
        const r = OBJ * 0.42;
        if (o.type === 'rock') {
          c.fillStyle = '#7d7a72';
          c.beginPath();
          c.moveTo(o.x - r, o.y + r * 0.5); c.lineTo(o.x - r * 0.7, o.y - r * 0.6); c.lineTo(o.x + r * 0.1, o.y - r);
          c.lineTo(o.x + r, o.y - r * 0.3); c.lineTo(o.x + r * 0.8, o.y + r * 0.7); c.lineTo(o.x - r * 0.2, o.y + r);
          c.closePath(); c.fill();
          c.strokeStyle = '#3a3830'; c.lineWidth = 2.5; c.stroke();
          c.fillStyle = 'rgba(255,255,255,.22)';
          c.beginPath(); c.ellipse(o.x - r * 0.25, o.y - r * 0.35, r * 0.35, r * 0.18, -0.4, 0, Math.PI * 2); c.fill();
          glyph('石', o.x + r * 0.05, o.y + r * 0.12, '#2b2418', r * 0.85);
        } else if (o.type === 'pit') {
          c.fillStyle = '#8a6a44';
          c.beginPath(); c.ellipse(o.x, o.y, r * 1.12, r * 0.78, 0, 0, Math.PI * 2); c.fill();
          c.fillStyle = '#3a2818';
          c.beginPath(); c.ellipse(o.x, o.y + 2, r * 0.9, r * 0.58, 0, 0, Math.PI * 2); c.fill();
          glyph('坑', o.x, o.y + 2, '#e8d6a6', r * 0.8);
        } else {
          c.strokeStyle = '#4a3020'; c.lineWidth = 4;
          c.beginPath(); c.moveTo(o.x - r * 1.15, o.y - r * 0.9); c.lineTo(o.x + r * 1.15, o.y + r * 0.9); c.stroke();
          c.fillStyle = '#c9c4b8';
          c.beginPath(); c.moveTo(o.x + r * 1.15, o.y + r * 0.9); c.lineTo(o.x + r * 0.7, o.y + r * 1.15); c.lineTo(o.x + r * 0.95, o.y + r * 0.55); c.closePath(); c.fill();
          c.fillStyle = '#7f5598';
          c.beginPath(); c.arc(o.x, o.y, r * 0.95, 0, Math.PI * 2); c.fill();
          c.strokeStyle = '#3a2448'; c.lineWidth = 2.5; c.stroke();
          glyph('卒', o.x, o.y, '#fff', r * 0.95);
          if (o.shift && !o.shifted && o.y > o.shiftAt - H * 0.3) {
            const ax = o.x + o.shift * r * 1.5;
            c.fillStyle = '#ffd24a';
            c.beginPath(); c.moveTo(ax + o.shift * 12, o.y); c.lineTo(ax - o.shift * 4, o.y - 11); c.lineTo(ax - o.shift * 4, o.y + 11); c.closePath(); c.fill();
            c.strokeStyle = '#5a3a00'; c.lineWidth = 1.5; c.stroke();
          }
        }
      };
      const drawCart = () => {
        const x = cartX, y = CART_Y;
        c.save();
        if (inv > 0 && Math.floor(inv * 12) % 2 === 0) c.globalAlpha = 0.5;
        // 馬
        [-11, 11].forEach(dx => {
          c.fillStyle = '#6e4326';
          c.beginPath(); c.ellipse(x + dx * S, y - 44 * S, 8 * S, 17 * S, 0, 0, Math.PI * 2); c.fill();
          c.beginPath(); c.ellipse(x + dx * S, y - 62 * S, 5 * S, 7 * S, 0, 0, Math.PI * 2); c.fill();
          c.strokeStyle = '#2a1a10'; c.lineWidth = 1.5;
          c.beginPath(); c.ellipse(x + dx * S, y - 44 * S, 8 * S, 17 * S, 0, 0, Math.PI * 2); c.stroke();
        });
        c.strokeStyle = '#4a3020'; c.lineWidth = 3 * S;
        c.beginPath(); c.moveTo(x, y - 10 * S); c.lineTo(x, y - 54 * S); c.stroke();
        c.beginPath(); c.moveTo(x - 18 * S, y - 32 * S); c.lineTo(x + 18 * S, y - 32 * S); c.stroke();
        // 車輪、車軸
        c.lineWidth = 3 * S;
        c.beginPath(); c.moveTo(x - 30 * S, y + 8 * S); c.lineTo(x + 30 * S, y + 8 * S); c.stroke();
        c.fillStyle = '#2b2418';
        c.fillRect(x - 34 * S, y - 6 * S, 7 * S, 28 * S);
        c.fillRect(x + 27 * S, y - 6 * S, 7 * S, 28 * S);
        // 車廂
        c.fillStyle = '#8a5a32';
        c.fillRect(x - 20 * S, y - 14 * S, 40 * S, 32 * S);
        c.strokeStyle = '#3a2414'; c.lineWidth = 2;
        c.strokeRect(x - 20 * S, y - 14 * S, 40 * S, 32 * S);
        // 車蓋
        const wob = wake > 0.6 ? Math.sin(t * 9) * 2 : 0;
        c.fillStyle = '#4f7fb0';
        c.beginPath(); c.arc(x + wob, y, 24 * S, 0, Math.PI * 2); c.fill();
        c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 1.5;
        for (let k = 0; k < 8; k++) {
          const a = k * Math.PI / 4;
          c.beginPath(); c.moveTo(x + wob, y); c.lineTo(x + wob + Math.cos(a) * 24 * S, y + Math.sin(a) * 24 * S); c.stroke();
        }
        c.strokeStyle = '#26405e'; c.lineWidth = 2;
        c.beginPath(); c.arc(x + wob, y, 24 * S, 0, Math.PI * 2); c.stroke();
        c.fillStyle = '#e0b44c';
        c.beginPath(); c.arc(x + wob, y, 4 * S, 0, Math.PI * 2); c.fill();
        c.restore();
        // 鼾聲
        if (!over || wake < 1) {
          const ph = (t * 0.8) % 1;
          c.globalAlpha = 1 - ph;
          glyph(wake > 0.6 ? '嗯…' : 'z', x + 26 * S + ph * 10, y - 24 * S - ph * 26, wake > 0.6 ? '#ffb4aa' : '#fff', (wake > 0.6 ? 15 : 14 + ph * 8) * S);
          c.globalAlpha = 1;
        }
      };
      const draw = () => {
        c.fillStyle = '#6f8a45';
        c.fillRect(0, 0, W, H);
        const off = dist % 80;
        c.fillStyle = 'rgba(255,255,255,.05)';
        for (let y = -80 + off; y < H; y += 80) c.fillRect(0, y, W, 40);
        const rg = c.createLinearGradient(ROAD_X, 0, ROAD_X + ROAD_W, 0);
        rg.addColorStop(0, '#b38d57'); rg.addColorStop(0.5, '#cdaa70'); rg.addColorStop(1, '#b38d57');
        c.fillStyle = rg;
        c.fillRect(ROAD_X, 0, ROAD_W, H);
        c.fillStyle = 'rgba(90,60,30,.22)';
        c.fillRect(ROAD_X - 3, 0, 4, H);
        c.fillRect(ROAD_X + ROAD_W - 1, 0, 4, H);
        c.strokeStyle = 'rgba(255,240,200,.55)';
        c.lineWidth = 3;
        c.setLineDash([22, 26]);
        c.lineDashOffset = -(dist % 48);
        for (let k = 1; k < 3; k++) {
          const lx = ROAD_X + LANE_W * k;
          c.beginPath(); c.moveTo(lx, 0); c.lineTo(lx, H); c.stroke();
        }
        c.setLineDash([]);
        const tOff = dist % 160;
        for (let y = tOff - 160; y < H + 60; y += 160) { tree(ROAD_X * 0.5, y); tree(W - ROAD_X * 0.5, y + 80); }
        // 齊境的界門
        const toGoal = GOAL - dist;
        const gy = CART_TOP - toGoal;
        if (gy > -70) {
          c.fillStyle = '#5a3a20';
          c.fillRect(ROAD_X - 10, gy - 6, 12, 40);
          c.fillRect(ROAD_X + ROAD_W - 2, gy - 6, 12, 40);
          c.fillStyle = '#7f5598';
          c.fillRect(ROAD_X - 10, gy - 14, ROAD_W + 20, 14);
          glyph('齊　境', W / 2, gy - 7, '#fff', 13);
        }
        obs.forEach(drawObs);
        drawCart();
      };

      const move = d => {
        if (over || paused()) return;
        const nl = clamp(lane + d, 0, 2);
        if (nl !== lane) { lane = nl; g.sfx('click'); }
      };
      cv.addEventListener('pointerdown', e => {
        e.preventDefault();
        const rect = cv.getBoundingClientRect();
        move(e.clientX - rect.left < rect.width / 2 ? -1 : 1);
      });
      pad.querySelectorAll('[data-d]').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); move(Number(b.dataset.d)); }));
      const onKey = e => {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { e.preventDefault(); move(-1); }
        else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { e.preventDefault(); move(1); }
      };
      document.addEventListener('keydown', onKey);
      let last = performance.now();
      const loop = now => {
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        if (!over && !paused()) step(dt);
        if (!over) { draw(); raf = requestAnimationFrame(loop); }
      };
      g.onCleanup(() => { over = true; cancelAnimationFrame(raf); document.removeEventListener('keydown', onKey); });
      g.setStatus('距齊境 30 里');
      draw();
      raf = requestAnimationFrame(loop);
    });
  }

    ['qin', '脫去上衣，自囚請罪'],
    ['qin', '宴席上賦〈河水〉，國君賦〈六月〉']
  ];

  function liuwangGame(body, g) {
    return new Promise(resolve => {
      const byStop = {};
      DEEDS.forEach((d, n) => { (byStop[d[0]] = byStop[d[0]] || []).push(n); });
      const must = STOPS.map(s => byStop[s.id][Math.floor(g.rng() * byStop[s.id].length)]);
      const rest = shuffle(DEEDS.map((d, n) => n).filter(n => must.indexOf(n) === -1), g.rng);
      const cards = shuffle(must.concat(rest.slice(0, 3)), g.rng);
      const N = cards.length;
      let k = 0, correct = 0, streak = 0, bonus = 0;
      let fuse = 1, fuseMax = 1, locked = true, over = false, raf = 0, timer = 0;
      body.innerHTML =
        '<div class="ce-lw">' +
        '<div class="ce-lw__card"><small class="ce-lw__no"></small><p class="ce-lw__text"></p><div class="ce-fuse"><i></i></div></div>' +
        '<div class="ce-lw__grid">' + STOPS.map((s, n) =>
          '<button type="button" class="ce-stop" data-s="' + s.id + '" style="--c:' + s.color + '"><i>' + (n + 1) + '</i><b>' + esc(s.name) + '</b></button>').join('') + '</div>' +
        '<p class="ce-lw__fb" aria-live="polite"></p>' +
        '</div>';
      const card = body.querySelector('.ce-lw__card');
      const noEl = body.querySelector('.ce-lw__no');
      const textEl = body.querySelector('.ce-lw__text');
      const fuseEl = body.querySelector('.ce-fuse');
      const fbEl = body.querySelector('.ce-lw__fb');
      const btns = Array.from(body.querySelectorAll('.ce-stop'));
      const nameOf = id => (STOPS.find(s => s.id === id) || { name: id }).name;
      const paint = () => {
        fuseEl.querySelector('i').style.setProperty('--p', Math.max(0, 100 * fuse / fuseMax).toFixed(1) + '%');
        fuseEl.classList.toggle('is-warn', !locked && fuse < 2);
      };
      const end = () => {
        if (over) return;
        over = true;
        locked = true;
        cancelAnimationFrame(raf);
        clearTimeout(timer);
        btns.forEach(b => { b.disabled = true; });
        const sc = clamp(Math.round(7 * correct / N + Math.min(3, bonus)), 0, 10);
        noEl.textContent = '答對 ' + correct + ' / ' + N;
        textEl.textContent = correct >= N - 1 ? '十九年的路，一步也沒有忘。' : correct >= 8 ? '一路的人和事，大致都說清楚了。' : '有些事，記得有點模糊了。';
        fuse = 0;
        paint();
        if (g.pop) g.pop('答對 ' + correct + ' 片', correct >= 10 ? 'gold' : 'ok');
        g.sfx(correct >= 8 ? 'ok' : 'ng');
        const result = { passed: correct >= 8, score: sc, max: 10, correct: correct };
        timer = setTimeout(() => resolve(result), 1300);
      };
      const next = () => {
        if (over) return;
        if (k >= N) { end(); return; }
        const d = DEEDS[cards[k]];
        fuseMax = 8 - 4 * k / (N - 1);
        fuse = fuseMax;
        noEl.textContent = '第 ' + (k + 1) + ' / ' + N + ' 片竹簡・這件事發生在哪裡？';
        textEl.textContent = d[1];
        card.classList.remove('is-in');
        void card.offsetWidth;
        card.classList.add('is-in');
        btns.forEach(b => { b.classList.remove('is-ok', 'is-bad', 'is-answer'); b.disabled = false; });
        fbEl.className = 'ce-lw__fb';
        fbEl.textContent = '';
        if (TEST) body.dataset.answer = d[0];
        g.setStatus('第 ' + (k + 1) + ' / ' + N + ' 片');
        locked = false;
        paint();
      };
      const pick = sid => {
        if (locked || over || paused()) return;
        locked = true;
        const d = DEEDS[cards[k]];
        const ok = sid === d[0];
        const btn = sid ? btns.find(b => b.dataset.s === sid) : null;
        btns.forEach(b => { b.disabled = true; });
        if (ok) {
          const frac = fuse / fuseMax;
          correct += 1;
          streak += 1;
          bonus += 0.25 * frac;
          if (g.combo) g.combo(streak);
          btn.classList.add('is-ok');
          g.sfx('ok');
          if (g.pop) g.pop(frac > 0.65 ? '記得清清楚楚！' : '沒錯！', frac > 0.65 ? 'gold' : 'ok');
        } else {
          streak = 0;
          if (g.combo) g.combo(0);
          if (btn) btn.classList.add('is-bad');
          const right = btns.find(b => b.dataset.s === d[0]);
          if (right) right.classList.add('is-answer');
          g.sfx('ng');
          if (g.shake) g.shake();
          fbEl.className = 'ce-lw__fb is-bad';
          fbEl.textContent = (sid ? '不對。' : '竹簡燒完了！') + '這件事發生在「' + nameOf(d[0]) + '」。';
        }
        k += 1;
        paint();
        timer = setTimeout(next, ok ? 550 : 1500);
      };
      btns.forEach(b => b.addEventListener('click', () => pick(b.dataset.s)));
      const onKey = e => {
        const n = parseInt(e.key, 10);
        if (n >= 1 && n <= STOPS.length && !locked) { e.preventDefault(); pick(STOPS[n - 1].id); }
      };
      document.addEventListener('keydown', onKey);
      let last = performance.now();
      const loop = now => {
        const dt = Math.min(0.1, (now - last) / 1000);
        last = now;
        if (!over && !locked && !paused()) {
          fuse -= dt;
          paint();
          if (fuse <= 0) { fuse = 0; pick(null); }
        }
        if (!over) raf = requestAnimationFrame(loop);
      };
      g.onCleanup(() => { over = true; cancelAnimationFrame(raf); clearTimeout(timer); document.removeEventListener('keydown', onKey); });
      next();
      raf = requestAnimationFrame(loop);
    });
  }


  // ═════════════════════════ 8. 結局與結算 ═════════════════════════

  const ENDINGS = {
    great: { id: 'great', title: '天將興之', good: true, text: '晉公子廣而儉，文而有禮；其從者肅而寬，忠而能力' },
    good: { id: 'good', title: '十九年而反國', good: true, text: '秦伯納之，公子入于晉師，朝于武宮' },
    bad: { id: 'bad', title: '歸途多艱', good: false, text: '公子雖得反國，而志氣未振，從者未附' }
  };

  function onEnd(result, ctx) {
    const s = ctx.state;
    const e = ENDINGS[(result && result.key) || 'good'] || ENDINGS.good;
    ZH.sfx('seal');
    return ctx.banner(e.title, '重耳流亡・終')
      .then(() => ctx.say([{ who: 'shiguan', text: '十九年的流亡路，走過八個國家。四年後，他在城濮一戰而霸——那是第 7 話〈城濮爭霸〉的故事。' }]))
      .then(() => ZH.deleteSave(SID, MODE).catch(() => null))
      .then(() => ZH.finishScenario(payload(s, e)));
  }

  function payload(s, ending) {
    const f = s.flags;
    const jian = Number(f.jianScore) || 0;
    const zui = Number(f.zuiScore) || 0;
    const lw = Number(f.lwScore) || 0;
    const played = id => (s.games || []).some(x => x.gameId === id && !x.skipped);
    const strategy = clamp(Math.round(jian * 3 + zui * 3.5 + lw * 3.5), 0, 100);
    const virtue = clamp(Math.round((s.meters.xin || 0) * 0.6 + (s.meters.zhi || 0) * 0.4), 0, 100);

    const deeds = ['晉獻公嬖驪姬，大子申生死於新城。姬譖二公子，重耳奔蒲，夷吾奔屈。'];
    deeds.push('公使寺人披伐蒲，重耳曰：「君父之命不校。」踰垣而走，披斬其袪，遂奔狄。');
    deeds.push('是歲，晉復假道於虞以伐虢。宮之奇諫，虞公弗聽，宮之奇以其族行。冬，晉滅虢，師還，襲虞，滅之。');
    deeds.push('處狄十二年而行。過衛，衛文公不禮焉。乞食於五鹿，野人與之塊，子犯曰：「天賜也。」稽首受而載之。');
    deeds.push('及齊，齊桓公妻之，公子安之。姜與子犯謀，醉而遣之' + (played('ce_zuiche') && zui >= 8 ? '，車出齊境，公子乃醒。' : '。'));
    deeds.push('及曹，曹共公觀其駢脅。僖負羈饋盤飧，寘璧焉，公子受飧反璧。及宋，宋襄公贈馬二十乘。及鄭，鄭文公亦不禮焉。');
    deeds.push('及楚，楚子饗之，公子許以辟君三舍；子玉請殺之，楚子弗許，乃送諸秦。秦伯納女五人，懷嬴與焉。');
    deeds.push('秦伯納之。及河，子犯授璧，公子曰：「所不與舅氏同心者，有如白水！」投其璧于河。入于曲沃，朝于武宮。');
    deeds.push('寺人披求見，告呂、郤之難，公潛會秦伯于王城，乃免。豎頭須求見，公遽見之。');
    deeds.push('晉侯賞從亡者，介之推不言祿，與其母偕隱而死。晉侯以緜上為之田，曰：「以志吾過，且旌善人。」' +
      (ending.id === 'great' ? '天將興之，誰能廢之。' : ending.id === 'bad' ? '然國人猶未盡附。' : ''));

    return {
      scenarioId: SID, mode: MODE, faction: '晉',
      role: '晉文公', roleKind: 'shijia', country: '晉',
      bioTitle: '晉世家・重耳之亡', bioOpening: '晉文公重耳，晉獻公之子也。',
      ending: ending,
      scoreStrategy: strategy, scoreVirtue: virtue,
      turns: s.steps || 1,
      durationSec: Math.min(5400, Math.round((Date.now() - (s.startedAt || Date.now())) / 1000)),
      deeds: deeds,
      anchors: s.anchors,
      games: s.games,
      codex: s.codex,
      opener: '余讀《左氏》，至「野人與之塊」，子犯曰「天賜也」，未嘗不歎從亡之士能轉辱為榮也。',
      prompts: [
        '宮之奇說「輔車相依，脣亡齒寒」，虞公卻相信「晉，吾宗也」「神必據我」。你覺得虞公錯在哪裡？生活中有沒有只看眼前好處、忽略長遠危險的例子？',
        '農人給了重耳一塊土，子犯說「天賜也」。同一件事換個角度看，意義就完全不同。你有沒有這樣的經驗？',
        '介之推認為爭功的從亡者是「貪天之功」，寧可隱居也不求賞。你同意他的做法嗎？如果你是晉文公，你會怎麼對待他？'
      ]
    };
  }


  // ═════════════════════════ 9. 開始 ═════════════════════════

  const saveState = state => ZH.save(SID, MODE, { engine: state }).catch(() => null);

  function startGame(saved) {
    ROOT.innerHTML = '';
    const game = ZH.story.create(ROOT, {
      id: SID, mode: MODE, title: META.name, subtitle: META.episode,
      seed: Number(params.seed) || 0, start: 'n_intro',
      characters: CHARACTERS, meters: METERS, nodes: NODES, help: HELP, scenes: SCENES,
      anchorTotal: ANCHOR_ORDER.length, anchorOrder: ANCHOR_ORDER,
      onEnd: onEnd, save: saveState
    });
    if (params.test) window.__ep = game;
    game.start(saved || null);
  }

  function roleFace() {
    const c = CHARACTERS.find(x => x.id === ROLE.who);
    if (c && window.ART && ART.portrait) return '<span class="ep-seal has-art" aria-hidden="true">' + ART.portrait(c, { bust: true }) + '</span>';
    return '<span class="ep-seal" aria-hidden="true">' + esc(ROLE.glyph) + '</span>';
  }

  function renderTitle(saved) {
    const vol = ZH.VOLUMES.find(v => v.key === META.vol) || { no: '', name: '' };
    const st = saved && saved.engine;
    const btn = (a, label, primary) => '<button type="button" class="zh-btn ' + (primary ? 'zh-btn--primary' : 'zh-btn--quiet') + ' zh-btn--block" data-a="' + a + '">' + esc(label) + '</button>';
    ROOT.innerHTML =
      '<div class="ep-title" style="--ep-color:' + esc(ROLE.color) + '">' +
      '<div class="ep-title__bar"><a class="zh-mark" href="#" data-a="home"><span class="zh-mark__re">Re:</span><span class="zh-mark__name">縱橫鼎業</span></a>' +
      '<button type="button" class="zh-btn zh-btn--quiet zh-btn--sm" data-a="home">回首頁</button></div>' +
      '<main class="ep-title__main"><header>' +
      '<p class="ep-kicker">' + esc([vol.no + ' ' + vol.name, ZH.episodeLabel(META), '前 ' + META.year + ' 年'].join('・')) + '</p>' +
      '<h1 class="ep-h1">' + esc(META.name) + '</h1>' +
      '<p class="ep-episode">' + esc(META.episode) + '</p>' +
      '<div class="ep-chips">' + (META.guest ? '<span class="zh-chip zh-chip--gilt">訪客開放</span>' : '') +
      '<span class="zh-chip">原典' + esc(META.source) + '</span><span class="zh-chip zh-chip--patina">' + esc(META.genre) + '</span>' +
      '<span class="zh-chip">自動存檔</span></div>' +
      (ZH.isGuest() ? '<p class="ep-note" style="margin-top:12px">你目前是訪客：可以完整遊玩，但進度只保存在這個分頁，也不會留下成績。</p>' : '') +
      '</header>' +
      '<section class="ep-start">' + roleFace() +
      '<div><h2 class="ep-start__name">' + esc(ROLE.name) + '・' + esc(ROLE.title) + '</h2><p class="ep-start__lead">' + esc(ROLE.lead) + '</p></div>' +
      '<div class="ep-start__act">' + (st ? btn('continue', st.ended ? '查看結局' : '繼續', true) + btn('new', '重新開始', false) : btn('new', '開始遊戲', true)) + '</div></section>' +
      '<section class="ep-points" aria-label="本話重點">' + POINTS.map(p => '<div class="ep-point"><b>' + esc(p.title) + '</b><span>' + esc(p.text) + '</span></div>').join('') + '</section>' +
      '<p class="ep-note">本話寫前 656 年到前 636 年重耳出亡與返國的經過。中間登場的晉惠公，是第 5 話〈韓原之戰〉的主角；重耳回國後的霸業，在第 7 話〈城濮爭霸〉。共 ' + ANCHOR_ORDER.length + ' 個史實錨點，約 35 分鐘。中途離開會自動存檔。</p>' +
      '</main></div>';
    ROOT.querySelectorAll('[data-a="home"]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); ZH.go('hub'); }));
    const cont = ROOT.querySelector('[data-a="continue"]');
    if (cont) cont.addEventListener('click', () => { ZH.sfx('click'); startGame(st); });
    ROOT.querySelector('[data-a="new"]').addEventListener('click', () => {
      ZH.sfx('click');
      if (!st) { startGame(null); return; }
      ZH.modal({
        title: '重新開始？', body: '<p>目前的進度會清除，從頭開始。</p>',
        actions: [{ label: '取消', value: false, kind: 'quiet' }, { label: '重新開始', value: true, kind: 'primary' }]
      }).then(ok => { if (ok) ZH.deleteSave(SID, MODE).catch(() => null).then(() => startGame(null)); });
    });
  }

  const loadSave = () => ZH.load(SID, MODE).then(r => (r && r.ok && r.state && r.state.engine ? r.state : null)).catch(() => null);

  ZH.ready(() => {
    ZH.loading(true, '展開竹簡');
    ZH.codex.init();
    Promise.all([loadSave(), Promise.race([anchorsReady, ZH.sleep(8000)])]).then(([saved]) => {
      ZH.loading(false);
      if (String(params.mode || '') === MODE && saved) { startGame(saved.engine); return; }
      renderTitle(saved);
    });
  });
})();
</script>
<script>ZH.ready(function(){ZH.textplay?.install("S_cq04_chonger",null);});</script>
