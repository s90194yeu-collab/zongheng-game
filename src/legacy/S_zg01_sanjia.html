  if(Number.isFinite(live.rng))snap.rng=live.rng;
  // Completed attempts resume from Arena's result card; their working decks
  // need not occupy cloud saves. Keep the active attempt, first/best results
  // and all required-operation evidence, including assisted actions.
  for(const key of Object.keys(snap.progress||{})){
    const m=key.match(/^(sj_flood|wen_sj_shuo|sj_yurang):(\d+)$/);if(!m)continue;

 await ctx.banner(ending.title,'趙襄子・此局趙世家');await ctx.say([{text:ending.text},{who:'shiguan',expr:'serious',text:'你的首次判斷與補做都會留下。接下來在結算頁寫自己的反思；由遊戲生成的列傳，不當作另一份史實。'}]);
 if(s.vars.submitted){ZH.session.set('result:'+SID,p);ZH.go('result',{s:SID});return;}
 s.vars.finishPayload=p;await checkpoint();await journal.flush();ZH.finishScenario(p);s.vars.submitted=true;await checkpoint();
}

function title(saved){const compatible=saved?.vars?.schema===SCHEMA,st=compatible?saved:null;ROOT.innerHTML='<main class="sj-title"><div class="sj-title-bar"><span class="zh-mark"><span class="zh-mark__re">Re:</span><span class="zh-mark__name">縱橫鼎業</span></span><button class="zh-btn zh-btn--quiet" data-home>回首頁</button></div><header><p class="sj-kicker">戰國篇・第一話・前455年</p><h1>三家分晉</h1><p class="sj-subtitle">大水淹到只剩三版，我們還沒投降</p><div class="ep-chips"><span class="zh-chip zh-chip--patina">守城 × 夜說 × 觀察</span><span class="zh-chip">自動存檔</span></div></header><section class="sj-title-scene" aria-label="晉陽城頭的趙襄子與張孟談">'+panorama('jinyang',['zhao','zhang'])+'</section><section class="sj-start"><span class="sj-seal" aria-hidden="true">趙</span><div><h2>趙襄子・趙毋卹</h2><p class="sj-note">親自調度守城，切換張孟談說盟，再在橋邊觀察查驗。不是只看歷史的結局，而是體驗決定如何改變處境。</p></div><div class="sj-start-actions">'+(st?'<button class="zh-btn zh-btn--primary" data-continue>'+(st.ended?'查看結局':'繼續遊戲')+'</button>':'')+'<button class="zh-btn '+(st?'zh-btn--quiet':'zh-btn--primary')+'" data-new>'+(st?'重新開始':'開始遊戲')+'</button></div></section><section class="sj-points"><div><b>水淹晉陽</b><p class="sj-note">十五回合，城高與民心都要顧。行動會互相牽動，敵人也不會停手。</p></div><div><b>夜說韓魏</b><p class="sj-note">五種疑慮，八秒回應。把脣亡齒寒說成可執行的合作。</p></div><div><b>橋下伏影</b><p class="sj-note">四輪限時觀察，從多項線索辨人，再思考知遇與報恩的界線。</p></div></section>'+(saved&&!compatible?'<p class="sj-follow">偵測到舊版進度。新版題目與玩法已調整，請另開一局；先前已登錄的成績與史冊仍保留。</p>':'')+'<p class="sj-note">預留約20～30分鐘。十個原文對讀、三項必要體驗，卡關時可不限時補做。新版 v1.1.0</p></main>';
 ROOT.querySelector('[data-home]').onclick=()=>ZH.go('hub');const cont=ROOT.querySelector('[data-continue]');if(cont)cont.onclick=()=>start(st);
 ROOT.querySelector('[data-new]').onclick=async()=>{if(loading)return;if(saved){const ok=await ZH.modal({title:'另開一局？',body:'<p>此話尚未完成的存檔會清除，從新版第一幕開始；已登錄的成績和史冊保留。</p>',actions:[{label:'取消',value:false,kind:'quiet'},{label:'重新開始',value:true,kind:'primary'}]});if(!ok)return;loading=true;await journal.clear();try{await ZH.deleteSave(SID,MODE);}catch(e){}loading=false;}start(null);};
}
