<script>(function(global){'use strict';
const copy=v=>JSON.parse(JSON.stringify(v)),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function shuffle(a,rng){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
const tiers=['上駟','中駟','下駟'],clues=[
 {expr:'serious',line:'寡人要先試最疾的那一匹。馬倌，把金色轡頭備好。',hint:'金轡、最疾，指向上駟。'},
 {expr:'smirk',line:'這一場不急用最快的，也不讓最慢的先出。青色轡頭的正合適。',hint:'不快不慢、青轡，指向中駟。'},
 {expr:'happy',line:'寡人留下兩匹快馬，先讓素色轡頭的慢慢熱身。',hint:'素轡、留下快馬，指向下駟。'}
];
function optimal(plan,p,k){const perms=[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];return perms.reduce((best,a)=>a.filter((t,i)=>p[t]>k[plan[i]]).length>best.filter((t,i)=>p[t]>k[plan[i]]).length?a:best,perms[0]);}
function saima(saved,rng,attempt=1){
 const s=saved?copy(saved):{phase:'choose',round:0,left:10,elapsed:0,raceAge:0,used:[],stake:200,gold:1000,answers:[],guideAnswers:[],wins:0,first:null,plan:attempt===1?[0,...shuffle([1,2],rng)]:shuffle([0,1,2],rng),playerSpeed:[90+rng()*2,78+rng()*2,66+rng()*2],kingSpeed:[95+rng()*2,82+rng()*2,70+rng()*2],selectSeconds:0};
 const recommended=()=>optimal(s.plan,s.playerSpeed,s.kingSpeed)[s.round];
 const current=()=>({king:s.plan[s.round],clue:clues[s.plan[s.round]]});
 function original(passed){return{score:Math.min(10,s.wins*3+(s.gold>=1300?2:s.gold>1000?1:0)+(s.answers.length===3&&s.selectSeconds<=9?2:s.answers.length===3&&s.selectSeconds<=18?1:0)),max:10,passed,wins:s.wins,gold:s.gold,answers:copy(s.answers),selectSeconds:s.selectSeconds,elapsed:s.elapsed};}
 function choose(tier){if(s.phase!=='choose'||!Number.isInteger(tier)||tier<0||tier>2||s.used.includes(tier))return false;if(s.assisted&&tier!==recommended()){s.note='對照王的線索，這一局先用'+tiers[recommended()]+'。請親自重選。';return true;}
  const king=current().king,win=s.playerSpeed[tier]>s.kingSpeed[king],entry={round:s.round,tier,king,win,stake:s.stake,sec:s.assisted?0:10-s.left};
  if(s.assisted)s.guideAnswers.push(entry);else{s.answers.push(entry);s.selectSeconds+=entry.sec;}s.used.push(tier);s.wins+=Number(win);s.gold+=win?s.stake:-s.stake;s.match=entry;s.raceAge=0;s.phase='race';s.note='雙方同時亮牌：田忌'+tiers[tier]+'，齊王'+tiers[king]+'。';return true;}
 function bet(value){if(s.phase!=='choose'||![100,200,300].includes(value))return false;s.stake=value;return true;}
 function advance(dt){if(s.phase==='choose'&&!s.assisted){s.elapsed+=dt;s.left=Math.max(0,s.left-dt);if(s.left===0){s.first=original(false);s.phase='failed';s.note='這局未在10秒內出牌，請親自補做三次調度。';return true;}}if(s.phase==='race'){s.raceAge+=dt;if(s.raceAge>=(s.round===2?2.6:1.3)){s.phase='feedback';s.note=(s.match.win?'田忌這場勝。':'田忌這場不勝。')+'比較的是整組三場的勝負，而非每一場都用最快的馬。';return true;}}return false;}
 function next(){if(s.phase!=='feedback')return false;s.round++;if(s.round===3){if(!s.assisted)s.first=original(s.wins>=2);s.phase=s.assisted||s.wins>=2?'done':'failed';s.note=s.wins>=2?'一不勝而再勝：調度使整體勝出。':'配對尚未勝兩場，接著親自補做。';}else{s.phase='choose';s.left=10;}return true;}
 function assist(){if(s.phase==='done'||s.assisted)return false;if(!s.first)s.first={...original(false),score:0};s.assisted=true;s.phase='choose';s.round=0;s.left=10;s.used=[];s.wins=0;s.gold=1000;s.guideAnswers=[];s.note='不限時：觀察王的轡頭線索，親自把三匹馬重新配對。';return true;}
 const race=()=>{const t=clamp(s.raceAge/(s.round===2?2.6:1.3),0,1),win=s.match?.win;return{me:t*(win?1:.82),rival:t*(win?.82:1)};};
 return{s,current,recommended,choose,bet,advance,next,assist,race,snapshot:()=>copy(s),result:()=>({...copy(s.first),completed:s.phase==='done',assisted:!!s.assisted,guideSteps:s.guideAnswers.length,operated:copy(s.guideAnswers)})};
}
function daliang(saved,rng){
 const s=saved?copy(saved):{phase:'route',left:60,elapsed:0,round:0,lane:1,grain:60,collected:0,hits:0,ambushes:0,routeFirst:null,history:[],guideMoves:[],guide:0,first:null,waves:Array.from({length:24},(_,i)=>{const safe=Math.floor(rng()*3),block=(safe+1+Math.floor(rng()*2))%3;return{safe,block,ambush:3-safe-block,grain:i%4!==3};})};
 const current=()=>s.waves[Math.min(s.assisted?s.guide:s.round,23)],cross=()=>3+s.round*2.4;
 const race=()=>({me:clamp(.80*s.elapsed/60+s.collected*.012-s.hits*.018-s.ambushes*.028,0,1),rival:.96*s.elapsed/60});
 function route(id){if(s.phase!=='route')return false;if(s.routeFirst===null)s.routeFirst=id;if(id!=='daliang'){s.note=id==='handan'?'邯鄲已有魏軍銳卒；先找能牽動魏軍的空虛之處。':'遠離兩軍的路線無法牽動魏軍回援。';return true;}s.phase=s.assisted?'assist':'play';s.note='親自調度車隊抵近大梁，牽動魏軍回師；不是攻陷大梁的操作。';return true;}

function payload(s,ending){const scores=['saima','daliang','jianzao'].map(k=>s.vars[k].firstScore);return{scenarioId:SID,chapterVersion:VERSION,runId:s.vars.runId,mode:MODE,faction:'齊',country:'齊',role:'孫臏',roleKind:'liezhuan',bioTitle:'孫子吳起列傳',bioOpening:'孫武既死，後百餘歲有孫臏。',ending,scoreStrategy:Math.round(scores.reduce((a,b)=>a+b,0)/30*100),scoreVirtue:Math.round(s.anchors.filter(a=>a.correct).length/11*60+Number(s.vars.choices.cooperate==='cooperate')*20+Number(s.vars.choices.terrain==='check')*20),turns:s.steps,durationSec:Math.min(5400,Math.round((Date.now()-s.startedAt)/1000)),deeds:['由齊使載行離魏，田忌待為客；以孫臏視角，乘輜車坐為計謀。','親自調度三場賽馬，首次'+scores[0]+'分；比較配馬、路線與整組勝負。','桂陵段先選牽動魏軍的路線，再親自保糧換道，首次'+scores[1]+'分；對讀魏去邯鄲、戰於桂陵。','馬陵段親設三日竈數、九路點行軍與兩側部署，首次'+scores[2]+'分；分清誘敵跡象與實際兵力。','讀馬陵白書與太史公評語，回看成見、核查、言說與實行。'],anchors:copy(s.anchors),games:copy(s.games),codex:s.codex.slice(),opener:'遊戲史官評語（自擬）：余觀孫臏之計，自賽馬而知配對，自桂陵而知攻虛，自馬陵而知時地與人心。計不止於言，亦須糧足、軍行、眾力相成；察跡而忘核，則輕敵之見足以自蔽。',prompts:['田忌賽馬的配對法能用於今天的競爭嗎？用首次一場選馬紀錄，說明規則、能力差距與整體目標的限制。','龐涓如何把減竈當作士卒逃亡的證據？用本局竈數與部署紀錄，提出你會查核的其他可能。','能行之者未必能言，能言之者未必能行。對照一項首次操作與補做，說明計策落實還需要哪些分工與條件。'],experience:{firstAnchors:copy(s.vars.firstAnchors),saima:copy(s.vars.saima),daliang:copy(s.vars.daliang),jianzao:copy(s.vars.jianzao),decisions:copy(s.vars.choices)}};}

async function start(saved){if(loading)return;loading=true;ROOT.innerHTML='';game=ZH.story.create(ROOT,{id:SID,mode:MODE,title:'桂陵馬陵',subtitle:'輸一場、贏兩場，這就是賽馬的兵法',seed:Number(params.seed)||0,start:'n_01',characters:CHARACTERS,scenes:SCENES,nodes:ZH.character?.warringNodes(SID,NODES,checkpoint)||NODES,meters:[{id:'strategy',label:'謀略',icon:'scroll',max:100,start:40},{id:'morale',label:'齊軍士氣',icon:'sword',max:100,start:60},{id:'light',label:'龐涓輕敵',icon:'eye',max:100,start:30}],help:HELP,anchorOrder:ORDER,anchorTotal:11,anchorRunner,snapshot,save,onProgress:save,onEnd,initState:()=>({_ocChapter:ZH.character?.newChapterState(SID),vars:{schema:SCHEMA,runId:'ml_'+Date.now().toString(36)+'_'+crypto.getRandomValues(new Uint32Array(1))[0].toString(36),firstAnchors:{},choices:{}}})});window.__ep=game;loading=false;game.start(saved?ZH.character?.applyChapterChoice(SID,saved)||saved:null);}
function title(saved){const compatible=saved?.vars?.schema===SCHEMA,st=compatible?saved:null;ROOT.innerHTML='<main class="ml-title"><div class="ml-title-bar"><span class="zh-mark"><span class="zh-mark__re">Re:</span><span class="zh-mark__name">縱橫鼎業</span></span><button class="zh-btn zh-btn--quiet" data-home>回首頁</button></div><header><p class="ml-kicker">戰國篇・第五話・齊</p><h1>桂陵馬陵</h1><p class="ml-subtitle">輸一場、贏兩場，這就是賽馬的兵法</p><div class="ep-chips"><span class="zh-chip zh-chip--patina">配馬 × 牽制 × 誘敵</span><span class="zh-chip">自動存檔</span></div></header><section class="ml-title-scene" aria-label="坐為計謀的孫臏與田忌">'+panorama('horses',['bin','tian'])+'</section><section class="ml-start"><span class="ml-seal" aria-hidden="true">策</span><div><h2>你是孫臏</h2><p class="ml-note">從賽馬的配對到兩次戰役，親自調度車隊、竈數與伏兵。</p></div><div class="ml-start-actions">'+(st?'<button class="zh-btn zh-btn--primary" data-continue>'+(st.ended?'查看結局':'繼續遊戲')+'</button>':'')+'<button class="zh-btn '+(st?'zh-btn--quiet':'zh-btn--primary')+'" data-new>'+(st?'重新開始':'開始遊戲')+'</button></div></section><section class="ml-points"><div><b>田忌賽馬</b><p class="ml-note">看齊王的表情與轡頭線索，親配三匹馬，承受一敗換取兩勝。</p></div><div><b>兵臨大梁</b><p class="ml-note">先選牽制路線，指揮輜車避險、保糧，牽動魏軍回師。</p></div><div><b>減竈誘敵</b><p class="ml-note">親設三天竈數與行軍，將六隊伏兵部署到馬陵道路兩側。</p></div></section>'+(saved&&!compatible?'<p class="ml-follow">偵測到不同版本進度。新版另開一局，先前已登錄的成績與史冊保留。</p>':'')+'<p class="ml-note">預留約20～30分鐘。十一個原文對讀、三項必要體驗；卡關可不限時親自補做。v1.1.0</p></main>';const characterEntry=document.createElement('div');characterEntry.setAttribute('data-character-entry','');ROOT.querySelector('.ml-start').after(characterEntry);ZH.character?.mountEntry(characterEntry,SID,st);ROOT.querySelector('[data-home]').onclick=()=>ZH.go('hub');const cont=ROOT.querySelector('[data-continue]');if(cont)cont.onclick=()=>start(st);ROOT.querySelector('[data-new]').onclick=async()=>{if(loading)return;if(saved){const ok=await ZH.modal({title:'另開一局？',body:'<p>此話未完成的進度會清除；已登錄的成績與史冊保留。</p>',actions:[{label:'取消',value:false,kind:'quiet'},{label:'重新開始',value:true,kind:'primary'}]});if(!ok)return;loading=true;await journal.clear();try{await ZH.deleteSave(SID,MODE);}catch(e){}loading=false;}start(null);};}
ZH.ready(async()=>{if(!ZH.story?.createJournal||!ZH.arena||!window.ART){ROOT.innerHTML='<main class="ml-title"><h1>共用核心尚未齊備</h1><p>請使用目前的 Eng_Story、Art_kit 與 Arena_js，再載入第五話。</p><button class="zh-btn" data-home>回首頁</button></main>';ROOT.querySelector('[data-home]').onclick=()=>ZH.go('hub');return;}installSeatedArt();installMalingTree();journal=ZH.story.createJournal({id:SID,mode:MODE,scope:ZH.user?.email||window.ZH_BOOT.user?.email||'guest',remote:s=>ZH.save(SID,MODE,{engine:s,chapterVersion:VERSION})});ZH.loading(true,'展開桂陵馬陵的竹簡');try{const [saved]=await Promise.all([load(),ZH.anchor.load(SID),ZH.codex.init()]);if(ORDER.some(id=>!ZH.anchor.get(SID,id)))throw Error('第五話題庫尚未加入，請一併放入 S_zg05_maling_data，並清除題庫快取後部署。');ZH.loading(false);if(String(params.mode||'')===MODE&&saved?.vars?.schema===SCHEMA)start(saved);else title(saved);}catch(e){ZH.loading(false);ROOT.innerHTML='<main class="ml-title"><h1>載入尚未完成</h1><p>'+E(e.message||String(e))+'</p><button class="zh-btn zh-btn--primary" data-reload>重新載入</button></main>';ROOT.querySelector('[data-reload]').onclick=()=>ZH.reloadPage();}});
