    n_schoolgame:async ctx=>{
      await ctx.scene('zheng_school',{place:'鄭・鄉校',time:'前542年・白天'});ctx.cast(['zichan','people']);
      const r=await ctx.minigame({id:'zc_xiangxiao',title:'鄉校議政',goal:'親自處理十二則議論：維持有效施政、改正問題、查證傳聞。',skip:false,help:'<p>點吾則行之：具體肯定有效施政；點吾則改之：指出實際問題；點查證：只有傳言、沒有依據。批評不是謠言。</p><p>前六則五秒、後六則三秒，總限時五十秒。正確率八分、連擊一分、低怨氣一分；八則正確為首次過關。錯分須親自補作，提示或時間到會保留首次表現。</p>'},(body,g)=>ZH.games_cq13.xiangxiao(body,g));remember(ctx,'xiangxiao',r);
      ctx.add('people',firstOf(r).passed?18:-10);ctx.add('opposition',firstOf(r).passed?-12:12);return 'n_follow';
    },
    n_follow:async ctx=>{
      await ctx.scene('zheng_room',{place:'鄭・子產書房',time:'鄉校議政後・夜'});ctx.cast(['zichan','zidashu']);
      await ctx.say([{who:'zidashu',text:'議論收進來了，接著怎麼辦？',expr:'serious'},{who:'zichan',text:'留下聲音，只是第一步。得讓大家知道問題怎麼處理。',expr:'serious'}]);
      const p=await ctx.choose({title:'議政後的施政推演',text:'選擇會影響執行品質，不改寫不毀鄉校的史實。',options:[{label:'核對稅冊，回覆改善期限',value:'respond',desc:'把批評轉成能追蹤的改進。'},{label:'先稱讚百姓，暫不處理',value:'delay',desc:'氣氛緩和，問題仍然留下。'},{label:'只讓支持者提出意見',value:'filter',desc:'聽起來順耳，缺少新的警訊。'}]});
      await ctx.say([{who:'zidashu',text:p==='respond'?'田邊的問題有了回覆，大家能再來核對。':p==='delay'?'大家等著的不是好話，是問題何時處理。':'反對者不再進來；你也失去知道問題的機會。',expr:p==='respond'?'happy':'worried'}]);ctx.flag('school',p);ctx.add('people',p==='respond'?12:p==='delay'?-8:-15);ctx.add('power',p==='respond'?8:0);ctx.add('opposition',p==='filter'?15:p==='respond'?-5:3);return 'n_castlaw';
    },
    n_castlaw:async ctx=>{
      await ctx.chapter('刑書公布','前536年・昭公六年');await ctx.scene('zheng_palace',{place:'鄭・宮城',time:'前536年・白天'});ctx.cast(['zichan','shuxiang']);
      await ctx.say([{text:'鄭人鑄刑書，使刑法有公開可知的文字。畫面中的叔向代表來信，並非當面會談。'},{who:'shuxiang',text:'人們知道條文，就可能拿條文爭辯，禮制還守得住嗎？',expr:'worried'},{text:'叔向有他的憂慮；子產如何回信，請在原文錨點作答。'}]);await ctx.anchor('zc_09');ctx.unlock('person:cq_shuxiang');ctx.unlock('treasure:cq13_xingshu');return 'n_lawwork';
    },
    n_lawwork:async ctx=>{
      await ctx.scene('market',{place:'鄭・刑書告示處',time:'前536年・黃昏',tod:'dusk'});ctx.cast(['zichan','people']);
      await ctx.say([{who:'people',text:'條文看到了。有人看不懂，官吏又各說各的，怎麼辦？',expr:'worried'}]);
      const p=await ctx.choose({title:'公開刑書後，如何施行？',text:'刑書已鑄；接著是教學推演中的執行安排。',options:[{label:'公開說明，核對官吏的執行',value:'explain',desc:'使條文與處理標準一致。'},{label:'立刻一律重罰，迅速立威',value:'harsh',desc:'有威嚇，卻可能造成新怨。'},{label:'只公布條文，各地自行解釋',value:'leave',desc:'節省安排，執行可能不一致。'}]});
      await ctx.say([{who:'shiguan',text:p==='explain'?'讓人民看得懂，也讓執行者受到核對。':p==='harsh'?'威嚇不能取代公平與教導，百姓的疑慮增加了。':'同一份刑書，各地做法卻不同，爭議還是回到田間。',expr:'serious'}]);ctx.flag('law',p);ctx.add('people',p==='explain'?10:p==='harsh'?-15:-6);ctx.add('power',p==='explain'?12:p==='harsh'?4:-4);ctx.add('opposition',p==='explain'?-4:10);return 'n_sick';
    },
    n_sick:async ctx=>{
      await ctx.chapter('交代國政','前522年・昭公二十年');await ctx.scene('sickroom',{place:'鄭・子產病室',time:'前522年・黃昏'});ctx.cast(['zichan','zidashu']);
      await ctx.say([{text:'子產病重，告訴子大叔：自己死後，他必定接掌國政。'},{who:'zidashu',text:'我不願苛待百姓。寬厚就一定能治好嗎？',expr:'worried'},{who:'zichan',text:'先讀火與水的比喻，再想寬政為什麼難。',expr:'serious'}]);await ctx.anchor('zc_10');ctx.unlock('person:cq_zidashu');ctx.unlock('text:zichanlunzheng');return 'n_successor';
    },
    n_successor:async ctx=>{
      await ctx.scene('market',{place:'鄭・子大叔接政後',time:'前522年後・白天'});ctx.cast(['zidashu','shiguan']);
      await ctx.say([{text:'子產病了數月後去世。子大叔不忍用猛而過於寬，鄭國盜患增加；他後悔並加以整治。'},{who:'zidashu',text:'我原以為寬厚就夠了，卻忽略了規範與執行。',expr:'sad'},{who:'shiguan',text:'整治盜患的刑罰只作平實轉述。下一幕由孔子評議，不把強制手段做成操作。',expr:'serious'}]);return 'n_balance';
    },
    n_balance:async ctx=>{
      await ctx.chapter('尾聲・仲尼的評語','寬與猛，怎樣相濟？');await ctx.scene('academy',{place:'魯・講席',time:'聽聞鄭政之後・白天',tod:'day',banner:'#6f7f3f',glyph:'魯'});ctx.cast(['kongzi','shiguan']);
      await ctx.say([{text:'孔子回看子大叔的施政：寬與猛都不能一味用到底。'},{who:'kongzi',text:'讀這段話時，看看每一步是為了補救哪一種偏差。',expr:'serious'}]);await ctx.anchor('zc_11');ctx.unlock('idiom:kuanmengxiangji');return 'n_legacy';
    },
    n_legacy:async ctx=>{
      await ctx.scene('academy',{place:'魯・講席',time:'仲尼聞子產卒・黃昏',tod:'dusk'});ctx.cast(['kongzi','shiguan']);
      await ctx.say([{text:'《左傳》最後另記仲尼聽聞子產去世而落淚的評語。'},{who:'shiguan',text:'這一個「愛」字，是留給治國之人的回望。',expr:'sad'}]);await ctx.anchor('zc_12');return 'n_end';
    },
    n_end:async ctx=>{
      const key=ctx.meter('people')<30||ctx.meter('opposition')>=85?'bad':ctx.meter('people')>=70&&ctx.meter('power')>=60?'great':'good';return ctx.end({type:'final',key});
    }
  };
  // 6. 小遊戲實作在本頁末尾引入 Side_cq13_games；只在節點執行時使用。
  // 7. 結局與結算
  const ENDINGS = {
    great:{id:'great',title:'古之遺愛',good:true,text:'田有封洫，鄉校不毀。古之遺愛，民思其德。'},
    good:{id:'good',title:'寬猛相濟',good:true,text:'聞過而改，寬猛相濟。政有所未盡，亦知所歸。'},
    bad:{id:'bad',title:'政寬民慢',good:false,text:'徒存政令，未得民心。寬猛失中，宜省其過。'}
  };
  function onEnd(result,ctx){const s=ctx.state,e=ENDINGS[result&&result.key]||ENDINGS.good;ZH.sfx('seal');return ctx.banner(e.title,'子產治鄭・終').then(()=>ctx.say([{who:'shiguan',text:'子產不毀鄉校、鑄刑書與病卒的史實不變。這一局的評語，回看的是你推行與聽取意見的表現。',expr:'serious'}])).then(()=>ZH.deleteSave(SID,MODE).catch(()=>null)).then(()=>ZH.finishScenario(payload(s,e)));}
  function payload(s,ending){
    const f=s.flags,v=s.vars,trial=['guanyue','fengxu','xiangxiao'].reduce((n,k)=>n+Number(v[k]&&v[k].firstScore||0),0)/30;
    const goodChoices=[f.plan==='survey',f.school==='respond',f.law==='explain'].filter(Boolean).length;
    const strategy=Math.round(ZH.clamp(25+goodChoices*15+trial*30,0,100));
    const virtue=Math.round(ZH.clamp(20+goodChoices*15+s.meters.people*.25+(100-s.meters.opposition)*.15,0,100));
    const deeds=['吳季札聘於魯，觀周樂；聘鄭，見子產，勉之以禮。','鄭子皮授政，子產辭以國小族大，子皮帥以聽之。'];
    deeds.push(f.plan==='survey'?'先察水道，核田籍而定封洫。':f.plan==='favor'?'初徇大族，小民有怨，乃更省田政。':'初急於改界，田人疑之，乃復核其籍。');
    deeds.push('從政一年，輿人怨之；及三年，誦其教養之功。','然明請毀鄉校，子產不許，以民言為師。');
    deeds.push(f.school==='respond'?'聞民之病，省賦役而告其期。':f.school==='delay'?'雖聞民言，改政稍遲，猶知當省。':'初偏聽善己者，失其警戒，乃知納言之難。');
    deeds.push('鄭人鑄刑書，叔向詒書，子產復書以救世。');
    deeds.push(f.law==='explain'?'既明其法，復察吏治，求令行而民知。':f.law==='harsh'?'初急於威，民有疑懼，乃思寬猛之中。':'條文雖布，吏治未齊，猶須明其施行。');
    deeds.push('子產有疾，告子大叔以寬猛之政。','子產卒，仲尼聞之出涕，稱古之遺愛。');
    return {scenarioId:SID,mode:MODE,faction:'鄭',role:'子產',roleKind:'liezhuan',country:'鄭',bioTitle:'循吏列傳・子產',bioOpening:'子產者，鄭之列大夫也。',ending,scoreStrategy:strategy,scoreVirtue:virtue,turns:s.steps||1,durationSec:Math.min(5400,Math.round((Date.now()-(s.startedAt||Date.now()))/1000)),deeds,anchors:s.anchors,games:s.games,codex:s.codex,opener:'余讀〈子產論政寬猛〉，至仲尼聞之出涕，未嘗不歎子產之遺愛也。',prompts:['學校或班級裡，什麼地方像鄉校？如何讓批評得到回覆與改進？','寬與猛各在什麼情況有效？如何避免寬變放任、猛變苛刻？','改革最初被罵時，你會找哪些證據判斷要堅持還是調整？']};
  }

  // ═════════════════════════ 8. 開始（通常不用改；需要時加 scenes、initState） ═════════════════════════

  const saveState = state => ZH.save(SID, MODE, { engine: state }).catch(() => null);

  function startGame(saved) {
    ROOT.innerHTML = '';
    const game = ZH.story.create(ROOT, {
      id: SID, mode: MODE, title: META.name, subtitle: META.episode,
      seed: Number(params.seed) || 0, start: 'n_intro',
      characters: CHARACTERS, meters: METERS, nodes: ZH.character?.springNodes(SID, NODES, () => game.save()) || NODES, help: HELP, scenes: SCENES,
      initState: () => ({ _ocChapter: ZH.character?.newChapterState(SID) }),
      anchorTotal: ANCHOR_ORDER.length, anchorOrder: ANCHOR_ORDER,
      snapshot: (snap, live) => { if (live?._ocChapter) snap._ocChapter = JSON.parse(JSON.stringify(live._ocChapter)); },
      onEnd: onEnd, save: saveState
    });
    if (params.test) window.__ep = game;
    game.start(saved ? ZH.character?.applyChapterChoice(SID, saved) || saved : null);
  }

  function roleFace() {
    const c = CHARACTERS.find(x => x.id === ROLE.who);
    if (c && window.ART && ART.portrait) return '<span class="ep-seal has-art" aria-hidden="true">' + ART.portrait(c, { bust: true }) + '</span>';
    return '<span class="ep-seal" aria-hidden="true">' + esc(ROLE.glyph) + '</span>';
  }

  function renderTitle(saved) {
    const vol = ZH.VOLUMES.find(v => v.key === META.vol) || { no: '', name: '' };
    const st = saved && saved.engine;
    const btn = (a, label, primary) => '<button type="button" class="zh-btn ' + (primary ? 'zh-btn--primary' : 'zh-btn--quiet') + ' zh-btn--block" data-a="' + a + '">' + esc(label) + '</button>';
    ROOT.innerHTML =
      '<div class="ep-title" style="--ep-color:' + esc(ROLE.color) + '">' +
      '<div class="ep-title__bar"><a class="zh-mark" href="#" data-a="home"><span class="zh-mark__re">Re:</span><span class="zh-mark__name">縱橫鼎業</span></a>' +
      '<button type="button" class="zh-btn zh-btn--quiet zh-btn--sm" data-a="home">回首頁</button></div>' +
      '<main class="ep-title__main"><header>' +
      '<p class="ep-kicker">' + esc([vol.no + ' ' + vol.name, ZH.episodeLabel(META), META.year ? '前 ' + META.year + ' 年' : ''].filter(Boolean).join('・')) + '</p>' +
      '<h1 class="ep-h1">' + esc(META.name) + '</h1>' +
      '<p class="ep-episode">' + esc(META.episode) + '</p>' +
      '<div class="ep-chips">' + (META.guest ? '<span class="zh-chip zh-chip--gilt">訪客開放</span>' : '') +
      '<span class="zh-chip">原典' + esc(META.source) + '</span><span class="zh-chip zh-chip--patina">' + esc(META.genre) + '</span>' +
      '<span class="zh-chip">自動存檔</span></div>' +
      (ZH.isGuest() ? '<p class="ep-note" style="margin-top:12px">你目前是訪客：可以完整遊玩，但進度只保存在這個分頁，也不會留下成績。</p>' : '') +
      '</header>' +
      '<section class="ep-start">' + roleFace() +
      '<div><h2 class="ep-start__name">' + esc(ROLE.name) + '・' + esc(ROLE.title) + '</h2><p class="ep-start__lead">' + esc(ROLE.lead) + '</p></div>' +
      '<div class="ep-start__act">' + (st ? btn('continue', st.ended ? '查看結局' : '繼續', true) + btn('new', '重新開始', false) : btn('new', '開始遊戲', true)) + '</div></section>' +
      '<section class="ep-points" aria-label="本話重點">' + POINTS.map(p => '<div class="ep-point"><b>' + esc(p.title) + '</b><span>' + esc(p.text) + '</span></div>').join('') + '</section>' +
      '<p class="ep-note">本話共 ' + ANCHOR_ORDER.length + ' 個史實錨點。中途離開會自動存檔。</p>' +
      '</main></div>';
    const characterEntry = document.createElement('div'); characterEntry.setAttribute('data-character-entry', '');
    ROOT.querySelector('.ep-start').after(characterEntry); ZH.character?.mountEntry(characterEntry, SID, st);
    ROOT.querySelectorAll('[data-a="home"]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); ZH.go('hub'); }));
    const cont = ROOT.querySelector('[data-a="continue"]');
    if (cont) cont.addEventListener('click', () => { ZH.sfx('click'); startGame(st); });
    ROOT.querySelector('[data-a="new"]').addEventListener('click', () => {
      ZH.sfx('click');
      if (!st) { startGame(null); return; }
      ZH.modal({
        title: '重新開始？', body: '<p>目前的進度會清除，從頭開始。</p>',
        actions: [{ label: '取消', value: false, kind: 'quiet' }, { label: '重新開始', value: true, kind: 'primary' }]
      }).then(ok => { if (ok) ZH.deleteSave(SID, MODE).catch(() => null).then(() => startGame(null)); });
    });
  }

  const loadSave = () => ZH.load(SID, MODE).then(r => (r && r.ok && r.state && r.state.engine ? r.state : null)).catch(() => null);

  ZH.ready(() => {
    ZH.loading(true, '展開竹簡');
    ZH.codex.init();
    Promise.all([loadSave(), Promise.race([anchorsReady, ZH.sleep(8000)])]).then(([saved]) => {
      ZH.loading(false);
      // 從首頁「繼續遊戲」帶著模式進來：直接接續
      if (String(params.mode || '') === MODE && saved) { startGame(saved.engine); return; }
      renderTitle(saved);
    });
  });
})();
</script>
<?!= include('Side_cq13_games') ?>
<script>ZH.ready(function(){ZH.textplay?.install("S_cq13_zichan",null);});</script>
