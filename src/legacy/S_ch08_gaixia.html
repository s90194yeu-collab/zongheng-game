        const guideNext = body.querySelector('[data-action="guide-next"]'); if (guideNext) guideNext.disabled = !s.guideCorrect;
        const resume = body.querySelector('[data-action="resume"]'); if (resume) resume.disabled = blocked();
        if (rhythm) {
          const note = body.querySelector('[data-note]'), shown = ['running', 'practice', 'guided', 'paused'].includes(s.phase);
          note.hidden = !shown; note.textContent = DIRECTIONS[t]; note.classList.toggle('is-hit', s.marked || s.practiceCorrect || s.guideCorrect);
          const p = s.phase === 'running' || s.phase === 'paused' ? Math.max(0, Math.min(1.1, (s.time - (m.schedule[i].due - 1.4)) / 1.4)) : 1;
          body.querySelector('.ch08-ring').classList.toggle('is-window', s.phase === 'running' && Math.abs(s.time - m.schedule[i].due) <= .35);
          const delta = Math.max(0, 1 - p) * 60, x = 50 + (t === 0 ? delta : t === 2 ? -delta : 0), y = 50 + (t === 1 ? delta : t === 3 ? -delta : 0);
          note.style.left = 'calc(' + x + '% - 22px)'; note.style.top = 'calc(' + y + '% - 22px)';
        } else {
          const p = s.phase === 'running' ? Math.max(0, Math.min(1, (s.time - (m.schedule[i].due - 2.5)) / 2.5)) : 0;
          body.querySelectorAll('[data-obstacle]').forEach(el => { const lane = Number(el.dataset.obstacle), safe = lane === t; el.textContent = safe ? '可行' : ['拒馬', '封道旗', '示警區'][(i + lane) % 3]; el.classList.toggle('is-safe', safe); el.style.top=(34+p*Math.max(50,el.parentElement.clientHeight-135))+'px'; });
          body.querySelectorAll('[data-rider]').forEach(el => { el.classList.toggle('ch08-hidden', Number(el.dataset.rider) !== s.lane); });
          body.querySelectorAll('[data-input]').forEach(el => { const selected = Number(el.dataset.input) === s.lane; el.classList.toggle('is-selected', selected); el.setAttribute('aria-pressed', String(selected)); });
        }
      }
      function tick(now) {
        if (lastTime !== null && s.phase === 'running') m.advance(Math.max(0, (now - lastTime) / 1000)); lastTime = now;
      }
      function frame(now) {
        if (!alive) return;
        if (blocked() && m.pause()) render(false);
        tick(now);if(paintedPhase!==s.phase)render(false);else paint();if(s.phase==='running' && now-lastPersist>=150)persist();
        raf = requestAnimationFrame(frame);
      }
      function input(t) {
        if (!alive || blocked()) return; tick(performance.now());
        const accepted = m.input(t); if (accepted && sound) g.sfx('click'); if(paintedPhase!==s.phase)render(false);else paint();persist();
      }
      function click(e) {
        const b = e.target.closest('button'); if (!alive || !b || !body.contains(b) || b.disabled || blocked()) return;
        if (b.dataset.input !== undefined) { input(Number(b.dataset.input)); return; }
        const a = b.dataset.action; tick(performance.now());
        if (a === 'sound') { sound = !sound; b.textContent='提示音：'+(sound?'開':'關');persist();return; }
        if (a === 'hold') { input(s.lane); return; }
        if (a === 'practice') m.beginPractice();
        else if (a === 'practice-next') m.practiceNext();
        else if (a === 'start') { m.start(); lastTime = performance.now(); }
        else if (a === 'pause') m.pause();
        else if (a === 'resume') { m.resume(); lastTime = performance.now(); }
        else if (a === 'ask-assist') m.askAssist();
        else if (a === 'cancel-assist') m.cancelAssist();
        else if (a === 'assist') m.assist();
        else if (a === 'guide-next') m.guideNext();
        else if (a === 'finish') { const r = m.result(); if (validGame(r, kind)) { alive = false; resolve(r); return; } }
        render(true);
      }
      function key(e) {
        if (!alive || blocked() || !['practice', 'running', 'guided'].includes(s.phase)) return;
        if (e.repeat) { if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault(); return; }
        const map = { ArrowRight:0, ArrowDown:1, ArrowLeft:2, ArrowUp:3 };
        if (rhythm && map[e.key] !== undefined) { e.preventDefault(); input(map[e.key]); }
        else if (!rhythm) {
          let t = null;
          if (['1', '2', '3'].includes(e.key)) t = Number(e.key) - 1;
          else if (e.key === 'ArrowLeft') t = Math.max(0, s.lane - 1);
          else if (e.key === 'ArrowRight') t = Math.min(2, s.lane + 1);
          else if (e.key === ' ' && e.target.tagName !== 'BUTTON') t = s.lane;
          if (t !== null) { e.preventDefault(); input(t); }

      }
      function externalPause() { if (alive && m.pause()) { lastTime = null; render(false); } }
      function visibility() { if (document.hidden) externalPause(); }
      function leave(){externalPause();persist();GX.checkpoint();}window.addEventListener('pagehide',leave);
      const observer = new MutationObserver(() => { if (alive && blocked()) externalPause(); });
      body.addEventListener('click', click); document.addEventListener('keydown', key);
      window.addEventListener('blur', externalPause); document.addEventListener('visibilitychange', visibility);
      observer.observe(document.body, { childList:true, subtree:true });

  }
  // ═════════════════════════ 7. 結局與玩家本紀 ═════════════════════════
  const ENDINGS = {
    great: { id:'great', title:'霸王快戰', good:true, text:'此局辨歌有準，突圍令明；既讀快戰，亦察敗勢之由。' },
    good: { id:'good', title:'垓下悲歌', good:true, text:'此局操作有得失，親究其故，知勇力與時勢不可偏論。' },
    bad: { id:'bad', title:'迷失道', good:false, text:'此局初應有失，存其績而親復演之，遂知路與令之要。' }
  };
  function payload(s, ending) {
    const a = s.vars.chuge, b = s.vars.breakout;
    const deeds = [
      '項王壁垓下，兵少食盡，漢與諸侯圍之。', '夜聞四面楚歌，大驚而疑漢已盡得楚。',
      '悲歌慷慨，虞和之，左右皆泣。', a.ruleset==='t3' ? '此局分辨四面楚音與項王之疑，未以驚疑冒充楚地盡失的查證。' : a.assisted ? '此局初辨歌有失，存其績而逐拍親復演之。' : '此局辨四方之聲有準，親應其拍而成。',
      b.assisted ? '率八百餘騎夜出；此局初令未盡，逐段親核其道。' : '率八百餘騎夜出；此局親令諸道，知隊伍相維之要。',
      '渡淮能屬者百餘，至陰陵迷道，左行而陷澤。', '至東城有二十八騎，分隊約會，以快戰示其勇。',
      '至烏江，亭長勸渡；項王愧江東父兄，贈騅於亭長。', '其後遇故人呂馬童，項王遂死，史實之終不以此局改。',
      s.vars.comparison.score === 100 ? '此局既察勇力，復論責任，辨人物之言與史官之評。' : '此局讀史官之評，初論未盡，猶可據事而求其故。'

      bioTitle:'項羽本紀', bioOpening:'項籍者，下相人也，字羽。', ending,
      scoreStrategy:bounded((a.score/Math.max(1,a.max||100)*100 + b.score/Math.max(1,b.max||100)*100) / 2), scoreVirtue:bounded((s.vars.attribution.score + s.vars.crossing.score + s.vars.comparison.score) / 3),
      turns:s.steps || 1, durationSec:Math.min(5400, Math.max(0, Math.round((Date.now() - (s.startedAt || Date.now())) / 1000))),
      deeds, anchors:s.anchors, games:s.games, codex:s.codex,
      opener:'遊戲史官評語（自擬）：余讀垓下之事，察勇力之所能，亦思困局之所由與負責之道。',
      prompts:['項羽說天亡我，你如何區分外在條件與自己能檢討的決策？用本話一段事件作證。',
        '若面對亭長的船，你會如何權衡渡江、羞愧、餘眾與後續責任？與項羽的實際回話比較。',
        '史記敘事為何能讓人感受悲劇，同時太史公仍批評項羽？杜牧的未可知又提供哪種後世觀點？'] };
  }
  function onEnd(r, ctx) {

        { who:'shiguan', text:'以下為遊戲生成本紀。史實、後世詩作與自擬評語分別標示，不冒充司馬遷原句。' }]))

  // ═════════════════════════ 8. 開始（沿用官方範例） ═════════════════════════
  const saveState=GX.saveState;
