 function storyNodes(id,nodes,save,key='chapter-companion'){const c=CHAPTERS[id];if(!c?.node||!nodes[c.node])return nodes;return{...nodes,[c.node]:async ctx=>{const scope=scopeToken();if(enabled(id,ctx.state)){const r=await checkpoint(id,ctx.state,save,{checkpoint:key,nodeId:c.node,title:c.mission});if(r.modeChanged)return null;await ctx.say([{text:r.completed?'你的同行任務已完成，現在回到原篇人物與事件。':'同行任務已保存返回點；原篇照常接續，之後可從角色入口續玩。'}]);}return scope===scopeToken()?nodes[c.node](ctx):null;}};}
 function chuhanNodes(id,nodes,save){return storyNodes(id,nodes,save,'chuhan-companion');}
 function warringNodes(id,nodes,save){return storyNodes(id,nodes,save,'warring-companion');}
 function springNodes(id,nodes,save){return storyNodes(id,nodes,save,'spring-companion');}
 function zhuziStage(id,index){const c=CHAPTERS[id];return c?.engine==='zhuzi'&&c.stage===index?c:null;}
 function eligible(id){return !!CHAPTERS[id]&&(!ZH.isGuest()||(ZH.boot.guestScenarios||[]).includes(id));}
 function ensureCss(){if(cssReady)return;cssReady=true;const css=document.createElement('link');css.rel='stylesheet';css.href=ZH_STATIC_URL(assets.css);document.head.appendChild(css);}
 async function ensure(){ensureCss();if(app)return app;if(!loading)loading=import(ZH_STATIC_URL(assets.app)).then(m=>m.install({ZH})).then(a=>app=a).catch(e=>{loading=null;throw e;});return loading;}
 function announceCharacter(){if(typeof CustomEvent==='function'&&typeof document.dispatchEvent==='function')document.dispatchEvent(new CustomEvent('zh:character-open',{detail:{page:ZH.boot.page}}));}
 async function open(){announceCharacter();try{const a=await ensure();await a.open();}catch(e){ZH.toast('原創角色暫時無法開啟：'+e.message,'bad');}}
 async function playChapter(id,context={}){if(!eligible(id))throw Error('本篇尚未開放角色同行。');announceCharacter();const a=await ensure();if(!a.playChapter)throw Error('角色同行介面尚未更新，請重新載入後再試。');return a.playChapter(id,context);}
 function newChapterState(id){return{version:1,enabled:choices.has(id)?choices.get(id):true,checkpoints:{}};}
 function applyChapterChoice(id,state){if(!eligible(id)||!state)return state;const existing=state._ocChapter;state._ocChapter=existing||{version:1,enabled:false,checkpoints:{}};if(choices.has(id))state._ocChapter.enabled=choices.get(id);else if(ZH.boot.params?.character==='1')state._ocChapter.enabled=true;return state;}
 function scopeToken(){return String(ZH.user?.email||ZH.boot.user?.email||'guest')+':'+ZH.isGuest()+':'+!!ZH.teacherPreview?.active();}
 function enabled(id,state){return eligible(id)&&state?._ocChapter?.enabled===true;}
 function mountEntry(holder,id,saved,onChange){if(!holder||!eligible(id))return;ensureCss();const c=CHAPTERS[id],checked=ZH.boot.params?.character==='1'||(saved?saved._ocChapter?.enabled===true:true);choices.set(id,checked);holder.innerHTML='<section class="oc-chapter-entry"><div><span class="zh-chip zh-chip--patina">原創角色同行</span><h2>'+ZH.esc(c.mission)+'</h2><p>'+ZH.esc(c.detail)+'</p><p>接入位置：'+ZH.esc(c.point)+'。角色配裝、冒險成績與原篇首輪分開保存。</p></div><div class="oc-chapter-toggle"><label><input type="checkbox" data-character-mode'+(checked?' checked':'')+'>本局加入我的角色</label><button type="button" class="zh-btn zh-btn--quiet" data-character-config>設定配點與能力</button><small>'+(saved&&!saved._ocChapter?'舊局維持原玩法；勾選後才在指定情節加入角色。':'出發前可調整，續玩保留角色任務開局配裝。')+'</small></div></section>';holder.querySelector('[data-character-mode]').onchange=e=>{choices.set(id,e.target.checked);onChange?.(e.target.checked);};holder.querySelector('[data-character-config]').onclick=open;}
 async function checkpoint(id,state,save,context={}){
  if(!enabled(id,state))return{status:'disabled',completed:false,left:true,id};
  const scope=scopeToken(),before=copy(state._ocChapter),changed=()=>{if(scope===scopeToken())return null;state._ocChapter=copy(before);return{status:'left',completed:false,left:true,id,modeChanged:true};};
  const c=state._ocChapter,key=String(context.checkpoint||context.nodeId||'chapter');c.checkpoints=c.checkpoints||{};
  if(c.checkpoints[key]?.status==='completed'&&!context.retry)return{...copy(c.checkpoints[key]),completed:true,left:false,id,resumed:true};
  c.pending={checkpoint:key,nodeId:String(context.nodeId||state.node||''),title:String(context.title||CHAPTERS[id].mission)};try{await save();}catch(e){state._ocChapter=copy(before);throw e;}const afterSave=changed();if(afterSave)return afterSave;
  let r;try{r=await playChapter(id,{...context,checkpoint:key});}catch(e){ZH.toast('角色同行暫時無法開啟：'+e.message,'bad');r={status:'left',completed:false,left:true,id,error:e.message};}
  const afterPlay=changed();if(afterPlay)return afterPlay;
  // Only the chapter app's completed result advances the companion checkpoint.
  // Original anchors, games, first attempts and meters are never changed here.
  const status=r?.status==='completed'&&r.completed!==false?'completed':r?.status==='failed'?'failed':'left';
  const result={status,completed:status==='completed',left:status!=='completed',id,runId:String(r?.runId||''),at:Date.now()};
  if(Number.isFinite(r?.score))result.score=r.score;c.checkpoints[key]=result;delete c.pending;try{await save();}catch(e){state._ocChapter=copy(before);throw e;}const afterFinalSave=changed();if(afterFinalSave)return afterFinalSave;return{...r,...result};
 }

  if(ZH.boot.page==='profile'){const box=document.createElement('section');box.className='oc-profile-entry';box.innerHTML='<h2>入卷同行者 · 原創角色</h2><p>用上方完整造型出發，分配12點、裝備八項能力中的兩項，走進春秋十八話、戰國十三話、楚漢九話與先秦諸子十二篇的各式同行任務。</p><button type="button" class="zh-btn zh-btn--primary">設定配點與進入冒險</button>';box.querySelector('button').onclick=open;document.getElementById('profile-player')?.after(box);}
  if(['hub','profile'].includes(ZH.boot.page)&&ZH.boot.params?.character==='1')setTimeout(open,0);
 });
