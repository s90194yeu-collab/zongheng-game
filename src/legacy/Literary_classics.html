L.register('watchrelay',{

L.register('frost',{

 step(w,k,d){const v=direction(k),brake=!!k.guard;w.vx+=v.x*420*d;w.vy+=v.y*420*d;const f=Math.exp(-d*(brake?10:2.7));w.vx=C(w.vx*f,-175,175);w.vy=C(w.vy*f,-155,155);w.x=C(w.x+w.vx*d,60,w.index===2?2160:2240);w.y=C(w.y+w.vy*d+Math.sin(w.time*2)*w.index*3*d,150,495);const bay=w.shelters.findIndex(p=>near(w,p,65)),still=Math.hypot(w.vx,w.vy)<35;if(bay>=0&&still){if(w.restBay!==bay)w.restHold=0;w.restBay=bay;if(brake)w.restHold+=d;else if(w.restHold<1)w.restHold=0;}else{w.restHold=0;w.restBay=-1;}if(bay>=0&&brake&&still)w.heat=C(w.heat+d*18,0,100);else w.heat-=d*(2+w.index);if(Math.abs(w.y-snowRoad(w.x,w.index))>105){w.heat-=d*6;w.letter-=d*3;}if(w.heat<=0||w.letter<=40)w.hp=0;w.signal=Math.floor(w.time/2)%3;if(w.index<2&&w.x>2120&&w.rested.length>=2&&w.sealed)U.win(w,'已帶著乾燥薦書走過雪路；處境仍須逐段回讀。');},
