<style>
  .ck { display: block; width: 100%; height: auto; overflow: visible; }

  .sc-leaf { transform-box: fill-box; animation: sc-fall 8s steps(16) infinite; }

  .sc-smoke { animation: sc-rise 9s steps(36) infinite alternate; }
  .sc-bob { animation: sc-bob 4s steps(8) infinite; }
  .sc-rain { animation: sc-rain .5s steps(4) infinite; }
  .sc-snow { animation: sc-snow 9s steps(36) infinite; }

  .sc-fireflies circle { animation: sc-firefly 5s steps(10) infinite; }
  @keyframes ck-blink { 0% { transform: scaleY(1); } 94.4444% { transform: scaleY(.1); } }
  @keyframes ck-breathe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(1.6px); } }
  @keyframes ck-talk { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes sc-drift { from { transform: translateX(0); } to { transform: translateX(60px); } }
  @keyframes sc-sway { 0%, 100% { transform: rotate(-1.2deg); } 50% { transform: rotate(1.2deg); } }
  @keyframes sc-shimmer { 0%, 100% { opacity: .9; } 50% { opacity: .55; } }
  @keyframes sc-fall { 0% { transform: translate(0, 0) rotate(0); opacity: 0; } 50% { transform: translate(130px, 190px) rotate(270deg); opacity: 1; } 100% { transform: translate(260px, 380px) rotate(540deg); opacity: 0; } }
  @keyframes sc-fly { from { transform: translate(-200px, 20px); } to { transform: translate(900px, -60px); } }
  @keyframes sc-wave { 0%, 100% { transform: skewY(0deg) scaleX(1); } 50% { transform: skewY(-3deg) scaleX(.96); } }
  @keyframes sc-flicker { from { transform: scale(1, 1); opacity: 1; } to { transform: scale(.92, 1.08); opacity: .85; } }
  @keyframes sc-rise { from { transform: translateY(0); opacity: .9; } to { transform: translateY(-30px); opacity: .5; } }
  @keyframes sc-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
  @keyframes sc-rain { from { transform: translate(0, -60px); } to { transform: translate(-16px, 0); } }
  @keyframes sc-snow { from { transform: translate(0, -100px); } to { transform: translate(40px, 100px); } }
  @keyframes sc-ember { 0% { transform: translate(0, 0); opacity: 0; } 50% { transform: translate(20px, -210px); opacity: 1; } 100% { transform: translate(40px, -420px); opacity: 0; } }
  @keyframes sc-firefly { 0%, 100% { opacity: .1; transform: translate(0, 0); } 50% { opacity: 1; transform: translate(14px, -10px); } }
  /* 省電模式（html.zh-lite）：較慢的裝置自動開啟（ART.lite），只留眨眼與說話的嘴型 */
  .zh-lite .ck-breathe, .zh-lite .ck-dangle, .zh-lite .sc-cloud, .zh-lite .sc-sway, .zh-lite .sc-shimmer, .zh-lite .sc-twinkle, .zh-lite .sc-leaf,
  .zh-lite .sc-birds, .zh-lite .sc-wave, .zh-lite .sc-flicker, .zh-lite .sc-smoke, .zh-lite .sc-bob, .zh-lite .sc-rain, .zh-lite .sc-snow,

    .sc-smoke, .sc-bob, .sc-rain, .sc-snow, .sc-embers circle, .sc-fireflies circle, .is-talk .ck-m2, .is-talk .ck-m1 { animation: none !important; }

<script>
(function (global) {

  if (global.ART && global.ART.version) return;   // 已經載入過
  // ═══════════════════════════ 小工具 ═══════════════════════════

  const LINE = '#3b2620';
  let UID = 0;

  function hexRgb(hex) {
    let h = String(hex || '#888888').trim().replace('#', '');
    if (h.length === 3) h = h.split('').map(c => c + c).join('');
    const n = parseInt(h.slice(0, 6), 16);
    if (isNaN(n)) return [136, 136, 136];

  function rgbHex(r, g, b) {

  /** 變亮（amt > 0）或變暗（amt < 0），amt 介於 -1～1 */

  function toHsl(hex) {
    const c = hexRgb(hex).map(v => v / 255);
    const max = Math.max(c[0], c[1], c[2]), min = Math.min(c[0], c[1], c[2]);
    let h = 0, s = 0;
    const l = (max + min) / 2;
    if (max !== min) {
      const d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      if (max === c[0]) h = (c[1] - c[2]) / d + (c[1] < c[2] ? 6 : 0);
      else if (max === c[1]) h = (c[2] - c[0]) / d + 2;
      else h = (c[0] - c[1]) / d + 4;
      h /= 6;
    }
    return [h, s, l];
  }
  function fromHsl(h, s, l) {
    if (!s) return rgbHex(l * 255, l * 255, l * 255);
    const q = l < 0.5 ? l * (1 + s) : l + s - l * s;

    const f = t => {

  }
  /** 把任何顏色調成「衣袍」的深淺：亮度約 0.36～0.46，彩度不超過 0.55 */
  function robeTone(hex) {
    const c = toHsl(hex);
    return fromHsl(c[0], Math.min(c[1], 0.55), Math.max(0.3, Math.min(0.46, c[2] * 0.72)));
  }
  function hash(str) {
    let h = 2166136261;
    const s = String(str || '');
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;

  function mouth(kind) {

  // 依名字與頭銜猜外型（名冊裡沒有的人物）
  function autoSpec(c) {
    const name = String(c.name || ''), title = String(c.title || ''), t = name + '｜' + title;
    const h = hash(c.id || name);
    const sp = { hat: 'guan', beard: h % 3, jade: true };
    sp.robe = c.color ? robeTone(c.color) : STATE.民;
    const state = Object.keys(STATE).find(k => k.length === 1 && (title.indexOf(k + '國') > -1 || title.indexOf(k + '將') > -1 || title.indexOf(k + '大夫') > -1 || title.indexOf(k + '王') > -1));
    if (state && !c.color) sp.robe = STATE[state];
    if (/夫人|王后|太后|皇后|姬|妃|公主|女子|婦|妻|嫂|姊|妹|母(?!弟)|嫗/.test(t)) {
      sp.female = true; sp.hat = /后|夫人|妃|公主/.test(t) ? 'feng' : 'none'; sp.beard = 0;
    }
    if (/老|叟|翁|父老|亞父|太后|三老|長者/.test(t)) { sp.old = true; sp.beard = sp.female ? 0 : 3; }
    if (!sp.female) {
      if (/天子|皇帝|始皇/.test(t)) { sp.hat = 'mian'; sp.grand = true; sp.motif = true; }
      else if (/(王|公|侯|伯)$/.test(name) || /^.君$/.test(name) || /國君$/.test(title) || /(^|・)(.{1,2}王|.{1,2}侯|.{1,2}伯)$/.test(title)) sp.hat = 'mian';
      if (/將|帥|尉|校|武士|勇士|騎/.test(t)) { sp.hat = 'helmet'; sp.armor = true; sp.brow = 'thick'; sp.prop = 'sword'; }
      else if (/兵|卒|士卒|衛士|守衛|戍|哨|軍$/.test(t)) { sp.hat = 'kui'; sp.armor = true; sp.jade = false; sp.beard = h % 2; }
      else if (/農|漁|樵|夥計|屠|傭|野人|百姓|僕|御者|商|販|工|匠|卜|巫|門客|舍人|父老|鄉|里人|戍卒|徒/.test(t)) {
        sp.hat = /漁|樵/.test(t) ? 'li' : 'jin'; sp.jade = false; sp.skin = '#f3cfa6'; if (!c.color) sp.robe = STATE.民;
      }
      if (/史|博士|謀士|說客|師/.test(t) && sp.hat === 'guan') sp.prop = 'scroll';
    }
    if (/你/.test(title)) sp.beard = Math.min(sp.beard || 0, 1);
    return sp;
  }

  /** 某個劇本人物的外型：art 欄位 → 名冊（代碼、名字）→ 自動猜 */
  function specOf(c) {
    if (!c) return autoSpec({});
    const base = CAST[c.id] || CAST[c.name] || (c.name ? CAST[String(c.name).replace(/（.*?）|\(.*?\)/g, '')] : null) || autoSpec(c);
    const sp = Object.assign({}, base);
    const art = c.art || {};
    if (art.state && STATE[art.state]) { sp.robe = STATE[art.state]; if (TRIM[art.state]) sp.trim = TRIM[art.state]; }
    return Object.assign(sp, art);
  }

  function Kit(seed, key) {

  Kit.prototype.lin = function (stops, x1, y1, x2, y2) {

      stops.map((s, i) => '<stop offset="' + (Array.isArray(s) ? s[0] : i / Math.max(1, stops.length - 1)) + '" stop-color="' + (Array.isArray(s) ? s[1] : s) + '"' + (Array.isArray(s) && s[2] !== undefined ? ' stop-opacity="' + s[2] + '"' : '') + '/>').join('') + '</linearGradient>';

  /** 天空：漸層、星、日月、光暈、雲 */
  Kit.prototype.sky = function (T, opt) {

    const y1 = o.horizon || 760;
    let h = '<rect width="1600" height="' + (y1 + 40) + '" fill="' + this.lin([[0, T.sky[0]], [0.42, T.sky[1]], [0.72, T.sky[2]], [1, T.sky[3]]], 0, 0, 0, 1) + '"/>';
    if (T.stars) {
      h += '<g class="sc-twinkle">';
      for (let i = 0; i < 70 * T.stars; i++) h += '<circle cx="' + (r() * 1600).toFixed(0) + '" cy="' + (r() * (y1 * 0.5)).toFixed(0) + '" r="' + (0.8 + r() * 1.6).toFixed(1) + '" fill="#fff6dc" opacity="' + (0.3 + r() * 0.6).toFixed(2) + '"/>';

    }
    if (T.sun && !o.noSun) {
      const s = T.sun;
      h += this.glow(s[0], s[1], s[2] * 6, T.glow, 0.75) + '<circle cx="' + s[0] + '" cy="' + s[1] + '" r="' + s[2] + '" fill="' + T.glow + '"/>';

      h += this.glow(m[0], m[1], m[2] * 5, '#cfd8ff', 0.4) + '<circle cx="' + m[0] + '" cy="' + m[1] + '" r="' + m[2] + '" fill="#f6edc8"/>' +
        '<circle cx="' + (m[0] - 12) + '" cy="' + (m[1] - 8) + '" r="9" fill="#e6dab0" opacity=".6"/><circle cx="' + (m[0] + 14) + '" cy="' + (m[1] + 10) + '" r="6" fill="#e6dab0" opacity=".5"/>';
    }

  Kit.prototype.cloud = function (x, y, w, light, dark, cls) {

      base += '<ellipse cx="' + (x + b[0] * r).toFixed(0) + '" cy="' + (y + b[1] * r + r * 0.25).toFixed(0) + '" rx="' + (b[2] * r * 1.15).toFixed(0) + '" ry="' + (b[2] * r * 0.8).toFixed(0) + '"/>';

  Kit.prototype.ridge = function (y0, amp, step, fill, op) {

      const ny = y0 - r() * amp;
      d += ' Q' + ((x + nx) / 2).toFixed(0) + ' ' + (Math.min(y, ny) - amp * 0.35 * r()).toFixed(0) + ' ' + nx.toFixed(0) + ' ' + ny.toFixed(0);

    h += '<ellipse cx="800" cy="860" rx="300" ry="50" fill="#8a7a4a" opacity=".7"/>' + k.table(800, 860, 260, '#5a3a24');
    h += k.candle(520, 700, 110) + k.glow(520, 590, 180, '#ffcf6a', night ? 0.55 : 0.15);
    if (night) h += '<rect width="1600" height="1000" fill="#0a0e24" opacity=".4"/>' + k.glow(520, 590, 260, '#ffcf6a', 0.3);
    return h;
  }, { indoor: true });

  // ───────── 囚室 ─────────
  def('cell', 'night', (k, T, o) => {
    let h = '<rect width="1600" height="1000" fill="' + k.lin(['#2a2a30', '#1a1a20']) + '"/>';
    // 石牆
    let st = '<g stroke="#121216" stroke-width="4" fill="#33333b">';
    for (let row = 0; row < 9; row++) for (let c = 0; c < 9; c++) {
      const x = c * 200 - (row % 2) * 100, y = row * 74;
      st += '<rect x="' + x + '" y="' + y + '" width="196" height="70" rx="8" fill="' + ['#34343c', '#2e2e36', '#3a3a42'][(row + c) % 3] + '"/>';
    }
    h += st + '</g>';
    // 高窗＋月光
    h += '<rect x="720" y="150" width="160" height="110" fill="#1c2850"/><g stroke="#0e0e12" stroke-width="10"><path d="M760 150 V260 M800 150 V260 M840 150 V260"/></g>';
    h += '<path d="M720 260 L560 1000 H1080 L880 260 Z" fill="#bcd0ff" opacity=".1"/>';
    h += '<path d="M0 700 H1600 V1000 H0 Z" fill="' + k.lin(['#2a2620', '#141210']) + '"/>';
    // 稻草
    let straw = '<g stroke="#a08a4a" stroke-width="3" opacity=".7">';
    for (let i = 0; i < 70; i++) { const x = 980 + k.r() * 520, y = 820 + k.r() * 120; straw += '<path d="M' + x.toFixed(0) + ' ' + y.toFixed(0) + ' l' + ((k.r() - 0.5) * 50).toFixed(0) + ' ' + ((k.r() - 0.5) * 16).toFixed(0) + '"/>'; }
    h += straw + '</g><path d="M60 1000 V560 M140 1000 V560 M220 1000 V560 M300 1000 V560" stroke="#1a1a1e" stroke-width="18"/>';
    h += '<path d="M1460 700 v-60 h40 v60 Z" fill="#5a4a3a"/>';
    return h;
  }, { indoor: true });

  // ───────── 叢祠、宗廟外 ─────────
  def('shrine', 'night', (k, T, o) => {
    let h = k.sky(T) + k.ridge(620, 90, 140, T.mtn[1], 0.85);
    h += '<path d="M0 1000 V700 C400 680 1200 700 1600 690 V1000 Z" fill="' + k.lin(['#4a5a3a', '#1e2618']) + '"/>';
    // 林
    for (let i = 0; i < 8; i++) h += k.broad(80 + i * 210, 720 + (i % 2) * 10, 0.7 + (i % 3) * 0.1, ['#2a3a26', '#34462e', '#3f5436']);
    // 小祠
    h += '<rect x="660" y="560" width="280" height="170" fill="#8a7a62"/><rect x="740" y="610" width="120" height="120" fill="#2a1a12"/>' + k.roof(800, 566, 380, 90, '#3a3036');
    h += '<path d="M620 740 H980 L1000 770 H600 Z" fill="#a09070"/>';
    h += '<path d="M700 1000 C740 900 770 820 790 770 H830 C840 820 880 900 940 1000 Z" fill="#7a6a4a" opacity=".6"/>';
    h += k.tint(T, 420);
    h += k.glow(800, 660, 150, '#ffcf6a', 0.5) + k.lantern(720, 600) + k.lantern(880, 600);
    h += k.grass(0, 1600, 880, 1000, 60, ['#2a3a26', '#3a4a30'], 34);
    if (o.tod === 'night') h += k.weather('fireflies');
    return h;
  });

  // ───────── 樹林 ─────────
  def('forest', 'day', (k, T, o) => {
    let h = k.sky(T, { noSun: true }) + k.mist(400, 300, T.sky[3], 0.5);
    for (let i = 0; i < 12; i++) h += k.pine(i * 140 + 20 + (k.r() - 0.5) * 50, 660 + k.r() * 30, 0.5 + k.r() * 0.35, ['#5a7a70', '#6a8a7e', '#7a9a8c']);
    h += k.mist(480, 220, T.sky[3], 0.55);
    for (let i = 0; i < 9; i++) h += k.pine(i * 190 + 60 + (k.r() - 0.5) * 60, 700 + k.r() * 20, 0.7 + k.r() * 0.3, ['#3a5a48', '#4a6a56', '#5a7a64']);
    h += k.mist(520, 200, T.sky[3], 0.45);
    h += '<path d="M0 1000 V700 C400 680 1200 700 1600 690 V1000 Z" fill="' + k.lin(['#4a6034', '#26341c']) + '"/>';
    h += '<path d="M720 700 C700 800 640 900 560 1000 H1040 C960 900 900 800 880 700 Z" fill="#8a7450" opacity=".6"/>';
    h += k.pine(200, 980, 1.25) + k.pine(1400, 990, 1.3) + k.broad(420, 880, 0.9) + k.broad(1180, 870, 0.85);
    // 林間光束
    if (o.tod !== 'night') h += '<g fill="#fff6d0" opacity=".08"><path d="M600 0 L760 0 L560 1000 L380 1000 Z"/><path d="M980 0 L1080 0 L1000 1000 L860 1000 Z"/></g>';
    h += k.grass(0, 1600, 880, 1000, 70, ['#3f5a2e', '#5a7a3a'], 34);
    h += k.tint(T, 0);
    if (o.tod === 'night') h += k.weather('fireflies');
    return h;
  });

  // ───────── 雪 ─────────
  def('snow', 'day', (k, T, o) => {
    const T2 = Object.assign({}, T, { sky: o.tod === 'night' ? T.sky : ['#8a9aae', '#aab8c8', '#cdd6de', '#e6eaee'], sun: null, cloud: ['#e8ecf0', '#b8c2cc'] });
    let h = k.sky(T2) + k.ridge(600, 140, 160, '#c8d0da', 0.85) + k.ridge(640, 90, 120, '#aab4c0', 0.9);
    // 結冰的河
    h += '<path d="M0 690 H1600 V770 H0 Z" fill="' + k.lin(['#9ab0c4', '#7890a8']) + '"/><g stroke="#e8f0f8" stroke-width="2" opacity=".6"><path d="M100 720 h200 M500 740 h260 M1000 712 h180 M1300 750 h220"/></g>';
    h += '<path d="M0 1000 V770 C400 750 1200 780 1600 760 V1000 Z" fill="' + k.lin(['#f2f4f6', '#c8d0da']) + '"/>';
    h += k.bare(220, 860, 1.1, '#3a3038') + k.bare(1400, 850, 1.2, '#3a3038') + k.bare(1080, 760, 0.55, '#4a4048');
    h += '<path d="M180 640 q40 -10 80 0 M1360 620 q50 -12 90 0" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>';
    h += k.reeds(560, 760, 780, 70, 12);
    if (o.tod === 'night') h += '<rect width="1600" height="1000" fill="#0a1024" opacity=".45"/>';
    h += k.weather('snow');
    return h;
  }, { weather: 'snow' });

  // 別名
  const SCENE_ALIAS = { court: 'hall', throne: 'hall', gate: 'city', wall: 'night', interior: 'room', home: 'room', house: 'room', jail: 'cell', prison: 'cell', temple: 'shrine', school: 'academy', study: 'academy', farm: 'village', battle: 'battlefield', winter: 'snow', ferry: 'river', woods: 'forest' };

  const TOD_WORDS = [
    [/夜|晚上|入夜|夜半|深夜|三更|更深|月下|月夜/, 'night'],
    [/黃昏|傍晚|日暮|暮|夕|日落|薄暮/, 'dusk'],
    [/黎明|拂曉|清晨|晨|天亮|破曉|旦|早上|日出/, 'dawn'],
    [/正午|白天|日中|午|晌/, 'day']
  ];
  /** 從地點牌的時間文字猜時段：「夜」→ night、「黃昏」→ dusk…… */
  function guessTod(text) {
    const s = String(text || '');
    for (let i = 0; i < TOD_WORDS.length; i++) if (TOD_WORDS[i][0].test(s)) return TOD_WORDS[i][1];
    return '';
  }
  function guessWeather(text) {
    const s = String(text || '');
    if (/雨/.test(s)) return 'rain';
    if (/雪/.test(s)) return 'snow';
    if (/霧/.test(s)) return 'mist';
    return '';
  }

  const SCENE_CACHE = {};
  /**
   * 畫一個場景，回傳完整的 SVG 字串（1600×1000，貼齊底部）。
   * key：場景代碼；opt：{ tod: 'dawn'|'day'|'dusk'|'night', weather: 'rain'|'snow'|'mist'|'embers'|'fireflies'|'leaves'|'petals'|'none', banner: 旗色, glyph: 旗上的字, time: 地點牌時間（用來猜時段） }
   */
  function scene(key, opt) {
    const o = Object.assign({}, opt || {});
    const k0 = SCENE_ALIAS[key] || key;
    const d = SCENE_DEFS[k0];
    if (!d) return '';
    o.tod = ['dawn', 'day', 'dusk', 'night'].indexOf(o.tod) > -1 ? o.tod : (guessTod(o.time) || d.tod);
    if (d.indoor && o.tod !== 'night') o.tod = guessTod(o.time) === 'night' ? 'night' : o.tod;
    const wx = o.weather || guessWeather(o.time) || '';
    const ck = k0 + '|' + o.tod + '|' + wx + '|' + (o.banner || '') + '|' + (o.glyph || '') + '|' + (o.seed || '');
    if (SCENE_CACHE[ck]) return SCENE_CACHE[ck];
    const kit = new Kit((o.seed || 0) + hash(k0) % 9973, k0.slice(0, 3) + (++UID));
    const T = TOD[o.tod];
    let body = d.draw(kit, T, o);
    if (wx && wx !== 'none' && wx !== d.weather) body += kit.weather(wx);
    body += kit.vignette(d.indoor ? 0.62 : 0.5);
    const svg = '<svg class="sc" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><defs>' + kit.defs + '</defs>' + body + '</svg>';
    SCENE_CACHE[ck] = svg;
    return svg;
  }
  function hasScene(key) { return !!SCENE_DEFS[SCENE_ALIAS[key] || key]; }

  // ═══════════════════════════ 對外介面 ═══════════════════════════

  const PORTRAIT_CACHE = {};
  /** 畫劇本人物（有快取：同一人物、同一表情只畫一次） */
  function portrait(c, opt) {
    const o = opt || {};
    const key = (c && (c.id || c.name) || '?') + '|' + (o.expr || '') + '|' + (o.bust ? 1 : 0) + '|' + (c && c.art ? JSON.stringify(c.art) : '');
    if (!PORTRAIT_CACHE[key]) PORTRAIT_CACHE[key] = chibi(specOf(c), o);
    return PORTRAIT_CACHE[key];
  }

  // ───── 省電模式（v0.1.5） ─────
  // 在這台裝置上每 15 秒取樣 2 秒的畫面更新間隔；連續兩次中位數超過 34 毫秒（不到 30 幀），
  // 就在 <html> 加上 zh-lite（只留眨眼與說話嘴型），並記住七天。網址 ?lite=1 強制開、?lite=0 強制關（會記住）。
  const LITE_KEY = 'zh:lite';
  function setLite(on, how) {
    document.documentElement.classList.toggle('zh-lite', !!on);
    if (how) { try { global.localStorage.setItem(LITE_KEY, JSON.stringify({ on: !!on, t: Date.now(), forced: how === 'forced' })); } catch (err) { /* 不能存就算了 */ } }
  }
  function initLite() {
    let q = null, saved = null;
    // Apps Script 的網址參數由頁面放在 ZH_BOOT.params；本機測試時才看 location.search
    try { const bp = global.ZH_BOOT && global.ZH_BOOT.params; q = bp && bp.lite !== undefined ? String(bp.lite) : new URLSearchParams(global.location.search).get('lite'); } catch (err) { q = null; }
    if (q === '1' || q === '0') { setLite(q === '1', 'forced'); return; }
    try { saved = JSON.parse(global.localStorage.getItem(LITE_KEY) || 'null'); } catch (err) { saved = null; }
    if (saved && (saved.forced || (saved.on && Date.now() - saved.t < 7 * 864e5))) { setLite(saved.on); return; }
    let slow = 0, tries = 0;
    const sample = () => {
      if (document.documentElement.classList.contains('zh-lite') || tries > 40) return;
      if (document.hidden || !document.querySelector('.sc, .ck')) { setTimeout(sample, 15000); return; }   // 沒有動畫就不用量
      tries += 1;
      const t = [];
      const t0 = global.performance.now();
      const loop = now => {
        t.push(now);
        if (now - t0 < 2000) { global.requestAnimationFrame(loop); return; }
        if (!document.hidden && t.length > 5) {
          const g = [];
          for (let i = 1; i < t.length; i++) g.push(t[i] - t[i - 1]);
          g.sort((a, b) => a - b);
          slow = g[Math.floor(g.length / 2)] > 34 ? slow + 1 : 0;
          if (slow >= 2) { setLite(true, 'auto'); return; }
        }
        setTimeout(sample, slow ? 1500 : 15000);
      };
      global.requestAnimationFrame(loop);
    };
    setTimeout(sample, 2500);
  }
  // ───── 動畫對齊同一個節拍（v0.1.5） ─────
  // CSS 動畫各自從「元素放進畫面的那一刻」起算；把 ART 的動畫開始時間對齊到 0.25 秒的格子，
  // 全頁的眨眼、呼吸、雲、火光就會在同一格一起換，瀏覽器每秒只要畫 4 次。
  const BEAT = 250;
  let syncQueued = false;
  function syncAnims() {
    syncQueued = false;
    if (!document.getAnimations) return;
    document.getAnimations().forEach(a => {
      if (a._zs || !a.animationName || !/^(ck|sc)-/.test(a.animationName)) return;
      const st = a.startTime;
      if (st === null || st === undefined) return;   // 還沒開始：下一格再對
      a._zs = 1;
      try { a.startTime = Math.floor(st / BEAT) * BEAT; } catch (err) { /* 舊瀏覽器不能改就算了 */ }
    });
  }
  function queueSync() {
    if (syncQueued) return;
    syncQueued = true;
    // 等兩格：新放進的動畫要到下一次繪製才有開始時間
    global.requestAnimationFrame(() => global.requestAnimationFrame(syncAnims));
  }
  function initSync() {
    if (!global.MutationObserver || !document.getAnimations) return;
    new MutationObserver(list => {
      for (const m of list) {
        if (m.type === 'attributes') { queueSync(); return; }
        for (const n of m.addedNodes) {
          if (n.nodeType === 1 && (n.matches('svg.ck, svg.sc') || n.querySelector('svg.ck, svg.sc'))) { queueSync(); return; }
        }
      }
    }).observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });
    queueSync();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => { initLite(); initSync(); }); else { initLite(); initSync(); }

  global.ART = {
    version: 'v0.1.5',
    lite: on => setLite(on, 'forced'),
    chibi: chibi,
    portrait: portrait,
    specOf: specOf,
    scene: scene,
    hasScene: hasScene,
    sceneKeys: Object.keys(SCENE_DEFS),
    guessTod: guessTod,
    EXPRS: EXPRS,
    STATE: STATE,
    CAST: CAST,
    shade: shade,
    mix: mix,
    robeTone: robeTone
  };
})(window);
</script>
