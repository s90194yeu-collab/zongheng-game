    document.body.append(wrap);  wrap.querySelector('button').focus();
    wrap.addEventListener('keydown', e => {
      if (e.key !== 'Tab') return;
      const bs = [...wrap.querySelectorAll('button:not([hidden]):not(:disabled)')];
      if (e.shiftKey && document.activeElement === bs[0]) { e.preventDefault(); bs.at(-1).focus(); }
      else if (!e.shiftKey && document.activeElement === bs.at(-1)) { e.preventDefault(); bs[0].focus(); }
    });
    function complete() {
      finished = true; rec.completed = true; first[a.id] = rec; DZ.checkpoint();
      wrap.remove();  if (previous?.isConnected) previous.focus({preventScroll:true}); resolve(clone(rec));
    }
    function showRead() {
      reading = true; const fb = wrap.querySelector('.hm-feedback'); fb.hidden = false; fb.textContent = a.explanation;
      wrap.querySelectorAll('[data-answer]').forEach(x => { x.disabled = true; });

    }

      const b = e.target.closest('button'); if (!b || b.disabled || finished) return;
      if (b.hasAttribute('data-read-done') && reading) { complete(); return; }
      if (!b.dataset.answer || reading) return;
      const answer = b.dataset.answer, correct = answer === a.answer, seconds = Math.round((performance.now() - shownAt) / 100) / 10;
      if (!rec) rec = { anchorId: a.id, choice: answer, correct, seconds, attempts: 0, completed: false };
      rec.attempts++; rec.path = correct ? (rec.attempts === 1 ? 'direct' : 'fork') : rec.attempts === 1 ? 'fork' : 'fail';
      const op = a.options.find(o => o.key === answer);
      ZH.track('anchor', { scenarioId: SID, anchorId: a.id, attempt: rec.attempts, choice: answer, correct, firstTry: rec.attempts === 1, path: rec.path, distractorType: correct ? '' : op.type || '', seconds });
      if (correct) { rec.finalAnswer = answer; showRead(); }

    document.querySelector('#dz-still').addEventListener('change', e => { write('still', e.target.checked); document.documentElement.classList.toggle('hm-still', e.target.checked); });
  };

      const actual={people:s.m.people-before.people,grain:s.m.grain-before.grain,star:s.m.star-before.star};
      s.actions.push({city:c.name,event:e.title,action:id,ok,appropriate:id===e.best});s.reports.push(c.name+'：'+(ok?e.ok:e.bad)+aidText+desertText+' '+deltaText(actual)+'。');s.phase='report';g.sfx('click');g.combo(s.actions.length);draw();}
    function next(){if(stopped||blocked()||s.phase==='choice')return;if(s.phase==='finish'){stopped=true;s.done=true;save();resolve({completed:true,passed:points()>=7,score:points(),max:10,meters:Object.assign({},s.m),quality:s.quality,deserted:s.deserted,aid:s.aid,actions:s.actions,reports:s.reports});return;}if(s.index===6)s.phase='finish';else{s.index++;s.phase='choice';}draw();}
    listen(root,'click',e=>{const b=e.target.closest('[data-march]');if(!b||b.disabled)return;if(b.dataset.march==='next')next();else act(b.dataset.march);},g);
    listen(document,'keydown',e=>{if(e.repeat||blocked())return;if(s.phase==='choice'&&/^[123]$/.test(e.key)){e.preventDefault();act(choices[Number(e.key)-1].id);}},g);
    g.onCleanup(()=>{stopped=true;});draw();
  });}

  // ═════════════════════════ 7. 結局與結算 ═════════════════════════
  const ENDINGS = {
    great: { id: 'great', title: '首事之功', good: true, text: '涉雖身死，首事之功猶存。此局聲勢既振，人心尚聚。' },
    good: { id: 'good', title: '揭竿而起', good: true, text: '涉起大澤，入陳為王。此局行軍有得有失，聚眾之後，治理尤難。' },
    bad: { id: 'bad', title: '無親陳王', good: false, text: '諸故人引去，諸將不親附。此局人心離散，宜察用人與分配之失。' }
  };
  function onEnd(result, ctx) {
    const s = ctx.state;
    const e = ENDINGS[(result && result.key) || 'good'] || ENDINGS.good;
    ZH.sfx('seal');
    return ctx.banner(e.title, '大澤鄉・終')
      .then(() => ctx.say([{ who: 'shiguan', expr: 'normal', text: '陳勝的史實下場相同；結局評語呈現你的本局安排。' }, { text: '結算中的自擬文言為遊戲生成小傳與史官評語。' }]))
      .then(() => DZ.finish(payload(s, e)));
  }
  function payload(s, ending) {
    const f = s.flags || {}, v = s.vars || {};
    const prep = [v.prep0, v.prep1, v.prep2].filter(Boolean);
    const prepQuality = prep.reduce((sum, p) => sum + p.quality, 0) / 6;
    const marchQuality = v.march ? v.march.quality / 14 : 0;
    const foxScore = v.fox ? v.fox.score / (v.fox.max || 100) : 0;
    const policy = [f.rain === 'share', f.fish === 'care', f.marchRule === 'discipline', f.kingPolicy === 'relief' || f.kingPolicy === 'delegate', f.friendWelcome === 'welcome', f.lastSupply === 'listen'].filter(Boolean).length / 6;
    const deeds = ['少與人傭耕，志不安於阡陌。', '會雨失期，與吳廣謀起事。', '借扶蘇、項燕之名，以號其眾。'];
    deeds.push(prepQuality >= 0.75 ? '此局聽眾之難，分糧而相扶。' : '此局急於集眾，眾心有聚有離。');
    deeds.push(v.fox && (v.fox.assisted || v.fox.slowed) ? '此局得輔助，猶親指吳廣以成夜鳴。' : '此局察巡燈，指吳廣以成夜鳴。');
    deeds.push('丹書置魚腹，既而號令徒屬，稱大楚。');
    deeds.push(v.march && v.march.deserted ? '此局行軍至陳，途中亦有離散者。' : '此局整隊籌糧，行軍至陳。');
    deeds.push('至陳立為王，號為張楚。');
    deeds.push(f.friendWelcome === 'welcome' ? '此局念傭耕之約，親迎故人；史書終載故人引去。' : '此局重宮門之儀；史書終載故人引去。');
    deeds.push('陳王既敗，其御莊賈殺以降秦，而首事之功不泯。');
    return {
      scenarioId: SID, mode: MODE, faction: '楚', role: '陳勝', roleKind: 'shijia', country: '楚',
      bioTitle: '陳涉世家', bioOpening: '陳勝者，陽城人也，字涉。', ending: ending,
      scoreStrategy: bounded(prepQuality * 25 + marchQuality * 50 + foxScore * 25),
      scoreVirtue: bounded(prepQuality * 40 + policy * 60),
      turns: s.steps || 1,
      durationSec: Math.min(5400, Math.max(0, Math.round((Date.now() - (s.startedAt || Date.now())) / 1000))),
      deeds: deeds, anchors: s.anchors, games: s.games, codex: s.codex,
      opener: '遊戲生成史官評語：余讀〈陳涉世家〉，至「王侯將相寧有種乎」，壯其首事，亦察其失眾之由。',
      prompts: [
        '陳勝能號召起義，為何後來仍失敗？請用本局一次安排的回報與一處原文說明。',
        '「王侯將相寧有種乎」對今天的身分與機會有何意義？取得位置後還要承擔什麼責任？',
        '魚腹丹書、篝火狐鳴與現代假訊息有何相似？聚眾成功可能對信任造成什麼代價？'
      ]
    };
  }

  // ═════════════════════════ 8. 開始（沿用官方範例） ═════════════════════════

  const saveState = DZ.saveState;

  function startGame(saved) {
    if(saved)DZ.useState(saved);else DZ.newRun();
    document.documentElement.classList.toggle('hm-still',DZ.read('still',false));
    ROOT.innerHTML = '';
    const game = ZH.story.create(ROOT, {
      id: SID, mode: MODE, title: META.name, subtitle: META.episode,
      seed: Number(params.seed) || 0, start: 'n_01',
      characters: CHARACTERS, meters: METERS, nodes: ZH.character?.chuhanNodes(SID,NODES,()=>game.save())||NODES, help: HELP,
      initState:()=>({_ocChapter:ZH.character?.newChapterState(SID)}),
      anchorTotal: ANCHOR_ORDER.length, anchorOrder: ANCHOR_ORDER,
      onEnd: onEnd, save: saveState, snapshot:DZ.snapshot, anchorRunner:DZ.runAnchor, onProgress:DZ.cacheProgress, actions:[{label:"史冊",run:DZ.book},{label:"存檔",run:DZ.saveMenu}]
    });
    window.__ep = game;
    game.start(saved?ZH.character?.applyChapterChoice(SID,saved)||saved:null);
  }

  function renderTitle(saved) {
    const vol = ZH.VOLUMES.find(v => v.key === META.vol) || { no: '', name: '' };
    const st = saved && saved.engine;
    const btn = (a, label, primary) => '<button type="button" class="zh-btn ' + (primary ? 'zh-btn--primary' : 'zh-btn--quiet') + ' zh-btn--block" data-a="' + a + '">' + esc(label) + '</button>';
    ROOT.innerHTML =
      '<div class="ep-title" style="--ep-color:' + esc(ROLE.color) + '">' +
      '<div class="ep-title__bar"><a class="zh-mark" href="#" data-a="home"><span class="zh-mark__re">Re:</span><span class="zh-mark__name">縱橫鼎業</span></a>' +
      '<button type="button" class="zh-btn zh-btn--quiet zh-btn--sm" data-a="home">回首頁</button></div>' +
      '<main class="ep-title__main"><header>' +
      '<p class="ep-kicker">' + esc([vol.no + ' ' + vol.name, ZH.episodeLabel(META), '前 ' + META.year + ' 年'].join('・')) + '</p>' +
      '<h1 class="ep-h1">' + esc(META.name) + '</h1>' +
      '<p class="ep-episode">' + esc(META.episode) + '</p>' +
      '<div class="ep-chips">' + (META.guest ? '<span class="zh-chip zh-chip--gilt">訪客開放</span>' : '') +
      '<span class="zh-chip zh-chip--patina">' + esc(META.genre) + '</span>' +
      '<span class="zh-chip">自動存檔</span></div>' +
      (ZH.isGuest() ? '<p class="ep-note" style="margin-top:12px">你目前是訪客：可以完整遊玩，但進度只保存在這個分頁，也不會留下成績。</p>' : '') +
      '</header><section class="dz-title-scene" aria-label="大澤鄉雨營與本話人物">'+ART.scene('camp',{tod:'dusk',weather:'rain',banner:'#586270',glyph:'秦'})+'<div class="dz-title-cast">'+['chensheng','wuguang','soldier'].map(id=>'<span>'+ART.portrait(CHARACTERS.find(c=>c.id===id),{expr:id==='soldier'?'worried':'serious'})+'</span>').join('')+'</div></section>' +
      '<section class="ep-start"><span class="ep-seal" aria-hidden="true">' + esc(ROLE.glyph) + '</span>' +
      '<div><h2 class="ep-start__name">' + esc(ROLE.name) + '・' + esc(ROLE.title) + '</h2><p class="ep-start__lead">' + esc(ROLE.lead) + '</p></div>' +
      '<div class="ep-start__act">' + (st ? btn('continue', st.ended ? '查看結局' : '繼續', true) + btn('new', '重新開始', false) : btn('new', '開始遊戲', true)) + '</div></section>' +
      '<section class="ep-points" aria-label="本話重點">' + POINTS.map(p => '<div class="ep-point"><b>' + esc(p.title) + '</b><span>' + esc(p.text) + '</span></div>').join('') + '</section>' +
      '<p class="ep-note">本話共 ' + ANCHOR_ORDER.length + ' 個史實錨點。中途離開會自動存檔。</p>' +
      '</main></div>';
    const characterEntry=document.createElement('div');characterEntry.setAttribute('data-character-entry','');ROOT.querySelector('.ep-start').after(characterEntry);ZH.character?.mountEntry(characterEntry,SID,st);
    ROOT.querySelectorAll('[data-a="home"]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); ZH.go('hub'); }));
    const cont = ROOT.querySelector('[data-a="continue"]');
    if (cont) cont.addEventListener('click', () => { ZH.sfx('click'); startGame(st); });
    ROOT.querySelector('[data-a="new"]').addEventListener('click', () => {
      ZH.sfx('click');
      if (!st) { startGame(null); return; }
      ZH.modal({
        title: '重新開始？', body: '<p>目前的進度會清除，從頭開始。</p>',
        actions: [{ label: '取消', value: false, kind: 'quiet' }, { label: '重新開始', value: true, kind: 'primary' }]
      }).then(ok => { if (ok) ZH.deleteSave(SID, MODE).catch(() => null).then(() => startGame(null)); });
    });
  }

  const loadSave = DZ.loadState;

  function showCoreMessage(){ROOT.innerHTML='<main class="ep-title__main"><h1>共用核心待更新</h1><p>請先安裝 Eng_Story v0.2.2、Arena_js 與 Art_kit，再開啟第二話。</p><button class="zh-btn zh-btn--primary" data-core-home>回首頁</button></main>';ROOT.querySelector('[data-core-home]').onclick=()=>ZH.go('hub');}
  ZH.ready(() => {
    if(!ZH.story?.createJournal||!ZH.arena||!window.ART){showCoreMessage();return;}
    ZH.loading(true, '展開竹簡');
    ZH.codex.init();
    Promise.all([loadSave(), anchorsReady]).then(([saved]) => {
      ZH.loading(false);
      // 從首頁「繼續遊戲」帶著模式進來：直接接續
      if (String(params.mode || '') === MODE && saved) { startGame(saved.engine); return; }
      renderTitle(saved);
    });
  });
})();

</script>
<script>ZH.ready(function(){ZH.textplay?.install("S_ch02_dazexiang",null);});</script>
