function play(kind){return(body,g)=>new Promise(resolve=>{
 const model=M[kind](g.getProgress()?.model,g.rng),s=model.s;let alive=true,raf=0,last=performance.now(),lastFrame=last,lastUi=last,bucket=Math.floor(s.elapsed/5),ui={};
 const race=g.race?g.race({me:{talent:'六職任事',care:'照養配送',rules:'制度安置'}[kind],rival:'核定時限',goal:kind==='care'?'三期親配糧與力，再核公共原則':'六次親做，保留原文與查核'}):{me(){},rival(){}};
 const persist=()=>g.setProgress({model:model.snapshot()}),active=()=>!pause()&&!s.paused;
 function clock(){if(ui.index)ui.index.textContent=(kind==='care'?'照養 ':'核定 ')+Math.min(kind==='care'?3:6,s.cursor+1)+'／'+(kind==='care'?3:6);if(ui.clock)ui.clock.textContent=s.paused?'已暫停':s.assisted?'原分保留・不限時':['plan','event'].includes(s.phase)?'閱讀・停表':['done','failed'].includes(s.phase)?'本次結束':'剩 '+Math.ceil(s.left)+'秒';if(ui.note)ui.note.textContent=s.note;const r=model.race();race.me(r.me);race.rival(r.rival);}
 function selected(attr){const val=s[attr];body.querySelectorAll('[data-'+attr+']').forEach(b=>{const picked=b.getAttribute('data-'+attr)===val;b.classList.toggle('is-picked',picked);b.setAttribute('aria-pressed',String(picked));});const commit=body.querySelector('[data-commit]'),seal=body.querySelector('[data-seal]');if(commit&&kind==='talent')commit.disabled=!s.person||!s.proof;if(commit&&kind==='rules')commit.disabled=!s.board||!s.clause;if(seal)seal.disabled=kind==='talent'?!s.basis:kind==='care'?!s.goods||!s.labor:!s.law||!s.bound;clock();persist();}
 function units(){const q=model.current();for(const t of ['grain','work']){body.querySelector('[data-pool="'+t+'"]').textContent=(t==='grain'?'可用糧 ':'可用力 ')+(q[t]-model.used(t))+'／'+q[t]+(t==='work'?'（留一份待命）':'');}body.querySelectorAll('[data-have]').forEach(n=>{const [k,t]=n.dataset.have.split(','),v=s.alloc[k][t];n.textContent=v;n.setAttribute('aria-label','已配 '+v);n.closest('.dt-unit').classList.toggle('dt-hint',s.assisted&&v!==q.needs[k][t]);});body.querySelectorAll('[data-unit]').forEach(b=>{const [k,t,d]=b.dataset.unit.split(',');b.disabled=Number(d)<0?s.alloc[k][t]===0:model.used(t)>=q[t];});clock();persist();}

 const click=async e=>{if(!alive||pause())return;const b=e.target.closest('button');if(!b||b.disabled)return;if(b.hasAttribute('data-pause')){s.paused=!s.paused;last=performance.now();paint();return;}if(s.paused)return;

 if(b.dataset.unit){const [k,t,d]=b.dataset.unit.split(',');if(model.unit(k,t,Number(d)))g.sfx('click');units();return;}
 for(const n of ['person','proof','basis','goods','labor','board','clause','law','bound','commit','seal','next','begin'])if(b.hasAttribute('data-'+n)){if(model[n](b.getAttribute('data-'+n)))g.sfx('click');if(['commit','seal','next','begin'].includes(n))paint();else selected(n);return;}};

 });}

n_11:async ctx=>{await scene(ctx,'field','武城・貨與力','教學推演',['yanyan','clerk']);await ctx.say([{who:'kongzi',expr:'serious',text:'貨惡其棄於地也，不必藏於己；力惡其不出於身也，不必為己。'},{who:'clerk',expr:'serious',text:'糧堆在庫房不代表已送達。有人有時間、有能力，也不代表病者已有照護。糧和力要分開核配。'},{who:'yanyan',expr:'serious',text:'不浪費，不只為自己。公共儲備可以為下一次需要留下，不能把不必藏己讀成要倒掉所有糧。'}]);await ctx.anchor('dt_06');return 'n_12';},
n_12:async ctx=>{await scene(ctx,'room','武城・照養簿','三期需求・教學數量',['yanyan','carer','clerk']);await ctx.say([{who:'carer',expr:'serious',text:'三戶是無子長者、失養幼者、病中里人。需求欄已寫明糧與人力；雨後繞道、教養接續會使人力需求變化。'},{who:'clerk',expr:'serious',text:'每期按已知需求配送，不多配；另留一份待命人力。這個數量用來讓你操作，不是古代武城實際稅率。'},{who:'yanyan',expr:'normal',text:'我親自加減每份糧與力，送出後再讀三戶是否真的收到。不能只按一個善心按鈕就結束。'}]);return 'n_13';},
n_13:async ctx=>{const v=await choice(ctx,'scope',{title:'一位病者不能出工，你是否仍將他列入照養簿？',text:'本題評照養責任，與操作速度分開。',options:[{label:'仍受照養，按需要安排糧與照護；公共人力由有能力者互助承擔。',value:'include'},{label:'沒有同額出工就刪掉，他的糧改供親族。',value:'exclude'}]});ctx.add('heart',v==='include'?20:0);await ctx.say([{who:'carer',expr:'serious',text:'皆有所養包含廢疾者。即使第一次判斷偏了，配置時仍要親自把被漏掉的需求補回，首次選擇也會保留。'}]);return 'n_14';},
n_14:async ctx=>{const r=await challenge(ctx,'dt_care','care','皆有所養・三期照養','親配三期各戶糧與力、保留待命人力，親配送讀報，核公共原則並公布。');ctx.add('crown',firstScore(r)*4);setMeter(ctx,'shield',firstScore(r)*10);ctx.unlock('treasure:cq16_gongbu');return 'n_15';},
n_15:async ctx=>{await scene(ctx,'night','武城・門戶與信任','教學回看・非成就證明',['yanyan','elder']);await ctx.say([{who:'kongzi',expr:'serious',text:'是故謀閉而不興，盜竊亂賊而不作，故外戶而不閉，是謂「大同」。'},{who:'elder',expr:'serious',text:'夜景只幫你回看。還須問各戶的需要是否持續被看見、互助是否履約，不能因畫面門開了就宣布理想已實現。'},{text:'外戶不閉在文本中是前述秩序的結果，不是先拆門鎖就能換來的一項捷徑。'}]);await ctx.anchor('dt_07');ctx.unlock('idiom:yebubihu');return 'n_16';},
n_16:async ctx=>{await scene(ctx,'city','魯・公與家的另一段','課文轉折',['kongzi','yanyan']);await ctx.chapter('第三幕　大道既隱，禮仍何用','由大同轉入小康');await ctx.say([{who:'kongzi',expr:'serious',text:'今大道既隱，天下為家，各親其親，各子其子。貨力為己，大人世及以為禮。'},{who:'yanyan',expr:'worried',text:'天下成了一家所有，貨力多為自家。有位者承位，也按世及而行。那麼，禮是否就毫無作用了？'},{text:'先讀家、公與世及的變化，再看禮如何作紀。小康不是今日收入調查的標籤。'}]);await ctx.anchor('dt_08');return 'n_17';},
n_17:async ctx=>{await ctx.say([{who:'kongzi',expr:'serious',text:'城郭溝池以為固，禮義以為紀。'},{who:'yanyan',expr:'serious',text:'城郭能抵擋外來侵擾，卻不能替君臣立下責任；禮義作紀，又不只是一場祭典的外觀。'},{text:'固是防固，紀是綱紀。物理的屏障與關係中的規範，要分開讀。'}]);await ctx.anchor('dt_09');return 'n_18';},
n_18:async ctx=>{await scene(ctx,'hall','魯・禮的實務','人倫、制度、田里',['kongzi','yanyan']);await ctx.say([{who:'kongzi',expr:'serious',text:'以正君臣，以篤父子，以睦兄弟，以和夫婦，以設制度，以立田里，以賢勇知，以功為己。'},{who:'yanyan',expr:'serious',text:'人倫要有責任，制度與田里也要安排。文中仍有推重勇智與功為己的現實，不能把兩段讀成同一套。'},{text:'田里涉及田地、里居安排；以字連用，讓禮的作用展開到實務。'}]);await ctx.anchor('dt_10');return 'n_19';},
n_19:async ctx=>{await ctx.say([{who:'kongzi',expr:'serious',text:'故謀用是作，而兵由此起。'},{who:'yanyan',expr:'worried',text:'有家的私利與事功競爭，可能生謀與兵。可是因此更要問禮怎麼規範，不能直接說所有制度都沒用。'},{text:'本話不以兵爭作操作，改以制度位置、公共範圍和在位者的責任來看這段轉折。'}]);await ctx.anchor('dt_11');return 'n_20';},
n_20:async ctx=>{await scene(ctx,'school','武城・公家制度雙圖','文本比較・教學推演',['yanyan','clerk']);await ctx.say([{who:'clerk',expr:'serious',text:'甲圖大同、乙圖小康。逐項安置天下歸屬、權位承接、照養範圍、貨力方向、門戶、禮的綱紀，再選對應原文。'},{who:'yanyan',expr:'normal',text:'不能只因小康有城郭，就把禮義刪掉；也不能只因大同有開門，就忘了前面的任人與照養。'},{text:'最後還須你親判有位者責任與推演界限，再公布雙圖。提示只標適合位置，不代安置。'}]);return 'n_21';},
n_21:async ctx=>{const r=await challenge(ctx,'wen_dt_rules','rules','公家雙圖・制度與責任','親安六項制度、選原文、讀回報；核在位者責任與推演界限後親公布。');ctx.add('crown',firstScore(r)*3);ctx.unlock('treasure:cq16_shuangtu');return 'n_22';},
n_22:async ctx=>{await scene(ctx,'hall','魯・回看六君子','歷代意象・不是同時任事',['kongzi','yanyan','zhougong']);await ctx.say([{who:'kongzi',expr:'serious',text:'禹、湯、文、武、成王、周公，由此其選也。此六君子者，未有不謹於禮者也。'},{text:'周公圖像在此作文本回看。這六人不是同時代、也不是言偃的武城候選人。'},{who:'yanyan',expr:'serious',text:'大道既隱之後，仍有謹禮者。講小康不能只看不足，也得看怎樣用禮守住秩序。'}]);await ctx.anchor('dt_12');ctx.unlock('person:cq_zhougong');return 'n_23';},
n_23:async ctx=>{await scene(ctx,'hall','魯・有位者也須受規範','親核制度責任',['kongzi','yanyan']);await ctx.say([{who:'kongzi',expr:'serious',text:'以著其義，以考其信，著有過，刑仁講讓，示民有常。'},{text:'原文續說不由此者，在埶者去，眾以為殃。刑通型，是以仁為典型、效法仁；不是處罰仁者。'},{who:'yanyan',expr:'serious',text:'常法若只用來要求別人，卻讓有位者永遠例外，禮就不能成為共同的綱紀。'}]);await ctx.anchor('dt_13');if(firstGood(ctx,'dt_13'))ctx.add('heart',20);const v=await choice(ctx,'accountability',{title:'回到你推演的六職任事，誰須受查核？',text:'此選擇評在位者責任，手速不影響德行。',options:[{label:'包括我與親族，查核實績、明示有過、改正失約，仍以仁與讓作示範。',value:'all'},{label:'只查其他里人，我和親族有位便可永遠例外。',value:'exempt'}]});ctx.add('heart',v==='all'?20:0);return 'n_24';},
n_24:async ctx=>{await scene(ctx,'school','武城・弦歌的另一則記載','《論語》對讀・未定同日',['kongzi','yanyan']);await ctx.chapter('第四幕　小邑與大道','實踐有志，證據有界');await ctx.say([{text:'《論語》記孔子到武城，聞弦歌之聲，笑說割雞焉用牛刀。言偃引用老師的學道之說作答。此幕不是把兩篇問答定為同日。'},{who:'yanyan',expr:'serious',text:'君子學道則愛人，小人學道則易使也。'},{who:'kongzi',expr:'happy',text:'二三子！偃之言是也，前言戲之耳！'},{text:'孔子肯定子游的說法，澄清前面的戲語；原文沒有宣布武城已經成為大同。'}]);await ctx.anchor('dt_14');return 'n_25';},
n_25:async ctx=>{await scene(ctx,'garden','武城・把推演留在證據的位置','你・言偃',['yanyan','shiguan']);const v=await choice(ctx,'boundary',{title:'三項推演完成，你願怎樣記錄成果？',text:'遊戲成績、原文主張與歷史證據要分清。',options:[{label:'記下首次任命、照養與制度判斷，問如何持續；不以高分證明歷史已實現大同。',value:'qualified'},{label:'只要最佳分漂亮，就宣稱孔子親見、武城已完全達成大同。',value:'overclaim'}]});ctx.add('heart',v==='qualified'?20:0);await ctx.say([{who:'shiguan',expr:'serious',text:'推演把原則變成你要承擔的操作；證據界限讓操作不變成虛造史實。親做與謹慎，兩者都要。'}]);ctx.unlock('text:liyun');return 'n_26';},
n_26:async ctx=>{await scene(ctx,'room','武城・首次操作筆記','反思不另計分',['yanyan','clerk']);const v=await choice(ctx,'reflection',{title:'你先從哪次首次操作寫起？',text:'選一條線索，到結算以一句原文與一次首次判斷完成反思。',options:[{label:'選人與實績：親近為何不能取代選賢與能？',value:'talent'},{label:'一份糧、一份力：公平為何不等於每戶同額？',value:'care'},{label:'制度雙圖：小康為何仍需要禮，又如何約束有位者？',value:'rules'}]});await ctx.say([{who:'yanyan',expr:'normal',text:v==='talent'?'回看第一次任命是否把人、實績與職務接合，寫出查核與信任的關係。':v==='care'?'回看一次缺糧、缺照護或多配，用皆有所養、不必為己說明不同需求。':'回看一次把禮義放錯位置或免責的判斷，說明現實制度與在位者的責任。'},{who:'clerk',expr:'serious',text:'首次判斷與最佳成績都保留。補做不是把學習抹成全對，而是把責任親手接回來。'}]);return 'n_27';},
n_27:async ctx=>{await scene(ctx,'guan','魯・公與家的本局評語','回到文本與你的操作',['kongzi','yanyan']);await ctx.say([{who:'yanyan',expr:'serious',text:'問君子何歎，最後也問自己：誰還沒有被看見？誰可以免於規範？原則怎樣在下一次需要來時仍有效？'},{who:'kongzi',expr:'normal',text:'把所讀的話，接到你願意承擔的事。'},{text:'三項必要操作已親做。本文仍是蜡祭後論大同、小康，《論語》仍是武城弦歌之問答；推演不另造歷史成敗。'}]);const score=ctx.state.vars.talent.firstScore*3+ctx.state.vars.care.firstScore*4+ctx.state.vars.rules.firstScore*3;return ctx.end({key:score>=75&&ctx.meter('heart')>=70?'great':score>=45?'good':'bad'});}

const FIXED='〈禮運〉蜡祭後的問答論大同與小康，《論語》武城弦歌之說獲肯定；治理數量、候選人與制度安置均屬教學推演';
const ENDINGS={great:{key:'great',title:'由公心，至可行',text:'你能把任人、照養與制度接到原文，也保留對在位者與證據的查核。這是本局學習評語，並非武城已達大同的史證。',good:true},good:{key:'good',title:'門外還有人',text:'三項必要體驗皆已親做。回看首次任命與核配，問原則怎樣推及家門外，又怎樣靠制度持續。推演成績不改寫歷史。',good:true},bad:{key:'bad',title:'從一份照養再起',text:'你已親做補足三關。以一次首次錯判配一段原文，說明如何修正任人、糧力或禮的責任；最佳分不抹去首次紀錄。',good:false}};
function payload(s,ending){const a=s.vars.talent.firstScore,b=s.vars.care.firstScore,c=s.vars.rules.firstScore,v=(Number(s.vars.choices.merit==='evidence')+Number(s.vars.choices.scope==='include')+Number(s.vars.choices.accountability==='all')+Number(s.vars.choices.boundary==='qualified')+Number(firstGood(game.ctx,'dt_13')))*20;return{scenarioId:SID,chapterVersion:VERSION,runId:s.vars.runId,mode:MODE,faction:'魯',country:'魯',role:'言偃',roleKind:'liezhuan',bioTitle:'言偃列傳',bioOpening:'言偃，字子游，孔子弟子也。',ending,scoreStrategy:Math.round(a*3+b*4+c*3),scoreVirtue:v,turns:s.steps,durationSec:Math.min(5400,Math.round((Date.now()-s.startedAt)/1000)),deeds:['讀蜡祭後歎魯與言偃問答，分清未之逮、古代記載與親見。','以武城為教學舞臺，親核六職候選人與實績、下任命讀報、核依據並公布，首次'+a+'分。','讀不獨親其親、不獨子其子，將照養推及家門外；不以同額出力排除病者。','三期親配各戶糧與照護、保留待命、親配送讀報，核貨力公共原則並公布，首次'+b+'分。','讀外戶不閉的因果位置，不用移除門鎖冒充互信與照養已建立。','對照天下公家、世及、親子、貨力、謀兵與禮義；親安六項制度、讀報及核責任界限，首次'+c+'分。','讀六君子謹禮、刑仁講讓、示民有常與在埶者去，有位者亦受規範。','對讀武城弦歌；保留'+FIXED+'。'],anchors:copy(s.anchors),games:copy(s.games),codex:s.codex.slice(),opener:'遊戲史官評語（自擬）：言偃在仲尼之側，問君子何歎，遂聞公與家之辨。公者選賢與能，講信修睦，親子之愛不獨於己，老壯幼與無依廢疾皆得其養；貨不棄而不必藏己，力不惰而不必為己。於是謀亂不興，外戶不閉。家者各親各子，貨力為己，大人世及，城郭為固，而禮義仍為紀。六君子謹禮，以著義考信，刑仁講讓，示民有常；不由禮者，有位亦非永免。此局借武城為教學推演，親任六職、親配三期糧力、親安公家制度。分其需求，察其實績，問誰仍在家門之外，誰可受綱紀之約。任命與份額非古籍實錄，成績亦非大同已行之證。武城聞弦歌，偃之言獲肯定，可見小邑亦能學道；尚不可據此宣稱古今天下已盡無患。欲由所讀至所行，當記首次之失，親補其責，慎其所知，而持續問其可行。',prompts:['引用選賢與能或講信修睦，結合一次首次任命，說明人、職務與可核實績如何相接；親近者為何也不能免查？','引用皆有所養或貨力兩句，結合一次首次糧與照護配置，說明公平為何不必是每戶同額；不必藏己為何不是丟掉全部儲備？','引用小康的禮義以為紀、刑仁講讓或在埶者去，對照一次首次制度安置與在位者查核選擇；再說遊戲推演、原文主張與歷史證據的界限。'],experience:{firstAnchors:copy(s.vars.firstAnchors),talent:copy(s.vars.talent),care:copy(s.vars.care),rules:copy(s.vars.rules),decisions:copy(s.vars.choices)}};}
async function onEnd(r,ctx){const s=ctx.state;if(ORDER.some(id=>!s.anchors.some(a=>a.anchorId===id))||['dt_talent','dt_care','wen_dt_rules'].some(id=>!s.games.some(g=>g.gameId===id&&!g.skipped))||['talent','care','rules'].some(k=>!s.vars[k]?.completed)||CODEX_KEYS.some(id=>!s.codex.includes(id)))throw Error('必要體驗或對讀尚未完成，請接續本話。');const ending=ENDINGS[r.key]||ENDINGS.good,p=s.vars.finishPayload||payload(s,ending);await ctx.banner(ending.title,'言偃列傳・本局評語');await ctx.say([{text:ending.text},{who:'shiguan',expr:'serious',text:'到結算以原文與一次首次操作完成反思。中央史冊依平台規則另收儒家與《禮》。其他篇章可從首頁依次進入。'}]);if(s.vars.submitted){ZH.session.set('result:'+SID,p);ZH.go('result',{s:SID});return;}s.vars.finishPayload=p;await checkpoint();await journal.flush();ZH.finishScenario(p);s.vars.submitted=true;await checkpoint();}
async function start(saved){if(loading)return;loading=true;ROOT.innerHTML='';game=ZH.story.create(ROOT,{id:SID,mode:MODE,title:'大同與小康',subtitle:'天下為公的世界，真的存在過嗎',seed:Number(params.seed)||0,start:'n_01',characters:CHARACTERS,scenes:SCENES,nodes:NODES,meters:[{id:'crown',label:'謀略',icon:'crown',max:100,start:0},{id:'heart',label:'德行',icon:'heart',max:100,start:0},{id:'shield',label:'照養',icon:'shield',max:100,start:0}],help:HELP,anchorOrder:ORDER,anchorTotal:14,anchorRunner,snapshot,save,onProgress:save,onEnd,initState:()=>({vars:{schema:SCHEMA,runId:'dt_'+Date.now().toString(36)+'_'+crypto.getRandomValues(new Uint32Array(1))[0].toString(36),firstAnchors:{},choices:{}}})});window.__ep=game;loading=false;game.start(saved||null);}
function title(saved){const compatible=saved?.vars?.schema===SCHEMA,st=compatible?saved:null;ROOT.innerHTML='<main class="dt-title"><div class="dt-title-bar"><span class="dt-kicker">春秋篇・第十六話・春秋晚期</span><button class="zh-btn zh-btn--quiet" data-home>回首頁</button></div><header><h1>大同與小康</h1><p class="dt-subtitle">天下為公的世界，真的存在過嗎</p></header><div class="dt-title-scene">'+panorama('village',['yanyan','kongzi','elder'])+'</div><section class="dt-start"><div class="dt-seal">公</div><div><h2>你・言偃，字子游</h2><p class="dt-note">由觀臺問答到武城推演，親選賢能、配糧與力、安制度。</p></div><div class="dt-start-actions">'+(st?'<button class="zh-btn zh-btn--primary" data-continue>接續這一局</button>':'')+'<button class="zh-btn '+(st?'zh-btn--quiet':'zh-btn--primary')+'" data-new>'+(st?'重新開始':'開始遊戲')+'</button></div></section><section class="dt-points"><div><b>選賢與能</b><p class="dt-note">六職看人、看實績，親任命與公布。</p></div><div><b>皆有所養</b><p class="dt-note">三期按需求配糧與照護，親配送、讀報。</p></div><div><b>公家雙圖</b><p class="dt-note">六項制度親安，核原文與在位者責任。</p></div></section>'+(saved&&!compatible?'<p class="dt-follow">偵測到不同版本進度。新版另開一局，已登錄成績與史冊保留。</p>':'')+'<p class="dt-note">預留約25—35分鐘。二十七節點、十四段原文、十二項章內圖鑑、三項必要體驗。卡關可不限時親做補足。候選人、糧額與制度安置為教學情境，不作歷史實現的證明。</p></main>';ROOT.querySelector('[data-home]').onclick=()=>ZH.go('hub');const cont=ROOT.querySelector('[data-continue]');if(cont)cont.onclick=()=>start(st);ROOT.querySelector('[data-new]').onclick=async()=>{if(loading)return;if(saved){const ok=await ZH.modal({title:'另開一局？',body:'<p>本話未完成的進度會清除，已登錄成績與史冊保留。</p>',actions:[{label:'取消',value:false,kind:'quiet'},{label:'重新開始',value:true,kind:'primary'}]});if(!ok)return;await journal.clear();}start(null);};}
ZH.ready(async()=>{if(!ZH.story?.createJournal||!ZH.arena||!window.ART){ROOT.innerHTML='<main class="dt-title"><h1>共用核心尚未齊備</h1><p>請沿用目前已優化的 Eng_Story、Art_kit 與挑戰賽共用檔。</p><button class="zh-btn zh-btn--primary" data-home>回首頁</button></main>';ROOT.querySelector('[data-home]').onclick=()=>ZH.go('hub');return;}journal=ZH.story.createJournal({id:SID,mode:MODE,scope:ZH.user?.email||window.ZH_BOOT.user?.email||'guest',remote:s=>ZH.save(SID,MODE,{engine:s,chapterVersion:VERSION})});ZH.loading(true,'展開公與家的竹簡');try{const [saved]=await Promise.all([load(),ZH.anchor.load(SID),ZH.codex.init()]);if(ORDER.some(id=>!ZH.anchor.get(SID,id)))throw Error('本話題庫尚未加入，請一併放入 S_cq16_datong_data，同步新版題庫後部署。');ZH.loading(false);if(String(params.mode||'')===MODE&&saved?.vars?.schema===SCHEMA)start(saved);else title(saved);}catch(e){ZH.loading(false);ROOT.innerHTML='<main class="dt-title"><h1>載入尚未完成</h1><p>'+E(e.message||String(e))+'</p><button class="zh-btn zh-btn--primary" data-reload>重新載入</button></main>';ROOT.querySelector('[data-reload]').onclick=()=>location.reload();}});
})();
