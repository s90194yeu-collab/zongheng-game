  ZH.LEARNING_TEXTS=ZH.LEARNING_TEXTS||{};ZH.CATALOG.filter(s=>s.vol==="zz").forEach(s=>{ZH.LEARNING_TEXTS[s.id]={titles:s.source.split("、")};});
  /* ZHUZI_CATALOG_END */

  /** 依代碼找劇本 */
  ZH.findScenario = id => ZH.CATALOG.find(s => s.id === id) || null;

  /** 某一卷的劇本 */
  ZH.scenariosOf = vol => ZH.CATALOG.filter(s => s.vol === vol);

  /** 話數的顯示文字 */
  ZH.episodeLabel = s => s.vol === 'zz' ? (s.level === 'bio' ? '初階・人物' : '進階・思想') : (s.ep === 0 ? '序章' : s.ep === -1 ? '尾聲' : '第 ' + s.ep + ' 話');

})(window.ZH);
</script>
