<script>
(function () {

  const SID = 'S_ch05_sanqin', E = ZH.esc;
  const KEY = 'sanqin-platform-v1:' + (ZH.user.email || 'guest') + ':';
  let run = '', first = {}, progress = {}, latest = null;
  const clone = v => JSON.parse(JSON.stringify(v));
  const read = (k, d) => ZH.local.get(KEY + k, d);
  const write = (k, v) => ZH.local.set(KEY + k, v);
  const freshId = () => 'sn_' + Date.now().toString(36) + '_' + crypto.getRandomValues(new Uint32Array(1))[0].toString(36);
  const status = text => document.querySelectorAll('[data-sn-save]').forEach(el => { el.textContent = text; });
  const current = () => window.__ep && window.__ep.state;

    state.vars.snRunId = run;
    state.vars.snFirst = clone(first);
    state.vars.snProgress = clone(progress);
  }
  window.SN = {
    read, write, runId: () => run,
    newRun() { run = freshId(); first = {}; progress = {}; latest = null; write('save', null); },
    useState(state) {
      const v = state && state.vars || {};
      run = v.snRunId || freshId(); first = clone(v.snFirst || {}); progress = clone(v.snProgress || {});
      if (state) {
        state.progress=state.progress || {};
        // Preserve old recorded scores on their original scale. Existing runs
        // carry a legacy marker; do not invent missing first-attempt records.
        for(const rec of state.anchors || []) if(!first[rec.anchorId])first[rec.anchorId]=Object.assign({},rec,{completed:true,legacy:true});
        for(const rec of state.games || []) {
          if(state.progress['arena:'+rec.gameId])continue;
          const raw=Object.assign({},state.vars[({ch05_books:'books',ch05_manage:'management',ch05_chase:'chase'})[rec.gameId]]||{}, {score:rec.score,max:rec.maxScore,passed:rec.passed,completed:true,legacy:true,sec:rec.sec || 0});
          const normalized=Math.round((raw.score/Math.max(1,raw.max))*10);
          const key={ch05_books:'books',ch05_manage:'management',ch05_chase:'chase'}[rec.gameId];
          if(key){state.vars[key+'Legacy']={score:raw.score,max:raw.max};state.vars[key+'Score']=normalized;}
          const attempt={r:clone(raw),mine:{score:normalized,sec:raw.sec},stars:normalized>=9?3:normalized>=7?2:normalized>=4?1:0,first:clone(raw)};
          state.progress['arena:'+rec.gameId]={tries:1,active:false,best:attempt,last:attempt,first:clone(raw)};
          rec.legacy=true;
        }
        const number=Number(String(state.node || '').split('_')[1]);for(const [minimum,key] of [[30,'text:ch_bashu_supply']])if(number>=minimum && !(state.codex || []).includes(key)){state.codex=state.codex || [];state.codex.push(key);const [t,id]=key.split(':');ZH.codex.unlock(t,id,SID);}

      else if (!e.shiftKey && document.activeElement === bs.at(-1)) { e.preventDefault(); bs[0].focus(); }
    });

      finished = true; rec.completed = true; first[a.id] = rec; SN.checkpoint();
      wrap.remove();  if (previous?.isConnected) previous.focus({preventScroll:true}); resolve(clone(rec));
    }
    function showRead() {
      reading = true; const fb = wrap.querySelector('.hm-feedback'); fb.hidden = false; fb.textContent = a.explanation;
      wrap.querySelectorAll('[data-answer]').forEach(x => { x.disabled = true; });

      rec.attempts++; rec.path = correct ? (rec.attempts === 1 ? 'direct' : 'fork') : rec.attempts === 1 ? 'fork' : 'fail';
      const op = a.options.find(o => o.key === answer);

        let dx=(held.has('right')?1:0)-(held.has('left')?1:0),dy=(held.has('down')?1:0)-(held.has('up')?1:0),speed=2.1*dt;
        if(!dx&&!dy&&s.path.length){const p=s.path[0],vx=p.x-s.player.x,vy=p.y-s.player.y,d=Math.hypot(vx,vy);if(d<=speed){s.player.x=p.x;s.player.y=p.y;s.path.shift();}else{dx=vx/d;dy=vy/d;}}
        const d=Math.hypot(dx,dy);if(d){dx=dx/d*speed;dy=dy/d*speed;if(safe(s.player.x+dx,s.player.y))s.player.x+=dx;if(safe(s.player.x,s.player.y+dy))s.player.y+=dy;}
        [[12.5,11.5],[2.5,7.5]].forEach(([x,y],i)=>{if(!s.checkpoints.includes(i)&&Math.hypot(s.player.x-x,s.player.y-y)<.45){s.checkpoints.push(i);s.checkpoint={x,y};s.message='木標已記下來路；若被發現，從這裡繼續親追。';persist();}});
        if(!s.cooldown&&s.guards.some((v,i)=>seen(v,patrols[i],s.elapsed%12>=7))){s.caught++;s.player=copy(s.checkpoint);s.path=[];held.clear();s.cooldown=2;s.message=s.caught>=3&&!s.assisted?'被發現三次，可以放慢巡哨；使用前成績保留，仍需親自走完。':'被火把照見，回木標再觀察；已走過的來路保留。';persist();}
        if(Math.hypot(s.player.x-13.5,s.player.y-1.5)<.5){s.completed=true;s.path=[];held.clear();s.message='你已親自追到溪邊。韓信就在面前，接著向他說明返營的安排。';persist();}
      }
      function frame(now){if(!alive)return;const dt=last?Math.min(.05,Math.max(0,(now-last)/1000)):0;last=now;if(s.started&&!s.completed&&focused&&!gameBlocked()){advance(dt);saveTime+=dt;if(saveTime>=.3){persist();saveTime=0;}}render();raf=requestAnimationFrame(frame);}
      const keys={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};
      const down=e=>{const d=keys[e.key];if(!d||gameBlocked()||!s.started||s.completed||e.target.closest('input,textarea,select'))return;e.preventDefault();s.path=[];held.add(d);},up=e=>{if(keys[e.key])held.delete(keys[e.key]);};
      const blur=()=>{focused=false;held.clear();last=0;},focus=()=>{focused=true;last=0;},visibility=()=>{held.clear();last=0;};
      const press=e=>{const b=e.target.closest('[data-dir]');if(!b||gameBlocked()||!s.started||s.completed)return;e.preventDefault();s.path=[];held.add(b.dataset.dir);b.setPointerCapture(e.pointerId);},release=e=>{const b=e.target.closest('[data-dir]');if(b)held.delete(b.dataset.dir);};
      const click=e=>{if(gameBlocked()||!alive)return;const b=e.target.closest('[data-chase]');if(!b)return;if(b.dataset.chase==='start'){s.started=true;s.message='由下方向右繞過山壁，再沿左側山路向上。';last=0;}
        if(b.dataset.chase==='assist'&&s.caught>=3&&!s.assisted){s.frozenScore=score();s.independentCaught=s.caught;s.assisted=true;s.message='巡哨已放慢，火把照得較近。仍由你控制蕭何走到溪邊。';}
        if(b.dataset.chase==='finish'&&s.completed){alive=false;resolve({completed:true,reachedRiver:true,skipped:false,score:score(),max:10,caught:s.caught,seconds:Math.round(s.elapsed),assisted:s.assisted,independentCaught:s.assisted?s.independentCaught:s.caught,passed:!s.assisted&&s.caught<=2,checkpoints:copy(s.checkpoints)});}persist();render();};
      const ground=e=>{if(!s.started||s.completed||gameBlocked())return;const svg=q('.sn-chase-board'),p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const pos=p.matrixTransform(svg.getScreenCTM().inverse());route(pos.x/40,pos.y/40);};
      body.addEventListener('click',click);q('.sn-chase-board').addEventListener('pointerdown',ground);body.addEventListener('pointerdown',press);body.addEventListener('pointerup',release);body.addEventListener('pointercancel',release);document.addEventListener('keydown',down);document.addEventListener('keyup',up);window.addEventListener('blur',blur);window.addEventListener('focus',focus);document.addEventListener('visibilitychange',visibility);
      g.onCleanup(()=>{alive=false;cancelAnimationFrame(raf);held.clear();body.removeEventListener('click',click);body.removeEventListener('pointerdown',press);body.removeEventListener('pointerup',release);body.removeEventListener('pointercancel',release);document.removeEventListener('keydown',down);document.removeEventListener('keyup',up);window.removeEventListener('blur',blur);window.removeEventListener('focus',focus);document.removeEventListener('visibilitychange',visibility);});render();persist();raf=requestAnimationFrame(frame);
    });
  }

  // ═════════════════════════ 7. 結局 ═════════════════════════
  const ENDINGS = {
    great: { id: 'great', title: '國士無雙', good: true, text: '此局糧兵民心俱備，親追而未失察；信得其任，何留後以給軍食。' },
    good: { id: 'good', title: '還定三秦', good: true, text: '此局親成收書、經營與追人之事；漢王拜信為將，何留後以給軍食。' },
    bad: { id: 'bad', title: '漢中困守', good: false, text: '此局諸務有乏，經營未均；信終得任，漢軍東出，宜察後方之失。' }
  };
  function onEnd(result, ctx) {
    const s = ctx.state, ending = ENDINGS[(result && result.key) || 'good'] || ENDINGS.good;
    ZH.sfx('seal');
    return ctx.banner(ending.title, '分封與還定三秦・終')
      .then(() => ctx.say([{ who: 'shiguan', expr: 'normal', text: '三種評語都保留韓信拜將與漢軍還定三秦。漢中困守評的是本局經營。' },
        { text: '國士無雙原文稱許韓信。本局也記下你識才、追人、具禮與留後供應的行動。' },
        { text: '結算小傳是遊戲生成；原文開頭之外的本局事蹟，不是司馬遷逐字原文。' }]))
      .then(() => SN.finish(payload(s, ending)));
  }
  function payload(s, ending) {
    const v = s.vars || {}, f = s.flags || {}, m = s.meters, books = v.books || {}, management = v.management || {}, chase = v.chase || {};
    const deeds = ['入咸陽，先收律令圖書。', '據圖察險，按籍知民。', '從王入漢中，留意軍民之務。',
      '此局分人治田，練卒修途，兼撫其民。',
      resourceKeys.every(k => m[k] >= 50) ? '此局三務俱足，得以備其供應。' : '此局諸務未均，糧兵民心或有不給。',
      f.chaseDecisionRight ? '此局聞信亡，知何不及以聞而自追。' : '此局聞信亡，初議有異，既讀原文乃自追。',
      chase.assisted ? '此局得助而親成追人之事，信乃返營。' : '此局親成追人之事，信乃返營。',
      '具禮以薦，漢王乃拜信為大將。', '聞信論項王，識任賢賞功之要。', '留收巴蜀，以給軍食為務。'];
    return { scenarioId: SID, mode: MODE, faction: '漢', role: '蕭何', roleKind: 'shijia', country: '漢',
      bioTitle: '蕭相國世家', bioOpening: '蕭相國何者，沛豐人也。', ending,
      scoreStrategy: bounded((books.score || 0)/(books.max || 100)*30 + (management.score || 0)/(management.max || 100)*40 + (chase.score || 0)/(chase.max || 100)*30),
      scoreVirtue: bounded((management.totals || m).people * .7 + (management.totals || m).grain * .3), turns: s.steps || 1,
      durationSec: Math.min(5400, Math.max(0, Math.round((Date.now() - (s.startedAt || Date.now())) / 1000))),
      deeds, anchors: s.anchors, games: s.games, codex: s.codex,
      opener: '遊戲生成史官評語：余讀〈蕭相國世家〉，至何獨收秦律令圖書，未嘗不歎其遠識也。',
      prompts: [
        '你在府庫先選了哪些物件？請用一處原文，說明圖書與戶籍如何比眼前財物更有長期治理價值。',
        '為一個人親自追出去，需要評估哪些才能、責任與風險？請連結本局一次追人操作，再討論先請示或立即親追的取捨。',
        '留住關鍵人才後，應給他什麼任務、信任、資源與賞功安排？請結合拜將禮及漢中對的一處原文說明。'
      ] };
  }


  // ═════════════════════════ 8. 開始（沿用官方範例） ═════════════════════════
  const saveState = SN.saveState;

  function startGame(saved) {
    if(saved)SN.useState(saved);else SN.newRun();document.documentElement.classList.toggle('hm-still',SN.read('still',false));
    ROOT.innerHTML = '';
    const game = ZH.story.create(ROOT, {
      id: SID, mode: MODE, title: META.name, subtitle: META.episode,
      seed: Number(params.seed) || 0, start: 'n_01',
      characters: CHARACTERS, meters: METERS, nodes: NODES, help: HELP,
      anchorTotal: ANCHOR_ORDER.length, anchorOrder: ANCHOR_ORDER,
      onEnd: onEnd, save: saveState, snapshot:SN.snapshot, anchorRunner:SN.runAnchor, onProgress:SN.cacheProgress, actions:[{label:"史冊",run:SN.book},{label:"存檔",run:SN.saveMenu}]
    });
    window.__ep = game;
    game.start(saved || null);
  }

  function renderTitle(saved) {
    const vol = ZH.VOLUMES.find(v => v.key === META.vol) || { no: '', name: '' };
    const st = saved && saved.engine;
    const btn = (a, label, primary) => '<button type="button" class="zh-btn ' + (primary ? 'zh-btn--primary' : 'zh-btn--quiet') + ' zh-btn--block" data-a="' + a + '">' + esc(label) + '</button>';
    ROOT.innerHTML =
      '<div class="ep-title" style="--ep-color:' + esc(ROLE.color) + '">' +
      '<div class="ep-title__bar"><a class="zh-mark" href="#" data-a="home"><span class="zh-mark__re">Re:</span><span class="zh-mark__name">縱橫鼎業</span></a>' +
      '<button type="button" class="zh-btn zh-btn--quiet zh-btn--sm" data-a="home">回首頁</button></div>' +
      '<main class="ep-title__main"><header>' +
      '<p class="ep-kicker">' + esc([vol.no + ' ' + vol.name, ZH.episodeLabel(META), '前 ' + META.year + ' 年'].join('・')) + '</p>' +
      '<h1 class="ep-h1">' + esc(META.name) + '</h1>' +
      '<p class="ep-episode">' + esc(META.episode) + '</p>' +
      '<div class="ep-chips">' + (META.guest ? '<span class="zh-chip zh-chip--gilt">訪客開放</span>' : '') +
      '<span class="zh-chip zh-chip--patina">' + esc(META.genre) + '</span>' +
      '<span class="zh-chip">自動存檔</span></div>' +
      (ZH.isGuest() ? '<p class="ep-note" style="margin-top:12px">你目前是訪客：可以完整遊玩，但進度只保存在這個分頁，也不會留下成績。</p>' : '') +
      '</header><section class="sn-title-scene" aria-label="漢中營地與本話人物">'+ART.scene('camp',{tod:'dusk',banner:'#ae8e36',glyph:'漢'})+'<div class="sn-title-cast">'+['xiaohe','hanxinclerk','liubang'].map(id=>'<span>'+ART.portrait(CHARACTERS.find(c=>c.id===id))+'</span>').join('')+'</div></section>' +
      '<section class="ep-start"><span class="ep-seal" aria-hidden="true">' + esc(ROLE.glyph) + '</span>' +
      '<div><h2 class="ep-start__name">' + esc(ROLE.name) + '・' + esc(ROLE.title) + '</h2><p class="ep-start__lead">' + esc(ROLE.lead) + '</p></div>' +
      '<div class="ep-start__act">' + (st ? btn('continue', st.ended ? '查看結局' : '繼續', true) + btn('new', '重新開始', false) : btn('new', '開始遊戲', true)) + '</div></section>' +
      '<section class="ep-points" aria-label="本話重點">' + POINTS.map(p => '<div class="ep-point"><b>' + esc(p.title) + '</b><span>' + esc(p.text) + '</span></div>').join('') + '</section>' +
      '<p class="ep-note">本話共 ' + ANCHOR_ORDER.length + ' 個史實錨點。中途離開會自動存檔。</p>' +
      '</main></div>';
    ROOT.querySelectorAll('[data-a="home"]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); ZH.go('hub'); }));
    const cont = ROOT.querySelector('[data-a="continue"]');
    if (cont) cont.addEventListener('click', () => { ZH.sfx('click'); startGame(st); });
    ROOT.querySelector('[data-a="new"]').addEventListener('click', () => {
      ZH.sfx('click');
      if (!st) { startGame(null); return; }
      ZH.modal({
        title: '重新開始？', body: '<p>目前的進度會清除，從頭開始。</p>',
        actions: [{ label: '取消', value: false, kind: 'quiet' }, { label: '重新開始', value: true, kind: 'primary' }]
      }).then(ok => { if (ok) ZH.deleteSave(SID, MODE).catch(() => null).then(() => startGame(null)); });
    });
  }

  const loadSave = SN.loadState;

  ZH.ready(() => {
    if(!ZH.story?.createJournal||!ZH.arena||!window.ART){ROOT.innerHTML='<main class="ep-title__main"><h1>共用核心待更新</h1><p>請先安裝 Eng_Story v0.2.2、Arena_js 與 Art_kit，再開啟第五話。</p><button class="zh-btn zh-btn--primary" data-home>回首頁</button></main>';ROOT.querySelector('[data-home]').onclick=()=>ZH.go('hub');return;}
    ZH.loading(true, '展開竹簡');
    ZH.codex.init();
    Promise.all([loadSave(), anchorsReady]).then(([saved]) => {
      ZH.loading(false);
      // 從首頁「繼續遊戲」帶著模式進來：直接接續
      if (String(params.mode || '') === MODE && saved) { startGame(saved.engine); return; }
      renderTitle(saved);
    });
  });
})();

</script>
