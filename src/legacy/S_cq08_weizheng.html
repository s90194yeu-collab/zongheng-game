    {
      id: 'wallLow', phase: 'start', when: s => s.res.wall <= 30,
      run(ctx) {
        return ctx.say([{ who: '守將', text: '城牆多處崩塌，弟兄們輪班修補也趕不上。再這樣下去，撐不了幾夜了！' }]);
      }
    },

      id: 'foodLow', phase: 'start', when: s => s.res.food <= 15,
      run(ctx) {

      id: 'nudgeZhu', phase: 'start', when: s => !!s.flags.yizhihu && !s.flags.accepted && s.turn >= (s._textplayV===3?4:7),

      run(ctx) {

  // ═════════════════════════ 敵方行動與結算 ═════════════════════════

  function ai(ctx) {
    const v = ctx.state.vars;
    const jinDmg = 5 + Math.floor(ctx.rng() * 4) + (v.jinWrath >= 90 ? 2 : 0) + (v.jinBoost || 0);
    v.jinBoost = 0;
    return ctx.fx.volley('hanling', 'xinzheng', { faction: 'jin', count: 7 }).then(() => {
      ctx.add('wall', -jinDmg, { at: 'xinzheng' });
      ctx.log('晉軍連夜攻城，城防 −' + jinDmg + '。', 'bad');
      const will = v.qinWill;
      if (will >= 50) {
        const d = 3 + Math.floor(ctx.rng() * 3);
        return ctx.fx.volley('fanan', 'xinzheng', { faction: 'qin', count: 5 }).then(() => {
          ctx.add('wall', -d, { at: 'xinzheng' });
          ctx.log('秦軍助攻，城防 −' + d + '。', 'bad');
        });
      }
      if (will >= 30) {
        ctx.add('wall', -1, { at: 'xinzheng' });
        ctx.fx.float('fanan', '擂鼓', '#efe2bf');
        ctx.log('秦軍只在營外擂鼓，沒有真正攻城。');
        return ctx.wait(500);
      }
      ctx.fx.float('fanan', '按兵不動', '#efe2bf');
      ctx.log('秦營按兵不動。', 'good');
      return ctx.wait(500);
    });
  }

  function upkeep(ctx) {
    const s = ctx.state;
    ctx.add('food', -4);
    ctx.add('morale', s.res.wall < 30 ? -5 : -2);
    if (s.res.food <= 0) {
      ctx.add('morale', -8, { at: 'xinzheng' });
      ctx.log('城中斷糧，人心惶惶。民心 −8。', 'bad');
    }
    ctx.vary('qinWill', -2);
    if (s.flags.scoutQin) ctx.node('fanan', { badge: String(Math.round(s.vars.qinWill)) });
    if (s.flags.scoutJin) ctx.node('hanling', { badge: String(Math.round(s.vars.jinWrath)) });
    ctx.log('城中又熬過一夜，消耗糧草 4。');
  }

  function check(s) {
    if (s.res.wall <= 0) return { type: 'ending', ending: ENDINGS.fall };
    if (s.res.morale <= 0) return { type: 'ending', ending: ENDINGS.surrender };
    if (s.turn > (s._textplayV===3?6:12)) return { type: 'ending', ending: ENDINGS.exhausted };
    return null;
  }

  const ENDINGS = {
    fall: { id: 'fall', title: '鄭國城破', good: false, text: '晉、秦之師入新鄭，鄭遂亡。' },
    surrender: { id: 'surrender', title: '開城請降', good: false, text: '鄭人困於圍城，開門請降於晉。' },
    exhausted: { id: 'exhausted', title: '力竭城陷', good: false, text: '圍城之急，城中力竭，晉、秦之師入鄭。' }
  };


  // ═════════════════════════ 計分與列傳 ═════════════════════════

  function argCount(s) {
    return s.intel.filter(id => (INTEL.find(i => i.id === id) || {}).kind === ARG).length;
  }

  function scores(s) {
    const c = s.cmdCount || {};
    const forks = (c.chu || 0) + (c.jinEnvoy || 0) + (c.sortie || 0) + (c.rumor || 0);
    const nights = Math.min(s.turn, 12);
    const strategy = Math.round(20 + argCount(s) * 12 + s.res.wall * 0.2 - forks * 6 - Math.max(0, nights - 6) * 3);
    // 德望：照顧百姓加分；散布流言、輕率夜襲扣分（不用陰謀、不白白犧牲士卒）
    const virtue = Math.round(35 + s.res.morale * 0.4 + (c.calm || 0) * 5 - (c.rumor || 0) * 10 - (c.sortie || 0) * 5);
    return { strategy: Math.max(0, Math.min(100, strategy)), virtue: Math.max(0, Math.min(100, virtue)) };
  }

  function deeds(s) {
    const f = s.flags;
    const nights = Math.min(s.turn, 12);
    const list = ['晉侯、秦伯圍鄭，晉軍函陵，秦軍氾南。'];
    if (f.council) list.push('鄭伯與群臣謀於朝，或請求救於楚，或請開城請和，議不能決。');
    if (f.scoutQin) list.push('夜遣斥候窺秦營，知秦師千里遠來，士有歸心。');
    if (f.scoutJin) list.push('又窺晉營，見晉師之盛。');
    if (f.chuSent) list.push('嘗遣使求救於楚，楚不應。');
    if (f.jinEnvoy) list.push('嘗遣使見晉侯，晉侯不納。');
    if (f.sortie) list.push('嘗出城夜襲晉營，' + (f.sortieWin ? '焚其糧車，而晉怒益甚。' : '不利而還。'));
    if (f.rumor) list.push('又使人散流言於秦營。');
    if (f.yizhihu) list.push('佚之狐言於鄭伯曰：「國危矣！若使燭之武見秦君，師必退。」公從之。');
    if (f.accepted) list.push('燭之武辭以老，鄭伯引咎自責，武乃許之。');
    list.push('凡被圍' + CN[nights] + '夜。');
    return list;
  }

  function payload(s, ending) {
    const sc = scores(s);
    return {
      scenarioId: SID, mode: MODE, faction: '鄭',
      role: '鄭文公', roleKind: 'shijia', country: '鄭',
      ending: ending,
      scoreStrategy: sc.strategy, scoreVirtue: sc.virtue,
      turns: Math.min(s.turn, 12),
      durationSec: Math.min(5400, Math.round((Date.now() - (s.vars.startedAt || Date.now())) / 1000)), // 分次遊玩時最多記 90 分鐘
      deeds: deeds(s),
      anchors: s.anchors,
      games: [],
      codex: s.codex,
      opener: '余讀《左氏春秋》至秦晉圍鄭，未嘗不歎小國之危也。',
      prompts: ending.good === false ? [
        '這一局鄭國沒有撐下去。你覺得關鍵的失誤在哪一夜？',
        '史書上，鄭國靠什麼化解了這場危機？你的做法和史書差在哪裡？',
        '小國面對兩個大國，最重要的資源是什麼？'
      ] : [
        '這一幕你花了幾夜蒐集論據？為什麼選在那一夜出城？',
        '佚之狐為什麼建議去見秦君，而不是晉侯？',
        '小國面對大國，除了打與降，還有什麼選擇？'
      ],
      orders: s.orderSeq,
      intel: s.intel
    };
  }


  // ═════════════════════════ 存檔 ═════════════════════════

  function saveState(state) {
    return ZH.save(SID, MODE, { faction: 'zheng', engine: state }).catch(() => null);
  }


  // ═════════════════════════ 結束 ═════════════════════════

  function onEnd(result, ctx) {
    const s = ctx.state;
    if (result.type === 'act1') {
      showActEnd(ctx);
      return;
    }
    const e = result.ending;
    ZH.sfx('ng');
    ctx.banner(e.title, '鄭國篇・終')
      .then(() => ctx.say([
        { text: e.text },
        { who: '史官', text: '史書上，鄭國並沒有亡於這一年。是哪一個轉折，讓鄭國活了下來？再試一次吧。' }
      ]))
      .then(() => ZH.deleteSave(SID, MODE).catch(() => null))
      .then(() => ZH.finishScenario(payload(s, e)));
  }

  /** 第一幕結束的幕間：統計＋進入第二幕（第二幕進行中重新整理，也會先回到這裡） */
  function showActEnd(ctx) {
    const s = ctx.state;
    const n = argCount(s);
    const args = INTEL.filter(i => i.kind === ARG);
    const have = id => s.intel.indexOf(id) > -1;
    const going = !!s.flags.a2_start;
    const wrap = ZH.html(
      '<div class="wz-act" role="dialog" aria-modal="true" aria-labelledby="wz-act-t"><div class="wz-act__card">' +
      (hasArt() ? '<div class="wz-act__face" aria-hidden="true">' + window.ART.portrait({ name: '燭之武' }, { bust: true, expr: 'serious' }) + '</div>' : '') +
      '<p class="wz-act__line">是夜，燭之武縋城而出——</p>' +
      '<h2 class="wz-act__title" id="wz-act-t">第一幕　完</h2>' +
      '<dl>' +
      '<div><dt>圍城</dt><dd>' + Math.min(s.turn, 12) + ' 夜</dd></div>' +
      '<div><dt>論據</dt><dd>' + n + ' / 5</dd></div>' +
      '<div><dt>城防</dt><dd>' + s.res.wall + '</dd></div>' +
      '<div><dt>糧草</dt><dd>' + s.res.food + '</dd></div>' +
      '<div><dt>民心</dt><dd>' + s.res.morale + '</dd></div>' +
      '</dl>' +
      '<div class="wz-act__args">' + args.map(a => '<span class="zh-chip' + (have(a.id) ? ' zh-chip--gilt' : '') + '">' + (have(a.id) ? '' : '未得・') + esc(a.title) + '</span>').join('') + '</div>' +
      '<div class="zh-slip">' + (going
        ? '第二幕〈夜縋〉進行中。按「繼續第二幕」，從上次停下的地方接著玩。'
        : '第二幕〈夜縋〉：燭之武要從城牆垂降，避開晉軍的崗哨，潛行到秦營，再到帳中說服秦伯。手上的論據越多，秦伯越容易被說動。') + '</div>' +
      '<div class="zh-row">' +
      '<button type="button" class="zh-btn zh-btn--quiet" data-a="home">回首頁</button>' +
      '<button type="button" class="zh-btn zh-btn--quiet" data-a="restart">重新開始</button>' +
      '<button type="button" class="zh-btn zh-btn--primary" data-a="act2">' + (going ? '繼續第二幕' : '第二幕：夜縋') + '</button>' +
      '</div></div></div>'
    );
    document.body.appendChild(wrap);
    ZH.sfx('bell');
    wrap.querySelector('[data-a="act2"]').focus({ preventScroll: true });
    wrap.querySelector('[data-a="home"]').addEventListener('click', () => ZH.go('hub'));
    wrap.querySelector('[data-a="restart"]').addEventListener('click', () => {
      ZH.modal({
        title: '重新開始鄭國篇？',
        body: '<p>目前的進度會清除，從第一夜重新開始。</p>',
        actions: [{ label: '取消', value: false, kind: 'quiet' }, { label: '重新開始', value: true, kind: 'primary' }]
      }).then(ok => {
        if (!ok) return;
        ZH.loading(true, '重新開始');
        ZH.deleteSave(SID, MODE).catch(() => null).then(() => ZH.go(SID));
      });
    });
    wrap.querySelector('[data-a="act2"]').addEventListener('click', () => {
      ZH.sfx('click');
      wrap.remove();
      act2(ctx);
    });
  }

  function stealthScore(r) {
    if (!r || r.skipped) return 0;
    return Math.max(2, 10 - 2 * (r.caught || 0) - (r.assisted ? 1 : 0));
  }

  /** 夜縋：有挑戰賽（Eng_Stealth v0.2.0 ＋ Arena_js）就用挑戰賽版本，每一局由引擎寫進小遊戲紀錄 */
  function playStealth() {
    const cfg = stealthConfig();
    if (ZH.stealth.challenge && ZH.arena) {
      return ZH.stealth.challenge(cfg, {
        scenarioId: SID, gameId: STL_GAME, title: '夜縋', goal: '不被晉軍發現，越快到秦營越好',
        help: STEALTH_HELP + '<p style="margin-top:8px"><b>計分</b>：沒被發現 10 分，被發現一次 −2 分，放慢巡哨 −1 分（最低 2 分）；同分比用時。最多挑戰 3 次，劇情採計最好的一次。</p>',
        score: r => ({ passed: !r.skipped, score: stealthScore(r), max: 10 }),
        backdrop: { base: 'night', banner: FLAG.zheng, glyph: '鄭' }
      });
    }
    return ZH.stealth.run(cfg).then(r => {
      ZH.track('minigame', { scenarioId: SID, gameId: STL_GAME, score: stealthScore(r), maxScore: 10, durationSec: r.seconds });
      return r;
    });

  function stageOf(p) {
    return p >= PERS.great ? '心折' : p >= PERS.good ? '心動' : p >= 35 ? '動搖' : '戒備';

        });

          checkpoint: 'night-rope', nodeId: 'a2Sneak', title: '新鄭城頭・夜縋護簡', returnLabel: '回到城下，接續秦營交涉', retry
        });

          : { text: '幾次差點被晉軍發現，燭之武伏在蘆葦裡等了很久，終於摸到了秦營門口。' }

  // 帳中說秦伯的舞台
  const TENT = { base: 'tent', who: 'qin', place: '秦營・中軍大帳', time: '燈火通明', cast: ['zhuzhiwu', 'qinmugong'] };

  function talkStep(ctx, st) {
    const done = ctx.flag('talk') || {};
    if (done[st.anchor]) return Promise.resolve();
    const pre = st.pre.slice();
    if (st.hint && ctx.hasIntel(st.hint.intel)) pre.push(st.hint.line);
    return ctx.say(pre)
      .then(() => ctx.anchor(st.anchor))
      .then(r => {
        if (st.unlock) ctx.unlock(st.unlock);
        const path = r && r.path;
        const base = path === 'direct' ? PERS.direct : path === 'fail' ? PERS.fail : PERS.fork;
        const has = !!st.arg && ctx.hasIntel(st.arg);
        return (has ? ctx.say([st.argLine]) : Promise.resolve()).then(() => {
          const gain = base + (has ? PERS.arg : 0);
          const arg = has ? (INTEL.find(i => i.id === st.arg) || {}).title : '';
          persAdd(ctx, gain, arg);
          ctx.log('帳中說秦伯・' + st.title + '：秦伯心意 +' + gain + (arg ? '（論據「' + arg + '」）' : '') + '。', 'good');
          return ctx.say(st.post);
        });
      })
      .then(() => {
        const d = Object.assign({}, ctx.flag('talk') || {});
        d[st.anchor] = 1;
        ctx.flag('talk', d);
        persUI(ctx);
        return ctx.save();
      });
  }

  /** 秦伯心意的浮層（舞台開著時放在舞台上，否則放在地圖上方） */
  function persUI(ctx) {
    const map = layer(ctx, '.wz-pers');
    if (!map) return;
    let box = map.querySelector('.wz-pers');
    if (!box) {
      box = ZH.html('<div class="wz-pers" aria-live="polite"><div class="wz-pers__head"><b>秦伯心意</b><span class="wz-pers__num"></span><span class="wz-pers__stage"></span></div>' +
        '<div class="wz-pers__bar" role="progressbar" aria-label="秦伯心意" aria-valuemin="0" aria-valuemax="100"><i></i></div><div class="wz-pers__args"></div></div>');
      map.appendChild(box);
    }
    const p = Math.min(100, ctx.flag('persuade') || 0);
    const done = ctx.flag('talk') || {};
    box.querySelector('.wz-pers__num').textContent = p + ' / 100';
    box.querySelector('.wz-pers__stage').textContent = stageOf(p);
    box.querySelector('.wz-pers__bar').setAttribute('aria-valuenow', String(p));
    box.querySelector('.wz-pers__bar i').style.width = p + '%';
    box.querySelector('.wz-pers__args').innerHTML = TALK.filter(t => t.arg).map(t => {
      const it = INTEL.find(i => i.id === t.arg) || {};
      const have = ctx.hasIntel(t.arg);
      return '<span class="' + (have ? 'is-have' : '') + (have && done[t.anchor] ? ' is-used' : '') + '">' + (have ? '' : '未得・') + esc(it.title || '') + '</span>';
    }).join('');
  }

  function persAdd(ctx, n, arg) {
    const before = ctx.flag('persuade') || 0;
    const after = Math.min(100, before + n);
    ctx.flag('persuade', after);
    persUI(ctx);
    const host = layer(ctx, '.wz-pers');
    const box = host && host.querySelector('.wz-pers');
    if (box) {
      const g = ZH.html('<span class="wz-pers__gain">+' + n + '</span>');
      box.querySelector('.wz-pers__head').insertBefore(g, box.querySelector('.wz-pers__stage'));
      setTimeout(() => g.remove(), 1700);
    }
    ctx.fx.float('fanan', (arg ? arg + '　' : '') + '心意 +' + n, '#f0d27a');
    ZH.sfx(n >= PERS.direct ? 'chime' : 'click');
    if (box && stageOf(before) !== stageOf(after)) {
      const sg = box.querySelector('.wz-pers__stage');
      sg.classList.remove('is-up');
      void sg.offsetWidth;
      sg.classList.add('is-up');
    }
  }

  function scores2(s) {
    const a1 = scores(s);
    const st = s.flags.a2_stealth || {};
    const characterOnly = !!s.flags.a2_character_route && !s.flags.a2_stealth;
    const p = Math.min(100, s.flags.persuade || 0);
    const strategy = Math.round(a1.strategy * 0.45 + p * 0.55 - (!characterOnly && st.skipped ? 8 : 0));
    const calm = characterOnly ? 0 : st.skipped ? -5 : (st.caught || 0) === 0 ? 8 : st.caught <= 2 ? 4 : 0;
    const virtue = a1.virtue + calm;
    return { strategy: Math.max(0, Math.min(100, strategy)), virtue: Math.max(0, Math.min(100, virtue)) };
  }

  function deeds2(s) {
    const f = s.flags;
    const st = f.a2_stealth || {};
    const nights = Math.min(s.turn, 12);
    const n = argCount(s);
    const t = tierOf(f.persuade || 0);
    const list = ['晉侯、秦伯圍鄭，晉軍函陵，秦軍氾南。'];
    if (f.council) list.push('鄭伯謀於朝，群臣或請求救於楚，或請開城請和，議不能決。');
    if (f.scoutQin || f.scoutJin) {
      list.push('鄭伯夜遣斥候窺' + (f.scoutQin && f.scoutJin ? '秦、晉之營' : f.scoutQin ? '秦營' : '晉營') + '，' +
        (f.scoutQin ? '知秦師千里遠來，士有歸心。' : '見晉師之盛。'));
    }
    if (f.chuSent) list.push('嘗遣使求救於楚，楚不應。');
    if (f.jinEnvoy) list.push('嘗遣使見晉侯，晉侯不納。');
    if (f.sortie) list.push('嘗出城夜襲晉營，' + (f.sortieWin ? '焚其糧車，而晉怒益甚。' : '不利而還。'));
    if (f.rumor) list.push('又使人散流言於秦營。');
    list.push('佚之狐言於鄭伯曰：「國危矣！若使燭之武見秦君，師必退。」公從之。');
    list.push('武辭以老，公引咎自責，武乃許之。');
    list.push('城被圍' + CN[nights] + '夜，武夜縋而出。');
    if (f.a2_character_route && !f.a2_stealth) list.push('同行者完成護簡的教學任務，武至秦營；同行操演另存，未記原潛行競技成績。');
    else if (st.ropeCaught) list.push('方縋城，為晉人火光所照，復引而上，再縋乃下。');
    if (f.a2_character_route && !f.a2_stealth) { /* Do not invent an unplayed patrol result. */ }
    else if (st.skipped) list.push('晉哨甚密，武迂道而行，天將明乃至秦營。');
    else if (!st.caught) list.push('潛行避晉軍之哨，人莫之覺，見秦伯於帳中。');
    else if (st.caught <= 2) list.push('途中數為晉哨所驚，伏蘆葦間良久，乃至秦營。');
    else list.push('途中屢為晉哨所逐，幾不得脫，乃至秦營。');
    list.push('見秦伯，先言越國鄙遠之難、亡鄭陪鄰之害，次許東道主之利，終舉焦、瑕之事，以明晉之無厭。');
    list.push(n >= 5 ? '所陳之事，皆斥候所親見，秦伯不能難。' : n >= 3 ? '所陳之事，多有所據。' : '所陳之事，多無實據，秦伯屢詰之。');
    list.push(t === 'great' ? '秦伯聞之，未終席而色動。' : t === 'survive' ? '秦伯沉吟良久，乃從之。' : '秦伯初甚疑之，再三詰難，乃從之。');
    return list;
  }

  function payload2(s, ending) {
    const sc = scores2(s);
    const st = s.flags.a2_stealth || {};
    return {
      scenarioId: SID, mode: MODE, faction: '鄭',
      role: '燭之武', roleKind: 'liezhuan', country: '鄭',
      ending: ending,
      scoreStrategy: sc.strategy, scoreVirtue: sc.virtue,
      turns: Math.min(s.turn, 12),
      durationSec: Math.min(5400, Math.round((Date.now() - (s.vars.startedAt || Date.now())) / 1000)), // 分次遊玩時最多記 90 分鐘
      deeds: deeds2(s),
      anchors: s.anchors,
      games: s.flags.a2_character_route && !s.flags.a2_stealth ? [] : [{ gameId: STL_GAME, score: stealthScore(st), maxScore: 10 }],
      codex: s.codex,
      opener: '余讀《左氏春秋》，至燭之武夜縋而出，未嘗不撫卷而歎也：小國之存亡，繫於一言。',
      prompts: [
        '燭之武說服秦伯，靠的是哪一個論點？如果只能留一句話，你會留哪一句？為什麼？',
        '第一幕你蒐集了幾條論據？它們在帳中幫上了什麼忙？如果重來，你會多等一夜，還是早一夜出城？',
        '晉文公為什麼不追擊秦軍？你同意他的理由嗎？'
      ],
      orders: s.orderSeq,
      intel: s.intel,
      persuade: s.flags.persuade || 0,
      stealth: s.flags.a2_character_route && !s.flags.a2_stealth ? null : st
    };
  }


  // ═════════════════════════ 各陣營篇章共用 ═════════════════════════
  // 秦國篇、晉國篇寫在 Side_cq08_*.html：透過 ZH.wz 取用共用資料，再把自己登記在 ZH.wz.sides。

  const ZHENG_FAIL = ['fall', 'surrender', 'exhausted'].map(k => ENDINGS[k].title);
  const doneKey = () => 'wz:done:' + (ZH.user.email || 'guest');
  const doneStore = () => (ZH.isGuest() ? ZH.session : ZH.local);

  /** 記下這台裝置上完成過哪個陣營（伺服器的完成紀錄另外查） */
  function markDone(name) {
    const d = Object.assign({}, doneStore().get(doneKey(), {}) || {});
    d[name] = true;
    doneStore().set(doneKey(), d);
  }

  /** 某個陣營是否已完成：這台裝置的紀錄，或伺服器上有非失敗的結局 */
  function isDone(name, progress, fails) {
    if ((doneStore().get(doneKey(), {}) || {})[name]) return true;
    const rec = progress && progress.factions && progress.factions[name];
    return !!(rec && rec.endings.some(e => (fails || []).indexOf(e) === -1));
  }

  ZH.wz = {
    SID: SID, MODE: MODE, ROOT: ROOT, params: params, esc: esc, CN: CN, anchorsReady: anchorsReady,
    FACTIONS: FACTIONS, OTHERS: OTHERS, MAP: MAP,
    markDone: markDone, isDone: isDone, stage: stage, layer: layer, hasArt: hasArt,
    sides: {}
  };


  // ═════════════════════════ 開始 ═════════════════════════

  function startGame(saved) {
    ROOT.innerHTML = '';
    const game = ZH.slg.create(ROOT, {
      id: SID, mode: MODE, title: '秦晉圍鄭', subtitle: '鄭國篇・第一幕　圍城之急',
      turns: (!saved||saved._textplayV===3)?6:12, orders: 3, player: 'zheng',
      seed: Number(params.seed) || 0,
      turnName: n => '第 ' + n + ' 夜',
      endTurnLabel: '結束此夜',
      factions: FACTIONS, others: OTHERS, map: MAP, resources: RESOURCES, meters: METERS,
      characters: CHARACTERS, speakers: SPEAKERS, intel: INTEL,
      intelGoal: { kind: ARG, total: 5, label: '說服秦伯的論據', note: '論據越多，之後說服秦伯越有把握。' },
      commands: COMMANDS, events: EVENTS, ai: ai, upkeep: upkeep, check: check, onEnd: onEnd,
      previewEvents:[
        {id:'nightIntro',label:'夜縋・城頭出發',detail:'第二幕情節',run:a2Intro},
        {id:'nightSneak',label:'夜縋潛行・直達操作',detail:'繩索與晉軍崗哨',game:{id:STL_GAME,title:'夜縋潛行'},run:a2Sneak},
        {id:'qinTalk',label:'帳中說秦伯',detail:'第二幕交涉與原文',run:a2Talk},
        {id:'qinLeave',label:'秦鄭結盟・秦軍退去',detail:'第二幕情節',run:a2Qin},
        {id:'jinLeave',label:'晉侯不擊・鄭圍解除',detail:'第二幕情節',run:a2Jin}
      ],
      tutorial: TUTORIAL, help: HELP, anchorTotal: 14,
      initState: () => ({ _ocChapter: ZH.character?.newChapterState(SID), vars: { qinWill: 70, jinWrath: 80, jinBoost: 0, startedAt: Date.now() } }),
      save: saveState
    });
    game.start(saved ? ZH.character?.applyChapterChoice(SID, saved) || saved : null);
  }

  /** 秦國篇、晉國篇是否開放：教師一律開放；學生要先完成鄭國篇 */
  function sideOpen(progress) {
    return !!ZH.user.isTeacher || isDone('鄭', progress, ZHENG_FAIL);
  }

  function renderTitle(saves, progress) {
    const s = ZH.findScenario(SID);
    const vol = ZH.VOLUMES.find(v => v.key === s.vol);
    const st = saves.zheng && saves.zheng.engine;
    const inAct = st && !st.ended;
    const act1Done = st && st.ended && st.ended.type === 'act1';
    const open = sideOpen(progress);
    const btn = (a, label, primary) => '<button type="button" class="zh-btn ' + (primary ? 'zh-btn--primary' : 'zh-btn--quiet') + ' zh-btn--block" data-a="' + a + '">' + esc(label) + '</button>';
    const sideActions = (key, name) => {
      const side = ZH.wz.sides[key];
      if (!side) return { lock: '製作中' };
      if (!open) return { lock: '完成鄭國篇後開放' };
      const sv = saves[key];
      return sv ? btn(key + ':continue', side.continueLabel(sv), true) + btn(key + ':new', '重新開始', false) : btn(key + ':new', '開始' + name, true);
    };
    const hero = hasArt() && window.ART.scene ? '<div class="wz-hero" aria-hidden="true">' + window.ART.scene('night', { tod: 'night', banner: FLAG.zheng, glyph: '鄭' }) + '</div>' : '';
    ROOT.innerHTML =
      '<div class="wz-title">' + hero +
      '<div class="wz-title__bar"><a class="zh-mark" href="#" data-a="home"><span class="zh-mark__re">Re:</span><span class="zh-mark__name">縱橫鼎業</span></a>' +
      '<button type="button" class="zh-btn zh-btn--quiet zh-btn--sm" data-a="home">回首頁</button></div>' +
      '<main class="wz-title__main">' +
      '<header><p class="wz-kicker">' + esc(vol.no + ' ' + vol.name + '・' + ZH.episodeLabel(s) + '・前 ' + s.year + ' 年') + '</p>' +
      '<h1 class="wz-h1">' + esc(s.name) + '</h1>' +
      '<p class="wz-episode">' + esc(s.episode) + '</p>' +
      '<div class="wz-chips"><span class="zh-chip zh-chip--gilt">教學關</span><span class="zh-chip">原典' + esc(s.source) + '</span>' +
      '<span class="zh-chip zh-chip--patina">非對稱三方 SLG＋夜縋潛行</span><span class="zh-chip">每篇約 30 分鐘・自動存檔</span></div>' +
      (ZH.isGuest() ? '<p class="wz-note" style="margin-top:12px">你目前是訪客：可以完整遊玩，但進度只保存在這個分頁，也不會留下成績。</p>' : '') +
      '</header><div data-character-entry></div>' +
      '<section class="wz-factions" aria-label="選擇勢力">' +
      faction('zheng', '鄭', '鄭國篇', '鄭文公（鄭伯）', '一座孤城，兵少糧薄。打不贏，就想辦法讓圍城的聯軍散掉。',
        ['第一幕：每夜三道令，修城、安民、夜探、朝議', '城防、糧草、民心，一項歸零就亡國', '第二幕：夜縋出城，潛行到秦營', '帳中說秦伯：論據越多，越有把握'],
        inAct ? btn('continue', '繼續（第 ' + st.turn + ' 夜）', true) + btn('new', '重新開始', false)
          : act1Done ? btn('continue', st.flags && st.flags.a2_start ? '繼續第二幕' : '進入第二幕：夜縋', true) + btn('new', '重新開始', false)
            : btn('new', '開始鄭國篇', true)) +
      faction('qin', '秦', '秦國篇', '秦穆公（秦伯）', '千里遠征，糧道要穿過晉國。這一仗打贏了，好處歸誰？',
        ['糧草、軍心、盟信：大國也有自己的難處', '幫晉國攻城，還是留一手？', '帳中來了一位鄭國老臣：他說的話，哪些是真的？'], sideActions('qin', '秦國篇')) +
      faction('jin', '晉', '晉國篇', '晉文公（晉侯）', '霸主之師，舊怨在身。要懲罰鄭國，也要留住秦國這個盟友。',
        ['軍力、霸業、盟好：霸主也要顧著盟友', '攻城、合圍、犒秦師，還是先去偵楚？', '秦軍走了，子犯請擊：追還是不追？'], sideActions('jin', '晉國篇')) +
      '</section>' +
      '<p class="wz-note">三方的資源、指令、勝負條件都不一樣。先從鄭國篇開始；完成鄭國篇後，可以換到秦國、晉國那一邊，看同一場圍城。' +
      (ZH.user.isTeacher ? '（教師帳號三篇都直接開放，方便試玩。）' : '') + '</p>' +
      '</main></div>';

    ZH.character?.mountEntry(ROOT.querySelector('[data-character-entry]'), SID, st);
    ROOT.querySelectorAll('[data-a="home"]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); ZH.go('hub'); }));
    const cont = ROOT.querySelector('[data-a="continue"]');
    if (cont) cont.addEventListener('click', () => { ZH.sfx('click'); startGame(st); });
    ROOT.querySelector('[data-a="new"]').addEventListener('click', () => {
      ZH.sfx('click');
      if (!st) { startGame(null); return; }
      confirmRestart('鄭國篇', '從第一夜重新開始。').then(ok => {
        if (ok) ZH.deleteSave(SID, MODE).catch(() => null).then(() => startGame(null));
      });
    });
    Object.keys(ZH.wz.sides).forEach(key => {
      const side = ZH.wz.sides[key];
      const c = ROOT.querySelector('[data-a="' + key + ':continue"]');
      const n = ROOT.querySelector('[data-a="' + key + ':new"]');
      if (c) c.addEventListener('click', () => { ZH.sfx('click'); side.start(saves[key]); });
      if (n) n.addEventListener('click', () => {
        ZH.sfx('click');
        if (!saves[key]) { side.start(null); return; }
        confirmRestart(side.title, '從頭開始。').then(ok => {
          if (ok) ZH.deleteSave(SID, side.slot).catch(() => null).then(() => side.start(null));
        });
      });
    });
  }

  function confirmRestart(name, tail) {
    return ZH.modal({
      title: '重新開始' + name + '？',
      body: '<p>目前的進度會清除，' + esc(tail) + '</p>',
      actions: [{ label: '取消', value: false, kind: 'quiet' }, { label: '重新開始', value: true, kind: 'primary' }]
    });
  }

  function faction(id, glyph, name, ruler, lead, bullets, actions) {
    const locked = !actions || typeof actions === 'object';
    return '<article class="wz-fac wz-fac--' + id + (locked ? ' is-locked' : '') + '">' +
      '<div class="wz-fac__head">' + (hasArt()
        ? '<span class="wz-fac__seal is-art" aria-hidden="true">' + window.ART.portrait({ name: ruler, art: { state: glyph } }, { bust: true }) + '</span>'
        : '<span class="wz-fac__seal" aria-hidden="true">' + glyph + '</span>') +
      '<div><h2 class="wz-fac__name">' + esc(name) + '</h2><p class="wz-fac__ruler">' + esc(ruler) + '</p></div></div>' +
      '<p class="wz-fac__lead">' + esc(lead) + '</p>' +
      '<ul>' + bullets.map(b => '<li>' + esc(b) + '</li>').join('') + '</ul>' +
      '<div class="wz-fac__act">' + (locked ? '<p class="wz-fac__lock">' + esc((actions && actions.lock) || '製作中') + '</p>' : actions) + '</div>' +
      '</article>';
  }

  const loadSlot = slot => ZH.load(SID, slot).then(r => (r && r.ok && r.state && r.state.engine ? r.state : null)).catch(() => null);

  ZH.ready(() => {
    ZH.loading(true, '展開帛書');
    ZH.codex.init();
    const sideKeys = Object.keys(ZH.wz.sides);
    Promise.all([
      loadSlot(MODE),
      Promise.all(sideKeys.map(k => loadSlot(ZH.wz.sides[k].slot))),
      ZH.isGuest() ? Promise.resolve(null) : ZH.call('api_getScenarioProgress', SID).catch(() => null),
      Promise.race([anchorsReady, ZH.sleep(8000)])
    ]).then(([zheng, sideSaves, progress]) => {
      ZH.loading(false);
      const saves = { zheng: zheng };
      sideKeys.forEach((k, i) => { saves[k] = sideSaves[i]; });
      // 從首頁「繼續遊戲」帶著模式進來：直接接續那一篇
      const want = String(params.mode || '');
      const hit = sideKeys.find(k => ZH.wz.sides[k].slot === want && saves[k]);
      if (hit && sideOpen(progress)) { ZH.wz.sides[hit].start(saves[hit]); return; }
      if (want === MODE && zheng) { startGame(zheng); return; }
      renderTitle(saves, progress);
    });
  });
})();
</script>
<?!= include('Side_cq08_qin') ?>
