<script>
(function(ZH){'use strict';const ASSETS=null; // GODOT_ASSETS
 if(!ASSETS||ZH.godotVillage)return;
 ZH.ready(()=>{const button=document.querySelector('[data-godot-open]');if(!button)return;let view=null,epoch=0,style=null;const dialog=document.createElement('dialog');dialog.className='godot-modal';dialog.setAttribute('aria-label','Godot博物館村');const host=document.createElement('div');host.className='godot-host';dialog.append(host);document.body.append(dialog);
 function close(){++epoch;view?.dispose();view=null;dialog.close();button.focus({preventScroll:true});}
 function css(){return style||(style=new Promise((resolve,reject)=>{const link=document.createElement('link');link.rel='stylesheet';link.href=ZH_STATIC_URL(ASSETS.css);link.onload=resolve;link.onerror=()=>{style=null;link.remove();reject(Error('村莊樣式暫時無法讀取。'));};document.head.append(link);}));}
 async function open(){const token=++epoch;view?.dispose();view=null;if(!dialog.open)dialog.showModal();host.innerHTML='<div class="gv-loading"><p role="status">正在開啟 Godot 村莊……</p><button data-back>返回選關</button></div>';host.querySelector('[data-back]').onclick=close;try{const [module]=await Promise.all([import(ZH_STATIC_URL(ASSETS.app)),css(),ZH.player.load()]);if(token!==epoch)return;view=module.mountGodotVillage(host,{entry:ZH_STATIC_URL(ASSETS.entry),catalog:ZH.CATALOG,appearance:ZH.player.profile?.appearance||{},canPlay:id=>ZH.canPlay(id),onSaveAppearance:look=>ZH.player.saveAppearance(look),onSelect:id=>{const chapter=ZH.findScenario(id);if(!chapter||chapter.status!=='ready'||chapter.legacyOnly||!ZH.canPlay(id))return;close();document.dispatchEvent(new CustomEvent('zh:village-select',{detail:{id}}));},onClose:close,onClassic:()=>{close();ZH.village?.open();}});}catch(error){if(token!==epoch)return;host.replaceChildren();const box=document.createElement('div');box.className='gv-loading';const text=document.createElement('p');text.textContent=error.message||'村莊暫時無法開啟。';const retry=document.createElement('button');retry.textContent='重新載入 Godot 村莊';retry.onclick=open;const back=document.createElement('button');back.textContent='返回選關';back.onclick=close;box.append(text,retry,back);host.append(box);}}
 button.onclick=open;dialog.addEventListener('cancel',e=>{e.preventDefault();close();});window.addEventListener('pagehide',()=>{++epoch;view?.dispose();view=null;});ZH.godotVillage={open,close,inspect:()=>view?.inspect()||{opened:dialog.open}};
 });})(window.ZH);
</script>
