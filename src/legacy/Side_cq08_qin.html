<!--
============================================================
 Re:縱橫鼎業
------------------------------------------------------------
 檔名：Side_cq08_qin.html
 版本：v0.2.0（2026-10-08）
 依賴：S_cq08_weizheng.html（在它的最後 include 這個檔；共用資料在 ZH.wz）
       Eng_SLG（v0.1.2 以上；v0.2.0 起有舞台與 Q 版立繪）、Anchor_js、Codex_js、Data_codex（v0.1.1 以上）
 說明：第 8 話「秦晉圍鄭」的秦國篇。玩家是秦穆公。
   第一幕「氾南」：秦軍千里遠征，糧道穿過晉國。每夜三道令：
     治軍（護糧道、撫軍）、盟晉（助攻、擂鼓）、探查（遣使問晉、夜探晉營、
     窺鄭城、飛書問雍、召見東使），還有險棋（猛攻、私通鄭國、獨自撤軍）。
     三條命脈：糧草、軍心、盟信（晉國對秦軍的信任，太低時晉人刁難糧車）。
     蒐集五條「利害帳」：糧道千里、鄭地歸晉、東方之路、晉人背約、晉志西向。
     第五夜（私通鄭國成功的話會提早一夜），燭之武來見。
   第二幕「帳中」：燭之武一段一段說；每段先作答錨點，再拿利害帳「查證」
     他說的是不是真的。查證得越多，結局越好：東道之盟、秦鄭之盟、聽言而盟。
   失敗結局：亡鄭陪鄰（鄭城被攻破）、師老兵疲（軍心歸零）、不告而退（獨自撤軍）。
   錨點（10 題，依序）：wz_15、wz_16、wz_17、wz_06、wz_07、wz_09、wz_18、wz_19、wz_20、wz_12
     （wz_06、07、09、12 與鄭國篇共用；wz_15～20 是秦國篇的新題）
   存檔：ZH.save(劇本, 'history:qin', { faction: 'qin', engine })
   結算：faction 秦、role 秦穆公；列傳篇名〈秦本紀〉（bioTitle、bioOpening）。
 v0.2.0：換新美術。開場、雍城回信、帳中聽燭之武、晉營、西歸都在「舞台」上演出
         （S_cq08_weizheng v0.4.0 的 ZH.wz.stage）；利害帳在舞台開著時放在舞台上。
============================================================
-->

<script>
(function (ZH) {
  'use strict';

  const W = ZH.wz;
  if (!W) return;
  const SID = W.SID;
  const MODE = 'history';        // 每局結果的模式（正史）
  const SLOT = 'history:qin';    // 存檔欄位
  const esc = W.esc;
  const CN = W.CN;
  const stage = (ctx, o) => (W.stage ? W.stage(ctx, o) : Promise.resolve());
  const layer = (ctx, sel) => (W.layer ? W.layer(ctx, sel) : ctx.mapEl());
  // 帳中的舞台
  const TENT = { base: 'tent', who: 'qin', place: '氾南・秦營中軍大帳', time: '三更', cast: ['zhuzhiwu', 'qinmugong'] };
  const LEDGER = '利害';

  patchNode('fanan', { sub: '秦軍・你', note: '秦軍大營。從雍城一路東來一千多里，糧車要穿過晉國的地界。' });
  patchNode('yong', { note: '秦國都城雍。糧草、書信都從這裡出發，路上要經過晉國。' });

  const RESOURCES = [
    { id: 'food', label: '糧草', icon: 'food', max: 100, start: 70, danger: 20 },
    { id: 'morale', label: '軍心', icon: 'morale', max: 100, start: 70, danger: 20 },
    { id: 'trust', label: '盟信', icon: 'trust', max: 100, start: 60, danger: 20 }
  ];

  const METERS = [
    { id: 'zhengWall', label: '鄭城城防', faction: 'zheng', reveal: () => true },
    { id: 'jinAmbition', label: '晉侯野心', faction: 'jin', reveal: s => !!s.flags.scoutJin, hint: '夜探晉營後顯示' }
  ];

  const CHARACTERS = [
    { id: 'qinmugong', name: '秦穆公', faction: 'qin', glyph: '秦', title: '秦伯・你', codex: 'person:cq_qinmugong' },
    { id: 'qizi', name: '杞子', faction: 'qin', glyph: '杞', title: '秦國大夫・隨軍', codex: 'person:cq_qizi' },
    { id: 'bailixi', name: '百里奚', faction: 'qin', glyph: '奚', codex: 'person:cq_bailixi',
      title: s => (s.flags.letterBack ? '來信：晉人背約' : '留守雍城') },
    { id: 'jianshu', name: '蹇叔', faction: 'qin', glyph: '蹇', codex: 'person:cq_jianshu',

    { id: 'jinwengong', name: '晉文公', faction: 'jin', glyph: '晉', title: '晉侯・盟友，也是女婿', codex: 'person:cq_jinwengong' },
    { id: 'zifan', name: '子犯', faction: 'jin', glyph: '犯', title: '晉國謀臣', codex: 'person:cq_zifan',

    { id: 'zhengbo', name: '鄭文公', faction: 'zheng', glyph: '鄭', title: '鄭伯・困守孤城', codex: 'person:cq_zhengwengong' },
    { id: 'zhuzhiwu', name: '燭之武', faction: 'zheng', glyph: '燭', title: '鄭國使者', codex: 'person:cq_zhuzhiwu',

  const SPEAKERS = {
    '史官': { glyph: '史' },
    '斥候': { glyph: '斥', faction: 'qin' },
    '糧官': { glyph: '糧', faction: 'qin' },
    '秦使': { glyph: '使', faction: 'qin' },
    '眾將': { glyph: '將', faction: 'qin' },
    '守衛': { glyph: '衛', faction: 'qin' },
    '晉使': { glyph: '使', faction: 'jin' }

  // 利害帳 5 條：之後拿來查證燭之武的話（刻意不引用錨點要考的原文字句）；軍情是了解局勢的情報
  const INTEL = [
    { id: 'far', kind: LEDGER, title: '糧道千里', text: '從雍城到氾南一千多里，糧車要經過晉國的關隘，晉人一車一車查驗才放行。秦軍吃的每一口糧，都得看晉國的臉色。' },
    { id: 'share', kind: LEDGER, title: '鄭地歸晉', text: '晉人回話：鄭國在晉國南邊，破城之後，土地自然歸晉；秦師遠來辛苦，金帛的賞賜少不了。——地全歸晉，秦國只分到一點財物。' },
    { id: 'dongdao', kind: LEDGER, title: '東方之路', text: '派往東方的秦使說：一路上沒有一個肯接待秦國使者的國家，糧食、車馬都得高價向晉人買。要是東方有個落腳的地方就好了。' },

    { id: 'tired', kind: '軍情', title: '師老兵疲', text: '蹇叔來信：軍隊離家越遠，士卒越想家，糧草越難接濟。久頓城下，最怕的不是敵人，而是自己先撐不住。' },
    { id: 'zhengHard', kind: '軍情', title: '鄭城困守', text: '斥候說：鄭國城上的守軍越來越少，夜裡常有人在城頭張望。鄭伯似乎在找出路。' }
  ];

  const HELP =
    '<p><b>目標</b>：你是秦穆公，和晉國一起圍鄭。可是這一仗，秦國真正的利益在哪裡？糧草、軍心任何一項歸零，秦軍就撐不下去；助攻太猛，鄭國提早城破，地全歸晉國。</p>' +
    '<p style="margin-top:10px"><b>每一夜三道令</b>：護糧道、撫軍照顧自己的部隊；助攻、擂鼓維持和晉國的盟信；遣使、夜探、飛書、召見東使，把秦國的「利害帳」算清楚。</p>' +
    '<p style="margin-top:10px"><b>盟信</b>：晉國對秦軍的信任。哪一夜秦軍沒有助攻也沒有擂鼓，盟信就會下降；太低的話，晉人會刁難你的糧車。</p>' +
    '<p style="margin-top:10px"><b>第二幕〈帳中〉</b>：第五夜，鄭國會有人來見你。他說的每一件事，都可以拿利害帳查證；查證得越多，判斷越有把握。</p>' +
    '<p style="margin-top:10px"><b>史實錨點</b>：劇情走到史書記載的關鍵時刻，會停下來請你選擇。選錯會先走一段歧路，再回到史書。</p>';

  const TUTORIAL = [
    { el: 'res', title: '秦軍的三條命脈', text: '糧草、軍心、盟信。糧道千里，每一夜都在消耗；盟信是晉國對秦軍的信任，太低的話，晉人會刁難你的糧車。' },
    { el: 'map', title: '帛書地圖', text: '你在東北的氾南。北邊函陵是盟友晉軍，中間的新鄭是你們圍攻的鄭國都城；秦國都城雍遠在西邊。' },
    { el: 'side', title: '各方的狀況', text: '鄭城還撐得住幾夜、晉侯在想什麼（要夜探才看得到），都在這裡。' },
    { el: 'cmd', title: '每一夜三道令', text: '治軍、盟晉、探查，還有幾招險棋。大國也有大國的難處。' },
    { el: 'intel-tab', title: '利害帳', text: '五條關於秦國利害的情報。帳算得越清楚，之後越能判斷別人說的話是真是假。' },
    { el: 'end', title: '結束此夜', text: '令下完了就按這裡。夜裡晉軍會攻城，秦軍的糧草也會消耗。' }
  ];


  // ═════════════════════════ 指令 ═════════════════════════

  const flagN = (ctx, k) => ctx.flag(k) || 0;
  const markAssist = ctx => { ctx.flag('assistTurn', ctx.state.turn); ctx.flag('assisted', 1); };
  const wallBadge = ctx => ctx.node('xinzheng', { badge: String(Math.round(ctx.state.vars.zhengWall)), badgeColor: '#2f6f5f' });

  const COMMANDS = [
    {
      id: 'supply', label: '護糧道', group: '治軍', cost: 1, desc: '派兵沿路護送糧車。糧草 +9。',
      run(ctx) {
        ctx.add('food', 9, { at: 'fanan' });
        const first = !ctx.flag('supply');
        ctx.flag('supply', flagN(ctx, 'supply') + 1);
        ctx.log('派兵護送糧車，糧草 +9。', 'good');
        return ctx.fx.march('yong', 'fanan', { faction: 'qin', glyph: '糧', ms: 1400, curve: [300, 160] }).then(() => {
          if (!first) return;
          return ctx.say([
            { who: '糧官', text: '糧車到了。只是一路上每過一道晉國的關隘，晉人就要一車一車查驗才肯放行。' },
            { who: '糧官', text: '主公，咱們吃的每一口糧，都得看晉國的臉色。' }
          ]).then(() => ctx.gainIntel('far'));
        });
      }
    },
    {
      id: 'calm', label: '撫軍', group: '治軍', cost: 1, desc: '犒賞士卒。軍心 +8，糧草 −3。',

        ctx.add('morale', 8, { at: 'fanan' });

        ctx.flag('calm', flagN(ctx, 'calm') + 1);

      }
    },
    {
      id: 'assist', label: '助攻', group: '盟晉', cost: 1, targets: ['xinzheng'],

          ctx.add('food', -3);
          ctx.add('morale', -3);
          ctx.vary('zhengWall', -5);
          wallBadge(ctx);

      id: 'drum', label: '擂鼓助威', group: '盟晉', cost: 1, targets: ['xinzheng'],
      desc: '在營外擂鼓，表示秦、晉同心，卻不真的攻城。盟信 +3。',

        ctx.flag('drum', flagN(ctx, 'drum') + 1);

        return ctx.wait(500);
      }
    },
    {
      id: 'askJin', label: '遣使問晉', group: '探查', cost: 1, targets: ['hanling'],
      enabled: s => ((s.flags.askJin || 0) < 2 ? true : '晉人已經不願再談這件事了。'),

          if (n === 0) {
            ctx.add('trust', -2);
            ctx.log('遣使問晉侯破鄭之後的安排。晉人有些不悅，盟信 −2。');

              { who: '秦使', text: '晉人說：鄭國在晉國南邊，破城之後，土地自然歸晉。秦師遠來辛苦，金帛的賞賜少不了。' },
              { who: 'qinmugong', text: '……金帛？秦國千里而來，就換一點金帛？' }
            ]).then(() => ctx.gainIntel('share'));
          }
          ctx.add('trust', -3);
          ctx.log('再問晉侯，晉人只說「破鄭之後再議」。盟信 −3。', 'bad');
          return ctx.say([{ who: '秦使', text: '晉人只說：「等破了城再議。」臉色比上一次更難看。' }]);
        });
      }
    },
    {
      id: 'scoutJin', label: '夜探晉營', group: '探查', cost: 1, targets: ['hanling'],
      desc: '派斥候摸近晉營，看看盟友在想什麼。被晉人發現的話，盟信會下降。',
      run(ctx) {
        const n = flagN(ctx, 'scoutJin');
        const caught = n >= 1 && ctx.rng() < 0.22;
        return ctx.fx.pulse('hanling', '#2b2418').then(() => {
          if (caught) {
            ctx.add('trust', -10, { at: 'hanling' });
            ctx.log('派往晉營的斥候被晉人抓到，晉侯大不高興。盟信 −10。', 'bad');
            return ctx.say([{ who: '晉使', text: '晉侯問：秦伯派人夜裡摸進盟友的營寨，是什麼意思？' }]);
          }
          ctx.flag('scoutJin', n + 1);
          ctx.node('hanling', { badge: String(Math.round(ctx.state.vars.jinAmbition)), badgeColor: '#7a2a1c' });
          if (n === 0) {
            ctx.unlock('person:cq_jinwengong');
            ctx.unlock('person:cq_zifan');
            return ctx.say([{ who: '斥候', text: '晉營旌旗連綿，兵力是我軍的好幾倍。晉侯親自坐鎮，子犯在帳前調度。' }])

          }
          if (n === 1) {
            return ctx.say([
              { who: '斥候', text: '幾名晉將在火堆旁說笑：拿下鄭國之後，下一步要往西推。' },
              { who: 'qinmugong', text: '往西？晉國的西邊……就是秦國。' }
            ]).then(() => ctx.gainIntel('ambition'));
          }
          ctx.log('晉軍攻勢不減，晉侯的野心大約 ' + Math.round(ctx.state.vars.jinAmbition) + '。');
          return ctx.say([{ who: '斥候', text: '晉營沒有新的動靜。晉侯的野心，看來一天比一天大。' }]);

      }
    },
    {
      id: 'scoutZheng', label: '窺鄭城', group: '探查', cost: 1, targets: ['xinzheng'],

        ctx.flag('scoutZheng', 1);
        ctx.unlock('person:cq_zhengwengong');
        return ctx.fx.pulse('xinzheng', '#3f9d84')
          .then(() => ctx.say([{ who: '斥候', text: '鄭國城上的守軍越來越少，夜裡常有人在城頭張望。鄭伯似乎在找出路。' }]))
          .then(() => ctx.gainIntel('zhengHard'));

    },
    {
      id: 'letter', label: '飛書問雍', group: '探查', cost: 1, targets: ['yong'],

        return ctx.fx.march('fanan', 'yong', { faction: 'qin', glyph: '書', ms: 1300, curve: [420, 60] })
          .then(() => ctx.say([{ who: 'qizi', text: '快馬已經出發。雍城離這裡一千多里，回信最快也要明夜。' }]));
      }
    },

  /** 查證結果：ok 查證屬實｜unknown 帳裡沒有、先聽他說｜missed 帳裡有卻沒拿出來｜wrong 拿錯了帳 */
  const verifyOf = s => s.flags.verify || {};
  const okCount = s => CHECKS.filter(c => verifyOf(s)[c.id] === 'ok').length;

  function claim(ctx, c) {
    const done = ctx.flag('claims') || {};
    if (done[c.id]) return Promise.resolve();
    return stage(ctx, TENT).then(() => { ledgerUI(ctx); return ctx.say(c.say); })
      .then(() => ctx.anchor(c.anchor))
      .then(() => {
        if (c.unlock) ctx.unlock(c.unlock);
        return c.ledger ? verify(ctx, c) : ctx.say(c.after || []);
      })
      .then(() => {
        const d = Object.assign({}, ctx.flag('claims') || {});
        d[c.id] = 1;
        ctx.flag('claims', d);
        ledgerUI(ctx);
        return ctx.save();
      });
  }

  /** 查證：從利害帳挑一條能對照的情報，或承認帳裡沒有 */
  function verify(ctx, c) {
    const held = INTEL.filter(i => i.kind === LEDGER && ctx.hasIntel(i.id));
    // 順序打亂，避免每段的答案都在同一個位置；「沒有能對照的」固定放最後
    for (let i = held.length - 1; i > 0; i--) {
      const j = Math.floor(ctx.rng() * (i + 1));
      const t = held[i]; held[i] = held[j]; held[j] = t;
    }
    const options = held.map(i => ({ label: i.title, desc: i.text, value: i.id }))
      .concat([{ label: '帳裡沒有能對照的情報', desc: '只能先聽他說，無從查證。', value: 'none' }]);
    return ctx.choose({
      title: '查證：' + c.title,
      text: '燭之武說：「' + c.say[0].text + '」這件事，你的利害帳裡有沒有可以對照的？',
      options: options
    }).then(pick => {
      const has = ctx.hasIntel(c.ledger);
      const r = pick === c.ledger ? 'ok' : pick === 'none' ? (has ? 'missed' : 'unknown') : 'wrong';
      const v = Object.assign({}, verifyOf(ctx.state));
      v[c.id] = r;
      ctx.flag('verify', v);
      const title = (INTEL.find(i => i.id === c.ledger) || {}).title;
      ledgerUI(ctx);
      if (r === 'ok') {
        ZH.sfx('seal');
        ctx.fx.float('fanan', '查證：' + c.title, '#f0d27a');
        ctx.log('查證屬實：' + c.title + '（' + title + '）。', 'good');
        return ctx.say([{ who: 'qinmugong', text: c.ok }]);
      }
      ZH.sfx('ng');
      ctx.log('查證：' + c.title + (r === 'unknown' ? '，帳裡沒有可對照的情報。' : '，沒有對上。'), r === 'unknown' ? '' : 'bad');
      const line = r === 'unknown' ? '（帳裡確實沒有這件事。寡人只能先聽他說。）'
        : r === 'missed' ? '（其實帳裡有一條可以對照：「' + title + '」。寡人一時沒想起來。）'
          : has ? '（這條帳說的是另一回事。能對照的，其實是「' + title + '」。）'
            : '（這條帳說的是另一回事。這件事，寡人手上其實沒有可以對照的情報。）';
      return ctx.say([{ who: 'qinmugong', text: line }]);
    });
  }

  /** 「利害帳」：五件事各自查證了沒有（舞台開著時放在舞台上） */
  function ledgerUI(ctx) {
    const map = layer(ctx, '.wz-pers');
    if (!map) return;
    let box = map.querySelector('.wz-pers');
    if (!box) {
      box = ZH.html('<div class="wz-pers" aria-live="polite"><div class="wz-pers__head"><b>利害帳</b><span class="wz-pers__num"></span><span class="wz-pers__stage"></span></div>' +
        '<div class="wz-pers__bar" role="progressbar" aria-label="查證屬實" aria-valuemin="0" aria-valuemax="5"><i></i></div><div class="wz-pers__args"></div></div>');
      map.appendChild(box);
    }
    const v = verifyOf(ctx.state);
    const n = okCount(ctx.state);
    box.querySelector('.wz-pers__num').textContent = '查證屬實 ' + n + ' / ' + CHECKS.length;
    box.querySelector('.wz-pers__stage').textContent = n >= 4 ? '洞若觀火' : n >= 2 ? '心中有數' : '半信半疑';
    box.querySelector('.wz-pers__bar').setAttribute('aria-valuenow', String(n));
    box.querySelector('.wz-pers__bar i').style.width = (100 * n / CHECKS.length) + '%';
    box.querySelector('.wz-pers__args').innerHTML = CHECKS.map(c => {
      const r = v[c.id];
      const mark = r === 'ok' ? '✓' : r === 'unknown' ? '？' : r ? '✗' : '・';
      return '<span class="' + (r === 'ok' ? 'is-ok' : r === 'missed' || r === 'wrong' ? 'is-miss' : '') + '">' + mark + ' ' + esc(c.title) + '</span>';
    }).join('');
  }

  function tentDecide(ctx) {
    if (ctx.flag('t_decide')) return Promise.resolve();
    const n = okCount(ctx.state);
    const line = n >= 4 ? '（五件事裡，寡人親自查證過 ' + n + ' 件。這個老人說的，句句屬實。）'
      : n >= 2 ? '（有幾件寡人查證過，有幾件只能先信他。）'
        : '（他說得頭頭是道，可是寡人手上，幾乎沒有能對照的帳。）';
    return stage(ctx, TENT).then(() => { ledgerUI(ctx); return ctx.say([{ who: 'qinmugong', text: line, expr: n >= 4 ? 'happy' : 'serious' }]); })
      .then(() => ctx.anchor('wz_12'))
      .then(() => {
        ctx.unlock('person:cq_qizi');
        ctx.node('fanan', { sub: '杞子等戍守', badge: '盟', badgeColor: '#3f9d84', note: '秦伯與鄭人結盟，留下杞子、逢孫、楊孫三位將領駐守鄭國，秦軍主力西歸。' });
        ctx.log('秦伯與鄭國結盟，留杞子、逢孫、楊孫戍守，秦軍撤回。', 'good');
        return ctx.fx.march('fanan', 'yong', { faction: 'qin', ms: 2400, curve: [420, 60] });
      })
      .then(() => ctx.say([
        { text: '天還沒亮，秦軍拔營西歸，只留下杞子、逢孫、楊孫，帶兵替鄭國守城。' },
        { who: 'qizi', text: '主公放心，末將一定守好這座城。' }
      ]))
      .then(() => { ctx.flag('t_decide', 1); return ctx.save(); });
  }

  function tentJin(ctx) {
    if (ctx.flag('t_jin')) return Promise.resolve();
    return ctx.fx.pulse('hanling', '#c4473a')
      .then(() => stage(ctx, { base: 'camp', who: 'jin', tod: 'dawn', place: '函陵・晉營', time: '天快亮了', cast: ['jinwengong', 'zifan'] }))
      .then(() => ctx.say([
        { text: '消息傳到函陵的晉營。' },
        { who: 'zifan', text: '秦國背盟而去，請國君下令，追擊秦軍！', expr: 'angry' },
        { who: 'jinwengong', text: '不可。微夫人之力不及此。因人之力而敝之，不仁；失其所與，不知；以亂易整，不武。吾其還也。', expr: 'serious' }
      ]))
      .then(() => {
        ctx.unlock('person:cq_jinwengong');
        ctx.unlock('person:cq_zifan');
        ctx.unlock('idiom:qinjinzhihao');
        ctx.log('晉侯不許追擊，晉軍也撤走了。', 'good');
        return ctx.fx.march('hanling', 'jiang', { faction: 'jin', ms: 2000 });
      })
      .then(() => {
        ctx.node('hanling', { hidden: true });
        ctx.node('xinzheng', { badge: '解圍', badgeColor: '#3f9d84' });
        ctx.night(false);
        ctx.flag('t_jin', 1);
        return ctx.save();
      });
  }

  function finale(ctx) {
    const s = ctx.state;
    const t = tierOf(s);
    const e = ENDINGS[t];
    ZH.sfx('seal');
    return ctx.banner(e.title, '秦國篇・終')
      .then(() => stage(ctx, { base: 'road', who: 'qin', tod: 'dawn', place: '西歸的路上', time: '黎明', cast: ['qinmugong'] }))
      .then(() => ctx.say([
        { who: '史官', text: t === 'great' ? '秦國沒有在鄭國多拿一寸土地，卻在晉國的東邊，留下了自己的人。'
          : t === 'good' ? '秦伯算過了帳，才點頭結盟。大國的決定，靠的是利害，不是一時的情面。'
            : '秦伯被一席話說動了。只是他自己的帳，算得還不夠清楚。' },
        { who: '史官', text: '兩年後，杞子從鄭國送了一封密信回秦……那是另一個故事了。' }
      ]))
      .then(() => { W.markDone('秦'); return ZH.deleteSave(SID, SLOT).catch(() => null); })
      .then(() => ZH.finishScenario(payload(s, e)));
  }


  // ═════════════════════════ 計分與列傳 ═════════════════════════

  function scores(s) {
    const c = s.cmdCount || {};
    const v = verifyOf(s);
    const ok = okCount(s);
    const unknown = CHECKS.filter(x => v[x.id] === 'unknown').length;
    const assists = (c.assist || 0) + (c.storm || 0) * 2;
    const strategy = Math.round(25 + ok * 10 + unknown * 3 + s.res.food * 0.1 + s.res.morale * 0.1 -
      (c.storm || 0) * 8 - (s.flags.secret === 'caught' ? 6 : 0) - Math.max(0, assists - 3) * 3);
    // 德望：照顧士卒、對盟友守信；強攻殃及百姓、私下交通、不告而退都扣分
    const virtue = Math.round(40 + s.res.morale * 0.25 + (s.res.trust >= 40 ? 10 : 0) + (c.calm || 0) * 3 -
      (c.storm || 0) * 10 - (s.flags.secret ? 6 : 0) - (s.flags.retreat ? 10 : 0));
    return { strategy: Math.max(0, Math.min(100, strategy)), virtue: Math.max(0, Math.min(100, virtue)) };
  }

  function deeds(s) {
    const f = s.flags;
    const c = s.cmdCount || {};
    const has = id => s.intel.indexOf(id) > -1;
    const list = ['晉文公與秦穆公合兵圍鄭，晉軍函陵，秦軍氾南。'];
    if (has('far')) list.push('秦師遠來，糧道千里，皆假道於晉，晉人一一閱之。');
    if (has('share')) list.push('嘗使人問晉侯破鄭之後，晉人曰：「鄭近於晉，地當歸晉。」');
    if (has('dongdao')) list.push('東使還，言東方諸國無館秦使者。');
    if (f.letterBack) list.push('飛書問百里奚、蹇叔於雍。奚以晉惠公背約為言，叔以勞師遠征為戒。');
    if (f.scoutJin) list.push('夜遣斥候窺晉營，' + (has('ambition') ? '聞晉將欲西略。' : '見晉師之盛。'));
    if (f.scoutZheng) list.push('又窺鄭城，知鄭人困甚。');
    const a = c.assist || 0;
    list.push(a >= 3 ? '數助晉攻鄭。' : a >= 1 ? '嘗助晉攻鄭。' : (c.drum ? '擂鼓營外以助晉威，未嘗力戰。' : '按兵不攻。'));
    if (c.storm) list.push('嘗悉眾攻城，士卒多傷。');
    if (f.secret) list.push(f.secret === 'caught' ? '陰使人入鄭，為晉人所覺。' : '陰使人入鄭，通鄭伯之意。');
    if (f.zhuSeen) {
      list.push('鄭使燭之武夜縋而出，見秦伯。');
      const n = okCount(s);
      list.push(n >= 4 ? '武之所言，秦伯皆以所聞者驗之，知其不誣。' : n >= 2 ? '武之所言，秦伯以所聞者驗之，十得其半。' : '武之所言，秦伯多未及驗。');
    }
    if (f.retreat) list.push('留鄭凡' + CN[Math.min(f.retreat, 12)] + '夜。');
    return list;
  }

  function payload(s, ending) {
    const sc = scores(s);
    const ok = ending.good !== false;
    return {
      scenarioId: SID, mode: MODE, faction: '秦',
      role: '秦穆公', roleKind: 'benji', country: '秦',
      bioTitle: '秦本紀', bioOpening: '秦穆公任好，德公之少子也。',
      ending: ending,
      scoreStrategy: sc.strategy, scoreVirtue: sc.virtue,
      turns: Math.min(s.turn, 12),
      durationSec: Math.min(5400, Math.round((Date.now() - (s.vars.startedAt || Date.now())) / 1000)), // 分次遊玩時最多記 90 分鐘
      deeds: deeds(s),
      anchors: s.anchors,
      games: [],
      codex: s.codex,
      opener: '余讀《左氏春秋》，至秦伯與鄭人盟，未嘗不歎大國之計，在算其利害也。',
      prompts: ok ? [
        '燭之武的五個論點，你在第一幕親自查證過哪幾個？查證過的論點，聽起來有什麼不同？',
        '秦國是大國，為什麼還會被一個小國的使者說動？大國真正在乎的是什麼？',
        '秦伯留下杞子等人戍守鄭國，你覺得是為了保護鄭國，還是為了秦國自己？'
      ] : [
        '這一局秦國什麼也沒得到。你覺得問題出在哪一夜的決定？',
        '「鄰之厚，君之薄也」：這句話在你這一局應驗了嗎？',
        '大國和盟友一起出兵時，要怎麼確定自己不是在替別人打仗？'
      ],
      orders: s.orderSeq,
      intel: s.intel,
      verify: verifyOf(s)
    };
  }


  // ═════════════════════════ 存檔與流程 ═════════════════════════

  function saveState(state) {
    return ZH.save(SID, SLOT, { faction: 'qin', engine: state }).catch(() => null);
  }

  function onEnd(result, ctx) {
    if (result.type === 'tent') {
      tent(ctx);
      return;
    }
    const s = ctx.state;
    const e = result.ending;
    ZH.sfx('ng');
    const lines = e.id === 'zhengFall' ? [
      { text: e.text },
      { who: 'qinmugong', text: '……秦國出兵、出糧，最後什麼也沒得到。晉國卻多了一大片土地。' },
      { who: '史官', text: '史書上，秦伯在城破之前聽了一個人的話。是誰？他說了什麼？再試一次吧。' }
    ] : e.id === 'collapse' ? [
      { text: e.text },
      { who: '史官', text: '千里遠征，最怕自己先撐不住。照顧好糧草和軍心，才等得到轉機。' }
    ] : [
      { text: e.text },
      { who: '史官', text: '撤軍不是錯，可是什麼也沒換到就走，秦國白跑了一趟。史書上的秦伯，走之前先做了一件事。' }
    ];
    ctx.banner(e.title, '秦國篇・終')
      .then(() => ctx.say(lines))
      .then(() => ZH.deleteSave(SID, SLOT).catch(() => null))
      .then(() => ZH.finishScenario(payload(s, e)));
  }

  function start(saved) {
    const root = W.ROOT;
    root.innerHTML = '';
    const game = ZH.slg.create(root, {
      id: SID, mode: MODE, title: '秦晉圍鄭', subtitle: '秦國篇・第一幕　氾南',
      turns: ZHU_NIGHT, orders: 3, player: 'qin',
      seed: Number(W.params.seed) || 0,
      turnName: n => '第 ' + n + ' 夜',
      endTurnLabel: '結束此夜',
      factions: W.FACTIONS, others: W.OTHERS, map: MAP, resources: RESOURCES, meters: METERS,
      characters: CHARACTERS, speakers: SPEAKERS, intel: INTEL,
      intelGoal: { kind: LEDGER, total: 5, label: '秦國的利害帳', note: '帳算得越清楚，越能判斷別人說的話是真是假。' },
      commands: COMMANDS, events: EVENTS, ai: ai, upkeep: upkeep, check: check, onEnd: onEnd,
      tutorial: TUTORIAL, help: HELP, anchorTotal: ANCHOR_ORDER.length, anchorOrder: ANCHOR_ORDER,
      initState: () => ({ vars: { zhengWall: 70, jinAmbition: 60, startedAt: Date.now() } }),
      save: saveState
    });
    game.start(saved && saved.engine ? saved.engine : null);
  }

  W.sides.qin = {
    title: '秦國篇',
    slot: SLOT,
    start: start,
    continueLabel: saved => {
      const st = saved && saved.engine;
      if (!st) return '繼續';
      if (st.ended && st.ended.type === 'tent') return '繼續（帳中）';
      return '繼續（第 ' + st.turn + ' 夜）';
    }
  };
})(window.ZH);
</script>
