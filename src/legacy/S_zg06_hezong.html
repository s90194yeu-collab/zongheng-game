function title(saved){const compatible=saved?.vars?.schema===SCHEMA,st=compatible?saved:null;ROOT.innerHTML='<main class="hz-title"><div class="hz-title-bar"><span class="zh-mark"><span class="zh-mark__re">Re:</span><span class="zh-mark__name">縱橫鼎業</span></span><button class="zh-btn zh-btn--quiet" data-home>回首頁</button></div><header><p class="hz-kicker">戰國篇・第六話・周</p><h1>合縱連橫</h1><p class="hz-subtitle">六國的相印，我全都要</p><div class="ep-chips"><span class="zh-chip zh-chip--patina">揣摩 × 路線議約 × 說辭交鋒</span><span class="zh-chip">自動存檔</span></div></header><section class="hz-title-scene" aria-label="蘇秦與張儀的外交推演">'+panorama('league',['su','zhang'])+'</section><section class="hz-start"><span class="hz-seal" aria-hidden="true">縱</span><div><h2>你是蘇秦</h2><p class="hz-note">十上秦書而不行。你要帶著說辭與盤纏，走向六國的華屋。</p></div><div class="hz-start-actions">'+(st?'<button class="zh-btn zh-btn--primary" data-continue>'+(st.ended?'查看結局':'繼續遊戲')+'</button>':'')+'<button class="zh-btn '+(st?'zh-btn--quiet':'zh-btn--primary')+'" data-new>'+(st?'重新開始':'開始遊戲')+'</button></div></section><section class="hz-points"><div><b>揣摩之術</b><p class="hz-note">看清君主所憂，十次親配說辭；連擊與睡意競賽。</p></div><div><b>縱約長之路</b><p class="hz-note">親走六國路線，用100教學金議約，與秦使爭取支持。</p></div><div><b>縱橫對決</b><p class="hz-note">觀察偏好與張儀備稿，出六種說辭牌，核對承諾與信任。</p></div></section>'+(saved&&!compatible?'<p class="hz-follow">偵測到不同版本進度。新版另開一局，先前已登錄的成績與史冊保留。</p>':'')+'<p class="hz-note">預留約20～30分鐘。十二個原文對讀、三項必要體驗；卡關可不限時親自補做。v1.1.0</p></main>';ROOT.querySelector('[data-home]').onclick=()=>ZH.go('hub');const cont=ROOT.querySelector('[data-continue]');if(cont)cont.onclick=()=>start(st);ROOT.querySelector('[data-new]').onclick=async()=>{if(loading)return;if(saved){const ok=await ZH.modal({title:'另開一局？',body:'<p>此話未完成的進度會清除；已登錄的成績與史冊保留。</p>',actions:[{label:'取消',value:false,kind:'quiet'},{label:'重新開始',value:true,kind:'primary'}]});if(!ok)return;loading=true;await journal.clear();try{await ZH.deleteSave(SID,MODE);}catch(e){}loading=false;}start(null);};}
