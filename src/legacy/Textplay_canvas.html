function cleanActorName(raw,side,scenarioId){
 const s=String(raw||'').trim();
 if(!s||s==='你'||s==='我'){const pair=COUNTERPARTS[scenarioId];return pair?pair[0]:'策士';}
 if(/對方|阻攔|敵|巡燈|巡哨/.test(s))return side==='enemy'?'巡哨兵':s;
 const parts=s.split(/\s*(?:→|／|與|及|、)\s*/).map(x=>x.replace(/所統突破分隊|所統分隊|及從者|與弟子|的治理參與者|事件觀察者|決策者|指揮者/g,'').trim()).filter(Boolean);
 const A=w.ART;
 if(A?.ROSTER){
  for(let i=parts.length-1;i>=0;i--){if(A.ROSTER[parts[i]])return parts[i];}
  for(const p of parts){const hit=Object.keys(A.ROSTER).find(k=>p.includes(k)||k.includes(p));if(hit)return hit;}
 }
 return parts[parts.length-1]||s;
}
function resolveStagePair(c){
 const pair=COUNTERPARTS[c.scenarioId];
 if(pair)return pair;
 const parts=String(c.actor||'').split(/\s*(?:→|／|與|及|、)\s*/).map(x=>cleanActorName(x,'ally',c.scenarioId)).filter(Boolean);
 if(parts.length>=2)return [parts[parts.length-1],parts[0]];
 return [cleanActorName(c.actor,'ally',c.scenarioId),'諸侯使臣'];
}
function create(canvas,c){const ctx=canvas.getContext('2d'),sprites=new Map();let backdrop=null,disposed=false;

const color={gold:'#e1bc66',jade:'#68baa4',red:'#d87565',paper:'#f0e3c2',night:'#122a35'};
function text(t,x,y,size=15,fill=color.paper,align='center'){ctx.fillStyle=fill;ctx.font='600 '+size+'px "PingFang TC","Microsoft JhengHei",sans-serif';ctx.textAlign=align;ctx.fillText(t,x,y);}
function getChibiSprite(name,side,expr='normal'){
 const A=w.ART;if(!A?.chibi||!A?.specOf||typeof Image==='undefined')return null;
 const key=name+'|'+side+'|'+expr;
 if(sprites.has(key)){const r=sprites.get(key);return r.ready?r.img:null;}
 try{
  const base=side==='enemy'&&!/王|公|侯|君|羽|斯|高/.test(name)?{name,title:'兵',art:{hat:'kui',armor:true,prop:'ji',robe:'#8c3d35',trim:'#d9b76c'}}:{name,title:side==='enemy'?'將':'士'};
  const spec=A.specOf(base);
  let svg=A.chibi(spec,{expr});
  svg=svg.replace('<svg ','<svg width="200" height="300" ').replace(/(<svg[^>]*>)/,'$1<style>.ck-m2{opacity:0}</style>');
  const img=new Image(),rec={img,ready:false,spec};
  sprites.set(key,rec);
  img.onload=()=>{rec.ready=true;};
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
 }catch(_){sprites.set(key,{ready:false});}
 return null;
}
function drawCuteVectorChibi(x,y,name,side,scale,pose){
 const A=w.ART,spec=A?.specOf?A.specOf({name,title:side==='enemy'?'將':'士'}):null;
 const robe=spec?.robe||(side==='enemy'?'#9b4438':'#457a74'),trim=spec?.trim||'#e8d5a7',skin=spec?.skin||'#fce0c5',hair=spec?.hair||'#28211f';
 ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);
 ctx.fillStyle='rgba(5,14,22,.36)';ctx.beginPath();ctx.ellipse(0,12,22,7,0,0,Math.PI*2);ctx.fill();
 ctx.rotate(Math.sin(pose||0)*0.03);
 // 寬袖交領漢服袍身
 ctx.fillStyle=robe;ctx.strokeStyle='#2a1d17';ctx.lineWidth=1.8;
 ctx.beginPath();ctx.moveTo(-14,-12);ctx.quadraticCurveTo(-26,-2,-24,10);ctx.quadraticCurveTo(0,15,24,10);ctx.quadraticCurveTo(26,-2,14,-12);ctx.closePath();ctx.fill();ctx.stroke();
 // 交領與腰封玉佩
 ctx.strokeStyle=trim;ctx.lineWidth=2.4;ctx.beginPath();ctx.moveTo(-7,-12);ctx.lineTo(2,-2);ctx.moveTo(7,-12);ctx.lineTo(-2,-2);ctx.stroke();

 ctx.fillStyle='#7fc4ac';ctx.beginPath();ctx.arc(0,4.5,3.2,0,Math.PI*2);ctx.fill();
 // Q版圓潤臉龐與雙耳
 ctx.fillStyle=skin;ctx.strokeStyle='#2a1d17';ctx.lineWidth=1.7;
 ctx.beginPath();ctx.arc(-16,-25,4,0,Math.PI*2);ctx.arc(16,-25,4,0,Math.PI*2);ctx.fill();
 ctx.beginPath();ctx.ellipse(0,-26,16.5,15,0,0,Math.PI*2);ctx.fill();ctx.stroke();
 // 髮髻與冠冕
 ctx.fillStyle=hair;ctx.beginPath();ctx.arc(0,-29,16.8,Math.PI*1.06,Math.PI*1.94);ctx.fill();
 ctx.fillStyle=side==='enemy'?'#6e322a':'#2d3b49';ctx.strokeStyle=trim;ctx.lineWidth=1.3;
 ctx.beginPath();ctx.roundRect(-9,-47,18,8,3);ctx.fill();ctx.stroke();

 ctx.fillStyle='rgba(255,135,135,.42)';ctx.beginPath();ctx.ellipse(-9.5,-22,3.6,2,0,0,Math.PI*2);ctx.ellipse(9.5,-22,3.6,2,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#241b18';ctx.beginPath();ctx.ellipse(-6,-26,2.4,2.9,0,0,Math.PI*2);ctx.ellipse(6,-26,2.4,2.9,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-6.7,-27,1,0,Math.PI*2);ctx.arc(5.3,-27,1,0,Math.PI*2);ctx.fill();

function badge(label,x,y,side='ally',scale=1){

 ctx.restore();
}
function figure(x,y,label,side='ally',scale=1,pose=0,flip=false){
 const clean=cleanActorName(label||c.actor,side,c.scenarioId);
 const expr=pose>0.6?'serious':pose<-0.2?'worried':'normal';

 if(img){
  const h=74*scale,wImg=h*2/3,bob=Math.sin(pose||0)*2.5;
  ctx.save();ctx.translate(x,y+bob);
  ctx.fillStyle='rgba(4,12,19,.34)';ctx.beginPath();ctx.ellipse(0,11*scale,18*scale,5.5*scale,0,0,Math.PI*2);ctx.fill();

  ctx.drawImage(img,-wImg/2,14*scale-h,wImg,h);
  ctx.restore();
 }else{
  drawCuteVectorChibi(x,y,clean,side,scale,pose);
 }
 if(label)badge(label,x,y+Math.max(25,18*scale),side,scale);
}

getChibiSprite(secondaryActor,'ally','serious');

 const glow=ctx.createRadialGradient(400,285,30,400,285,310);

 if(secondaryActor&&secondaryActor!==primaryActor){

  ctx.beginPath();ctx.roundRect(322,188,156,74,12);ctx.fill();ctx.stroke();

  text(s.picked>=0?'已選論點，請配對依據':s.matched?.length?'已完成 '+s.matched.length+' 組論證':'由右側選取人物行動',400,244,12,color.paper);
  ctx.restore();
 }else{
  figure(400,275,primaryActor,'ally',2.45,bob,false);
 }
}

function ground(naval=false){const g=ctx.createLinearGradient(0,0,0,450);g.addColorStop(0,naval?'#203e55aa':'#28453baa');g.addColorStop(1,naval?'#173b4dbb':'#183a35bb');ctx.fillStyle=g;ctx.fillRect(0,0,800,450);ctx.strokeStyle='#a0b79b1c';ctx.lineWidth=1;for(let x=0;x<800;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,450);ctx.stroke();}for(let y=0;y<450;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(800,y);ctx.stroke();}}

function draw(s){if(disposed)return;ctx.clearRect(0,0,800,450);if(backdrop){const ratio=Math.max(800/backdrop.width,450/backdrop.height),ww=backdrop.width*ratio,hh=backdrop.height*ratio;ctx.drawImage(backdrop,(800-ww)/2,(450-hh)/2,ww,hh);}else{ctx.fillStyle='#172f3a';ctx.fillRect(0,0,800,450);}ctx.fillStyle='rgba(10,26,35,.28)';ctx.fillRect(0,0,800,450);

if(c.kind==='land'){ground();for(let n=0;n<40;n++){const x=70+n%8*80,y=35+Math.floor(n/8)*76,idx=s.targets.indexOf(n);ctx.fillStyle=n===s.source?'#6baab9':s.canals.includes(n)?'#558f9b':idx>=0?'#a99355':'#50684b';ctx.fillRect(x,y,72,66);ctx.strokeStyle='#a6b49c66';ctx.strokeRect(x,y,72,66);text(n===s.source?'水源':idx>=0?c.households[idx].name:s.canals.includes(n)?'渠':'土',x+36,y+38,14,n===s.source?color.night:color.paper);}text('田界依冊核定 · 戶數與水量為教學資料',400,440,15,color.gold);return;}
