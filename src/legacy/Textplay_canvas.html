<script>(function(w){'use strict';
function create(canvas,c){const ctx=canvas.getContext('2d'),sprites=new Map();let backdrop=null,disposed=false;
if(w.ZH?.assets?.get)Promise.resolve(w.ZH.assets.get(c.asset)).then(x=>{const src=typeof x==='string'?x:x?.url||x?.src;if(!src||disposed)return;const im=new Image();im.onload=()=>{if(!disposed)backdrop=im;};im.src=src;}).catch(()=>{});
const color={gold:'#e1bc66',jade:'#68baa4',red:'#d87565',paper:'#f0e3c2',night:'#122a35'};
function text(t,x,y,size=15,fill=color.paper,align='center'){ctx.fillStyle=fill;ctx.font='600 '+size+'px "PingFang TC","Microsoft JhengHei",sans-serif';ctx.textAlign=align;ctx.fillText(t,x,y);}
function figure(x,y,label,side='ally',scale=1,pose=0){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);const tone=side==='enemy'?color.red:color.jade;ctx.fillStyle='rgba(4,12,19,.35)';ctx.beginPath();ctx.ellipse(0,7,20,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=tone;ctx.beginPath();ctx.moveTo(-16,-13);ctx.lineTo(-22,5);ctx.lineTo(22,5);ctx.lineTo(16,-13);ctx.closePath();ctx.fill();ctx.fillStyle='#e8cfa6';ctx.beginPath();ctx.arc(0,-24,13,0,Math.PI*2);ctx.fill();ctx.fillStyle='#29353d';ctx.beginPath();ctx.arc(0,-28,14,Math.PI,Math.PI*2);ctx.fill();ctx.fillRect(-14,-30,28,5);ctx.fillStyle='#243139';ctx.fillRect(-6,-25,3,3);ctx.fillRect(4,-25,3,3);ctx.strokeStyle='#d7b45e';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(17,-14);ctx.lineTo(30+pose*10,-40+pose*10);ctx.stroke();ctx.restore();if(label)text(label,x,y+27,13,side==='enemy'?color.red:color.paper);}
function unit(u,selected,naval){if(selected){ctx.strokeStyle=color.gold;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(u.x,u.y+8,30,16,0,0,Math.PI*2);ctx.stroke();}if(naval){ctx.fillStyle=color.jade;ctx.beginPath();ctx.moveTo(u.x-30,u.y);ctx.quadraticCurveTo(u.x,u.y+33,u.x+30,u.y);ctx.closePath();ctx.fill();ctx.strokeStyle=color.paper;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(u.x,u.y);ctx.lineTo(u.x,u.y-35);ctx.lineTo(u.x+20,u.y-10);ctx.lineTo(u.x,u.y-10);ctx.stroke();text(u.name,u.x,u.y+40,13);}else figure(u.x,u.y,u.name,'ally',.85);ctx.fillStyle='#203c43';ctx.fillRect(u.x-20,u.y-48,40,4);ctx.fillStyle=color.jade;ctx.fillRect(u.x-20,u.y-48,40*u.hp/100,4);if(u.target){ctx.setLineDash([5,5]);ctx.strokeStyle='#d5bb7466';ctx.beginPath();ctx.moveTo(u.x,u.y);ctx.lineTo(u.target.x,u.target.y);ctx.stroke();ctx.setLineDash([]);}}
function ground(naval=false){const g=ctx.createLinearGradient(0,0,0,450);g.addColorStop(0,naval?'#203e55aa':'#28453baa');g.addColorStop(1,naval?'#173b4dbb':'#183a35bb');ctx.fillStyle=g;ctx.fillRect(0,0,800,450);ctx.strokeStyle='#a0b79b1c';ctx.lineWidth=1;for(let x=0;x<800;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,450);ctx.stroke();}for(let y=0;y<450;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(800,y);ctx.stroke();}}
function pin(x,y,label,fill=color.gold){ctx.fillStyle=fill+'33';ctx.strokeStyle=fill;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,28,0,Math.PI*2);ctx.fill();ctx.stroke();text(label,x,y+48,13,fill);}
function draw(s){if(disposed)return;ctx.clearRect(0,0,800,450);if(backdrop){const ratio=Math.max(800/backdrop.width,450/backdrop.height),ww=backdrop.width*ratio,hh=backdrop.height*ratio;ctx.drawImage(backdrop,(800-ww)/2,(450-hh)/2,ww,hh);}else{ctx.fillStyle='#172f3a';ctx.fillRect(0,0,800,450);}ctx.fillStyle='rgba(10,26,35,.28)';ctx.fillRect(0,0,800,450);
if(s.phase==='brief'||s.phase==='complete'||s.phase==='report'){figure(400,255,c.actor,'ally',3,Math.sin((s.time||0)*2)*.08);text(s.phase==='complete'?'行動已接上結果':s.phase==='report'?'看見後果':c.chapter,400,70,25,color.gold);return;}
if(c.kind==='tactics'||c.kind==='ambush'&&s.phase==='deploy'){ground(c.naval);const rule=c.kind==='tactics'?c.phases[s.stage].rule:'ambush';if(c.naval){ctx.fillStyle='#a4b29944';ctx.fillRect(0,0,115,450);text('西岸接應',62,32,16,color.gold);}else{ctx.fillStyle='#c5ad7055';ctx.fillRect(0,185,800,95);if(['seal','ally','close','ambush'].includes(rule)){ctx.fillStyle='#162a2c';for(const y of [0,310])for(let x=0;x<800;x+=110){ctx.beginPath();ctx.moveTo(x,y+100);ctx.lineTo(x+50,y);ctx.lineTo(x+110,y+100);ctx.fill();}text('山地隱蔽',400,40,14,color.jade);}}
if(rule==='retreat')for(const x of [110,145,180]){ctx.strokeStyle='#e1bc6699';ctx.setLineDash([7,7]);ctx.beginPath();ctx.moveTo(x,40);ctx.lineTo(x,420);ctx.stroke();ctx.setLineDash([]);}
if(rule==='threat'||rule==='recall'){pin(690,95,'邯鄲・魏主力',color.red);pin(690,365,'大梁・必救',color.gold);}
if(rule==='flank'||rule==='pincer'||rule==='discipline'){pin(620,85,'北側');pin(620,365,'南側');pin(480,220,'主隊');}
if(rule==='seal'||rule==='close'){pin(rule==='seal'?185:280,230,'西端');pin(rule==='seal'?680:590,230,'東端');}
if(rule==='ally'){pin(180,230,'姜戎接應');pin(250,100,'北側聯絡');}
if(rule==='allies')s.units.forEach((u,i)=>pin(370+i%2*75,65+i*70,u.name+'接應'));
if(rule==='halfCross'){ctx.fillStyle='#52839877';ctx.fillRect(420,0,140,450);text('楚軍渡河 '+Math.round((s.crossing||0)*100)+'%',490,45,16,color.gold);}
if(rule==='rally'&&!c.naval)pin(540,230,'收軍區');
(s.enemies||[]).forEach(e=>figure(e.x,e.y,'對方小隊','enemy',.85));s.units.forEach((u,i)=>unit(u,i===s.selectedUnit,c.naval));if(c.kind==='ambush')text(s.localTime>=8?'暮至，可待機發伏':'等待暮至 '+Math.max(0,8-Math.floor(s.localTime)),400,430,17,color.gold);return;}
if(c.kind==='journey'){ground();const sc=c.scenes[s.stage];ctx.fillStyle='#a5b39922';ctx.fillRect(0,330,800,90);for(const r of s.walls||[]){ctx.fillStyle='#1b2e31';ctx.fillRect(r.x,r.y,r.w,r.h);ctx.strokeStyle='#a7b1a151';ctx.strokeRect(r.x,r.y,r.w,r.h);}for(const g of s.guards||[]){ctx.fillStyle='#e8bd5933';ctx.beginPath();ctx.moveTo(g.x,g.y);ctx.arc(g.x,g.y,g.range,g.a-.42,g.a+.42);ctx.closePath();ctx.fill();figure(g.x,g.y,'巡燈','enemy',.7);}for(const it of s.items||[]){const done=s.localFound.includes(it.id);pin(it.x,it.y,it.name,done?color.jade:color.gold);if(done)text('✓',it.x,it.y+6,25,color.jade);}pin(s.exit.x,s.exit.y,'接續下一幕',color.jade);if(s.path.length){ctx.setLineDash([5,6]);ctx.strokeStyle='#d9c17a99';ctx.beginPath();ctx.moveTo(s.player.x,s.player.y);s.path.forEach(p=>ctx.lineTo(p.x,p.y));ctx.stroke();ctx.setLineDash([]);}figure(s.player.x,s.player.y,'你','ally',.95);text(sc.name+' · '+sc.actor,20,30,18,color.paper,'left');return;}
if(c.kind==='assault'||c.kind==='raid'){ground();ctx.save();ctx.scale(.8,1);ctx.fillStyle='#a19e6e55';ctx.fillRect(0,385,1000,65);ctx.strokeStyle='#d9c07b';ctx.setLineDash([6,8]);ctx.beginPath();ctx.moveTo(910,55);ctx.lineTo(910,410);ctx.stroke();ctx.setLineDash([]);text('接應通路',910,45,16,color.gold);if(s.cart.hp>0){ctx.fillStyle='#ac784e';ctx.fillRect(s.cart.x-30,325,60,45);ctx.fillStyle='#d9bd7d';ctx.fillRect(s.cart.x-25,310,50,20);ctx.fillStyle='#213139';for(const x of [-20,20]){ctx.beginPath();ctx.arc(s.cart.x+x,375,12,0,Math.PI*2);ctx.fill();}text('甬道障礙',s.cart.x,290,16);ctx.fillStyle=color.red;ctx.fillRect(s.cart.x-35,298,s.cart.hp/90*70,4);}else text('通路已開',500,320,18,color.jade);for(const e of s.enemies)if(e.hp>0)figure(e.x,e.y,'阻攔分隊','enemy',1);figure(s.escort.x,s.escort.y,'接應後隊','ally',1);figure(s.player.x,s.player.y,'突破分隊','ally',1.1,s.player.cool>0?1:0);if(s.player.block){ctx.strokeStyle=color.gold;ctx.lineWidth=5;ctx.beginPath();ctx.arc(s.player.x+12,s.player.y-30,28,-1.5,1.5);ctx.stroke();}ctx.restore();text('第 '+(s.stage+1)+' 段 · 打通後仍須發旗令接應',22,30,17,color.gold,'left');return;}
if(c.kind==='land'){ground();for(let n=0;n<40;n++){const x=70+n%8*80,y=35+Math.floor(n/8)*76,idx=s.targets.indexOf(n);ctx.fillStyle=n===s.source?'#6baab9':s.canals.includes(n)?'#558f9b':idx>=0?'#a99355':'#50684b';ctx.fillRect(x,y,72,66);ctx.strokeStyle='#a6b49c66';ctx.strokeRect(x,y,72,66);text(n===s.source?'水源':idx>=0?c.households[idx].name:s.canals.includes(n)?'渠':'土',x+36,y+38,14,n===s.source?color.night:color.paper);}text('田界依冊核定 · 戶數與水量為教學資料',400,440,15,color.gold);return;}
if(c.kind==='horses'){ground();const pairing=s.pairing||[],race=s.race||0,t=s.phase==='race'?(s.localTime||0)/4:s.phase==='raceReport'?1:0;for(let i=0;i<3;i++){const y=90+i*120;ctx.fillStyle='#b1a77e44';ctx.fillRect(40,y,720,75);text(['上駟場','中駟場','下駟場'][i],75,y-10,15,color.gold);const won=(3-(pairing[i]??0))>(3.2-i),active=i===race;const x1=active?100+t*(won?570:505):i<race?670:100,x2=active?100+t*(won?505:570):i<race?650:100;figure(x1,y+24,'田忌 '+(pairing[i]===null?'待配':['上','中','下'][pairing[i]]),'ally',.8);figure(x2,y+63,'齊王 '+['上','中','下'][i],'enemy',.8);}return;}
if(c.kind==='music'&&s.phase==='music'){ground();const lanes=['宮','商','角','徵','羽'];for(let i=0;i<5;i++){const x=105+i*145;ctx.strokeStyle='#d6bf6e44';ctx.beginPath();ctx.moveTo(x,35);ctx.lineTo(x,405);ctx.stroke();text(lanes[i],x,432,20,color.gold);}ctx.strokeStyle=color.gold;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(40,355);ctx.lineTo(760,355);ctx.stroke();for(const n of s.notes)if(!n.resolved){const y=355-(n.due-s.musicTime)*95;if(y>0&&y<405){ctx.fillStyle=n.hit?color.jade:color.gold;ctx.beginPath();ctx.arc(105+n.lane*145,y,14,0,Math.PI*2);ctx.fill();}}text('教學配樂 · 節奏與評語理解分列',400,28,16,color.paper);return;}
if(c.kind==='chorus'){ground();ctx.fillStyle='#0b1628bb';ctx.fillRect(0,0,800,450);const spots=[[400,75],[665,220],[400,365],[135,220]];spots.forEach(([x,y],i)=>{pin(x,y,['東方楚音','南方楚音','西方楚音','北方楚音'][i],(s.heard||[]).includes(i)?color.jade:color.gold);});figure(400,240,'項羽','ally',2);text('聽見鄉音，尚未等於查證楚地歸屬',400,430,17,color.paper);return;}
if(c.kind==='siege'){ground();ctx.fillStyle='#39788cbb';ctx.fillRect(0,450-s.resources.water*3,800,s.resources.water*3);ctx.fillStyle='#a19773';ctx.fillRect(220,160,360,200);for(let x=220;x<580;x+=45)ctx.fillRect(x,140,25,25);text('晉陽',400,210,28,color.night);figure(400,310,'守城者','ally',1.8);pin(100,90,s.contact.han?'韓已答應':'韓');pin(700,90,s.contact.wei?'魏已答應':'魏');text(s.coordinated?'內外接應已約定':'守城，爭取共同反制的時間',400,395,18,color.gold);return;}
if(c.kind==='ambush'){ground();text('第 '+(s.day+1)+' 日・竈跡',400,80,26,color.gold);const n=s.cooks||10;for(let i=0;i<n;i++){const x=140+i%5*125,y=180+Math.floor(i/5)*100;ctx.fillStyle='#ac825d';ctx.fillRect(x-22,y-15,44,30);ctx.fillStyle='#dfa86a';ctx.beginPath();ctx.arc(x,y,10,0,Math.PI*2);ctx.fill();}text('竈數減少 ≠ 實際兵力流失',400,420,18,color.paper);return;}
const r=s.resources;if(r){ground();Object.entries(r).forEach(([key,v],i)=>{const x=135+i%4*170;ctx.fillStyle='#d9bd7825';ctx.fillRect(x-50,145,100,200);ctx.fillStyle=[color.jade,color.gold,color.red,'#8ba6cf'][i%4];ctx.fillRect(x-50,345-clamp(v,0,100)*2,100,clamp(v,0,100)*2);text(({food:'糧食',people:'民生',army:'整備',alert:'吳方戒心',morale:'士氣',rumor:'未澄清消息'})[key]||key,x,385,16);text(String(Math.round(v)),x,125,25,color.gold);});return;}
figure(400,290,c.actor,'ally',2.5);text(c.title,400,65,23,color.gold);}
function point(clientX,clientY){const r=canvas.getBoundingClientRect();return{x:(clientX-r.left)*800/r.width,y:(clientY-r.top)*450/r.height};}
function dispose(){disposed=true;backdrop=null;sprites.clear();}return{draw,point,dispose};}
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
w.TextplayCanvas={version:'3.0.0',create};
})(window);
</script>
