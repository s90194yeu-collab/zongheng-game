<script>
(function(ZH){
  'use strict';
  const scene=document.getElementById('hub-scene'),button=document.getElementById('hub-scene-motion'),title=document.getElementById('hub-scene-title');
  const media=matchMedia('(prefers-reduced-motion: reduce)'),fine=matchMedia('(hover:hover) and (pointer:fine)');
  let enabled=ZH.local.get('hubSceneMotion',true)!==false,volume='cq',raf=0,x=0,y=0,suspended=false,disposed=false;
  const active=()=>enabled&&!media.matches&&!suspended&&!document.hidden&&!disposed;
  function flush(){raf=0;if(!active()||!fine.matches)return;scene.style.setProperty('--hub-x',x.toFixed(3));scene.style.setProperty('--hub-y',y.toFixed(3));scene.style.setProperty('--hub-scroll',Math.min(scrollY,700)*.02+'px');}
  function schedule(){if(active()&&fine.matches&&!raf)raf=requestAnimationFrame(flush);}
  function update(){const animate=active();scene.classList.toggle('is-static',!animate);button.disabled=media.matches;button.setAttribute('aria-pressed',String(animate));button.textContent=media.matches?'靜態場景':'景深動態：'+(enabled?'開':'關');button.title=media.matches?'依照裝置的減少動畫設定，使用靜態場景。':'切換場景的雲霧與景深動態';if(!animate){if(raf)cancelAnimationFrame(raf);raf=0;scene.style.removeProperty('--hub-x');scene.style.removeProperty('--hub-y');scene.style.removeProperty('--hub-scroll');}else schedule();}
  function move(e){if(e.pointerType==='touch')return;x=e.clientX/Math.max(innerWidth,1)*2-1;y=e.clientY/Math.max(innerHeight,1)*2-1;schedule();}
  function setVolume(key){volume=['cq','zg','ch','zz','gw'].includes(key)?key:'cq';document.body.style.setProperty('--hub-art-active','var(--hub-art-'+volume+')');scene.dataset.volume=volume;title.textContent={cq:'春秋・爭盟之境',zg:'戰國・縱橫之境',ch:'楚漢・逐鹿之境',zz:'先秦・諸子之境',gw:'古文・十五篇之境'}[volume];}
  function setEnabled(value){enabled=!!value;ZH.local.set('hubSceneMotion',enabled);update();}
  const change=()=>update(),hide=e=>{suspended=true;update();if(!e.persisted){disposed=true;window.removeEventListener('pointermove',move);window.removeEventListener('scroll',schedule);document.removeEventListener('visibilitychange',change);media.removeEventListener('change',change);fine.removeEventListener('change',change);}},show=()=>{if(!disposed){suspended=false;update();}};
  button.onclick=()=>setEnabled(!enabled);window.addEventListener('pointermove',move,{passive:true});window.addEventListener('scroll',schedule,{passive:true});document.addEventListener('visibilitychange',change);media.addEventListener('change',change);fine.addEventListener('change',change);window.addEventListener('pagehide',hide);window.addEventListener('pageshow',show);
  setVolume(ZH.local.get('hubVol','cq'));update();
  ZH.hubScene={version:'v0.1.0',setVolume,setEnabled,get state(){return {volume,enabled,reduced:media.matches,active:active(),disposed};}};
})(window.ZH);
</script>

<script>
(function () {
  'use strict';

  const STAT_LABELS = [['history', '史識'], ['letters', '文辭'], ['strategy', '謀略'], ['virtue', '德望'], ['erudition', '博通']];
  const MODE_LABELS = { history: '正史', romance: '演義' };
  const SLOT_LABELS = { qin: '秦國篇', jin: '晉國篇' };   // 同一劇本不同陣營的存檔（模式寫成 history:qin）
  const modeLabel = mode => {
    const [base, slot] = String(mode || '').split(':');
    return (MODE_LABELS[base] || base) + (slot ? '・' + (SLOT_LABELS[slot] || slot) : '');
  };
  const state = { level: 'bio', vol: ZH.local.get('hubVol', 'cq'), profile: null, completed: {}, saves: [] };
  // 天下大地圖（目前開放的卷）：?page=map&w=卷代碼
  const WORLDS = {
    cq: { title: '天下大地圖・春秋爭盟', span: '七個分期・前770至前496開局', lead: '選列國、養民備糧、行軍外交、親定盟約；訪古接續全卷十八話，把表現帶回地圖。' },
    zg: { title: '天下大地圖・戰國縱橫', span: '六個分期・前403至前230開局', lead: '選七雄、推國策、親分盟糧、維持合縱或連橫；十三話體驗成果帶回地圖。' },
    ch: { title: '天下大地圖・楚漢逐鹿', span: '前 206 — 前 202', lead: '選一個勢力，在大地圖上內政、出兵、外交；史實事件發生時，進入各話劇本，把成績帶回大地圖換成計策卡。' }
  };
  const WORLD_ICON = '<svg viewBox="0 0 76 76" aria-hidden="true"><rect x="3" y="3" width="70" height="70" rx="14" fill="#e7d9b0" stroke="#e0b44c" stroke-width="2"/>' +
    '<path d="M3 30 C20 24 30 36 46 30 S66 22 73 26" fill="none" stroke="#4f7397" stroke-width="3"/><path d="M10 58 L22 44 L30 52 L40 40 L52 54" fill="none" stroke="#8a7350" stroke-width="2.5"/>' +
    '<path d="M18 16 V30 M18 16 h12 l-3 4 l3 4 h-12" fill="#c4473a" stroke="#2b2418" stroke-width="1.5"/><path d="M52 40 V54 M52 40 h12 l-3 4 l3 4 h-12" fill="#d0a03a" stroke="#2b2418" stroke-width="1.5"/>' +
    '<path d="M24 36 Q38 30 50 46" fill="none" stroke="#2b2418" stroke-width="2" stroke-dasharray="3 3"/></svg>';
  if (!ZH.VOLUMES.some(v => v.key === state.vol)) state.vol = 'cq';

  // ───────── 帳號區 ─────────
  function renderAccount() {
    const box = document.getElementById('hub-account');
    box.innerHTML = '';
    if (ZH.isSchool()) {
      const p = state.profile;
      const name = ZH.player?ZH.player.name():p&&p.displayName||'策士';
      box.appendChild(ZH.html('<span class="zh-chip zh-chip--gilt" title="' + ZH.esc(ZH.user.email) + '">' + ZH.esc(name) + '</span>'));
      if (ZH.user.isTeacher) {
        const t = ZH.html('<button type="button" class="zh-btn zh-btn--quiet zh-btn--sm">教師後臺</button>');
        t.addEventListener('click', () => ZH.go('teacher'));
        box.appendChild(t);
      }
    } else {
      box.appendChild(ZH.html('<span class="zh-chip">訪客</span>'));
      const login = ZH.html('<button type="button" class="zh-btn zh-btn--primary zh-btn--sm">登入學校帳號</button>');
      login.addEventListener('click', ZH.login);
      box.appendChild(login);
    }
    const sound = ZH.html('<button type="button" class="zh-btn zh-btn--quiet zh-btn--sm" aria-pressed="' + ZH.settings.sound + '">音效：' + (ZH.settings.sound ? '開' : '關') + '</button>');
    sound.addEventListener('click', () => {
      ZH.setSetting('sound', !ZH.settings.sound);
      renderAccount();
      ZH.sfx('bell');
    });
    box.appendChild(sound);
  }

  // 首頁只顯示摘要；學號、名稱、外觀與技能在個人頁面編輯。
  function radar(stats){
    const c=[110,91],r=58,point=(i,scale)=>{const a=(-90+i*72)*Math.PI/180;return [c[0]+Math.cos(a)*r*scale,c[1]+Math.sin(a)*r*scale];},pts=scale=>STAT_LABELS.map((x,i)=>point(i,scale).map(n=>n.toFixed(1)).join(',')).join(' ');
    const values=STAT_LABELS.map(([k])=>Math.max(0,Math.min(100,Math.round(Number(stats&&stats[k])||0))));
    return '<svg class="hub-radar" viewBox="0 0 220 175" role="img" aria-label="五維能力，滿分100：'+STAT_LABELS.map((x,i)=>x[1]+' '+values[i]).join('，')+'"><g fill="none" stroke="#75878b" stroke-opacity=".32">'+[.25,.5,.75,1].map(n=>'<polygon points="'+pts(n)+'"/>').join('')+STAT_LABELS.map((x,i)=>'<path d="M110 91L'+point(i,1).join(' ')+'"/>').join('')+'</g><polygon points="'+values.map((v,i)=>point(i,v/100).map(n=>n.toFixed(1)).join(',')).join(' ')+'" fill="#6da68e" fill-opacity=".3" stroke="#b9d7a5" stroke-width="2"/>'+STAT_LABELS.map((x,i)=>{const p=point(i,1.36);return '<text x="'+p[0].toFixed(1)+'" y="'+p[1].toFixed(1)+'" text-anchor="middle" fill="#e6d8ba" font-size="12">'+x[1]+' '+values[i]+'</text>';}).join('')+'</svg>';
  }
  function renderWelcome(){
    const box=document.getElementById('hub-welcome'),player=ZH.player&&ZH.player.profile,p=state.profile;
    if(!p&&!ZH.isGuest()){box.innerHTML='<p class="zh-dim">正在讀取策士資料……</p>';return;}
    box.innerHTML='<div class="hub-summary"><div class="hub-identity"><a class="hub-avatar" href="'+ZH.esc(ZH.url('profile'))+'" aria-label="前往我的策士">'+(ZH.player?ZH.player.avatar(player&&player.avatarId,player&&player.appearance):'')+'</a><div><span class="hub-kicker">我的策士</span><h2>'+ZH.esc(ZH.player?ZH.player.name():p&&p.displayName||'策士')+'</h2><span class="zh-chip zh-chip--gilt">'+ZH.esc(p&&p.rank||'布衣')+'</span><a class="hub-profile-link" href="'+ZH.esc(ZH.url('profile'))+'">個人頁面・紙娃娃 →</a></div></div>'+radar(p&&p.stats)+codexButton()+'</div>'+(ZH.isGuest()?'<p class="hub-guest-note">訪客可體驗課綱選文四關；登入學校帳號可保存進度。</p>':'');
    bindCodexButton();
  }

  // ───────── 史冊圖鑑入口 ─────────
  function codexButton() {
    const total = ZH.CODEX.length;
    const set = ZH.codexBook.unlockedSet();
    const got = ZH.CODEX.filter(it => set[ZH.codexKey(it)]).length;
    const pct = total ? (100 * got) / total : 0;
    return '<button type="button" class="hub-codex" id="hub-codex">' +
      '<span class="hub-codex__glyph" aria-hidden="true">冊</span>' +
      '<span><strong>史冊圖鑑</strong><span class="zh-bar" aria-hidden="true"><span style="--v:' + pct.toFixed(1) + '%"></span></span></span>' +
      '<span class="hub-codex__n">已收集 ' + got + ' / ' + total + '</span>' +
      '</button>';
  }
  function bindCodexButton() {
    const btn = document.getElementById('hub-codex');
    if (btn) btn.addEventListener('click', () => ZH.go('gallery'));
  }

  // ───────── 繼續遊戲 ─────────
  function renderContinue(saves) {
    const section = document.getElementById('hub-continue');
    const list = document.getElementById('hub-saves');
    const worlds = (saves || []).filter(save => save.scenarioId === 'campaign' && /^romance:/.test(save.mode) && WORLDS[save.mode.split(':')[1]]);
    const items = (saves || [])
      .map(save => ({ save: save, scenario: ZH.findScenario(save.scenarioId) }))
      .filter(x => x.scenario)
      .slice(0, 3);
    if (!items.length && !worlds.length) {
      section.hidden = true;
      return;
    }
    list.innerHTML = '';
    worlds.slice(0, 3).forEach(save => {
      const key = save.mode.split(':')[1];
      const btn = ZH.html(
        '<button type="button" class="hub-save">' +
        '<span class="zh-chip zh-chip--gilt">天下大地圖</span>' +
        '<strong>' + ZH.esc(WORLDS[key].title.replace('天下大地圖・', '')) + '</strong>' +
        '<span class="zh-dim zh-small">存檔於 ' + ZH.esc(save.savedAt) + '</span>' +
        '</button>'
      );
      btn.addEventListener('click', () => { ZH.sfx('click'); ZH.go('map', { w: key }); });
      list.appendChild(btn);
    });
    items.forEach(({ save, scenario }) => {
      const btn = ZH.html(
        '<button type="button" class="hub-save">' +
        '<span class="zh-chip zh-chip--gilt">' + ZH.esc(ZH.episodeLabel(scenario)) + '</span>' +
        '<strong>' + ZH.esc(scenario.name) + '</strong>' +
        '<span class="zh-chip">' + ZH.esc(modeLabel(save.mode)) + '</span>' +
        '<span class="zh-dim zh-small">存檔於 ' + ZH.esc(save.savedAt) + '</span>' +
        '</button>'
      );
      btn.addEventListener('click', () => openScenario(scenario, save.mode));
      list.appendChild(btn);
    });
    section.hidden = false;
  }

  // ───────── 三卷目錄 ─────────
  function renderTabs() {
    if(window.ZH_STATIC_MEDIA&&ZH_STATIC_MEDIA['scene:zhuzi_laozi'])document.body.style.setProperty('--hub-art-zz','url("'+ZH_STATIC_URL(ZH_STATIC_MEDIA['scene:zhuzi_laozi'])+'")');
    if(window.ZH_STATIC_MEDIA&&ZH_STATIC_MEDIA['scene:classic_study'])document.body.style.setProperty('--hub-art-gw','url("'+ZH_STATIC_URL(ZH_STATIC_MEDIA['scene:classic_study'])+'")');
    const tabs = document.getElementById('hub-tabs');
    tabs.innerHTML = '';
    ZH.VOLUMES.forEach(vol => {
      const tab = ZH.html(
        '<button type="button" class="hub-tab" role="tab" id="hub-tab-' + vol.key + '" aria-selected="' + (vol.key === state.vol) + '">' +
        '<span class="hub-tab__image" aria-hidden="true" style="--hub-card-art:var(--hub-art-'+(['cq','zg','ch','zz','gw'].includes(vol.key)?vol.key:'cq')+')"></span><span class="hub-tab__no">'+ZH.esc(vol.no)+'</span><span>'+ZH.esc(vol.name)+'</span><small>'+ZH.esc(vol.span)+'</small></button>'
      );
      tab.addEventListener('click', () => {
        if (state.vol === vol.key) return;
        state.vol = vol.key;
        ZH.local.set('hubVol', vol.key);
        ZH.sfx('click');
        renderTabs();
        renderEpisodes();
      });
      tabs.appendChild(tab);
    });
  }

  function renderEpisodes() {
    const vol = ZH.VOLUMES.find(v => v.key === state.vol);
    if(ZH.hubScene)ZH.hubScene.setVolume(vol.key);
    const scenarios = ZH.scenariosOf(vol.key);
    if(vol.key==='zz'&&window.ZH_STATIC_URL){document.body.style.setProperty('--hub-art-zz','url("'+ZH_STATIC_URL(ZH_STATIC_MEDIA['scene:zhuzi_laozi'])+'")');}
    const readyCount = scenarios.filter(s => s.status === 'ready').length;

    document.getElementById('hub-vol-head').innerHTML =
      '<p>〜' + ZH.esc(vol.tagline) + '〜</p>' +
      '<span class="zh-dim zh-small">' + scenarios.length + (vol.key==='gw'?' 篇，已開放 ':' 話，已開放 ') + readyCount + (vol.key==='gw'?' 篇':' 話') + '</span>';

    const wbox = document.getElementById('hub-world');
    const w = WORLDS[vol.key];
    wbox.innerHTML = '';
    if(vol.key==='gw'){wbox.innerHTML='<p class="gw-guide">依教育部課綱十五篇整理。四篇沿用既有關卡與進度，十一篇新增角色任務。可先開啟原文，再進入情境挑戰。</p>';}
    if(vol.key==='zz'){
      wbox.innerHTML='<div class="zz-hub-levels"><p>六位諸子，各有獨立的初階傳記與進階選讀。可依課程直接選關。</p><div class="zh-row">'+['bio','read'].map(k=>'<button type="button" class="zh-btn '+(state.level===k?'zh-btn--primary':'zh-btn--quiet')+'" data-level="'+k+'" aria-pressed="'+(state.level===k)+'">'+(k==='bio'?'初階・人物傳記':'進階・思想閱讀')+'</button>').join('')+'</div></div>';
      wbox.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{state.level=b.dataset.level;renderEpisodes();});
    }
    if (w) {
      const wb = ZH.html('<button type="button" class="hub-world">' + WORLD_ICON + '<span><strong>' + ZH.esc(w.title) + '</strong><small>' + ZH.esc(w.span) + '・' + ZH.esc(w.lead) + '</small></span><span class="hub-ep__state">進入大地圖</span></button>');
      wb.addEventListener('click', () => { ZH.sfx('click'); ZH.go('map', { w: vol.key }); });
      wbox.appendChild(wb);
    }

    const list = document.getElementById('hub-eps');
    list.setAttribute('aria-labelledby', 'hub-tab-' + vol.key);
    list.innerHTML = '';
    scenarios.filter(s=>vol.key!=='zz'||s.level===state.level).forEach((s,index) => {
      const cardArt=s.scene&&window.ZH_STATIC_MEDIA&&ZH_STATIC_MEDIA[s.scene]?'url("'+ZH_STATIC_URL(ZH_STATIC_MEDIA[s.scene])+'")':'var(--hub-art-'+vol.key+')';
      const locked = !ZH.canPlay(s.id);
      const ready = s.status === 'ready';
      const done=state.completed[s.id];
      const stateText = locked ? '登入後解鎖' : (ready ? (done?'已完成・再挑戰':'開始') : '製作中');
      const li = document.createElement('li');
      const btn = ZH.html(
        '<button type="button" class="hub-ep' + (locked ? ' is-locked' : '') + '">' +
        '<span class="hub-ep__art" aria-hidden="true" style="--hub-card-art:'+ZH.esc(cardArt)+';--hub-crop:'+([20,50,80][index%3])+'%"><span class="hub-ep__emblem">'+ZH.esc(String(s.name||'史').slice(0,1))+'</span><span class="hub-ep__no">' + ZH.esc(ZH.episodeLabel(s)) + '</span></span>' +
        '<span>' +
        '<span class="hub-ep__title">' + ZH.esc(s.episode) + '</span>' +
        '<span class="hub-ep__meta">' +
        '<span class="zh-chip">' + ZH.esc(s.name) + '</span>' +
        '<span class="zh-chip">' + ZH.esc(s.period||('前 '+s.year+' 年')) + '</span>' +
        '<span class="zh-chip zh-chip--patina">' + ZH.esc(s.genre) + '</span>' +
        (s.guest ? '<span class="zh-chip zh-chip--gilt">課綱選文・訪客可玩</span>' : '') +
        (vol.key==='gw'?'<span class="zh-chip">'+ZH.esc(s.author)+'</span><span class="zh-chip zh-chip--patina">'+(s.classicReuse?'沿用原關卡':'新增課文任務')+'</span>':'') +
        (done?'<span class="zh-chip zh-chip--patina">通關 '+(done.count||1)+' 局'+(done.pending?'・待選紀錄':'')+'</span>':'')+
        '</span><span class="pl-texts">文本：'+ZH.learningTexts(s.id).map(ZH.esc).join('、')+'</span><span>'+ 
        '</span></span>' +
        '<span class="hub-ep__state">' + stateText + '</span>' +
        '</button>'
      );
      btn.setAttribute('aria-label', ZH.episodeLabel(s) + ' ' + s.name + '：' + s.episode + '（' + stateText + '）');
      btn.addEventListener('click', () => openScenario(s));
      li.appendChild(btn);
      if(vol.key==='gw'){const read=ZH.html('<button type="button" class="zh-btn gw-reader">閱讀〈'+ZH.esc(s.classicTitle||s.name)+'〉原文</button>');read.onclick=()=>{const t=ZH.CLASSICS.library[s.id];ZH.modal({title:t.title+'・原文閱讀',body:'<p>'+ZH.esc(t.author)+' · '+ZH.esc(t.period)+'</p><p>'+ZH.esc(t.focus)+'</p>'+t.fullText.map(p=>'<p class="gw-fulltext">'+ZH.esc(p)+'</p>').join('')+'<p>原文依國語文學科中心所收版本，標點與字形可能和課本略異。<a target="_blank" rel="noopener noreferrer" href="'+ZH.esc(t.url)+'">核對來源</a></p>',actions:[{label:'收起原文',value:false,kind:'quiet'},{label:'進入本篇關卡',value:true,kind:'primary'}]}).then(go=>{if(go)openScenario(s);});};li.appendChild(read);}
      list.appendChild(li);
    });
  }

  // ───────── 進入劇本 ─────────
  function openScenario(s, mode) {
    ZH.sfx('click');
    if (!ZH.canPlay(s.id)) {
      ZH.modal({
        title: '這一話要先登入',
        body: '<p>「' + ZH.esc(s.name) + '」需要學校帳號才能遊玩。用學校發的 Google 帳號登入後，就能解鎖全部劇本並保存成績。</p>',
        actions: [
          { label: '先看看別的', value: false, kind: 'quiet' },
          { label: '登入學校帳號', value: true, kind: 'primary' }
        ]
      }).then(go => { if (go) ZH.login(); });
      return;
    }
    if (s.status !== 'ready') {
      ZH.toast('「' + s.name + '」還在製作中，完成後會在這裡開放。');
      return;
    }
    if(ZH.isSchool()&&!ZH.user.isTeacher&&(!state.profile||!/^\d{4,12}$/.test(state.profile.studentId||''))){ZH.go('profile',{tab:'identity',returnPage:s.id,mode:mode||''});return;}
    if(state.completed[s.id]&&!mode){ZH.modal({title:s.name+'・已完成',body:'<p>已保存通關紀錄。再挑戰會另開一局，完成後比較兩次表現，再選擇取代或都保留。</p>',actions:[{label:'收起',value:'stay',kind:'quiet'},{label:'查看通關紀錄',value:'review',kind:'quiet'},{label:'另開新局',value:'replay',kind:'primary'}]}).then(async v=>{if(v==='review'){ZH.session.remove('result:'+s.id);ZH.go('result',{s:s.id});}if(v==='replay')try{await ZH.runs.restart(s.id,'history');}catch(e){ZH.toast(e.message,'bad');}});return;}
    ZH.go(s.id, mode ? { mode: mode } : null);
  }

  // ───────── 頁尾 ─────────
  function renderFoot() {
    document.getElementById('hub-foot').innerHTML =
      'Re:縱橫鼎業　程式 ' + ZH.esc(ZH.boot.version || '') + '　介面 ' + ZH.esc(ZH.VERSION) +
      (ZH.user.isTeacher
        ? '　<a href="' + ZH.esc(ZH.url('result', { s: 'S_cq08_weizheng', demo: '1' })) + '">結算頁示範</a>' +
          '　<a href="' + ZH.esc(ZH.url('diag')) + '">連線測試</a>'
        : '');
  }


  async function refreshProgress(){try{const r=await ZH.runs.progress();state.completed=r.completed||{};state.saves=r.saves||[];renderContinue(state.saves);renderEpisodes();}catch(e){ZH.toast(e.message,'bad');}}
  function refreshAfterRecords() {
    if (ZH.isSchool()) { refreshProgress(); ZH.call('api_getStudentProfile').then(res=>{if(res&&res.ok){state.profile=res.profile;renderWelcome();}}); }
  }
  document.addEventListener('zh:collection-change', () => { renderWelcome(); renderAccount();renderFoot(); });
  document.addEventListener('zh:records-change', refreshAfterRecords);

  document.addEventListener('zh:player-change',()=>{renderAccount();renderWelcome();});
  // ───────── 啟動 ─────────
  ZH.ready(() => {
    document.getElementById('hub-mark').addEventListener('click', e => {
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    if(ZH.isGuest())refreshProgress();
    if(ZH.player)ZH.player.load().then(renderWelcome).catch(e=>ZH.toast(e.message,'bad'));
    renderAccount();
    renderWelcome();
    renderTabs();
    renderEpisodes();
    renderFoot();
    ZH.codex.init().then(() => {
      const btn = document.getElementById('hub-codex');
      if (!btn) return;
      btn.replaceWith(ZH.html(codexButton()));
      bindCodexButton();
    });

    if (ZH.isSchool()) {
      ZH.call('api_getStudentProfile')
        .then(res => {
          if (res && res.ok && res.profile) {
            state.profile = res.profile;ZH.rememberStudentProfile(res.profile);
            ZH.user.isTeacher = !!res.isTeacher || !!(ZH.access.state && ZH.access.state.isTeacher);
            renderAccount();
            renderWelcome();
            renderFoot();
          } else {
            document.getElementById('hub-welcome').innerHTML = '<div class="zh-panel"><p>讀不到策士資料，請重新整理頁面。</p></div>';
          }
        })
        .catch(err => ZH.toast(err.message, 'bad'));

      refreshProgress();
    }
  });
})();
</script>
</body>
</html>
