function snapshot(snap,live){
  const v=live.vars||{};snap.vars=snap.vars||{};
  const completedAway=id=>{const k={kz_zhouyou:'journey',kz_jueliang:'hunger',wen_kz_weibian:'bamboo'}[id],node={journey:'n_05',hunger:'n_14',bamboo:'n_23'}[k];return node&&snap.node!==node&&snap.vars[k]?.completed;};
  for(const key of ['schema','runId','firstAnchors','choices','submitted','finishPayload'])if(v[key]!==undefined)snap.vars[key]=copy(v[key]);
  if(Number.isFinite(live.rng))snap.rng=live.rng;
  // Completed attempts resume from Arena's result card; their working decks
  // need not occupy cloud saves. Keep the active attempt, first/best results
  // and all required-operation evidence, including assisted actions.
  for(const key of Object.keys(snap.progress||{})){
    if(/^arena:(kz_zhouyou|kz_jueliang|wen_kz_weibian)$/.test(key)){
      // An ended run resumes straight into onEnd. Its complete first/best
      // evidence is already in vars and finishPayload, and scores in games.
      if(snap.ended||completedAway(key.slice(6))){delete snap.progress[key];continue;}
      const ar=snap.progress[key];
      // Arena resumes from ar.first; best/last also carry identical copies.
      // Drop only those redundant references in the serialized snapshot.
      if(ar?.first){if(ar.best)delete ar.best.first;if(ar.last)delete ar.last.first;}
    }
    const m=key.match(/^(kz_zhouyou|kz_jueliang|wen_kz_weibian):(\d+)$/);if(!m)continue;
    if(snap.ended||completedAway(m[1])){delete snap.progress[key];continue;}
    const ar=snap.progress['arena:'+m[1]];
    if(ar?.last&&(!ar.active||Number(m[2])<Number(ar.tries)))delete snap.progress[key];
  }
  if(snap.ended&&snap.vars.finishPayload){
    // After submission, full first/best and manual-operation evidence lives
    // once in finishPayload.experience. Keep validation and score summaries.
    for(const key of ['journey','hunger','bamboo']){
      const r=snap.vars[key];if(!r)continue;
      snap.vars[key]={completed:r.completed,firstScore:r.firstScore,firstMax:r.firstMax,score:r.score,max:r.max,passed:r.passed,assisted:r.assisted,guideSteps:r.guideSteps};
    }
  }
}

 });

 if(s.phase==='intermission')return paper('下一輪・'+m.current().title,'這輪'+m.current().limits+'秒。先整理心緒，再親開始編簡。')+'<button class="zh-btn zh-btn--primary" data-begin>親開始下一輪</button>';
 if(s.phase==='report')return paper(m.current().source,m.current().pieces.join(''))+'<p class="kz-follow">'+E(m.current().sense)+'</p><button class="zh-btn zh-btn--primary" data-next>讀畢，'+(s.cursor===2?'回到講學':'下一輪')+'</button>';
 if(s.phase==='seal')return paper('三輪十四片已親編','韋為編簡的皮繩，絕為斷。勤讀不是只求快，你已重新讀過三句的意思。')+'<button class="zh-btn zh-btn--primary" data-seal>親綁好簡冊，回到講學</button>';
 const q=m.current();return paper('第'+(s.cursor+1)+'輪・'+q.title,s.assisted?q.sense:'看已綁的簡，把下一片接到正確的位置。')+'<div class="kz-bound">'+m.indices().map(k=>'<span>'+E(q.pieces[Number(k.split('_')[1])])+'</span>').join('')+'</div><div class="kz-cards kz-slip-cards">'+s.orders[s.cursor].filter(k=>!s.bound.includes(k)).map(k=>'<button class="zh-btn '+(s.piece===k?'is-picked':'')+' '+(s.assisted&&k===m.expected()?'kz-hint':'')+'" data-piece="'+k+'" aria-pressed="'+(s.piece===k)+'">'+E(q.pieces[Number(k.split('_')[1])])+'</button>').join('')+'</div><button class="zh-btn zh-btn--primary" data-commit '+(!s.piece?'disabled':'')+'>親綁入下一片竹簡</button>';
}
function play(kind){return(body,g)=>new Promise(resolve=>{
 const model=M[kind](g.getProgress()?.model,g.rng),s=model.s;let alive=true,raf=0,last=performance.now(),lastFrame=last,lastUi=last,bucket=Math.floor(s.elapsed/5),ui={},accrued=0;
 const hud=body.closest('.sty-game')?.querySelector('.sty-game__hud');
 const dock=()=>{if(hud)for(const node of [...document.body.children])if(node.matches('.zc-pop'))hud.appendChild(node);};
 const observer=new MutationObserver(dock);observer.observe(document.body,{childList:true});dock();
 const race=g.race?g.race({me:{journey:'見聞',hunger:'弟子之心',bamboo:'親編'}[kind],rival:{journey:'歲月',hunger:'飢餓',bamboo:'讀簡時限'}[kind],goal:'親自操作、讀報；首次與最佳分開'}):{me(){},rival(){}};
 const persist=()=>g.setProgress({model:model.snapshot()}),active=()=>!pause()&&!s.paused;
 function clock(){if(ui.index)ui.index.textContent=kind==='journey'?'見聞 '+s.visited.length+'／7':kind==='hunger'?'分糧 '+s.cursor+'／7':'編簡 '+s.bound.length+'／14';if(ui.clock)ui.clock.textContent=s.paused?'已暫停':s.assisted?'原分保留・不限時':['plan','report','intermission'].includes(s.phase)?'閱讀・停表':['done','failed'].includes(s.phase)?'本次結束':'剩 '+Math.ceil(s.left)+'秒'+(kind==='journey'&&s.phase==='event'?'・本站 '+Math.ceil(s.eventLeft)+'秒':'');if(ui.note)ui.note.textContent=s.note;if(ui.cart)ui.cart.setAttribute('transform','translate('+(s.pos[0]*40+20)+' '+(s.pos[1]*40+20)+')');const r=model.race();race.me(r.me);race.rival(r.rival);}
 function selected(attr){body.querySelectorAll('[data-'+attr+']').forEach(b=>{const picked=b.getAttribute('data-'+attr)===s[attr];b.classList.toggle('is-picked',picked);b.setAttribute('aria-pressed',String(picked));});const commit=body.querySelector('[data-commit]'),seal=body.querySelector('[data-seal]');if(commit)commit.disabled=kind==='journey'?!s.answer:kind==='hunger'?!s.task||!s.pupil||!s.topic:!s.piece;if(seal&&kind==='hunger')seal.disabled=!s.courier;clock();persist();}
 function paint(){if(!alive)return;const done=s.phase==='done',failed=s.phase==='failed',hadFocus=body.contains(document.activeElement);body.innerHTML='<div class="kz-game" data-kind="'+kind+'"><h2>'+TITLE[kind]+'</h2><div class="kz-live"><b data-index></b><span data-clock></span></div>'+(!done&&!failed?({journey:journeyBoard,hunger:hungerBoard,bamboo:bambooBoard}[kind])(model):'')+'<p class="kz-feedback" role="status" data-note></p>'+(done?'<p class="kz-follow">本次原分 '+s.first.score+'／10'+(s.assisted?'，必要操作已親做補足；原分保留。':'。')+'</p><button class="zh-btn zh-btn--primary" data-finish>交回挑戰成績</button>':'<div class="kz-help-row">'+(!failed?'<button class="zh-btn zh-btn--quiet" data-pause>'+(s.paused?'繼續操作':'暫停操作')+'</button>':'')+'<button class="zh-btn '+(failed?'zh-btn--primary':'zh-btn--quiet')+'" data-assist '+(s.assisted?'hidden':'')+'>協助補做・不限時</button></div>')+'</div>';ui={index:body.querySelector('[data-index]'),clock:body.querySelector('[data-clock]'),note:body.querySelector('[data-note]'),cart:body.querySelector('[data-cart]')};clock();if(hadFocus)(body.querySelector('[data-next],[data-finish],[data-seal]')||body.querySelector('button:not(:disabled):not([hidden])'))?.focus({preventScroll:true});persist();g.setStatus(done?'必要體驗完成':failed?'請親做補足':s.assisted?'原分保留・親做補足':'正在挑戰');}
 const blur=()=>{last=performance.now();accrued=0;persist();};
 const click=async e=>{if(!alive||pause())return;const b=e.target.closest('button');
 if(!b){const svg=e.target.closest('[data-ground]');if(svg&&kind==='journey'&&s.phase==='travel'&&!s.paused){const pt=new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse());model.move(Math.floor(pt.x/40),Math.floor(pt.y/40));clock();persist();}return;}if(b.disabled)return;
 if(b.hasAttribute('data-pause')){s.paused=!s.paused;last=performance.now();accrued=0;paint();return;}if(s.paused)return;
 if(b.hasAttribute('data-assist')){const ok=await ZH.modal({title:'不限時親自補做',body:'<p>提前協助原分0，超時保留當時分數。行路、事件處置、七回合分糧、求援準備與十四片編簡都仍須親做；提示不會代操作。</p>',actions:[{label:'繼續挑戰',value:false,kind:'quiet'},{label:'親自補做',value:true,kind:'primary'}]});last=performance.now();accrued=0;if(ok&&alive){model.assist();paint();}return;}
 if(b.hasAttribute('data-finish')){if(s.phase!=='done')return;persist();alive=false;resolve({...model.result(),sec:s.elapsed});return;}
 for(const n of ['answer','task','pupil','topic','courier','piece'])if(b.dataset[n]){model[n](b.dataset[n]);selected(n);g.sfx('click');return;}
 if(b.dataset.ration){model.ration(b.dataset.ration,Number(b.dataset.delta));paint();return;}
 if(b.dataset.target){model.target(b.dataset.target);clock();persist();return;}
 if(b.hasAttribute('data-begin'))model.begin();else if(b.hasAttribute('data-commit'))model.commit();else if(b.hasAttribute('data-next'))model.next();else if(b.hasAttribute('data-seal'))model.seal();else return;g.sfx('click');paint();};
 const frame=now=>{if(!alive)return;accrued+=active()?Math.min(.35,Math.max(0,(now-last)/1000)):0;last=now;if(now-lastFrame>=64){lastFrame=now;const dt=accrued;accrued=0;if(active()){if(model.advance(dt))paint();const nb=Math.floor(s.elapsed/5);if(nb!==bucket){bucket=nb;persist();}}}if(now-lastUi>=200){lastUi=now;clock();}raf=requestAnimationFrame(frame);};
 body.addEventListener('click',click);document.addEventListener('visibilitychange',blur);window.addEventListener('blur',blur);g.onCleanup(()=>{observer.disconnect();if(hud)for(const pop of [...hud.querySelectorAll('.zc-pop')])document.body.appendChild(pop);alive=false;cancelAnimationFrame(raf);body.removeEventListener('click',click);document.removeEventListener('visibilitychange',blur);window.removeEventListener('blur',blur);persist();});paint();raf=requestAnimationFrame(frame);
});}
async function challenge(ctx,id,kind,title,goal){const r=await ctx.minigame({id,title,goal,help:HELP,hideClock:true,skip:false,attempts:3},play(kind));if(!r.completed)throw Error('必要操作尚未完成，請接續親做補足。');ctx.state.vars[kind]={...copy(r),firstScore:firstScore(r),firstMax:(r.firstResult||r).max||10};await checkpoint();return r;}

n_18:async ctx=>{ctx.cast(['kongzi','yanhui']);await ctx.say([{who:'kongzi',expr:'serious',text:'回，吾道非邪？吾何為於此？'},{who:'yanhui',expr:'serious',text:'夫子之道至大，故天下莫能容。雖然，夫子推而行之，不容何病，不容然後見君子！'},{text:'顏回說道不修是自己的憂，道已修而不用則是有國者之憂。孔子欣然而笑：有是哉顏氏之子！'}]);await ctx.anchor('kz_08');ctx.unlock('person:cq_yanhui');ctx.add('dao',firstGood(ctx,'kz_08')?5:0);return 'n_19';},
n_19:async ctx=>{await scene(ctx,'chu','楚・求援得免','陳蔡困境之後',['kongzi','zigong','chuzhao']);await ctx.say([{text:'於是使子貢至楚。楚昭王興師迎孔子，然後得免。你先前親封的計畫在這裡回到原文行動，不讓糧食分數改成師生死亡或天下從此重用孔子。'},{who:'zigong',expr:'normal',text:'能交涉求援，也要說清楚我們所求。眼前得免，並不表示理想的難題全解了。'},{text:'現在回望陳蔡絕糧以前、去葉返蔡途中的一次問津。史記把長沮桀溺放在絕糧前，本話以回望比較他們與師生的選擇。'}]);return 'n_20';},
n_20:async ctx=>{await scene(ctx,'cai','回望・去葉返蔡的田野','陳蔡絕糧以前',['changju','jieni','zilu']);await ctx.chapter('第三幕　避世，還是與人同行','回望問津');await ctx.say([{text:'長沮、桀溺耦而耕，孔子使子路問津。津是渡口，耦是兩人並耕；他們卻先問坐車的人是誰。'},{who:'changju',expr:'serious',text:'是魯孔丘與？是知津矣。'},{who:'jieni',expr:'serious',text:'滔滔者天下皆是也，而誰以易之？'},{text:'桀溺不只是報一個渡口的位置，而是把問題轉到：這樣的天下還能由誰改變？'}]);await ctx.anchor('kz_09');return 'n_21';},
n_21:async ctx=>{await scene(ctx,'crossing','回望・渡口','子路告隱者之言',['kongzi','zilu']);await ctx.say([{who:'zilu',expr:'worried',text:'隱者說，與其跟避人之士，不如跟避世之士。他們耰而不輟，沒有停下覆種來告津。'},{text:'孔子憮然。你要表達的回應不是剝奪隱者的選擇，而是說清自己為何還願與人同行。'}]);await ctx.anchor('kz_10');await ctx.say([{who:'kongzi',expr:'serious',text:'鳥獸不可與同群，吾非斯人之徒與而誰與？天下有道，丘不與易也。'}]);ctx.unlock('person:cq_changjujieni');ctx.add('dao',firstGood(ctx,'kz_10')?5:0);return 'n_22';},
n_22:async ctx=>{await scene(ctx,'chu','楚地・接輿之歌','回到陳蔡之後的敘事',['jieyu','kongzi']);await ctx.say([{who:'jieyu',expr:'serious',text:'鳳兮鳳兮，何德之衰？往者不可諫，來者猶可追。已而，已而！今之從政者殆而！'},{text:'孔子下車想與他說話，接輿卻趨而去，未能交談。警語留下，遊戲不替二人編一場原典沒有的辯論。'}]);ctx.unlock('person:cq_jieyu');await scene(ctx,'study','魯・返鄉講學','前484年返魯・晚年',['kongzi','ranyou','yanhui']);await ctx.say([{text:'歲月又過。冉有仕魯，季康子終迎孔子；孔子歸魯。魯終不能用孔子，孔子亦不求仕。返鄉不是仕途勝利，教學與經籍仍可成為責任。'},{who:'kongzi',expr:'normal',text:'晚而喜《易》。讀易，韋編三絕。若再有數年，我仍願再學。'},{text:'下一關用《論語》名句練編簡與句義，並非把它們冒充孔子讀易散落的原簡。'}]);return 'n_23';},
n_23:async ctx=>{const r=await challenge(ctx,'wen_kz_weibian','bamboo','韋編三絕・親編與深讀','三輪親綁十四片，讀每句之義，最後親綁好簡冊；相同文字竹簡可互換。');ctx.add('dao',firstScore(r)*2-8);ctx.unlock('idiom:weibiansanjue');return 'n_24';},
n_24:async ctx=>{await ctx.say([{text:'史記將孔子晚年的經籍教學與作春秋相連。記事有取捨，文字有褒貶；有人由此理解他的志，有人也可能因此責難。這是古典傳統的記述，不把經籍形成簡化成一人一時獨作。'},{who:'kongzi',expr:'serious',text:'後世知丘者以春秋，而罪丘者亦以春秋。'}]);await ctx.anchor('kz_11');return 'n_25';},
n_25:async ctx=>{await scene(ctx,'temple','魯・仲尼廟堂','數百年後・太史公適魯',['shiguan']);await ctx.chapter('尾聲　布衣，何以不隨一世之榮而消失','視角轉為後世史家');await ctx.say([{who:'shiguan',expr:'serious',text:'余讀孔氏書，想見其為人。'},{text:'太史公適魯，觀孔子的廟堂、車服、禮器，見諸生以時習禮，流連而不能去。眼前不再是你駕車的古道，而是後世讀書與習禮的人。'},{who:'shiguan',expr:'normal',text:'天下君王至於賢人，當時榮而身後止；孔子是布衣，傳十餘世，學者仍宗之。'},{text:'中國言六藝者折中於夫子。這裡六藝指詩、書、禮、樂、易、春秋；不是把禮樂射御書數的六藝名目套到這一句。'}]);return 'n_26';},
n_26:async ctx=>{await ctx.say([{who:'shiguan',expr:'serious',text:'《詩》有之：「高山仰止，景行行止。」雖不能至，然心鄉往之。'},{text:'身為國文課裡的玩家，你既走過路，也要讀懂這一段向往。敬仰與理想，不必要求自己已經完全達到才可以開始。'}]);await ctx.anchor('kz_12');ctx.unlock('idiom:gaoshanyangzhi');ctx.unlock('text:kongzishijiazan');const v=await choice(ctx,'principle',{title:'回看子貢、顏回與隱者，你怎樣整理自己的想法？',text:'可以保留不同選擇；此處評能否說明道、做法與代價，不指定所有人只有一種人生。',options:[{label:'辨所守的原則與可調整的做法，正視同伴需要，理解避世者的憂慮。',value:'reason'},{label:'把未被接納全算成他人的罪，所有人的疑問都不必聽。',value:'dismiss'}]});ctx.add('heart',v==='reason'?5:-10);return 'n_27';},
n_27:async ctx=>{await ctx.say([{who:'shiguan',expr:'normal',text:'可謂至聖矣。這是太史公對孔子後世影響的贊語；本局結局標題只評你的閱讀與照護，不把高分當作你已是聖人。'}]);const key=ctx.meter('heart')<30?'bad':ctx.meter('dao')>=70&&ctx.meter('heart')>=70?'great':'good';return ctx.end(ENDINGS[key]);}
};
const ENDINGS={great:{key:'great',title:'可謂至聖',text:'你能連起所守之道、同伴需要與原文，也完成三項親做體驗。這個標題借太史公的贊語評本局學習，不是替玩家封聖，亦不讓歷史變成諸侯都重用孔子。',good:true},good:{key:'good',title:'知其不可而為之',text:'三項必要體驗已親做。再挑一次首次抉擇：困境中如何改做法、照顧人，同時不丟掉想守的原則？理想與現實還值得繼續問。',good:true},bad:{key:'bad',title:'陳蔡之厄',text:'你已親做補足，不必抹去曾有的錯判。回看一回合配糧或一句辭令，說明忽略了誰的需要。此評語是本局的反思提醒；史實仍是子貢求援、師生得免、孔子返魯講學。',good:false}};
function payload(s,ending){const a=s.vars.journey.firstScore,b=s.vars.hunger.firstScore,c=s.vars.bamboo.firstScore;const virtue=Math.round((Number(s.vars.choices.companions==='share')+Number(s.vars.choices.rest==='care')+Number(s.vars.choices.principle==='reason')+Number(firstGood(game.ctx,'kz_02'))+Number(firstGood(game.ctx,'kz_10')))*20);return{scenarioId:SID,chapterVersion:VERSION,runId:s.vars.runId,mode:MODE,faction:'魯',country:'魯',role:'孔子',roleKind:'shijia',bioTitle:'孔子世家',bioOpening:'孔子生魯昌平鄉陬邑。',ending,scoreStrategy:Math.round(a*3+b*4+c*3),scoreVirtue:virtue,turns:s.steps,durationSec:Math.min(5400,Math.round((Date.now()-s.startedAt)/1000)),deeds:['回望適周問禮老子，以完整鳥魚獸龍之喻對讀敬服。','讀季桓子受女樂、廢政與失禮，扮孔子作離魯判斷。','親駕車沿道訪衛匡宋鄭、抵陳，處理見聞讀報，首次'+a+'分；路線為示意。','讀子畏於匡、桓魋威脅、鄭東郭失散與喪家之狗，不把使命自信當神力。','親做七回合分糧、派工與談話，備子貢求援，首次'+b+'分；數量與七回合為推演。','讀子路慍見、君子固窮，分清守道與忽略飢餓；以同一問題比較三位弟子。','讀子貢少貶與顏回不容見君子，子貢赴楚，楚昭王迎孔子得免。','回望絕糧以前長沮桀溺耦耕、子路問津，扮孔子回應避世。','讀接輿鳳歌、未能對談；前484年返魯講學，晚而喜易。','以非本話錨點的三則論語親編十四片，讀義，首次'+c+'分；不冒充讀易原簡。','讀作春秋之知與罪，轉到數百年後太史公適魯，以高山仰止理解後世敬仰。'],anchors:copy(s.anchors),games:copy(s.games),codex:s.codex.slice(),opener:'遊戲史官評語（自擬）：孔子生魯昌平鄉陬邑。適周問禮於老子，猶龍之歎，見求學者能敬前輩；及為魯大司寇，女樂入而政事廢，郊又不致膰俎，遂行。周流列國，匡有誤認之圍，宋有桓魋之威，鄭有東郭失散之困；坦然自笑，不以一時失所自棄。陳蔡之間，不得行，絕糧，從者病而莫興，講誦弦歌不衰。子路問君子亦有窮乎，子貢問道大而莫容，顏回言不容然後見君子；同一困境，三種思考，不可只用忠與不忠判盡。其後使子貢至楚，楚昭王興師迎之，然後得免。回望問津，長沮桀溺欲避世，孔子仍與斯人之徒同行；接輿鳳歌以從政之殆為戒，未及與語。返魯，不求仕，晚而喜易；韋編三絕，勤讀亦須思。作春秋，寄義於史事取捨，後世由之知丘，亦可能由之罪丘。至太史公讀孔氏書、適魯觀廟，想見其人，雖不能至而心鄉往之。此局道路、糧袋、七回合與論語編簡為親做推演，分數只記閱讀與照護。道不可徒言，人不可不顧，困境可以提問，理想也須在同行中承擔。',prompts:['子貢說「少貶焉」，顏回說「不容然後見君子」。你較認同誰，或如何結合？引原文，連到一次本站處置或配糧的首次選擇，分清所守原則與可改做法。','長沮桀溺勸避世，孔子說「吾非斯人之徒與而誰與」。比較兩方對亂世的憂慮、責任與代價；引用問津原文，不只用勇敢或懶惰貼標籤。','如果理想一直不被接受，你會怎樣同行、求援或重新學習？引「君子固窮」、韋編三絕或「心鄉往之」，連到一次親做操作，說明改進，不把分數當歷史成敗。'],experience:{firstAnchors:copy(s.vars.firstAnchors),journey:copy(s.vars.journey),hunger:copy(s.vars.hunger),bamboo:copy(s.vars.bamboo),decisions:copy(s.vars.choices)}};}
async function onEnd(r,ctx){const s=ctx.state;if(ORDER.some(id=>!s.anchors.some(a=>a.anchorId===id))||['kz_zhouyou','kz_jueliang','wen_kz_weibian'].some(id=>!s.games.some(g=>g.gameId===id&&!g.skipped))||['journey','hunger','bamboo'].some(k=>!s.vars[k]?.completed)||CODEX_KEYS.some(id=>!s.codex.includes(id)))throw Error('必要體驗或對讀尚未完成，請接續本話。');const ending=ENDINGS[r.key]||ENDINGS.good,p=s.vars.finishPayload||payload(s,ending);await ctx.banner(ending.title,'孔子世家・本局評語');await ctx.say([{text:ending.text},{who:'shiguan',expr:'serious',text:'到結算用原文與一次首次操作完成反思。你的列傳會保留首次、最佳與補做；大地圖的章節回程沿用平台設定。'}]);if(s.vars.submitted){ZH.session.set('result:'+SID,p);ZH.go('result',{s:SID});return;}s.vars.finishPayload=p;await checkpoint();await journal.flush();ZH.finishScenario(p);s.vars.submitted=true;await checkpoint();}
async function start(saved){if(loading)return;loading=true;ROOT.innerHTML='';const ageNode=Number((saved?.node||'n_01').slice(2));age(ageNode<3?'young':ageNode>=22?'late':'middle');game=ZH.story.create(ROOT,{id:SID,mode:MODE,title:'孔子周遊',subtitle:'周遊列國的老師，在陳蔡斷糧了',seed:Number(params.seed)||0,start:'n_01',characters:CHARACTERS,scenes:SCENES,nodes:NODES,meters:[{id:'dao',label:'道',icon:'scroll',max:100,start:60},{id:'grain',label:'糧',icon:'grain',max:100,start:60},{id:'heart',label:'弟子之心',icon:'people',max:100,start:60}],help:HELP,anchorOrder:ORDER,anchorTotal:12,anchorRunner,snapshot,save,onProgress:save,onEnd,initState:()=>({vars:{schema:SCHEMA,runId:'kz_'+Date.now().toString(36)+'_'+crypto.getRandomValues(new Uint32Array(1))[0].toString(36),firstAnchors:{},choices:{}}})});window.__ep=game;loading=false;game.start(saved||null);}
function title(saved){const compatible=saved?.vars?.schema===SCHEMA,st=compatible?saved:null;ROOT.innerHTML='<main class="kz-title"><div class="kz-title-bar"><span class="kz-kicker">春秋篇・第十五話・周遊至返魯</span><button class="zh-btn zh-btn--quiet" data-home>回首頁</button></div><header><h1>孔子周遊</h1><p class="kz-subtitle">周遊列國的老師，在陳蔡斷糧了</p></header><div class="kz-title-scene">'+panorama('road',['zilu','kongzi','zigong','yanhui'])+'</div><section class="kz-start"><div class="kz-seal">道</div><div><h2>你・孔子・與弟子同行</h2><p class="kz-note">親駕車、分糧與談話、編簡與深讀，以孔子的身分做決定。</p></div><div class="kz-start-actions">'+(st?'<button class="zh-btn zh-btn--primary" data-continue>接續這一局</button>':'')+'<button class="zh-btn '+(st?'zh-btn--quiet':'zh-btn--primary')+'" data-new>'+(st?'重新開始':'開始遊戲')+'</button></div></section><section class="kz-points"><div><b>古道上的見聞</b><p class="kz-note">沿道帶隊，親處置各站線索，辨明實際危險與使命。</p></div><div><b>困境中的同行</b><p class="kz-note">七回合有限糧，照護弟子，聽三種回答，備求援。</p></div><div><b>仍願重新學習</b><p class="kz-note">三輪竹簡親編讀義，理解後世的高山仰止。</p></div></section>'+(saved&&!compatible?'<p class="kz-follow">偵測到不同版本進度。新版另開一局，已登錄成績與史冊保留。</p>':'')+'<p class="kz-note">預留約25—35分鐘。二十七節點、十二段原文、十二項圖鑑、三項必要體驗。卡關可不限時親做；遊戲示意與史實會明示區分。</p></main>';ROOT.querySelector('[data-home]').onclick=()=>ZH.go('hub');const cont=ROOT.querySelector('[data-continue]');if(cont)cont.onclick=()=>start(st);ROOT.querySelector('[data-new]').onclick=async()=>{if(loading)return;if(saved){const ok=await ZH.modal({title:'另開一局？',body:'<p>本話未完成的進度會清除，已登錄成績與史冊保留。</p>',actions:[{label:'取消',value:false,kind:'quiet'},{label:'重新開始',value:true,kind:'primary'}]});if(!ok)return;await journal.clear();}start(null);};}
