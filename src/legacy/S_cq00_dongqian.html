 if(s.phase==='plan')return paper('先派三位護送者','各守不同一段。先讀六段斥候：暴露段最好有護兵，較穩段可保留兵力。')+'<div class="dq-allies">'+Object.entries(M.ALLIES).map(([k,a])=>'<section><button class="zh-btn '+(s.selected===k?'is-picked':'')+'" data-select="'+k+'" aria-pressed="'+(s.selected===k)+'"><span class="dq-ally-portrait">'+portrait(a.character)+'</span><b>'+a.name+'</b><span>'+(s.allies[k]===undefined?'待派':(s.allies[k]+1)+'段')+'</span></button><button class="zh-btn zh-btn--quiet" data-recall="'+k+'" '+(s.allies[k]===undefined?'disabled':'')+'>收回</button></section>').join('')+'</div>'+routeSvg(s)+'<div class="dq-legs">'+s.risks.map((risk,i)=>'<button class="zh-btn '+(s.assisted&&risk===3?'dq-hint':'')+'" data-deploy="'+i+'"><b>'+ (i+1)+'段・'+E(M.PLACES[i])+'</b><span>'+ (risk===3?'暴露・追騎易逼近':'較穩・斥候未見逼近')+'</span><span>'+ (m.guard(i)?M.ALLIES[m.guard(i)].name:'尚未派兵')+'</span></button>').join('')+'</div>'+cards+'<button class="zh-btn zh-btn--primary" data-begin '+(!m.full()?'disabled':'')+'>三位已親派，開始東遷</button><p class="dq-note">讀圖與部署停表，開始後70秒額度含操作與行軍；山路12秒、平路6秒。</p>';
 const exposed=s.risks[s.cursor]===3,ally=m.guard(s.cursor),hint=exposed&&!ally?'hill':'plain';return routeSvg(s)+cards+paper('第'+(s.cursor+1)+'段・'+M.PLACES[s.cursor],(exposed?'斥候：平路暴露，追騎容易逼近。':'斥候：平路較穩，未見逼近的追騎。')+(ally?' '+M.ALLIES[ally].name+'在本段掩護。':' 本段沒有派護兵。'))+'<div class="dq-road-options">'+[['plain','平路','6秒；快，暴露段無護兵會失序。'],['hill','山路','12秒；有山勢遮護，速度較慢。']].map(([v,t,n])=>'<button class="zh-btn '+(s.route===v?'is-picked':'')+' '+(s.assisted&&v===hint?'dq-hint':'')+'" data-route="'+v+'" aria-pressed="'+(s.route===v)+'"><b>'+t+'</b><span>'+n+'</span></button>').join('')+'</div><button class="zh-btn zh-btn--primary" data-escort '+(!s.route?'disabled':'')+'>親下第'+(s.cursor+1)+'道押車令</button>'+(s.assisted?'<p class="dq-follow">提示：'+(hint==='plain'?'本段有護兵或風險較穩，可走平路。':'此段暴露且無護兵，可走山路。')+'仍須親選路與押車。</p>':'');}
function play(kind){return(body,g)=>new Promise(resolve=>{
 const model=M[kind](g.getProgress()?.model,g.rng),s=model.s;let alive=true,raf=0,last=performance.now(),lastFrame=last,lastUi=last,bucket=Math.floor(s.elapsed/5),ui={};
 const race=g.race?g.race({me:kind==='fenghuo'?'烽火信號':'周室車隊',rival:kind==='fenghuo'?'犬戎騎兵・第三輪':'犬戎追兵',goal:kind==='fenghuo'?'親傳信號・援兵不至':'六段東行・三位護送'}):{me(){},rival(){}};
 const persist=()=>g.setProgress({model:model.snapshot()}),active=()=>!pause()&&!s.paused;
 function signal(){if(!ui.ring)return;const p=s.assisted?.7:Math.min(1,s.pulse),r=54-28*p;ui.ring.setAttribute('r',r);ui.ring.setAttribute('stroke',model.ready()?'#ffe294':'#91b8b2');if(ui.signal)ui.signal.textContent=s.phase==='plan'?'準備・停表':model.ready()?'金環合攏，現在接力':'等火勢合攏';}
 function clock(){if(ui.index)ui.index.textContent=kind==='fenghuo'?'烽火 '+(s.round+1)+'／3輪':'護送 '+s.cursor+'／6段';if(ui.clock)ui.clock.textContent=s.paused?'已暫停':s.assisted?'原分保留・不限時':['plan','event'].includes(s.phase)?'準備／軍報・停表':['done','failed'].includes(s.phase)?'本次結束':'剩 '+Math.ceil(s.left)+'秒'+(kind==='dongqian'?'行軍額度':'');if(ui.note)ui.note.textContent=s.note;signal();const r=model.race();race.me(r.me);race.rival(r.rival);}
 function paint(){if(!alive)return;const done=s.phase==='done',failed=s.phase==='failed',hadFocus=body.contains(document.activeElement);body.innerHTML='<div class="dq-game" data-kind="'+kind+'"><h2>'+ (kind==='fenghuo'?'烽火連城・守臺接力':'東遷之路・親派與押車')+'</h2><div class="dq-live"><b data-index></b><span data-clock></span></div>'+(!done&&!failed?(kind==='fenghuo'?beaconBoard(model):escortBoard(model)):'')+'<p class="dq-feedback" role="status" data-note></p>'+(done?'<p class="dq-follow">本次原分 '+s.first.score+'／10'+(s.assisted?'，必要操作已親做補足；原分保留。':'。')+'</p><button class="zh-btn zh-btn--primary" data-finish>交回挑戰成績</button>':'<div class="dq-help-row">'+(!failed?'<button class="zh-btn zh-btn--quiet" data-pause>'+ (s.paused?'繼續操作':'暫停操作')+'</button>':'')+'<button class="zh-btn '+(failed?'zh-btn--primary':'zh-btn--quiet')+'" data-assist '+(s.assisted?'hidden':'')+'>協助補做・不限時</button></div>')+'</div>';ui={index:body.querySelector('[data-index]'),clock:body.querySelector('[data-clock]'),note:body.querySelector('[data-note]'),ring:body.querySelector('[data-ring]'),signal:body.querySelector('[data-signal]')};clock();if(hadFocus)(body.querySelector('[data-next],[data-finish],[data-escort]:not(:disabled)')||body.querySelector('button:not(:disabled):not([hidden])'))?.focus({preventScroll:true});persist();g.setStatus(done?'必要體驗完成':failed?'請親做補足':s.assisted?'原分保留・親做補足':'正在挑戰');}
 const click=async e=>{if(!alive||pause())return;const b=e.target.closest('button');if(!b||b.disabled)return;if(b.hasAttribute('data-pause')){s.paused=!s.paused;last=performance.now();paint();return;}if(s.paused)return;
 if(b.hasAttribute('data-assist')){const ok=await ZH.modal({title:'不限時親自補做',body:'<p>提前協助原分0；失敗後原分保留。仍須親做三輪接力、親派三位護送者並下六道押車令。提示不代按，必要體驗不略過。</p>',actions:[{label:'繼續挑戰',value:false,kind:'quiet'},{label:'親自補做',value:true,kind:'primary'}]});last=performance.now();if(ok&&alive){model.assist();paint();}return;}
 if(b.hasAttribute('data-finish')){if(s.phase!=='done')return;persist();alive=false;resolve({...model.result(),sec:s.elapsed});return;}
 for(const n of ['light','select','deploy','recall','route','escort','next','begin'])if(b.hasAttribute('data-'+n)){const changed=model[n](b.getAttribute('data-'+n));if(changed)g.sfx('click');paint();return;}};
 const blur=()=>{last=performance.now();persist();};body.addEventListener('click',click);document.addEventListener('visibilitychange',blur);window.addEventListener('blur',blur);
 function frame(now){if(!alive)return;raf=requestAnimationFrame(frame);if(now-lastFrame<32)return;lastFrame=now;const dt=Math.max(0,Math.min(.25,(now-last)/1000));last=now;if(!active())return;const phase=s.phase;model.advance(dt);if(s.phase!==phase)paint();else{if(kind==='fenghuo')signal();if(now-lastUi>=200){lastUi=now;clock();}}const next=Math.floor(s.elapsed/5);if(next!==bucket){bucket=next;persist();}}

 });}
async function challenge(ctx,id,kind,title,goal){const r=await ctx.minigame({id,title,goal,help:HELP,hideClock:true,skip:false,attempts:3},play(kind)),first=r.firstResult||r;if(!r.completed)throw Error('必要操作尚未完成，請接續親做補足。');ctx.state.vars[kind]=copy({...r,firstScore:first.score,firstMax:first.max});return r;}

function payload(s,ending){const a=s.vars.fenghuo.firstScore,b=s.vars.dongqian.firstScore,virtue=Number(s.vars.choices.refuge==='care')+Number(s.vars.choices.alarm==='account')+Number(s.vars.choices.alliance==='cooperate')+Number(firstGood(game.ctx,'dq_05'))+Number(firstGood(game.ctx,'dq_09'));return{scenarioId:SID,chapterVersion:VERSION,runId:s.vars.runId,mode:MODE,faction:'周',country:'周',role:'周平王',roleKind:'benji',bioTitle:'周本紀・平王',bioOpening:'周平王宜臼，幽王之太子也。',ending,scoreStrategy:Math.round(a*4+b*6),scoreVirtue:virtue*20,turns:s.steps,durationSec:Math.min(5400,Math.round((Date.now()-s.startedAt)/1000)),deeds:['幽王二年三川皆震，對讀伯陽甫的災異觀與亡國警告。','扮宜臼，經廢太子、出奔申國，親選如何安頓隨行者。','暫扮戍卒，親做三輪烽火，首次'+a+'分；前兩次假警報失信，第三次援軍旗位空白。','前771年西周亡，諸侯共立宜臼為平王，以奉周祀。','前770年東遷推演：親派秦、晉、鄭，六次選路與押車，首次'+b+'分。','對讀秦襄公救周受封、賜地逐戎條件，以及晉鄭輔周。','回望政由方伯，對照《史記》與清華簡；前722年《春秋》開始記事。'],anchors:copy(s.anchors),games:copy(s.games),codex:s.codex.slice(),opener:'遊戲史官評語（自擬）：余讀周紀，見烽火能傳，而信用不可徒恃其器。幽王廢立失和，又數舉假警，及真寇至而兵不赴，周祀幾絕。宜臼立為平王，東遷雒邑，秦有救送之功，晉鄭相依；天子之名尚在，天下之政漸出方伯。是局觀其安人、求援與護送，不以手速定德。傳世與出土記載異同，亦當並讀，不因一書有無便盡斷古事。',prompts:['假警報如何消耗信用？引用「其後不信」或「兵莫至」，結合一次接力與軍報，說明信號傳到與人願意赴援的差別，再舉一個生活例子。','《史記》有烽火故事，清華簡《繫年》未記這個情節。你會如何比對史料？說明尚能提出的問題，不以未記載直接證成未發生。','東遷延續王統，卻「政由方伯」。結合一次派兵、選路或安民選擇，說明名位、實力與合作之間的關係。'],experience:{firstAnchors:copy(s.vars.firstAnchors),fenghuo:copy(s.vars.fenghuo),dongqian:copy(s.vars.dongqian),decisions:copy(s.vars.choices)}};}
