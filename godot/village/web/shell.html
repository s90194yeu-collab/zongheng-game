<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>問鼎書院</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f0e3}canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;outline:none}#status[hidden]{display:none}#status{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:#29483e;font:16px/1.8 system-ui}progress{width:220px;accent-color:#5c8875}button{padding:12px;border:1px solid #a88d58;border-radius:8px;background:#fff8e7;color:#29483e}</style>$GODOT_HEAD_INCLUDE</head><body><canvas id="canvas" tabindex="0" aria-label="Godot博物館村立體遊戲畫面">此瀏覽器無法顯示遊戲。</canvas><div id="status"><p id="notice">正在準備書院……</p><progress id="progress"></progress><button id="retry" hidden>重新載入遊戲</button></div>
<script>
(()=>{'use strict';const channel=new URLSearchParams(location.hash.slice(1)).get('channel');let origin=null,callback=null,pending=null;const trusted=o=>/^https:\/\/(?:[a-z0-9-]+[-.])?script\.googleusercontent\.com$/.test(o)||o==='https://script.google.com'||o==='https://s90194yeu-collab.github.io'||/^http:\/\/(127\.0\.0\.1|localhost):\d+$/.test(o);function emit(value){if(origin&&channel&&parent!==window)parent.postMessage({protocol:'zh-godot-v1',channel,...value},origin);}window.ZH_GODOT={register(fn){callback=fn;if(pending)callback(JSON.stringify(pending));},emit(json){try{const value=JSON.parse(json);if(value.type==='ready')document.querySelector('#status').hidden=true;emit(value);}catch{}}};window.addEventListener('message',event=>{const value=event.data;if(event.source!==parent||!trusted(event.origin)||!value||value.protocol!=='zh-godot-v1'||value.channel!==channel)return;if(origin&&event.origin!==origin)return;origin=event.origin;if(value.type==='init')pending=value;if(callback)callback(JSON.stringify(value));});window.addEventListener('contextmenu',event=>event.preventDefault());window.addEventListener('pagehide',()=>{callback=null;pending=null;});window.ZH_GODOT_STATUS=(type,message,current,total)=>{const text=document.querySelector('#notice');text.textContent=message;if(type==='error')document.querySelector('#retry').hidden=false;const bar=document.querySelector('#progress');if(total>0){bar.max=total;bar.value=current;}emit({type,message,current,total});};document.querySelector('#retry').onclick=()=>location.reload();})();
</script><script src="$GODOT_URL"></script><script>
const config=$GODOT_CONFIG;const engine=new Engine(config);const missing=Engine.getMissingFeatures({threads:false});if(missing.length){ZH_GODOT_STATUS('error','這個瀏覽器目前無法啟動立體村莊，可返回使用原村莊。');}else engine.startGame({canvas:document.querySelector('#canvas'),onProgress(current,total){ZH_GODOT_STATUS('loading',total>0?'正在載入書院 '+Math.round(current/total*100)+'%':'正在整理角色與場景……',current,total);}}).then(()=>{document.querySelector('#status').hidden=true;}).catch(error=>{console.error(error);ZH_GODOT_STATUS('error','村莊暫時無法開啟，請重新載入或返回。');});
</script></body></html>
